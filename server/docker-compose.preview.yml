#
# The preview deployment (decisions PV-*; server/README.md "Preview deployment", docs/runbooks/preview-server.md):
# docker-compose.yml without Caddy, for a site served through a Cloudflare Tunnel that runs OUTSIDE Docker (on the
# maintainer's Windows host, as a service). Used through server/preview/preview.sh, which keeps the settings and
# secrets outside the repository (~/atalaia-preview):
#   docker compose --env-file ~/atalaia-preview/preview.env -f docker-compose.yml -f docker-compose.preview.yml ...
#
# What changes from the production file:
# - Caddy is not started (profile "caddy"): Cloudflare terminates TLS; cloudflared forwards plain HTTP to
#   http://localhost:8000 on the host, which is this server's published port.
# - The server runs with ATALAIA_PREVIEW=on (banner, noindex, feedback form, landing page) and is published on
#   127.0.0.1 ONLY (ATALAIA_PREVIEW_PORT, default 8000). Windows reaches it as localhost:8000 through WSL2's
#   localhost forwarding. The ATAK relay port of the production file is dropped. Nothing listens on 0.0.0.0.
# - The client's address: Cloudflare appends the real address to X-Forwarded-For (and sets X-Forwarded-Proto
#   https). The tunnel's connection reaches the server from the gateway of the "atak" network (the only one that
#   publishes the port, with a fixed subnet and no outbound NAT), and the server trusts forwarded headers from that
#   subnet only (FORWARDED_ALLOW_IPS): uvicorn takes the right-most address that is not on it, which is what
#   Cloudflare saw, never what a client typed into the header. (Production's Caddy does the same job by replacing
#   the header.) A process on this machine can still send its own header to 127.0.0.1:8000: the preview's
#   per-address limits are not a defence against the machine's own user.
# - `demo-refresh` loads the demo data every hour (python -m atalaia_server demo load): the finished game
#   stays "recent" on the scoreboard and the scheduled games move to the coming Saturdays.
# - The live demo (decisions DEMO-*; docs/runbooks/preview-server.md "The live demo"): `demo-field` is a field
#   controller playing a looping game with simulated Field Boxes, behind a read-only proxy that is published on
#   127.0.0.1 ONLY (ATALAIA_DEMO_PORT, default 8001); a second Cloudflare Tunnel hostname forwards to it. It is on a
#   network of its own with no outbound NAT, and on an internal network shared with the server alone, through which
#   it syncs its games to the live demo field (`demo-refresh` makes that field and its API key). `demo-init` only
#   gives the volume that carries the key to the services that use it.
# Every service restarts unless stopped, so the preview comes back after a reboot of Docker.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    profiles: ["caddy"]

  server:
    environment:
      ATALAIA_PREVIEW: "on"
      # Portuguese unless a visitor chooses (?lang= or the switcher, remembered in a cookie): decision PV-9.
      ATALAIA_LANG_FROM_BROWSER: "${ATALAIA_LANG_FROM_BROWSER:-off}"
      ATALAIA_DEFAULT_LANG: "${ATALAIA_DEFAULT_LANG:-pt}"
      FORWARDED_ALLOW_IPS: "${ATALAIA_PREVIEW_SUBNET:-172.29.89.0/24}"
      ATALAIA_PREVIEW_DEMO_URL: "${ATALAIA_DEMO_PUBLIC_URL:-}"
    ports: !override
      - "127.0.0.1:${ATALAIA_PREVIEW_PORT:-8000}:8000"
    networks: [demo-sync]

  demo-refresh:
    image: ${ATALAIA_SERVER_IMAGE:-atalaia-server}
    # `demo load` every hour (the made-up field stays "recent"); `demo live` every ten minutes: the live demo's
    # field and API key (made once, written to /secrets/sync-key) and the clean-up of its old games.
    entrypoint: ["sh", "-c", "n=0; while true; do if [ $$((n % 6)) -eq 0 ]; then python -m atalaia_server demo load || true; fi; python -m atalaia_server demo live --key-out /secrets/sync-key || true; n=$$((n + 1)); sleep 600; done"]
    environment:
      ATALAIA_DATABASE_URL: "postgresql+asyncpg://atalaia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (server/setup.sh)}@postgres:5432/atalaia"
      ATALAIA_SECRET_KEY: "${ATALAIA_SECRET_KEY:?set ATALAIA_SECRET_KEY (server/setup.sh)}"
      ATALAIA_PREVIEW: "on"
    networks: [db]
    healthcheck:
      disable: true   # the image's own checks the web server on port 8000, which this one is not
    volumes:
      - demo-secrets:/secrets
    depends_on:
      server:
        condition: service_healthy
      demo-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Gives the volume that carries the live demo's API key to the user the server's image and the demo's image share
  # (10001); runs once, with no network, and stops.
  demo-init:
    image: ${ATALAIA_SERVER_IMAGE:-atalaia-server}
    user: "0"
    entrypoint: ["sh", "-c", "chmod 700 /secrets && chown 10001:10001 /secrets"]
    volumes:
      - demo-secrets:/secrets
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *logging

  demo-field:
    image: ${ATALAIA_DEMO_IMAGE:-atalaia-demo}
    build:
      context: ..
      dockerfile: server/preview/demo/Dockerfile
    environment:
      DEMO_READ_TOKEN: "${ATALAIA_DEMO_READ_TOKEN:-atalaia-demo}"
      DEMO_SITE_URL: "${ATALAIA_PUBLIC_URL:-}"
      DEMO_SYNC_TARGET: "server:8000"
      DEMO_SYNC_KEY_FILE: /secrets/sync-key
      DEMO_LOBBY_S: "${ATALAIA_DEMO_LOBBY_S:-25}"
      DEMO_GAME_S: "${ATALAIA_DEMO_GAME_S:-240}"
      DEMO_PAUSE_S: "${ATALAIA_DEMO_PAUSE_S:-60}"
      DEMO_RESTART_AFTER_GAMES: "${ATALAIA_DEMO_RESTART_AFTER_GAMES:-24}"
    ports:
      - "127.0.0.1:${ATALAIA_DEMO_PORT:-8001}:8001"
    volumes:
      - demo-data:/data
      - demo-secrets:/secrets:ro
    networks: [demo, demo-sync]
    depends_on:
      server:
        condition: service_healthy
      demo-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    cpus: 1.5
    restart: unless-stopped
    logging: *logging

networks:
  atak:
    ipam:
      config:
        - subnet: "${ATALAIA_PREVIEW_SUBNET:-172.29.89.0/24}"
  # The live demo's published port: no outbound NAT, as "atak" (see the top of docker-compose.yml).
  demo:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: "${ATALAIA_DEMO_SUBNET:-172.29.90.0/24}"
  # The demo's sync to the site server: the two of them only, no way out.
  demo-sync:
    internal: true

volumes:
  demo-data:
  demo-secrets:
