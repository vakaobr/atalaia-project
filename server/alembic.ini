#
# Alembic for the site server (ADR-P4-1). Run from server/:
#   alembic upgrade head        alembic downgrade base        alembic check
# The database comes from ATALAIA_DATABASE_URL (migrations/env.py); there is
# deliberately no sqlalchemy.url here, so no password is ever written down.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
