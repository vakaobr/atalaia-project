#
# The site server's tests against an ephemeral PostgreSQL 16 (decision P4R17).
# Use it through tools/docker_server.py (test, migrations), which picks a
# project name, runs `sh tests/run.sh ...` in the tests service and removes
# everything afterwards. The database lives in a tmpfs: nothing survives.
# CI's server job runs the same image and commands against a service container.

services:
  db:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: atalaia
      POSTGRES_PASSWORD: atalaia-test
      POSTGRES_DB: atalaia
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atalaia -d atalaia"]
      interval: 1s
      timeout: 5s
      retries: 60

  tests:
    image: ${ATALAIA_SERVER_TEST_IMAGE:-atalaia-server-test}
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: test
    environment:
      ATALAIA_DATABASE_URL: postgresql+asyncpg://atalaia:atalaia-test@db:5432/atalaia
    depends_on:
      db:
        condition: service_healthy
