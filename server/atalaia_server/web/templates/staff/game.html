<p><a id="back" href="$history_href">$game_back</a></p>
<h1 id="game-name">$game_title</h1>
<p id="delayed" class="notice" hidden></p>
<section aria-labelledby="summary-title">
<h2 id="summary-title" class="visually-hidden">$game_summary</h2>
<dl id="summary" class="details"></dl>
<div class="table-wrap">
<table id="teams" class="data scores-table">
<thead><tr><th scope="col">$team</th><th scope="col" class="num">$score</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>
<section aria-labelledby="timeline-title">
<h2 id="timeline-title">$timeline_title</h2>
<p class="hint">$timeline_intro</p>
<div id="chart" class="chart"></div>
<p id="timeline-none" hidden>$timeline_none</p>
<details id="timeline-details" hidden>
<summary>$timeline_table</summary>
<div class="table-wrap">
<table id="timeline" class="data"><thead></thead><tbody></tbody></table>
</div>
</details>
</section>
<section aria-labelledby="log-title">
<h2 id="log-title">$log_title</h2>
<form id="log-filters" class="staff-form inline" method="post" novalidate>
<fieldset disabled>
<legend>$filters</legend>
<div class="row">
<label for="l-type">$log_type</label>
<select id="l-type" name="type"><option value="">$filter_any</option></select>
</div>
<div class="row">
<label for="l-team">$log_team</label>
<select id="l-team" name="team"><option value="">$filter_any</option></select>
</div>
<div class="row">
<label for="l-from">$log_from</label>
<input id="l-from" name="from" type="number" min="0" step="1">
</div>
<div class="row">
<label for="l-to">$log_to</label>
<input id="l-to" name="to" type="number" min="0" step="1">
</div>
<button type="submit">$apply</button>
</fieldset>
</form>
<div class="table-wrap">
<table id="log" class="data" hidden>
<thead><tr><th scope="col">$col_time</th><th scope="col">$col_type</th><th scope="col">$col_team</th><th scope="col">$col_node</th><th scope="col">$col_data</th></tr></thead>
<tbody></tbody>
</table>
</div>
<p id="log-none" hidden>$log_none</p>
<button type="button" id="log-more" hidden>$more</button>
</section>
<section id="game-devices-section" aria-labelledby="game-devices-title" hidden>
<h2 id="game-devices-title">$game_devices</h2>
<div class="table-wrap">
<table id="game-devices" class="data">
<thead><tr><th scope="col">$col_node</th><th scope="col">$col_battery</th><th scope="col">$col_link</th><th scope="col">$col_firmware</th><th scope="col">$col_flags</th><th scope="col">$col_seen</th></tr></thead>
<tbody></tbody>
</table>
</div>
</section>
