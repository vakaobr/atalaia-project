name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (SC-3): no job here writes to the repository, makes a release or comments.
# A job that ever needs more asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  core:
    name: Core and game modes
    runs-on: ubuntu-latest
    env:
      ATALAIA_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
      - name: Configure
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DATALAIA_SHARED=ON -DATALAIA_STUB=ON
      - name: Build
        run: cmake --build build
      - name: Test core
        run: ctest --test-dir build --output-on-failure
      - name: Test the simulator and the game modes
        env:
          ATALAIA_CORE_LIB: ${{ github.workspace }}/build/libatalaia_core.so
          ATALAIA_CORE_STUB_LIB: ${{ github.workspace }}/build/libatalaia_core_stub.so
        run: |
          python3 -m pip install --require-hashes --no-deps --only-binary ":all:" -r tools/ci-sim-requirements.txt
          cd simulator
          python -m unittest discover -s tests -v
          python -m atalaia_sim test

  controller:
    name: Field controller (REST, MQTT, host modem, host boxes)
    # Ubuntu's own Python packages, as in tools/dev/Dockerfile and on a Raspberry Pi.
    runs-on: ubuntu-24.04
    env:
      ATALAIA_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev mosquitto \
            python3-yaml python3-cryptography python3-fastapi python3-uvicorn \
            python3-websockets python3-httpx python3-paho-mqtt python3-serial
          sudo systemctl stop mosquitto || true
      - name: Build the core and the host modem
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DATALAIA_SHARED=ON -DBUILD_TESTING=OFF
          cmake --build build
          cmake -S firmware/esp32/test/modem_host -B build/modem_host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/modem_host
          cmake -S firmware/esp32/test/box_host -B build/box_host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/box_host
          cmake -S firmware/esp32/test/pod_host -B build/pod_host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/pod_host
      - name: Test the controller
        env:
          ATALAIA_CORE_LIB: ${{ github.workspace }}/build/libatalaia_core.so
          ATALAIA_MODEM_HOST: ${{ github.workspace }}/build/modem_host/modem_host
          ATALAIA_BOX_HOST: ${{ github.workspace }}/build/box_host/box_host
          ATALAIA_POD_HOST: ${{ github.workspace }}/build/pod_host/pod_host
        working-directory: controller
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: The site server's plain-Python tests (no database), on the controller's packages
        # As tools/check.sh runs them: the shared modules import without the site server's stack.
        env:
          ATALAIA_CORE_LIB: ${{ github.workspace }}/build/libatalaia_core.so
        working-directory: server
        run: /usr/bin/python3 -m unittest tests.test_config tests.test_ids tests.test_shared_imports tests.test_chrono_verify tests.test_feeds tests.test_backup_crypt -v

  console:
    name: GM console and scoreboard in a browser (Chromium)
    # The image of tools/dev/console/Dockerfile, as `python tools/docker_console.py`
    # builds it locally: Playwright with Chromium, the controller's Ubuntu
    # packages, Mosquitto and zbar-tools. The real controller runs with the C
    # host modem; a missing browser or tool fails the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the browser test image
        run: docker build -t atalaia-console-test tools/dev/console
      - name: Browser tests
        run: |
          docker run --rm --ipc=host -e ATALAIA_REQUIRE_ALL=1 -e ATALAIA_REQUIRE_BROWSER=1 \
            -v "$PWD:/src" -w /src atalaia-console-test sh controller/console/tests/run.sh

  editor:
    name: Mode editor in a browser (Chromium), blocks to modes that pass their tests
    # The GM console's image (tools/dev/console/Dockerfile), as `python tools/docker_editor.py`
    # uses it locally: the editor served by the simulator's web server, its Lua generator run in
    # Chromium, and the example projects' generated modes run against the hand-written modes'
    # tests in the simulator (phase 5 plan phase A). A missing browser fails the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the browser test image
        run: docker build -t atalaia-console-test tools/dev/console
      - name: Browser tests
        run: |
          docker run --rm --ipc=host -e ATALAIA_REQUIRE_BROWSER=1 \
            -v "$PWD:/src" -w /src atalaia-console-test sh simulator/editor_tests/run.sh

  server:
    name: Site server (FastAPI on PostgreSQL 16, migrations)
    # The image of server/Dockerfile (target test: python:3.12-slim, the
    # hash-pinned requirements, the core built in its own stage) and the same
    # commands `python3 tools/docker_server.py test` and `... migrations` run
    # in it locally (decision P4R17); here PostgreSQL is a service container
    # instead of Compose's ephemeral one, with the same image, user and password.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: atalaia
          POSTGRES_PASSWORD: atalaia-test
          POSTGRES_DB: atalaia
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U atalaia -d atalaia"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ATALAIA_DATABASE_URL: postgresql+asyncpg://atalaia:atalaia-test@localhost:5432/atalaia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the test image
        run: docker build -f server/Dockerfile --target test -t atalaia-server-test .
      - name: Tests
        run: |
          docker run --rm --network host -e ATALAIA_DATABASE_URL atalaia-server-test \
            sh tests/run.sh test
      - name: Migrations (upgrade head, downgrade base, upgrade head, check)
        run: |
          docker run --rm --network host -e ATALAIA_DATABASE_URL atalaia-server-test \
            sh tests/run.sh migrations

  server-browser:
    name: Site server staff pages in a browser (Chromium)
    # The image of tools/dev/server-browser/Dockerfile (Playwright's, with the
    # server's hash-pinned packages) next to an ephemeral PostgreSQL 16, as
    # `python3 tools/docker_server.py browser` runs it locally (decision FU2-10):
    # the staff pages driven in headless Chromium against the real API over HTTPS;
    # a missing browser fails the job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Browser tests
        run: python3 tools/docker_server.py browser

  server-deploy:
    name: Site server deployment (setup.sh, Caddy, backup and restore)
    # The real server/docker-compose.yml (Caddy, the server, PostgreSQL 16) with
    # Caddy's own CA and the site name atalaia.test, as `python3 tools/docker_server.py
    # deploy` runs it locally (plan phase 22): setup.sh, HTTPS and the WebSocket
    # through Caddy, an encrypted backup, and its restore into a fresh database
    # with every table compared.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts (POSIX sh)
        run: sh -n server/setup.sh && sh -n server/backup.sh && sh -n server/restore.sh
      - name: Deployment test
        run: python3 tools/docker_server.py deploy

  server-deploy-hosted:
    name: Hosted hub deployment (on-demand TLS, two fields, backup and restore)
    # server/docker-compose.yml with docker-compose.hosted.yml, as `python3
    # tools/docker_server.py deploy-hosted` runs it locally (Phase 4 follow-up):
    # setup.sh --hosted (the two roles, the registry), the operator's commands,
    # Caddy's on-demand TLS behind the ask endpoint with Caddy's own CA, each
    # field at its own name, the isolation as the server's role, and an
    # encrypted backup restored into a fresh hub with ownership, grants and
    # row-level security compared.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell scripts (POSIX sh)
        run: sh -n server/setup.sh && sh -n server/hosted-roles.sh && sh -n server/backup.sh && sh -n server/restore.sh
      - name: ShellCheck (koalaman/shellcheck v0.11.0, pinned by digest)
        run: >-
          docker run --rm -v "$PWD/server:/mnt:ro" -w /mnt
          koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -s sh -x setup.sh hosted-roles.sh backup.sh restore.sh
      - name: Hosted deployment test
        run: python3 tools/docker_server.py deploy-hosted

  flutter-test:
    name: Player app (Dart, with the core through dart:ffi)
    # The pinned Flutter image that `python tools/docker_app.py` uses (Flutter
    # 3.44.0, Dart 3.12.0, pinned by digest). That image has no CMake, so the
    # core and the FFI stub are built here first, as shared libraries for this
    # runner (Ubuntu 24.04, like the image), without mbedtls, which the image
    # lacks. app/tool/check.sh resolves the packages from the committed
    # pubspec.lock, runs `flutter analyze --fatal-infos`, `dart format
    # --set-exit-if-changed` and `flutter test` on a copy of the read-only
    # checkout: the bridge against the stub, and every mode's tests in
    # modes/*/tests/ on the real core, directly and in game loop isolates.
    # The host pod, the host modem and the host box (the I/O pod's, the USB
    # modem's and the Field Box's own C code, mbedtls linked in statically,
    # so they run in the image) are built here too: the pod and radio-link
    # tests and the phone controller's end-to-end tests drive them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
      - name: Build the core and the FFI stub as shared libraries, the host pod, modem and box
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DATALAIA_SHARED=ON -DATALAIA_STUB=ON             -DATALAIA_MBEDTLS=OFF -DBUILD_TESTING=OFF
          cmake --build build
          cmake -S firmware/esp32/test/pod_host -B build/pod_host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/pod_host
          cmake -S firmware/esp32/test/modem_host -B build/modem_host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/modem_host
          # mbedtls linked statically: the Flutter image has none (tools/docker_app.py does the same).
          cmake -S firmware/esp32/test/box_host -B build/box_host -DCMAKE_BUILD_TYPE=Debug \
            -DMBEDCRYPTO_LIB=$(ls /usr/lib/*/libmbedcrypto.a | head -n 1)
          cmake --build build/box_host
      - name: Analyze, check the formatting and test
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build:/core-build:ro" -w /src             -e ATALAIA_CORE_LIB=/core-build/libatalaia_core.so             -e ATALAIA_CORE_STUB_LIB=/core-build/libatalaia_core_stub.so             -e ATALAIA_POD_HOST=/core-build/pod_host/pod_host             -e ATALAIA_MODEM_HOST=/core-build/modem_host/modem_host             -e ATALAIA_BOX_HOST=/core-build/box_host/box_host             ghcr.io/cirruslabs/flutter:3.44.0@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8             sh /src/app/tool/check.sh check

  core-android-ndk:
    name: Core cross-compiled for Android (NDK, three ABIs)
    # In the same Flutter image: the Android SDK manager installs NDK
    # 28.2.13676358 and CMake 3.22.1 (pinned in app/tool/check.sh), then
    # core/CMakePresets.json builds libatalaia_core.so for arm64-v8a,
    # armeabi-v7a and x86_64 with -Werror. Each library is checked: the right
    # machine, the node.h entry points exported, nothing needed beyond libc,
    # libm and libdl, and 16 KB pages on the 64-bit ABIs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-compile and check
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src             ghcr.io/cirruslabs/flutter:3.44.0@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8             sh /src/app/tool/check.sh ndk

  flutter-build-android:
    name: Android APK (Gradle builds the core with the NDK)
    # `flutter build apk --debug` in the same Flutter image: Gradle 9.1.0
    # (checksum-pinned), the Android Gradle plugin 9.0.1 and Kotlin 2.3.20, with
    # externalNativeBuild compiling core/ for arm64-v8a, armeabi-v7a and
    # x86_64 (app/android/app/build.gradle.kts). The APK must contain
    # lib/<abi>/libatalaia_core.so for each, checked as in core-android-ndk.
    # The APK is run on an emulator by flutter-integration below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check the APK
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            ghcr.io/cirruslabs/flutter:3.44.0@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8 \
            sh /src/app/tool/check.sh apk

  ios-build:
    name: iOS app (flutter build ios, unsigned)
    # `flutter build ios --release --no-codesign` on GitHub's macOS runner: the
    # only place the repository's Swift, Info.plist and Xcode project (app/ios/)
    # are compiled, since the maintainer's toolchain is Docker on Windows or
    # Linux (decisions PD10, iOS-1 to iOS-7). It proves the project builds; it
    # makes no IPA to install (that needs signing, app/docs/ios-on-a-mac.md).
    # The core is not built: the app's game loop does not run on iOS (no prop,
    # no phone controller there), so there is no dylib to link. Flutter 3.44.0,
    # the same as the Docker image, from the action pinned by commit as above.
    # Only on pushes to main, not on every pull request: macOS minutes cost ten
    # times Linux's on a private repository (free on a public one, as now), and
    # Dart changes cannot break iOS without flutter-test seeing it. Make it run
    # on pull requests too by dropping the `if`.
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
      - name: The GM console and the check-in notices into the app's assets (PE24-61)
        working-directory: app
        run: dart tool/sync_console.dart
      - name: Packages from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Build for iOS without signing
        working-directory: app
        run: flutter build ios --release --no-codesign

  flutter-integration:
    name: The app on an Android emulator (integration tests)
    # The emulator needs hardware acceleration (KVM), which GitHub's Ubuntu
    # runners have and Docker on Windows or macOS does not: these tests run
    # here only. An Android 11 (API 30) x86_64 emulator with the plain AOSP
    # image (no Google APIs: the app must not need Google Play services) runs
    # `flutter test integration_test`, which builds the debug APK (Gradle
    # builds the core with the NDK) and drives the real app: the roles, a
    # Bomb prop on the real core, a join text, the player view over a
    # WebSocket (app/integration_test/). Flutter 3.44.0 comes from
    # subosito/flutter-action because the emulator and the Flutter tool must
    # run on the same machine; both actions are pinned by commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
      - name: Pinned NDK and CMake (as app/tool/check.sh)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: The GM console and the check-in notices into the app's assets (PE24-61)
        working-directory: app
        run: dart tool/sync_console.dart
      - name: Packages from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: app
          # Android 13+ asks before an app posts notifications (a prop asks when
          # its game starts); grant it once installed, as app/tool/emulator_tests.ps1
          # does locally. On API 30 there is no such permission and pm grant fails
          # quietly. The loop's output goes to /dev/null and it is stopped when the
          # tests end: a background job holding the step's output open makes the
          # step wait until the job's time limit.
          script: sh -c '(while true; do adb shell pm grant org.atalaia.app android.permission.POST_NOTIFICATIONS; sleep 0.3; done) >/dev/null 2>&1 & g=$!; flutter test integration_test --reporter expanded -d emulator-5554; r=$?; kill $g; exit $r'

  protocol:
    name: Protocol schema and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python3 -m pip install --require-hashes --no-deps --only-binary ":all:" --no-binary reuse -r tools/ci-sim-requirements.txt -r tools/ci-lint-requirements.txt
      - name: Generated files are up to date
        run: python tools/protogen.py --check
      - name: The field frame vectors are up to date
        run: python tools/field_frame_vectors.py --check
      - name: Pairing vectors are up to date
        run: python tools/pairing_vectors.py --check
      - name: The ATAK emitter's known answers are up to date
        run: python tools/atak_xml_vectors.py --check
      - name: The mode package vectors are up to date
        run: python tools/mode_package_vectors.py --check
      - name: The I/O pod's settings vectors are up to date
        run: python tools/pod_config_vectors.py --check
      - name: The Field Box's iBeacon vectors are up to date
        run: python tools/box_beacon_vectors.py --check
      - name: The scenario compiler's Unicode table is up to date
        run: python tools/scenario_unicode.py --check
      - name: The registry's JSON Schemas accept their examples and reject the invalid ones
        working-directory: registry/schema
        run: |
          check-jsonschema --check-metaschema index.schema.json revoked.schema.json
          check-jsonschema --schemafile index.schema.json examples/index.json
          check-jsonschema --schemafile revoked.schema.json examples/revoked.json
          for f in examples/invalid/*.json; do
            schema=index.schema.json
            case "$f" in examples/invalid/revoked_*) schema=revoked.schema.json ;; esac
            if check-jsonschema --schemafile "$schema" "$f" > /dev/null; then
              echo "::error file=registry/schema/$f::the schema accepts this invalid example"
              exit 1
            fi
          done
      - name: The project page is up to date in every language
        run: python tools/build_site.py --check
      - name: The wiring diagrams match the firmware's pin defaults
        run: python tools/check_wiring.py
      - name: The listen-before-talk bench gate's report tool passes its self-test
        run: python tools/bench_lbt_gate.py --selftest
      - name: The JSON Schema accepts the examples and rejects the invalid ones
        working-directory: protocol/json
        run: |
          check-jsonschema --check-metaschema event.schema.json
          check-jsonschema --schemafile event.schema.json examples/*.json
          for f in examples/invalid/*.json; do
            if check-jsonschema --schemafile event.schema.json "$f" > /dev/null; then
              echo "::error file=protocol/json/$f::the schema accepts this invalid example"
              exit 1
            fi
          done

  sanitizers:
    name: Core under AddressSanitizer and UBSan
    runs-on: ubuntu-latest
    env:
      ATALAIA_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
      - name: Build
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The Field Box's host tests too, for the code that reads what comes from elsewhere
      # (mode packages and their archives, plan phase 13b; joins; field frames). Leak checks
      # off: some older fixtures leave a game's node behind between tests.
      - name: Firmware host tests under AddressSanitizer and UBSan
        run: |
          cmake -S firmware/esp32/test -B fw-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build fw-asan --target firmware_test
          cd fw-asan && ASAN_OPTIONS=detect_leaks=0 ./firmware_test

  sandbox-escape:
    # Phase 5 plan phase 5 (AC-12): scripts that try to leave the Lua sandbox, crash the runtime
    # or run without limits, as box and controller scripts, under ASan and UBSan; then the same
    # through the simulator's ctypes bindings. The registry's CI runs this battery too.
    name: Sandbox-escape battery
    runs-on: ubuntu-latest
    env:
      ATALAIA_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
          python3 -m pip install --require-hashes --no-deps --only-binary ":all:" -r tools/ci-sim-requirements.txt
      - name: The C battery under ASan and UBSan
        run: |
          cmake -S core -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build-asan --target test_sandbox_escape
          ctest --test-dir build-asan -R sandbox_escape --output-on-failure
      - name: Through the simulator (box and field scripts, a mode playing on)
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DATALAIA_SHARED=ON -DBUILD_TESTING=OFF
          cmake --build build
          cd simulator
          ATALAIA_CORE_LIB="$PWD/../build/libatalaia_core.so" python -m unittest tests.test_sandbox_escape -v

  registry-template:
    # Phase 5 plan phase 8 (AC-6 in this repository, decisions P5G-1 onwards): the mode
    # registry's template (registry/template/) with a sample submission
    # (registry/examples/org.example.hill/) signed by throwaway keys made at run time; every
    # "check-" step of the template's own workflow runs as written (the JSON Schemas,
    # tools/registry_check.py lint, REUSE, the mode's tests in the simulator, the published site),
    # then lint must refuse tampered and out-of-process registries. Locally in tools/check.sh,
    # where the JSON Schema and REUSE steps are skipped (the dev container lacks those tools).
    name: Mode registry template and its CI on a sample submission
    runs-on: ubuntu-latest
    env:
      ATALAIA_REQUIRE_ALL: "1"
      ATALAIA_REQUIRE_REGISTRY_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
          python3 -m pip install --require-hashes --no-deps --only-binary ":all:" --no-binary reuse -r tools/ci-sim-requirements.txt -r tools/ci-lint-requirements.txt
      - name: Build the core
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Debug -DATALAIA_SHARED=ON -DBUILD_TESTING=OFF
          cmake --build build
      - name: The template's checks on the sample submission
        env:
          ATALAIA_CORE_LIB: ${{ github.workspace }}/build/libatalaia_core.so
        run: python -m unittest discover -s registry/tests -v

  format:
    name: Formatting (clang-format, StyLua)
    # Pinned so a newer runner image cannot bring a clang-format that formats differently.
    runs-on: ubuntu-24.04
    env:
      STYLUA_VERSION: "2.6.0"
      STYLUA_SHA256: a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the formatters (same versions as tools/dev/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          curl -sSfL -o /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  /tmp/stylua.zip" | sha256sum -c -
          sudo unzip -q /tmp/stylua.zip -d /usr/local/bin
      - name: C and Lua are formatted
        run: sh tools/format.sh --check

  licensing:
    name: Check licensing headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python3 -m pip install --require-hashes --no-deps --only-binary ":all:" --no-binary reuse -r tools/ci-lint-requirements.txt
          reuse lint

  esp32-build:
    name: ESP32 cross-compilation
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history and tags: the version counts commits since v<X.Y.Z> (FV-9)
      - name: Firmware version (tools/docker_fw.py's, with the commit; FV-9)
        run: |
          # The checkout belongs to the runner's user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-shallow-repository)" = false
          version="$(python3 tools/docker_fw.py version)"
          # A pre-release (0.4.0-dev) without its commit means git gave nothing.
          if [ "${version#*-}" != "$version" ] && [ "${version#*+}" = "$version" ]; then
            echo "::error::the firmware version $version carries no commit"; exit 1
          fi
          echo "Firmware version: $version"
          echo "FW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build firmware
        working-directory: firmware/esp32
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py -D "ATALAIA_FW_VERSION=$FW_VERSION" build
          grep '"project_version"' build/project_description.json | grep -qF "\"$FW_VERSION\""
          # The Field Box's iBeacon (decisions BBC-1 to BBC-12): NimBLE as a broadcaster, on by default.
          grep -q '^CONFIG_ATALAIA_BOX_BEACON=y' sdkconfig
          grep -q '^CONFIG_BT_NIMBLE_ENABLED=y' sdkconfig
          # The internal RAM the image leaves to the heap (Wi-Fi, Bluetooth, DMA buffers, stacks): see
          # tools/check_fw_ram.py and README.md, "Memory budget".
          python3 ../../tools/check_fw_ram.py build/atalaia_esp32.map

  esp32-modem-build:
    name: ESP32 USB radio modem cross-compilation
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history and tags: the version counts commits since v<X.Y.Z> (FV-9)
      - name: Firmware version (tools/docker_fw.py's, with the commit; FV-9)
        run: |
          # The checkout belongs to the runner's user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-shallow-repository)" = false
          version="$(python3 tools/docker_fw.py version)"
          # A pre-release (0.4.0-dev) without its commit means git gave nothing.
          if [ "${version#*-}" != "$version" ] && [ "${version#*+}" = "$version" ]; then
            echo "::error::the firmware version $version carries no commit"; exit 1
          fi
          echo "Firmware version: $version"
          echo "FW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the modem variant (sdkconfig.modem)
        working-directory: firmware/esp32
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-modem -D SDKCONFIG=build-modem/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.modem" -D "ATALAIA_FW_VERSION=$FW_VERSION" build
          grep -q '^CONFIG_ATALAIA_MODEM_MODE=y' build-modem/sdkconfig
          grep '"project_version"' build-modem/project_description.json | grep -qF "\"$FW_VERSION\""

  esp32-pod-build:
    name: ESP32 I/O pod cross-compilation
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history and tags: the version counts commits since v<X.Y.Z> (FV-9)
      - name: Firmware version (tools/docker_fw.py's, with the commit; FV-9)
        run: |
          # The checkout belongs to the runner's user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-shallow-repository)" = false
          version="$(python3 tools/docker_fw.py version)"
          # A pre-release (0.4.0-dev) without its commit means git gave nothing.
          if [ "${version#*-}" != "$version" ] && [ "${version#*+}" = "$version" ]; then
            echo "::error::the firmware version $version carries no commit"; exit 1
          fi
          echo "Firmware version: $version"
          echo "FW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the I/O pod variant (sdkconfig.pod), with no warnings
        working-directory: firmware/esp32
        shell: bash # -eo pipefail: the build's own exit code counts through tee
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-pod -D SDKCONFIG=build-pod/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.pod" -D "ATALAIA_FW_VERSION=$FW_VERSION" \
            build 2>&1 | tee build-pod.log
          grep -q '^CONFIG_ATALAIA_POD_MODE=y' build-pod/sdkconfig
          grep -q '^CONFIG_BT_NIMBLE_ENABLED=y' build-pod/sdkconfig
          if grep -E 'warning:' build-pod.log; then echo "::error::the pod build has warnings"; exit 1; fi
          grep '"project_version"' build-pod/project_description.json | grep -qF "\"$FW_VERSION\""

  firmware-test:
    name: Firmware HAL stub tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -S firmware/esp32/test -B /tmp/fw-test \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/fw-test
          ctest --test-dir /tmp/fw-test --output-on-failure
      - name: The modes page's animations are what the screens draw
        run: |
          python3 -m pip install --require-hashes --no-deps --only-binary ":all:" -r tools/ci-yaml-requirements.txt
          python3 tools/gen_mode_gifs.py --check --frames-exe /tmp/fw-test/mode_gif_frames

  dco:
    name: Check DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign your commits with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
