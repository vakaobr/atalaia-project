name: Release

# A release tag v* builds the firmware images (and the target and output modules' UF2 files), signs them with a CI release key,
# builds the phone app's APK signed with the Android release key (job apk), and publishes a
# GitHub pre-release with them (docs/manuals/en/firmware.md, firmware/esp32/docs/RELEASE_SIGNING.md).
# What decides is the ref the run is on, not the event: a tag v* is a real release, whether
# release-please.yml named it (`gh workflow run release.yml --ref vX.Y.Z` after merging the release
# pull request, because a tag made with the workflow token starts no workflow; release-please's
# release is turned back into a draft first) or the maintainer pushed it by hand; "Run workflow"
# (workflow_dispatch) on a branch is a dry run: the same builds and packaging, signed with a
# throw-away key made on the runner, uploaded as a workflow artifact, no release, no secret used.
# Files are only ever added to a draft, which is published once all of them are up: a published
# release fails the run (checked here first, and again before anything is uploaded), so a tag
# cannot publish twice. Releasing: CONTRIBUTING.md, "Releases".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs. Only the publish job writes (contents).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The project's CI release key, the next CI key of the 2026-11 rotation (docs/community/keys.md;
  # RELEASE_SIGNING.md, "Rotating the CI key"), from the secrets ATALAIA_RELEASE_CI_KEY_NEXT and
  # _NEXT_PASSPHRASE of the environment "release". The first CI key was dropped at
  # step 3 of the rotation: the variable ATALAIA_RELEASE_SIGNING_KEY may be unset or "next", both
  # meaning this key; any other value fails the release. The key's id is checked before anything
  # is signed, so a wrong secret fails the release instead of publishing something no box accepts.
  CI_KEY_NEXT_ID: a4f6002b0122b131
  # The firmware's default trusted keys (Kconfig): root, next CI; mode keys and release keys.
  # The build checks the image carries exactly these, and the signature is checked against them.
  RELEASE_KEYS_HEX: >-
    e6dccf90dd002529fe837e023f9f658a70917ff7dc69615cec600083bab360d7
    efa798e41a0c438447a21857ffc892525214039a39127b5f93b105054c696d26
  MODE_KEYS_HEX: >-
    23e9b7acefbe4dc54d86f0c7cc8dbca64340f141a84c94a2f38216420baae0ca
    d27329d0e19ba0625950cb1b73fca4aa4c5014d76623f6b69389d0e98b1d4c86

jobs:
  version:
    name: Version of this release
    runs-on: ubuntu-latest
    permissions:
      contents: read # release view below sees published releases; a draft is caught by the publish job
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history and tags: the version counts commits since v<X.Y.Z> (FV-9)
      - name: A release tag must be on main
        if: github.ref_type == 'tag'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          # The workflow file itself runs from the tag, so this check is defence in depth, not the
          # control (the environment's approval and the v* tag ruleset are): it stops a tag made by
          # mistake on a commit that never went through review from signing anything. The checkout
          # has every branch (fetch-depth 0), so origin/main is there.
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::the commit of $GITHUB_REF_NAME ($TAG_COMMIT) is not on main: only a reviewed commit is signed"
            exit 1
          fi
      - name: The firmware version is the tag's
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built="$(python3 tools/docker_fw.py version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A real release only from a release tag (a dispatch may name any tag).
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::$GITHUB_REF_NAME is not a release tag (vMAJOR.MINOR.PATCH[-pre-release])"
              exit 1
            fi
            # This job's token sees published releases only: release-please's draft passes.
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "::error::a published release for $GITHUB_REF_NAME already exists; nothing to do (delete it, and the tag if it is wrong, to release again)"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            # A plain vX.Y.Z tag must be the commit that says so (version.h, no pre-release), or the
            # release tool refuses the images; a tag with a pre-release (v0.5.0-rc.1) names its own.
            if [ "${version#*-}" = "$version" ] && [ "$built" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but this commit builds version $built (core/include/atalaia/version.h)"
              exit 1
            fi
          else
            version="$built" # a dry run: this commit's own development version
          fi
          echo "Firmware version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: espressif/idf:v5.3.2@sha256:5b8f58d9d9caa45b689a31a0b6a0cc53b84594e0ba5fdd8d28eeef7d6123242a # as CI's esp32-build jobs and tools/docker_fw.py
    strategy:
      fail-fast: true # one image failing fails the release: no partial release
      matrix:
        include:
          - variant: field-box # the Field Box and the Satellite
            dir: build
            defaults: sdkconfig.defaults
          - variant: modem
            dir: build-modem
            defaults: sdkconfig.defaults;sdkconfig.modem
          - variant: io-pod
            dir: build-pod
            defaults: sdkconfig.defaults;sdkconfig.pod
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build, with no warnings
        working-directory: firmware/esp32
        shell: bash # -eo pipefail: the build's own exit code counts through tee
        run: |
          # The checkout belongs to the runner's user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # The defaults of docker_fw.py: the sdkconfig lives in the build folder, EU868, listen
          # before talk on, the project's two mode keys and two release keys (Kconfig), no bench option.
          idf.py -B ${{ matrix.dir }} -D SDKCONFIG=${{ matrix.dir }}/sdkconfig \
            -D "SDKCONFIG_DEFAULTS=${{ matrix.defaults }}" -D "ATALAIA_FW_VERSION=$FW_VERSION" \
            build 2>&1 | tee build.log
          if grep -E 'warning:' build.log; then echo "::error::the build has warnings"; exit 1; fi
      - name: Check the image is the release configuration
        working-directory: firmware/esp32
        run: |
          d=${{ matrix.dir }}
          grep '"project_version"' "$d/project_description.json" | grep -qF "\"$FW_VERSION\""
          if grep -Eq '^CONFIG_ATALAIA_(SERIAL_KEYS|SKIP_SETUP|RADIO_LOG_PACKETS|LBT_BENCH)=y' "$d/sdkconfig"; then
            echo "::error::a bench option is on in a release build"; exit 1
          fi
          grep -q '^CONFIG_ATALAIA_RADIO_REGION_EU868=y' "$d/sdkconfig"
          grep -q '^CONFIG_ATALAIA_LBT=y' "$d/sdkconfig"
          # The custom table with the 4 MB OTA slots (partitions.csv, layout 1); release_package.py then
          # checks the built table and that the app fits its slot, and the README says USB flash once.
          grep -qxF 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"' "$d/sdkconfig"
          if [ "${{ matrix.variant }}" = field-box ]; then
            grep -qxF "CONFIG_ATALAIA_OTA_RELEASE_KEYS=\"$RELEASE_KEYS_HEX\"" "$d/sdkconfig"
            grep -qxF "CONFIG_ATALAIA_MODE_KEYS=\"$MODE_KEYS_HEX\"" "$d/sdkconfig"
          fi
          ls -l "$d/atalaia_esp32.bin"
      - name: Package (USB bundle, merged image, app image)
        # Also refuses an image whose boot splash is not the pinned Atalaia tower (decision LOGO-7).
        run: |
          . "$IDF_PATH/export.sh"
          python3 tools/release_package.py package --variant ${{ matrix.variant }} \
            --build-dir firmware/esp32/${{ matrix.dir }} --version "$FW_VERSION" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.variant }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-module:
    # The target module's UF2 files (firmware/target-module/; draft RFC "The expansion port",
    # increment 8) and the I2C output module's, with its default channel list
    # (firmware/output-module/, increment 11), built in tools/docker_module.py's image (Ubuntu pinned by digest, pico-sdk and
    # picotool pinned by commit). Extra release assets covered by SHA256SUMS; not signed: a module is
    # flashed over USB by hand, never updated over the air.
    name: Build the target and output modules
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host tests, then the UF2 files
        run: |
          python3 tools/docker_module.py test
          python3 tools/docker_module.py build
      - name: Name them for the release
        run: |
          set -eu
          mkdir -p dist
          cp firmware/target-module/build/atalaia_target_module.uf2 "dist/atalaia-target-module-$FW_VERSION.uf2"
          cp firmware/target-module/build/atalaia_target_module_2.uf2 "dist/atalaia-target-module-2-$FW_VERSION.uf2"
          cp firmware/output-module/build/atalaia_output_module.uf2 "dist/atalaia-output-module-$FW_VERSION.uf2"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-target-module
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  apk:
    # The phone app's release APK (decisions APK-1 to APK-8; firmware/esp32/docs/RELEASE_SIGNING.md,
    # "The Android app's key"): built as CI's flutter-build-android job builds the debug one (the
    # pinned Flutter image, Gradle building the core with the NDK), but release and signed with the
    # project's Android key, so each release installs over the one before. The key is a secret of the
    # environment "release" only: pull requests and CI never see it and stay debug-signed. The APK
    # is built unsigned first, in a step with no secret (the build downloads Gradle and pub
    # dependencies; Gradle checks them against app/android/gradle/verification-metadata.xml). Then,
    # on a tag, the keystore is decoded to the runner's temporary folder and app/tool/sign_apk.sh
    # signs the APK in a container with no network (--network none); apksigner must say it verifies
    # with the one certificate whose SHA-256 is ANDROID_CERT_SHA256 (docs/community/keys.md), and the
    # keystore is shredded; on a dry run a throw-away keystore made on the runner signs it instead
    # (decisions APS-1 to APS-6).
    name: Android app (release-signed APK)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
      # The certificate of the Android release key (alias atalaia, RSA 4096, PKCS12).
      ANDROID_CERT_SHA256: 9C:35:0D:17:37:D6:C5:35:CD:3E:D1:04:28:8E:65:AD:7D:B4:FA:CE:8E:4E:6F:27:75:3B:7B:7C:38:40:A1:99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch: the tag must be an ancestor of origin/main
          persist-credentials: false
      - name: A release tag must be on main
        if: github.ref_type == 'tag'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          # As in the publish job: defence in depth before a secret is read.
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::the commit of $GITHUB_REF_NAME ($TAG_COMMIT) is not on main: only a reviewed commit is signed"
            exit 1
          fi
      - name: Build the pinned Flutter image (tools/dev/flutter/Dockerfile, SDK checked by SHA-256)
        run: docker build -t atalaia-flutter:3.47.9 tools/dev/flutter
      - name: Build the release APK, unsigned (no key in this step)
        # This step downloads Gradle and pub dependencies, so it has no secret: no keystore, no
        # password. check.sh refuses ATALAIA_RELEASE_* and builds with
        # -Patalaia.release.unsigned=true; Gradle checks every download against
        # app/android/gradle/verification-metadata.xml (decisions APS-1 to APS-6).
        run: |
          set -eu
          mkdir -p unsigned dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/unsigned:/apk-out" -w /src \
            -e ATALAIA_APK_VERSION="$FW_VERSION" -e ATALAIA_APK_OUT=/apk-out \
            atalaia-flutter:3.47.9 sh /src/app/tool/check.sh apk-release
          ls -l unsigned
      - name: Sign and verify the release APK offline (the Android key on a tag; a throw-away key on a dry run)
        env:
          # Only this step sees the secrets, and only on a tag. They are never echoed (GitHub masks
          # them in the log), reach the container by name only (docker run -e NAME, never a value on
          # a command line), and the keystore lives in RUNNER_TEMP, outside the checkout, only for
          # this step: it is shredded however the step ends (and by the next step, always).
          # Every container here runs with --network none.
          KEYSTORE_B64: ${{ github.ref_type == 'tag' && secrets.ATALAIA_ANDROID_KEYSTORE_B64 || '' }}
          ATALAIA_RELEASE_STORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.ATALAIA_ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          set -eu
          umask 077
          keydir="$(mktemp -d "$RUNNER_TEMP/androidkey.XXXXXX")"
          trap 'find "$keydir" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "$keydir"' EXIT
          offline() { docker run --rm --network none --pull never --user "$(id -u):$(id -g)" -e HOME=/tmp "$@"; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test -n "$KEYSTORE_B64" || { echo "::error::the secret ATALAIA_ANDROID_KEYSTORE_B64 is not set"; exit 1; }
            test -n "$ATALAIA_RELEASE_STORE_PASSWORD" || { echo "::error::the secret ATALAIA_ANDROID_KEYSTORE_PASSWORD is not set"; exit 1; }
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keydir/release.p12" ||
              { echo "::error::the secret ATALAIA_ANDROID_KEYSTORE_B64 is not base64"; exit 1; }
            unset KEYSTORE_B64
            want="$ANDROID_CERT_SHA256"
            echo "Signing with the Android release key (certificate SHA-256 $want)."
          else
            # A dry run: a keystore made here, so the signing and the checks run; nobody trusts it.
            ATALAIA_RELEASE_STORE_PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
            echo "::add-mask::$ATALAIA_RELEASE_STORE_PASSWORD"
            export ATALAIA_RELEASE_STORE_PASSWORD
            offline -v "$keydir:/key" -e ATALAIA_RELEASE_STORE_PASSWORD atalaia-flutter:3.47.9 \
              sh -c 'keytool -genkeypair -keystore /key/release.p12 -storetype PKCS12 -alias atalaia \
                -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Atalaia dry run" \
                -storepass:env ATALAIA_RELEASE_STORE_PASSWORD -keypass:env ATALAIA_RELEASE_STORE_PASSWORD' > /dev/null
            want="$(offline -v "$keydir:/key:ro" -e ATALAIA_RELEASE_STORE_PASSWORD atalaia-flutter:3.47.9 \
              keytool -list -v -keystore /key/release.p12 -storepass:env ATALAIA_RELEASE_STORE_PASSWORD |
              sed -n 's/^[[:space:]]*SHA256: *//p' | head -n 1)"
            echo "Dry run: signed with a throw-away key (certificate SHA-256 $want). A tag signs with $ANDROID_CERT_SHA256."
          fi
          export ATALAIA_RELEASE_STORE_PASSWORD
          # The script comes from the checkout (mounted read-only), the APK from the build step.
          offline -v "$PWD/app/tool:/tool:ro" -v "$PWD/unsigned:/apk-in:ro" -v "$keydir:/key:ro" \
            -v "$PWD/dist:/apk-out" \
            -e ATALAIA_APK_IN="/apk-in/atalaia-app-$FW_VERSION-unsigned.apk" -e ATALAIA_APK_OUT=/apk-out \
            -e ATALAIA_APK_VERSION="$FW_VERSION" -e ATALAIA_APK_CERT_SHA256="$want" \
            -e ATALAIA_RELEASE_STORE_FILE=/key/release.p12 -e ATALAIA_RELEASE_STORE_PASSWORD \
            -e ATALAIA_RELEASE_KEY_ALIAS=atalaia \
            atalaia-flutter:3.47.9 sh /tool/sign_apk.sh
          ls -l dist
      - name: Remove the keystore
        if: always()
        run: |
          # The signing step's trap already did; this covers a step that was cancelled or killed.
          find "$RUNNER_TEMP" -maxdepth 1 -name 'androidkey.*' -type d -print0 |
            while IFS= read -r -d '' d; do
              find "$d" -type f -exec shred -u {} + 2>/dev/null || true
              rm -rf "$d"
            done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish
    needs: [version, build, build-module, apk]
    runs-on: ubuntu-latest
    # The protected environment "release" (required reviewers, set in the repository settings): the
    # signing secrets belong to it, so only a run a maintainer approved can read them (SC-1, SC-2).
    # A dry run waits for the same approval. What the maintainer sets up, and why a repository-level
    # secret still reaches this job until it is moved: firmware/esp32/docs/RELEASE_SIGNING.md,
    # "Repository settings the release needs".
    environment: release
    permissions:
      contents: write # the release and its assets; nothing else
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch: the tag must be an ancestor of origin/main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install cryptography (pinned with hashes, tools/release-requirements.txt)
        run: python3 -m pip install --require-hashes --no-deps --only-binary ":all:" -r tools/release-requirements.txt
      - name: A release tag must be on main
        if: github.ref_type == 'tag'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          # The workflow file itself runs from the tag, so this check is defence in depth, not the
          # control (the environment's approval and the v* tag ruleset are): it stops a tag made by
          # mistake on a commit that never went through review from signing anything. The checkout
          # has every branch (fetch-depth 0), so origin/main is there.
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::the commit of $GITHUB_REF_NAME ($TAG_COMMIT) is not on main: only a reviewed commit is signed"
            exit 1
          fi
      # Bumped together with upload-artifact (v7 marks its zips application/zip; v8 unzips only
      # what is marked as a zip, and fails on a digest mismatch).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist
      - name: Sign the app images (the CI key on a tag; a throw-away key on a dry run)
        env:
          # Only this step sees the secret, and only on a tag with the variable unset or "next"
          # (GitHub compares strings ignoring case, the script below refuses anything but "" and
          # "next"). It is never echoed, and the key file lives in RUNNER_TEMP, outside the
          # repository (the tool refuses a key inside it), and is deleted.
          SIGNING_KEY: ${{ vars.ATALAIA_RELEASE_SIGNING_KEY }}
          CI_KEY_NEXT_PEM: ${{ github.ref_type == 'tag' && (vars.ATALAIA_RELEASE_SIGNING_KEY == '' || vars.ATALAIA_RELEASE_SIGNING_KEY == 'next') && secrets.ATALAIA_RELEASE_CI_KEY_NEXT || '' }}
          CI_KEY_NEXT_PASSPHRASE: ${{ github.ref_type == 'tag' && (vars.ATALAIA_RELEASE_SIGNING_KEY == '' || vars.ATALAIA_RELEASE_SIGNING_KEY == 'next') && secrets.ATALAIA_RELEASE_CI_KEY_NEXT_PASSPHRASE || '' }}
        run: |
          set -eu
          umask 077
          case "$SIGNING_KEY" in
            "" | next) secret=ATALAIA_RELEASE_CI_KEY_NEXT; pem="$CI_KEY_NEXT_PEM"; pass="$CI_KEY_NEXT_PASSPHRASE"; key_id="$CI_KEY_NEXT_ID" ;;
            *) echo "::error::the variable ATALAIA_RELEASE_SIGNING_KEY is \"$SIGNING_KEY\"; it must be unset or \"next\" (the old CI key was dropped)"; exit 1 ;;
          esac
          unset CI_KEY_NEXT_PEM CI_KEY_NEXT_PASSPHRASE
          keydir="$(mktemp -d "$RUNNER_TEMP/releasekey.XXXXXX")"
          trap 'rm -rf "$keydir"' EXIT
          key="$keydir/release.pem"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test -n "$pem" || { echo "::error::the secret $secret is not set"; exit 1; }
            printf '%s\n' "$pem" > "$key"
            unset pem
            export ATALAIA_RELEASE_KEY_PASSPHRASE="$pass"
            # Every key the firmware trusts (the same list the build checked in the image): the
            # signature must verify against it, and be the chosen key's.
            trusted="$(printf '%s' "$RELEASE_KEYS_HEX" | tr ' ' ',')"
            # The secret must be the chosen CI key: its id, before anything is signed.
            python3 tools/firmware_release.py pubkey --key "$key" | grep -q "key id: *$key_id\$" ||
              { echo "::error::the secret $secret is not the CI release key $key_id"; exit 1; }
            echo "Signing with the CI release key $key_id (secret $secret)."
          else
            python3 tools/firmware_release.py keygen --unencrypted --out "$key" > /dev/null
            key_id="$(python3 tools/firmware_release.py pubkey --key "$key" | sed -n 's/^key id: *//p')"
            trusted="$(python3 tools/firmware_release.py pubkey --key "$key" | sed -n 's/^public key (base64): *//p')"
            echo "Dry run: signed with a throw-away key; boxes do not trust it. A tag would sign with the CI release key $CI_KEY_NEXT_ID."
          fi
          unset pass
          # Only the Field Box image is updated over the air (the modem and the pod have no
          # Atalaia descriptor, which the release tool needs), so only it has a release.
          for image in dist/atalaia-field-box-*[0-9].bin; do
            python3 tools/firmware_release.py sign "$image" --key "$key" --version "$FW_VERSION"
            out="$(python3 tools/firmware_release.py verify "$image" "$image.release.json" --keys "$trusted")" ||
              { echo "$out"; exit 1; }
            echo "$out"
            printf '%s\n' "$out" | grep -q "signed by key $key_id\$" ||
              { echo "::error::$image is not signed by the CI release key $key_id"; exit 1; }
          done
          rm -rf "$keydir"
      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          # The APK's own checksum file next to it, for a phone user who downloads only the APK.
          for apk in atalaia-app-*.apk; do sha256sum "$apk" > "$apk.sha256"; done
          sha256sum atalaia-* > SHA256SUMS
          cat SHA256SUMS
          # usb.zip and merged.bin of three images, the Field Box's .bin and .release.json, the
          # target module's two .uf2 files, the output module's .uf2, the app's .apk and .apk.sha256,
          # the sums.
          test "$(find . -type f | wc -l)" -eq 14
      - name: On a dry run, keep the files as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish the pre-release (a draft until every asset is up)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # The notes: the pre-alpha warning and the guides, then the tag's CHANGELOG.md section
          # (release-please's list from the pull request titles, and its hand-written Details).
          python3 tools/release_package.py notes --version "$FW_VERSION" --tag "$TAG" --out "$RUNNER_TEMP/notes.md"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # release-please's release, made a draft again by release-please.yml (or a run of this
            # job that failed half-way: --clobber replaces what it uploaded). A published one is live.
            if [ "$draft" != true ]; then
              echo "::error::the release $TAG is published already; delete it (and the tag, if it is wrong) first"; exit 1
            fi
            gh release edit "$TAG" --prerelease --title "$TAG (pre-alpha)" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" dist/* --clobber
          else
            # A tag pushed by hand: no release yet. No partial release: a failure deletes the draft.
            trap 'gh release delete "$TAG" --yes >/dev/null 2>&1 || true' ERR
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
              --title "$TAG (pre-alpha)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release edit "$TAG" --draft=false --prerelease
          trap - ERR
          rm -f "$RUNNER_TEMP/notes.md"
