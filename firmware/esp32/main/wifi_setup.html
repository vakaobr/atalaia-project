<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atalaia Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:16px;max-width:400px;margin:0 auto}
h1{font-size:1.4rem;text-align:center;margin:16px 0;color:#00d4ff}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:0.9rem;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid #444;border-radius:6px;background:#2a2a4a;color:#e0e0e0;font-size:1rem}
input:focus,select:focus{outline:none;border-color:#00d4ff}
button{padding:12px;background:#00d4ff;color:#1a1a2e;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer}
button:active{background:#00a0cc}
.note{font-size:0.75rem;color:#888;text-align:center;margin-top:12px}
a{color:#00d4ff}
</style>
</head>
<body>
<h1 data-i="h1">Atalaia Node Setup</h1>
<form method="POST" action="/config">

<label for="name" data-i="name">Node Name</label>
<input type="text" id="name" name="name" required maxlength="32" placeholder="field-box-01">

<label for="region" data-i="region">Radio Region</label>
<select id="region" name="region" required>
<option value="" data-i="pick">-- select --</option>
<option value="EU868">EU868 (Europe, 868 MHz)</option>
<option value="AS923-TW">AS923-TW (Taiwan, 920-925 MHz)</option>
</select>
<p><small data-i="regionnote">Only the region this box's firmware is built for is accepted.</small></p>

<label for="teams" data-i="teams">Number of Teams</label>
<select id="teams" name="teams">
<option value="2" selected>2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

<label for="pin" data-i="pin">Admin PIN (4-8 digits; not 1234, 0000, a sequence or a repeated pair: there is no default)</label>
<input type="password" id="pin" name="pin" required pattern="[0-9]{4,8}" minlength="4" maxlength="8" inputmode="numeric" autocomplete="new-password">

<label for="brightness" data-i="bri">Display Brightness</label>
<input type="range" id="brightness" name="brightness" min="10" max="100" value="80">

<label for="volume" data-i="vol">Audio Volume</label>
<input type="range" id="volume" name="volume" min="0" max="100" value="70">

<label for="joinkey" data-i="key">Field join key (optional, 64 hex digits)</label>
<input type="text" id="joinkey" name="joinkey" pattern="[0-9a-fA-F]{64}" maxlength="64" autocomplete="off" spellcheck="false" placeholder="python -m atalaia_controller join-key">

<label for="wifissid" data-i="ssid">Field Wi-Fi name (optional: firmware updates)</label>
<input type="text" id="wifissid" name="wifissid" maxlength="32" autocomplete="off" spellcheck="false">

<label for="wifipass" data-i="pass">Field Wi-Fi password (8-64 characters, or none for an open network)</label>
<input type="password" id="wifipass" name="wifipass" maxlength="64" autocomplete="off">

<button type="submit" data-i="save">Save &amp; Reboot</button>
</form>
<p class="note" data-i="foot">Connect to the node Wi-Fi and visit this page to configure.</p>
<p class="note"><a href="/?lang=en">English</a> · <a href="/?lang=pt">Português</a> · <a href="/?lang=de">Deutsch</a> · <a href="/?lang=zh-tw">繁體中文</a></p>
<script>
(function(){var D={
pt:{t:"Configuração Atalaia",h1:"Configuração da caixa Atalaia",name:"Nome da caixa",region:"Região de rádio",pick:"-- escolher --",regionnote:"Só é aceite a região para a qual o firmware desta caixa foi feito.",teams:"Número de equipas",pin:"PIN de administração (4 a 8 algarismos; não 1234, 0000, uma sequência ou um par repetido: não há PIN por defeito)",bri:"Brilho do ecrã",vol:"Volume do som",key:"Chave de ligação ao campo (opcional, 64 algarismos hexadecimais)",ssid:"Nome do Wi-Fi do campo (opcional: atualizações do firmware)",pass:"Palavra-passe do Wi-Fi do campo (8 a 64 caracteres, ou nenhuma numa rede aberta)",save:"Guardar e reiniciar",foot:"Liga-te ao Wi-Fi da caixa e abre esta página para a configurar."},

</body>
</html>
