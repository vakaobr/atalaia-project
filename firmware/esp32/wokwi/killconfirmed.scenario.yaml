#
# The Kill Confirmed station (a phase 3 mode) in the Wokwi emulator, about
# 15 s of simulated time: boot, enter the admin PIN and pick Kill Confirmed
# (game 6 of the built-in presets), start: the box announces the mode to the
# display and draws the mode's own YAML screen (modes/kill_confirmed/assets/
# screens/tags.yaml). Red presses its button: the station opens for red.
# Then a player tag is read through the serial console ("@tag", as the NFC
# reader would; the payload is the red_player vector of
# protocol/vectors/tag.json): a stand-alone game has no game key, so the
# box reports it as not valid (reason no_game) and the mode refuses it.
#
#   cd firmware/esp32
#   wokwi-cli --timeout 60000 --scenario wokwi/killconfirmed.scenario.yaml .
name: Kill Confirmed station on the Field Box
version: 1
author: The Atalaia contributors

steps:
  - wait-serial: 'screen pin_entry {"digits":0,"error":false}'
  - write-serial: '1234#'
  - wait-serial: 'screen preset_select'
  - write-serial: '6#'
  - wait-serial: 'screen timer_adjust'
  - write-serial: '#'
  - wait-serial: 'screen start_confirm'
  - write-serial: '#'
  - wait-serial: 'screen @mode org.atalaia.kill_confirmed {"confirm_points":1'
  - wait-serial: 'screen tags {}'
  - delay: 1000ms
  - take-screenshot:
      part-id: lcd1
      save-to: ../build-wokwi/kill-1-station.png

  # Red presses its button: the station opens for red for 20 s.
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: 'screen tags {"error":false,"left":20,"message":"Scan your tags","team":"red"}'
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 1000ms
  - take-screenshot:
      part-id: lcd1
      save-to: ../build-wokwi/kill-2-open.png

  # A signed player tag: refused, as a stand-alone game has no game key.
  - write-serial: "@tag 04a1b2c3d4e5f6 01702d31370110928955556ca3d184f4a2d749c851a56e12\n"
  - wait-serial: 'field: tag {"uid":"04a1b2c3d4e5f6","valid":false,"reason":"no_game"}'
  - wait-serial: '"message":"No game: join one first"'
  - delay: 1000ms
  - take-screenshot:
      part-id: lcd1
      save-to: ../build-wokwi/kill-3-refused.png
