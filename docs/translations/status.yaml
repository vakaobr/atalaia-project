#
# The project's languages and the state of each translation (docs/translations/README.md).
# tools/i18n_check.py reads it: a "complete" language must have every key of English in every
# domain it lists (a missing key fails the check); any other language may lack keys, which then
# show in English, and the check lists them as warnings (decision P5H-2). Every language must
# have the same placeholders as English and no key English lacks.
#
# review: who wrote it and who checked it. A translation drafted by a machine or an AI model
# says so here until a native speaker who plays has reviewed it (decision P5H-5); a release
# note names every language still "draft".

languages:
  en:
    name: English
    status: complete
    review: the base language; every text is written in English first
  pt:
    name: Português (Portugal)
    status: complete
    review: written by the maintainer and the project's contributors, European Portuguese
  de:
    name: Deutsch
    status: draft
    drafted: 2026-10-22
    # Texts added in English and Portuguese after the draft (the GM console's scenario blocks and
    # hidden areas, the app's phone controller and out-of-bounds warning) drafted the same way,
    # and, on 2026-10-27, the indoor beacons' texts (the console's panel, the app's explanation).
    gaps_filled: 2026-10-27
    # The built-in modes (mode.yaml i18n.de, their screen templates, the Medic Kit's refusals, the
    # registry's sample) and the site server's pages, drafted the same way (P5H-7, P5H-8, P5H-12).
    modes_and_server: 2026-10-23
    review: >-
      drafted by an AI model (Claude) on 2026-10-22 and 2026-10-23, not yet reviewed by a
      native-speaking player. Review it with docs/translations/glossary.md, then set status to
      complete and name the reviewer here.
    reviewed_by: null
    # Where German exists: modes is the built-in modes' manifests (their screen templates are
    # checked by the mode tests and the reference images *_de.png), server the site server's pages.
    domains: [site, console, editor, app, box, modes, server]
  zh-tw:
    name: 繁體中文（台灣）
    status: draft
    drafted: 2026-10-22
    # The built-in modes and the site server's pages, as German's (P5H-12, P5K-13).
    modes_and_server: 2026-10-23
    review: >-
      Traditional Chinese as written in Taiwan, drafted by an AI model (Claude) on 2026-10-22 and
      2026-10-23, not yet reviewed by a native-speaking player. Review it with
      docs/translations/glossary.md (the zh-tw column), in the running console, app, editor and
      site server pages and in the box's reference images
      (firmware/esp32/test/screens/*_zh-tw.png), then set status to complete and name the
      reviewer here.
    reviewed_by: null
    # Where Traditional Chinese exists (modes and server as German's).
    domains: [site, console, editor, app, box, modes, server]
