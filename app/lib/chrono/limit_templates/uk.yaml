name: United Kingdom
status: unverified
warning: >-
  Unverified: check against current national/association rules before use.
  These figures come from the Atalaia project's research, not from an
  official source.
source: >-
  Atalaia phase 3 research notes (RESEARCH.md section 5): site limits
  commonly quoted in the UK. The research attributed them to UKARA, which is
  a retailers' registration scheme rather than a body that sets field limits;
  UK law sets its own ceilings, which these figures were not checked against.
verified_date: null
notes: >-
  The figures in fps assume 0.20 g BBs (1.64 J is about 420 fps). The
  minimum engagement distances are the research's typical values for any
  field; it gave none for the UK.
