#
# The Atalaia app (README.md). Dependencies are pinned to exact versions and
# pubspec.lock is committed; tools/docker_app.py and CI run
# `flutter pub get --enforce-lockfile` in ghcr.io/cirruslabs/flutter:3.44.0.
# To change a dependency: edit the pin here, then `python tools/docker_app.py lock`.
name: atalaia_app
description: >-
  Atalaia's app for players, marshals, GMs and Android props: the prop shell
  that runs a game mode on the shared C core (dart:ffi, game loop isolate)
  and draws its YAML screens, the player and GM views, the marshal's chrono
  check-in, player tags and join cards.
publish_to: none
version: 0.5.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Material widgets' own strings in European Portuguese (part of the SDK).
  flutter_localizations:
    sdk: flutter
  # HMAC-SHA256 for player tags, player tokens and join payloads (Dart team, pure Dart).
  crypto: 3.0.7
  # Ed25519 for chrono records; the pure-Dart implementation (DartEd25519) is used.
  cryptography: 2.9.0
  # calloc, malloc and UTF-8 strings for the dart:ffi bridge to the core (Dart team).
  ffi: 2.2.0
  # ECDSA P-256 for the field CA a phone controller makes (slice S6 of PE24,
  # field_tls.dart): key generation and RFC 6979 signatures (the Legion of
  # the Bouncy Castle, pure Dart). The certificates' DER is the app's own.
  pointycastle: 4.0.0
  # QR code matrices for the qr_code template widget (kevmoo.com, pure Dart);
  # the app draws the modules itself (lib/ui/qr_painter.dart).
  qr: 4.0.0
  # The GM role shows the field controller's GM console (flutter.dev; the
  # system WebView on Android, WKWebView on iOS).
  webview_flutter: 4.14.1
  # Limit templates, mode manifests and screen templates.
  yaml: 3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests (integration_test/, CI's flutter-integration job).
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/chrono/limit_templates/
    # The GM console (controller/console/src) and the check-in notices
    # (controller/templates/checkin-notice-*.md), copied in at build time by
    # tool/sync_console.dart (app/tool/check.sh, CI); never committed here
    # (.gitignore). A phone controller serves them (slice S6 of PE24, PE24-61).
    # Flutter's asset folders are not recursive: one line per folder, which
    # test/controller/console_bundle_test.dart checks against the console.
    - assets/console/
    - assets/console/components/
    - assets/console/i18n/
    - assets/console/icons/
    - assets/console/lib/
    - assets/console/lib/blockly/
    - assets/console/lib/blockly/media/
    - assets/console/lib/blockly/msg/
    - assets/notices/
    # The list of APDs (registry/apds/apds.json, copied byte for byte; protocol/apd.md).
    - assets/apds.json
