# Per-folder licensing, following the REUSE specification (https://reuse.software).
# When several annotations match a file, the last one wins.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["controller/**", "server/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The GM console is browser code, always delivered as source: GPL-3.0-or-later with the
# app-store permission (app/APP-STORE-PERMISSION.md), so the app can ship it (decision PE24-8).
[[annotations]]
path = "controller/console/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "hardware/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = ["docs/**", "site/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored Lua 5.4 keeps its own MIT licence (see the notice in lua.h).
[[annotations]]
path = "core/third_party/lua/**"
precedence = "override"
SPDX-FileCopyrightText = "1994-2026 Lua.org, PUC-Rio"
SPDX-License-Identifier = "MIT"

# The project page's copies of the Field Box's wiring drawings (tools/build_site.py WIRING) keep the
# hardware folder's licence.
[[annotations]]
path = "site/img/wiring/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The Atalaia contributors"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Barlow fonts for the project page keep their own licence (SIL OFL 1.1).
[[annotations]]
path = "site/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 The Barlow Project Authors (https://github.com/jpt/barlow)"
SPDX-License-Identifier = "OFL-1.1"

# stb single-file headers, vendored for the firmware's screen tests only:
# MIT or public domain (Unlicense), at the user's choice (see the end of each file).
[[annotations]]
path = ["firmware/esp32/test/third_party/stb/stb_image.h", "firmware/esp32/test/third_party/stb/stb_image_write.h"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

# The GM console's vendored ES modules (controller/console/src/lib/README.md has
# their versions and checksums), unmodified from their npm packages.
[[annotations]]
path = "controller/console/src/lib/preact.module.js"
precedence = "override"
SPDX-FileCopyrightText = "2015-present Jason Miller"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "controller/console/src/lib/htm.module.js"
precedence = "override"
SPDX-FileCopyrightText = "2018 Google Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "controller/console/src/lib/qrcode.module.js"
precedence = "override"
SPDX-FileCopyrightText = "2009 Kazuhiko Arase"
SPDX-License-Identifier = "MIT"

# The mode editor's vendored Blockly 13.3.0
# (simulator/atalaia_sim/editor/vendor/blockly/README.md has its files and checksums),
# unmodified from its npm package; its README is the project's own.
[[annotations]]
path = [
    "simulator/atalaia_sim/editor/vendor/blockly/*.js",
    "simulator/atalaia_sim/editor/vendor/blockly/msg/*.js",
    "simulator/atalaia_sim/editor/vendor/blockly/media/**",
    # The same files, for the GM console's scenario blocks (controller/console/src/lib/README.md).
    "controller/console/src/lib/blockly/*.js",
    "controller/console/src/lib/blockly/msg/*.js",
    "controller/console/src/lib/blockly/media/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2011 Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# The site server's breached-password list (ADR-P4-2) as hashes, derived from
# SecLists' Passwords/Common-Credentials/100k-most-used-passwords-NCSC.txt at
# commit 1a7bb9127eca9e6ff2fc0301c597fe6e16a0cb56 under SecLists' MIT licence
# by tools/breached_hashes.py (decision S11-4).
[[annotations]]
path = "server/atalaia_server/data/breached-passwords.sha256"
precedence = "override"
SPDX-FileCopyrightText = "2018 Daniel Miessler and the SecLists contributors"
SPDX-License-Identifier = "MIT"

# Monocypher 4.0.2, vendored unmodified for the Field Box's Ed25519 check of firmware
# releases (firmware/esp32/components/monocypher/README.md has the version and checksums):
# CC0-1.0 or BSD-2-Clause, at the user's choice (its LICENCE.md).
[[annotations]]
path = ["firmware/esp32/components/monocypher/src/**", "firmware/esp32/components/monocypher/LICENCE.md"]
precedence = "override"
SPDX-FileCopyrightText = ["2017-2023 Loup Vaillant", "2017-2019 Michael Savage", "2017-2023 Fabio Scotoni"]
SPDX-License-Identifier = "CC0-1.0 OR BSD-2-Clause"

# A subset of Noto Sans TC 2.004 (notofonts/noto-cjk, Sans/SubsetOTF/TC) for the app's
# widget tests only, which have no system CJK font (app/test/fonts/README.md): SIL OFL 1.1.
[[annotations]]
path = "app/test/fonts/NotoSansTC-*-subset.otf"
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/)"
SPDX-License-Identifier = "OFL-1.1"
