<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atalaia mode editor</title>
  <link rel="stylesheet" href="editor.css">
  <!-- Blockly 13.3.0, vendored unmodified (vendor/blockly/README.md): no network needed. -->
  <script src="vendor/blockly/blockly_compressed.js"></script>
  <script src="vendor/blockly/blocks_compressed.js"></script>
  <script src="vendor/blockly/lua_compressed.js"></script>
  <script src="vendor/blockly/msg/en.js"></script>
  <script type="module" src="editor.js"></script>
</head>
<body>
  <header class="bar">
    <div class="title">
      <span class="brand">Atalaia</span>
      <span class="sub" data-i18n="brand_sub">Mode editor</span>
    </div>
    <div class="group">
      <button id="new" type="button" data-i18n="new">New</button>
      <label class="button" for="open-file"><span data-i18n="open">Open…</span></label>
      <input id="open-file" type="file" accept=".json,application/json" hidden>
      <button id="save" type="button" data-i18n="save">Save blocks</button>
      <select id="example" aria-label="Examples">
        <option value="" data-i18n="example_pick">Load an example…</option>
        <option value="domination" data-i18n="example_domination">Domination</option>
        <option value="holdall" data-i18n="example_holdall">Hold-All Domination</option>
      </select>
    </div>
    <div class="group">
      <label class="lang"><span data-i18n="test_boxes">Boxes</span>
        <input id="test-boxes" class="boxes" type="number" min="1" max="16" value="3">
      </label>
      <button id="test" type="button" class="primary" data-i18n="test">Test in the simulator</button>
    </div>
    <div class="group">
      <label class="lang"><span data-i18n="language">Language</span>
        <select id="lang">
          <option value="pt">Português</option>
          <option value="en">English</option>
        </select>
      </label>
      <a class="button" href="/" target="atalaia-sim" data-i18n="simulator">Simulator</a>
    </div>
  </header>

  <p class="intro muted small" data-i18n="intro"></p>
  <p id="test-status" class="test-status small" role="status" hidden>
    <span id="test-message"></span>
    <a id="test-open" href="/" target="atalaia-sim" data-i18n="test_open">Open the game</a>
  </p>

  <main class="layout">
    <section class="editor-pane">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-node" data-tab="node" aria-selected="true" data-i18n="tab_node">Boxes (node.lua)</button>
        <button type="button" role="tab" id="tab-field" data-tab="field" aria-selected="false" data-i18n="tab_field">Controller (field.lua)</button>
        <button type="button" role="tab" id="tab-mode" data-tab="mode" aria-selected="false" data-i18n="tab_mode">Mode</button>
      </div>
      <div class="stage">
        <div id="ws-node" class="ws active" role="tabpanel" aria-labelledby="tab-node"></div>
        <div id="ws-field" class="ws" role="tabpanel" aria-labelledby="tab-field"></div>
        <form id="mode-form" class="mode-form ws" role="tabpanel" aria-labelledby="tab-mode">
          <label><span data-i18n="mode_id">Mode id</span><input name="id" spellcheck="false" required></label>
          <label><span data-i18n="mode_version">Version</span><input name="version" spellcheck="false"></label>
          <label><span data-i18n="mode_name">Name</span><input name="name"></label>
          <label><span data-i18n="mode_description">Description</span><textarea name="description" rows="2"></textarea></label>
          <label><span data-i18n="mode_name_pt">Name in Portuguese</span><input name="name_pt" lang="pt-PT"></label>
          <label><span data-i18n="mode_description_pt">Description in Portuguese</span><textarea name="description_pt" rows="2" lang="pt-PT"></textarea></label>
          <label><span data-i18n="mode_role">Role</span><input name="role" spellcheck="false"></label>
          <label><span data-i18n="mode_license">Licence</span><select name="license"></select></label>
          <label><span data-i18n="mode_tier">Smallest box</span>
            <select name="min_tier">
              <option value="reduced" data-i18n="tier_reduced">Reduced</option>
              <option value="full" data-i18n="tier_full">Full</option>
            </select>
          </label>
          <label><span data-i18n="mode_author">Copyright holder</span><input name="author"></label>
          <p class="muted small" data-i18n="mode_hint"></p>
        </form>
      </div>
    </section>

    <aside class="preview-pane">
      <h2 data-i18n="preview">Generated files</h2>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-file="node_lua" aria-selected="true">node.lua</button>
        <button type="button" role="tab" data-file="field_lua" aria-selected="false">field.lua</button>
        <button type="button" role="tab" data-file="mode_yaml" aria-selected="false">mode.yaml</button>
      </div>
      <pre id="code" class="code" tabindex="0"></pre>
      <p id="no-field" class="muted small" data-i18n="no_field" hidden></p>
      <button id="download" type="button" data-i18n="download">Download this file</button>
      <section class="problems-panel">
        <h2 data-i18n="problems">Problems</h2>
        <p id="no-problems" class="muted small" data-i18n="no_problems">No problems found.</p>
        <ul id="problems" class="problems"></ul>
      </section>
    </aside>
  </main>
</body>
</html>
