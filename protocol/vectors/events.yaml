#
# Codec test vectors for events: the C codec (core/tests/test_codec.c) and
# the Python codec (simulator/tests/test_codec.py) must both turn each
# valid event into exactly these bytes and back, and reject every invalid
# payload. Events are JSON; team, squad and prio may be left out (none, none
# and the event's default). After editing, run python3 tools/protogen.py.

valid:
  - name: "Red arms the bomb"
    event: {"node": 1, "seq": 1, "t": 5000, "type": "bomb.armed", "team": 1, "data": {"fuse_s": 300, "team": "red"}}
    cbor: "a6 01 01 02 01 03 19 13 88 04 07 05 01 08 a2 07 19 01 2c 01 63 72 65 64"
  - name: "A squad captures a zone"
    event: {"node": 3, "seq": 17, "t": 734210, "type": "zone.captured", "team": 2, "data": {"previous_team": "red", "squad": "blue-2", "team": "blue"}}
    cbor: "a6 01 03 02 11 03 1a 00 0b 34 02 04 05 05 02 08 a3 04 63 72 65 64 02 66 62 6c 75 65 2d 32 01 64 62 6c 75 65"
  - name: "The controller starts the game"
    event: {"node": 0, "seq": 1, "t": 0, "type": "game.start", "data": {"preset": "org.atalaia.domination"}}
    cbor: "a5 01 00 02 01 03 00 04 01 08 a1 09 76 6f 72 67 2e 61 74 61 6c 61 69 61 2e 64 6f 6d 69 6e 61 74 69 6f 6e"
  - name: "An event without data or team"
    event: {"node": 0, "seq": 2, "t": 60000, "type": "game.resume"}
    cbor: "a4 01 00 02 02 03 19 ea 60 04 03"
  - name: "A priority other than the default is sent"
    event: {"node": 2, "seq": 9, "t": 1000, "type": "zone.captured", "team": 1, "prio": "critical", "data": {"team": "red"}}
    cbor: "a7 01 02 02 09 03 19 03 e8 04 05 05 01 07 02 08 a1 01 63 72 65 64"
  - name: "A penalty"
    event: {"node": 2, "seq": 10, "t": 1250, "type": "score.delta", "team": 2, "data": {"amount": -50, "reason": "foul", "team": "blue"}}
    cbor: "a6 01 02 02 0a 03 19 04 e2 04 0b 05 02 08 a3 06 38 31 03 64 66 6f 75 6c 01 64 62 6c 75 65"
  - name: "A custom event travels by name, with any data"
    event: {"node": 4, "seq": 300, "t": 100000, "type": "x.myclub.power_plant.upgraded", "team": 1, "data": {"level": 3, "nested": {"none": null, "ok": true}, "ratio": 2.5, "tags": ["a", "b"], "team": "red"}}
    cbor: "a6 01 04 02 19 01 2c 03 1a 00 01 86 a0 04 78 1d 78 2e 6d 79 63 6c 75 62 2e 70 6f 77 65 72 5f 70 6c 61 6e 74 2e 75 70 67 72 61 64 65 64 05 01 08 a5 65 6c 65 76 65 6c 03 66 6e 65 73 74 65 64 a2 64 6e 6f 6e 65 f6 62 6f 6b f5 65 72 61 74 69 6f f9 41 00 64 74 61 67 73 82 61 61 61 62 01 63 72 65 64"
  - name: "Custom events default to normal priority"
    event: {"node": 4, "seq": 301, "t": 100001, "type": "x.myclub.alarm", "prio": "critical"}
    cbor: "a5 01 04 02 19 01 2d 03 1a 00 01 86 a1 04 6e 78 2e 6d 79 63 6c 75 62 2e 61 6c 61 72 6d 07 02"
  - name: "Floats use the shortest exact width"
    event: {"node": 5, "seq": 1, "t": 1, "type": "x.test.floats", "data": {"double": 0.1, "half": 1.5, "negative_zero": -0.0, "single": 100000.5, "whole": 3.0}}
    cbor: "a5 01 05 02 01 03 01 04 6d 78 2e 74 65 73 74 2e 66 6c 6f 61 74 73 08 a5 66 64 6f 75 62 6c 65 fb 3f b9 99 99 99 99 99 9a 64 68 61 6c 66 f9 3e 00 6d 6e 65 67 61 74 69 76 65 5f 7a 65 72 6f f9 80 00 66 73 69 6e 67 6c 65 fa 47 c3 50 40 65 77 68 6f 6c 65 f9 42 00"
  - name: "Integers of every width"
    event: {"node": 5, "seq": 2, "t": 2, "type": "x.test.integers", "data": {"i16": 1000, "i32": 100000, "i64": 4294967296, "i8": 24, "max": 9223372036854775807, "min": -9223372036854775808, "neg": -25}}
    cbor: "a5 01 05 02 02 03 02 04 6f 78 2e 74 65 73 74 2e 69 6e 74 65 67 65 72 73 08 a7 63 69 31 36 19 03 e8 63 69 33 32 1a 00 01 86 a0 63 69 36 34 1b 00 00 00 01 00 00 00 00 62 69 38 18 18 63 6d 61 78 1b 7f ff ff ff ff ff ff ff 63 6d 69 6e 3b 7f ff ff ff ff ff ff ff 63 6e 65 67 38 18"
  - name: "Text with escapes and non-ASCII characters"
    event: {"node": 6, "seq": 1, "t": 30000, "type": "gm.message", "data": {"audience": "all", "text": "Bomba plantada — ação!\n\"Go\" \\ \t\u0001"}}
