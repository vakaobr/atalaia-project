# Capability proxy protocol v1 vectors (protocol/capability-proxy.md). Every codec
# (C: core/tests/test_proxy.c and firmware/esp32/test/test_proxy_codec.c; Python:
# simulator/tests/test_capability_proxy.py; Dart: the player app) must turn each
# vector's fields into exactly its payload and frame and back, and refuse every
# invalid payload. Byte strings are hex. Written with the Python reference codec;
# after editing, run python3 tools/protogen.py (core/tests/proxy_vectors.h).

