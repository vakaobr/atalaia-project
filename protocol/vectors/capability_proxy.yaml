# Field and pair frames through the pod (decisions PE24-100 to PE24-103): the modem's FIELD_TX,
# FIELD_RX and FIELD_ACK plus 3 (0x0C-0x0E), payloads unchanged, and IDENT's optional bools
# (keys 6 field_frames, 7 pair_frames, 8 measure). A section of their own, so that a codec
# written before them still passes the sections above; the C and Python codecs check both.
# The field frame is field_frame.json's announce_minimal, the pair frame pairing.json's offer.
pod_relay:
  ident:
    - name: pod_relays
      fields: {"fw_version": "0.3.0", "capabilities": [{"id": "btn.1", "type": "button"}], "battery_pct": 87, "has_radio": true, "protocol_version": 1, "field_frames": true, "pair_frames": true, "measure": true}
