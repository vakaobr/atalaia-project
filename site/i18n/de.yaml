hero:
  status: >-
    Pre-Alpha · Software der Phasen 1 und 2 fertig; echte Boards spielen auf dem Labortisch ganze
    Spiele mit dem Feld-Controller, mit Tastenfeld; Phase 3 in Software fertig, die iOS-App auf
    einem iPhone geprüft; der Site-Server aus Phase 4 läuft auf einem Testserver; Phase 5 in
    Software gebaut · neueste Version v0.12.0 · noch nicht feldtauglich
  title: Die offene Plattform für <span class="nowrap">Force-on-Force</span>
  lead: >-
    Atalaia ist eine offene Plattform für die elektronischen Props von Airsoft, Paintball und
    Milsim: die Boxen, die Teams einnehmen, die Bomben, die sie scharf machen und entschärfen. Bau
    eine Domination-Box aus einem
    <a href="{{ page.to.glossary }}#glossar-mikrocontroller">Mikrocontroller</a> für 20&nbsp;€ (eine
    winzige, günstige Computerplatine), mach aus einem alten Android-Handy ein Hacking-Terminal, lass
    ein Milsim-Wochenende mit 20 Boxen über ein <a href="{{ page.to.glossary }}#glossar-lora">LoRa-Mesh</a>
    laufen (Funk mit großer Reichweite und wenig Strom, den die Boxen über das Feld weiterreichen),
    und schreib deine eigenen Spielmodi als kleine Skripte. Jedes Spiel läuft auf dem Feld selbst:
    keine Cloud, kein Internet nötig, und kein Hersteller kann dich festnageln.
  discuss: Mitdiskutieren
  design: Das Design lesen
  source: Quellcode auf GitHub
  name: >-
    <em>Atalaia</em> (a-ta-LAI-a) ist Portugiesisch für <em>Wachturm</em>: ein Ausguck auf einem
    Hügel, der nach Gefahr Ausschau hielt und die Warnung weitergab.
  why_name: Warum dieser Name?
  # The night scene: German shows the English copy (its title is painted in English).
  image_alt: >-
    Illustration: In der Dämmerung trägt ein steinerner Wachturm auf einem Hügel eine Funkbox, deren
    Signale leuchtende orange GAME-PROP-Boxen in einem bewaldeten Tal erreichen, während eine Gruppe
    Spielender an ihnen vorbeigeht. Der aufgemalte englische Text lautet „Open-source project
    ATALAIA“.

game:
  title: So läuft ein Spiel
  intro: >-
    Zum Spielen brauchst du kein Technikwissen. So wird ein Spiel laufen, sobald die Boxen gebaut sind
    (Phasen 1 und 2); der <a href="{{ page.to.glossary }}#glossar-simulator">Simulator</a> spielt
    dieselben Modi heute schon auf einem Computer.
  setup:
    title: Aufbauen
    text: >-
      Die Orga verteilt die Boxen auf dem Feld und wählt einen Spielmodus, etwa Domination, am
      Tastenfeld einer Box oder am Handy, in weniger als einer Minute.
  capture:
    title: Einnehmen
    text: >-
      Um eine Box einzunehmen, hält ein Team ein paar Sekunden lang den Knopf seiner Farbe gedrückt.
      Die Box leuchtet in dieser Farbe und punktet für das Team, bis die Gegenseite sie zurückholt.
  relay:
    title: Weiterleiten
    text: >-
      Jede Box meldet sich per Funk beim
      <a href="{{ page.to.glossary }}#glossar-feld-controller">Feld-Controller</a>, einem kleinen
      Computer in der Basis; weit entfernte Boxen werden von denen dazwischen weitergeleitet. Eine
      Box, die den Kontakt verliert, spielt weiter und holt später auf.
  score:
    title: Punkten
    text: >-
      Der Controller zählt alles zusammen. Die Orga verfolgt das Spiel live auf dem Handy, und das
      Feld kann den Punktestand auf einem großen Bildschirm oder in einem Stream zeigen.

why:
  title: Warum Atalaia
  intro: >-
    Elektronische Props bringen viel ins Spiel, aber kommerzielle Systeme sperren die Regeln in
    geschlossene <a href="{{ page.to.glossary }}#glossar-firmware">Firmware</a>. Neue Modi warten auf
    den Hersteller, es gibt keine öffentliche
    <a href="{{ page.to.glossary }}#glossar-api">API</a>, und eigene Hardware kannst du nicht
    einbinden. Atalaia macht es anders.
  local:
    title: Local-first
    text: >-
      Jedes Spiel läuft <a href="{{ page.to.glossary }}#glossar-local-first">auf dem Feld selbst</a>,
      komplett offline, vom einzelnen Haus bis zum kilometergroßen Wald. Internet ist optional.
  hardware:
    title: Jede Hardware
    text: >-
      Günstige <a href="{{ page.to.glossary }}#glossar-esp32">ESP32</a>-Boards, scheckkartengroße
      <a href="{{ page.to.glossary }}#glossar-raspberry-pi">Raspberry-Pi</a>-Computer, einfache
      Boards der <a href="{{ page.to.glossary }}#glossar-arduino">Arduino-Klasse</a> und neue oder
      ausgediente <a href="{{ page.to.glossary }}#glossar-android-prop">Android-Handys</a> haben alle
      ihren Platz im selben Spiel. Die Software für die ESP32-Boxen, den Feld-Controller und
      Android-Handys ist geschrieben; die Boards der Arduino-Klasse kommen später.
  scripts:
    title: Modi sind Skripte
    text: >-
      Spielmodi sind kurze <a href="{{ page.to.glossary }}#glossar-lua">Lua-Skripte</a>, kleine
      Textdateien mit Regeln, plus eine Datei mit Einstellungen: leicht zu lesen, zu ändern und zu
      teilen, und kein Modus braucht eigenen Code in der eingebauten Software der Boxen. Die Boxen haben
      ihre Modi eingebaut, und zwischen den Spielen kann eine Box einen neuen, signierten Modus vom
      Feld-Controller bekommen, ohne diese Software neu zu flashen (neu zu installieren): gebaut,
      noch nicht auf einer echten Box ausprobiert.
  open:
    title: Offenes Protokoll und API
    text: >-
      Props sprechen <a href="{{ page.to.glossary }}#glossar-skirmesh-rf">Skirmesh-RF</a>, ein
      dokumentiertes Funkprotokoll, also kann jede und jeder ein Gerät bauen, das mitspielt. Der
      Feld-Controller bietet MQTT-, REST- und WebSocket-APIs für Anzeigetafeln, Stream-Overlays und
      andere Tools.
  fields:
    title: Fürs Spielfeld gebaut
    text: >-
      Rollen, Squads, Check-in am Feld mit einem gedruckten Aushang und ein
      <a href="{{ page.to.glossary }}#glossar-chrono">Chrono</a>-Register, das die signierten Messwerte
      jeder Replik für Stichproben aufbewahrt, sind in Software gebaut; eigene Szenarien kommen in
      Phase&nbsp;4.
  copyleft:
    title: Copyleft
    text: >-
      Felder, die Eintritt nehmen, und Leute, die Boxen verkaufen, sind willkommen. Wer eine geänderte
      Version weitergibt oder betreibt, <a href="{{ page.to.glossary }}#glossar-copyleft">teilt die
      Änderungen</a>.

how:
  title: Wie alles zusammenpasst
  intro: >-
    Einfach gesagt: Die Props auf dem Feld funken mit dem Feld-Controller, einem kleinen Computer in
    der Basis, der das Spiel leitet und die Punkte zählt. Handys verbinden sich per WLAN mit ihm,
    Anzeigetafeln, Stream-Overlays und Karten-Apps wie
    <a href="{{ page.to.glossary }}#glossar-atak">ATAK</a> über seine API. Ein optionaler
    <a href="{{ page.to.glossary }}#glossar-site-server">Site-Server</a> im Internet verwaltet Konten
    und Verlauf. Der Controller, seine API und die Konsole der Orga sind gebaut und spielen auf dem
    Labortisch mit echten Boxen, noch nicht auf dem Feld; der Site-Server ist ebenfalls gebaut und
    läuft auf einem Testserver, noch nicht auf einem echten Feld.
  core: >-
    Unter der Haube nutzt jedes Gerät, das Spielmodi ausführt, denselben
    <a href="{{ page.to.glossary }}#glossar-kern">gemeinsamen Kern</a>, geschrieben in C11, und
    dieselben Lua-Modi; nur eine dünne Schicht pro Hardware-Art ist anders. Ein einmal geschriebener
    Modus läuft auf einer Box, einem Handy oder einem Raspberry Pi gleich.
  diagram:
    title: >-
      Ein optionaler Site-Server verbindet sich über das Internet mit dem Feld-Controller. Apps für
      Spielleitung und Spielende erreichen den Controller per WLAN, Anzeigetafeln und andere Tools
      über MQTT und REST, Props über das LoRa-Mesh Skirmesh-RF.
    server: Site-Server (optional)
    server_sub: Konten · Verlauf · Spieler-App
    apps: Apps für GM und Spielende
    apps_sub: WLAN
    controller: Feld-Controller
    controller_sub: Raspberry Pi oder Android
    tools: Anzeigetafeln, ATAK
    tools_sub: MQTT, REST, Webhooks
    mesh: Skirmesh-RF · LoRa-Mesh
    satellite: Satellit
    android: Android-Prop
    android_sub: mit einem ESP32-Pod
    thin: Thin Node
    thin_sub: Arduino-Klasse
  list:
    server: >-
      <strong>Site-Server</strong> (optional): Konten, Verlauf und die Spieler-App, über das
      Internet.
    controller: >-
      <strong>Feld-Controller</strong> auf einem Raspberry Pi oder Android: Apps für GM und Spielende
      verbinden sich per WLAN; Anzeigetafeln und ATAK nutzen MQTT, REST und Webhooks.
    props: >-
      <strong>Props</strong> im LoRa-Mesh Skirmesh-RF: ESP32-<a href="{{ page.to.glossary }}#glossar-field-box">Field
      Boxes und Satelliten</a>, Android-Props mit einem ESP32-Pod und Thin Nodes der Arduino-Klasse.
  # English and German pages only: the Portuguese page shows this image in its hero.
  image_alt: >-
    Isometrische Illustration: Ein kleiner Steinturm mit einer Funkbox darauf steht in der Mitte einer
    quadratischen Basis, umringt von acht orangen und gelben GAME-PROP-Koffern mit Antennen, alle
    verbunden durch einen leuchtenden Kreis.
  image_caption: >-
    Der Feld-Controller ist der Wachturm: Von der Mitte des Felds behält er jedes Prop im Blick.

radio:
  title: So funktioniert der Funk
  intro: >-
    Die Props funken über <a href="{{ page.to.glossary }}#glossar-lora">LoRa</a>, einen Funk mit
    großer Reichweite und wenig Strombedarf, im eigenen Protokoll von Atalaia,
    <a href="{{ page.to.glossary }}#glossar-skirmesh-rf">Skirmesh-RF</a>. Diese zwei Diagramme
    zeigen, was LoRa auf einem Feld kann und was nicht, und wie ein Protokoll auf sehr
    unterschiedlichen Geräten läuft. Nichts davon war schon auf einem echten Feld: Reichweite und
    Timing werden im Feldtest von Phase&nbsp;2 gemessen.
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    Die Props funken über <a href="{{ page.to.glossary }}#glossar-lora">LoRa</a>, einen Funk mit
    großer Reichweite und wenig Strombedarf, im eigenen Protokoll von Atalaia,
    <a href="{{ page.to.glossary }}#glossar-skirmesh-rf">Skirmesh-RF</a>. Zwei Diagramme zeigen, was
    LoRa auf einem Feld kann und was nicht, und wie ein Protokoll auf sehr unterschiedlichen Geräten
    läuft. Nichts davon war schon auf einem echten Feld.
  more: So funktioniert der Funk, in zwei Diagrammen →
  # Each diagram's alt text is its description, diagrams.*.desc, also used inside the SVG.
  lora:
    title: Was LoRa kann
    lead: >-
      LoRa tauscht Tempo gegen Reichweite: Es bringt kurze Nachrichten mit sehr wenig Akku über ein
      Feld, und sein Signal kommt besser durch Wände und Bäume als WLAN, auch wenn Beton, Metall und
      Hügel es weiter blockieren. Eine Box, die den Controller nicht erreicht, wird über die anderen
      Boxen gehört, und die europäischen Regeln begrenzen, wie viel der Zeit jedes Gerät senden darf.
  skirmesh:
    title: Ein Protokoll auf jedem Gerät
    lead: >-
      Skirmesh-RF ist in Schichten aufgebaut, vom Funk bis zur API des Controllers. Eine Field Box
      führt alles bis zu den Spielmodi aus; ein Controller auf dem Raspberry Pi überlässt die
      Funkarbeit einem USB-Funkmodem; in Phase&nbsp;3 macht ein Android-Handy dasselbe mit einem
      I/O-Pod. Handys im WLAN des Felds brauchen gar keinen LoRa-Funk.
  channel:
    title: Welcher Kanal, und warum 869,525&nbsp;MHz
    lead: >-
      Der ganze Verkehr eines Spiels teilt sich einen Kanal. Der Standard, 869,525&nbsp;MHz, ist die
      Mitte von 869,4–869,65&nbsp;MHz, dem einzigen Teil des europäischen 868-MHz-Bands, in dem ein
      Gerät bis zu 10&nbsp;% der Zeit mit bis zu 500&nbsp;mW senden darf. Sonst erlauben die Regeln
      im Bereich 868–870&nbsp;MHz 1&nbsp;% der Zeit (0,1&nbsp;% auf 868,7–869,2&nbsp;MHz) mit
      25&nbsp;mW: etwa ein Zehntel der Sendezeit und viel weniger Reichweite. 868,1, 868,3 und
      868,5&nbsp;MHz sind die Standardkanäle von LoRaWAN und oft belegt. Auch der Standard wird
      geteilt: LoRaWAN-Gateways senden manche Antworten auf 869,525&nbsp;MHz, und der europäische
      Standard von Meshtastic nutzt ihn, also kann die Spielleitung in deren Nähe den Controller die
      erlaubten Kanäle abhören (insgesamt etwa 60 Sekunden) und den ruhigsten wählen lassen, einen
      zufällig ziehen oder von Hand wählen. Die Boxen halten sich dann an die Grenzen des gewählten
      Kanals. Wechselt die Spielleitung den Kanal, sagt der Controller den freien Boxen dreimal auf
      dem alten Kanal, wohin es geht; eine Box, die aus oder außer Reichweite ist, verpasst das und
      wird mit <em>Nach Boxen suchen</em> wiedergefunden oder neu übernommen.
  region:
    title: "Funkregionen: Europa und Taiwan"
    lead: >-
      Ein Feld liegt in einer Funkregion, die die Spielleitung einmal in der Konsole wählt. In Europa
      (EU868) nutzen die Boxen die Kanäle oben. In Taiwan (AS923, 920–925&nbsp;MHz) geben die Regeln
      der NCC (LP0002) einem einzelnen Kanal ohne Frequenzsprünge die volle Leistung nur, wenn er
      mindestens 500&nbsp;kHz breit ist; dort nutzen die Boxen deshalb LoRa mit 500&nbsp;kHz (SF9,
      etwa dieselbe Reichweite wie in Europa), höchstens 0,5&nbsp;W an der Antenne und standardmäßig
      921,5&nbsp;MHz, abseits der Kanäle von LoRaWAN und Meshtastic. Jede Box, jedes USB-Funkmodem
      und jedes I/O-Pod ist für eine Region gebaut und lehnt die Kanäle der anderen ab, also sendet
      eine Box nie außerhalb ihres Bands; die Boxen erfahren die Region des Felds mit jedem Spiel.
      Die taiwanische Region ist nicht zertifiziert: Ein in Taiwan verkauftes Produkt braucht die
      Typzulassung der NCC und eine Antenne für 920&nbsp;MHz. Nichts davon wurde bisher in der Luft
      getestet.

modes:
  title: Spielmodi
  intro: >-
    Modi reagieren auf Absichten („ein Team beansprucht dieses Prop“), nicht auf Hardware, also läuft
    dasselbe Skript auf einer Field Box, einer Box mit Tastenfeld oder einem Android-Handy. Vierzehn Modi,
    ein Modifikator und das Medic-Kit sind heute in Software geschrieben und getestet; noch keiner
    lief auf einem echten Feld.
  # The main page shows three modes, then this link to the modes page.
  more: Alle 14 Modi ansehen →
  # At the end of the modes page.
  try: Probier heute einen Modus im Browser aus →
  domination:
    title: Domination
    text: >-
      Ein Team hält ein paar Sekunden lang den Eingang des Props, um es einzunehmen, und punktet in
      jedem Takt, solange es das Prop hält. Das andere Team kann es jederzeit übernehmen.
    meta: Team-Knöpfe · eine Box oder viele
  bomb:
    title: Bombe / Rush
    text: >-
      Die Angreifenden machen die Bombe scharf und verteidigen sie; die Verteidigenden müssen sie
      entschärfen, bevor die Zündzeit abläuft. Eine Explosion beendet das Spiel, die Angreifenden
      gewinnen. Scharf machen und entschärfen durch Gedrückthalten
      eines Knopfs, oder jedes Team bekommt seinen eigenen Code fürs Tastenfeld.
    meta: Team-Knöpfe oder Tastenfeld · Zünd- und Haltezeiten einstellbar
  sabotage:
    title: "Sabotage"
    text: "Bombe in Runden, bis die Spielzeit abläuft. Die Angreifenden machen die Bombe scharf, die Verteidigenden entschärfen sie. Eine Explosion ist ein Punkt für die Angreifenden, eine Entschärfung ein Punkt für die Verteidigenden; dann ruht die Box und die nächste Runde beginnt. Das Team mit mehr Punkten gewinnt."
    meta: "Team-Knöpfe oder Tastenfeld · Zünd-, Halte-, Pausen- und Spielzeit einstellbar"
  holdall:
    title: Hold-All Domination
    text: >-
      Teams nehmen Boxen ein wie bei Domination, aber ein Team punktet nur, solange es alle Boxen
      gleichzeitig hält. Geht eine verloren, stoppt die Wertung.
    meta: Mehrere Boxen · braucht den Feld-Controller
  laststand:
    title: Last Stand
    text: >-
      Die Verteidigenden starten mit allen Zonen. Sobald sie nur noch ihre letzte haben, läuft ein
      Countdown bis zur Niederlage, bis sie eine andere zurückerobern; läuft er ab, gewinnen die
      Angreifenden.
    meta: Mehrere Boxen · braucht den Feld-Controller
  kill_confirmed:
    title: Kill Confirmed
    text: >-
      Spielende tragen signierte NFC-Tags. Ein Team scannt die gesammelten Tags an einer Station: Ein
      gegnerischer Tag bestätigt den Kill, ein Tag aus dem eigenen Team verweigert ihn. Gefälschte Tags
      werden abgelehnt.
    meta: NFC-Leser · Tags der Spielenden
  respawn:
    title: Respawn und Leben
    text: >-
      Ein Respawn-Punkt zählt Leben pro Team oder pro Person, mit einer Wartezeit zwischen zwei
      Respawns. Hat ein Team keine Leben mehr, ist es raus.
    meta: NFC-Leser oder Team-Knöpfe
  player_checkin:
    title: Check-in
    text: >-
      Spielende checken mit ihrem Tag an einem Checkpoint ein. Die Box zählt die Spielenden jedes
      Teams und kann für jeden Check-in Punkte geben.
    meta: NFC-Leser · Tags der Spielenden
  medic:
    title: Medic-Kit
    text: >-
      Neben jedem Modus: Wer getroffen wurde, scannt den eigenen Tag und hält einen Knopf eine
      festgelegte Zeit lang gedrückt, um geheilt zu werden. Das Kit zeigt, wie viele Heilungen es noch
      hat; jede Person bekommt pro Spiel an jedem Kit nur eine begrenzte Zahl, die Spielleitung füllt
      ein Kit von der Konsole aus auf, und jede Heilung erscheint im Log der Spielleitung und in der
      Ansicht der Spielenden.
    meta: NFC-Leser und ein Knopf · Tags der Spielenden · braucht den Feld-Controller
  master_satellites:
    title: Master und Satelliten
    text: >-
      Teams nehmen eine Master-Box und ihre Satelliten ein. Nur der Master punktet, und jeder
      Satellit, den dasselbe Team hält, erhöht seine Punkte; wechselt der Master den Besitz, werden
      alle Satelliten wieder frei. In Software geschrieben und getestet, und inzwischen auf echten Boxen
      probegespielt (siehe das Video unten).
    meta: Mehrere Boxen · braucht den Feld-Controller
    real_alt: >-
      Stummes Video eines Testspiels von Master und Satelliten auf dem Prüftisch, drei kurze Ausschnitte
      aneinandergefügt. Zuerst wird der Master, die Box mit dem großen Bildschirm, von „LIVRE“ (frei) von Rot
      eingenommen; der Bildschirm zeigt „MASTER OCUPADO“, „RED“, „0 de 3 satélites“. Dann zeigt eine
      Satelliten-Box, dass Rot sie hält. Zuletzt zeigt der Master für Rot „1 de 3 satélites, 3 pontos a cada
      10 s“ und geht dann an Blau, wieder bei „0 de 3 satélites“. Die Bildschirme sind auf Portugiesisch.
    real_caption: >-
      Testlauf auf dem Prüftisch, 1. November 2026 (drei Ausschnitte desselben Spiels, aneinandergefügt): vier
      Boxen, und die mit dem großen Bildschirm ist der Master. Rot nimmt den Master und einen Satelliten ein,
      die Punkte des Masters steigen, danach nimmt Blau den Master ein. Der Lauf hat uns drei Dinge auf dem
      großen Bildschirm gezeigt: Der portugiesische Bildschirm sagte „MASTER“ statt „MESTRE“, der Master
      zeigte vor der ersten Einnahme „ZONA“, und er zeigte den Zeitpunkt der Einnahme („desde“) statt der
      Zeit, die er schon gehalten wird. Alle drei sind nach diesem Lauf in der Firmware behoben (der Clip
      zeigt noch die alten Bildschirme; eine neue Aufnahme folgt). Ohne Ton; die Bildschirme sind auf
      Portugiesisch.
  target_windows:
    title: Zielfenster
    text: >-
      Eine Zielscheibe leuchtet ein paar Sekunden in der Farbe eines zufälligen Teams, und ein Treffer
      in dieser Zeit punktet für dieses Team. Das Spiel ist in Software geschrieben und getestet, auch
      durchgehend mit einem simulierten Ziel; das nötige Ziel-Addon (eine Platte mit Treffersensor, die
      an eine Box gesteckt wird, deren eigene Lichter das Fenster zeigen) hat eine Bauanleitung und
      seine Firmware, aber noch keins wurde gebaut oder an einer echten Platte ausprobiert.
    meta: Eine Box mit dem Ziel-Addon · noch nicht auf Hardware ausprobiert
  hacking_terminal:
    title: Hacking-Terminal
    text: >-
      Ein Terminal stellt ein Rätsel auf seinem Tastenfeld: einen Code knacken anhand der Ziffern an
      der richtigen Stelle, die Drähte in der richtigen Reihenfolge durchtrennen oder eine Folge
      wiederholen. Eine falsche Antwort sperrt es eine Weile. Wer es löst, kann einen Code für ein
      anderes Ziel aufdecken, punkten und das Terminal halten, bis ein anderes Team es zurückhackt. In
      Software geschrieben und getestet, noch nicht auf einem Handy im Feld gespielt.
    meta: Eine Box oder ein Handy mit Tastenfeld · läuft ohne den Feld-Controller
  vip_payload:
    title: VIP / Payload
    text: >-
      Ein Team eskortiert seinen VIP, eine Person, die ihre Position aus der App teilt, oder einen
      Payload, ein Handy mit GPS, in eine Extraktionszone; die anderen versuchen, das zu verhindern.
      Checkpoint-Boxen auf dem Weg punkten, solange ein Team sie hält. Positionen bleiben auf dem
      Feld-Controller und dem Handy; nur „extrahiert“ geht hinaus. In Software geschrieben und
      getestet, noch nicht mit echtem GPS gespielt.
    meta: Checkpoint-Boxen, ein Handy mit GPS oder das Handy des VIP · braucht den Feld-Controller
  money_factory:
    title: Money Factory
    text: >-
      Teams nehmen Fabrik-Boxen ein, die Geld machen, solange sie sie halten. Wer spielt, sammelt es
      mit dem eigenen Tag an der Fabrik des eigenen Teams ein, trägt es über das Feld und zahlt es an
      einer Bank-Box ein, wo es Punkte bringt; der Feld-Controller merkt sich, was jede Person trägt,
      so kann das Geld an einer Box eingesammelt und an einer anderen eingezahlt werden. Wer an einem
      Medic-Kit geheilt wird, verliert das getragene Geld, und das erste Team, das das Ziel einzahlt,
      kann gewinnen. In Software geschrieben und getestet, noch nicht auf echten Boxen gespielt.
    meta: Fabrik- und Bank-Boxen oder Handys mit NFC · Tags der Spielenden · braucht den Feld-Controller
  progressive_domination:
    title: Progressive Domination
    text: >-
      Mehrere Boxen, aber nur eine kann gleichzeitig eingenommen werden, und beide Teams erfahren,
      welche. Das Team, das die aktive Box hält, punktet für jede volle Minute; hat es sie lange
      genug gehalten, ist die Box für dieses Team abgeschlossen und gesperrt, und die nächste Box der
      Reihenfolge wird beiden Teams gemeldet. Die Reihenfolge ist die Liste der Spielleitung, die
      Box-Nummern oder zufällig; das Spiel endet mit der letzten abgeschlossenen Box oder wenn ein
      Team die Zielpunktzahl erreicht. In Software geschrieben und getestet, noch nicht auf echten
      Boxen gespielt.
    meta: Boxen mit Team-Knöpfen · braucht den Feld-Controller
  codes:
    title: Codes (Modifikator)
    text: >-
      Läuft neben jedem Modus auf derselben Box: Codes am Tastenfeld bringen Punkte, Hinweise oder
      Freischaltungen, und die Spielleitung sieht, wer jeden Code benutzt hat und welches Team die
      Box hielt.
    meta: Tastenfeld · passt zu jedem Modus
  yours:
    title: Dein Modus
    text: >-
      Money Factory, Capture the Flag, der eigene Modus deines Clubs… Modi sind kurze Skripte. Schlag
      einen mit der Vorlage für Spielmodus-Ideen vor oder teile einen fertigen als signiertes Paket
      in der <a href="https://vakaobr.github.io/atalaia-modes/">Modus-Registry</a>.
    link: Eine Spielmodus-Idee teilen

# The animated pictures of the modes page (tools/gen_mode_gifs.py, tools/mode_gifs.yaml):
# each picture's alt text (what happens in it, in order) and the caption under it.
gifs:
  intro: >-
    Jede Animation unten zeichnet der Firmware-Code der Field Box selbst, keine Attrappe: der
    große Bildschirm oben, das kleine OLED darunter, während ein Spiel des Modus läuft. Die
    Taste unter einem Bild hält es an.
  play: Animation abspielen
  pause: Animation anhalten
  domination:
    alt: >-
      Animation einer Field Box beim Spielen von Domination. Der Bildschirm zeigt eine neutrale
      Zone; Rot hält seinen Knopf, der Balken auf dem kleinen Display füllt sich und die Zone
      wird rot, die Punkte zählen hoch. Dann hält Blau seinen Knopf und übernimmt die Zone, und
      das Spiel endet mit dem Endstand.
    caption: >-
      Domination auf einer Field Box: Ein Team hält seinen Knopf, um die Zone einzunehmen, die
      Punkte steigen, solange es sie hält, und das andere Team kann sie übernehmen.
  bomb:
    alt: >-
      Animation einer Field Box beim Spielen von Bombe. Der Bildschirm zeigt die bereite Bombe;
      Rot hält seinen Knopf und macht sie scharf, der Countdown startet bei 4:59, Blau hält
      seinen Knopf zum Entschärfen, der Balken füllt sich und der Bildschirm wird blau und
      zeigt, dass die Bombe entschärft ist.
    caption: >-
      Bombe / Rush: Scharf machen durch Gedrückthalten eines Knopfs, die Zündzeit läuft ab, die
      Verteidigenden entschärfen rechtzeitig.
  sabotage:
    alt: "Animation einer Field Box beim Spielen von Sabotage. Der Bildschirm zeigt die bereite Bombe mit dem Stand 0 : 0; Rot hält seinen Knopf, der Balken füllt sich und die Bombe ist scharf; sie explodiert und der Bildschirm wird rot, ein Punkt für Rot. Eine Pause zeigt 1 : 0 und die Zeit bis zur nächsten Runde, dann hält Blau seinen Knopf und entschärft die zweite Bombe, der Bildschirm wird blau, ein Punkt für Blau; der Bildschirm zum Spielende zeigt Rot als Gewinner."
    caption: "Sabotage: Bombenrunden mit Punktestand, eine Explosion für die Angreifenden, eine Entschärfung für die Verteidigenden, bis die Zeit um ist."
  master_satellites:
    alt: >-
      Animation von Master und Satelliten: Die Master-Box mit der Überschrift MASTER wird von
      neutral zu rot, wenn Rot den Knopf hält, und zeigt „MASTER BESETZT“ mit der Haltezeit; danach
      zeigt sie, wie viele Satelliten Rot hält (1, 2, dann 3 von 3), die Punkte pro Takt und die
      Gesamtpunkte von Rot in der Ecke, und zum Schluss den Bildschirm für das Spielende.
    caption: >-
      Master und Satelliten: Satelliten werden wie Domination-Zonen eingenommen; die Master-Box
      zählt, wie viele ein Team hält, und zahlt für jeden mehr Punkte.
  hacking_terminal:
    alt: >-
      Animation des Hacking-Terminals: das Code-Rätsel mit Versuchen und Hinweisen (richtige und
      falsche Stelle), das Kabel-Rätsel, bei dem Drähte gekappt werden, das Folgen-Rätsel (eine
      Taste wird gezeigt, dann "Du bist dran") und der Bildschirm "Zugriff erteilt" mit dem
      Code.
    caption: >-
      Hacking-Terminal: Ein Terminal kann ein Code-, Draht- oder Folgen-Rätsel haben; das Team,
      das es löst, übernimmt das Terminal und kann einen Code ablesen.
  medic:
    alt: >-
      Animation des Medic-Kits: Das Kit zeigt 4 Behandlungen übrig; eine verletzte Person hält
      den Knopf und der Balken füllt sich; das Kit zeigt die Behandlung als erledigt mit 3
      übrig; wer alle Behandlungen verbraucht hat, wird abgelehnt.
    caption: >-
      Medic-Kit: Eine verletzte Person hält den Knopf für die Behandlungszeit; das Kit zählt
      seine Ladungen und das Limit jeder Person.
  vip_payload:
    alt: >-
      Animation von VIP / Payload: eine Checkpoint-Box, die niemand hält; Blau hält seinen Knopf
      und übernimmt sie; dann der Payload-Bildschirm, auf dem die Meter bis zur Extraktionszone
      schrumpfen, eine Warnung wegen schwachem GPS und die abgeschlossene Extraktion.
    caption: >-
      VIP / Payload: Checkpoints werden unterwegs eingenommen, und der Payload-Bildschirm (der
      eines Handys) zeigt die Entfernung bis zur Extraktion.
  money_factory:
    alt: >-
      Animation der Money Factory: eine freie Fabrik, Rot hält seinen Knopf und der Balken füllt
      sich, die Fabrik gehört Rot und ihr Vorrat steigt von 5 auf 35 von 50, eine Person sammelt
      15 ein, und eine Bank-Box zeigt eine Einzahlung von 15 und die Summen je Team.
    caption: >-
      Money Factory: Eine gehaltene Fabrik füllt sich mit Geld, Spielende sammeln es mit ihrem
      Tag ein und zahlen es an einer Bank-Box ein.
  progressive_domination:
    alt: >-
      Animation von Progressive Domination: Eine Box wartet auf ihren Einsatz (1 von 4 Boxen
      abgeschlossen); die Box wird zur aktiven, und Blau hält seinen Knopf, bis es sie einnimmt;
      die Punkte und die gehaltenen Minuten von Blau steigen, während der Anteilsbalken sich
      füllt; die Box ist für Blau abgeschlossen und gesperrt; dann wird die nächste, wartende
      Box zur aktiven.
    caption: >-
      Progressive Domination: Nur eine Box kann gleichzeitig eingenommen werden; das Team, das
      sie lange genug hält, schließt sie ab, und die nächste Box der Reihenfolge wird
      angekündigt.
  target_windows:
    alt: >-
      Animation der Zielfenster: eine Zielscheibe wartet auf die Farbe eines Teams, ein Fenster
      öffnet sich für Rot mit einem Countdown von 5 Sekunden, die Zielscheibe zeigt den Treffer
      von Rot, dann ein Fenster für Blau und die Trefferzahl steigt auf 2.
    caption: >-
      Zielfenster: Eine Zielscheibe öffnet ein kurzes Fenster für die Farbe eines Teams; Treffer
      im Fenster punkten.
  codes:
    alt: >-
      Animation des Modifikators Codes mit Bombe: Der Bildschirm verlangt den Teamcode, vier
      Ziffern erscheinen als Punkte, der Countdown läuft, und ein Entschärf-Code wird
      eingegeben, bevor der Bildschirm die entschärfte Bombe zeigt.
    caption: >-
      Codes: Bombe mit eingetippten Teamcodes statt gedrückter Knöpfe: Die Box mit Tastenfeld
      verlangt einen Code zum Scharfmachen und einen zum Entschärfen. Die Meldungen, die das
      Skript des Modus schreibt, bleiben englisch.
  kill_confirmed:
    alt: >-
      Animation von Kill Confirmed: Die Station wartet auf Tags; der Tag einer Person aus dem
      roten Team wird angenommen, ein Fenster von 14 Sekunden läuft herunter und die Meldung
      "Kill confirmed: b1" erscheint; danach wird ein gefälschter Tag abgelehnt.
    caption: >-
      Kill Confirmed: Das Scannen des signierten Tags eines Gegners bestätigt den Abschuss; ein
      gefälschter Tag wird abgelehnt. Die Meldungen, die das Skript des Modus schreibt, bleiben
      englisch.
  respawn:
    alt: >-
      Animation von Respawn und Leben: Ein Respawn-Punkt holt Spielende zurück ins Spiel,
      während die Leben des Teams von 19 auf 18 und 17 sinken, und zeigt zuletzt in Rot, dass
      das Team keine Leben mehr hat.
    caption: >-
      Respawn und Leben: Jede Rückkehr ins Spiel kostet das Team ein Leben; bei null scheidet
      das Team aus. Die Meldungen, die das Skript des Modus schreibt, bleiben englisch.
  player_checkin:
    alt: >-
      Animation von Check-in: Jeder am Check-in-Punkt gescannte Tag fügt eine Person hinzu; die
      Summe steigt von 1 auf 3 und 5, mit der Zahl je Team.
    caption: >-
      Check-in: Spielende checken zum Start ein, und die Box zählt die Spielenden jedes Teams.
      Die Meldungen, die das Skript des Modus schreibt, bleiben englisch.

screens:
  title: So sieht es aus
  intro: >-
    Drei Modi, wie die Box sie zeigt: Animationen, die der Code der Field-Box-Firmware selbst
    zeichnet, nicht nachgebaut. Die Schaltfläche unter jedem Bild pausiert es. Weiter unten die
    Screenshots der App.
  real:
    title: Die echte Box auf dem Labortisch
    intro: >-
      Die Modi oben sind Animationen, die der Code der Firmware zeichnet. Hier spielt der Aufbau der
      Field Box auf dem Labortisch (ein Board an losen Kabeln, ohne Gehäuse) wirklich Domination.
    alt: >-
      Stummes Video in Endlosschleife des Field-Box-Aufbaus beim Spielen von Domination: Das Display zeigt
      die Zone des roten Teams mit 3 Punkten; unten füllt sich ein blauer Balken, und die Zone geht an das blaue
      Team. Danach zählt die Haltezeit hoch (ab 0:01), und oben rechts erscheinen die Punkte jedes Teams.
    caption: >-
      Die Field Box auf dem Labortisch (1. November 2026) mit dem neuen TFT-Display: Der Haltebalken füllt sich,
      das blaue Team erobert die Zone, die Haltezeit zählt hoch, und die Punkte jedes Teams erscheinen in der
      Ecke. Noch ohne Gehäuse, mit losen Kabeln.
    more: Den Aufbau und das Foto ansehen →
  gifs_more: Alle Modi ansehen →
  box_title: Die Bildschirme der Box, Schritt für Schritt
  box_intro: >-
    Acht Aufnahmen der echten Firmware der Field Box (ESP32, LVGL 9.2,
    320&nbsp;×&nbsp;240&nbsp;TFT), die im Emulator <a href="https://wokwi.com">Wokwi</a> läuft, von
    der PIN der Spielleitung bis zum Entschärfen der Bombe. Die Oberfläche der Box ist hier auf
    Englisch. Die Firmware läuft inzwischen auf einem echten Heltec V4.3; diese Bilder stammen aus
    dem Emulator. Tippe oder klicke auf ein Bild, um es größer zu sehen.
  note: >-
    Das <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">Bauhandbuch</a>
    (auf Englisch und Portugiesisch) enthält den vollständigen Schaltplan und die Anleitung zum ersten Flashen für den
    Heltec WiFi LoRa 32&nbsp;V4.
  pin_entry:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „GAME MASTER“, Aufforderung „Enter the admin PIN“ (Admin-PIN
      eingeben), vier leere Kreise für Ziffern, Hinweis „# enter * delete“.
    caption: Die Spielleitung gibt die Admin-PIN ein, um das Setup freizuschalten.
  choose_game:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „CHOOSE A GAME“ (Spiel wählen) mit der Liste 1 „Bomb“ (gelb
      hervorgehoben), 2 „Domination“, 3 „Hold-All Domination“, 4 „Last Stand“ und 5 „Codes“, dazu der
      Hinweis „1-9 choose # next * back“.
    caption: Einen Spielmodus im Menü der Box wählen.
  confirm:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „START THE GAME?“ (Spiel starten?) auf einem orangen Balken,
      Modusname „Bomb“, „Timer: 10 min“, Hinweis „# start * back“.
    caption: Modus und Timer vor dem Start bestätigen.
  standby:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „STANDBY“, „Hold the button to arm“ (Knopf halten zum Scharfmachen),
      „RED“ in Rot, unten „The bomb is not armed“ (die Bombe ist nicht scharf).
    caption: Warten, bis das rote Team den Knopf zum Scharfmachen hält.
  armed:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „ARMED“ (scharf) auf einem roten Balken, großer Countdown
      „5:00“, Beschriftung „until detonation“ (bis zur Explosion).
    caption: Bombe scharf; das blaue Team hat 5 Minuten zum Entschärfen.
  defused:
    alt: >-
      Bildschirm der Field Box: blauer Hintergrund, weißes Häkchen, groß „DEFUSED“ (entschärft),
      darunter „BLUE team wins“ (Team Blau gewinnt).
    caption: Das blaue Team hat die Bombe rechtzeitig entschärft.
  joined:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „JOINED GAME 4242“ (Spiel 4242 beigetreten), links
      „Game“, rechts „zone, node 7“.
    caption: Die Box ist dem Spiel des Felds per NFC-Karte oder serieller Konsole beigetreten.
  code_entry:
    alt: >-
      Bildschirm der Field Box: Kopfzeile „CODE“, zwei von vier Kreisen gelb gefüllt, Hinweis
      „# enter * delete“.
    caption: Einen Code für den Codes-Modifikator eingeben (Punkte, Hinweise oder Freischaltungen).

  app_title: Die Android-App
  app_intro: >-
    Die eigenen Bildschirme der App gibt es auf Portugiesisch, Englisch, Deutsch und traditionellem Chinesisch, und sie
    zeichnet die Bildschirme jedes Modus aus denselben YAML-Dateien wie die Field Box. Das sind die
    Testbilder der App, keine Fotos eines Handys: Die App lief bisher auf Android-Emulatoren, noch
    nicht auf einem echten Handy.
  app_roles:
    alt: >-
      Der erste Bildschirm der App, „Was soll dieses Handy machen?“: vier Auswahlmöglichkeiten mit
      je einer Zeile, was sie tun: Spielprop, Spielen, Marshal und Spielleitung.
    caption: Wähle, was dieses Handy im Spiel macht.
  app_prop:
    alt: >-
      Ein Android-Handy als Bombe: der Countdown-Bildschirm des Modus, auf Englisch wie die
      Bildschirme der Modi („ARMED“, „4:47“, „until detonation“), über zwei großen Knöpfen, rot
      und blau, mit „Gedrückt halten“.
    caption: Ein Handy als Bombe, mit den Knöpfen der Teams.
  app_player:
    alt: >-
      Die Ansicht der Spielenden: der Name des Spiels, noch 20:00, die 20 Punkte des blauen Teams über
      den 12 des roten, wer welches Ziel hält und was passiert ist.
    caption: Spielende verfolgen das Spiel auf dem Handy.
  app_branded:
    alt: >-
      Die Ansicht der Spielenden auf einem Feld mit eigenem Branding: Logo und Name des Felds, Campo
      Norte, in der Kopfzeile, sein Hintergrundbild blass hinter der Ansicht, und die Teams Águias und
      Lobos mit Wappen und Punkten, 20 zu 12.
    caption: Logo, Hintergrundbild und Team-Wappen eines Felds.
  app_chrono:
    alt: >-
      Der Chrono der Marshals: das Tastenfeld für die Geschwindigkeit, das BB-Gewicht und ein grünes
      „OK“, mit dem Höchstwert und dem Limit.
    caption: Chrono beim Check-in, der Messwert von Marshal signiert.
  medic_intro: >-
    Das Medic-Kit zeichnet seine Bildschirme aus denselben YAML-Dateien auf einer Field Box und auf
    einem Android-Prop, auf Portugiesisch, außer die Spielleitung stellt Englisch, Deutsch oder
    Chinesisch ein. So zeichnet die App sie:
  medic_idle:
    alt: >-
      Bildschirm des Medic-Kits: Kopfzeile „LIGADURAS“ (Verbände), eine große 4, „Restam 4 ligaduras“
      (noch 4 Heilungen) und gelb „Lê a tua etiqueta e mantém premido o botão“ (scanne deinen Tag und
      halte den Knopf gedrückt).
    caption: Wartet auf Spielende, noch 4 Heilungen.
  medic_hold:
    alt: >-
      Bildschirm des Medic-Kits: die ID der Person, b1, in einer blauen Kopfzeile, „Mantém premido para
      tratar“ (gedrückt halten zum Heilen), gelb noch 4 Sekunden über einem Fortschrittsbalken, und
      „Largar antes do tempo cancela“ (zu frühes Loslassen bricht ab).
    caption: b1 hält den Knopf gedrückt, um geheilt zu werden.
  medic_healed:
    alt: >-
      Bildschirm des Medic-Kits auf Blau: ein weißes Kreuz, „DE VOLTA AO JOGO“ (zurück im Spiel), b1,
      „Tratamento 1 de 2“ (Heilung 1 von 2) und „Restam 3 ligaduras“ (noch 3 Heilungen im Kit).
    caption: Zurück im Spiel, mit der ersten von zwei Heilungen.
  # The screenshot viewer (the dialog at the end of the main page).
  viewer:
    label: Screenshot
    prev: Vorheriger Screenshot
    next: Nächster Screenshot
    close: Schließen
try:
  title: Heute ausprobieren
  intro: >-
    Hardware brauchst du nicht: Der gemeinsame Kern läuft auf einem Computer. Der Simulator spielt
    einen Modus in deinem Browser: Halte Team-Knöpfe gedrückt, sieh dir den Bildschirm jedes Props an
    und verfolge das Event-Log. Die Befehle unten tippst du in ein Terminal.
  compiler: Mit einem C-Compiler
  docker: Nur mit Docker
  then: >-
    Dann öffne <code>http://localhost:8000</code>. Du brauchst Python 3.10+ mit PyYAML. Die
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">Anleitung zum
    Simulator</a> (auf Englisch und Portugiesisch) hat alle Optionen.
  board:
    title: Auf einem Board
    text: >-
      Die <a href="{{ page.to.glossary }}#glossar-firmware">Firmware</a> der Field Box, des
      USB-Funkmodems und des I/O-Pods ist geschrieben, und alle drei laufen in Tests auf einem
      Computer. Die der Field Box und des Modems laufen auf echten Heltec V4.3 auf dem Labortisch:
      Eine Box tritt über Funk den Spielen des Feld-Controllers bei, mit einem zweiten Board als
      Modem, spielt sie bis zum Ende und bekommt Firmware-Updates per Funk, wobei der kleine
      Bildschirm des Boards das Spiel zeigt; die des Pods lief noch auf keinem Board. Um ein nacktes
      Board ohne Box zu testen, gibt es eine Labor-Version der Firmware (Tasten über das USB-Kabel).
      Um eine Box zu bauen und zu flashen, folge dem
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">Bauhandbuch</a>;
      die
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">Anleitung
      zur Firmware</a> baut auch Modem und Pod (beide auf Englisch).
  app:
    title: Auf einem Android-Handy
    text: >-
      <a href="https://github.com/vakaobr/atalaia-project/releases/tag/v0.9.0">v0.9.0</a> (6.
      November 2026) ist das erste GitHub-Release mit der App: atalaia-app-0.9.0.apk, signiert mit
      dem Schlüssel des Projekts, sodass sich jedes Release über das vorherige installiert. Die
      neueste, <a href="https://github.com/vakaobr/atalaia-project/releases/tag/v0.12.0">v0.12.0</a>
      (12. November 2026), installiert sich darüber und behält die Daten der App; ab v0.10.0 wird
      die APK ohne den Signaturschlüssel gebaut und in einem eigenen Schritt ohne Netzwerk signiert.
      Der SHA-256-Fingerabdruck des Zertifikats ist <code
      class="fingerprint">9C:35:0D:17:37:D6:C5:35:CD:3E:D1:04:28:8E:65:AD:7D:B4:FA:CE:8E:4E:6F:27:75:3B:7B:7C:38:40:A1:99</code>;
      Android lehnt ein Update ab, das mit einem anderen Schlüssel signiert ist. Eine App aus einem
      älteren Debug-Build muss vorher einmal deinstalliert werden (die Handbücher sagen, was dabei
      verloren geht). Oder bau die Debug-APK selbst mit Docker und installiere sie auf einem Handy
      mit Android 8.0 oder neuer oder im Android-Emulator, wie die <a
      href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">Anleitung
      zur App</a> (auf Englisch und Portugiesisch) erklärt. Sie lief auf Emulatoren, noch nicht auf
      einem echten Handy.
  manuals:
    title: Spielen und ausrichten
    text: >-
      Handbücher für alle, die Atalaia benutzen, nicht für Entwickelnde: für <a
      href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/README.md">Spielende,
      Orga, Marshals, Box- und Handy-Prop-Betreuende, Feld-Admins und alle, die Boxen bauen</a>, auf
      Englisch und Portugiesisch, mit einer Kurzanleitung auf einer Seite. Sie beschreiben, was die
      Software heute zeigt, und markieren, was noch nicht auf einem Feld erprobt wurde. Auf Deutsch
      gibt es sie noch nicht.

roadmap:
  title: Roadmap
  intro: >-
    Sechs Phasen, jede mit einem echten Feldtest als Abschluss: ihrem Gate. Die Software ist der
    Hardware voraus: Die Phasen 1 bis 3 sind in Software fertig (echte Boards spielen auf dem
    Labortisch ganze Spiele, und die iOS-App hat ihre Checkliste auf einem iPhone bestanden); die
    Phasen 4 und 5 sind in Software gebaut. Die Gates warten auf gebaute Boxen, Feldtests, einen
    echten Server und den Registry-Schlüssel des Projekts. Die neueste Version ist v0.12.0 (12.
    November 2026): Eine Field Box beschreibt Beitrittskarten, die Feldkarte und Tags der Spielenden
    mit ihrem eigenen NFC-Leser, von einem Computer auf dem Labortisch aus, und der Treiber des
    Lesers ist auf einem Computer getestet (noch nicht an einem echten Leser). Nichts muss gemeinsam
    aktualisiert werden. v0.11.0 (7. November 2026) brachte den Nachweis des Anmelde-Handys beim
    Check-in, bei dem das Team sieht, ob ein Check-in gebunden ist oder nicht, und bereitete das
    Einbrennen des gehärteten Field-Box-Images vor (vorerst bekommt es kein Board); v0.10.0 (7.
    November 2026) Korrekturen aus einem Review, die das Freigeben hängengebliebener Boxen, das
    Failover und den Check-in mit Ticket härten, und eine ohne Netzwerk signierte Release-APK;
    v0.9.0 (6. November 2026) das Freigeben hängengebliebener Boxen (bisher ein Test auf dem
    Labortisch) und die erste Android-App, die mit dem Schlüssel des Projekts signiert ist.
  more: Die ganze Roadmap, mit dem Inhalt jeder Phase und ihrem Gate →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code).
  done: Fertig
  software: Software fertig
  # The parts of each phase on the roadmap page. Each phase: short (one line, also on the main
  # page), done (bullets), next (bullets), gate; a phase with a long done list also has groups
  # (g_*: title and items) that fold into a <details> under the first few bullets.
  part_done: Was fertig ist
  part_next: Als Nächstes, und worauf es wartet
  part_more: Alles übrige, was fertig ist, nach Thema
  status_link: Der ausführliche Stand dieser Phase im Repository →
  p0:
    title: Grundlagen
    short: >-
      Gemeinsamer Kern, Lua-Sandbox, Skirmesh-RF-Codec und Browser-Simulator. Gate erreicht.
    done:
      - Gemeinsamer Kern, die Spiellogik, die jede Plattform ausführt.
      - <a href="{{ page.to.glossary }}#glossar-lua">Lua-Sandbox</a>, in der die Skripte der Spielmodi laufen.
      - <a href="{{ page.to.glossary }}#glossar-skirmesh-rf">Skirmesh-RF-Codec</a>, das Format der Funknachrichten.
      - Browser-Simulator, der Domination und Bombe spielt.
    gate: >-
      Gate: Der Simulator spielt Domination und Bombe aus Lua-Skripten. <strong>Erreicht.</strong>
  p1:
    title: Eine Box
    short: >-
      Firmware der Field Box und ein Bauhandbuch; auf dem Labortisch spielt ein echtes Board ganze
      Spiele, inzwischen mit Display, Tastenfeld und Tastern an losen Kabeln (Foto und Clip auf der
      Bauseite). Ein beendetes Spiel an der Box verlassen kam mit v0.9.0, noch nicht an einer echten
      Box ausprobiert. Ab v0.10.0 öffnet sich das Admin-Menü der Box während eines Spiels nur, wenn
      das Spiel pausiert ist oder noch wartet, und das gehärtete Release-Image lässt sich bauen;
      v0.11.0 bereitet sein Einbrennen vor, und vorerst bekommt es kein Board. Ab v0.12.0 beschreibt
      eine Box Karten mit ihrem eigenen NFC-Leser, für den Labortisch, noch nicht an einem echten
      Leser ausprobiert. Es fehlt noch eine zusammengebaute Box.
    done:
      - ESP32-Firmware der Field Box mit Presets auf dem Gerät, lauffähig in einem Emulator.
      - Der kleine Bildschirm der Box zeigt Haltebalken, Punkte und Haltezeit, in vier Sprachen.
      - Ein Bauhandbuch mit Schaltplänen.
      - "Das erste Board (Heltec V4.3, 20. Oktober 2026) auf dem Labortisch: Es startet, schaltet den
        Funk ein, liest seine Knöpfe und spielt ganze Spiele, Bombe eingeschlossen (scharf machen,
        entschärfen, ablaufende Zeit), auf seinem kleinen Bildschirm."
      - "Die Spielzeit-Leiste: Läuft ein Spiel mit Zeitlimit, zeigt ein Streifen am unteren Rand des kleinen Displays, wie viel davon übrig ist, und das OLED zeigt eine Uhr. In Software, noch nicht an einem echten Display gesehen."
      - "Das Setup, das ein Szenario an die Boxen schickt, wird erneut gesendet, bis jede Box es bestätigt, und die Box sendet diese Bestätigung jetzt. Nur in Software und Host-Tests, nicht auf einem echten Board."
      - "Feld wechseln im Admin-Menü der Box verschiebt eine angemeldete Box über ihren Code auf ein anderes Feld. Nur Host-Tests, nicht auf einem echten Board."
      - "Kein Logo des Feldes mehr auf der Box: Sie zeigt den Atalaia-Turm als Startbild, eine Datei, die Bauende beim Bauen ersetzen können (Release-Images tragen immer den Turm, und der Release-Build prüft das). Der Logo-Download war es, der der Box auf dem Labortisch den Speicher ausgehen ließ. Eine Box, die ein altes Logo behalten hat, entfernt es beim ersten Start (Host-Tests)."
      - "Eine größere Partitionstabelle: die beiden Firmware-Slots der Box sind je 4 MB groß (das Image füllte 93 % von 2 MB), Einstellungen und Schlüssel bleiben, wo sie waren. Nur in Host-Tests und Builds, auf keinem Board geflasht. Eine Box mit der alten Tabelle braucht einmal ein Flashen per USB; danach gehen Over-the-Air-Updates wie bisher."
      - "Die Field Box als iBeacon: Vom Beitritt bis zum Spielende sendet eine Box ein Bluetooth-Beacon (alle 500 ms, nie während ihr WLAN in Gebrauch ist), sodass ein Handy in ihrer Nähe Spielende auf einer Etage oder in einem Raum verorten kann. Die Kennung des Feldes wird aus seinem Beitrittsschlüssel abgeleitet, und die Spielleitung kann die Boxen als Beacons abschalten, je Feld oder je Box. Der interne Speicher der Box wurde überarbeitet, nachdem er auf dem Labortisch beim Beitritt zu einem Spiel ausging (das WLAN scheiterte, dann folgte ein Watchdog-Reset): Auf dem Labortisch gemessen sind beim Start 241 KB frei und im Spiel mit eingeschaltetem Beacon mindestens 102 KB, und die CI lässt den Build scheitern, wenn das Budget zu stark schrumpft. Noch nicht geprüft, ob ein Handy das Beacon einer echten Box hört."
      - "Nach der Ablehnung oder dem Scheitern eines Updates oder eines Modus-Abrufs kehrt der Bildschirm der Box nach 8 Sekunden zum Bildschirm des Zustands zurück (auf dem Labortisch blieb eine Ablehnung stehen, bis jemand hinsah). Nur Host-Tests."
      - "Die Befehle der seriellen Konsole, die einer Box den Beitrittsschlüssel geben oder ein Update starten (@joinkey, @update), verlangen in einem Release-Build die Admin-PIN und lehnen ab, solange keine gesetzt ist; ein Bench-Build lässt sie für die Bench-Skripte offen. Nur Host-Tests, nicht auf einem echten Board."
      - "Der erste Labortisch-Aufbau der Field Box (31. Oktober 2026): ein Heltec-V4-Board mit dem 2,8-Zoll-TFT, dem OLED, einem 4×3-Tastenfeld und Team-Tastern, an losen Kabeln und ohne Gehäuse, spielt Domination mit dem Controller vom Labortisch. Es gibt ein <a href=\"{{ page.to.build }}#field-box-first-build\">Foto und einen Clip</a>."
      - "Der große Bildschirm entspricht jetzt dem kleinen: Haltebalken, die ab der Eroberung hochzählende Haltezeit und die Punkte jedes Teams in einer Ecke, in Domination, Master und Satelliten (Titel MASTER / SATELLIT; der Master zeigt die Team-Summe), Progressive Domination und VIP / Payload. Auf dem Labortisch bei Domination gesehen (Clip auf der Bauseite); die anderen drei Modi nur in Referenzbildern der Firmware und in Tests."
      - "Der große Bildschirm zeigt beim Start einen Startbildschirm mit dem Turm und der Firmware-Version wie der kleine, statt bis zum ersten Spielbildschirm leer zu bleiben. Host-Tests und ein Referenzbild, bisher nicht auf mehr als dem ersten Labortisch-Board geprüft."
      - "Ein wackeliger I2C-Bus startet eine Box nicht mehr neu: Tastenfeld, kleiner Bildschirm, NFC-Leser und Akku-Messchip nutzen den neueren ESP-IDF-Treiber mit Zeitlimits, Bus-Reset und einem Backoff, der ein ausfallendes Teil beiseitelegt; ein defektes Tastenfeld liest sich als keine Taste, und das Spiel läuft weiter. Ein Neustart meldet jetzt seinen wirklichen Grund (Spannung, Unterspannung, Software, Absturz, Watchdog) statt immer \"Spannung\", und die Spielleitungs-Konsole sagt \"Eine Box ist abgestürzt und neu gestartet\". Auf dem Labortisch gefunden: Ein Tastenfeld mit schlechten Lötstellen startete ein Board in drei Minuten sechsmal neu. Nur Host-Tests; der Labortisch-Test der Korrektur steht aus."
      - "Ein Bildschirmtext, der nicht passt, wird beim Prüfen eines Modus abgelehnt, und ein Text, der sich nicht zeichnen lässt, zeigt \"?\" statt leer zu bleiben (ein langer Text in vier Sprachen wurde auf einer Box bisher kommentarlos leer). Tests auf einem Computer."
      - "Eine Anzahl von eins steht im Singular (\"1 Punkt\", nicht \"1 Punkte\") auf den Bildschirmen der Box, in der App, in der Spielleitungs-Konsole und auf den Personalseiten. Tests in Software."
      - "Eine Box, die in einem Spiel hängt, das endete, während sie aus war, verlässt es an der Box: * 3 Sekunden halten, die Admin-PIN eingeben, dann Spiel verlassen (oder @leave auf ihrer USB-Konsole). Sie behält Feld, WLAN und Modi. In v0.9.0 (6. November 2026); noch nicht an einer echten Box ausprobiert."
      - "Das Admin-Menü der Box öffnet sich während eines Feldspiels nur, wenn das Spiel keine Tasten von Spielenden annimmt: vor dem Start, während einer Pause oder 5 Minuten, nachdem der Controller des Spiels verstummt ist (eine Box, die in einem beendeten Spiel hängt). Um eine Box aus einem laufenden Spiel zu nehmen, das Spiel zuerst pausieren. In v0.10.0 (7. November 2026); nur Host-Tests."
      - "Das gehärtete Release-Image (Secure Boot v2, Flash-Verschlüsselung, NVS-Verschlüsselung, Anti-Rollback) lässt sich bauen, und die CI signiert es mit einem Wegwerf-Schlüssel. Auf kein Board ist etwas eingebrannt, und die veröffentlichten Images ändern sich nicht. In v0.10.0 (7. November 2026)."
      - "Das Einbrennen des gehärteten Images ist als Skript festgehalten, das nur seinen Plan ausgibt, solange es nicht den Port des Boards und eine ausdrückliche Bestätigung für genau dieses Board bekommt; nur der gehärtete Build kann einen Secure-Boot-Schlüssel-Digest widerrufen, mit einer Anweisung, die mit dem Root-Release-Schlüssel des Projekts signiert ist; und ein Emulatortest spielt das Einbrennen mit Wegwerf-Schlüsseln durch. Nach Entscheidung des Maintainers vom 7. November 2026 bekommt vorerst kein Board, weder auf dem Labortisch noch im Feld, das gehärtete Image oder irgendein Einbrennen von eFuses; das normale und das Labortisch-Image bleiben unverändert. In v0.11.0 (7. November 2026)."
      - "Eine Field Box mit NFC-Leser beschreibt und liest NTAG213-, NTAG215- und NTAG216-Karten (Beitrittskarten, die Feldkarte, Tags der Spielenden) von einem Computer am USB-Kabel aus, auf dem Labortisch oder in der Werkstatt; ein Android-Handy bleibt der normale Weg. Die Box verlangt in einem Release-Build ihre Admin-PIN, lehnt während eines Spiels ab, beschreibt nur den Benutzerspeicher der Karte und liest ihn ganz zurück. Der Treiber des Lesers ist auf einem Computer gegen das Handbuch von NXP getestet und lehnt verstümmelte Antworten ab. In v0.12.0 (12. November 2026); noch nicht an einem echten Leser gelaufen."
    next:
      - Eine gebaute Box, die ein zweistündiges Club-Spiel ohne Neustart durchhält.
      - "Die Zeitleiste an einem echten Display sehen."
      - "Das erneute Senden des Setups und Feld wechseln auf einem echten Board ausprobieren."
      - "Das Beacon einer Field Box mit einem echten Handy hören und das WLAN beim Spielbeitritt mit dem neuen Speicherbudget starten."
      - "Die neue Partitionstabelle auf einem echten Board flashen (einmal per USB, ohne Löschen, bei einer Box mit der alten)."
      - "Das gehärtete Release-Image auf einem Board: Es lässt sich ab v0.10.0 bauen, und sein Einbrennen ist ab v0.11.0 vorbereitet, aber nach Entscheidung des Maintainers vom 7. November 2026 bekommt es vorerst kein Board."
      - "Die I2C-Fehlerbehandlung auf einem Board mit schlecht angeschlossenem Tastenfeld ausprobieren, dazu den Startbildschirm und die neuen Bildschirme auf mehr als dem ersten Labortisch-Board."
      - "Spiel verlassen an einer echten Box ausprobieren."
      - "Karten mit dem eigenen Leser einer Box an einem echten PN532 und mit echten NTAG-Karten beschreiben und lesen: in v0.12.0 nur auf einem Computer getestet."
    gate: >-
      Gate: Eine Box läuft ein zweistündiges Club-Spiel ohne Neustart. <strong>Offen</strong>, bis
      eine gebaute Box das schafft.
  p2:
    title: Feldnetzwerk
    short: >-
      Skirmesh-RF über LoRa, Feld-Controller, API, GM-Konsole und ein Modus-Paket, in Software
      getestet; auf dem Labortisch spielen echte Boards ganze Spiele mit dem Controller über Funk,
      und was der Labortisch gezeigt hat, ist in Software behoben. Das Freigeben von Boxen, die in
      einem beendeten Spiel hängengeblieben sind, kam mit v0.9.0 und hat seinen ersten Test auf dem
      Labortisch bestanden. v0.10.0 härtet es: Eine Box ignoriert eine feldweite Freigabe auf einem
      anderen Kanal oder solange sie ihr Spiel noch hört, und die automatischen Wiederholungen
      halten ein gemeinsames Sendezeitbudget ein. Es warten 5 gebaute Boxen auf einem Feld.
    done:
      - Das verschlüsselte Funkprotokoll Skirmesh-RF und das USB-Funkmodem.
      - Der Feld-Controller mit seiner API.
      - Die Konsole der Orga, mit Anzeigetafel.
      - Der Beitritt zu einem Spiel per NFC-Karte oder QR-Code.
      - Die Firmware der Boxen im Gespräch mit dem Controller.
      - "Ein Modus-Paket: Hold-All Domination (Punkte nur, solange man alle Boxen hält), Last Stand
        (ein Countdown bis zur Niederlage, solange man nur eine von dreien hält), Codes pro Team
        zum Scharfmachen bei Bombe und der Codes-Modifikator (Codes am Tastenfeld, die Punkte,
        Hinweise oder Freischaltungen bringen, wobei die Spielleitung erfährt, wer sie benutzt hat)."
      - "Alles im Simulator, im Emulator und auf einem Computer getestet, ganze Spiele inklusive;
        auf dem Labortisch spielen echte Boards ganze Spiele mit dem Controller über Funk:
        Einladungen, Eroberungen, Koppeln per Code, Updates per Funk, ein fehlender Modus
        nachgeladen."
      - "Die Boxen hören vor dem Senden: Eine Box prüft, ob der Kanal frei ist, bevor sie sendet,
        damit weniger Nachrichten kollidieren. Im Simulator empfängt ein Feld mit 20 Boxen 89 % der
        Updates statt 65 %."
      - "Die Spielleitung kann auch bei Domination den Besitzer einer Box setzen oder freigeben, wie in den anderen Modi."
      - "Der Controller kann seine eigenen Funkframes einzeln und mit Abstand senden. Gebaut, und aus, bis der Feldtest entscheidet."
      - "Der Pi-Controller lässt ein Firmware-Update sofort scheitern, wenn das Funkmodul das Angebot ablehnt."
      - "Eine eingerichtete Box kann zurück in die WLAN-Einrichtung, über einen Menüeintrag hinter der Admin-PIN oder einen Befehl an der USB-Konsole. Die Einrichtungsseite gibt es auf Englisch, Portugiesisch, Deutsch und Traditionellem Chinesisch, und Handys öffnen sie von selbst."
      - "Der Tab Spiel der Konsole zeigt einen QR-Code der Anzeigetafel für Spielende."
      - "Szenarien können auf Deutsch und Traditionell Chinesisch sein, die Namen ihrer Ziele eingeschlossen."
      - "<strong>Sabotage</strong>, ein neuer Modus: Bombe in Runden, bis die Spielzeit abläuft. Die Angreifenden machen scharf, die Verteidigenden entschärfen; eine Explosion ist ein Punkt für die Angreifenden, eine Entschärfung ein Punkt für die Verteidigenden, dann ruht die Box und die nächste Runde beginnt. Das Team mit mehr Punkten gewinnt, bei Gleichstand gibt es ein Unentschieden. Im Simulator und in Tests und unter den Voreinstellungen der Field Box; noch nicht auf einem echten Board."
      - "Der kleine Bildschirm des USB-Funkmodems spricht Portugiesisch, Englisch, Deutsch und Traditionelles Chinesisch, wie der der Box. Nur Host-Tests, nicht auf einem echten Board."
      - "Die Formulare der GM-Konsole behalten, was die Spielleitung getippt hat, bis es gespeichert ist: Ein Check-in oder die Uhr der Konsole setzt die gespeicherten Werte nicht mehr zurück."
      - "Ein Wechsel des Feldkanals lässt die freien Boxen nicht mehr zurück: Der Controller sagt ihnen, wohin er gegangen ist (eine neue versiegelte Funknachricht, MOVE, dreimal auf dem alten Kanal gesendet), und Boxen suchen kann die letzten vier Kanäle nach Boxen absuchen, die sie verpasst haben. Auf dem Labortisch gefunden, wo ein Funkscan den Kanal verschob und eine untätige Box nichts mehr hörte. In beiden Controllern, im Simulator und im Code der Box gebaut; die Prüfung auf zwei Boards steht noch aus."
      - "Ein Start, eine Pause oder ein Fortsetzen erreicht die Boxen in etwa einer Sekunde, nicht in bis zu 30: Der Controller wiederholt den Zustand als TIME-Nachricht 1, 2,5, 5 und 10 Sekunden später (auf dem Labortisch erfuhr eine Box 21 Sekunden zu spät von einem Start). Die Prüfung auf zwei Boards steht noch aus. Im Sendezeitmodell kosten die Wiederholungen, MOVE und ein Absuchen den Controller in einer typischen Stunde im Standard-Teilband etwa 2 Sekunden Sendezeit."
      - "Die GM-Konsole sagt, was ein Kanalwechsel mit den freien Boxen macht (wie viele der drei MOVE gesendet sind, dann dass der Controller umgezogen ist), und die Einstellungen haben eine Schaltfläche Boxen suchen, die das Ergebnis eines Absuchens zeigt. Ein Absuchen ist je Stunde begrenzt in Teilbändern unter 10 % Tastverhältnis (5 % des Budgets des Teilbands), und die Konsole sagt es, wenn sie ablehnt und wann das nächste möglich ist. In Software, in beiden Controllern."
      - "Der projizierte Punktestand folgt einer Eroberung: Zwischen zwei STATE-Nachrichten einer Box zählt der Controller weiter für das Team, das ein Eroberungsereignis nannte, bis zum nächsten STATE der Box. Auf dem Labortisch scheiterte die Projektion, wenn gleich nach einer Eroberung ein STATE verloren ging; mit dieser Änderung bestand dieselbe Einstellung auf dem Labortisch, und eine Box-Strafe wurde dort ebenfalls geprüft."
      - "Das Spielende einer Box beendet das Spiel: In einem Modus ohne Feldlogik auf dem Controller (das Zeitlimit von Sabotage, Bombe) beendet das erste game.end einer Box des Spiels es, mit dem Sieger der Box oder als Unentschieden. In Bombe / Rush beendet eine Explosion jetzt das Spiel, und das Team, das die Bombe scharf gemacht hat, gewinnt; eine Entschärfung nicht. Auf dem Labortisch mit Sabotage gefunden, und die Explosion der Bombe wurde dort ebenfalls geprüft."
      - "Ein aufgezeichneter Funkbefehl lässt sich nicht mehr später wieder einspielen: jeder Empfänger (die Box, das USB-Modem und beide Controller) führt ein Replay-Fenster pro Sender, und eine Box lehnt Start, Pause, Fortsetzen, Ende oder TIME ab, wenn sie älter sind als der zuletzt angewendete. Eine Box, die ihren Epochenspeicher verloren hat, würfelt eine neue Epoche aus, statt Nonces wiederzuverwenden. Auf der Funkstrecke ändert sich nichts: ältere Boxen funktionieren weiter, bleiben aber bis zum Update angreifbar. Im Simulator und auf einem Computer getestet, mit gemeinsamen Vektoren in C, Python und Dart; auf echten Boards wurde noch kein Funk-Replay ausprobiert."
      - "Ein zweiter Verlust des Epochenspeichers kann keine niedrigere Epoche mehr ziehen: Eine Box, der Pi und der Handy-Controller merken sich die höchste Epoche, die sie je benutzt haben, getrennt vom Eintrag pro Schlüssel, und die Ziehung beginnt darüber; ein Controller, der in einem Spiel schon gesendet hat, wird nie wieder unter seiner alten Node-ID eingeladen (er bekommt eine neue); und ein WLAN-Prop bekommt jetzt die CMD-Nachricht, die die Epoche eines Controllers nennt, und reicht sie an seinen Pod weiter (in beiden Controllern). RFC 0001, Änderung 25. Im Simulator und auf einem Computer getestet; nicht auf echten Boards ausprobiert."
      - "Die Härtung der Feld-Controller aus dem Sicherheits-Review: Größenlimits für Anfragen, GM- und Spieler-Token über reines HTTP abgelehnt, wenn HTTPS an ist (die Konsole öffnet sich unter https://&lt;Controller&gt;:8443/console/), das MQTT des Feldes über TLS (Port 8883; das einfache 1883 nur auf dem Loopback des Pi), TLS für den Personal-ATAK-Feed, HSTS, eine gehärtete Dienst-Unit auf dem Pi und ein Widerruf signierter Modi, der geschlossen ausfällt (eine fehlende oder unlesbare Liste installiert nichts; ein Controller ohne Netz nutzt die letzte Liste 30 Tage lang). Auf einem Computer getestet, nicht auf einem echten Pi oder Handy auf einem Feld."
      - "Eine Box, die ihren Epochenspeicher verloren hat und deshalb mit einer zufälligen hohen Epoche zurückkam, wird wiedergefunden: Ein Empfänger, der ein HELLO oder TIME nicht öffnen kann, durchsucht den Rest des Epochenbereichs (ein Abschnitt pro Suche, im bestehenden Budget), und ein Controller, der so eine Box hört, nennt den anderen ihre Epoche in einer neuen CMD-Nachricht, die eine Epoche nur erhöhen kann. Ein fortgesetztes Spiel ohne Eintrag startet ebenfalls mit einer zufälligen Controller-Epoche, damit sich keine Nonce wiederholt. Ältere Boxen ignorieren die neue Nachricht. Im Simulator und auf einem Computer getestet; nicht auf echten Boards ausprobiert."
      - "Das <code>rand()</code> eines Modus wird aus dem Schlüssel des Spiels sowie aus Spiel-Seed und Node-ID gesetzt; was die API Spielenden zeigt, verrät es also nicht mehr (die Codes des Hacking-Terminals, die Teams der Zielfenster), und der Spiel-Seed wird Spielenden und der Anzeigetafel nicht mehr gezeigt. Dasselbe Spiel läuft identisch ab, aber ein vor dieser Änderung aufgezeichnetes Spiel ergibt andere Zufallswerte: Boxen nicht mitten im Spiel aktualisieren. Gemeinsame Testvektoren in C, Python und Dart; nicht auf Boards ausprobiert."
      - "Die Lua-Sandbox hat die Lücken geschlossen, die eine Prüfung mit einem Speicherprüfer fand: Die Tabellenfunktionen, Coroutinen und lange Ketten von Callbacks werden gemessen, die C-Stacktiefe ist für den ESP32 begrenzt, und eine Node-ID oder ein Timer außerhalb des Bereichs läuft nicht mehr über. Die Stack-Werte sind berechnet, noch nicht auf einem Board gemessen."
      - "Der Antennengewinn ist eine Build-Option (<code>--antenna-dbi</code>, 0 bis 20 dBi, standardmäßig 2): Eine Box mit stärkerer Antenne senkt ihre leitungsgebundene Leistung um diesen Gewinn, abgerundet, damit die abgestrahlte Leistung im Limit des Teilbands bleibt. Nur Host-Tests."
      - "Der Zugangscode des Live-Streams steht nicht mehr in der Webadresse: Die Konsole schickt ihn in einem Header, die App in einem Authorization-Header, und die Logs der Controller und des Site-Servers schwärzen Code-Werte in Adressen (die alte Adresse funktioniert noch für eine Übergangszeit). Ein Feld, dessen Logs weitergegeben wurden, sollte seine GM- und Lese-Codes ändern."
      - "Team-Ergebnisse ohne Spieler-IDs werden auch auf beiden Controllern 365 Tage aufbewahrt (der Spielverlauf 90 Tage); die Spielleitung kann sie nur lesen. Auf einem Computer getestet."
      - "Eine einzige Anleitung zum Einrichten des Funkmodems, von den Teilen bis zu einer Box, die einem Spiel beitritt: fertige Version oder selbst bauen, Flashen unter Windows, Linux und macOS, der Port, die Prüfungen und eine Fehlertabelle (<a href=\"https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md\">Set up the radio modem</a>, Englisch). Auf dem Labortisch ausprobiert, mit dem Controller in Docker unter WSL2; nicht auf einem Raspberry Pi oder macOS und nicht auf einem Feld."
      - "Ein Controller, der seinen Epochen-Speicher verloren hat, zieht die neue Epoche aus der unteren Hälfte des Platzes über seiner Untergrenze, mit einem Abstand (einem größeren, wenn seine Epochen-Datei fehlt); so können wiederholte Verluste, vierzehn und mehr hintereinander, den Bereich nicht aufbrauchen. Es begann als wackeliger Test und war ein Produktfehler. Tests auf einem Computer; die Field Box zieht jetzt genauso (Host-Tests)."
      - "Der Feld-Controller übersteht eine falsche Uhr (ein Raspberry Pi 4 hat keine eigene Uhr und kann bei 1970 starten): Spielzeiten und Zeitlimits hängen nicht mehr davon ab, die Konsole warnt die Spielleitung, die die Zeit in der Konsole stellt (nur vorwärts), seine Zertifikate bleiben für Handys mit der richtigen Zeit gültig, und das Löschen alter Daten wartet. Tests auf einem Computer, noch nicht auf einem echten Pi."
      - "Kurzlebige Zugriffs-Tokens: Die Spielleitung kann dem Handy eines Marshals, einem Testlauf oder einem Bildschirm fürs Publikum ein Token geben, das nur liest, nur das Spiel leitet oder nur Marshals verwaltet, für ein Spiel oder alle, standardmäßig 8 Stunden (höchstens 7 Tage), und es sofort widerrufen. Tests auf einem Computer."
      - "Over-the-Air-Updates für die eigenen Builds des Prüfstands: Ein Prüfstands-Release-Schlüssel, dem der Prüfstand neben den Projektschlüsseln vertraut, signiert tägliche Builds; am 2. November 2026 ging eine Box von der Konsole aus in etwa 22 Sekunden von einem Build zum nächsten, bestätigt nach ihrem Selbsttest."
      - "Der Controller gibt eine Box frei, die in einem Spiel hängt, das endete, während sie aus war: Das USB-Modem meldet sie, der Controller sendet das Ende dieses Spiels erneut, und die GM-Konsole listet solche Boxen unter „In einem beendeten Spiel hängengeblieben“ mit einer Schaltfläche „Freigeben“. Ein Controller, der sein Spiel verloren hat (neu installiert oder Daten verloren), kann jede Box freigeben, die nicht im laufenden Spiel ist. In v0.9.0 (6. November 2026). Ein Test auf dem Labortisch am 6. November 2026 bestanden: Eine Heltec-V4.3-Box wurde mitten im Spiel ausgeschaltet, das Spiel endete, sie wurde wieder eingeschaltet und vom Controller binnen Sekunden freigegeben. Das Modem braucht die Firmware von v0.9.0, per USB geflasht."
      - "Die WLAN-Einrichtung der Box: @wifi nimmt einen WLAN-Namen und ein Passwort mit Leerzeichen in doppelten Anführungszeichen, und die Einrichtungsseite lehnt ab, was die Box nicht nutzen kann: einen Namen über 32 Bytes oder ein Passwort, das nicht leer ist, nicht 8–63 Zeichen hat und nicht aus 64 Hex-Ziffern besteht. In v0.9.0 (6. November 2026)."
      - "Die Review-Korrekturen von v0.10.0 (7. November 2026): „Alle Boxen freigeben, die nicht in diesem Spiel sind“ nennt seinen Kanal, und eine Box, die den Controller ihres Spiels noch hört, ignoriert die Freigabe, sodass eine erneut gehörte Freigabe keine Box in einem laufenden Spiel freigeben kann; die automatischen Wiederholungen an hängengebliebene Boxen warten, solange ein Spiel gestartet ist, und bleiben bei einem Schub pro Minute; ein Standby-Controller zählt für das Failover nur die Beacons des erkannten Leaders. Controller und Boxen werden gemeinsam aktualisiert, und das Modem wird per USB neu geflasht. In Software und Host-Tests, noch nicht auf dem Labortisch."
    next:
      - Die Funk-Boards und 5 gebaute Boxen für den Feldtest.
      - Ein Feldtest mit 20 Boxen, mit und ohne Hören vor dem Senden.
      - "Ob das Takten des Controllers an geht, entschieden nach dem Feldtest mit 20 Boxen."
      - "Auf zwei Boards prüfen, dass ein Kanalwechsel eine untätige Box behält und ein Start sie in etwa einer Sekunde erreicht (das Runbook ist geschrieben)."
      - "Das Replay-Fenster und die gehärteten Controller auf echten Boards und einem echten Pi ausprobieren (ein aufgezeichneter Befehl, auf dem Prüfstand wieder eingespielt)."
      - "Den Epochenspeicher einer Box auf zwei Labor-Boards löschen und prüfen, dass sie wiedergefunden wird, zweimal hintereinander und mit einem wieder aufgenommenen früheren Leiter-Controller (das Runbook ist geschrieben)."
      - "Die Uhr stellen und Zugriffs-Tokens auf einem echten Raspberry Pi auf einem Feld ohne Internet nutzen."
      - "Das Freigeben hängengebliebener Boxen und die WLAN-Regeln auf weiteren Boards ausprobieren (das Freigeben hat am 6. November 2026 einen Test auf dem Labortisch bestanden)."
      - "Die Freigabe- und Wiederholungsregeln von v0.10.0 auf den Boards des Labortischs ausprobieren."
    gate: >-
      Gate: 5 Boxen auf einem <a href="{{ page.to.glossary }}#glossar-cqb">CQB</a>-Gelände und einem
      Outdoor-Feld, keine verlorene Einnahme. <strong>Offen.</strong>
  p3:
    title: Android und Spielende
    short: >-
      Android-Props, der I/O-Pod, die Spieler-App und die Modi, die Handys brauchen: in Software
      fertig, iOS eingeschlossen (auf einem iPhone geprüft). Der Feldtest wartet auf echte Handys
      und Pods.
    done:
      - "<strong>Die App</strong> für Spielende, Marshals und die Spielleitung, auf Portugiesisch
        und Englisch, für Android und iOS (die iOS-Version hat ihre Checkliste auf einem iPhone
        bestanden)."
      - Ein Android-Handy arbeitet als Box, mit jedem Modus und den eigenen Bildschirmen des Modus,
        und tritt einem Spiel per QR-Code, NFC-Karte oder Text bei.
      - "<strong>Das Handy als Feld-Controller</strong>, in Software fertig und wartend auf ein
        echtes Handy: Es führt das Spiel und die Dienste des Felds allein aus."
      - >-
        <strong>Der <a href="{{ page.to.glossary }}#glossar-android-prop">I/O-Pod</a></strong>:
        Firmware, die einem Handy die Knöpfe, das Tastenfeld, die Lichter, die Sirene, den
        NFC-Leser und den LoRa-Funk eines Heltec-Boards leiht.
      - "<strong>Modi mit Handys und Tags</strong>: Kill Confirmed, Respawn und Leben, Check-in,
        das Medic-Kit und Money Factory."
    g_modes:
      title: Modi und Bildschirme
      items:
        - Kill Confirmed, Respawn und Leben und Check-in lesen signierte NFC-Tags der Spielenden.
        - "Das Medic-Kit: Wer getroffen wurde, scannt den eigenen Tag und hält einen Knopf, um
          geheilt zu werden, mit einer begrenzten Zahl an Heilungen."
        - "Money Factory: Fabriken machen Geld, solange ein Team sie hält; wer spielt, sammelt es
          mit dem eigenen Tag ein und zahlt es an einer anderen Box ein, und der Controller merkt
          sich, was jede Person trägt."
        - Modus-Bildschirme in YAML beschrieben, von Field Box und App gleich gezeichnet.
    g_players:
      title: Spielende und Marshals
      items:
        - "Spielende checken am Feld ein, indem sie einen gedruckten Aushang scannen (kein Konto,
          kein Internet), geben an, welche Repliken sie nutzen, und sehen, ob sie den Chrono
          bestanden haben."
        - >-
          <a href="{{ page.to.glossary }}#glossar-chrono">Chrono beim Check-in</a>: Energie, Limits
          pro Klasse, Stichproben, Messwerte von Marshal signiert. Marshals arbeiten die Liste
          „Repliken zum Chronen“ ab, und ihre signierten Messwerte markieren jede Replik als
          bestanden oder abgelehnt; sie haben auch das Replik-Register und die Tags der Spielenden.
        - Spielende können während eines Spiels ihre Position teilen, und der Controller entscheidet, wer sie sieht.
        - "Ein Feld oder Club mit eigenem Controller kann sein Logo, Hintergrundbild und seine Farbe
          in der App, auf der Anzeigetafel und auf dem Aushang zeigen und seinen Teams Namen und
          Wappen geben."
        - "Die Konsole der Orga meldet, wenn sich der Check-in-Aushang nach dem Druck geändert hat."
        - "Die Marshal- und Chrono-Bildschirme sagen, was die App wirklich tut, und die Limitlisten sind übersetzt."
        - "Die App hält mehr ihrer Geheimnisse mit dem Android Keystore versiegelt: den Schlüssel des Site-Servers, die Geheimnisse der Spieler und die Anmeldung am Site-Server."
        - "Die NFC-Tags der Spielenden werden vom Feld-Controller signiert und von der Konsole der Orga, dem Handy-Controller oder der Marshal-App geschrieben. Marshals halten dafür den Feldschlüssel nicht mehr."
        - "Replik-Labels: Die App zeigt, teilt oder druckt den QR-Aufkleber jeder Replik, und die Konsole druckt sie für alle, die eingecheckt sind. Die Warteschlange der Marshals scannt sie."
        - "Positionen in Gebäuden: Die Spielleitung setzt BLE-Beacons auf den Plan, und ein Handy, das eines hört, meldet seinen Raum statt GPS. Unter Android in Software und mit Attrappen, nicht mit echten Beacons ausprobiert. Auf einem iPhone leistet ein Plugin über Apples CoreLocation dasselbe, solange die App im Vordergrund ist (sonst GPS und die letzte Etage); es ist gebaut und kompiliert in der CI, und auf einem iPhone ist es nicht ausprobiert."
        - "Die App folgt einem Spiel über den QR-Code der Anzeigetafel, auch wenn der Handy-Controller HTTPS mit seiner eigenen Feld-CA anbietet. In Software, nicht an einem echten Handy ausprobiert."
        - "Spielende sagen, auf welcher Ebene sie sind, und sehen den Feldplan mit den Positionen, die sie sehen dürfen."
        - "Spielverlauf in der App: die Spiele, an denen jemand teilgenommen hat, das neueste zuerst."
        - "Anmeldung mit Google, Microsoft, Apple oder einem Passkey in der App, mit einem Kontobildschirm. Android und, in Swift, auch iOS (der Browser der Social-Anmeldung als ASWebAuthenticationSession, Passkeys über Apples Plattform-Zugangsdaten; Passkeys unter iOS sind beim Bauen optional zuzuschalten und brauchen das kostenpflichtige Apple-Programm). Der iOS-Teil wird in der CI kompiliert und ist auf einem iPhone nicht ausgeführt worden; die Anmeldung der App ist auf einem echten Handy nicht ausprobiert (die Seite des Site-Servers wurde mit Google und Microsoft ausprobiert, siehe Phase 4)."
        - "Der Feldplan des Spielers kann das Raster des Feldes und die eigene Zelle des Spielers zeigen."
        - "Schiedsrichter können beim Registrieren einen NFC-Sticker an eine Replik binden."
        - "Das Handy eines Marshals behält den Beitrittsschlüssel des Feldes nicht mehr: nur ein Prop (seine Beitrittskarte) und der Handy-Controller tun das, und ein Update löscht ihn vom Handy eines Marshals."
        - "Scoreboard-Links, die die eigene CA des Feldes festlegen, werden pro Feld gemerkt und vergessen, wenn sich die CA ändert."
        - "Solange ein laufendes Spiel in der Spielendenansicht offen ist, hält ein Android-Vordergrunddienst mit einer Benachrichtigung die App am Laufen, damit das Vibrieren auch bei geschlossener App oder ausgeschaltetem Bildschirm kommt. Nicht auf iOS. Nicht auf einem echten Handy probiert."
        - "Die Field Boxen zählen als Beacons: Eine platzierte Box registriert sich als Beacon neben denen der Spielleitung, und ein Handy, das schon teilt, übernimmt Änderungen am Verzeichnis während des Spiels. In Software, nicht mit einem Handy und einer echten Box ausprobiert."
        - "Die Datenschutzerklärung in der App: eine Aufforderung Lesen und bestätigen, wenn dem Konto zuletzt eine andere Version gezeigt wurde, die Erklärung in der Sprache der App, nichts wird blockiert. Die App kann ein Konto anlegen (mit Passwort oder per Social Login), nachdem sie den Hinweis gezeigt hat, mit dem Feld „Ich bin 16 oder älter“; Jüngere checken am Spielfeld ohne Konto ein. Eine Registrierung per Social Login trägt die Version der Erklärung, die die Person sah, und eine Anmeldung funktioniert weiter mit einem älteren selbst betriebenen Server. Der Chrono-Link zwischen den Feldern eines gehosteten Hubs (ein Einmalcode) erscheint nur im gehosteten Modus. In Software."
        - "Die Kartenprüfung beim Check-in: Prüft das Feld die Mitgliedschaft, bleibt ein Check-in offen, bis eine Marshal-Person oder die GM mit der echten Karte in der Hand „Karte gesehen, stimmt“ ankreuzt; die Mitgliedsnummer wird dann auf dem Controller gelöscht (Ergebnis und Ablaufdatum bleiben), und ohne Karte lässt sich jemand trotzdem durchwinken, mit Begründung im Protokoll und nie mit der Nummer. In der Konsole, in der Marshal-Warteschlange der App und in beiden Controllern. Nur Software."
        - "Das Teilen der Position ist beim Check-in eine eigene, nicht vorangekreuzte Wahl (in der App und beim Handeintrag der Konsole), mit der Angabe, wer sie sieht; Ablehnen verhindert weder den Check-in noch das Spiel, und jede Person kann sie jederzeit ein- oder ausschalten. Ohne sie lehnt der Controller die Positionen ab. Nur Software."
        - "Das Sicherheits-Review der App: Eine angeheftete Feld-CA ist genau ein Zertifikat, kein App-weites unverschlüsseltes HTTP auf Android (nur Loopback, der Host des Emulators, 192.168.4.1 und atalaia.local), eine Release-APK, die nie aus Versehen mit dem Debug-Schlüssel signiert wird, und ein Ticket der Social-Anmeldung, das an die App-Instanz gebunden ist. Auf einem echten Handy nicht ausprobiert; den Signaturschlüssel für Releases muss der Maintainer noch erzeugen."
        - "Die Ereignisliste und der Spielverlauf der Spielenden lassen Routine-Ereignisse ohne Text für Spielende weg (eine Box, die ihr Setup bestätigt, Nodes online oder offline, Tag-Scans, Treffer auf Ziele), statt rohe Typnamen zu zeigen."
        - "Der Scan eines gedruckten Tickets durch einen Marshal oder den GM bestätigt einen Check-in aus der App nicht mehr von selbst: Beide Namen werden angezeigt, und der Marshal bestätigt ihn oder verwirft ihn. In v0.10.0 (7. November 2026); noch nicht auf einem echten Handy ausprobiert."
        - "Das Handy der Anmeldung weist sich beim Check-in aus: Wenn die App sich für ein Spiel anmeldet (oder ein neues Ticket anfordert), gibt sie der Anmeldung einen Schlüssel, der auf diesem Handy bleibt, und signiert beim Check-in die Challenge des Feld-Controllers. Marshals und GM sehen in der Marshal-App, in der Check-in-Liste der Konsole und auf ihrer Karte für gedruckte Tickets, ob ein Check-in aus der App gebunden ist (das Handy der Anmeldung) oder nicht (eine Kopie des Tickets, eine ältere App, eine Anmeldung im Web). Deswegen wird nichts abgelehnt, und ältere Apps, Listen und Controller funktionieren weiter. In v0.11.0 (7. November 2026); auf einem Computer getestet, noch nicht auf einem echten Handy."
    g_props:
      title: Android-Props und I/O-Pod
      items:
        - "Ein Android-Prop nimmt am Spiel des Controllers über das WLAN des Felds teil, oder über
          seinen Funk mit einem I/O-Pod."
        - "Die Firmware des Pods leiht dem Handy per USB oder Bluetooth die Team-Knöpfe, das
          Tastenfeld, die Lichter, die Sirene, den NFC-Leser, den Gehäuseschalter und den LoRa-Funk
          eines Heltec-Boards."
        - "Die App verbindet sich mit einem verlorenen I/O-Pod von selbst wieder; gelingt das nicht oder antwortet ein anderer Pod, verbindet die Spielleitung denselben Pod im Menü des Spiels erneut, ohne das Spiel neu zu starten. Nicht mit einem echten Pod ausprobiert."
        - "Android-Props holen signierte Modus-Pakete von ihrem Controller, wie die Boxen. In Software."
        - "Die GM-Konsole kann die Einstellungen eines I/O-Pods per Funk schicken: die Farben der vier Knöpfe, die Helligkeit des LED-Rings, die Lautstärke und ob der Gehäuseschalter meldet. Der Pod prüft den Befehl wie jeden anderen, speichert die Einstellungen in seinem Flash und antwortet; der Controller sendet ihn erneut, bis er eine Antwort hört. Vorher wurden sie beim Bauen der Firmware festgelegt. In Software und gegen den Code des Pods auf einem Computer, nicht mit einem echten Pod probiert."
        - "Das Koppeln eines Handys mit einem I/O-Pod per Bluetooth verlangt einen 6-stelligen Code, den der Pod auf seinem kleinen Display zeigt, damit sich niemand dazwischenschalten kann; ein auf die alte Art gekoppeltes Handy wird einmal gebeten, neu zu koppeln, und die PRG-Taste des Pods vergisst alle Handys. In Software und in Tests auf einem Computer, nicht mit einem echten Pod ausprobiert."
        - "Die Strafe einer Box eines Android-Props erreicht den Controller jetzt, über die WLAN-Verbindung und die Funkverbindung. In Software."
        - "Der I/O-Pod leiht dem Handy seine einfachen Ausgänge (eine Sirene oder die Fernbedienung einer
          Nebelmaschine über einen RC-Relaisschalter, an GPIO 33, dann 1) und seinen Erweiterungsanschluss:
          die Treffer eines Ziel-Addons und die Relais eines I2C-Ausgangsmoduls an einem Pod, der dafür
          gebaut ist. Das Spiel auf dem Handy schaltet sie mit den Regeln einer Box, der Pod schaltet sie ab,
          wenn das Handy weg ist, und die GM-Konsole zeigt die Ausgänge und Module eines Props. In der
          Firmware und gegen den Code des Pods auf einem Computer, nicht mit einem echten Pod probiert."
    g_controller:
      title: Das Handy als Feld-Controller
      items:
        - "Die Spiel-Engine, mit field.lua eines Modus auf dem gemeinsamen Kern, einem MQTT-Broker
          und einem Positionsfilter; die REST-API, der Live-Stream und die MQTT-Topics; Spiele über
          einen Neustart hinweg; Beitritts-Payloads."
        - "Android-Props in seinem WLAN, ein I/O-Pod als sein Funk, der Check-in am Feld mit
          Spieler-Tokens, die Liste „Repliken zum Chronen“ und die Positionen der Spielenden.
          Geprüft mit denselben Vertragsfällen wie der Pi-Controller und ausgeführt mit dem Code
          von Pod und Field Box auf einem Computer."
        - "Sein Bildschirm: die Rolle auf dem Startbildschirm der App, auch bei ausgeschaltetem
          Bildschirm weiterlaufend, die GM-Konsole aus der App ausgeliefert und HTTPS mit einer
          Feld-CA, die auf dem Handy erzeugt wird."
        - "Der Feldplan (ein Plan pro Ebene, seine Kartenposition, Kartenobjekte mit der Feldgrenze,
          das aus einer Karte geladene Feld, sodass die Warnung beim Verlassen der Grenze dort auch
          funktioniert) und der Funkkanal, mit der Suche nach einem ruhigen Kanal über den
          I/O-Pod."
        - "Die Boxen über Funk: versiegelte Einladungen ins nächste Spiel; das Spielende, den Boxen
          mitgeteilt, auch wenn das Handy ohne den Spielschlüssel neu gestartet wurde; neue Boxen,
          aufgenommen über den Code, den sie zeigen, oder über eine Feldkarte, die das Handy per NFC
          schreibt; Firmware-Updates zwischen den Spielen, über den I/O-Pod oder das USB-Funkmodem
          des Pi, und das Handy sagt, warum, wenn sein Funk sie nicht tragen kann."
        - "Presets, Modus-Uploads und signierte Modus-Pakete, an Boxen geschickt, denen sie fehlen;
          auf dem Handy kompilierte Szenarien; Rollenpakete in einem Spiel; Teamnamen und Wappen."
        - "Auch alles Übrige, was der Pi kann: Failover (ein Handy und ein Pi können gegenseitig ihre
          Reserve sein), der Sync mit dem Site-Server (Spiele, Logs und Punkte gehen raus, wenn
          Internet da ist; Anmeldelisten, Branding und Szenario-Bibliothek kommen von dort), die
          Remote-Spielleitung und der ATAK-Feed."
        - "Die Konsole der Orga passt auf ein Handy: Check-in- und Marshal-Tabellen stapeln sich, ohne seitliches Scrollen."
        - "Der eigene Bildschirm des Handy-Controllers importiert eine Anmeldeliste (eine CSV- oder JSON-Datei, gewählt mit der Dateiauswahl von Android), ganz ohne GM-Konsole."
        - "Ein Bereitschafts-Controller übernimmt die Beacon-Einstellungen der Boxen (den Feldschalter, die abgeschalteten Boxen, die Räume) und die Plätze der Boxen aus seinem Beitritt, sodass Handys nach einem Failover dasselbe Beacon-Verzeichnis bekommen; eine Konsole, die auf dem Bereitschafts-Controller schon offen ist, verschiebt die Marker der Boxen sofort, ohne Neuladen. In Software, in beiden Controllern; die Verschiebung der Marker ist in einem Headless-Browser getestet."
        - "Der Handy-Controller zieht mit der Sicherheitsprüfung des Pi-Controllers gleich: Der Widerruf signierter Modi schlägt sicher fehl (mit einer Untergrenze je Modus und einer Altersgrenze für ein Handy ohne Netz, beides im Bildschirm Modus-Pakete), und der ATAK-Feed für die Spielleitung läuft über TLS mit einer festgelegten Zertifizierungsstelle. In Software getestet; nicht auf einem Handy im Feld."
        - "Der Android-Controller gibt Boxen, die in einem beendeten Spiel hängengeblieben sind, frei wie der Raspberry Pi, mit einem USB-Funkmodem (ein I/O-Pod kann solche Boxen nicht melden), und hat den Uhrenschutz des Pi. In v0.9.0 (6. November 2026); noch nicht auf einem echten Handy."
    g_ios:
      title: iOS
      items:
        - "Das Projekt liegt im Repository, die CI baut es auf einem Mac, und es lief schon auf
          einem iPhone."
        - "Am 26.10.2026 bestand seine Checkliste auf dem Gerät auf einem iPhone: 12 automatische
          Prüfungen und, von Hand, QR-Scannen mit der Kamera, Check-in mit dem Aushang des Felds
          über HTTPS, Positionsfreigabe bei sichtbarer App, die Warnung beim Verlassen der Grenze
          mit ihrer Vibration und atalaia://-Links."
        - "Beacons in Gebäuden: ein Swift-Plugin über CoreLocation, auf denselben Kanälen wie unter Android, braucht nur die Ortungserlaubnis und funktioniert, solange die App im Vordergrund ist. Es kompiliert in der CI; auf einem iPhone ist es noch nicht gelaufen."
    next:
      - "Der Feldtest mit echten Handys und Pods (Planphase G) wartet auf die Hardware. Bisher lief
        die App auf Android-Emulatoren und auf einem iPhone gegen den Controller auf dem
        Labortisch, und die Pod-Firmware nur als ihr eigener Code auf einem Computer."
      - Das Handy als Feld-Controller wartet auf ein echtes Handy.
      - "Unter iOS braucht NFC ein kostenpflichtiges Apple-Konto; der Prop und das Handy als
        Feld-Controller bleiben nur für Android."
      - "Das Beacon-Plugin auf einem iPhone ausprobieren (auf einem Mac gebaut) und die Beacons mit echten, auch unter Android."
      - "Die Website-Anmeldung unter iOS (Browser der Social-Anmeldung und Passkeys) auf einem iPhone ausprobieren."
      - "QR-Code der Anzeigetafel, Ebenenwahl, Spielverlauf und die Wiederverbindung zum Pod an einem echten Handy und Pod ausprobieren."
      - "Die Anmeldung der App auf einem echten Handy ausprobieren."
      - "Die Kartenprüfung, die Positionswahl beim Check-in, die angeheftete CA und die Kontoerstellung der App auf einem Feld und mit echten Handys ausprobieren."
    gate: "Gate: Ein Spiel mischt ESP32- und Android-Props ohne Probleme."
  p4:
    title: Site-Server und erweitertes Spiel
    short: >-
      Site-Server, Spielplanung und Anmeldung, eigene Szenarien, erweiterte Modi, ATAK. Alle
      Software-Schritte sind gebaut; die Anmeldung mit Google und Microsoft wurde auf einem
      Testserver echt ausprobiert. Es fehlen ein echter Server, die Go-live-Bedingungen des
      Hosted-Modus und die Tests auf Hardware.
    done:
      - "<strong>Erweiterte Modi</strong>: Master und Satelliten, das Hacking-Terminal,
        VIP / Payload und die Logik von Zielfenster."
      - "<strong>Eigene Szenarien</strong>: ihre Laufzeit auf dem Feld-Controller, ein Compiler für
        YAML-Szenarien, ein Editor in der GM-Konsole und die Ziele in der App."
      - "<strong>Der ATAK-Feed</strong>: Boxen und Zonen auf ATAK-Karten, auf dem Feld und, über den
        Site-Server, für Staff außerhalb."
      - "<strong>Der Site-Server</strong>: Konten mit Zwei-Faktor-Codes, Rechte an persönlichen
        Daten, Controller-Sync, Chrono-Register, Spielverlauf und Szenario-Bibliothek."
      - "<strong>Spielplanung und Anmeldung</strong>, in der App oder ohne App auf den Webseiten des
        Feldes, mit öffentlichen Feldseiten, Kalender-Feeds und Club-Profilen."
      - "<strong>Hosted-Modus</strong>: viele Felder auf einem Server, jedes vom anderen getrennt,
        mit seinem Deployment."
    g_modes:
      title: Modi
      items:
        - "Master und Satelliten: Satelliten, die man mit dem Master hält, erhöhen seine Punkte;
          wechselt der Master den Besitzer, werden sie frei."
        - "Das Hacking-Terminal: ein Rätsel am Tastenfeld, das einen Code verrät oder das Terminal
          erobert."
        - "VIP / Payload: Ein Team eskortiert seinen VIP oder ein Handy mit GPS zu einer
          Extraktionszone; Checkpoint-Boxen punkten, solange sie gehalten werden; Positionen bleiben
          auf dem Feld-Controller und dem Handy."
        - "Die Regeln von Zielfenster: Ein Treffer, während das Ziel die Farbe eines Teams zeigt,
          punktet für dieses Team. Die Firmware des Ziel-Addons ist geschrieben; gebaut wurde noch
          kein Ziel."
        - "Geo-Funktionen im Kern: Entfernungen und Zonen für jedes Skript, auf jeder Plattform
          identisch."
    g_scenarios:
      title: Eigene Szenarien
      items:
        - "Die Laufzeit: Ein Szenario läuft auf dem Feld-Controller und sagt den Boxen des
          eingebauten Ziele-Pakets, was sie sind (ein Punkt zum Erobern, ein Code, Tags oder Karten
          zum Scannen, ein Bombenplatz); sie melden, das Szenario punktet."
        - "Der Compiler: ein YAML-Szenario mit sieben Zieltypen, mit Abhängigkeiten, Enthüllungen
          und Zeitfenstern, geprüft mit jedem Problem verortet und erklärt, und von der
          Kommandozeile kompiliert."
        - "In der GM-Konsole: ein Editor, der jedes Problem auflistet, während die Orga tippt, und
          das Szenario installiert; die Boxen bekommen die Namen des Szenarios beim Beitritt."
        - "In der App: Spielende sehen die Ziele, die für sie gedacht sind, mit Namen und Stand, ein
          verstecktes erst nach der Enthüllung; jeder Squad kann seine eigene Kette haben, ein Ziel
          nach dem anderen, dem ganzen Squad oder nur dem Squad-Lead gesagt."
    g_atak:
      title: ATAK und die Feldkarte
      items:
        - "Der ATAK-Feed: Boxen und Zonen auf ATAK-Karten über das Feld-WLAN, in den Farben ihrer
          Besitzer, platziert, indem man zwei Ecken des Feldbilds ihre Kartenposition gibt."
        - "Die Spielleitung markiert Sicherheitszonen, Respawn und HQ jedes Teams, den Parkplatz,
          Erste Hilfe und Ziele auf dem Plan des Felds, als Pin, Kreis oder Fläche, jedes für alle,
          für ein Team oder nur für die Orga sichtbar, in der Konsole und auf ATAK."
        - "Das Feld lässt sich aus einer Karte laden: Die Spielleitung findet es von ihrem Standort
          oder über einen Ortsnamen und zeichnet seinen Umriss auf OpenStreetMap, und der Browser
          zeichnet das Feldbild aus den Daten von OpenStreetMap über den offenen Luftbildern des
          Landes (das portugiesische Festland, Spanien, Frankreich samt Übersee, die Niederlande,
          Belgien, Luxemburg, die Schweiz, Liechtenstein, zwölf deutsche Länder, Polen, Tschechien
          und Österreich). Der Umriss wird zur Feldgrenze, das Außen abgedunkelt."
        - "Die Handys der Spielenden warnen mit einem Banner und einer Vibration, wenn sie die Grenze
          verlassen, mit ihrem eigenen GPS, ohne etwas zu senden."
        - "Spielerpositionen gehen nie an alle, nur an Staff-Geräte, wenn das Feld es einschaltet.
          Staff außerhalb des Felds bekommt dasselbe über den Site-Server, über eine verschlüsselte
          Verbindung mit einem Zertifikat pro Gerät, das das Feld ausstellt und sofort widerrufen
          kann; Positionen gehen nur an Zertifikate von Spielleitung oder Marshals."
        - "Mehrstöckige Felder in der Konsole: ein Grundriss pro Ebene und jede Box auf ihrer Ebene."
        - "Noch nicht mit einem echten ATAK-Handy ausprobiert, auch nicht auf einem echten Feld."
        - "Eine Box, die Progressive Domination zur aktiven gemacht hat, sagt das auf ATAK."
        - "Die Feldkarten-Seite läuft auch auf dem Handy als Feld-Controller."
        - "ATAK zeigt Spielende in Gebäuden am Ort ihres Beacons, mit dem Raum in den Bemerkungen."
        - "Das Raster in ATAK und eine druckbare Rasterkarte."
        - "Der Remote-GM sieht die Positionen der Spieler, wenn sie sie teilen."
        - "ATAK-Gerätezertifikate gelten 90 Tage (vorher 7), und die ATAK-Seite für die Mitarbeitenden warnt, wenn eines in 14 Tagen abläuft."
        - "Das Feld kann das Laden von Karten in der Konsole abschalten (Einstellungen, Kartenabruf): dann erreicht „Feld aus einer Karte laden“ weder OpenStreetMap noch Overpass, Nominatim oder die Luftbilder. Standardmäßig an."
    g_server:
      title: Site-Server, Konten und Daten
      items:
        - "Sein Gerüst: Datenbank, Migrationen und ein Health-Check, in einem eigenen Container."
        - "Konten: Passwörter, Zwei-Faktor-Codes Pflicht für Orga und Marshals, Sitzungen und Rollen
          pro Feld."
        - "Rechte an persönlichen Daten: Auskunft, Export, Berichtigung, Löschung, Einwilligungsnachweise und eine tägliche Löschung nach Aufbewahrungsfrist."
        - "Controller-Sync: Feld-Controller schieben ihre Spiele, Logs und Punkte, offline zuerst und
          gefahrlos wiederholbar. Noch nicht über eine echte 4G-Verbindung."
        - "Das Chrono-Register: signierte Messwerte geprüft und so gespeichert, wie sie signiert
          wurden, nur öffentliche Schlüssel, Austausch zwischen Feldern mit Einwilligung. Noch nicht
          mit einem echten Chronographen."
        - "reset-totp: Der Betreiber setzt den Zwei-Faktor-Code eines Kontos zurück, das seinen Authenticator verloren hat."
        - "Feld-Controller holen die Chrono-Messwerte anderer Felder für die Spielenden auf ihrer Liste, nur mit der Einwilligung jeder Person. Sie halten sie getrennt von den eigenen Messwerten und bewerten sie nie."
        - "Die Controller holen die Einstellungen und das Erscheinungsbild des Felds vom Site-Server, und eine Änderung kommt sofort beim Pi und beim Handy-Controller an. In Software."
        - "Anmeldung mit Google, Microsoft oder Apple und mit Passkeys. Passwörter sind optional; das Personal braucht weiterhin einen zweiten Faktor. Google und Microsoft wurden auf dem Testserver (tests.atalaia-project.link und demo.atalaia-project.link) mit den echten Anbietern ausprobiert; Apple noch nicht."
        - "Eine Kontoseite für das Personal, auf der jede Person ihre eigenen Anmeldungen verwaltet: Passkeys, verknüpfte Konten, Passwort und Zwei-Faktor-Code."
        - "Änderungen an Szenarien, Presets und Terminen erreichen die Controller sofort."
        - "Wie lange ein Feld Daten behält, ist eine Einstellung des Feldes: Spielverlauf und Chrono-Einträge haben je eine Aufbewahrungsdauer, einzustellen am Controller, in der GM-Konsole oder auf der Einstellungsseite des Site-Servers: der Spielverlauf standardmäßig 90 Tage (Teamergebnisse ohne Spieler-IDs 365), Chrono-Einträge 365. Die tägliche Bereinigung löscht ein beendetes Spiel dieses Alters, nie bevor der Site-Server alles davon hat. Das ungenutzte Aufbewahrungsfeld pro Konto ist weg."
        - "Die Löschung einer Person an einem Feld-Controller erreicht den Site-Server mit der nächsten Synchronisierung von selbst (nie mit einem Namen) und löscht dort auch die Chrono-Einträge dieser Person."
        - "Vorlagen für den Datenschutzhinweis, den Auftragsverarbeitungsvertrag und die Bedingungen für die Freigabe zwischen Feldern, auf Portugiesisch und Englisch (der Vertrag auch auf pt-PT), dazu eine Vorlage für die Datenschutz-Folgenabschätzung: Sie geben die Positionen wieder, die der Anwalt oder die Anwältin des Maintainers am 30. Oktober 2026 gebilligt hat (Konten auf Vertragsbasis mit Mindestalter 16, die Mitgliedskarte beim Check-in geprüft und die Nummer gelöscht, Verstöße aufgrund berechtigter Interessen, Positionsfreigabe per Einwilligung, kein Datenschutzbeauftragter). Weiterhin Vorlagen, die jedes Feld ausfüllt, keine Rechtsberatung für ein bestimmtes Feld."
        - "Der Site-Server veröffentlicht den Datenschutzhinweis, den der Betrieb ihm gibt, als Seite und über die API in vier Sprachen und zeigt ihn den Konten erneut, wenn sich seine Version ändert (ein Konto beruht auf dem Vertrag, nicht auf einer Einwilligung). Nichts wird gesperrt: Export und Löschung bleiben möglich. Auf einem Computer getestet."
        - "Ein Social-Login-Konto wählt seinen Benutzernamen auf der Kontoseite gleich nach dem Anlegen (überspringbar; der Name des Anbieters nur, wenn die Person es verlangt). Jedes Konto kann sich mit seiner eigenen Anmeldemethode umbenennen, und zwei Konten einer Person lassen sich zusammenführen, wenn die Person beide nachgewiesen hat (nie in ein Konto mit Personalrolle hinein oder aus ihm heraus). Der Fehler bei fehlender Einwilligung erscheint am Kontrollkästchen. Auf einem Computer getestet; der Schritt Benutzername und das Zusammenführen sind auf dem Testserver noch auszuprobieren."
        - "Eine Registrierung per Social Login hält die Version der Datenschutzerklärung fest, die die Person tatsächlich sah: Der Server lehnt eine veraltete ab und prüft vor dem Anlegen des Kontos noch einmal. Auf einem Computer getestet."
        - "Die tägliche Aufbewahrungsbereinigung löscht auch anonymisierte Konten (was eine Löschung oder ein Zusammenführen hinterlässt), sobald nichts mehr auf sie verweist. Auf einem Computer getestet."
        - "Wer die Anmeldung eines Kontos ändert, braucht einen zweiten Faktor: Passkeys hinzufügen, umbenennen oder entfernen, Zwei-Faktor-Codes einrichten oder abschalten, das Passwort ändern, eine Social-Anmeldung verknüpfen und ein Zusammenführen bestätigen werden abgelehnt, wenn die Sitzung keinen TOTP- oder Passkey-Schritt durchlaufen hat (eine Social-Anmeldung allein zählt nicht); ein Zusammenführen bringt nie Passkeys in ein Personalkonto. Die Kontoseite des Personals und die App fragen zuerst diesen Schritt ab. Auf einem Computer getestet, nicht bei den echten Anbietern."
        - "Das eigene Sicherheits-Review des Site-Servers: Anfragekörper begrenzt (413 ab 1 MiB, 4 MiB bei Uploads), dieselbe Antwort auf „kein solches Konto“ und auf eine abgelehnte Rollenvergabe, der Feld-Export mit nur den Audit-Zeilen des Feldes, der Schalter der öffentlichen Seite in der Feldsuche der App beachtet, eine Pflicht-URL, der Aussteller einer Social-Anmeldung zusammen mit ihrem Subjekt gespeichert, HTTP-Anfragen hinter einem Proxy auf HTTPS umgeleitet und ein Health-Check, der nur ok sagt. Zum Teil auf dem Preview-Server gefunden."
        - "Konten beruhen auf dem Vertrag, nicht auf einer Einwilligung: Bei der Anmeldung wird festgehalten, welche Version des Datenschutzhinweises gezeigt wurde, mit einem Kästchen „Ich bin 16 oder älter“ (auf der Personalseite und in der App); ein Geburtsdatum wird nicht gespeichert; ohne veröffentlichten Hinweis ist die Registrierung geschlossen. Alte Einwilligungen wurden zu Hinweis-Einträgen. Auf einem Computer getestet."
        - "Der Code des Datenschutz-Reviews: Die Netzwerkadresse eines Audit-Eintrags wird nach 180 Tagen gelöscht (einstellbar); ein Konto, das 24 Monate nicht benutzt wurde, bekommt eine Warnung und wird 30 Tage später anonymisiert; die Löschung einer Person oder eine zurückgezogene Chrono-Einwilligung erreicht die Controller anderer Felder, die ihre Kopien verwerfen; Löschungen bleiben als Hashes in einem Verzeichnis außerhalb der Datenbank und werden nach einer Wiederherstellung erneut angewendet; eine neue Personalseite markiert Wiederholungstäter nur als Hinweis (eine einfache Verwarnung zählt nie), und eine Sperre endet standardmäßig nach 12 Monaten; der Spielverlauf bleibt 90 Tage mit Spieler-IDs erhalten, die Teamergebnisse ohne sie 365. Auf einem Computer getestet."
        - "Ein Feld nimmt die Bedingungen für die Freigabe zwischen Feldern an (die Administration, auf der Einstellungsseite), bevor es Chrono-Einträge teilt; Version, Datum und Konto werden festgehalten, und ändern sich die Bedingungen, ruht die Freigabe, bis sie angenommen sind. Das Feld ist Verantwortlicher für die Daten seiner Spielenden, der Hub-Betreiber sein Auftragsverarbeiter, und die Felder, die teilen, sind nur für diesen Schritt gemeinsam Verantwortliche. Auf einem Computer getestet."
        - "Wer den Server betreibt, kann über die Kommandozeile ein Passwort für ein bestehendes Konto setzen (<code>set-password</code>, zweimal ohne Echo abgefragt, nie in der Kommandozeile): der Ausweg für ein Staff-Konto ohne zweiten Faktor, das seine Anmeldemethoden deshalb nicht über die Seite ändern kann."
    g_games:
      title: Spiele, Clubs und Staff-Seiten
      items:
        - "Spielplanung, mit einer öffentlichen Seite pro Feld und offenen iCalendar- und
          JSON-Feeds seiner Spiele (ohne persönliche Daten)."
        - "Die Anmeldung zu diesen Spielen, mit vorab angegebenen Repliken und einem Check-in-Ticket:
          Der Feld-Controller holt die Liste und meldet, wer gekommen ist. Anmeldung aus der App;
          Import einer Anmeldeliste (CSV oder JSON), die von einer anderen Plattform exportiert
          wurde."
        - "Club-Profile: Name, Farbe, Logo und Wappen, Mitglieder, eine öffentliche Seite, standardmäßig
          aus, mit Melde-Knopf und Moderation. Branding und gespeicherte Teams eines Felds werden
          mit seinen Controllern synchronisiert, sodass das Wappen eines Clubs jedes Feld erreicht,
          das sein Team gespeichert hat."
        - "Spielverlauf: Punkteverlauf und Ereignislog jedes Spiels; Spielende und Zuschauende sehen
          ein laufendes Spiel eine Minute verzögert, ohne Geheimnisse oder Spieler-IDs. Eine
          öffentliche Anzeigetafel pro Feld (standardmäßig aus)."
        - "Die Szenario-Bibliothek des Felds mit ihren Spiel-Presets, so geprüft, wie der
          Feld-Controller sie prüft, und von jedem Controller des Felds installiert, einer
          Reserve eingeschlossen."
        - "Webseiten für das Staff des Felds, auf Portugiesisch und Englisch und auf dem Handy:
          Anmeldung mit dem Zwei-Faktor-Code, Spielverlauf, Szenario-Bibliothek (jedes Problem vor
          dem Speichern gezeigt, Revisionen und Presets), Gerätezustand sowie Live-Ansicht und
          Befehle der Remote-Spielleitung. Im Headless-Browser getestet, noch nicht auf einem
          echten Server."
        - "Controller entfernen ein Szenario oder Preset, das der Site-Server archiviert oder gelöscht hat, außer ein Spiel nutzt es noch."
        - "Staff-Seiten für den Spielplan: Spiele auflisten, anlegen, bearbeiten, veröffentlichen und absagen, mit Zeiten in der Zeitzone des Felds."
        - "Staff-Seiten für die Anmeldungen: wer sich angemeldet hat, Name, Team oder Verbandsnummer ändern, eine Anmeldung zurückziehen sowie CSV-Export und -Import."
        - "Eine druckbare Spieltagsliste, mit der Angabe, wann ein Controller sie zuletzt geholt hat."
        - "Staff-Aktionen an einer Anmeldung: bezahlt oder nicht bezahlt (der Server nimmt kein Geld an), nicht erschienen, in ein anderes Spiel verschieben, wiederherstellen, die Repliken bearbeiten. Im Headless-Browser getestet, nicht auf einem echten Server."
        - "Seiten für das Personal zu Rollen, Sync-Schlüsseln, Erscheinungsbild, Clubs, Plattform-Verknüpfungen, Firmware und Verwaltung."
        - "Die Seite des Remote-GM aktualisiert sich live, ohne Neuladen."
        - "Die Mitgliedschaft in einem Verband wird bei der Anmeldung und beim Check-in geprüft: APDs bei Spielfeldern in Portugal, anderswo jeder Verein oder Verband."
        - "Eine Seite für das Personal mit den Einstellungen des Spielfelds: öffentliche Seite, Check-in-Regeln, Mitgliedschaft, Chrono-Freigabe und Land."
        - "Chrono-Einträge zeigen, wie weit eine Replik über dem Limit lag, und markieren Wiederholungstäter."
        - "Eine Seite für das Personal des Feldes mit dem Datenexport und dem Verbrauch der Kontingente."
        - "Punkteverläufe in Spielzeit."
        - "Die Seite eines Clubs listet die Felder auf, auf denen er spielt, auch die Seite für die Mitarbeitenden."
        - "Der Controller importiert eine Anmelde-CSV selbst, ganz ohne Site-Server."
        - "Die Konsole warnt, wenn ein Name Buchstaben hat, die die Boxen nicht zeichnen können: Teamnamen, der Name des Spiels, der eines Szenarios und die seiner Ziele."
        - "Anmeldelisten tragen die Verbands-ID und das Ablaufdatum der Mitgliedschaft als optionale Spalten, und der Export der Anmeldungen lässt sich unverändert wieder importieren."
    g_boxes:
      title: Boxen und das Feld
      items:
        - "Gerätezustand: Akku, Verbindung und Firmware jeder Box aus dem, was die Controller senden;
          der Feld-Controller meldet eine Box, die verstummt oder zurückkommt, und einen niedrigen
          Akkustand, den eine Box mit Akku-Anzeige auch selbst meldet. Noch nicht auf echten
          Boards."
        - "Ein Firmware-Katalog, der nur mit einem vertrauenswürdigen Schlüssel signierte Releases
          auflistet, und Firmware-Updates per Funk für die Field Box: Die Spielleitung lädt ein
          signiertes Release in den Feld-Controller hoch und aktualisiert die Boxen zwischen den
          Spielen, nie während eines; jede Box lädt es über das Feld-WLAN, prüft die Signatur mit
          Schlüsseln, die in ihre Firmware eingebaut sind, installiert es in ihrem freien Slot und
          kehrt zur alten Firmware zurück, wenn die neue nicht startet. In Software, noch nicht auf
          einem echten Board."
        - "Boxen ins Feld aufnehmen mit einer NFC-Feldkarte, dem USB-Kabel des Controllers oder dem
          6-stelligen Code, den die Box zeigt, gekoppelt über Funk. In Software, noch nicht auf
          einem echten Board."
        - "Boxen per Funk ins nächste Spiel einladen, ohne Karte oder QR-Code (der Beitritt reist
          verschlüsselt unter einem aus dem Feld-Beitrittsschlüssel abgeleiteten Schlüssel), und ein
          Start, der wartet, bis jede Rolle eine Box hat, außer die Spielleitung wählt „Trotzdem
          starten“. Auf zwei Labortisch-Boards mit dem Feld-Controller getestet."
        - "Boxen, die in jedem neuen Spiel gehört werden (der Nonce-Zähler des Funks ist jetzt pro
          Spiel, eine Korrektur vom Labortisch), und Box-Bildschirme, die dem Spiel folgen (Bereit,
          Warten, Neutral), in der Sprache des Felds, Englisch oder Portugiesisch. Auf zwei
          Labortisch-Boards getestet."
        - "Ein mitten im Spiel neu gestarteter Controller nimmt das Spiel wieder auf; einer, der den
          Spielschlüssel verloren hat, sagt seinen Boxen über das Feld-Funknetz trotzdem, dass das
          Spiel vorbei ist; falsche Admin-PINs warten immer länger, über Neustarts hinweg gezählt,
          ohne Standard-PIN auf einer echten Box. In Software, noch nicht auf den Labortisch-Boards."
        - "Die Remote-Spielleitung: Eine Orga mit der GM-Rolle, per Zwei-Faktor-Code angemeldet, sieht
          das laufende Spiel und startet, pausiert, setzt fort oder beendet es, oder schickt eine
          Nachricht oder einen Modus-Befehl, über eine Verbindung, die der Feld-Controller selbst
          öffnet, nur wenn das Feld es einschaltet, jeder Befehl auf beiden Seiten protokolliert."
        - "Der Tab Controller der Konsole listet den Zustand der Remote-Spielleitung und jeden Befehl, den sie bekam."
    g_deploy:
      title: Deployment und Hosted-Modus
      items:
        - "Das Deployment: HTTPS über Caddy mit automatischem Zertifikat, ein Setup-Skript, das alle
          Geheimnisse erzeugt, verschlüsselte tägliche Backups und eine Wiederherstellung in eine
          frische Datenbank. In Docker auf einem Computer getestet, nicht auf einem echten Server
          mit echter Domain."
        - "Hosted-Modus: ein Server für viele Felder, jedes in einem eigenen Datenbankschema unter
          eigener Adresse, mit Row-Level-Security darunter, sodass kein Feld je die Daten eines
          anderen sieht, und die Befehle der Betreiber, um die Daten eines Felds zu exportieren oder
          zu löschen. Gegen PostgreSQL in Docker getestet."
        - "Sein Deployment: ein Setup-Skript, das die Datenbankrollen des Hubs anlegt, jedes Feld
          unter eigener Adresse mit einem Zertifikat, das nur der Name eines aktiven Felds bekommen
          kann, und verschlüsselte Backups, wiederhergestellt mit jedem Feld getrennt von den
          anderen. In Docker getestet, nicht auf einem echten Hosted-Server mit echter Domain."
        - "Gehosteter Modus: ein Kontingent pro Feld, ein Datenexport, den die Verwaltung eines Felds herunterladen kann, und die offenen Verbindungen eines gelöschten Felds werden sofort geschlossen."
        - "Hosted-Modus: ein Speicherkontingent und eigene Domains pro Feld."
        - "Hosted-Modus: Jedes Feld hat eine eigene Datenbankrolle, so dass eine SQL-Injection nicht mehr auf die Daten eines anderen Feldes umschalten kann, indem sie die Einstellung ändert, die die Zeilensicherheit nutzte. Eine Lücke, die eine zweite SQL-Anweisung braucht, bleibt offen und ist dokumentiert. Gegen PostgreSQL in Docker getestet."
        - "Hosted-Modus: Felder, die Chrono-Einträge teilen, tun das jetzt auch zwischen den Feldern eines Hubs, über eine schreibgeschützte Ansicht, die eine Einwilligung braucht; eine Person verknüpft ihre Konten bei zwei Feldern mit einem Einmalcode, und nichts wird über E-Mail oder Namen zugeordnet. Gegen PostgreSQL in Docker getestet."
        - "Eine schreibgeschützte Live-Demo für den Vorschau-Server: Der echte Feld-Controller mit drei simulierten Field Boxen spielt endlos Spiele, abwechselnd auf einem offenen Feld und in einem erfundenen dreistöckigen Gebäude (ein Plan je Etage, fünfzehn Beacons, zwölf simulierte Spielende: sechs per Beacon verortet, fünf per GPS mit gewählter Etage, eine Person unsicher), und Besuchende sehen die GM-Konsole, die Anzeigetafel und eine Spielendenansicht, ohne etwas ändern zu können und ohne personenbezogene Daten. Seit dem 29. Oktober 2026 online unter demo.atalaia-project.link; ihre Spielendenansicht wird in einem Headless-Browser getestet."
        - "Hosted-Modus: ein einziger Rückruf der Social-Anmeldung für den ganzen Hub (optional): Der Betreiber trägt pro Anbieter eine Weiterleitungsadresse ein; der Hub signiert den Zustand, prüft das Feld in seinem Register und übergibt an den eigenen Rückruf des Feldes. In Docker getestet, nicht bei den echten Anbietern."
        - "Eine Go-live-Checkliste für den Betreiber: sechs Bedingungen, bevor irgendein Feld den Hosted-Modus bekommt (ein unterschriebener Auftragsverarbeitungsvertrag pro Feld, die Freigabebedingungen, jeder Unterauftragsverarbeiter im Anhang und in der EU, ein ausgefüllter Datenschutzhinweis, die eigenen Unterlagen des Betreibers, wenn er eine natürliche Person ist, und ein Nachweis auf einem echten Server)."
        - "Der Preview-Server (tests.atalaia-project.link und demo.atalaia-project.link) läuft seit dem 30. Oktober mit all dem und hat einen eigenen Datenschutzhinweis (Version preview-2026-10-31: Konten auf Vertragsbasis, 16 oder älter, kein Datenschutzbeauftragter)."
        - "Der Preview-Server installiert seine Datenschutzerklärung bei jedem Start und Update selbst (und hält an, wenn die Dateien einer Version fehlen), die Live-Demo sendet HSTS, und ein Wegwerf-Teststack (ein gehosteter Hub, ein falscher Login-Anbieter und ein Feld-Controller, nur auf 127.0.0.1) lässt einen autorisierten Sicherheitstest gegen den heutigen Code laufen."
    next:
      - Ein echter Server mit Domain.
      - "Die Go-live-Bedingungen des Hosted-Modus (ein unterschriebener Auftragsverarbeitungsvertrag pro Feld, die Freigabebedingungen, ein ausgefüllter Hinweis) und jedes Feld, das seinen eigenen Hinweis und seine Folgenabschätzung ausfüllt. Der Anwalt oder die Anwältin des Maintainers hat die rechtlichen Positionen am 30. Oktober 2026 gebilligt; der Hosted-Modus wird weiterhin nicht angeboten. Nichts von der Sicherheits-, Funk- und Rechtsarbeit vom 30. Oktober wurde auf einem echten Board oder Handy ausprobiert: Es läuft in Software und auf dem Preview-Server."
      - "Die Tests auf Hardware: echte Boards, ein echtes ATAK-Handy, eine echte 4G-Verbindung, ein
        echter Chronograph."
      - "Das Ziel-Addon an einer echten Platte (seine Firmware ist geschrieben), danach wird
        Zielfenster eine Voreinstellung der Field Box."
      - "Die Anmeldung mit Apple beim echten Anbieter sowie den Schritt Benutzername und das Zusammenführen von Konten auf dem Testserver ausprobieren."
      - "jogarairsoft.pt: Der Maintainer hat ihnen am 28. Oktober 2026 geschrieben und eine Integration vorgeschlagen (ihre Events, Teams und APDs zu uns; unser Spiele-Feed, Feldprofile, öffentliche Clubs und Ergebnisse zu ihnen). Wir warten auf ihre Antwort; nichts ist zugesagt."
    gate: >-
      Gate: Ein Wochenend-<a href="{{ page.to.glossary }}#glossar-milsim">Milsim</a> läuft von Anfang
      bis Ende auf Atalaia.
  p5:
    title: Community
    short: >-
      Visueller Modus-Editor, signierte Modus-Pakete, die Modus-Registry als Vorlage, Deutsch und
      traditionelles Chinesisch, Bauanleitungen, das Ziel- und das Ausgangsmodul des
      Erweiterungsanschlusses. Alle Software-Schritte sind gebaut. Die neueste Version, v0.12.0, ist
      mit dem Release-Schlüssel des Projekts signiert und enthält die Android-App, ohne ihren
      Schlüssel gebaut und in einem eigenen Schritt ohne Netzwerk mit dem Android-Schlüssel des
      Projekts signiert.
    done:
      - "<strong>Der visuelle Modus-Editor</strong>: eine Seite des Simulators, auf der ein Modus
        aus Blöcken zusammengesetzt wird (was passiert, wenn ein Team den Knopf hält, Timer, Punkte,
        Bildschirme und Töne, Zonen auf der Karte, GM-Befehle, mehrere Rollen, die Einstellungen,
        die die Spielleitung ändern kann, und die Logik des Feld-Controllers über mehrere Boxen).
        Er schreibt die Lua-Skripte und das Manifest des Modus während du arbeitest, auf
        Portugiesisch und Englisch, läuft offline, und ein Knopf probiert den Modus sofort im
        Simulator aus. Seine drei Beispiele bestehen dieselben Tests wie die handgeschriebenen
        Modi."
      - "<strong>Signierte Modus-Pakete</strong>: ein Archiv, signiert wie ein Firmware-Release. Der
        Editor erstellt das Paket des Modus selbst und zeigt, was der Modus-Schlüssel signieren
        wird, und den Befehl dazu; signiert wird weiterhin offline auf dem eigenen Computer."
      - "Der Feld-Controller installiert signierte Modi nur mit seinen eigenen vertrauenswürdigen
        Schlüsseln und zeigt, wer jeden signiert hat und ob das Projekt ihn geprüft hat."
      - "Eine Reihe von Sandbox-Ausbruchsversuchen läuft bei jeder Änderung; sie hat zwei Wege
        geschlossen, auf denen ein Skript sein Zeitlimit überziehen konnte."
      - "<em>Fehlende Modi senden</em> in der GM-Konsole: Eine Box, der der Modus eines Spiels fehlt,
        holt das signierte Paket über das Feld-WLAN vom Feld-Controller, nur zwischen den Spielen,
        während das Spiel auf sie wartet; sie prüft es mit Schlüsseln, die in ihre Firmware
        eingebaut sind, und behält es. Auf einem Computer getestet, nicht auf einer echten Box."
      - "Szenarien aus Blöcken in der GM-Konsole: die Boxen, die Ziele und wer sie sieht, wann sie
        sich öffnen, was sie erfüllt und was sie bringen, mit Maus, Touch oder Tastatur, sogar auf
        dem Handy. Der Feld-Controller prüft und installiert sie, als wären sie von Hand
        geschrieben."
      - "<strong>Die Modus-Registry</strong>, als Vorlage bereit: Ein Pull-Request mit einem
        signierten Modus wird automatisch geprüft (seine Signatur, dass sein Quelltext das
        Signierte ist, seine Lizenz, seine Tests im Simulator), und ein vom Projekt geprüfter Modus
        bekommt das Verifiziert-Siegel, die eigene Signatur des Projekts, die ihn erst zu den Boxen
        lässt. Wie man einen Modus einreicht, die Prüfliste, Schlüssel und Moderation sind
        aufgeschrieben."
      - "<strong>Deutsch und traditionelles Chinesisch</strong> (wie in Taiwan geschrieben) auf
        dieser Seite, in der GM-Konsole, im Modus-Editor, in der App, auf den Bildschirmen der Field
        Box, in den eingebauten Modi und auf den Seiten des Site-Servers: KI-Entwürfe, noch nicht
        von Spielenden geprüft, die diese Sprachen sprechen."
      - >-
        Das Repository der Registry gibt es (angelegt am 26. Oktober 2026), und seine
        <a href="https://vakaobr.github.io/atalaia-modes/">Seite</a> listet die Modi, noch ohne Einträge.
      - >-
        <a href="{{ page.to.build }}">Bauanleitungen</a> für Satellit, I/O-Pod,
        Erweiterungsanschluss, Ziel-Addon und den einfachen Ausgang (Sirene oder Nebel über einen
        RC-Relaisschalter), als Text. Noch keine Box wurde danach gebaut.
      - "<strong>Der Erweiterungsanschluss in der Firmware</strong>: Eine Box findet ein Modul in
        ihrem Anschluss innerhalb von 2&nbsp;s und gibt jeden Treffer an das Skript des Modus
        weiter, und das Zielmodul hat eine eigene Firmware, mit UF2-Dateien in den Releases. Auf
        einem Computer gegen ein simuliertes Modul getestet, noch nicht an einem echten Anschluss
        oder einer echten Platte."
      - "<strong>Das I2C-Ausgangsmodul</strong>: bis zu vier Relais oder MOSFETs am Anschluss einer
        Box, hinter einem Isolator und aus einer eigenen Versorgung, mit seiner Firmware (eine
        UF2-Datei in den Releases) und seiner Bauanleitung. Die Firmware ist nur auf einem
        Computer getestet, nie auf einem Board."
      - "<strong>Benutzerhandbücher</strong> für Spielende, Spielleitung, Marshals und Field-Box-Betreibende, auf Englisch und Portugiesisch."
      - "Bauanleitungen mit einer Pin-Tabelle für jede Platine, eine Firmware-Anleitung (eine veröffentlichte Version herunterladen oder selbst bauen) und eine Anleitung zum Einrichten des Controllers, auf Englisch und Portugiesisch."
      - "Die Web-Ansicht des Simulators hat jede Eingabe, die ein Modus nutzt: Tags, Tastenfeld, Treffer und GM-Befehle, mit Download des Ereignisprotokolls."
      - "Die Szenario-Blöcke der GM-Konsole haben eine Sprachliste mit allen vier Sprachen."
      - "Die Modus-Schlüssel des Projekts: ein offline gehaltener Root-Schlüssel und ein Schlüssel, mit dem die Registry das Verifiziert-Abzeichen signiert. Boxen, App und Controller vertrauen standardmäßig beiden."
      - "Die Firmware-Anleitung und die Bauhandbücher erklären das eine Flashen per USB, das eine Box mit der alten Partitionstabelle braucht, und dass Einstellungen und Schlüssel es überleben."
      - "Die Härtung von CI und Release aus dem Sicherheits-Review: jede Action per Commit festgeschrieben, das Build-Image per Digest, jede pip-Installation aus einer Datei mit Hashes, der Signatur-Job in einer geschützten Umgebung, die einen Tag außerhalb von main ablehnt, und wöchentliche Abhängigkeits-Updates. Seit dem Schlüsselwechsel im November 2026 liegt der Release-Signaturschlüssel nur noch in dieser geschützten Umgebung."
      - "Lua-Zeichenmuster und string.rep werden in der Sandbox gezählt (ein feindliches Muster konnte eine Box bis zum Watchdog hängen lassen), das Überspringen verschachtelter CBOR-Daten ist tiefenbegrenzt, und die CBOR-Decoder haben Tests mit feindlichen Eingaben."
      - "Release-Schlüssel: Der CI-Release-Schlüssel des Projekts wurde over the air gewechselt. v0.7.0 vertraute dem alten und dem neuen Schlüssel; v0.8.0 (4. November 2026) ist mit dem neuen signiert, und der alte ist stillgelegt. Eine Box mit v0.6.1 oder älter installiert erst v0.7.0, dann v0.8.0."
    next:
      - "Die Prüfung des Deutschen und des Chinesischen: Wenn du auf Deutsch oder Chinesisch
        spielst, hilf uns beim Prüfen. Übersetzungen in andere Sprachen beginnen in
        docs/translations (auf Englisch und Portugiesisch)."
      - "Die Hardware: die Labortests des Erweiterungsanschlusses und des Zielmoduls, die
        Träger-Platine (eine fertige Leiterplatte, die den Bau erleichtert) nach den ersten gebauten
        Boxen, Fotos echter Builds, Community-Inhalte von einem Feld."
    gate: Fortlaufend nach dem ersten Release.

build:
  title: Bauanleitungen
  intro: >-
    Die Props von Atalaia werden aus handelsüblichen Teilen rund um ein ESP32-Board gebaut, ohne
    eigens gefertigte Leiterplatte. Hier stehen die Pins und Schaltpläne der Field Box, ihr einfacher Ausgang für eine Sirene oder eine Nebelmaschine sowie die Anleitungen für den Satelliten, den I/O-Pod, den Erweiterungsanschluss,
    das Ziel-Addon und das I2C-Ausgangsmodul, gekürzt; die vollständigen Anleitungen mit allen Prüfungen und den Tabellen zur
    Fehlersuche liegen im Repository (auf Englisch und Portugiesisch).
    Um die Firmware auf eine Platine zu bringen, <a href="https://github.com/vakaobr/atalaia-project/releases">lade eine fertige Version herunter</a> oder baue sie selbst: die <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/firmware.md">Firmware-Anleitung</a> (Englisch) erklärt beides. Der Feld-Controller hat eine eigene <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/controller-setup.md">Einrichtungsanleitung</a> (Englisch). Das Modem hat eine eigene <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md">Modem-Anleitung</a> (Englisch).
  status: >-
    <strong>Nach diesen Anleitungen wurde noch keine Box gebaut, und die Field Box hat noch kein
    Gehäuse.</strong> Es gibt nur einen <a href="#field-box-first-build">Aufbau der Field Box auf dem
    Labortisch</a> (lose Kabel), der Spiele spielt. Die Pins werden automatisch mit der Firmware
    abgeglichen, aber jeder Schritt am echten Teil (Gehäuse, Stromversorgung, Laufzeit,
    Funkreichweite) ist ungetestet, und die Fotos der anderen Boxen kommen mit deren ersten
    Aufbauten. Wenn du eine baust, erzähl uns, was du dabei findest.
  toc: Auf dieser Seite
  parts: Teile
  pins: Pins
  pins_intro: >-
    Die Voreinstellungen der Firmware. Jeder Pin des Boards, der nicht in dieser Tabelle steht,
    bleibt unbeschaltet.
  pin_what: Was
  pin_gpio: GPIO
  steps: Schritte
  open: Noch nicht entschieden
  photo: "Foto folgt nach dem ersten Aufbau:"
  after_bench: "Nach dem Labortisch: was echte Hardware braucht"
  simple_out:
    title: "Der einfache Ausgang: Sirene, Blitzlicht oder Nebel-Fernbedienung"
    what: >-
      Eine Option für die Field Box und den Satelliten, und der bevorzugte Weg, mit dem eine Box etwas
      schaltet: eine Sirene, ein Blitzlicht, eine Lampe oder die Fernbedienung einer Nebelmaschine,
      über einen handelsüblichen <strong>RC-Relaisschalter</strong> (wie er für ferngesteuerte Modelle
      verkauft wird). Ein GPIO schickt ein Servosignal über das freie Gatter des Pegelwandlers:
      2,0&nbsp;ms heißt an, 1,0&nbsp;ms aus, in Halbsekunden-Paketen, die nur das laufende Spiel
      erneuert. Hängt die Box, startet sie neu oder verliert sie den Strom, hören die Impulse
      innerhalb von 0,5&nbsp;s auf und der Schalter öffnet sein Relais. Die Firmware kann das seit
      Version 0.7.0, als Build-Option; in Hardware gebaut ist es noch nicht. Die Firmware des I/O-Pods
      hat es auch, an GPIO&nbsp;33 (und 1): siehe <a href="#io-pod">I/O-Pod</a>.
    needs:
      switch: >-
        <strong>Ein RC-Relaisschalter, der sein Relais öffnet, wenn das Signal ausbleibt</strong>: ein
        dokumentierter mit Failsafe bei Signalverlust, oder ein No-Name-Schalter erst nach seiner
        Prüfung auf dem Labortisch. Einer, der seinen letzten Zustand hält, wird nie benutzt. Die
        Kontakte passend zur Last.
      socket: >-
        Eine <strong>3-polige M8-Buchse</strong> mit der Aufschrift „OUTPUT 1“ (Pin 1 unbeschaltet,
        Pin 3 Masse, Pin 4 das Signal), ein 10-kΩ-Widerstand, der den Pin beim Start des Boards auf
        Low hält, ein 330-Ω-Widerstand zur Buchse und ein 3-adriges Kabel bis 2&nbsp;m. Es ist nicht
        die M12-Buchse des Erweiterungsanschlusses.
      load: >-
        <strong>Der eigene Akku der Last</strong>, mit einer Sicherung zum Relais und einem
        5-V-Regler (einem „BEC“ aus dem Modellbau) für den Schalter: Die Box liefert nur das Signal und
        Masse, nie Strom.
      firmware: >-
        <strong>Eine Firmware mit dem einfachen Ausgang</strong>
        (<code>python tools/docker_fw.py build --simple-out=on</code>). Sein Pin hängt von der
        Board-Revision ab: GPIO&nbsp;46 auf einem V4.3, GPIO&nbsp;5 auf einem V4.2. Ein zweiter
        Ausgang an GPIO&nbsp;45 (<code>--simple-out=on2</code>) nur bei einer Box ohne Piezo-Summer.
      enable: >-
        Die Ausgänge bleiben aus, bis die Feld-Administration sie an der Box mit der Admin-PIN
        freigibt und jedem seine Funktion (Sirene, Blitzlicht, Nebel, Licht, Horn) und seine längste
        Einschaltzeit gibt. Die Box schaltet alle aus beim Start, bei einer Pause und am Spielende (ein
        Horn zum Spielende darf noch bis zu 10&nbsp;s tönen).
    safety: >-
      <strong>Nur Kleinspannungs-Lasten</strong> (höchstens 24&nbsp;V DC, empfohlen 2&nbsp;A), egal was
      auf dem Relais steht. <strong>Nie Netzspannung, nie Pyrotechnik</strong>; eine Nebelmaschine
      nur über einen dokumentierten Kleinspannungs-Fernbedienungseingang. Gehörschutz in der Nähe von
      Sirenen und Hörnern, Nebel nie in einem geschlossenen Raum ohne die Erlaubnis des Geländes, und
      nichts, das wie ein Sprengsatz aussieht.
    full: >-
      Alle Schritte und Prüfungen: Abschnitt 9.10 der
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">Bauanleitung</a> der Field Box, und die Prüfung jedes
      RC-Schalters vor seinem ersten Spiel in der
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md#step-8b-simple-output-rc-relay-switch">Inbetriebnahme-Liste,
      Schritt 8b</a> (auf Englisch).
  pin:
    btn1: Team-Taster 1 (das erste Team des Spiels)
    btn2: Team-Taster 2 (das zweite Team)
    btn3: >-
      Team-Taster 3, optional (die Empfangsleitung von UART0 des Boards)
    btn4: Team-Taster 4 (am Port-Expander des Tastenfelds)
    led: Daten des LED-Rings, über den Pegelwandler 74AHCT125
    sda_gauge: I2C SDA, für die Akkuanzeige (der eigene Bus des Boards)
    sda_bus: >-
      I2C SDA, für den Port-Expander des Tastenfelds, den NFC-Leser und die Akkuanzeige (der eigene
      Bus des Boards)
    scl: I2C SCL
    bclk: BCLK des Verstärkers (optional)
    lrclk: LRC des Verstärkers
    dout: DIN des Verstärkers
    buzzer: >-
      Passiver Piezo-Summer, optional (ein Boot-Strapping-Pin: seine Schaltung hält ihn auf Low; Firmware-Option, noch nicht in Hardware gebaut)
    tamper: Gehäuseschalter, nach GND
    pod_out1: Einfacher Ausgang 1, optional (über ein freies Gatter des 74AHCT125)
    pod_out2: Einfacher Ausgang 2, optional (der Akkuspannungs-Pin des Boards, den der Pod nicht nutzt)
    log: >-
      Log-Ausgang (UART0 TX): nur an den RX eines USB-Seriell-Adapters mit 3,3&nbsp;V, auf der
      Werkbank
    disp_mosi: >-
      MOSI des Displays (SPI)
    disp_clk: >-
      Takt des Displays (SCK)
    disp_cs: >-
      Chip-Select des Displays (CS; der Akkuspannungs-Pin des Boards, als Ausgang benutzt)
    disp_dc: >-
      Daten/Befehl des Displays (DC)
    disp_rst: >-
      RESET und Hintergrundbeleuchtung des Displays: beide an den 3V3-Pin, kein GPIO
    keypad: >-
      Tastenfeld, über den Port-Expander PCF8574 (Adresse 0x20)
  safety:
    title: Zuerst die Sicherheit
    intro: Diese Regeln gelten für jeden Aufbau auf dieser Seite, wie für die Field Box.
    antenna: >-
      <strong>Schalte ein Board nie ohne seine LoRa-Antenne ein</strong>, auch nicht über USB: Senden
      in einen offenen Antennenausgang kann den Verstärker des Funks zerstören. Schließ zuerst beide
      Antennen an und lass sie dran.
    cell: >-
      <strong>Nur eine Li-Ionen-Zelle in Reihe</strong> (1S, 3,0–4,2&nbsp;V): geschützte Zellen, eine
      Sicherung nahe an der Zelle und eine Diode gegen eine verkehrt eingesetzte Zelle. Akkubuchse und
      Ladeschaltung des Boards vertragen eine Zelle; ein 2S-Akku zerstört sie. Prüf vor jedem
      Anschließen die Polung mit einem Multimeter: kleine Akkustecker haben keine einheitliche
      Polung.
    charge: >-
      <strong>Lade nur unter Aufsicht</strong>, nie in einem geschlossenen Koffer, nur zwischen etwa 0
      und 45&nbsp;°C, und bewahr die Zellen beim Arbeiten in einem feuerfesten Beutel auf, außerhalb
      der Box. Benutz nie eine Zelle, die verbeult, aufgebläht, heiß oder unter 2,5&nbsp;V ist.
    volts: >-
      <strong>Nur 3,3-V-Signale</strong> ans Board: Der LED-Ring wird über einen Pegelwandler
      angesteuert, und jedes I2C-Modul muss seine Leitungen auf 3,3&nbsp;V ziehen, nie auf 5&nbsp;V.
    pins: >-
      <strong>Schließ nie etwas an GPIO 5 oder 46 an</strong> (das Funk-Frontend; die einzige
      Ausnahme ist der <a href="#field-box-simple-output">einfache Ausgang</a>, an dem Pin, den deine
      Board-Revision frei lässt: 46 auf einem V4.3, 5 auf einem V4.2) <strong>und nichts an GPIO 34
      oder 38–42</strong> (der GPS-Anschluss des Boards).
    power_check: >-
      <strong>Kein Spiel vor der Messung der Sendeleistung</strong> aus der Inbetriebnahme-Liste: Die
      Firmware hält den Funk mit einer Verstärkung, die noch nicht gemessen wurde, im gesetzlichen
      Rahmen.
    enclosure: >-
      <strong>Kunststoff, nie Metall</strong> (der Funk muss hinaus), wetterfest, in einer kräftigen
      Farbe mit einem „GAME PROP“-Aufkleber, und nichts, das wie ein Sprengsatz aussieht.
    hits: >-
      <strong>BBs und Paintballs werden sie treffen.</strong> Halte Zellen und Boards von den Wänden
      fern und aus der Schusslinie, schütz einen Handybildschirm mit klarem Polycarbonat (nie Glas),
      und stell eine Box nie so auf, dass jemand auf sie schießen muss, außer sie ist ein Ziel.
  field_box:
    title: Field Box
    text: >-
      Das Haupt-Prop, mit Team-Tastern, Tastenfeld, Farbdisplay, LED-Ring, NFC-Leser und
      Lautsprecher. Ihre
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">Bauanleitung</a>
      (auf Englisch und Portugiesisch) hat die Teile, die Schaltpläne, Stromversorgung und Akkusicherheit, das erste
      Flashen und die Fehlersuche; die Anleitungen unten verweisen bei jedem gemeinsamen Schritt
      darauf.
    pins_shared: >-
      GPIO 1, 35 und 44 sind Pins des Boards, die die Field Box absichtlich mitbenutzt, jeder nur für diesen einen Zweck: 1 ist der Akkuspannungs-Eingang des Boards (die Akkuanzeige liest den Akku per I2C), 35 seine weiße LED (sie flackert leicht mit dem Ring) und 44 die Empfangsleitung von UART0 (die USB-Konsole bleibt unberührt).
    bench:
      title: Der erste Aufbau auf dem Labortisch
      intro: >-
        Die Field Box gibt es jetzt außerhalb des Papiers, aber nur als Aufbau auf dem Labortisch: das
        erste Board, das ein ganzes Spiel spielt, mit Display, Tastern und Tastenfeld an losen Kabeln
        und noch ohne Gehäuse. Es ist kein fertiges Produkt und keine nach den Anleitungen gebaute Box.
      photo_alt: >-
        Foto des Labortisch-Aufbaus: ein Heltec-V4-Board mit seinem kleinen OLED-Display, über viele
        bunte Kabel verbunden mit einem 2,8-Zoll-TFT-Display, das «READY» und «Next game» zeigt, einem
        Folientastenfeld mit 12 Tasten (4 mal 3) und vier Drucktastern mit grünen, blauen und
        schwarzen Kappen. Alles liegt lose auf einem Schreibtisch, dahinter eine Computertastatur.
      photo_caption: >-
        Die erste Field Box auf dem Labortisch, 31. Oktober 2026: ein Heltec-V4-Board, das
        2,8-Zoll-TFT (ILI9341), das OLED des Boards, ein 4×3-Tastenfeld und Team-Taster an losen
        Kabeln, ohne Gehäuse. Es ist das erste Board, das ein Spiel spielt, und ein Aufbau auf dem
        Labortisch, keine fertige Box.
      video_alt: >-
        Stummes Video in Endlosschleife desselben Aufbaus beim Spielen von Domination, mit dem neuen
        TFT-Display. Das Display zeigt eine Zone des roten Teams mit 3 Punkten; unten füllt sich ein blauer Balken,
        die Zone geht an das blaue Team, und Display und OLED wechseln von Rot zu Blau. Dann zeigt das Display
        „ocupada há 0:01“ (gehalten seit 0:01), hochzählend, und oben rechts die Punkte jedes Teams.
      video_caption: >-
        Derselbe Aufbau beim Spielen von Domination mit dem Controller vom Labortisch (1. November 2026): Der
        Haltebalken füllt sich, die Zone wechselt vom roten zum blauen Team, die Haltezeit zählt hoch, und die
        Punkte jedes Teams erscheinen in der Ecke. Elf Sekunden in Schleife, ohne Ton; das Display ist auf
        Portugiesisch.
      photo2_alt: >-
        Foto desselben Labortisch-Aufbaus mit dem neuen TFT-Display: Das Display zeigt „PRONTA“ (bereit), den gelben
        Turm des Atalaia-Logos und „Próximo jogo“ (nächstes Spiel), darunter „Uma tecla: escolher jogo aqui“ (eine
        Taste: hier ein Spiel wählen). Links das Heltec-V4-Board mit seinem OLED, das „Próximo jogo“ wiederholt;
        rechts ein grüner Drucktaster. Überall lose Kabel, auf einem Schreibtisch.
      photo2_caption: >-
        Derselbe Aufbau am 1. November 2026 mit dem neuen TFT-Display: der Bildschirm „PRONTA / Próximo jogo“ (bereit /
        nächstes Spiel) mit dem gelben Atalaia-Turm, wartend auf ein Spiel. Weiterhin ein Aufbau auf dem Labortisch,
        ohne Gehäuse.
    wiring:
      title: >-
        Schaltpläne
      intro: >-
        Zwei Zeichnungen, erzeugt aus den WireViz-Dateien des Repositorys: die Signale samt 3,3-V-Logikversorgung sowie Akku, Schalter und 5-V-Schiene. Die Pins des Boards sind nur mit der GPIO-Nummer benannt: Such jeden Pin an der Nummer, die neben seinem Anschluss aufgedruckt ist. Die Bezeichnungen (Pins, Leitungen, Teile) bleiben in allen Sprachen englisch, wie im Repository; widersprechen sich Text und Zeichnung, gilt die Zeichnung.
      open: >-
        Schaltplan in voller Größe öffnen (SVG)
      hint: >-
        Der Schaltplan ist sehr breit: Tipp oder klick darauf, um ihn in voller Größe zu öffnen, wo du zoomen und verschieben kannst. Er liegt auch im dunklen Design auf einem weißen Blatt, damit die Leitungsfarben stimmen.
      signals:
        alt: >-
          Schaltplan 1 von 2, Signale und 3,3-V-Versorgung: Die GPIO-Pins des Hauptboards führen über die Verbindungsplatine zum Display, zu den Team-Tastern, zum Tastenfeld mit seinem PCF8574-Expander, zum NFC-Leser, zur Akkuanzeige, zu Verstärker und Lautsprecher, zum LED-Ring und zu den Antennen.
        caption: >-
          Schaltplan 1 von 2: Signale und 3,3-V-Logikversorgung.
      power:
        alt: >-
          Schaltplan 2 von 2, Akku und 5-V-Versorgung: Zelle, Sicherung, Hauptschalter, Verpolschutzdiode und Verteiler speisen die Akkubuchse des Hauptboards und über den Aufwärtswandler die 5-V-Schiene für LED-Ring, Verstärker und Verbindungsplatine.
        caption: >-
          Schaltplan 2 von 2: Akku, Hauptschalter und 5-V-Schiene.
  satellite:
    title: Satellit
    what: >-
      Eine kleine Box für einen Nebenpunkt oder ein Leuchtfeuer: das Board der Field Box mit zwei
      großen Team-Tastern (ein dritter geht auch), einem LED-Ring, der das haltende Team zeigt, dem
      kleinen Display des Boards selbst und einer 18650-Zelle. Etwa
      <span class="nowrap">30–40&nbsp;€</span> an Teilen (die Schätzung des Projekts). Er läuft mit
      der <strong>Firmware der Field Box selbst</strong>, nur mit weniger Teilen: Die Firmware meldet
      beim Start jedes fehlende Teil einmal und läuft weiter.
    plays: >-
      Ohne Tastenfeld kann er kein Spiel selbst wählen: Er spielt die Spiele, zu denen ihn ein
      <a href="{{ page.to.glossary }}#glossar-feld-controller">Feld-Controller</a> einlädt, als
      Satellit oder Master bei <a href="{{ page.to.modes }}#master-satellites">Master und
      Satelliten</a> oder als Zone in jedem Modus, der nur Team-Taster braucht (Domination, Hold-All
      Domination, Last Stand). In ein Feld aufgenommen wird er per USB-Kabel oder mit dem
      Kopplungscode auf seinem kleinen Display (für eine Feldkarte hat er keinen NFC-Leser).
    parts:
      board: >-
        Board Heltec WiFi LoRa 32 V4, Revision V4.2 oder V4.3, 863–928&nbsp;MHz, ohne Gehäuse.
      antennas: >-
        Eine 868-MHz-Antenne mit höchstens 2&nbsp;dBi (die aus dem Kit des Boards) und eine
        2,4-GHz-Antenne, die Pflicht ist: Ersteinrichtung, Modus-Downloads und Firmware-Updates
        laufen über WLAN.
      buttons: >-
        Zwei (oder drei) 60-mm-Arcade-Taster mit 5-V-LED.
      ring: >-
        Ein LED-Ring WS2812B (24 LEDs als Voreinstellung; 12 oder 16 mit einer Firmware-Einstellung),
        mit dem Pegelwandler 74AHCT125, einem 330-Ω-Widerstand und einem 1000-µF-Kondensator, auf
        einer kleinen Lochrasterplatine.
      gauge: >-
        Eine Akkuanzeige MAX17048, empfohlen: Ohne sie kennt die Box ihren Akkustand nie.
      power: >-
        Eine geschützte 18650-Zelle in einem Halter (oder ein 1S-Akku mit Schutzplatine), eine
        5-A-Sicherung, eine Schottky-Diode, ein abgedeckter Hauptschalter, ein 5-V-Aufwärtswandler für
        den Ring und Hebelklemmen: die Stromversorgung der Field Box mit einer Zelle.
      sound: >-
        Ton nach Wunsch: ein passiver Piezo-Summer (am günstigsten: er spielt die Töne der Spiele als
        kurze Tonfolgen, mit einer Firmware-Option; noch nicht in Hardware gebaut), der Verstärker
        MAX98357A der Field Box und ein kleiner Lautsprecher, oder beides.
      simple_out: >-
        Ein <a href="#field-box-simple-output">einfacher Ausgang</a> ist optional: eine Sirene, ein
        Blitzlicht, eine Lampe oder die Fernbedienung einer Nebelmaschine, geschaltet über einen
        RC-Relaisschalter, wie an der Field Box. Ein Master oder Satellit, der eine Sirene ertönen
        lässt, braucht keine weitere Box. Noch nicht in Hardware gebaut.
      box: >-
        Ein IP65-Kunststoffgehäuse in einer kräftigen Farbe, mit Druckausgleich und
        Kabelverschraubungen, und „GAME PROP“-Aufkleber.
    free_pins: >-
      Die Firmware steuert die Display-Pins der Field Box (GPIO 1, 3, 33 und 47) weiter an: Lass sie
      unbeschaltet.
    diagram_ref: >-
      Seine Verdrahtung ist eine Teilmenge der Verdrahtung der Field Box: Folge den <a href="#field-box-wiring">Schaltplänen der Field Box</a> und lass die Teile weg, die dieser Aufbau nicht hat (das Farbdisplay, das Tastenfeld und den NFC-Leser). Ein eigener Schaltplan existiert noch nicht.
    steps:
      revision: >-
        Lies den Chip neben dem LoRa-Antennenanschluss des Boards: KCT8103L ist eine V4.3 (die
        Voreinstellung der Firmware), GC1109 eine V4.2. Schließ beide Antennen an und beschrifte sie,
        bevor das Board zum ersten Mal Strom bekommt.
      enclosure: >-
        Plan das Gehäuse auf Papier und bohr alle Löcher, bevor Elektronik hineinkommt: Taster und
        Ring in den Deckel, den Schalter versenkt oder abgedeckt, den Druckausgleich unten.
      power: >-
        Bau die Stromversorgung ohne das Board: Zelle, Sicherung, Diode, Schalter, Klemmen; stell den
        Aufwärtswandler allein auf 5,0–5,2&nbsp;V ein, bevor irgendetwas daran hängt.
      hub: >-
        Bau die kleine Verteilerplatine: die Schienen 3V3, GND und 5V (und SDA und SCL für die
        Akkuanzeige) und den Pegelwandler, wie in der Anleitung der Field Box.
      wiring: >-
        Schließ die Taster (beim Drücken nach GND), den Ring über den Pegelwandler, die Akkuanzeige
        und den optionalen Verstärker an, nach den Pins oben.
      simple_out: >-
        Wenn du den einfachen Ausgang einbaust: das freie Gatter des Pegelwandlers von GPIO&nbsp;46
        (V4.3) oder 5 (V4.2), mit 10&nbsp;kΩ nach GND, über 330&nbsp;Ω an Pin 4 der M8-Buchse; den
        Schalter aus dem Akku der Last versorgt, nie aus der Box. Der GPIO misst 10&nbsp;kΩ nach GND,
        und nichts verbindet Pin 4 der Buchse mit 3V3 oder 5&nbsp;V.
      check: >-
        Prüf mit dem Multimeter, ohne Zelle: kein Kurzschluss zwischen den Schienen, jeder Taster nur
        beim Drücken, die Polung des Akkukabels zum Board.
      flash: >-
        Bau und flash die Firmware der Field Box, wie ihre Anleitung es beschreibt, für deine
        Board-Revision und die LED-Zahl deines Rings.
      bring_up: >-
        Mach die Schritte der Inbetriebnahme, die für einen Satelliten gelten: Start, Taster, LEDs,
        Akku, und den Funk mit seiner Sendeleistung vor jedem Spiel.
      field: >-
        Gib ihm auf seiner WLAN-Einrichtungsseite vom Handy aus einen Namen, die Region und eine
        Admin-PIN, nimm ihn per USB-Kabel oder Kopplungscode in dein Feld auf und lade ihn in der
        GM-Konsole zu einem Spiel ein.
    photo: der fertige Satellit, innen und außen.
    open:
      buzzer: >-
        <strong>Der Piezo-Summer</strong> aus dem ursprünglichen Entwurf: Die Firmware steuert ihn an
        (eine Build-Option, an GPIO&nbsp;45), aber noch keiner wurde auf einer echten Platine gebaut
        und gehört.
      enclosure: >-
        <strong>Das Gehäuse</strong>: Es ist noch keins ausgewählt.
      runtime: >-
        <strong>Die Laufzeit</strong> mit einer Zelle: nicht gemessen.
      diagram: >-
        <strong>Ein eigener Schaltplan</strong>: Vorerst zeigen die Schaltpläne der Field Box jedes
        Kabel, das ein Satellit hat.
    full: >-
      Die vollständige Anleitung (auf Englisch und Portugiesisch):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/satellite/BUILD.md">Bauanleitung
      des Satelliten</a>.
  pod:
    title: I/O-Pod
    what: >-
      Die Box, die einem <a href="{{ page.to.glossary }}#glossar-android-prop">Android-Prop</a> leiht,
      was einem Handy fehlt: große Team-Taster, ein Tastenfeld, einen LED-Ring, Ton, einen
      NFC-Leser, einen Schalter, der meldet, wenn die Box geöffnet wird, und einen LoRa-Funk. Das
      Handy führt den Spielmodus aus; der Pod ist seine Hände und sein Funk, per USB-Kabel oder
      Bluetooth. Er ist die Hardware der Field Box ohne Farbdisplay, mit der Pod-Firmware, die auf
      einem Computer getestet ist, aber noch nicht auf einem Board. Etwa
      <span class="nowrap">35&nbsp;€</span> an Teilen (die Schätzung des Projekts).
    lends: >-
      Außer dem Board ist jedes Teil optional: Der Pod sagt dem Handy, was er hat, und das Handy
      nutzt nur das. Taster 1 ist das erste Team des Spiels, wie bei einer Field Box. Ein geöffnetes
      Gehäuse erreicht die GM-Konsole als Manipulationsalarm.
    outputs: >-
      <strong>Einfache Ausgänge</strong>, optional: eine Sirene, ein Blitzlicht, eine Lampe oder die
      Fernbedienung einer Nebelmaschine über einen RC-Relaisschalter, verdrahtet wie der
      <a href="#field-box-simple-output">einfache Ausgang</a> der Field Box, aber an GPIO&nbsp;33 (ein
      zweiter an GPIO&nbsp;1, mit oder ohne Piezo-Summer). Ein Pod hat keine Admin-PIN, also schaltet
      erst das Einbauen in die Firmware den Ausgang frei, mit seinem Zweck (Sirene, Blitzlicht, Nebel,
      Lampe, Hupe) und seiner längsten Einschaltzeit. Das Spiel auf dem Handy schaltet ihn mit den
      Regeln einer Box, und der Pod schaltet ihn selbst ab: sofort, wenn die Verbindung zum Handy
      abreißt, und nach 1,5&nbsp;s, wenn das Handy nichts mehr sagt.
    port: >-
      <strong>Der Erweiterungsanschluss</strong>, optional: die M12-Buchse und die
      <a href="#expansion-port">Anschlussplatine</a> der Field Box am I2C-Bus des Pods (GPIO&nbsp;17 und
      18). Die Treffer eines <a href="#target-addon">Ziel-Addons</a> erreichen das Spiel auf dem Handy,
      solange es läuft. Die Relais eines I2C-Ausgangsmoduls leiht nur ein Pod dem Spiel, der dafür gebaut
      ist (standardmäßig aus), und der Pod schaltet sie ab, wenn das Handy weg ist. Ein Pod mit allen
      Teilen hat wenig Platz, um sich dem Handy zu beschreiben: Er leiht so viele Ausgänge, wie passen,
      die ersten, und hält die anderen aus. Die Ausgänge und der Anschluss sind in der Pod-Firmware und
      nur auf einem Computer getestet: Noch kein Pod hat ein echtes Relais geschaltet oder eine echte
      Platte gespürt.
    parts:
      same: >-
        Die Teile der Field Box ohne Display: das Board, die Taster (bis zu vier), das Tastenfeld mit
        seinem Port-Expander PCF8574, der LED-Ring mit Pegelwandler, der NFC-Leser PN532, Verstärker
        und Lautsprecher, die Akkuanzeige und dieselbe Stromversorgung mit einer Zelle.
      antennas: >-
        Beide Antennen: LoRa, und 2,4&nbsp;GHz für Bluetooth.
      switch: >-
        Ein Mikroschalter, den der geschlossene Deckel gedrückt hält: der Gehäuseschalter.
      usb: >-
        Eine USB-C-Einbaubuchse mit Datenleitungen (nicht nur zum Laden) für das Kabel des Handys,
        und ein USB-C-OTG-Kabel für das Handy.
      uart: >-
        Nur auf der Werkbank: ein USB-Seriell-Adapter mit 3,3&nbsp;V, um das Log des Pods zu lesen.
      simple_out: >-
        Optional, für jeden einfachen Ausgang: ein RC-Relaisschalter, der öffnet, wenn sein Signal
        aufhört, ein freies Gatter des 74AHCT125, 10&nbsp;kΩ und 330&nbsp;Ω und eine M8-Buchse, wie bei der
        Field Box.
      port: >-
        Optional: die M12-Buchse und die Anschlussplatine des Erweiterungsanschlusses, wie bei der
        Field Box.
    free_pins: >-
      GPIO&nbsp;33 und 1, am Pod frei, tragen die optionalen einfachen Ausgänge; GPIO&nbsp;3 und ein
      Ausgangspin, den du nicht nutzt, bleiben unbeschaltet. Der Erweiterungsanschluss belegt keinen
      eigenen GPIO.
    diagram_ref: >-
      Die Verdrahtung des Pods ist die der Field Box ohne Display: Folge den <a href="#field-box-wiring">Schaltplänen der Field Box</a> und lass das Display samt seinen Leitungen weg. Ein eigener Schaltplan existiert noch nicht.
    steps:
      like_box: >-
        Bau ihn wie eine Field Box ohne Display: Board-Revision, Antennen, Gehäuse, Stromversorgung,
        Verteilerplatine, dann Tastenfeld, Ring, NFC-Leser, Taster und Verstärker, die du einbaust,
        jeweils mit den Prüfungen der Anleitung.
      switch: >-
        Befestige den Mikroschalter so, dass der geschlossene Deckel ihn drückt, und schließ ihn
        zwischen GPIO 47 und GND an. Der Pod überwacht ihn erst, nachdem er ihn einmal geschlossen
        gelesen hat; ein Pod ohne Schalter schlägt also nie Alarm.
      flash: >-
        Bau die Pod-Firmware (<code>python tools/docker_fw.py pod</code>; dazu
        <code>--simple-out=on</code> für einen Ausgang, <code>on2</code> für zwei und
        <code>--module-outputs=on</code>, um die Relais eines Ausgangsmoduls zu leihen) und flash sie aus dem
        Ordner <code>build-pod</code>, wie die der Field Box. Das Boot-Log nennt jeden Ausgang, den er
        leiht.
      log: >-
        Lies sein Log an GPIO 43 mit dem USB-Seriell-Adapter: Die USB-C-Buchse trägt die Verbindung
        des Pods zum Handy, nicht das Log.
      link: >-
        Verbinde ihn in der App über ein USB-C-OTG-Kabel, dann über Bluetooth (Android fragt einmal
        nach dem Koppeln).
      bring_up: >-
        Mach die Inbetriebnahme-Prüfungen des Pods, auch die Sendeleistung des Funks vor jedem Spiel.
    photo: der fertige Pod mit seinem Gehäuseschalter und dem verbundenen Handy.
    open:
      bench: >-
        <strong>Ausgänge und Module an einem echten Pod</strong>: Die einfachen Ausgänge und der
        Erweiterungsanschluss sind in der Pod-Firmware und auf einem Computer getestet, noch nicht mit einem
        echten Relais, einer echten Platte oder einem echten Handy; als Nächstes kommt der Labortest.
      phone_power: >-
        <strong>Strom vom Handy</strong>: Am Kabel versorgt das Handy den Pod und lädt womöglich
        seine Zelle. Ob es das soll und wie viel Strom ein Handy liefert, wird beim ersten Aufbau
        geprüft.
      enclosure: >-
        <strong>Das Gehäuse</strong>, und wie Handy und Pod zusammen getragen werden.
      settings: >-
        <strong>Einstellungen</strong>: Die GM-Konsole kann per Funk die Farben der Taster, die Helligkeit
        des Rings, die Lautstärke und ob der Gehäuseschalter meldet schicken; die LED-Zahl, die Pins und
        die Ausgänge werden beim Bauen der Firmware festgelegt.
    full: >-
      Die vollständige Anleitung (auf Englisch und Portugiesisch):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/io-pod/BUILD.md">Bauanleitung
      des I/O-Pods</a>, und die Prüfungen des Pods mit einem Handy in der
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md">Inbetriebnahme-Liste</a>.
  modem:
    title: Funkmodem
    what: >-
      Das Funkgerät des Controllers: ein zweites Heltec WiFi LoRa 32&nbsp;V4, mit dem Modem-Image geflasht
      und in den USB-Anschluss des Feld-Controllers gesteckt. Ohne es läuft der Controller und die Konsole
      öffnet sich, aber nichts erreicht die Boxen und von ihnen wird nichts gehört. Es hat kein WLAN und
      braucht deshalb nur die LoRa-Antenne.
    tested: >-
      Ein so geflashtes Modem lief auf einem Prüfstand mit dem Controller und echten Boxen (ein Computer,
      der Controller in Docker). Auf einem Raspberry Pi ist es noch nicht gelaufen, auch nicht unter macOS
      und nicht auf einem Spielfeld.
    steps:
      antenna: >-
        Bringe die <strong>LoRa-Antenne an, bevor die Platine irgendeinen Strom hat</strong>, auch zum
        Flashen, und nimm ein USB-C-<em>Datenkabel</em>. Lege die Funkregion fest: Modem und Boxen müssen
        sie teilen.
      image: >-
        Lade <code>atalaia-modem-&lt;Version&gt;-usb.zip</code> und <code>SHA256SUMS</code> von den
        <a href="https://github.com/vakaobr/atalaia-project/releases">Releases</a> herunter (V4.3, EU868)
        oder baue es selbst: <code>python tools/docker_fw.py modem</code> (V4.2, Taiwan, andere Antennen).
      flash: >-
        Lösche mit esptool 4.8.1 eine neue Platine und schreibe die Dateien aus <code>flash_args</code>:
        <code>esptool --chip esp32s3 -p PORT write_flash "@flash_args"</code>, mit dem Port
        <code>COM5</code> unter Windows, <code>/dev/ttyACM0</code> unter Linux, <code>/dev/cu.usbmodem…</code>
        unter macOS. Unter Linux trittst du zuerst der Gruppe <code>dialout</code> bei.
      screen: >-
        Der Bildschirm der Platine zeigt den Turm und <strong>MODEM MODE</strong>, dann <code>LINK wartet</code>
        (zuerst auf Englisch: <code>LINK waiting</code>). Das ist ein gesundes Modem, das noch keinen
        Controller hat. <strong>RADIO FAULT</strong> heißt, dass der Funkchip nicht gestartet ist.
      port: >-
        Stecke es in den Controller, finde den Port (<code>ls /dev/ttyACM*</code>), trage ihn in
        <code>[modem] port</code> von <code>/etc/atalaia/controller.toml</code> ein und starte den Dienst
        neu (<code>sudo systemctl restart atalaia-controller</code>).
      check: >-
        Der Bildschirm zeigt <strong>LINK OK</strong>, die Kopfzeile der Konsole zeigt
        <strong>Funk: aktiv</strong>, und das Protokoll des Controllers enthält <code>modem link up</code>.
      join: >-
        Schalte eine aufgenommene Box ein, lege ein Spiel an und lade die Box ein: sie geht über
        <em>sende</em>, <em>eingeladen</em> zu <em>beigetreten</em>, und der Bildschirm des Modems zählt Pakete.
    full: >-
      Alle Befehle für jedes System, wie man den Port findet, und eine Tabelle zur Fehlersuche (Ladekabel
      ohne Daten, falscher Port, Port von einem anderen Programm belegt, <code>dialout</code>, andere Region,
      <code>LINK waiting</code> oder <code>DOWN</code>, <code>RADIO FAULT</code>, falsche Partitionstabelle):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md">Set up the radio modem</a> (Englisch).
  port:
    title: Erweiterungsanschluss
    status: >-
      <strong>Entworfen, noch nicht gebaut; die Firmware der Box benutzt ihn.</strong> Ein Anschluss
      lässt sich jetzt bauen und mit dem Multimeter und den Teilen der Box prüfen. Seit Inkrement 8 des
      Plans für den Erweiterungsanschluss läuft der Anschlusstreiber der Box in ihrem Spiel: Er findet
      ein Modul innerhalb von 2&nbsp;s nach dem Einstecken, liest es und führt es in der Liste. Das ist
      nur auf einem Computer getestet, gegen ein simuliertes Modul, noch nicht an einem echten
      Anschluss.
    what: >-
      Eine wasserdichte 5-polige M12-Buchse an der Box, in die Module von außen gesteckt werden: jetzt
      das <a href="#target-addon">Ziel-Addon</a>, später Kontakte und andere Sensoren. Es ist der
      I2C-Bus der Box selbst (der des Tastenfelds, des NFC-Lesers, der Akkuanzeige und des kleinen
      Displays), aus dem Gehäuse geführt, hinter einer kleinen <strong>Anschlussplatine</strong>, die
      verhindert, dass ein nasses, kurzgeschlossenes oder statisch geladenes Kabel die Box lahmlegt.
      Er braucht keinen GPIO, also ändert sich keine Pin-Tabelle. Er ist optional an der Field Box,
      am Satelliten und am I/O-Pod: Nur eine Box, die ein Ziel oder einen Sensor trägt, braucht ihn.
      Etwa <span class="nowrap">6–14&nbsp;€</span> an Teilen (die Schätzung des Projekts).
    not_outputs: >-
      Nicht für Sirenen, Blitzlichter oder Nebel: Die kommen an den
      <a href="#field-box-simple-output">einfachen Ausgang</a>. Der Anschluss ist für Eingänge, und
      für das <a href="#output-module">I2C-Ausgangsmodul</a> an einer Box, die mehr Kanäle braucht.
    parts:
      socket: >-
        Eine <strong>weibliche</strong> M12-Einbaubuchse, A-codiert, 5-polig (IP67; ihre Kontakte
        liegen versenkt, weil Pin 1 Spannung führt), mit Schutzkappe, und ein fertiges
        M12-Sensor-Verlängerungskabel, A-codiert, 5-polig, Stecker auf Buchse, bis 2&nbsp;m zum Modul.
      buffer: >-
        Ein <strong>Hot-Swap-Puffer TCA4307</strong> auf einem Breakout: Er verbindet den Anschluss
        nur dann mit dem Bus der Box, wenn beide ruhen, und trennt ihn, wenn ein kurzgeschlossenes
        oder nasses Kabel eine Leitung auf Low hält, damit Tastenfeld, NFC-Leser, Akkuanzeige und
        Display weiterlaufen.
      tvs: >-
        Ein <strong>TVS-Array mit geringer Kapazität</strong> (Klasse USBLC6-2SC6, auf einem Adapter)
        und zwei 100-Ω-Widerstände, gegen statische Entladung von einer Hand oder einem Kabel an der
        Buchse.
      fuse: >-
        Eine <strong>rückstellbare Sicherung mit 50&nbsp;mA</strong> gegen einen Kurzschluss zwischen
        Pin 1 und 3, und eine kleine <strong>Schottky-Diode</strong> (Klasse BAT85), damit nichts am
        Kabel die 3,3&nbsp;V der Box rückwärts speist: Das Modul bekommt etwa 3,0&nbsp;V.
      pullups: >-
        Zwei Pull-up-Widerstände mit 2,2&nbsp;kΩ auf der Seite des Anschlusses (Module haben keine),
        eine kleine Lochrasterplatine und Kabel zu den Schienen 3V3, GND, SDA und SCL der
        Verteilerplatine.
    pins_title: Die Pins des Anschlusses
    pins_intro: >-
      Die M12-Belegung, mit den üblichen Aderfarben des Kabels (prüf sie mit dem Multimeter). SDA und
      SCL sind der I2C-Bus der Box, hinter dem Puffer.
    pin_m12: M12-Pin
    pin:
      p1: >-
        Braun: 3,3&nbsp;V (etwa 3,0&nbsp;V nach der Diode), höchstens 25&nbsp;mA, nur für die Logik
        eines Moduls
      p2: "Weiß: SDA, 100&nbsp;kHz"
      p3: "Blau: Masse"
      p4: "Schwarz: SCL"
      p5: >-
        Grau: an beiden Enden <strong>unbeschaltet</strong>, nie eine Versorgung oder ein Signal
    addresses: >-
      Module antworten auf den Adressen 0x58–0x5F, weit weg von jedem Teil der Box: Eingangsmodule ab
      0x58 (das Ziel), Ausgangsmodule ab 0x5C. Eine Box nimmt höchstens vier, aber der Anschluss hat
      eine Buchse und noch ist kein Verteiler entworfen, also baut die Anleitung ein Modul pro Box.
    steps:
      socket: >-
        Bohr das Loch der Buchse an der Seite oder am Boden des Gehäuses, weg von den Antennen und der
        Buchse des einfachen Ausgangs, wo ein Kabel vom Boden ohne scharfen Knick hereinkommt, und
        nicht zu den Schießenden hin. Beschrifte sie mit „EXPANSION 3,3&nbsp;V“.
      board: >-
        Leg die Anschlussplatine auf einer Lochrasterplatine von etwa 3&nbsp;×&nbsp;4&nbsp;cm aus: die
        Seite der Box an einem Rand, die der Buchse am anderen, der Puffer dazwischen und das TVS
        neben der Stiftleiste der Buchse.
      breakout: >-
        Miss zuerst die eigenen Pull-up-Widerstände des Breakouts: Mit ihnen muss der Bus der Box
        immer noch zwischen 1 und 3,9&nbsp;kΩ nach 3V3 messen, und die Seite des Anschlusses insgesamt
        etwa 2,2&nbsp;kΩ.
      wiring: >-
        Verdrahte die Versorgung (3V3 der Verteilerplatine, die Diode, die Sicherung, die 3,3&nbsp;V
        des Anschlusses), die Signale über den Puffer, die 100-Ω-Widerstände und das TVS, kurze
        Masseleitungen, und die Litzen der Buchse in den Farben des Kabels, die von Pin 5 kurz
        abgeschnitten und isoliert.
      check: >-
        Prüf mit dem Multimeter, ohne Akku und ohne USB: kein Kurzschluss zwischen Pin 1 und 3, Pin 5
        offen, die Diode richtig herum, etwa 100&nbsp;Ω und 2,2&nbsp;kΩ, wo die Anleitung es sagt.
      power: >-
        Erstes Einschalten, nichts eingesteckt: etwa 3,0&nbsp;V an Pin 1, und Tastenfeld, NFC-Leser
        und Akkuanzeige funktionieren weiter, auch mit dem 2-m-Kabel eingesteckt.
      bench: >-
        Die Tests, die du jetzt auf dem Labortisch machen kannst: die Anstiegszeit am fernen Ende des
        Kabels (unter 1&nbsp;µs, mit einem Oszilloskop), ein kurzgeschlossenes SDA, während das
        Tastenfeld weiterläuft, ein Kurzschluss zwischen Pin 1 und 3 ohne Neustart, und statische
        Entladung an der Buchse. Bitte melde deine Messwerte in einem Issue.
    rules_title: Regeln für den Anschluss
    rules:
      volts: >-
        <strong>Nur 3,3&nbsp;V, an jedem Pin, immer</strong>: Weder 5&nbsp;V noch Akkuspannung
        erreichen je den Anschluss, und Pin 5 bleibt unbeschaltet.
      loads: >-
        <strong>Versorg nie eine Last über den Anschluss</strong>: Seine 25&nbsp;mA sind für Prozessor
        und Sensor eines Moduls. Schon eine einzige WS2812-LED zieht bis zu 60&nbsp;mA.
      relays: >-
        <strong>Steck nie eine nackte PCF8574- oder MCP23017-Relaisplatine an</strong>, oder irgendeine
        I2C-Platine ohne eigenen Prozessor: Ihre Relais blieben an, wenn die Box abstürzt, und sie
        antwortet dort, wo die Box ihr Tastenfeld sucht.
      cap: >-
        <strong>Schließ die Buchse mit der Kappe</strong>, wenn nichts eingesteckt ist, und leg das
        Kabel auf den Boden, nie in die Schusslinie. Nichts auf beiden Seiten des Anschlusses berührt
        je Netzspannung.
    photo: die fertige Anschlussplatine, beide Seiten, und die Buchse an einer Box.
    box_title: Was die Box über den Anschluss sagt
    box: >-
      In ihrem seriellen Log (USB, 115200 Baud) schreibt die Box eine Zeile, wenn sie ein Modul findet
      (<code>expansion: 0x58 added: 58:target/1.0.0:hit</code>), wenn eines nicht mehr antwortet
      (<code>expansion: 0x58 lost (no_answer)</code>) und für jeden Treffer während eines Spiels.
      <code>@modules</code> in ihrer seriellen Konsole listet die Module auf, und im Spiel zeigt die
      GM-Konsole jedes als Chip unter seiner Box. Die Inbetriebnahme-Liste der Firmware hat den Schritt
      des Anschlusses.
    after:
      tests: >-
        <strong>Die Labortests des Anschlusses mit einem Modul</strong>: 100-mal Ein- und Ausstecken
        während eines laufenden Spiels, jedes Einstecken innerhalb von 2&nbsp;s erkannt (Test 3), und
        30 Minuten neben einer schaltenden 12-V-Sirene und einem Blitzlicht, mit gezählten CRC-Fehlern
        und verpassten Abfragen (Test 6). Sie gehen, sobald ein Zielmodul gebaut ist; bitte melde, was
        du misst, in einem Issue.
    open:
      splitter: >-
        <strong>Ein Verteiler</strong> für mehr als ein Modul an einer Box.
      pcb: >-
        <strong>Eine Träger-Platine</strong> mit der Anschlussplatine darauf (bis dahin
        Lochraster), und ein Schaltplan des Anschlusses, der nach dem ersten Bau folgen kann.
    full: >-
      Die vollständige Anleitung, mit allen Teilen, dem Aufbau, den Adressen, den Prüfungen und der
      Fehlersuche (auf Englisch und Portugiesisch):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/expansion-port/BUILD.md">Bauanleitung für den Erweiterungsanschluss</a>.
      Die Entscheidungen dahinter stehen im RFC-Entwurf
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/rfcs/0000-expansion-port.md">The expansion port</a> (auf Englisch).
  target:
    title: Ziel-Addon
    status: >-
      <strong>Baubar, und die Firmware ist fertig; noch nicht an einer echten Platte oder einer echten
      Box ausprobiert.</strong> Inkrement 8 des Plans für den Erweiterungsanschluss hat die Firmware
      des Moduls geschrieben, seine Pins festgelegt und seine UF2-Dateien in die Releases gebracht, und
      die Box liest das Modul jetzt und gibt jeden Treffer an das Skript des Modus weiter: alles nur auf
      einem Computer getestet, gegen ein simuliertes Modul. Du kannst das Ziel jetzt bauen, flashen und
      in den Anschluss einer Box stecken; Strom, Abstimmung des Sensors und Spannungsteiler werden beim
      ersten Bau festgelegt (unten). Noch wurde kein Ziel nach der Anleitung gebaut.
    what: >-
      Eine Platte, auf die geschossen wird, mit einem Piezo-Sensor, der jeden Treffer spürt, und
      einem eigenen kleinen RP2040-Board (dem <strong>Zielmodul</strong>). Es wird in den
      <a href="#expansion-port">Erweiterungsanschluss</a> einer Box gesteckt und macht die Box zu
      einem punktenden Ziel für <a href="{{ page.to.modes }}#target-windows">Zielfenster</a>, dessen
      Regeln gebaut und im Simulator getestet sind, auch durchgehend mit einem simulierten Ziel; das
      Fenster zeigt der Leuchtring der Box selbst, also braucht das Modul kein Licht. Jede Box mit
      Anschluss nimmt eins: eine Field Box, ein Satellit oder ein I/O-Pod.
    how: >-
      Der Piezo, auf die Rückseite der Platte geklebt, macht aus einem Treffer eine kurze Spitze; das
      Modul findet ihren Höchstwert, die Stärke von 0 bis 255, und hält bis zu 16 Treffer mit ihrem
      Alter bereit, bis die Box sie abholt. Die Box liest es alle 20&nbsp;ms über den Anschluss, etwa
      5&nbsp;% des Busses, so erreicht ein Treffer das Spiel nach etwa 21&nbsp;ms, und keiner zählt
      doppelt. Die Skripte der Modi erhalten jeden Treffer als <code>hit.hit</code> mit seiner Stärke,
      nur während ein Spiel läuft, und können das Ziel scharf machen und entschärfen. Etwa
      <span class="nowrap">10–15&nbsp;€</span> für das Modul, dazu Platte, Kabel und der Anschluss der
      Box (die Schätzungen des Projekts).
    parts:
      board: >-
        Ein <strong>RP2040-Board</strong>, Klasse RP2040-Zero oder ein Raspberry Pi Pico, mit 48&nbsp;MHz
        getaktet, damit es innerhalb der 25&nbsp;mA des Anschlusses bleibt.
      piezo: >-
        Eine <strong>Piezo-Scheibe</strong> mit 27–35&nbsp;mm (und Ersatz: sie brechen), ein
        Gummipolster von 2–3&nbsp;mm und Kontaktkleber.
      front_end: >-
        Die Sensorschaltung: ein 1-MΩ-Entladewiderstand, zwei Spannungsteiler-Widerstände in Fassungen
        (ihre Werte werden an echten Platten gewählt) und zwei Schottky-Dioden der Klasse BAT85, die
        den Eingang des Prozessors zwischen Masse und 3,3&nbsp;V halten.
      mosfet: >-
        Ein <strong>P-Kanal-MOSFET</strong> (Klasse AO3401 oder SI2301) und ein 10-kΩ-Widerstand: der
        Schutz des Moduls gegen ein selbst gebautes, verpolt verdrahtetes Kabel.
      address: >-
        Zwei Lötbrücken (oder ein 2-poliger DIP-Schalter) für die Adresse: 0x58 mit beiden offen,
        0x59–0x5B für ein zweites Ziel an derselben Box.
      led: >-
        Eine 3-mm-LED und ein 1-kΩ-Widerstand: Sie blinkt, während die Box das Modul bittet, sich zu
        zeigen, damit man es auf dem Feld findet.
      connector: >-
        Ein <strong>männlicher</strong> M12-Einbaustecker, A-codiert, 5-polig, das
        M12-Verlängerungskabel (höchstens 2&nbsp;m), ein kleines IP65-Gehäuse, Lochraster und Kabel.
      plate: Eine Stahlplatte oder eine Polycarbonat-Platte, und ein Ständer.
    pins_title: Die Pins des Moduls
    pins_intro: >-
      So, wie die Firmware des Moduls sie benutzt: dieselben GPIO-Nummern auf einem RP2040-Zero und
      einem Pico. Alle anderen Pins bleiben unbeschaltet.
    pin_rp2040: RP2040-Pin
    pin:
      v3: >-
        Versorgung, etwa 3,0&nbsp;V: M12-Pin 1 (braun), über den MOSFET. Bei einem Pico zusätzlich
        3V3_EN an Masse
      gnd: "Masse: M12-Pin 3 (blau)"
      sda: "I2C-SDA, ohne Pull-up: M12-Pin 2 (weiß)"
      scl: "I2C-SCL, ohne Pull-up: M12-Pin 4 (schwarz)"
      adc0: "Die Eingangsschaltung des Piezos (ADC0)"
      adc1: "Die Eingangsschaltung einer zweiten Platte (ADC1), nur mit der Firmware für zwei Platten"
      a0: "Adress-Lötbrücke an Masse: plus 1"
      a1: "Adress-Lötbrücke an Masse: plus 2"
      led: "Die Anode der LED; ihre Kathode über 1&nbsp;kΩ an Masse"
    steps:
      port: >-
        Bau und prüf zuerst den <a href="#expansion-port">Erweiterungsanschluss</a> der Box.
      supply: >-
        Die Versorgung: M12-Pin 1 über den MOSFET an den 3V3-Pin des RP2040-Boards, nie an seinen 5-V-,
        VBUS-, VSYS- oder USB-Pin; Pin 3 an Masse; Pin 5 kurz abgeschnitten und isoliert. Bei einem
        RP2040-Zero bleibt sein eigener Spannungsregler dann stromlos; bei einem Pico 3V3_EN an Masse
        legen, damit sein Regler aus ist.
      piezo: >-
        Kleb den Piezo mit seinem Polster in die Mitte der Plattenrückseite; den Entladewiderstand über
        seine Litzen, dann Spannungsteiler und Dioden auf dem Weg zu GP26 (die zweite Eingangsschaltung
        eines Moduls für zwei Platten an GP27).
      bus: >-
        SDA (Pin 2) an GP4 und SCL (Pin 4) an GP5, ohne Pull-up-Widerstände im Modul; die
        Adress-Lötbrücken von GP2 und GP3 an Masse, beide offen für 0x58; die LED an GP14.
      enclosure: >-
        Das Gehäuse hinter der Platte, am Ständer befestigt statt an der Platte, sein Stecker von den
        Schießenden weg, und das Kabel nach unten und am Boden entlang zur Box.
      check: >-
        Prüf mit dem Multimeter, das Modul stromlos: kein Kurzschluss zwischen Pin 1 und 3, Pin 5
        offen, kein Pull-up an Pin 2 und 4, die Dioden messen sich als Dioden, etwa 1&nbsp;MΩ über dem
        Piezo.
    flash_title: Das Modul flashen
    flash_intro: >-
      Die Firmware des Moduls ist eine UF2-Datei, von Hand über USB geflasht und nie über die Luft, mit
      dem Modul von der Box getrennt: Steck nie das USB-Kabel und das Kabel des Anschlusses
      gleichzeitig ein.
    flash:
      download: >-
        <strong>Die UF2-Datei holen</strong>: <code>atalaia-target-module-&lt;Version&gt;.uf2</code>
        (<code>atalaia-target-module-2-&lt;Version&gt;.uf2</code> für zwei Platten) aus einem
        <a href="https://github.com/vakaobr/atalaia-project/releases">Release</a>, ab dem ersten nach
        0.7.0, und mit den <code>SHA256SUMS</code> des Release prüfen: Moduldateien sind nicht
        signiert. Oder selbst bauen mit <code>python3 tools/docker_module.py build</code>.
      boot: >-
        <strong>Flashen</strong>: die BOOT-Taste des Boards halten, während du sein USB-Kabel an einen
        Computer steckst, die UF2-Datei auf das Laufwerk ziehen, das erscheint (<code>RPI-RP2</code>),
        und das USB-Kabel abziehen, sobald das Board neu startet.
      found: >-
        <strong>In den Anschluss der Box stecken</strong>: Innerhalb von 2&nbsp;s meldet das serielle
        Log der Box <code>expansion: 0x58 added: 58:target/1.0.0:hit</code>, und <code>@modules</code>
        in ihrer seriellen Konsole listet das Ziel auf.
      armed: >-
        <strong>Im Spiel ausprobieren</strong>: Zielfenster auf der Box starten; die Platte ist scharf,
        und ein Klopfen darauf erscheint im Log als
        <code>expansion: hit hit, strength &lt;n&gt;</code>.
    after:
      power: >-
        <strong>Strom und 3V3 des Moduls</strong>: unter 25&nbsp;mA bei 48&nbsp;MHz, mit einem
        Multimeter in Reihe mit Pin 1 (Labortest 4), und etwa 3,0&nbsp;V an seinem 3V3-Pin, während es
        läuft.
      tuning: >-
        <strong>Schwelle, Sperrzeit und Stärkeskala</strong> auf echten Platten aus Stahl und
        Polycarbonat, an der Energiegrenze des Felds und mit Augenschutz (Labortest 8). Die Vorgaben der
        Firmware (eine Schwelle von 300 von 4095, 50&nbsp;ms Sperrzeit) sind nur ein Ausgangspunkt.
      divider: >-
        <strong>Die zwei Widerstände des Spannungsteilers</strong>, im selben Test gewählt (darum
        stecken sie in Fassungen): ein Treffer aus der Entfernung deutlich über der Schwelle, ein
        Treffer direkt über dem Piezo, ohne die Dioden zu erreichen.
      port: >-
        <strong>Die Tests des Anschlusses mit einem Modul</strong>: Ein- und Ausstecken während eines
        Spiels und Störungen neben einer Sirene, in der Liste des
        <a href="#expansion-port">Erweiterungsanschlusses</a>.
      preset: >-
        <strong>Zielfenster als eingebaute Voreinstellung der Field Box</strong>, sobald das Ziel auf
        dem Labortisch getestet ist; bis dahin spielt ein Feld den Modus wie jeden anderen auf eine Box.
        Der I/O-Pod leiht die Treffer eines Ziel-Addons schon einem Spiel auf dem Handy (Inkrement 9),
        nur auf einem Computer getestet: siehe <a href="#io-pod">I/O-Pod</a>.
    open:
      plate: >-
        <strong>Die Platte</strong>: Materialsorte, Größe, Dicke, Ständer und Winkel, aus den ersten
        Aufbauten.
      pcb: >-
        <strong>Eine Träger-Platine</strong> für das Modul; bis dahin Lochraster.
    safety_title: Sicherheit, sobald jemand darauf schießt
    safety:
      bench: >-
        <strong>Auf dem Labortisch</strong>: Steck nie das USB-Kabel des Moduls und das Kabel des
        Anschlusses gleichzeitig ein, und berühr die Masse der Box, bevor du ein Modul einsteckst.
      eyes: >-
        <strong>Augen- und Gesichtsschutz</strong> für alle in Reichweite, solange jemand darauf
        schießt, auch auf der Werkbank.
      ricochet: >-
        <strong>BBs prallen von einer harten Platte ab</strong>, und manche kommen zurück: Stell eine
        Stahlplatte schräg, sodass sie nach unten auf den Boden gehen, nie gerade zur schießenden
        Person.
      shield: >-
        <strong>Nur die Platte ist Ziel</strong>: Schieß nie auf die Box, das Kabel oder den Stecker,
        und halte die Elektronik hinter der Platte oder in einem eigenen Gehäuse.
      limits: >-
        <strong>Die Energiegrenzen des Felds</strong> gelten beim Schießen auf Ziele wie auf Menschen.
    photo: das fertige Ziel, Platte und Sensor, und der Anschluss an einer Box.
    full: >-
      Alle Schritte, Prüfungen und Entscheidungen, und was noch auf den Labortisch wartet (auf
      Englisch und Portugiesisch):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/target-addon/BUILD.md">Bauanleitung für das Ziel-Addon</a>.
  out_module:
    title: I2C-Ausgangsmodul
    status: >-
      <strong>Entworfen, noch nicht gebaut; später und optional.</strong> Seine Firmware ist
      geschrieben (Inkrement 11 des Plans für den Erweiterungsanschluss) und nur auf einem Computer
      getestet: Sie lässt sich für den RP2040 bauen, und ihre UF2-Datei kommt mit den Releases, aber
      sie lief noch nie auf einem Board, und keine Box hat ein echtes Modul gesteuert. Noch wurde kein
      Modul nach der Anleitung gebaut.
    what: >-
      Ein Modul für den <a href="#expansion-port">Erweiterungsanschluss</a> einer Box, das bis zu
      vier Lasten (eine Sirene, ein Blitzlicht, eine Hupe, den Niederspannungs-Fernbedienungseingang
      einer Nebelmaschine) über Relais oder MOSFETs schaltet, aus <strong>einer eigenen
      Versorgung</strong>. Ein kleines RP2040-Board führt seine Firmware aus: Die Box hält einen
      Ausgang nur so lange an, wie sie weiter in ihn schreibt (jeder Ausgang ist 1,5&nbsp;s nach dem
      letzten Schreiben aus), und das Modul hält seine eigenen festen Grenzen, eine höchste Einschaltzeit
      und eine kürzeste Auszeit je Kanal, mit einem zweiten, unabhängigen Wächter. Etwa
      <span class="nowrap">25–35&nbsp;€</span> ohne Versorgung und Lasten (die Schätzung des
      Projekts).
    how: >-
      Ein <strong>I2C-Isolator</strong> (Klasse ISO1540 oder ADuM1250) führt den Bus über eine
      Trennstrecke: Die Masse der Box und die Masse des Moduls sind nie verbunden, also bleiben die
      Spitze eines Relais, der Kurzschluss einer Last oder eine verpolte Batterie auf der Seite des
      Moduls. Die Box-Seite des Isolators ist das Einzige an den 3,3&nbsp;V des Anschlusses (ein paar
      mA); alles andere läuft aus dem eigenen Eingang des Moduls mit 9–15&nbsp;V (eine
      12-V-Batterie oder der Akku der Sirene selbst).
    simple_first: >-
      <strong>Nimm zuerst den <a href="#field-box-simple-output">einfachen Ausgang</a></strong>: Für
      eine Sirene, ein Blitzlicht oder eine Nebel-Fernbedienung ist er billiger und einfacher, ohne
      eigene Firmware. Dieses Modul ist für eine Box, die mehr Kanäle braucht, als sie freie Pins hat,
      oder wissen will, ob die Versorgung der Lasten da ist.
    rules_title: Regeln für das Ausgangsmodul
    rules:
      mains: >-
        <strong>Nie Netzspannung.</strong> Es schaltet nur Lasten mit Schutzkleinspannung (SELV):
        höchstens 24&nbsp;V DC und 2&nbsp;A je Kanal. Nichts darin, daran oder damit verbunden berührt
        je eine 230- oder 110-V-Leitung, auch nicht über ein dafür ausgelegtes Relais; ein Netzgerät
        braucht eine fertig gekaufte, zertifizierte, geschlossene Schalteinheit mit einem
        Niederspannungs-Steuereingang.
      smoke: >-
        <strong>Nebelmaschinen nur über ihren dokumentierten
        Niederspannungs-Fernbedienungseingang</strong> (einen Kontakteingang oder einen
        Niederspannungs-Auslöser, der im Handbuch des Herstellers steht), oder ein Akku-Nebelgerät,
        das für das Auslösen über einen Kontakt gebaut ist. Viele billige Netz-Nebelmaschinen führen
        Netzspannung im Kabel ihrer Fernbedienung: Schließ nie ein Relais daran an, und öffne nie
        eine. Steht es nicht schriftlich im Handbuch, wird die Maschine nicht benutzt.
      pyro: >-
        <strong>Nie Pyrotechnik</strong>, Zünder oder Rauchgranaten.
      bare: >-
        <strong>Nie eine nackte PCF8574- oder MCP23017-Relaisplatine</strong> stattdessen am
        Anschluss: Sie hat keine eigene Zeitgrenze, ein Relais bleibt also an, wenn die Box abstürzt.
    parts:
      board: >-
        Ein <strong>RP2040-Board</strong>: ein Raspberry Pi Pico oder ein RP2040-Zero.
      isolator: >-
        Ein <strong>I2C-Isolator</strong> auf einer Platine, Klasse ISO1540 oder ADuM1250, mit zwei
        getrennten Versorgungen und Massen; die Pull-up-Widerstände auf seiner Box-Seite kommen ab (die
        Anschlussplatine hat sie).
      mosfet: >-
        Ein <strong>P-Kanal-MOSFET</strong> (Klasse AO3401 oder SI2301) und ein 10-kΩ-Widerstand,
        damit ein selbst gebautes, verpolt verdrahtetes Kabel den Isolator nicht rückwärts speist.
      relays: >-
        Eine optogekoppelte 4-Kanal-<strong>Relaisplatine mit High-Level-Trigger</strong> (Eingang
        high ist Relais an, oder ein Trigger-Jumper auf high), 5-V-Spulen, Kontakte für mindestens
        2&nbsp;A bei 30&nbsp;V DC, und ein 10-kΩ-Pull-down an jedem Eingang, damit jedes Relais aus
        bleibt, während das Board im Reset ist oder geflasht wird. Oder eine MOSFET-Platine für
        3,3-V-Logik, für oft geschaltete Gleichstromlasten wie Blitzlichter.
      supply: >-
        <strong>Die eigene Versorgung</strong>: ein Eingang für 9–15&nbsp;V DC, eine träge
        1-A-Sicherung, eine Schottky-Diode der Klasse 1N5819 gegen eine verpolte Batterie und ein
        Abwärtswandler (Klasse MP1584 oder LM2596), auf 5,0&nbsp;V eingestellt, für das RP2040-Board
        und die Relaisspulen.
      loads: >-
        <strong>Für jede Last</strong>: eine eigene Batterie und eine eigene Sicherung von höchstens
        2&nbsp;A, über die potenzialfreien Kontakte des Relais (COM und NO), und eine Freilaufdiode
        über einer Motorsirene, einer Hupe oder jeder Spule.
      connector: >-
        Ein <strong>männlicher</strong> M12-Einbaustecker, A-codiert, 5-polig, und das M12-Kabel
        (höchstens 2&nbsp;m), ein IP65-Kunststoffgehäuse von etwa
        150&nbsp;×&nbsp;110&nbsp;×&nbsp;70&nbsp;mm mit Kabelverschraubungen, eine Status-LED,
        Lochraster, Kabel und Beschriftungen („SELV ONLY, NEVER MAINS“).
    pins_title: Die Pins des Moduls
    pins_intro: >-
      So, wie die Firmware des Moduls sie benutzt, an den Stiftleisten eines Pico oder eines
      RP2040-Zero; die M12-Pins gehen nur an die Box-Seite des Isolators, und sein Pin 3 (die Masse
      der Box) an nichts anderes.
    pin:
      sda: "I2C-SDA: die Modul-Seite des Isolators (4,7&nbsp;kΩ an ihre 3,3&nbsp;V)"
      scl: "I2C-SCL: die Modul-Seite des Isolators (4,7&nbsp;kΩ an ihre 3,3&nbsp;V)"
      ch1: "OUT 1: IN1 der Relaisplatine, high ist an; 10&nbsp;kΩ an Masse"
      ch2: "OUT 2: IN2; 10&nbsp;kΩ an Masse"
      ch3: "OUT 3: IN3; 10&nbsp;kΩ an Masse"
      ch4: "OUT 4: IN4; 10&nbsp;kΩ an Masse"
      a0: "Adress-Lötbrücke an Masse: plus 1"
      a1: "Adress-Lötbrücke an Masse: plus 2"
      led: "Die Anode der Status-LED; ihre Kathode über 1&nbsp;kΩ an Masse"
      sense: "Die Versorgungsmessung (optional): ein Teiler 100&nbsp;kΩ / 22&nbsp;kΩ von der Batterie der Lasten"
    pins_more: >-
      Die Adresse ist 0x5C mit beiden Brücken offen (0x5D–0x5F mit ihnen). Die 5&nbsp;V des
      Abwärtswandlers gehen an VSYS des Pico oder an den 5-V-Pin des RP2040-Zero, der 3V3-Pin des
      Boards an die Modul-Seite des Isolators.
    flash_title: Flashen und erstes Einschalten
    flash:
      download: >-
        <strong>Die UF2-Datei holen</strong>: <code>atalaia-output-module-&lt;Version&gt;.uf2</code>
        aus einem <a href="https://github.com/vakaobr/atalaia-project/releases">Release</a>, ab dem
        ersten nach 0.7.0, mit seinen <code>SHA256SUMS</code> geprüft (nicht signiert). Sie hat die
        vorgegebene Kanalliste, vier allgemeine Relais mit je höchstens 30&nbsp;s, für einen ersten
        Labortest; für andere Lasten baust du deine eigene mit der Kanalliste dessen, was eingebaut
        ist (<code>python3 tools/docker_module.py build</code>).
      boot: >-
        <strong>Flashen</strong> mit ausgeschalteter Versorgung, abgezogenem M12-Kabel und getrennten
        Lasten: die BOOT-Taste des Boards halten, während du es an den USB eines Computers steckst, die
        UF2-Datei auf das Laufwerk kopieren, das erscheint, und USB abziehen.
      first: >-
        <strong>Erstes Einschalten, Lasten getrennt</strong>: Kein Relais klickt, beim Einschalten
        oder nach 20 Einschaltzyklen, und die LED bleibt dunkel (schnelles Blinken heißt, die Firmware
        hat ihre Kanalliste abgelehnt).
      box: >-
        <strong>An einer Box</strong>: Die Box findet es als <code>5c:out4/1.0.0</code>, und seine
        Ausgänge bleiben <strong>aus, bis sie an der Box im Admin-Menü freigegeben werden</strong>,
        mit Funktion und höchster Einschaltzeit jedes Kanals; dessen 1-s-Test klickt dann jedes Relais
        der Reihe nach.
    after:
      lease: >-
        <strong>Aus innerhalb von 1,5&nbsp;s</strong> mit einem eingeschalteten Relais, jedes Mal,
        wenn die Box ihre Versorgung verliert, neu startet oder das Kabel durchtrennt oder abgezogen
        wird (Labortest 5, auf Video gestoppt).
      isolator: >-
        <strong>Der Isolator bei den 3,0&nbsp;V des Anschlusses</strong>, dem unteren Ende seines
        Bereichs, und der Low-Pegel des Busses durch ihn und den Puffer des Anschlusses (mit einem
        Oszilloskop); der Strom des Moduls aus dem Anschluss (ein paar mA erwartet).
      relays: >-
        <strong>Die Relais ziehen bei 3,3&nbsp;V an</strong>, ihr Spulenstrom, der Strom der eigenen
        Versorgung des Moduls und der Wert der Eingangssicherung, die Versorgungsmessung gegen ein
        Multimeter, und Watchdog und Wächter auf einem echten Board.
      noise: >-
        <strong>Störungen</strong>: eine 12-V-Sirene und ein Blitzlicht schalten 30 Minuten neben der
        Box und ihrem Kabel, mit gezählten CRC-Fehlern und verpassten Abfragen (Labortest 6).
      smoke: >-
        <strong>Nebel</strong>: ein Akku-Nebelgerät oder eine Nebelmaschine mit dokumentiertem
        Niederspannungseingang, ausgelöst durch die Explosion von Bombe, gestoppt durch „Alle Ausgänge
        aus“ der Spielleitung und durch das Spielende (Labortest 10).
    photo: das fertige Modul, beide Seiten des Isolators und seine Beschriftungen.
    full: >-
      Alle Teile, die zwei Seiten, die Versorgung, die Lasten, die Pins, die Prüfungen und was auf
      den Labortisch wartet (auf Englisch und Portugiesisch):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/output-module/BUILD.md">Bauanleitung für das I2C-Ausgangsmodul</a>.

hub:
  title: Community-Hub
  intro: >-
    Hier werden sich Felder, Teams und Bastelnde treffen. Alles ist freiwillig: Der Hub enthält nur,
    was Leute veröffentlichen möchten, und Spieldaten bleiben auf den eigenen Servern jedes Felds.
  open: Offen
  planned: Geplant
  later: Später
  discussion:
    title: Diskussion
    text: Fragen, Ideen, Reviews des Designs und Berichte von Events.
    link: Zu den Discussions
  gallery:
    title: Bau-Galerie
    text: >-
      Fotos, Stücklisten, Gehäusedateien und Verdrahtungsnotizen für jeden Bau, angefangen mit den
      ersten Prototypen der Field Box.
  directory:
    title: Verzeichnis von Feldern und Teams
    text: >-
      Eine freiwillige Liste von Feldern und Teams, die Atalaia nutzen, mit Region, Geländeart und
      einem Kontakt-Link.
  browser:
    title: Modus- und Szenario-Browser
    text: >-
      Die <a href="https://vakaobr.github.io/atalaia-modes/">Modus-Registry</a> ist online, noch ohne Modi: Sei die oder der Erste.
      Ein Browser mit Beschreibungen und Bewertungen der Community kommt später.
  stats:
    title: Nutzungsstatistik
    text: Freiwillige, anonyme Summen von Versionen, Plattformen und gespielten Modi. Standardmäßig aus.
  hosting:
    title: Gehostete Site-Server
    text: Für Clubs ohne IT-Unterstützung, zum Selbstkostenpreis, mit getrennten und exportierbaren Daten jedes Clubs.

# Each entry: id (the anchor, stable ASCII), term (as shown) and text (1-3 sentences).
glossary:
  id: glossar
  title: Glossar
  intro: >-
    Die Fachbegriffe dieser Seiten, einfach erklärt. Die Links im Text jeder Seite führen hierher.
  groups:
    game: Das Spiel
    hardware: Hardware
    radio: Funk und Verbindungen
    software: Software
    licences: Lizenzen
  props:
    id: glossar-props
    term: Props
    text: >-
      Die elektronischen Geräte eines Spiels: Boxen zum Einnehmen, Bomben zum Scharfmachen und
      Entschärfen, Terminals zum Hacken, Zielscheiben zum Treffen. Bei Atalaia kann jedes Gerät eins
      sein: eine eigens gebaute Box, ein Handy oder ein kleines Board.
  field_box:
    id: glossar-field-box
    term: Field Box und Satellit
    text: >-
      Die eigenen Prop-Designs von Atalaia, gebaut aus handelsüblichen Teilen rund um einen ESP32. Die
      Field Box ist das Hauptgerät, mit großen Arcade-Knöpfen, Tastenfeld, Bildschirm, Lichtern,
      Lautsprecher und NFC-Leser in einem wetterfesten Gehäuse, für etwa
      <span class="nowrap">70–110&nbsp;€</span> an Teilen; der Satellit ist eine kleinere Box für einen
      Nebenpunkt, für etwa <span class="nowrap">30–40&nbsp;€</span>. Firmware und Bauhandbuch der Field
      Box sind fertig; ein erster Aufbau auf dem Labortisch (lose Kabel, ohne Gehäuse) spielt schon (Phase&nbsp;1).
  milsim:
    id: glossar-milsim
    term: Milsim
    text: >-
      Kurz für Military Simulation: lange Spiele, oft ein ganzes Wochenende, mit Missionen, einer
      Befehlskette und realistischen Regeln. Es ist der größte Test für Atalaia: 10 bis 20 Boxen und
      Satelliten auf einer großen Fläche.
  cqb:
    id: glossar-cqb
    term: CQB
    text: >-
      Close Quarters Battle: Spiele in Häusern, Villen, Lagerhallen und anderen engen Räumen, meist
      unter etwa 150 m Ausdehnung. Alles ist nah und schnell, also nutzt das CQB-Profil von Atalaia
      kürzere Einnahme- und Bombenzeiten und platziert die Boxen auf einem Grundriss statt per GPS.
  chrono:
    id: glossar-chrono
    term: Chrono und Joule
    text: >-
      Ein Chrono (Chronograf) misst, wie schnell eine Replik eine BB verschießt. Aus der
      Geschwindigkeit und dem Gewicht der BB ergibt sich ihre Energie in Joule, die Felder je nach Art
      der Replik begrenzen: eine BB mit 0,20&nbsp;g bei 100&nbsp;m/s (etwa 328&nbsp;fps) hat 1 Joule.
      Atalaia bewahrt die Messwerte jeder Replik auf, von Marshal signiert, damit Marshals im Lauf des
      Tages Stichproben machen können (in Software gebaut, noch nicht auf einem Feld genutzt); über
      jede Strafe entscheidet immer ein Mensch.
  stuck_box:
    id: "glossar-haengengebliebene-box"
    term: "Hängengebliebene Box"
    text: >-
      Eine Box, die aus oder außer Reichweite war, als ihr Spiel endete, und deshalb noch glaubt, in
      diesem Spiel zu sein: Sie zeigt das alte Spiel und lehnt neue Einladungen ab („in einem
      anderen Spiel“). Ab v0.9.0 (veröffentlicht am 6. November 2026; bisher ein Test auf dem
      Labortisch) sendet der Controller das Ende dieses Spiels erneut, wenn er so eine Box hört, die
      GM-Konsole listet sie mit einer Schaltfläche „Freigeben“, und das Admin-Menü der Box hat
      „Spiel verlassen“.
  microcontroller:
    id: glossar-mikrocontroller
    term: Mikrocontroller
    text: >-
      Ein vollständiger, winziger Computer auf einem einzigen Chip, gemacht für ein einziges Programm.
      Er startet im Nu, braucht sehr wenig Akku und ist günstig, deshalb ist er das übliche Gehirn
      eines elektronischen Props. ESP32- und Arduino-Boards sind Mikrocontroller-Boards.
  esp32:
    id: glossar-esp32
    term: ESP32
    text: >-
      Ein beliebter, günstiger Mikrocontroller mit eingebautem WLAN und Bluetooth; viele Boards haben
      auch einen LoRa-Funk. Er ist das Gehirn der Field Box, des Satelliten und des I/O-Pods und sollte
      ein Prop mit einem Akku ein bis drei Tage am Laufen halten (eine Schätzung, noch nicht gemessen).
      Boards, die Leute schon besitzen, können auch mitmachen, selbst ohne zusätzlichen Speicher
      (PSRAM), mit ein paar Einschränkungen.
  arduino:
    id: glossar-arduino
    term: Board der Arduino-Klasse, Thin Node
    text: >-
      Einfache, sehr günstige Mikrocontroller-Boards im Arduino-Stil, etwa mit AVR- oder
      RP2040-Chips. Sie sind zu klein, um Spielmodi auszuführen, also arbeiten sie bei Atalaia als Thin
      Nodes: Sie leihen ihre Knöpfe, Lichter oder Sensoren einer Box in der Nähe oder dem
      Feld-Controller, der die Regeln für sie ausführt.
  raspberry_pi:
    id: glossar-raspberry-pi
    term: Raspberry Pi
    text: >-
      Ein kleiner, günstiger Computer etwa in Scheckkartengröße, der Linux ausführt. Mit einer
      LoRa-Funkplatine dazu wird er der übliche Feld-Controller (etwa
      <span class="nowrap">80–150&nbsp;€</span> für den ganzen Aufbau), und er kann auch Props betreiben,
      die einen großen Bildschirm oder eine Kamera brauchen.
  android:
    id: glossar-android-prop
    term: Android-Prop und I/O-Pod
    text: >-
      Die App von Atalaia macht aus einem Android-Handy oder -Tablet, neu oder ein ausgedientes ab
      Baujahr 2017, ein Prop, das jeden Spielmodus auf seinem Bildschirm ausführt. Handys haben keinen
      LoRa-Funk, und Touchscreens sind mit Handschuhen schwer zu bedienen, also verbindet sich eine
      kleine ESP32-Box, der I/O-Pod (Input/Output), per Kabel oder Bluetooth und bringt Funk, große
      Knöpfe, Lichter und eine Sirene dazu. Beide sind in Software gebaut (Phase&nbsp;3) und auf
      Emulatoren und einem Computer getestet, noch nicht auf einem echten Handy oder Pod.
  firmware:
    id: glossar-firmware
    term: Firmware und Flashen
    text: >-
      Firmware ist das Programm, das in ein Gerät eingebaut ist und beim Einschalten startet.
      Flashen heißt, eine neue Version davon auf das Gerät zu schreiben, meist über ein USB-Kabel.
      Boxen von Atalaia werden beim ersten Mal per Kabel geflasht; danach kommen Firmware-Updates
      vom Feld-Controller per WLAN (seit Oktober 2026 auf Boards am Labortisch erprobt) und machen
      sich selbst rückgängig, wenn eine neue Version nicht startet. Eine Box installiert nur ein
      Release, das mit einem der eingebauten Release-Schlüssel des Projekts signiert ist. Das
      Projekt hat einen dieser Schlüssel im November 2026 gewechselt: Eine Box mit v0.6.1 oder älter
      installiert v0.7.0 vor v0.8.0.
  lora:
    id: glossar-lora
    term: LoRa
    text: >-
      Kurz für <em>Long Range</em>: ein Funk, der kleine Nachrichten mit sehr wenig Strom weit
      schickt, ohne SIM-Karte, Mobilfunknetz oder Abo. Auf einem typischen Feld sollte er etwa <span
      class="nowrap">0,5–2&nbsp;km</span> weit reichen (eine Schätzung aus dem Design, noch zu
      messen) und kommt besser durch dicke Wände als WLAN. Der Haken: Nachrichten müssen kurz sein,
      und jedes Gerät darf nur einen kleinen Teil der Zeit senden. Atalaia nutzt standardmäßig
      869,525&nbsp;MHz, im einzigen Teilband von EU868, das 10&nbsp;% Duty Cycle und 500&nbsp;mW
      erlaubt, also bis zu 6 Minuten Sendezeit pro Stunde für jede Box — genug für Events, Punkte
      und Zeitsignale, mit reichlich Reserve. Ein Feld kann einen anderen Kanal wählen, der 1&nbsp;%
      der Zeit oder weniger und 25&nbsp;mW erlaubt; wechselt die Spielleitung den Kanal, verpasst
      eine ausgeschaltete Box den Wechsel und muss wiedergefunden werden. Boxen schicken nur, was
      sich ändert, etwa „Rot hat B eingenommen“.
  mesh:
    id: glossar-mesh
    term: Mesh
    text: >-
      Ein Netz, in dem Geräte Nachrichten füreinander weiterreichen, sodass eine Box, die zu weit von
      der Basis entfernt ist, über die Boxen dazwischen gehört wird. Atalaia wiederholt jede Nachricht
      nur ein paar Mal, damit der Funk nicht verstopft, und die Orga kann in schwierigem Gelände
      zusätzliche Boxen als Repeater aufstellen.
  skirmesh:
    id: glossar-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      Das eigene Funkprotokoll von Atalaia: das vereinbarte Format, in dem Boxen, Controller und Apps
      Nachrichten austauschen, über LoRa, WLAN oder Bluetooth. Es ist öffentlich dokumentiert, also
      kann jede und jeder ein Gerät bauen, das mitspielt, und jede Nachricht ist mit einem Schlüssel für
      dieses Spiel verschlüsselt und signiert, sodass niemand mit einem Funkgerät einfach eine
      Einnahme fälschen kann. Es ist in Software gebaut und getestet, noch nicht auf einem Feld.
  links:
    id: glossar-wlan-ble-nfc-qr
    term: WLAN, BLE, NFC und QR-Codes
    text: >-
      Alltägliche Verbindungen mit kurzer Reichweite, jede mit ihrer Aufgabe. WLAN (etwa
      <span class="nowrap">50–150&nbsp;m</span>) trägt das Sperrige: die Konsole der Orga, die
      Spieler-App, neue Modi und Updates; BLE, Bluetooth Low Energy
      (<span class="nowrap">10–30&nbsp;m</span>), verbindet ein Handy mit seinem Pod und koppelt Geräte.
      NFC ist Antippen zum Lesen, wie bei einer kontaktlosen Karte, für Team-Tags, Armbänder und
      Beitrittskarten, und QR-Codes werden mit der Handykamera gescannt, um einem Spiel beizutreten
      oder einen Code einzugeben.
  api:
    id: glossar-api
    term: "API: MQTT, REST und WebSocket"
    text: >-
      Eine API ist ein dokumentierter Weg, über den andere Programme ein Spiel lesen und, mit
      Erlaubnis, steuern können. Damit kann ein Club eine große LED-Anzeigetafel ansteuern, ein
      Live-Overlay mit Punkten in einem Stream, Alarme in Discord oder Telegram, oder ein Relais, das
      Rauch und Sirenen auslöst, wenn die Bombe hochgeht. MQTT, REST und WebSocket sind drei
      Standardwege hinein, also funktionieren gewöhnliche Tools damit. Der Feld-Controller hat sie seit
      Phase&nbsp;2, mit einer fertigen Anzeigetafel-Seite; sie ist auf einem Computer getestet, noch
      nicht auf einem Feld.
  atak:
    id: glossar-atak
    term: ATAK
    text: >-
      Das Android Team Awareness Kit: eine Karten-App fürs Militär, mit einer kostenlosen zivilen
      Version, die viele Milsim-Teams nutzen, um ihre Leute auf einer gemeinsamen Karte zu sehen. Der
      Feld-Controller von Atalaia soll die Boxen auf diesen Karten zeigen können, und welches Team
      jede hält (Phase&nbsp;4).
  local_first:
    id: glossar-local-first
    term: Local-first
    text: >-
      Alles, was ein Spiel braucht, läuft auf dem Feld selbst, auf den Boxen und dem Feld-Controller,
      also funktioniert es ganz ohne Internet oder Mobilfunknetz. Ist Internet da, bringt es nur
      Extras, etwa Konten und Spielverlauf. Eine Box, die den Kontakt verliert, spielt weiter, zählt
      weiter Punkte und holt auf, wenn die Verbindung zurückkommt.
  core:
    id: glossar-kern
    term: Gemeinsamer Kern (C11)
    text: >-
      Das Herz von Atalaia: ein Programm, geschrieben in der Programmiersprache C (ihrer Version von
      2011, daher C11), das jedes Gerät nutzt, das Spielmodi ausführt. Es verarbeitet Events, Punkte und
      Funknachrichten und führt die Spielmodi sicher aus; jede Hardware-Art fügt nur eine dünne
      Schicht mit den Treibern für ihre Knöpfe, ihren Bildschirm und ihren Funk hinzu. Es gibt ihn
      heute schon.
  lua:
    id: glossar-lua
    term: Lua und Spielmodus-Skripte
    text: >-
      Ein Spielmodus ist ein Skript: eine kurze Textdatei mit Regeln wie „5 Sekunden halten zum
      Einnehmen“, geschrieben in Lua, einer kleinen Programmiersprache, bekannt aus dem Modding von
      Videospielen. Skripte laufen in einer Sandbox, einem abgeschlossenen Raum ohne Zugriff auf
      Dateien oder Netzwerk, sodass ein geteilter Modus einem Gerät nicht schaden kann. Die Orga muss
      Lua nie anfassen: Sie wählt einen Modus und füllt seine Einstellungen aus, und ein visueller
      Editor mit Blöcken folgt in Phase&nbsp;5.
  simulator:
    id: glossar-simulator
    term: Simulator
    text: >-
      Ein Programm, das einen Spielmodus mit virtuellen Boxen in deinem Webbrowser spielt: Du drückst
      die Team-Knöpfe auf dem Bildschirm und siehst die Anzeige jeder Box und das Event-Log. Er läuft
      auf einem gewöhnlichen Computer und existiert heute, also kann jede und jeder Domination und
      Bombe ausprobieren, bevor irgendeine Hardware gebaut ist.
  controller:
    id: glossar-feld-controller
    term: Feld-Controller
    text: >-
      Die Basisstation eines Spiels: ein kleiner Computer, meist ein Raspberry Pi oder ein
      Android-Gerät, der jede Box per Funk hört, die Regeln über mehrere Boxen hinweg ausführt, den
      offiziellen Punktestand führt und die Konsole der Orga auf ihre Handys bringt. Fällt er aus,
      spielen die Boxen weiter und ein anderes geeignetes Gerät übernimmt, und eine einzelne Box kann
      ein Spiel auch ohne ihn leiten. Er ist gebaut (Phase&nbsp;2) und spielt auf dem Labortisch mit echten
      Boxen, noch nicht auf einem Feld; auf einem Android-Gerät ist er in Software gebaut
      (Phase&nbsp;3), noch nicht auf einem echten Handy ausprobiert.
  server:
    id: glossar-site-server
    term: Site-Server
    text: >-
      Ein optionaler Computer, am Feld oder online gemietet, der aufbewahrt, was über ein Spiel hinaus
      bleibt: Konten der Spielenden, Spielverlauf, das Chrono-Register und die Dienste hinter der
      Spieler-App. Spiele warten nie auf ihn. Er ist gebaut (Phase&nbsp;4) und läuft auf einem
      Testserver, noch nicht auf einem echten Feld, und der Community-Hub plant gehostete Server zum
      Selbstkostenpreis für Clubs ohne IT-Unterstützung.
  open_source:
    id: glossar-open-source
    term: Open Source und freie Software
    text: >-
      Der Quellcode, das für Menschen lesbare Rezept eines Programms, ist öffentlich, und alle dürfen
      ihn nutzen, untersuchen, ändern und teilen, auch kommerziell. „Frei“ heißt hier Freiheit, nicht
      kostenlos: Felder dürfen Eintritt nehmen und Boxen dürfen verkauft werden.
  copyleft:
    id: glossar-copyleft
    term: "Copyleft: GPL und AGPL"
    text: >-
      Die Regel, die Atalaia offen hält: Es so zu nutzen, wie es ist, verlangt nichts von dir, aber
      wer eine geänderte Version weitergibt, teilt ihren Quellcode unter derselben Lizenz. Die GPL, für
      Kern, Firmware, App und Modi, gilt, wenn du Kopien weitergibst oder verkaufst; die AGPL, für den
      Feld-Controller und den Site-Server, gilt auch, wenn du eine geänderte Version für andere über
      ein Netzwerk betreibst. Hardware-Designs (CERN-OHL-S) und Dokumentation (CC BY-SA) funktionieren
      genauso.

involved:
  title: Mitmachen
  intro: "Atalaia wird von Spielenden, Feldbetreibenden und Bastelnden gebaut. Du kannst heute schon helfen:"
  review: >-
    die <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">Design-Spezifikation</a>
    (auf Englisch und Portugiesisch) prüfen und <a href="https://github.com/vakaobr/atalaia-project/issues">Issues
    eröffnen</a>;
  propose: >-
    Spielmodi mit der
    <a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">Vorlage für
    Spielmodus-Ideen</a> vorschlagen;
  share: erzählen, wie auf deinem Feld gespielt wird, damit die Standardwerte zu echten Spielen passen;
  code: >-
    Code schreiben: Fang mit
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>
    (auf Englisch und Portugiesisch) an.
  rules: >-
    Jeder Commit trägt eine Zeile <code>Signed-off-by</code>, und das Projekt ist strikt Clean-Room,
    von Grund auf neu geschrieben: kein Code, keine Firmware, keine Handbücher, Töne oder Bilder aus
    einem kommerziellen Produkt.

name:
  title: Der Name
  badge_alt: >-
    Das Atalaia-Abzeichen: drei Wachtürme auf Sanddünen, mit Signalfeuern auf ihren Spitzen, durch
    einen Bogen verbunden, über dem Wort ATALAIA.
  word: >-
    Eine <em>atalaia</em> ist ein Wachturm: ein Ausguck auf einem Hügel oder an einem Küstenstreifen.
    Das Wort kam aus dem Arabischen <em>aṭ-ṭalāʾiʿ</em>, „die Späher“, ins Portugiesische, und
    <em>estar de atalaia</em> heißt noch heute „auf der Hut sein“.
  fit: >-
    Ein Feld-Controller sieht jedes Prop auf dem Feld und sagt der Spielleitung sofort, wenn sich
    etwas ändert. Auch Wachtürme waren local-first und betrieben das ursprüngliche Mesh mit wenig
    Bandbreite: Rauch bei Tag, Feuer bei Nacht, von Turm zu Turm weitergegeben. Skirmesh-RF folgt
    denselben Regeln mit LoRa.

safety:
  title: Sicherheit auf dem Feld
  text: >-
    Props von Atalaia sind Spielausrüstung. Lass sie wie Spielprops aussehen: kräftige Farben, klare
    Aufschriften „GAME PROP“ und nichts, was einem echten Sprengsatz ähnelt. Transportiere sie in
    beschrifteten Koffern, lass sie außerhalb des Felds nie unbeaufsichtigt und geh sorgsam mit
    Lithium-Akkus um.

footer:
  licences: >-
    Atalaia ist freie Software: GPL-3.0-or-later für Kern, Firmware, App und Modi; AGPL-3.0-or-later
    für den Feld-Controller und den Site-Server; CERN-OHL-S-2.0 für Hardware; CC BY-SA 4.0 für die
    Dokumentation und diese Seite.
  flags: >-
    Sprachflaggen: Twemoji Country Flags, Grafiken aus Twemoji (Twitter, Inc und Mitwirkende), CC BY 4.0, auf vier Flaggen verkleinert.
  flags_licence: CC BY 4.0
  licensing: Lizenzen
  manuals: Handbücher für Spielende, Orga, Marshals und Box-Betreuende (auf Englisch und Portugiesisch)
  independent: >-
    Unabhängig und von der Community getragen; mit keinem kommerziellen Prop-Hersteller verbunden.
    Diese Seite setzt keine Cookies und lädt nichts von anderen Seiten.
  privacy: Datenschutzerklärung (Entwurf)
  privacy_note: >-
    Die Erklärung, die ein Site-Server seinen Spielenden zeigt. Sie ist eine Vorlage für Betreibende: Sie gibt die rechtlichen Positionen wieder, die der Anwalt oder die Anwältin des Maintainers am 30. Oktober 2026 gebilligt hat, aber der Wortlaut selbst ist noch ein Entwurf, noch nicht von einer juristischen Fachperson geprüft, und jedes Feld muss ihn prüfen und als eigenen übernehmen (auf Englisch und Portugiesisch).
  privacy_href: https://github.com/vakaobr/atalaia-project/tree/main/docs/templates

# The two radio diagrams: site/src/diagrams/*.svg, built into site/img/diagrams/.
# Plain text, not HTML. Each text has a fixed room in the drawing; if a
# translation does not fit, tools/build_site.py names the key and the line.
diagrams:
  lora:
    title: So funktioniert LoRa-Funk
    desc: >-
      Fünf Felder. Chirps: LoRa sendet jedes Symbol als Ton, der über den Kanal gleitet, und ein
      Empfänger, der das Muster kennt, kann es sogar unter dem Grundrauschen entschlüsseln, also
      reicht es mit wenig Strom weit, trägt aber nur kurze Nachrichten. Spreizfaktor: Jede Stufe über
      SF7 verdoppelt etwa die Sendezeit einer Nachricht, für etwas mehr Reichweite; die Boxen nutzen
      heute SF7. Reichweite: am größten auf offenem Gelände mit Sichtverbindung, kürzer durch Wald,
      Menschen und Fahrzeuge, viel kürzer in Gebäuden, und abgeschnitten durch Beton, Metall oder
      einen Hügel, wo eine Box dazwischen weiterleiten kann; 868 MHz kommt besser durch Hindernisse
      als WLAN oder Bluetooth auf 2,4 GHz. Die Schätzung aus dem Design von etwa 0,5 bis 2 km auf einem
      typischen Outdoor-Feld wird im Feldtest von Phase 2 noch gemessen. Weiterleitung: Eine Box
      außerhalb der Reichweite des Controllers wird über die anderen Boxen gehört, und eine Nachricht
      wird standardmäßig höchstens zweimal weitergegeben. Regeln in Europa: ein gemeinsamer
      Spielkanal, standardmäßig 869,525 MHz, der einzige Teil des Bands, der 500 mW und 10 % der Zeit
      erlaubt, 6 Minuten pro Stunde für jedes Gerät; andere Kanäle erlauben 25 mW und 1 % oder weniger.
    chirp:
      title: "Chirps: unter dem Rauschen hörbar"
      sweep: ein Chirp gleitet über den Kanal
      noise: Rauschen
      below: auch unter dem Rauschen dekodiert
      text: >-
        Der Empfänger kennt das Muster und hört es unter dem Rauschen: weit mit wenig Strom, aber
        langsam, daher kurze Nachrichten.
    sf:
      title: Spreizfaktor (SF)
      axis: Sendezeit für dieselbe Nachricht
      text: >-
        Jede Stufe verdoppelt etwa die Sendezeit, für etwas mehr Reichweite. Heute SF7; für große
        Outdoor-Felder plant das Design SF9–10.
    range:
      title: Offenes Gelände oder drinnen
      axis: Reichweite einer Nachricht (Skizze)
      open: Offenes Gelände, mit Sichtverbindung
      woods: Wald, Menschen, Fahrzeuge
      walls: "Drinnen: Ziegel- und Steinwände"
      blocked: Beton, Metall, hinter einem Hügel
      relay: → eine Box leitet weiter
      text: >-
        868 MHz dringt besser durch Wände und Laub als WLAN (2,4 GHz); Beton, Metall und Hügel
        bremsen es stark.
      note: >-
        Schätzung aus dem Design: etwa 0,5–2 km auf einem typischen Outdoor-Feld. Der Feldtest von
        Phase 2 wird es messen.
    relay:
      title: Boxen leiten füreinander weiter
      controller: Controller
      box_a: Box A wiederholt
      box_b: Box B
      text: >-
        Eine Box außer Reichweite des Controllers wird über die anderen gehört. Eine Nachricht geht
        höchstens zweimal weiter (Hop-Limit), damit der Kanal frei bleibt.
    rules:
      title: Funkregeln in Europa (EU868)
      hour: 1 Stunde
      share: Jedes Gerät darf höchstens 10 % der Zeit senden, 6 Minuten pro Stunde.
      text: >-
        Ein gemeinsamer Kanal, standardmäßig 869,525 MHz: der einzige Teil des Bands mit 500 mW und
        10 %. Andere Kanäle: 25 mW, 1 % oder weniger. Keine Lizenz, keine SIM-Karte.
  skirmesh:
    title: Skirmesh-RF auf allen Geräten
    desc: >-
      Links die fünf Schichten von Skirmesh-RF von unten nach oben: 1, der LoRa-Funk auf einem
      gemeinsamen Spielkanal; 2, das Skirmesh-RF-Paket, mit AES-128-CCM-Verschlüsselung unter einem
      Schlüssel pro Spiel, Epoche und Sequenznummern gegen Wiederholungen, einem Hop-Limit für die
      Weiterleitung (standardmäßig zwei Weiterleitungen), ACKs, TIME-Signalen und CLAIM für die
      Übernahme durch einen anderen Controller; 3, die Nachrichten HELLO, EVENT, ACK, STATE, CMD,
      TIME, CONFIG und CLAIM in CBOR; 4, der gemeinsame C-Kern und die Lua-Spielmodi; 5, die REST-,
      WebSocket- und MQTT-APIs des Feld-Controllers, GM-Konsole, Anzeigetafel und Beitrittscodes
      (NFC-Karten für Boxen, QR-Codes für einen Controller in Bereitschaft und, in Phase 3, Handys).
      Rechts, welche Schichten jedes Gerät ausführt. In Software gebaut und getestet, noch nicht auf
      einem Feld: die Field Box (Schichten 1 bis 4), das USB-Funkmodem (1 und 2) und der
      Feld-Controller auf einem Raspberry Pi oder PC (2 bis 5), und die GM-Konsole auf Handys per
      WLAN, die Schicht 5 ohne LoRa-Funk nutzen. Ebenfalls in Software für Phase 3 gebaut: der I/O-Pod
      (1 und 2), der einem Android-Handy oder -Tablet (2 bis 4) einen Funk gibt, und die Spieler-App.
      Geplant: die Satelliten-Box (1 bis 4).
    stack: Ein Protokoll, in Schichten
    l5:
      title: Dienste des Feld-Controllers
      text: >-
        APIs für REST, WebSocket und MQTT, GM-Konsole, Anzeigetafel. Beitritt: NFC-Karten für Boxen,
        QR-Codes für Reserve-Controller und (Phase 3) Handys.
    l4:
      title: "Spiel: gemeinsamer Kern, Lua-Modi"
      text: >-
        Derselbe C-Kern und dieselben Lua-Modi auf jedem Gerät, das spielt: Zonenregeln auf den
        Boxen, Feldregeln auf dem Controller.
    l3:
      title: Nachrichten
      text: >-
        HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG und CLAIM, kompakt als CBOR verpackt. Per WLAN
        reisen dieselben Events als JSON.
    l2:
      title: Skirmesh-RF-Paket
      crypto: AES-128-CCM, Schlüssel pro Spiel
      replay: "Epoche und Sequenz: keine Replays"
      hops: "Hop-Limit: standardmäßig max. 2"
      acks: "ACKs: Verlorenes wird neu gesendet"
      time: TIME-Signale gleichen Uhren ab
      claim: "CLAIM: Reserve übernimmt"
    l1:
      title: LoRa-Funk
      text: Ein gemeinsamer Spielkanal (Standard 869,525 MHz), auf dem jedes Gerät hört.
    devices: Welches Gerät welche Schichten hat
    cells: >-
      Farbig: seine Schichten
    box_sub: ESP32-S3 und ein LoRa-Funk SX1262
    satellite: Satelliten-Box
    satellite_sub: "Geplant: eine kleinere ESP32-Box"
    modem: USB-Funkmodem
    modem_sub: "Am Controller: Funk, Verschlüsselung"
    controller: Feld-Controller
    controller_sub: "Raspberry Pi oder PC: Spiel, API"
    pod: I/O-Pod
