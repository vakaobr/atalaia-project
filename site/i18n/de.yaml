meta:
  index:
    title: Atalaia · die offene Plattform für Force-on-Force
    description: >-
      Atalaia ist eine offene Plattform für Spielprops bei Airsoft, Paintball und Milsim, die ohne
      Internet läuft: Props mit ESP32, Raspberry Pi, Arduino und Android, Spielmodi als Lua-Skripte
      und ein offenes LoRa-Protokoll.
    og_description: >-
      Offene Spielprops für Airsoft, Paintball und Milsim, die ohne Internet laufen. Spielmodi sind
      Skripte; jede Hardware passt.
  modes:
    title: Spielmodi · Atalaia
    description: >-
      Die Spielmodi von Atalaia für Airsoft, Paintball und Milsim: Domination, Bombe / Rush, Sabotage, Hold-All
      Domination, Last Stand, Kill Confirmed, Respawn und Leben, Check-in, der Codes-Modifikator und
      das Medic-Kit, jeweils ein kurzes Lua-Skript.
  radio:
    title: So funktioniert der Funk · Atalaia
    description: >-
      Was LoRa-Funk auf einem Airsoft- oder Paintball-Feld kann und was nicht, welchen Kanal Atalaia
      nutzt und warum, und wie das Protokoll Skirmesh-RF auf jedem Gerät läuft.
  roadmap:
    title: Roadmap · Atalaia
    description: >-
      Die sechs Phasen von Atalaia, vom gemeinsamen Kern bis zur Community, jede mit einem echten
      Feldtest als Abschluss, und wo jede heute steht.
  build:
    title: Bauanleitungen · Atalaia
    description: >-
      Wie du Satellit, I/O-Pod, Erweiterungsanschluss, Ziel-Addon und I2C-Ausgangsmodul von Atalaia aus
      handelsüblichen Teilen baust, wie eine Box eine Sirene oder eine Nebelmaschine schaltet und wo
      die Bauanleitung der Field Box liegt.
  glossary:
    title: Glossar · Atalaia
    description: >-
      Die Fachbegriffe des Projekts Atalaia, von LoRa und ESP32 bis Copyleft, einfach erklärt für
      Spielende, Feldbetreibende und die Spielleitung.
  og_image_alt: >-
    Ein Wachturm auf einem Hügel in der Dämmerung mit einer Funkbox darauf, verbunden mit leuchtenden
    GAME-PROP-Boxen in einem bewaldeten Tal, unter den englischen Worten „Open-source project
    ATALAIA“.
  architecture:
    title: "Wie alles zusammenspielt · Atalaia"
    description: "Sieben Diagramme, wie die Teile von Atalaia miteinander sprechen: welche Verbindung was trägt und was das Feld nie verlässt."

