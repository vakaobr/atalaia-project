    android: Android-Gerät
    android_sub: "Phase 3: Handy oder Tablet führt Modi aus"
    wifi: Handys im WLAN
    wifi_sub: GM-Konsole und Spieler-App
    legend: >-
      Durchgezogen: auf Computer und Emulator gebaut und getestet, noch nicht auf einem Feld.
      Gestrichelt: geplant. Handys im WLAN nutzen Schicht 5, ohne LoRa-Funk.

# The "How it fits together" page (site/src/architecture.html): its texts, then the labels
# of the seven Mermaid diagrams (site/src/diagrams/arch-*.mmd), drawn into SVGs by
# tools/render_diagrams.py. After changing a label, run it again. A label may not hold
# a double quote, a backtick, a semicolon or a hash. arch.tNNN: the English text is in en.yaml;
# the same text has the same key. **x** is bold, \n a line break, <br/> a line break in a plain label.
architecture:
  title: "Wie alles zusammenspielt"
  intro: "Welcher Teil von Atalaia mit welchem spricht, über welche Verbindung und was darüber läuft. Unter jedem Diagramm: was fließt und was nicht."
  status: "Atalaia ist Pre-Alpha. Auf echten Boards am Teststand liefen: Start, Funk, Tasten und Tastenfeld, Aufnahme, ein Update über die Luft und ganze Spiele mit dem Feld-Controller. Die iOS-App hat ihre Checkliste auf einem iPhone bestanden. Alles andere ist nur in Software gebaut und getestet."
  reading: "So liest du das erste Diagramm: Eine durchgezogene Linie funktioniert ohne Internet auf dem Feld, eine gestrichelte braucht Internet."
  flows: "Was fließt"
  not: "Was nicht fließt"
  full: "Diagramm in voller Größe öffnen"
  scroll: "Breites Diagramm: seitlich scrollen."
  doc: "Dieselben Diagramme als Mermaid, mit dem vollständigen Text und den Stellen, an denen Entwurf und Code abweichen: docs/architecture.md auf GitHub →"
  link_roadmap: "Wie die Teile miteinander sprechen: die Architekturdiagramme →"
  link_build: "Unsicher, was womit verbunden ist? So sprechen die Teile miteinander →"
  d1:
    title: "Das ganze System"
    flows: "Der Spielverkehr bleibt auf dem Feld. Boxen und Controller sprechen über LoRa durch das USB-Modem. GM-Konsole, App der Spielenden, Android-Props und die Dateien, die eine Box abholt, nutzen das Wi-Fi des Feldes."
    not:
      - "Im Spiel wartet nichts auf das Internet. Der Site-Server ist optional."
      - "Die Positionen der Spielenden gehen nie über LoRa oder MQTT."
      - "Der Site-Server verbindet sich nie mit dem Controller: Der Controller öffnet die Verbindung immer selbst."
      - "Boxen sprechen nie mit dem Internet. Der Controller holt Modi, und eine Person lädt die Firmware hoch."
  d2:
    title: "Die Funkschichten"
    flows: "Jedes Paket wird mit AES-128-CCM unter dem Spielschlüssel verschlüsselt und geprüft. Das Modem versiegelt und öffnet die Pakete, darum sprechen Controller und Modem über das Kabel im Klartext. Boxen wiederholen die Pakete der anderen."
    not:
      - "Keine Positionen, Namen, Tokens, WLAN-Passwörter, Firmware-Images oder Modus-Pakete gehen über LoRa."
      - "Große Dateien werden über HTTPS geholt. Nur ein kurzes Angebot oder ein Fehlerbericht nutzt LoRa."
  d3:
    title: "Ein Spiel, von der Einladung bis zum Ende"
    flows: "Eine freie Box meldet sich, die Spielleitung lädt sie ein. Die Join-Nutzlast (Spiel-ID und -Schlüssel, Rolle, Teams, Kanal) kommt versiegelt an. Das Spiel startet erst, wenn jede Rolle eine Box hat. Danach senden die Boxen Ereignisse und alle 15 s einen STATE."
    not:
      - "Die GM-Konsole spricht nie LoRa: Sie redet nur mit dem Controller."
      - "Der Spielschlüssel reist nur in der versiegelten Einladung (oder auf einer Karte), nie in einer Ankündigung."
  d4:
    title: "Spielende am Spieltag"
    flows: "Wer spielt, scannt das Plakat, pinnt die CA des Feldes, checkt ein und bekommt ein Token. Die App folgt dann dem Live-Stream. Ein Marshal signiert Chrono-Messwerte auf dem eigenen Handy."
    not:
      - "Positionen gehen nie über LoRa oder MQTT und erreichen nie Spielende anderer Rollen."
      - "Es braucht kein Internet: All das funktioniert bei ausgeschaltetem Site-Server."
  d5:
    title: "Controller und Site-Server"
    flows: "Der Controller schickt Spiele, Ereignisse, Punkte, Knoten und Chrono-Einträge alle 30 s im Spiel und alle 5 min zwischen den Spielen. Er holt Termine, Teilnehmerlisten und Einstellungen. Ein Stream trägt die Live-Ansicht und die Befehle des Remote-GM, die der Controller noch einmal prüft."
    not:
      - "Der Site-Server verbindet sich nie mit dem Controller und hält weder Spielschlüssel noch Join-Schlüssel oder Tokens."
      - "Offline ist der Normalfall: Ereignisse warten und gehen später der Reihe nach raus."
      - "Positionen verlassen den Controller nur in zwei optionalen Fällen (Remote-GM, Remote-ATAK-Relay), im Arbeitsspeicher."
  d6:
    title: "Dinge auf eine Box bringen"
    flows: "Release- und Modus-Schlüssel signieren die Dateien, ihre öffentlichen Hälften sind in die Box eingebaut. Eine Person lädt die signierte Firmware herunter und beim Controller hoch. Der Controller bietet das Update über LoRa an, die Box holt es über das Wi-Fi des Feldes. Eine Box wird per USB-Kabel, NFC-Karte oder Kopplungscode aufgenommen."
    not:
      - "Die Signatur, nicht der Kanal, macht eine Datei sicher: Die Box entscheidet mit den Schlüsseln in ihrer eigenen Firmware, bevor sie ein Byte schreibt."
      - "Der Controller lädt nie Firmware von GitHub herunter."
      - "Release-Schlüssel und Modus-Schlüssel sind getrennte Schlüssel."
  d7:
    title: "Login und Konten auf dem Site-Server"
    flows: "Ein kurzlebiges Zugriffs-Token plus ein Refresh-Token, das bei jeder Nutzung ersetzt wird. Rollen der Orga zählen nur in einer Sitzung mit zweitem Faktor (TOTP oder Passkey). Ein Social-Login allein ist kein zweiter Faktor."
    not:
      - "Der Controller nutzt diese Konten nicht: Er nutzt den API-Schlüssel des Feldes."
      - "Ein Social-Anbieter wird nur vom Browser der Person und vom Site-Server angesprochen, nie von einem Controller, einer Box oder einem Modem."
