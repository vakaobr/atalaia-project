    l5:
      title: Dienste des Feld-Controllers
      text: >-
        APIs für REST, WebSocket und MQTT, GM-Konsole, Anzeigetafel. Beitritt: NFC-Karten für Boxen,
        QR-Codes für Reserve-Controller und (Phase 3) Handys.
    l4:
      title: "Spiel: gemeinsamer Kern, Lua-Modi"
      text: >-
        Derselbe C-Kern und dieselben Lua-Modi auf jedem Gerät, das spielt: Zonenregeln auf den
        Boxen, Feldregeln auf dem Controller.
    l3:
      title: Nachrichten
      text: >-
        HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG und CLAIM, kompakt als CBOR verpackt. Per WLAN
        reisen dieselben Events als JSON.
