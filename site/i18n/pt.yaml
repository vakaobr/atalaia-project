# Portuguese (pt-PT) text of the project pages, the default language (site/:
# the main page, modos/, radio/, roadmap/ and glossario/). Every key the
# Portuguese pages use in the templates site/src/*.html and
# site/src/partials/*.html must be here, and they must use every key here;
# apart from the parts only one language shows, en.yaml has the same keys. A
# key can be used on several pages. Values are HTML; keys the templates mark
# |text are plain text. After editing, run python3 tools/build_site.py.
# See site/README.md for the terms this translation uses.
#
# Links like href="{{ page.to.glossary }}#glossario-lora" point at the glossary
# entries at the end of this file, on the glossary page; {{ page.to.<page> }}
# becomes the relative link to that page from whichever page shows the text.
# The ids (glossary.*.id) are stable: change them only together with every
# link to them.

# Each page's title, description and (optionally) social preview description,
# under its name in the page table of tools/build_site.py. og_image_alt is the
# same on every page, as they all share the language's preview image.
meta:
  index:
    title: Atalaia · a plataforma aberta de combate simulado
    description: >-
      A Atalaia é uma plataforma aberta para dispositivos de jogo de airsoft, paintball e milsim que
      funciona sem internet: dispositivos ESP32, Raspberry Pi, Arduino e Android, modos de jogo em
      scripts Lua e um protocolo LoRa aberto.
    og_description: >-
      Dispositivos de jogo abertos para airsoft, paintball e milsim, que funcionam sem internet. Os
      modos de jogo são scripts; serve qualquer hardware.
  modes:
    title: Modos de jogo · Atalaia
    description: >-
      Os modos de jogo da Atalaia para airsoft, paintball e milsim: Domínio, Bomba / Rush, Domínio
      Total, Último Elemento, Baixa Confirmada, Reentradas e Vidas, Registo de Presença, o
      modificador Códigos e as Ligaduras, cada um num pequeno script Lua.
  radio:
    title: Como funciona o rádio · Atalaia
    description: >-
      O que o rádio LoRa consegue e não consegue fazer num campo de airsoft ou paintball, que canal
      a Atalaia usa e porquê, e como o seu protocolo Skirmesh-RF corre em todos os aparelhos.
  roadmap:
    title: Roadmap · Atalaia
    description: >-
      As seis fases da Atalaia, do núcleo partilhado à comunidade, cada uma fechada por um teste a
      sério no campo, e em que ponto está cada uma.
  glossary:
    title: Glossário · Atalaia
    description: >-
      Os termos técnicos do projeto Atalaia, do LoRa e do ESP32 ao copyleft, explicados em
      linguagem simples para quem joga, quem tem um campo e a organização.
  og_image_alt: >-
    Uma torre de vigia num monte ao anoitecer, com uma caixa de rádio no topo, ligada a caixas
    luminosas «GAME PROP» espalhadas por um vale arborizado, sob as palavras «Projeto de código
    aberto ATALAIA».

