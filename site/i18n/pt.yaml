hero:
  status: Pré-alfa · fase 0 quase concluída · ainda não está pronta para o campo
  title: A plataforma aberta de <span class="nowrap">combate simulado</span>
  lead: >-
    A Atalaia é uma plataforma aberta para os dispositivos eletrónicos de jogo (os props) de
    airsoft, paintball e milsim, que funciona no próprio campo, sem depender da internet. Monta
    uma caixa de domínio com um microcontrolador de 20&nbsp;€, transforma um telemóvel Android
    antigo num terminal de hacking, organiza um milsim de fim de semana com 20 caixas numa rede
    mesh LoRa e escreve os teus próprios modos de jogo em pequenos scripts. Não precisa de nuvem
    e não te prende a nenhum fabricante.
  discuss: Junta-te à conversa
  design: Lê a especificação
  source: Código no GitHub
  name: >-
    <em>Atalaia</em>: torre de vigia no alto de um monte, de onde se via o perigo a chegar e se
    passava o aviso.
  why_name: Porquê este nome?
  # The isometric image: the night scene has English text painted in, so it stays on the English page.
  image_alt: >-
    Ilustração isométrica: uma pequena torre de pedra com uma caixa de rádio no topo, ao centro de
    uma base quadrada, rodeada por oito malas cor de laranja e amarelas com antena e a inscrição
    «GAME PROP», todas ligadas por um círculo luminoso.

why:
  title: Porquê a Atalaia
  intro: >-
    Os dispositivos eletrónicos dão outra vida a um jogo, mas os sistemas comerciais guardam as
    regras num firmware fechado. Os modos novos ficam à espera do fabricante, não há API pública e
    não dá para juntar hardware próprio. A Atalaia faz diferente.
  local:
    title: Funciona sem internet
    text: >-
      Todos os jogos correm totalmente offline, numa casa ou numa mata com vários quilómetros. A
      internet é opcional.
  hardware:
    title: Qualquer hardware
    text: >-
      Placas ESP32, Raspberry Pi, placas tipo Arduino e telemóveis Android, novos ou reaproveitados,
      entram todos no mesmo jogo.
  scripts:
    title: Modos em scripts
    text: >-
      Os modos de jogo são pequenos scripts Lua com um ficheiro de definições. Muda-os ou
      partilha-os sem gravar firmware de novo.
  open:
    title: Protocolo e API abertos
    text: >-
      Os dispositivos falam entre si pelo protocolo Skirmesh-RF, que está documentado; o
      controlador de campo vai disponibilizar APIs MQTT, REST e WebSocket.
  fields:
    title: Feita para os campos
    text: >-
      Funções de jogador, esquadras, cenários personalizados e um registo de cronografagem com
      verificações aleatórias estão previstos de raiz.
  copyleft:
    title: Copyleft
    text: >-
      Campos que cobram entrada e makers que vendem caixas são bem-vindos. Quem distribuir ou
      alojar uma versão alterada tem de partilhar as alterações.

how:
  title: Como tudo se liga
  intro: >-
    Todos os nós completos correm o mesmo núcleo em C11 e os mesmos modos de jogo em Lua; só mudam
    a camada de cada plataforma e os drivers do hardware.
  diagram:
    title: >-
      Um servidor do clube, opcional, liga-se pela internet ao controlador de campo. As apps da
      organização e dos jogadores chegam ao controlador por Wi-Fi, os marcadores e outras
      ferramentas por MQTT e REST, e os dispositivos pela rede mesh LoRa Skirmesh-RF.
    server: Servidor do clube (opcional)
    server_sub: contas · histórico · app de jogador
    apps: Apps da organização
    apps_sub: e dos jogadores · Wi-Fi
    controller: Controlador de campo
    controller_sub: Raspberry Pi ou Android
    tools: Marcadores, ATAK
    tools_sub: MQTT, REST, webhooks
    mesh: Skirmesh-RF · rede mesh LoRa
    satellite: Satélite
    android: Dispositivo Android
    android_sub: com módulo ESP32
    thin: Nó simples
    thin_sub: tipo Arduino
  list:
    server: >-
      <strong>Servidor do clube</strong> (opcional): contas, histórico e a app de jogador, pela
      internet.
    controller: >-
      <strong>Controlador de campo</strong> num Raspberry Pi ou Android: as apps da organização e
      dos jogadores ligam-se por Wi-Fi; os marcadores e o ATAK usam MQTT, REST e webhooks.
    props: >-
      <strong>Dispositivos</strong> na rede mesh LoRa Skirmesh-RF: Field Boxes e satélites ESP32,
      dispositivos Android com módulo ESP32 e nós simples tipo Arduino.

modes:
  title: Modos de jogo
  intro: >-
    Os modos reagem à intenção («uma equipa está a capturar este dispositivo») e não ao hardware,
    por isso o mesmo script corre numa caixa com dois botões arcade, numa caixa com teclado ou num
    tablet. Há dois clássicos já escritos e testados.
  domination:
    title: Domínio
    text: >-
      Uma equipa mantém premido o botão do dispositivo durante uns segundos para o capturar e
      pontua a cada intervalo enquanto o tiver. A outra equipa pode roubá-lo a qualquer momento.
    meta: Manter premido para capturar · pontos a cada intervalo · as zonas que quiseres
  bomb:
    title: Bomba / Rush
    text: >-
      Os atacantes mantêm premido para armar a bomba e depois defendem-na. Os defensores têm de
      aguentar o tempo suficiente para a desarmar antes que a contagem chegue ao fim. A duração da
      contagem e os tempos de pressão são configuráveis.
    meta: Armar · defender · desarmar ou rebentar
  yours:
    title: O teu modo
    text: >-
      Contadores de respawn, terminais de hacking, escolta de VIP, zonas mestre e satélites… Os
      modos são pequenos scripts. Propõe o teu com o modelo de ideia de modo de jogo.
    link: Partilha uma ideia de modo de jogo

try:
  title: Experimenta já
  intro: >-
    Ainda não há firmware para gravar, mas o núcleo partilhado já corre num computador. O simulador
    joga um modo no browser: mantém premidos os botões das equipas, vê o ecrã de cada dispositivo e
    acompanha o registo de eventos.
  compiler: Com um compilador de C
  docker: Só com Docker
  then: >-
    Depois abre <code>http://localhost:8000</code>. Precisas de Python 3.10 ou mais recente, com
    PyYAML. O <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">guia
    do simulador</a> (em inglês) explica todas as opções.

roadmap:
  title: Roteiro
  intro: Seis fases. Cada uma acaba com um teste a sério no campo antes de a seguinte começar.
  now: Agora
  next: A seguir
  p0:
    title: Alicerces
    text: Núcleo partilhado, sandbox Lua, codec Skirmesh-RF, simulador no browser.
    gate: >-
      Prova: o simulador corre o Domínio e a Bomba a partir de scripts Lua. <strong>Superada.</strong>
  p1:
    title: Uma caixa
    text: Montagem da Field Box, firmware ESP32, predefinições na própria caixa.
    gate: "Prova: uma caixa aguenta um jogo de clube de 2 horas sem reiniciar."
  p2:
    title: Rede de campo
    text: Skirmesh-RF sobre LoRa, controlador de campo, API, consola da organização.
    gate: "Prova: 5 caixas num espaço de CQB e num campo exterior, sem uma única captura perdida."
  p3:
    title: Android e jogadores
    text: >-
      Dispositivos Android, módulo de E/S, app de jogador com funções, cronografagem à entrada.
    gate: "Prova: um jogo mistura dispositivos ESP32 e Android sem problemas."
  p4:
    title: Servidor do clube e jogo avançado
    text: Servidor do clube, cenários personalizados, modos avançados, ATAK.
    gate: "Prova: um milsim de fim de semana decorre do princípio ao fim com a Atalaia."
  p5:
    title: Comunidade
    text: Editor visual de modos, registo de modos, placa de suporte (PCB), traduções.
    gate: Continua depois da primeira versão.

