hero:
  status: >-
    Pré-alfa · software das fases 1 e 2 pronto; placas a sério já jogam jogos inteiros com o controlador de campo na bancada, com teclado; fase 3 pronta em software, a app iOS verificada num iPhone; o servidor do site da fase 4 a correr num servidor de testes; fase 5 feita em software · ainda não pronta para o campo
  title: A plataforma aberta de <span class="nowrap">combate simulado</span>
  lead: >-
    A Atalaia é uma plataforma aberta para os dispositivos eletrónicos de jogo (os props) de
    airsoft, paintball e milsim: as caixas que as equipas capturam, as bombas que armam e
    desarmam. Monta uma caixa de domínio com um
    <a href="{{ page.to.glossary }}#glossario-microcontrolador">microcontrolador</a> de 20&nbsp;€ (uma pequena placa de
    computador, barata), transforma um telemóvel Android antigo num terminal de hacking, organiza
    um milsim de fim de semana com 20 caixas numa <a href="{{ page.to.glossary }}#glossario-lora">rede mesh LoRa</a>
    (rádio de longo alcance e baixo consumo, em que as caixas passam as mensagens umas às outras
    de um lado ao outro do campo) e escreve os teus próprios modos de jogo em pequenos scripts.
    Tudo corre no próprio campo: não precisa de nuvem nem de internet, e não te prende a nenhum
    fabricante.
  discuss: Junta-te à conversa
  design: Lê a especificação
  source: Código no GitHub
  name: >-
    <em>Atalaia</em>: torre de vigia no alto de um monte, de onde se via o perigo a chegar e se
    passava o aviso.
  why_name: Porquê este nome?
  image_alt: >-
    Ilustração: ao anoitecer, uma torre de vigia de pedra no alto de um monte tem uma caixa de rádio
    no topo, cujos sinais chegam a caixas luminosas «GAME PROP» espalhadas pelo vale, onde um grupo
    de jogadores caminha por um trilho. À esquerda, o título «Projeto de código aberto ATALAIA».

game:
  title: Como funciona um jogo
  intro: >-
    Para jogar não é preciso perceber nada de eletrónica. É assim que um jogo vai correr quando as
    caixas estiverem construídas (fases 1 e 2); o <a href="{{ page.to.glossary }}#glossario-simulador">simulador</a> já
    hoje joga os mesmos modos num computador.
  setup:
    title: Preparar
    text: >-
      A organização espalha as caixas pelo campo e escolhe um modo de jogo, como o Domínio, no
      teclado de uma caixa ou num telemóvel, em menos de um minuto.
  capture:
    title: Capturar
    text: >-
      Para tomar uma caixa, a equipa mantém premido o botão da sua cor durante uns segundos. A
      caixa acende-se com essa cor e pontua para a equipa até a outra a roubar.
  relay:
    title: Transmitir
    text: >-
      Cada caixa avisa por rádio o
      <a href="{{ page.to.glossary }}#glossario-controlador-de-campo">controlador de campo</a>, um pequeno computador na
      base; as caixas mais afastadas passam a mensagem pelas que estão no meio. Uma caixa que perca
      a ligação continua a jogar e põe-se em dia mais tarde.
  score:
    title: Pontuar
    text: >-
      O controlador faz as contas. A organização acompanha o jogo ao vivo no telemóvel, e o campo
      pode mostrar o marcador num ecrã grande ou numa transmissão em direto.

why:
  title: Porquê a Atalaia
  intro: >-
    Os dispositivos eletrónicos dão outra vida a um jogo, mas os sistemas comerciais guardam as
    regras num <a href="{{ page.to.glossary }}#glossario-firmware">firmware</a> fechado. Os modos novos ficam à espera do
    fabricante, não há <a href="{{ page.to.glossary }}#glossario-api">API</a> pública e não dá para juntar hardware
    próprio. A Atalaia faz diferente.
  local:
    title: Funciona sem internet
    text: >-
      Todos os jogos correm <a href="{{ page.to.glossary }}#glossario-sem-internet">no próprio campo</a>, totalmente
      offline, numa casa ou numa mata com vários quilómetros. A internet é opcional.
  hardware:
    title: Qualquer hardware
    text: >-
      Placas <a href="{{ page.to.glossary }}#glossario-esp32">ESP32</a> baratas, computadores
      <a href="{{ page.to.glossary }}#glossario-raspberry-pi">Raspberry Pi</a> do tamanho de um cartão de crédito, placas
      simples <a href="{{ page.to.glossary }}#glossario-arduino">tipo Arduino</a> e
      <a href="{{ page.to.glossary }}#glossario-dispositivo-android">telemóveis Android</a>, novos ou reaproveitados,
      têm todos lugar no mesmo jogo. O software das caixas ESP32, do controlador de campo e dos
      telemóveis Android já está escrito; as placas tipo Arduino chegam mais tarde.
  scripts:
    title: Modos em scripts
    text: >-
      Os modos de jogo são pequenos <a href="{{ page.to.glossary }}#glossario-lua">scripts Lua</a>, ficheiros de texto com
      as regras, mais um ficheiro de definições: fáceis de ler, mudar e partilhar, e nenhum modo
      precisa de código próprio no software que vem dentro das caixas. Por agora as caixas trazem
      os modos já incluídos; enviar um modo novo sem voltar a gravar esse software ainda está por
      fazer.
  open:
    title: Protocolo e API abertos
    text: >-
      Os dispositivos falam entre si pelo <a href="{{ page.to.glossary }}#glossario-skirmesh-rf">Skirmesh-RF</a>, um
      protocolo de rádio documentado, por isso qualquer pessoa pode construir um aparelho que entre
      no jogo. O controlador de campo disponibiliza APIs MQTT, REST e WebSocket para marcadores,
      transmissões em direto e outras ferramentas.
  fields:
    title: Feita para os campos
    text: >-
      Funções de jogador, squads, check-in no campo com um cartaz impresso e um registo de
      <a href="{{ page.to.glossary }}#glossario-cronografagem">cronografagem</a> que guarda as medições assinadas de cada
      réplica para verificações aleatórias já estão feitos em software; os cenários personalizados
      chegam na fase&nbsp;4.
  copyleft:
    title: Copyleft
    text: >-
      Campos que cobram entrada e makers que vendem caixas são bem-vindos. Quem distribuir ou
      alojar uma versão alterada tem de <a href="{{ page.to.glossary }}#glossario-copyleft">partilhar as alterações</a>.

how:
  title: Como tudo se liga
  intro: >-
    Em poucas palavras: os dispositivos no campo falam por rádio com o controlador de campo, um
    pequeno computador na base que corre o jogo e guarda a pontuação. Os telemóveis ligam-se a ele
    por Wi-Fi, e os marcadores, as transmissões em direto e as apps de mapas, como o
    <a href="{{ page.to.glossary }}#glossario-atak">ATAK</a>, pela sua API. Um
    <a href="{{ page.to.glossary }}#glossario-servidor-do-site">servidor do site</a>, opcional e na internet, guarda as
    contas e o histórico. O controlador, a sua API e a consola da organização já estão feitos e
    testados num computador, ainda não no campo; do servidor do site só existem, por agora, o
    esqueleto e as contas (entrada com códigos de dois fatores e funções por campo; ainda sem dados
    de jogos).
  core: >-
    Por dentro, todos os aparelhos que correm modos de jogo usam o mesmo
    <a href="{{ page.to.glossary }}#glossario-nucleo">núcleo partilhado</a>, escrito em C11, e os mesmos modos em Lua; só
    muda uma camada fina para cada tipo de hardware. Um modo escrito uma vez joga-se da mesma
    maneira numa caixa, num telemóvel ou num Raspberry Pi.
  diagram:
    title: >-
      Um servidor do site, opcional, liga-se pela internet ao controlador de campo. As apps da
      organização e dos jogadores chegam ao controlador por Wi-Fi, os marcadores e outras
      ferramentas por MQTT e REST, e os dispositivos pela rede mesh LoRa Skirmesh-RF.
    server: Servidor do site (opcional)
    server_sub: contas · histórico · app de jogador
    apps: Apps da organização
    apps_sub: e dos jogadores · Wi-Fi
    controller: Controlador de campo
    controller_sub: Raspberry Pi ou Android
    tools: Marcadores, ATAK
    tools_sub: MQTT, REST, webhooks
    mesh: Skirmesh-RF · rede mesh LoRa
    satellite: Satélite
    android: Dispositivo Android
    android_sub: com módulo ESP32
    thin: Nó simples
    thin_sub: tipo Arduino
  list:
    server: >-
      <strong>Servidor do site</strong> (opcional): contas, histórico e a app de jogador, pela
      internet.
    controller: >-
      <strong>Controlador de campo</strong> num Raspberry Pi ou Android: as apps da organização e
      dos jogadores ligam-se por Wi-Fi; os marcadores e o ATAK usam MQTT, REST e webhooks.
    props: >-
      <strong>Dispositivos</strong> na rede mesh LoRa Skirmesh-RF:
      <a href="{{ page.to.glossary }}#glossario-field-box">Field Boxes e satélites</a> ESP32, dispositivos Android com
      módulo ESP32 e nós simples tipo Arduino.

radio:
  title: Como funciona o rádio
  intro: >-
    Os dispositivos falam por <a href="{{ page.to.glossary }}#glossario-lora">LoRa</a>, um rádio de longo alcance e
    baixo consumo, no protocolo próprio da Atalaia, o
    <a href="{{ page.to.glossary }}#glossario-skirmesh-rf">Skirmesh-RF</a>. Estes dois diagramas mostram o que o LoRa
    consegue e não consegue fazer num campo, e como um só protocolo corre em aparelhos muito
    diferentes. Nada disto passou ainda por um campo a sério: o alcance e os tempos vão ser
    medidos no teste de campo da fase&nbsp;2.
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    Os dispositivos falam por <a href="{{ page.to.glossary }}#glossario-lora">LoRa</a>, um rádio
    de longo alcance e baixo consumo, no protocolo próprio da Atalaia, o
    <a href="{{ page.to.glossary }}#glossario-skirmesh-rf">Skirmesh-RF</a>. Dois diagramas mostram
    o que o LoRa consegue e não consegue fazer num campo, e como um só protocolo corre em
    aparelhos muito diferentes. Nada disto passou ainda por um campo a sério.
  more: Como funciona o rádio, em dois diagramas →
  # O texto alternativo de cada diagrama é a sua descrição, diagrams.*.desc, também usada no SVG.
  lora:
    title: O que o LoRa consegue fazer
    lead: >-
      O LoRa troca rapidez por alcance: leva mensagens curtas de um lado ao outro do campo com
      muito pouca bateria, e o sinal atravessa paredes e árvores melhor do que o Wi-Fi, embora
      betão, metal e montes ainda o travem. Uma caixa que não chega ao controlador é ouvida
      através das outras caixas, e as regras europeias limitam quanto tempo cada aparelho pode
      emitir.
  skirmesh:
    title: Um protocolo em todos os aparelhos
    lead: >-
      O Skirmesh-RF está organizado em camadas, do rádio até à API do controlador. Uma Field Box
      corre tudo até aos modos de jogo; um controlador num Raspberry Pi deixa o trabalho do rádio a
      um modem de rádio USB; na fase&nbsp;3, um telemóvel Android faz o mesmo com um módulo de
      E/S. Os telemóveis no Wi-Fi do campo não precisam de rádio LoRa.
  channel:
    title: Que canal, e porquê 869,525&nbsp;MHz
    lead: >-
      Todo o tráfego de um jogo partilha um canal. O canal por omissão, 869,525&nbsp;MHz, é o
      centro de 869,4–869,65&nbsp;MHz, a única parte da banda europeia de 868&nbsp;MHz onde um
      aparelho pode emitir até 10% do tempo com até 500&nbsp;mW. No resto de 868–870&nbsp;MHz as
      regras permitem 1% do tempo (0,1% em 868,7–869,2&nbsp;MHz) a 25&nbsp;mW: cerca de um décimo
      do tempo de emissão e muito menos alcance. 868,1, 868,3 e 868,5&nbsp;MHz são os canais por
      omissão do LoRaWAN e estão muitas vezes ocupados. O canal por omissão também é partilhado:
      as gateways LoRaWAN enviam parte das respostas em 869,525&nbsp;MHz e a predefinição europeia
      do Meshtastic usa-o. Perto destas utilizações, a organização pode pôr o controlador a escutar
      todos os canais permitidos durante um minuto e escolher o mais calmo, tirar um à sorte ou
      escolher à mão. As caixas seguem depois os limites do canal escolhido.
  region:
    title: "Regiões de rádio: Europa e Taiwan"
    lead: >-
      Um campo está numa região de rádio, escolhida uma vez na consola da organização. Na Europa
      (EU868) as caixas usam os canais acima. Em Taiwan (AS923, 920–925&nbsp;MHz), as regras da NCC
      (LP0002) só dão potência total a um canal único, sem saltos de frequência, se tiver pelo menos
      500&nbsp;kHz de largura; por isso, aí as caixas usam LoRa a 500&nbsp;kHz (SF9, com mais ou
      menos o mesmo alcance que na Europa), no máximo 0,5&nbsp;W na antena e 921,5&nbsp;MHz por
      omissão, longe dos canais que o LoRaWAN e o Meshtastic usam. Cada caixa, modem de rádio USB e
      módulo de E/S é feito para uma região e recusa os canais das outras, por isso uma caixa nunca
      emite fora da sua banda; as caixas ficam a saber a região do campo com cada jogo. A região de
      Taiwan não está certificada: um produto vendido em Taiwan precisa da homologação da NCC e de
      uma antena feita para 920&nbsp;MHz. Nada disto foi ainda testado no ar.

modes:
  title: Modos de jogo
  intro: >-
    Os modos reagem à intenção («uma equipa está a capturar este dispositivo») e não ao hardware,
    por isso o mesmo script corre numa Field Box, numa caixa com teclado ou num telemóvel Android.
    Há catorze modos, um modificador e as Ligaduras já escritos e testados em software; ainda nenhum
    correu num campo a sério.
  # The main page shows three modes, then this link to the modes page.
  more: Ver os 14 modos →
  # At the end of the modes page.
  try: Experimenta já um modo no browser →
  domination:
    title: Domínio
    text: >-
      Uma equipa mantém premido o botão do dispositivo durante uns segundos para o capturar e
      pontua a cada intervalo enquanto o tiver. A outra equipa pode roubá-lo a qualquer momento.
    meta: Botões de equipa · uma caixa ou várias
  bomb:
    title: Bomba / Rush
    text: >-
      Os atacantes armam a bomba e depois defendem-na; os defensores têm de a desarmar antes do fim
      da contagem. Uma explosão termina o jogo e os atacantes ganham. Arma-se e desarma-se a manter
      um botão premido, ou com um código de teclado para cada equipa.
    meta: Botões de equipa ou teclado · tempos configuráveis
  sabotage:
    title: "Sabotagem"
    text: "A Bomba em rondas, até acabar o tempo de jogo. Os atacantes armam a bomba, os defensores desarmam-na. Uma explosão é um ponto para os atacantes, um desarme um ponto para os defensores; depois a caixa descansa e começa a ronda seguinte. Vence a equipa com mais pontos."
    meta: "Botões de equipa ou teclado · tempos de rastilho, de premir, de pausa e de jogo configuráveis"
  holdall:
    title: Domínio Total
    text: >-
      As equipas capturam caixas como no Domínio, mas uma equipa só pontua enquanto tiver todas as
      caixas ao mesmo tempo. Se perder uma, deixa de pontuar.
    meta: Várias caixas · precisa do controlador de campo
  laststand:
    title: Último Elemento
    text: >-
      Os defensores começam com todas as zonas. Quando ficam reduzidos à última, corre uma contagem
      para a derrota até reconquistarem outra; se chegar ao fim, ganham os atacantes.
    meta: Várias caixas · precisa do controlador de campo
  kill_confirmed:
    title: Baixa Confirmada
    text: >-
      Cada participante leva uma etiqueta NFC assinada. Uma equipa lê numa estação as etiquetas que
      recolheu: a de alguém da equipa adversária confirma a baixa, a de alguém da própria equipa
      nega-a. Etiquetas falsificadas são recusadas.
    meta: Leitor NFC · etiquetas dos participantes
  respawn:
    title: Reentradas e Vidas
    text: >-
      Um ponto de reentrada conta as vidas de cada equipa ou de cada pessoa, com um tempo de espera
      entre reentradas. Quando uma equipa fica sem vidas, é eliminada.
    meta: Leitor NFC ou botões de equipa
  player_checkin:
    title: Registo de Presença
    text: >-
      Cada participante regista-se num ponto de controlo com a sua etiqueta. A caixa conta as
      pessoas de cada equipa e pode dar pontos por cada registo.
    meta: Leitor NFC · etiquetas dos participantes
  medic:
    title: Ligaduras
    text: >-
      Ao lado de qualquer modo: a pessoa atingida lê a sua etiqueta e mantém premido um botão
      durante o tempo definido para receber o tratamento. O kit mostra quantas ligaduras restam;
      cada pessoa tem um número limitado de tratamentos por jogo, em todos os kits, a organização
      repõe um kit a partir da consola, e cada tratamento aparece no registo da organização e no
      ecrã de quem joga.
    meta: Leitor NFC e um botão · etiquetas dos participantes · precisa do controlador de campo
  master_satellites:
    title: Mestre e Satélites
    text: >-
      As equipas capturam uma caixa mestre e os seus satélites. Só a mestre pontua, e cada satélite
      que a mesma equipa tiver aumenta os seus pontos; quando a mestre muda de mãos, todos os
      satélites voltam a ficar neutros. Escrito e testado em software, ainda não jogado em caixas
      reais.
    meta: Várias caixas · precisa do controlador de campo
  target_windows:
    title: Janelas de Alvo
    text: >-
      Um alvo acende-se na cor de uma equipa ao acaso durante alguns segundos, e um tiro que lhe
      acerte enquanto está aceso pontua para essa equipa. O jogo está escrito e testado em software;
      o módulo de alvo de que precisa (uma placa com um sensor de impacto e um anel de luz) ainda
      não está feito.
    meta: Uma caixa com o módulo de alvo · ainda não disponível
  hacking_terminal:
    title: Hackeia o terminal
    text: >-
      Um terminal propõe um enigma no teclado: descobrir um código pelos algarismos que estão no
      sítio certo, cortar os fios pela ordem certa, ou repetir uma sequência. Uma resposta errada
      bloqueia-o durante algum tempo. Resolvê-lo pode revelar um código para outro objetivo, dar
      pontos e capturar o terminal até outra equipa o voltar a hackear. Escrito e testado em
      software, ainda não jogado num telemóvel no campo.
    meta: Uma caixa ou um telemóvel com teclado · funciona sem o controlador de campo
  vip_payload:
    title: VIP / Carga
    text: >-
      Uma equipa escolta o seu VIP, quem partilha a posição na app, ou uma carga, um telemóvel com
      GPS, até uma zona de extração; as outras tentam impedi-lo. Os pontos de controlo pelo caminho
      dão pontos enquanto uma equipa os tiver. As posições ficam no controlador de campo e no
      telemóvel; só sai o «extraído». Escrito e testado em software, ainda não jogado com GPS a sério.
    meta: Caixas de ponto de controlo, um telemóvel com GPS ou o telemóvel do VIP · precisa do controlador de campo
  money_factory:
    title: Fábrica de Dinheiro
    text: >-
      As equipas capturam caixas-fábrica, que fazem dinheiro enquanto as tiverem. Quem joga
      recolhe-o lendo a sua etiqueta na fábrica da sua equipa, leva-o pelo campo e deposita-o numa
      caixa-banco, onde vale pontos; o controlador de campo guarda o que cada pessoa leva, por isso
      o dinheiro pode ser recolhido numa caixa e depositado noutra. Quem recebe tratamento num kit
      de ligaduras perde o que leva, e a primeira equipa a depositar o objetivo pode ganhar. Escrito
      e testado em software, ainda não jogado em caixas a sério.
    meta: Caixas ou telemóveis com NFC como fábricas e bancos · etiquetas de quem joga · precisa do controlador de campo
  progressive_domination:
    title: Domínio Progressivo
    text: >-
      Várias caixas, mas só uma pode ser capturada de cada vez, e as duas equipas sabem qual. A
      equipa que tem a caixa ativa pontua por cada minuto completo; quando a tiver mantido o tempo
      necessário, a caixa fica completa para essa equipa e bloqueada, e a caixa seguinte da ordem é
      anunciada às duas equipas. A ordem é a lista da organização, o número das caixas ou aleatória;
      o jogo acaba quando a última caixa estiver completa, ou quando uma equipa chega à pontuação
      alvo. Escrito e testado em software, ainda não jogado em caixas a sério.
    meta: Caixas com botões de equipa · precisa do controlador de campo
  codes:
    title: Códigos (modificador)
    text: >-
      Corre ao lado de qualquer modo na mesma caixa: códigos no teclado dão pontos, pistas ou
      desbloqueios, e a organização vê quem usou cada código e que equipa tinha a caixa.
    meta: Teclado · funciona com qualquer modo
  yours:
    title: O teu modo
    text: >-
      Capturar a bandeira, o modo do teu clube… Os
      modos são pequenos scripts. Propõe o teu com o modelo de ideia de modo de jogo ou partilha um
      modo acabado, como pacote assinado, no <a href="https://vakaobr.github.io/atalaia-modes/">registo de modos</a>.
    link: Partilha uma ideia de modo de jogo

# The animated pictures of the modes page (tools/gen_mode_gifs.py, tools/mode_gifs.yaml):
# each picture's alt text (what happens in it, in order) and the caption under it.
gifs:
  intro: >-
    Cada animação abaixo é desenhada pelo código do próprio firmware da caixa de campo, não é
    uma maquete: o ecrã grande em cima e o pequeno OLED em baixo, à medida que um jogo do modo
    avança. O botão por baixo de uma imagem pára-a.
  play: Reproduzir animação
  pause: Pausar animação
  domination:
    alt: >-
      Animação de uma caixa de campo a jogar Domínio. O ecrã mostra a zona livre; a equipa
      vermelha prime o botão, a barra do ecrã pequeno enche e a zona fica vermelha, com os
      pontos a subir. Depois a equipa azul prime o botão e rouba a zona, e o jogo acaba com a
      pontuação final.
    caption: >-
      Domínio numa caixa de campo: uma equipa mantém o botão premido para capturar a zona, os
      pontos sobem enquanto a tiver e a outra equipa pode roubá-la.
  bomb:
    alt: >-
      Animação de uma caixa de campo a jogar Bomba. O ecrã mostra a bomba pronta; a equipa
      vermelha prime o botão para a armar, a contagem começa em 4:59, a equipa azul prime o
      botão para a desarmar, a barra enche e o ecrã fica azul a indicar que a bomba foi
      desarmada.
    caption: >-
      Bomba / Rush: armar a manter um botão premido, a contagem a correr e os defensores a
      desarmar a tempo.
  sabotage:
    alt: "Animação de uma caixa de campo a jogar Sabotagem. O ecrã mostra a bomba pronta com o resultado 0 : 0; a equipa vermelha prime o botão, a barra enche e a bomba fica armada; explode e o ecrã fica vermelho, um ponto para o vermelho. Uma pausa mostra 1 : 0 e o tempo até à ronda seguinte, depois a equipa azul prime o botão para desarmar a segunda bomba e o ecrã fica azul, um ponto para o azul; o ecrã de fim de jogo mostra o vermelho vencedor."
    caption: "Sabotagem: rondas de bomba com marcador, uma explosão para os atacantes, um desarme para os defensores, até acabar o tempo."
  master_satellites:
    alt: >-
      Animação de Mestre e Satélites: uma caixa satélite passa de livre a vermelha quando a
      equipa vermelha prime o botão; depois a caixa mestre mostra quantos satélites a equipa
      vermelha tem (1, 2 e 3 de 3) e os pontos por intervalo, e por fim o ecrã de fim de jogo.
    caption: >-
      Mestre e Satélites: os satélites capturam-se como as zonas do Domínio; a caixa mestre
      conta quantos uma equipa tem e paga mais pontos por cada um.
  hacking_terminal:
    alt: >-
      Animação do terminal de hacking: o puzzle do código com tentativas e pistas (no sítio
      certo e fora do sítio), o puzzle dos fios com fios a serem cortados, o puzzle da sequência
      (uma tecla mostrada e depois "a tua vez") e o ecrã de acesso concedido com o código.
    caption: >-
      Hackeia o terminal: um terminal pode ter um puzzle de código, de fios ou de sequência; a
      equipa que o resolve fica com o terminal e pode revelar um código.
  medic:
    alt: >-
      Animação do kit de ligaduras: o kit mostra 4 tratamentos por dar; um jogador ferido prime
      o botão e a barra da contagem enche; o kit mostra o tratamento feito com 3 por dar; um
      jogador que já usou todos os tratamentos é recusado.
    caption: >-
      Ligaduras: um jogador ferido mantém o botão premido durante o tempo de tratamento; o kit
      conta as cargas e o limite de cada jogador.
  vip_payload:
    alt: >-
      Animação de VIP / Carga: uma caixa de ponto de controlo que ninguém tem, a equipa azul a
      premir o botão e a ficar com ela, e depois o ecrã da carga com os metros até à zona de
      extração a diminuir, um aviso de GPS fraco e a extração concluída.
    caption: >-
      VIP / Carga: os pontos de controlo capturam-se pelo caminho e o ecrã da carga (o de um
      telemóvel) mostra a distância até à extração.
  money_factory:
    alt: >-
      Animação da Fábrica de Dinheiro: uma fábrica livre, a equipa vermelha a premir o botão
      enquanto a barra de captura enche, a fábrica da equipa vermelha com o stock a subir de 5
      para 35 de 50, um jogador a recolher 15 e uma caixa-banco a mostrar um depósito de 15 e os
      totais por equipa.
    caption: >-
      Fábrica de Dinheiro: uma fábrica capturada enche-se de dinheiro, os jogadores recolhem-no
      com a etiqueta e depositam-no numa caixa-banco.
  progressive_domination:
    alt: >-
      Animação de Domínio Progressivo: uma caixa à espera da sua vez (1 de 4 caixas completas);
      a caixa passa a ser a ativa e a equipa azul prime o botão até a capturar; os pontos e os
      minutos de posse da equipa azul sobem enquanto a barra enche; a caixa fica completa para a
      equipa azul e bloqueada; depois a caixa seguinte, que esperava, passa a ser a ativa.
    caption: >-
      Domínio Progressivo: só uma caixa pode ser capturada de cada vez; a equipa que a mantém
      tempo suficiente completa-a e anuncia-se a caixa seguinte da ordem.
  target_windows:
    alt: >-
      Animação de Janelas de Alvo: um alvo à espera da cor de uma equipa, uma janela a abrir
      para a equipa vermelha com contagem de 5 segundos, o alvo a mostrar o acerto da equipa
      vermelha, depois uma janela para a equipa azul e o número de acertos a subir para 2.
    caption: >-
      Janelas de Alvo: um alvo abre uma janela curta para a cor de uma equipa; os acertos dentro
      da janela pontuam.
  codes:
    alt: >-
      Animação do modificador Códigos com a Bomba: o ecrã pede o código da equipa, quatro
      dígitos aparecem como pontos, a contagem corre e escreve-se um código de desarme antes de
      o ecrã mostrar a bomba desarmada.
    caption: >-
      Códigos: a Bomba com códigos de equipa escritos em vez de botões premidos: a caixa com
      teclado pede um código para armar e outro para desarmar. As mensagens que o script do modo
      escreve ficam em inglês.
  kill_confirmed:
    alt: >-
      Animação de Baixa Confirmada: a estação espera etiquetas; a etiqueta de um jogador da
      equipa vermelha é aceite, uma janela de 14 segundos conta decrescente e aparece a mensagem
      "Kill confirmed: b1"; depois uma etiqueta falsificada é recusada.
    caption: >-
      Baixa Confirmada: ler a etiqueta assinada de um adversário confirma a baixa; uma etiqueta
      falsificada é recusada. As mensagens que o script do modo escreve ficam em inglês.
  respawn:
    alt: >-
      Animação de Reentradas e Vidas: um ponto de reentrada recebe jogadores de volta ao jogo
      enquanto as vidas da equipa passam de 19 para 18 e 17, e por fim mostra a vermelho que a
      equipa ficou sem vidas.
    caption: >-
      Reentradas e Vidas: cada regresso ao jogo custa uma vida à equipa; a zero, a equipa fica
      fora. As mensagens que o script do modo escreve ficam em inglês.
  player_checkin:
    alt: >-
      Animação de Registo de Presença: cada etiqueta lida no ponto de registo acrescenta um
      jogador; o total passa de 1 para 3 e para 5, com a contagem por equipa.
    caption: >-
      Registo de Presença: os jogadores registam-se à partida e a caixa conta os jogadores de
      cada equipa. As mensagens que o script do modo escreve ficam em inglês.

screens:
  title: O que se vê
  intro: >-
    Oito capturas do firmware real da Field Box (ESP32, LVGL 9.2, ecrã de 320&nbsp;×&nbsp;240)
    a correr no emulador <a href="https://wokwi.com">Wokwi</a>. A interface da caixa está em inglês.
    O firmware já corre numa Heltec V4.3 a sério; as capturas são do emulador. Toca ou clica numa
    captura para a ver em grande.
  note: >-
    O <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.pt.md">manual
    de montagem</a> tem o esquema de ligações completo e o guia da primeira gravação do firmware,
    para a Heltec WiFi LoRa 32&nbsp;V4.
  pin_entry:
    alt: >-
      Ecrã da Field Box: cabeçalho «GAME MASTER», pedido «Enter the admin PIN», quatro círculos
      vazios para os dígitos, indicação «# enter * delete».
    caption: A organização introduz o PIN de administrador para desbloquear a configuração.
  choose_game:
    alt: >-
      Ecrã da Field Box: cabeçalho «CHOOSE A GAME» com a lista 1 «Bomb» (destacada a amarelo),
      2 «Domination», 3 «Hold-All Domination», 4 «Last Stand» e 5 «Codes», e a indicação
      «1-9 choose # next * back».
    caption: Escolha do modo de jogo no menu da própria caixa.
  confirm:
    alt: >-
      Ecrã da Field Box: cabeçalho «START THE GAME?» sobre fundo laranja, nome do modo «Bomb»,
      «Timer: 10 min», indicação «# start * back».
    caption: Confirmação do modo e do temporizador antes de arrancar.
  standby:
    alt: >-
      Ecrã da Field Box: cabeçalho «STANDBY», texto «Hold the button to arm», «RED» a vermelho,
      «The bomb is not armed» em baixo.
    caption: À espera que a equipa vermelha mantenha premido o botão de armar.
  armed:
    alt: >-
      Ecrã da Field Box: cabeçalho «ARMED» sobre fundo vermelho, contagem «5:00» em grande,
      legenda «until detonation».
    caption: Bomba armada; a equipa azul tem 5 minutos para a desarmar.
  defused:
    alt: >-
      Ecrã da Field Box: fundo azul, visto branco, «DEFUSED» em grande, «BLUE team wins» abaixo.
    caption: A equipa azul desarmou a bomba a tempo.
  joined:
    alt: >-
      Ecrã da Field Box: cabeçalho «JOINED GAME 4242», etiqueta «Game» à esquerda, «zone, node 7»
      à direita.
    caption: Caixa entrou no jogo de campo via cartão NFC ou consola série.
  code_entry:
    alt: >-
      Ecrã da Field Box: cabeçalho «CODE», dois de quatro círculos preenchidos a amarelo,
      indicação «# enter * delete».
    caption: A escrever um código do modificador Códigos (pontos, pistas ou desbloqueios).

  app_title: A app Android
  app_intro: >-
    Os ecrãs da própria app estão em português, inglês, alemão e chinês tradicional, e ela desenha os ecrãs de cada modo a
    partir dos mesmos ficheiros YAML da Field Box. Estas são as imagens dos testes da app, não
    fotografias de um telemóvel: a app já correu em emuladores Android, mas ainda não num telemóvel
    a sério.
  app_roles:
    alt: >-
      O primeiro ecrã da app, «O que vais fazer neste telemóvel?»: quatro escolhas, cada uma com uma
      linha a dizer o que faz: Dispositivo de jogo, Participante, Marshal e Organização.
    caption: Escolhe o que este telemóvel faz no jogo.
  app_prop:
    alt: >-
      Um telemóvel Android como bomba: o ecrã de contagem do modo («ARMED», «4:47», «until
      detonation») por cima de dois botões grandes, vermelho e azul, para manter premidos.
    caption: Um telemóvel como bomba, com os botões das equipas.
  app_player:
    alt: >-
      A vista de quem joga: o nome do jogo, 20:00 para o fim, os 20 pontos da equipa azul por cima
      dos 12 da vermelha, de quem é cada objetivo e o que aconteceu.
    caption: Quem joga segue o jogo no telemóvel.
  app_branded:
    alt: >-
      A vista de quem joga num campo com a sua própria imagem: o logótipo e o nome do campo, Campo
      Norte, no cabeçalho, a imagem de fundo esbatida por trás, e as equipas Águias e Lobos com os
      seus emblemas e pontos, 20 a 12.
    caption: O logótipo, a imagem de fundo e os emblemas das equipas de um campo.
  app_chrono:
    alt: >-
      O cronógrafo do marshal: o teclado da velocidade, o peso da BB e um «PASSA» verde, com a
      energia mais alta e o limite.
    caption: Cronografagem à entrada, com a medição assinada pelo marshal.
  medic_intro: >-
    As Ligaduras desenham os seus ecrãs a partir dos mesmos ficheiros YAML numa Field Box e num
    dispositivo Android, em português, a não ser que a organização escolha o inglês, o alemão ou o
    chinês. Aqui, tal como a app os desenha:
  medic_idle:
    alt: >-
      Ecrã das Ligaduras: cabeçalho «LIGADURAS», um 4 em grande, «Restam 4 ligaduras» e, a amarelo,
      «Lê a tua etiqueta e mantém premido o botão».
    caption: À espera, com 4 ligaduras disponíveis.
  medic_hold:
    alt: >-
      Ecrã das Ligaduras: o identificador de quem joga, b1, num cabeçalho azul, «Mantém premido para
      tratar», faltam 4 segundos, a amarelo, por cima de uma barra de progresso, e «Largar antes do
      tempo cancela».
    caption: b1 mantém o botão premido para receber o tratamento.
  medic_healed:
    alt: >-
      Ecrã das Ligaduras em fundo azul: uma cruz branca, «DE VOLTA AO JOGO», b1, «Tratamento 1 de 2»
      e «Restam 3 ligaduras».
    caption: De volta ao jogo, com o primeiro de dois tratamentos.
  # O visualizador de capturas (o diálogo no fim da página principal).
  viewer:
    label: Captura de ecrã
    prev: Captura anterior
    next: Captura seguinte
    close: Fechar
try:
  title: Experimenta já
  intro: >-
    Não precisas de hardware: o núcleo partilhado já corre num computador. O simulador joga um modo
    no browser: mantém premidos os botões das equipas, vê o ecrã de cada dispositivo e acompanha o
    registo de eventos. Os comandos abaixo escrevem-se num terminal.
  compiler: Com um compilador de C
  docker: Só com Docker
  then: >-
    Depois abre <code>http://localhost:8000</code>. Precisas de Python 3.10 ou mais recente, com
    PyYAML. O <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">guia
    do simulador</a> (em inglês) explica todas as opções.
  board:
    title: Numa placa
    text: >-
      O <a href="{{ page.to.glossary }}#glossario-firmware">firmware</a> da Field Box, do modem de
      rádio USB e do módulo de E/S já está escrito, e os três correm em testes num computador. O da
      Field Box e o do modem já correm em Heltec V4.3 a sério, na bancada: uma caixa entra nos jogos
      do controlador de campo pelo rádio, através de uma segunda placa como modem, joga-os até ao
      fim e recebe atualizações de firmware pelo ar, com o pequeno ecrã da placa a mostrar o jogo; o
      do módulo ainda não correu numa placa. Para experimentar numa placa sem caixa, há uma versão
      de bancada do firmware (teclas pelo cabo USB). Para montar uma caixa e gravar o firmware,
      segue o
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.pt.md">manual
      de montagem</a> (em inglês); o
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">guia
      do firmware</a> (em inglês) explica também como compilar o do modem e o do módulo.
  app:
    title: Num telemóvel Android
    text: >-
      Compila o APK de testes (debug) da app com o Docker e instala-o num telemóvel com Android 8.0
      ou mais recente, ou no emulador Android, como explica o
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">guia
      da app</a> (em inglês). Já correu em emuladores, mas ainda não num telemóvel a sério.
  manuals:
    title: Jogar e organizar
    text: >-
      Manuais para quem usa a Atalaia, não para quem programa: para
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/README.md">quem joga, a organização, os marshals, quem opera as caixas e quem as monta</a>,
      em português e em inglês, com um início rápido de uma página. Dizem o que o software mostra
      hoje e marcam o que ainda não foi experimentado num campo.

roadmap:
  # "Roadmap" stays in English in Portuguese too, as it is known in Portugal (never "Roteiro").
  title: Roadmap
  intro: >-
    Seis fases, cada uma fechada por um teste a sério no campo: a sua prova. O software vai à frente do hardware: as fases 1 a 3 estão prontas em software (placas a sério já jogam jogos inteiros na bancada e a app para iOS já passou a sua lista de verificação num iPhone); as fases 4 e 5 estão feitas em software. As provas esperam por caixas montadas, testes no campo, um servidor a sério e a chave do registo do projeto.
  more: O roadmap completo, com o que cada fase inclui e a sua prova →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code):
  # "Planeada", as "Desenhada" reads as a drawing in Portugal.
  done: Concluída
  software: Software pronto
  # The parts of each phase on the roadmap page. Each phase: short (one line, also on the main
  # page), done (bullets), next (bullets), gate; a phase with a long done list also has groups
  # (g_*: title and items) that fold into a <details> under the first few bullets.
  part_done: O que está feito
  part_next: A seguir, e o que falta esperar
  part_more: Tudo o resto que está feito, por tema
  status_link: O estado detalhado desta fase, no repositório →
  p0:
    title: Alicerces
    short: >-
      Núcleo partilhado, sandbox Lua, codec Skirmesh-RF e simulador no browser. Prova superada.
    done:
      - Núcleo partilhado, a lógica de jogo que todas as plataformas correm.
      - <a href="{{ page.to.glossary }}#glossario-lua">Sandbox Lua</a>, onde correm os scripts dos modos de jogo.
      - <a href="{{ page.to.glossary }}#glossario-skirmesh-rf">Codec Skirmesh-RF</a>, o formato das mensagens de rádio.
      - Simulador no browser, que corre o Domínio e a Bomba.
    gate: >-
      Prova: o simulador corre o Domínio e a Bomba a partir de scripts Lua. <strong>Superada.</strong>
  p1:
    title: Uma caixa
    short: >-
      Firmware da Field Box e manual de montagem; na bancada, uma placa a sério joga jogos inteiros.
      À espera da primeira caixa montada.
    done:
      - Firmware ESP32 da Field Box, com predefinições na própria caixa, a correr num emulador.
      - O pequeno ecrã da caixa mostra a barra de progresso, os pontos e o tempo de posse, em quatro línguas.
      - Um manual de montagem com esquemas de ligações.
      - "A primeira placa (Heltec V4.3, 20 de outubro de 2026) na bancada: arranca, liga o rádio, lê
        os botões e joga jogos inteiros, a Bomba incluída (armar, desarmar, fim do tempo), no seu
        próprio ecrã pequeno."
      - "A barra do tempo de jogo: enquanto corre um jogo com limite de tempo, uma faixa na base do ecrã pequeno mostra quanto falta, e o ecrã OLED mostra um relógio. Em software, ainda não vista num painel a sério."
      - "A configuração que um cenário envia às caixas é enviada outra vez até cada caixa a confirmar, e a caixa já envia essa confirmação. Só em software e testes no computador, não numa placa a sério."
      - "Mudar de campo, no menu de administração da caixa, passa uma caixa adotada para outro campo, pelo código. Só testes no computador, não numa placa a sério."
      - "A caixa já não mostra o logótipo do campo: mostra a torre da Atalaia no ecrã de arranque, um ficheiro que quem constrói pode substituir ao compilar (as imagens das versões publicadas levam sempre a torre, e a compilação da versão verifica-o). Foi a transferência do logótipo que esgotou a memória da caixa na bancada. Uma caixa que guardou um logótipo antigo apaga-o no primeiro arranque (testes no computador)."
      - "Uma tabela de partições maior: os dois espaços de firmware da caixa têm 4 MB cada (a imagem ocupava 93 % de 2 MB), e as definições e as chaves ficam onde estavam. Só em testes no computador e compilações, sem ter sido gravada numa placa. Uma caixa com a tabela antiga precisa de uma gravação por USB; depois disso, as atualizações pelo ar funcionam como antes."
      - "A Field Box como iBeacon: da entrada num jogo até ao fim, a caixa emite uma baliza Bluetooth (a cada 500 ms, nunca enquanto usa o Wi-Fi), para que um telemóvel perto dela possa colocar quem joga num piso ou numa sala. O identificador do campo deriva da sua chave de adesão, e a organização pode desligar as caixas como balizas, por campo ou por caixa. A memória interna da caixa foi refeita depois de ter acabado na bancada à entrada num jogo (o Wi-Fi falhou e o cão de guarda reiniciou): medido na bancada, ficam livres 241 KB no arranque e 102 KB no mínimo num jogo com a baliza ligada, e o CI falha a compilação se o orçamento encolher demasiado. Ainda não se verificou que um telemóvel ouve a baliza de uma caixa a sério."
      - "Depois de uma recusa ou falha de uma atualização ou da obtenção de um modo, o ecrã da caixa volta ao ecrã do estado passados 8 segundos (na bancada, uma recusa ficou no ecrã até alguém olhar). Só testes no computador."
      - "Os comandos da consola série que dão à caixa a chave de entrada ou lançam uma atualização (@joinkey, @update) pedem o PIN de administração numa versão de lançamento, e recusam enquanto não houver PIN; uma versão de bancada mantém-nos abertos para os scripts da bancada. Só em testes no computador, não numa placa real."
    next:
      - Uma caixa montada que aguente um jogo de clube de 2 horas sem reiniciar.
      - "Ver a barra do tempo num painel a sério."
      - "Experimentar o reenvio da configuração e o Mudar de campo numa placa a sério."
      - "Ouvir a baliza de uma Field Box com um telemóvel a sério, e arrancar o Wi-Fi à entrada num jogo com o novo orçamento de memória."
      - "Gravar a nova tabela de partições numa placa a sério (uma gravação por USB, sem apagar, para uma caixa com a antiga)."
      - "Uma imagem de lançamento endurecida (cifra da memória flash, arranque seguro): está só escrita como plano, nada foi construído nem experimentado numa placa."
    gate: >-
      Prova: uma caixa aguenta um jogo de clube de 2 horas sem reiniciar. <strong>Em aberto</strong>
      até haver uma caixa montada que o consiga.
  p2:
    title: Rede de campo
    short: >-
      Skirmesh-RF sobre LoRa, controlador de campo, API, consola da organização e um pacote de
      modos, testados em software; na bancada, placas a sério jogam jogos inteiros com o controlador
      pelo rádio, e o que a bancada achou está corrigido em software. À espera de 5 caixas montadas
      num campo.
    done:
      - O protocolo de rádio cifrado Skirmesh-RF e o modem de rádio USB.
      - O controlador de campo com a sua API.
      - A consola da organização, com um marcador.
      - A entrada num jogo com um cartão NFC ou um código QR.
      - O firmware das caixas a falar com o controlador.
      - "Um pacote de modos: Domínio Total (só pontua quem tem todas as caixas), Último Elemento
        (uma contagem para a derrota enquanto se tem uma de três zonas), códigos de armar por
        equipa na Bomba e o modificador Códigos (códigos no teclado que dão pontos, pistas ou
        desbloqueios, e a organização sabe quem os usou)."
      - "Tudo testado no simulador, no emulador e num computador, incluindo jogos completos; na
        bancada, placas a sério jogam jogos inteiros com o controlador pelo rádio: convites,
        capturas, emparelhamento por código, atualizações pelo ar, um modo em falta descarregado."
      - "As caixas escutam antes de falar: cada caixa verifica se o canal está livre antes de
        transmitir, e há menos mensagens a colidir. No simulador, um campo de 20 caixas recebe 89 %
        das atualizações em vez de 65 %."
      - "A organização pode definir ou libertar o dono de uma caixa também no Domínio, como nos outros modos."
      - "O controlador pode enviar as suas próprias tramas de rádio uma de cada vez, espaçadas. Está feito e desligado até o teste no campo decidir."
      - "O controlador Pi falha logo uma atualização de firmware quando o rádio recusa a oferta."
      - "Uma caixa já configurada pode voltar à configuração do Wi-Fi, por uma entrada de menu atrás do PIN de administração ou por um comando na consola USB. A página de configuração está em inglês, português, alemão e chinês tradicional, e os telemóveis abrem-na sozinhos."
      - "O separador Jogo da consola mostra um código QR do marcador para quem joga."
      - "Os cenários podem estar em alemão e em chinês tradicional, com os nomes dos objetivos incluídos."
      - "<strong>Sabotagem</strong>, um modo novo: a Bomba em rondas até acabar o tempo de jogo. Os atacantes armam, os defensores desarmam; uma explosão é um ponto para os atacantes, um desarme um ponto para os defensores; depois a caixa descansa e começa a ronda seguinte. Vence a equipa com mais pontos, pontos iguais são empate. No simulador e em testes, e entre as predefinições da Field Box; ainda não numa placa a sério."
      - "O pequeno ecrã do modem de rádio USB fala português, inglês, alemão e chinês tradicional, como o da caixa. Só testes no computador, não numa placa a sério."
      - "Os formulários da consola de GM guardam o que a organização escreveu até haver gravação: quem se regista ou o relógio da consola já não repõem os valores gravados."
      - "Uma mudança do canal do campo já não deixa as caixas livres perdidas: o controlador diz-lhes para onde foi (uma nova mensagem de rádio selada, MOVE, dita três vezes no canal antigo), e o Procurar caixas pode varrer os últimos quatro canais à procura de caixas que a perderam. Encontrado na bancada, onde uma pesquisa de rádio mudou o canal e uma caixa parada deixou de ouvir. Feito nos dois controladores, no simulador e no código da caixa; falta a verificação em duas placas."
      - "Um início, uma pausa ou um retomar chega às caixas em cerca de um segundo, e não em até 30: o controlador repete o estado numa mensagem TIME 1, 2,5, 5 e 10 segundos depois (na bancada, uma caixa soube de um início 21 segundos tarde). Falta a verificação em duas placas. No modelo de tempo de antena, as repetições, o MOVE e uma varredura custam ao controlador cerca de 2 segundos de emissão numa hora típica, na sub-banda predefinida."
      - "A consola de GM diz o que uma mudança de canal faz às caixas livres (quantos dos três MOVE já foram ditos, e depois que o controlador mudou), e as Definições têm um botão Procurar caixas que mostra o resultado de uma varredura. Uma varredura tem um limite por hora nas sub-bandas com menos de 10 % de ciclo de trabalho (5 % do orçamento da sub-banda), e a consola di-lo quando recusa e quando a seguinte é possível. Em software, nos dois controladores."
      - "A pontuação projetada acompanha uma captura: entre duas mensagens STATE de uma caixa, o controlador continua a contar para a equipa que um evento de captura indicou, até ao STATE seguinte da caixa. Na bancada a projeção falhou quando se perdeu um STATE logo a seguir a uma captura; com esta mudança a mesma configuração passou na bancada, e uma penalização da caixa também foi verificada lá."
      - "O fim de jogo de uma caixa termina o jogo: num modo sem lógica de campo no controlador (o limite de tempo do Sabotagem, a Bomba), o primeiro game.end de uma caixa do jogo termina-o, com o vencedor da caixa ou em empate. Na Bomba / Rush uma explosão termina agora o jogo, ganhando a equipa que armou a bomba; um desarme não. Encontrado na bancada com o Sabotagem, e a explosão da Bomba também foi verificada lá."
      - "Um comando de rádio gravado já não pode ser repetido mais tarde: cada recetor (a caixa, o modem USB e os dois controladores) guarda uma janela de repetição por emissor, e uma caixa recusa um início, pausa, retoma, fim ou TIME mais antigo do que o último que aplicou. Uma caixa que perdeu o registo da sua época sorteia uma nova em vez de repetir números únicos. O rádio não muda: caixas mais antigas continuam a funcionar, mas ficam expostas até serem atualizadas. Testado no simulador e em testes no computador, com vetores comuns em C, Python e Dart; nenhuma repetição de rádio foi experimentada em placas reais."
      - "Uma segunda perda do registo de épocas já não pode sortear uma época mais baixa: uma caixa, o Pi e o controlador do telemóvel guardam a época mais alta que alguma vez usaram, à parte do registo por chave, e o sorteio começa acima dela; um controlador que já esteve no ar num jogo nunca é convidado de novo com o seu antigo id de nó (recebe um novo); e um adereço com Wi-Fi passa a receber o CMD que indica a época de um controlador, que entrega à sua placa de E/S (nos dois controladores). RFC 0001, emenda 25. Testado no simulador e num computador; não experimentado em placas reais."
      - "O endurecimento dos controladores de campo, vindo da revisão de segurança: limites ao tamanho dos pedidos, o código do GM e os códigos dos jogadores recusados em HTTP simples quando o HTTPS está ligado (a consola abre-se em https://controlador:8443/console/), o MQTT do campo com TLS (porta 8883; a 1883 simples só no loopback do Pi), TLS para o feed ATAK do pessoal, HSTS, uma unidade de serviço endurecida no Pi e a revogação dos modos assinados a falhar fechada (uma lista ilegível ou em falta não instala nada; um controlador sem rede usa a última lista durante 30 dias). Testado num computador, não num Pi nem num telemóvel reais num campo."
      - "Uma caixa que perdeu o registo da sua época, e por isso voltou numa época alta aleatória, volta a ser encontrada: um recetor que não consegue abrir um HELLO ou um TIME procura no resto do intervalo de épocas (uma fatia por pesquisa, dentro do orçamento existente), e um controlador que ouve essa caixa diz a sua época às outras numa nova mensagem CMD, que só pode subir uma época. Um jogo retomado sem registo também começa numa época aleatória do controlador, para que um nonce nunca se repita. As caixas antigas ignoram a mensagem nova. Testado no simulador e num computador; não experimentado em placas reais."
      - "O <code>rand()</code> de um modo parte da chave do jogo, além da semente do jogo e do id do nó, por isso o que a API mostra a quem joga já não o permite prever (os códigos do Terminal de Hacking, as equipas das Janelas de Alvo), e a semente do jogo deixou de ser mostrada a quem joga e ao marcador. O mesmo jogo repete-se de forma idêntica, mas um jogo gravado antes desta alteração repete-se com outros valores aleatórios: não atualizes as caixas a meio de um jogo. Vetores de teste partilhados em C, Python e Dart; não experimentado em placas."
      - "A sandbox de Lua fechou as brechas que uma revisão com verificador de memória encontrou: as funções de tabelas, as corrotinas e as cadeias longas de callbacks são medidas, a profundidade da pilha C está limitada para o ESP32, e um id de nó ou um temporizador fora do intervalo já não dá a volta. Os valores da pilha são calculados, ainda não medidos numa placa."
      - "O ganho da antena é uma opção de compilação (<code>--antenna-dbi</code>, 0 a 20 dBi, 2 por omissão): uma caixa com uma antena mais forte baixa a potência conduzida por esse ganho, arredondada para baixo, para que a potência irradiada fique dentro do limite da sub-banda. Só testes no computador."
      - "O código de acesso do fluxo em direto deixou de estar no endereço web: a consola envia-o num cabeçalho e a app num cabeçalho Authorization, e os registos dos controladores e do servidor do site apagam valores de códigos nos endereços (o endereço antigo ainda funciona durante uma transição). Um campo cujos registos foram partilhados deve mudar os códigos do GM e de leitura."
      - "Os resultados das equipas, sem ids de jogadores, também ficam 365 dias nos dois controladores (o histórico de jogos 90 dias), e o GM pode lê-los, só de leitura. Testado num computador."
    next:
      - As placas de rádio e 5 caixas montadas para o teste no campo.
      - Um teste no campo com 20 caixas, com e sem escuta antes de falar.
      - "Ligar ou não o espaçamento do controlador, decidido a partir do teste no campo com 20 caixas."
      - "Verificar em duas placas que uma mudança de canal mantém uma caixa parada e que um início lhe chega em cerca de um segundo (o guia está escrito)."
      - "Experimentar a janela de repetição e os controladores endurecidos em placas reais e num Pi real (um comando gravado e repetido na bancada)."
      - "Apagar o registo de épocas de uma caixa em duas placas de bancada para ver que volta a ser encontrada, duas vezes seguidas e com um antigo líder a voltar a entrar (o guia está escrito)."
    gate: >-
      Prova: 5 caixas num espaço de <a href="{{ page.to.glossary }}#glossario-cqb">CQB</a> e num campo
      exterior, sem uma única captura perdida. <strong>Em aberto.</strong>
  p3:
    title: Android e jogadores
    short: >-
      Dispositivos Android, módulo de E/S, app para quem joga e os modos que precisam dos
      telemóveis: feito em software, incluindo o iOS (verificado num iPhone). O teste no campo
      espera por telemóveis e módulos a sério.
    done:
      - "<strong>A app</strong> para quem joga, para os marshals e para a organização, em português
        e inglês, em Android e iOS (a versão iOS já passou a sua lista de verificação num iPhone)."
      - Um telemóvel Android faz de caixa, com qualquer modo e os ecrãs do próprio modo, e entra num
        jogo por código QR, cartão NFC ou texto.
      - "<strong>O telemóvel como controlador de campo</strong>, feito em software e à espera de um
        telemóvel a sério: corre o jogo e os serviços do campo sozinho."
      - >-
        <strong>O <a href="{{ page.to.glossary }}#glossario-dispositivo-android">módulo de E/S</a></strong>:
        firmware que empresta ao telemóvel os botões, o teclado, as luzes, a sirene, o leitor NFC e
        o rádio LoRa de uma placa Heltec.
      - "<strong>Modos que usam telemóveis e etiquetas</strong>: Baixa Confirmada, Reentradas e
        Vidas, Registo de Presença, as Ligaduras e a Fábrica de Dinheiro."
    g_modes:
      title: Modos e ecrãs
      items:
        - A Baixa Confirmada, as Reentradas e Vidas e o Registo de Presença leem as etiquetas NFC assinadas de quem joga.
        - "As Ligaduras: a pessoa atingida lê a sua etiqueta e mantém um botão premido para receber
          o tratamento, com um número limitado de tratamentos."
        - "A Fábrica de Dinheiro: as fábricas fazem dinheiro enquanto uma equipa as tiver; quem joga
          recolhe-o com a sua etiqueta e deposita-o noutra caixa, e o controlador guarda o que cada
          pessoa leva."
        - Ecrãs dos modos descritos em YAML, desenhados da mesma maneira pela Field Box e pela app.
    g_players:
      title: Jogadores e marshals
      items:
        - "Quem joga faz o check-in no campo lendo um cartaz impresso (sem conta e sem internet),
          diz que réplicas vai usar e vê se já passaram no cronógrafo."
        - >-
          <a href="{{ page.to.glossary }}#glossario-cronografagem">Cronografagem</a> à entrada: energia,
          limites por classe, verificações durante o jogo, medições assinadas pelo marshal. Os
          marshals trabalham a partir de uma lista de «réplicas por cronografar», e as suas
          medições assinadas aprovam ou recusam cada réplica; têm também o registo de réplicas e as
          etiquetas de quem joga.
        - Quem joga pode partilhar a posição durante o jogo, e o controlador decide quem a vê.
        - "Um campo ou clube com o seu próprio controlador pode mostrar o logótipo, a imagem de fundo
          e a cor na app, no marcador e no cartaz, e dar nomes e emblemas às equipas."
        - "A consola da organização avisa quando o cartaz de check-in mudou depois de impresso."
        - "Os ecrãs do marshal e do cronógrafo dizem o que a app faz de facto, e as listas de limites estão traduzidas."
        - "A app guarda mais segredos selados com o Keystore do Android: a chave do servidor do site, os segredos dos jogadores e a sessão no site."
        - "As etiquetas NFC de quem joga são assinadas pelo controlador de campo e escritas a partir da consola da organização, do controlador no telemóvel ou da app do marshal. Os marshals deixam de ter a chave do campo para isso."
        - "Etiquetas das réplicas: a app mostra, partilha ou imprime o autocolante com o QR de cada réplica, e a consola imprime-os para quem já fez check-in. A fila do marshal lê-os."
        - "Posições em interiores: a organização põe balizas BLE na planta, e um telemóvel que ouça uma indica a sua sala em vez do GPS. No Android, feito em software e com simulações, sem balizas a sério. Num iPhone, um plugin sobre o CoreLocation da Apple faz o mesmo com a app no ecrã (senão, GPS e o último piso); está feito e compila no CI, e ainda não foi experimentado num iPhone."
        - "A app segue um jogo a partir do código QR do marcador, mesmo quando o controlador no telemóvel serve HTTPS com a sua própria CA do campo. Em software, não experimentado num telemóvel a sério."
        - "Quem joga diz em que piso está e vê a planta do campo com as posições que pode ver."
        - "Histórico de jogos na app: os jogos em que a pessoa participou, do mais recente para o mais antigo."
        - "Início de sessão com Google, Microsoft, Apple ou uma chave de acesso (passkey) na app, com um ecrã de conta. Android, e no iOS em Swift (o navegador do início de sessão social como ASWebAuthenticationSession, as chaves de acesso pelas credenciais de plataforma da Apple; no iOS as chaves de acesso são opcionais na compilação e exigem o programa pago da Apple). A parte do iOS é compilada no CI e não foi corrida num iPhone; o início de sessão da app não foi experimentado num telemóvel a sério (o lado do servidor do site foi experimentado com a Google e a Microsoft, ver fase 4)."
        - "O plano do campo do jogador pode mostrar a quadrícula do campo e a célula do próprio jogador."
        - "Quem é árbitro pode associar um autocolante NFC a uma réplica ao registá-la."
        - "O telemóvel de um marshal já não guarda a chave de entrada do campo: só uma caixa de jogo (o seu cartão de entrada) e o controlador no telemóvel a guardam, e uma atualização apaga-a do telemóvel de um marshal."
        - "As ligações ao marcador que fixam a CA do próprio campo ficam guardadas por campo e são esquecidas quando a CA muda."
        - "Enquanto um jogo em direto está aberto na vista de quem joga, um serviço Android em primeiro plano, com uma notificação, mantém a app a correr, e os avisos por vibração continuam com a app fechada ou o ecrã apagado. No iOS não. Não experimentado num telemóvel a sério."
        - "As Field Box contam como balizas: uma caixa colocada regista-se como baliza ao lado das da organização, e um telemóvel que já está a partilhar apanha as alterações ao registo durante o jogo. Em software, sem testar com um telemóvel e uma caixa a sério."
        - "O aviso de privacidade na app: um pedido Ler e confirmar quando foi mostrada à conta outra versão, o aviso na língua da app, sem bloquear nada. A app pode criar uma conta (com palavra-passe ou social) depois de mostrar o aviso, com uma caixa «Tenho 16 anos ou mais»; quem é mais novo faz o check-in no campo sem conta. Um registo por conta social leva a versão do aviso que a pessoa viu, e uma entrada continua a funcionar com um servidor próprio mais antigo. A ligação do cronógrafo entre os campos de um hub alojado (um código de uso único) só aparece no modo alojado. Em software."
        - "A verificação do cartão no check-in: quando o campo confere a filiação, o check-in fica pendente até quem é árbitro ou o GM marcar \"cartão visto, corresponde\" com o cartão físico à frente; o número de filiado é então apagado do controlador (ficam o veredicto e a validade), e é possível passar sem o cartão, com o motivo registado e nunca o número. Na consola, na fila de árbitros da app e nos dois controladores. Só em software."
        - "A partilha da posição é uma escolha própria, não marcada de origem, no check-in (na app e no check-in manual da consola), com quem a vê; recusar não impede o check-in nem o jogo, e cada jogador/a pode ligá-la ou desligá-la quando quiser. Sem ela, o controlador recusa as posições. Só em software."
        - "A revisão de segurança da app: a CA do campo fixada é exatamente um certificado, nada de HTTP simples em todo o Android (só o loopback, o anfitrião do emulador, 192.168.4.1 e atalaia.local), uma APK de lançamento que nunca é assinada com a chave de depuração por engano e um bilhete de início de sessão social ligado à instância da app. Não experimentado num telemóvel real; a chave de assinatura de lançamento ainda tem de ser criada pelo responsável do projeto."
        - "A lista de eventos e o histórico de jogos de quem joga deixam de fora os eventos de rotina que não têm texto para jogadores (uma caixa a confirmar a configuração, nós a ligar ou desligar, leituras de etiquetas, acertos em alvos), em vez de mostrar nomes de tipo em bruto."
    g_props:
      title: Dispositivos Android e módulo de E/S
      items:
        - "Um dispositivo Android entra no jogo do controlador pela rede Wi-Fi do campo ou pelo seu
          rádio, através de um módulo de E/S."
        - "O firmware do módulo empresta ao telemóvel os botões das equipas, o teclado, as luzes, a
          sirene, o leitor NFC, o sensor de abertura e o rádio LoRa de uma placa Heltec, por USB ou
          Bluetooth."
        - "A app volta a ligar-se sozinha a um módulo de E/S perdido. Não experimentado com um módulo a sério."
        - "Os props Android vão buscar pacotes de modo assinados ao seu controlador, como as caixas. Em software."
        - "A consola de GM pode enviar as definições de um módulo de E/S pelo rádio: as cores dos quatro botões, o brilho do anel de LEDs, o volume e se o interruptor da caixa avisa. O módulo autentica o comando como qualquer outro, guarda as definições na sua flash e responde; o controlador volta a enviá-lo até ouvir a resposta. Antes, eram definidas quando o firmware era compilado. Em software e contra o código do módulo num computador, não experimentado com um módulo a sério."
        - "A penalização de uma caixa de um dispositivo Android passa a chegar ao controlador, pela ligação Wi-Fi e pela ligação de rádio. Em software."
    g_controller:
      title: O telemóvel como controlador de campo
      items:
        - "O motor de jogo, com o field.lua de um modo no núcleo partilhado, um broker MQTT e um
          filtro de posições; a API REST, o stream em direto e os tópicos MQTT; os jogos guardados
          quando o telemóvel reinicia; os códigos para as caixas entrarem no jogo."
        - "Dispositivos Android pela rede Wi-Fi, o módulo de E/S como rádio, o check-in no campo com
          o token de cada pessoa, a lista de «réplicas por cronografar» e as posições de quem joga.
          Verificado com os mesmos casos de contrato que o controlador no Pi e posto a jogar com o
          próprio código do módulo e da Field Box num computador."
        - "O seu ecrã: o controlador de campo no ecrã inicial da app, a correr com o ecrã apagado, a
          consola da organização servida pela app e HTTPS com uma CA do campo feita no telemóvel."
        - "O mapa do campo (uma planta por piso, a sua posição no mapa, os elementos do mapa com o
          limite do campo e o campo carregado de um mapa, por isso o aviso de saída do limite também
          funciona aí) e o canal de rádio, com a procura de um canal sossegado através do módulo de
          E/S."
        - "As caixas pelo rádio: convites selados para o jogo seguinte; o fim do jogo dito às caixas
          mesmo depois de o telemóvel reiniciar sem a chave do jogo; a adoção de caixas novas pelo
          código que mostram ou pelo cartão de campo que o telemóvel escreve por NFC; as
          atualizações de firmware entre jogos, pelo módulo de E/S ou pelo modem de rádio USB do Pi,
          e o telemóvel diz porquê quando o rádio não as consegue levar."
        - "As predefinições, os modos carregados e os pacotes de modos assinados, enviados às caixas
          que não os têm; os cenários compilados no telemóvel; os pacotes de papéis num jogo; os
          nomes e emblemas das equipas."
        - "O resto do que o Pi faz: a substituição (um telemóvel e um Pi podem ser o controlador de
          reserva um do outro), a sincronização com o servidor do site (jogos, registos e
          pontuações enviados quando há internet; listas de inscritos, imagem do campo e biblioteca
          de cenários recebidas de lá), o GM remoto e o feed para o ATAK."
        - "A consola da organização cabe num telemóvel: as tabelas de check-in e de marshals empilham-se, sem deslocar a página para o lado."
        - "O próprio ecrã do controlador no telemóvel importa uma lista de inscrições (um ficheiro CSV ou JSON escolhido com o seletor de ficheiros do Android), sem precisar da consola de GM."
        - "Um controlador de reserva recebe do seu convite de adesão as escolhas das balizas das caixas (o interruptor do campo, as caixas desativadas, as salas) e os lugares das caixas, para que, depois de uma passagem de testemunho, os telemóveis recebam o mesmo registo de balizas; uma consola já aberta no controlador de reserva move os marcadores das caixas logo, sem recarregar. Em software, nos dois controladores; o movimento dos marcadores está testado num navegador sem ecrã."
        - "O controlador no telemóvel acompanha a revisão de segurança do controlador Pi: a revogação de modos assinados falha de forma segura (com um mínimo por modo e um limite de idade para um telemóvel sem rede, ambos no ecrã Pacotes de modos), e a emissão ATAK para o pessoal passa por TLS com uma autoridade de certificação fixada. Testado em software; não num telemóvel num campo."
    g_ios:
      title: iOS
      items:
        - "O projeto está no repositório, o CI constrói-o num Mac e já correu num iPhone."
        - "A 2026-10-26 passou a sua lista de verificação num iPhone: 12 verificações automáticas e,
          à mão, a leitura de QR com a câmara, o check-in com o cartaz do campo por HTTPS, a
          partilha da posição com a aplicação no ecrã, o aviso de fora do campo e a sua vibração, e
          as ligações atalaia://."
        - "Balizas em interiores: um plugin em Swift sobre o CoreLocation, nos mesmos canais do Android, só pede a permissão de localização e funciona com a app no ecrã. Compila no CI; ninguém o correu ainda num iPhone."
    next:
      - "O teste no campo com telemóveis e módulos a sério (fase G do plano) espera pelo hardware.
        Até agora a app correu em emuladores Android e num iPhone ligado ao controlador da bancada,
        e o firmware do módulo só como o seu próprio código num computador."
      - O telemóvel como controlador de campo espera por um telemóvel a sério.
      - "No iOS, o NFC pede uma conta Apple paga; o dispositivo Android e o telemóvel como
        controlador do campo ficam só em Android."
      - "Experimentar o plugin de balizas num iPhone (compilado num Mac), e as balizas a sério, também no Android."
      - "Experimentar o início de sessão do site no iOS (navegador do início de sessão social e chaves de acesso) num iPhone."
      - "Experimentar o código QR do marcador, a escolha do piso, o histórico de jogos e a religação ao módulo de E/S num telemóvel e num módulo a sério."
      - "Experimentar o início de sessão da app num telemóvel a sério."
      - "Experimentar num campo e em telemóveis reais a verificação do cartão, a escolha da posição no check-in, a CA fixada e a criação de conta na app."
    gate: "Prova: um jogo mistura dispositivos ESP32 e Android sem problemas."
  p4:
    title: Servidor do site e jogo avançado
    short: >-
      Servidor do site, marcação de jogos e inscrições, cenários personalizados, modos avançados,
      ATAK. Todos os passos de software estão feitos; o início de sessão com a Google e a Microsoft já
      foi experimentado a sério num servidor de testes. Faltam um servidor a sério, as condições de entrada
      em produção do modo alojado e os testes em hardware.
    done:
      - "<strong>Modos avançados</strong>: Mestre e Satélites, o «Hackeia o terminal», VIP / Carga e
        a lógica das Janelas de Alvo."
      - "<strong>Cenários personalizados</strong>: o motor no controlador de campo, um compilador de
        cenários em YAML, um editor na consola da organização e os objetivos na app."
      - "<strong>O feed ATAK</strong>: as caixas e as zonas em mapas ATAK, no campo e, através do
        servidor do site, para a organização longe dele."
      - "<strong>O servidor do site</strong>: contas com códigos de dois fatores, direitos sobre os
        dados pessoais, sincronização, registo de cronógrafo, histórico dos jogos e biblioteca de
        cenários."
      - "<strong>Marcação de jogos e inscrições</strong>, com páginas públicas por campo, feeds de
        calendário e perfis de clube."
      - "<strong>Modo alojado</strong>: vários campos num só servidor, cada um separado dos outros,
        com a sua instalação."
    g_modes:
      title: Modos
      items:
        - "Mestre e Satélites: os satélites que uma equipa tem junto com a mestre aumentam os seus
          pontos; a mestre a mudar de mãos liberta-os."
        - "O «Hackeia o terminal»: um enigma no teclado que revela um código ou captura o terminal."
        - "VIP / Carga: uma equipa escolta o seu VIP ou um telemóvel com GPS até uma zona de
          extração; os pontos de controlo pontuam enquanto uma equipa os tiver; as posições ficam no
          controlador de campo e no telemóvel."
        - "As regras das Janelas de Alvo: um tiro enquanto o alvo mostra a cor de uma equipa pontua
          para essa equipa. O módulo de alvo ainda não está feito."
        - "Utilitários geográficos no núcleo: distâncias e zonas para todos os scripts, idênticos em
          todas as plataformas."
    g_scenarios:
      title: Cenários personalizados
      items:
        - "O motor: o cenário corre no controlador de campo e diz às caixas do pacote de objetivos o
          que são (um ponto a capturar, um código, etiquetas ou cartões a ler, um local de bomba);
          elas informam, o cenário pontua."
        - "O compilador: um cenário em YAML com sete tipos de objetivo, dependências, revelações e
          janelas de tempo, verificado com cada problema localizado e explicado, e compilado a partir
          da linha de comandos."
        - "Na consola da organização: um editor que mostra cada problema enquanto se escreve e
          instala o cenário; as caixas recebem os nomes do cenário ao juntar-se."
        - "Na app: quem joga vê os objetivos que são para si, com os nomes e o estado de cada um, e um
          objetivo escondido só depois de revelado; cada squad pode ter a sua cadeia, um objetivo de
          cada vez, dito a todo o squad ou só ao líder de squad."
    g_atak:
      title: ATAK e o mapa do campo
      items:
        - "O feed ATAK: as caixas e as zonas em mapas ATAK pelo Wi-Fi do campo, com as cores de quem
          as tem, colocadas dando a posição no mapa a dois cantos da imagem do campo."
        - "O GM marca na planta do campo as zonas seguras, o respawn e a base de cada equipa, o
          estacionamento, os primeiros socorros e os objetivos, como ponto, círculo ou área, cada um
          visível para todos, para uma equipa ou só para a organização, na consola e no ATAK."
        - "O campo pode ser carregado de um mapa: o GM encontra-o a partir de onde está ou pelo nome
          de um sítio e desenha o seu limite no OpenStreetMap, e o navegador desenha a imagem do
          campo com os dados do OpenStreetMap, sobre a fotografia aérea aberta do país (Portugal
          continental, Espanha, França e ultramar, Países Baixos, Bélgica, Luxemburgo, Suíça,
          Liechtenstein, onze estados alemães, Polónia e Chéquia). O desenho passa a ser o limite do
          campo, ficando escurecido o que está fora."
        - "O telemóvel de quem joga avisa com uma faixa e vibração quando sai do limite, com o seu
          próprio GPS, sem enviar nada."
        - "As posições de quem joga nunca vão para toda a gente, só para dispositivos da organização
          quando o campo o liga. Quem organiza, longe do campo, recebe o mesmo através do servidor do
          site, por uma ligação cifrada com um certificado por dispositivo que o campo emite e pode
          revogar de imediato; as posições só chegam aos certificados de GM ou marshal."
        - "Campos com vários pisos na consola: uma planta por piso e cada caixa no seu piso."
        - "Ainda não experimentado num telemóvel com ATAK real, nem num campo real."
        - "Uma caixa que o Domínio Progressivo tornou a ativa di-lo no ATAK."
        - "A página do mapa do campo funciona também no telemóvel como controlador de campo."
        - "O ATAK mostra quem está em interiores no sítio da sua baliza, com a sala nas observações."
        - "A quadrícula no ATAK e um mapa de quadrícula para imprimir."
        - "O GM remoto vê as posições dos jogadores quando estes as partilham."
        - "Os certificados de dispositivo do ATAK duram 90 dias (eram 7), e a página de ATAK do pessoal avisa quando um expira nos próximos 14 dias."
        - "O campo pode desligar a obtenção de mapas da consola (Definições, Obtenção de mapas): então o \"Carregar o campo a partir de um mapa\" não chega ao OpenStreetMap, ao Overpass, ao Nominatim nem às imagens aéreas. Ligada de origem."
    g_server:
      title: Servidor do site, contas e dados
      items:
        - "O esqueleto: base de dados, migrações e verificação de estado, no seu próprio contentor."
        - "As contas: palavras-passe, códigos de dois fatores obrigatórios para quem organiza e para
          marshals, sessões e funções por campo."
        - "Direitos sobre os dados pessoais: acesso, exportação, correção, apagamento, registo de
          consentimentos e limpeza diária por prazo de conservação."
        - "A sincronização: os controladores de campo enviam os jogos, os registos e as pontuações,
          funcionam sem rede e podem repetir o envio sem duplicar nada. Ainda não numa ligação 4G real."
        - "O registo de cronógrafo: leituras assinadas verificadas e guardadas tal como assinadas, só
          chaves públicas, partilha entre campos com consentimento. Ainda sem um cronógrafo real."
        - "reset-totp: quem opera o servidor repõe o código de dois fatores de uma conta que perdeu o autenticador."
        - "Os controladores de campo vão buscar os registos de cronógrafo de outros campos de quem está na sua lista de inscritos, só com o consentimento de cada pessoa. Guardam-nos à parte das suas próprias leituras e nunca os avaliam."
        - "Os controladores recebem do servidor do site as definições e a imagem do campo, e uma alteração chega logo ao Pi e ao controlador no telemóvel. Em software."
        - "Início de sessão com Google, Microsoft ou Apple e com passkeys (chaves de acesso). As palavras-passe são opcionais; a equipa continua a precisar de um segundo fator. A Google e a Microsoft foram experimentadas com os fornecedores a sério no servidor de testes (tests.atalaia-project.link); a Apple ainda não."
        - "Uma página de conta para a equipa, onde cada pessoa gere os seus inícios de sessão: passkeys, contas associadas, palavra-passe e código de dois fatores."
        - "As alterações a cenários, predefinições e calendário chegam logo aos controladores."
        - "Durante quanto tempo o campo guarda os dados é uma definição do campo: o histórico de jogos e os registos de cronografagem têm cada um o seu prazo, definido no controlador, na consola de GM ou na página de definições do servidor do site: o histórico de jogos 90 dias por omissão (os resultados das equipas, sem identificadores de jogadores, 365), os registos de cronografagem 365. A limpeza diária apaga um jogo terminado com essa idade, nunca antes de o servidor do site o ter por inteiro. O campo, sem uso, de retenção por conta desapareceu."
        - "O apagamento de uma pessoa num controlador de campo chega sozinho ao servidor do site na sincronização seguinte (nunca com o nome), e apaga lá também os registos de cronografagem dessa pessoa."
        - "Modelos do aviso de privacidade, do acordo de subcontratação de dados e dos termos de partilha entre campos, em português e inglês (o acordo também em pt-PT), e um modelo de avaliação de impacto sobre a proteção de dados: dizem as posições que a assessoria jurídica do responsável do projeto aprovou a 30 de outubro de 2026 (contas assentes no contrato com idade mínima de 16 anos, o cartão de filiado conferido no check-in com o número apagado, infrações por interesse legítimo, partilha da posição por consentimento, sem encarregado de proteção de dados). Continuam a ser modelos que cada campo preenche, não aconselhamento jurídico para um campo em concreto."
        - "O servidor do site publica o aviso de privacidade que a operação lhe dá, como página e pela API em quatro línguas, e mostra-o de novo às contas quando a versão muda (a conta assenta no contrato, não no consentimento). Nada fica bloqueado: a exportação e o apagamento continuam disponíveis. Testado num computador."
        - "Uma conta social escolhe o nome de utilizador na página da Conta logo depois de ser criada (pode ser saltado; o nome do próprio fornecedor só se a pessoa o pedir). Qualquer conta pode mudar o seu nome com o seu próprio método de início de sessão, e duas contas da mesma pessoa podem ser fundidas depois de a pessoa provar as duas (nunca para dentro ou a partir de uma conta com função de equipa). O erro de consentimento em falta aparece junto da caixa de seleção. Testado num computador; o passo do nome de utilizador e a fusão ainda faltam experimentar no servidor de testes."
        - "Um registo por conta social guarda a versão do aviso de privacidade que a pessoa realmente viu: o servidor recusa uma versão desatualizada e verifica outra vez antes de criar a conta. Testado num computador."
        - "A limpeza diária da retenção também apaga as contas anonimizadas (o que uma eliminação ou uma fusão deixa) quando nada as referencia. Testado num computador."
        - "Mudar a forma como uma conta inicia sessão exige um segundo fator: juntar, mudar o nome ou remover uma passkey, ligar ou desligar o código de dois fatores, mudar a palavra-passe, ligar uma conta social e confirmar uma fusão são recusados se a sessão não passou por um TOTP ou uma passkey (um início de sessão social sozinho não conta); uma fusão nunca leva passkeys para uma conta de equipa. A página de conta e a app pedem esse passo primeiro. Testado num computador, não com os fornecedores a sério."
        - "A revisão de segurança do servidor do site: corpos de pedidos limitados (413 acima de 1 MiB, 4 MiB nos carregamentos), a mesma resposta para \"conta inexistente\" e para uma atribuição recusada, a exportação do campo só com as entradas de auditoria do campo, o interruptor da página pública respeitado na procura de campo da app, um endereço público obrigatório, o emissor de um início de sessão social guardado com o seu identificador, pedidos HTTP simples atrás de um proxy redirecionados para HTTPS e uma verificação de saúde que só diz ok. Em parte encontrado no servidor de pré-visualização."
        - "As contas assentam no contrato, não no consentimento: a criação de conta regista que versão do aviso de privacidade foi mostrada, com uma caixa \"Tenho 16 anos ou mais\" (na página da equipa e na app); não se guarda data de nascimento; sem aviso publicado, o registo fica fechado. Os consentimentos antigos passaram a registos de aviso. Testado num computador."
        - "O código da revisão de privacidade: o endereço de rede de uma entrada de auditoria apaga-se ao fim de 180 dias (definível); uma conta sem uso há 24 meses é avisada e anonimizada 30 dias depois; a eliminação de uma pessoa, ou um consentimento de partilha retirado, chega aos controladores de outros campos, que largam as cópias; as eliminações ficam como somas de controlo num registo fora da base de dados e são aplicadas de novo depois de um restauro; uma página nova da equipa marca quem reincide como um aviso (um simples aviso nunca conta) e um \"banimento\" termina ao fim de 12 meses por omissão; o histórico de jogos guarda-se 90 dias com identificadores de jogadores, e os resultados das equipas, sem eles, 365. Testado num computador."
        - "Um campo aceita os termos de partilha entre campos (a administração, na página de definições) antes de partilhar registos de cronografagem; a versão, a data e a conta ficam registadas, e quando os termos mudam a partilha fica suspensa até serem aceites. O campo é o responsável pelos dados, o operador do centro é o subcontratante, e os campos que partilham são corresponsáveis só nesse passo. Testado num computador."
        - "Quem opera pode definir uma palavra-passe numa conta existente pela linha de comandos (<code>set-password</code>, pedida duas vezes sem eco, nunca na linha de comandos): a saída para uma conta de pessoal sem segundo fator, que por isso não pode mudar os seus métodos de entrada pelo site."
    g_games:
      title: Jogos, clubes e páginas da organização
      items:
        - "A marcação de jogos, com uma página pública por campo e feeds abertos iCalendar e JSON dos
          jogos (sem dados pessoais)."
        - "As inscrições nesses jogos, com réplicas declaradas e um bilhete de check-in: o
          controlador de campo recebe a lista e devolve quem veio. Inscrição pela aplicação;
          importação de uma lista de inscrições (CSV ou JSON) exportada de outra plataforma."
        - "Perfis de clube: nome, cor, logótipo e emblema, membros, uma página pública desligada por
          omissão com um botão para denunciar e moderação. A imagem do campo e as equipas guardadas
          sincronizam com os controladores, para que o emblema de um clube chegue a todos os campos
          que guardaram a sua equipa."
        - "O histórico dos jogos: a evolução da pontuação e os eventos de cada jogo; quem joga e quem
          assiste vê um jogo a decorrer com um minuto de atraso, sem segredos nem identificadores de
          jogador. Um marcador público por campo (desligado por omissão)."
        - "A biblioteca de cenários do campo com as predefinições de jogo, verificados como o
          controlador de campo os verifica e instalados por todos os controladores do campo,
          incluindo o de reserva."
        - "Páginas web para a organização do campo, em português e inglês e num telemóvel: entrada
          com o código de dois fatores, histórico dos jogos, biblioteca de cenários (todos os
          problemas mostrados antes de guardar, revisões e predefinições), estado das caixas, e a
          vista ao vivo e os comandos do GM remoto. Testadas num browser automático, ainda não num
          servidor real."
        - "Os controladores largam um cenário ou predefinição que o servidor do site arquivou ou apagou, a menos que um jogo ainda o use."
        - "Páginas da organização para o calendário: listar, criar, editar, publicar e cancelar jogos, com as horas no fuso do campo."
        - "Páginas da organização para as inscrições: quem se inscreveu, alterar um nome, uma equipa ou um número de federação, retirar uma inscrição, e a exportação e importação em CSV."
        - "Uma página da lista do dia do jogo, para imprimir, com a data em que um controlador a foi buscar pela última vez."
        - "Ações da organização numa inscrição: paga ou não paga (o servidor não cobra nada), falta, mudar para outro jogo, repor, editar as réplicas. Testado num navegador sem ecrã, não num servidor a sério."
        - "Páginas para a equipa gerir funções, chaves de sincronização, imagem do campo, clubes, ligações a plataformas, firmware e administração."
        - "A página do GM remoto atualiza-se em direto, sem recarregar."
        - "A filiação numa associação é verificada no registo e no check-in: as APD nos campos em Portugal, qualquer associação ou federação noutros países."
        - "Uma página para o pessoal do campo com as definições do campo: a página pública, as regras do check-in, a filiação, a partilha do cronógrafo e o país."
        - "Os registos de cronógrafo mostram quanto uma réplica passou do limite e assinalam reincidentes."
        - "Uma página para o pessoal do campo com a exportação dos dados e o uso das quotas."
        - "Cronologias de pontuação em tempo de jogo."
        - "A página de um clube lista os campos onde joga, também a do pessoal."
        - "O controlador importa sozinho um CSV de inscrições, sem servidor do site."
        - "A consola avisa quando um nome tem letras que as caixas não conseguem desenhar: nomes de equipas, o nome do jogo, o de um cenário e os dos seus objetivos."
        - "As listas de inscrições levam o identificador da associação e a data de validade da filiação como colunas opcionais, e a exportação das inscrições volta a importar-se tal como está."
    g_boxes:
      title: Caixas e o campo
      items:
        - "O estado das caixas: bateria, ligação e firmware de cada caixa, a partir do que os
          controladores enviam; o controlador de campo avisa quando uma caixa se cala ou volta e
          quando a bateria está fraca, o que uma caixa com medidor de bateria também avisa por si.
          Ainda não em caixas reais."
        - "Um catálogo de firmware que só lista versões assinadas com uma chave de confiança e as
          atualizações pelo ar da Field Box: o GM carrega uma versão assinada no controlador de campo
          e atualiza as caixas entre jogos, nunca durante um; cada caixa descarrega-a pelo Wi-Fi do
          campo, verifica a assinatura com as chaves do seu próprio firmware, instala-a na partição
          livre e volta ao firmware anterior se o novo não arrancar. Em software, ainda não numa
          placa real."
        - "A adoção das caixas pelo campo com um cartão de campo NFC, o cabo USB do controlador ou o
          código de 6 algarismos que a caixa mostra, emparelhada por rádio. Em software, ainda não
          numa placa real."
        - "O convite das caixas para o jogo seguinte pelo rádio, sem cartão nem QR (a entrada vai
          cifrada com uma chave derivada da chave de entrada do campo), e um início que espera que
          cada papel tenha uma caixa, salvo «Começar mesmo assim». Testado em duas placas na
          bancada com o controlador de campo."
        - "As caixas ouvidas em cada jogo novo (o contador do rádio passou a ser por jogo, uma
          correção vinda da bancada) e os ecrãs das caixas a seguir o jogo (Pronta, À espera, Livre)
          na língua do campo, português ou inglês. Testado em duas placas na bancada."
        - "Um controlador reiniciado a meio de um jogo retoma-o; um que perdeu a chave do jogo ainda
          avisa as caixas pelo rádio do campo de que o jogo terminou; os PIN de administração
          errados esperam cada vez mais, contados mesmo depois de reiniciar, sem PIN por omissão
          numa caixa real. Em software, ainda não nas placas da bancada."
        - "O GM remoto: quem tem a função de GM no campo, com código de dois fatores, vê o jogo ao
          vivo e inicia-o, pausa-o, retoma-o ou termina-o, ou envia uma mensagem ou um comando do
          modo, por uma ligação que o próprio controlador de campo abre, só quando o campo o liga,
          com cada comando registado dos dois lados."
        - "O separador Controlador da consola lista o estado do GM remoto e todos os comandos que recebeu."
    g_deploy:
      title: Instalação e modo alojado
      items:
        - "A instalação: HTTPS através do Caddy com certificado automático, um script de instalação
          que gera todos os segredos, cópias de segurança diárias cifradas e a reposição numa base de
          dados nova. Testada em Docker num computador, não num servidor real com um domínio real."
        - "O modo alojado: um servidor para vários campos, cada um num esquema próprio da base de
          dados e no seu próprio endereço, com segurança ao nível das linhas por baixo, para que
          nenhum campo veja os dados de outro, e os comandos de quem gere o serviço para exportar ou
          apagar os dados de um campo. Testado com PostgreSQL em Docker."
        - "A sua instalação: um script que cria as contas da base de dados do serviço, cada campo no
          seu próprio endereço com um certificado que só o nome de um campo ativo consegue obter, e
          cópias de segurança cifradas repostas com cada campo separado dos outros. Testada em
          Docker, não num servidor alojado real com um domínio real."
        - "Modo alojado: uma quota por campo, uma exportação de dados que a administração do campo pode descarregar, e as ligações abertas de um campo apagado fecham logo."
        - "Modo alojado: uma quota de armazenamento e domínios próprios por campo."
        - "Modo alojado: cada campo tem um papel de base de dados só seu, e por isso uma injeção de SQL já não consegue passar para os dados de outro campo mudando a definição que a segurança ao nível da linha usava. Uma lacuna que exige uma segunda instrução SQL continua aberta e está escrita. Testado contra o PostgreSQL em Docker."
        - "Modo alojado: os campos que partilham registos de cronografagem passam a fazê-lo entre os campos de um centro, por uma vista só de leitura que exige consentimento; uma pessoa liga as suas contas em dois campos com um código de uso único, e nada é associado por e-mail ou nome. Testado contra o PostgreSQL em Docker."
        - "Uma demonstração em direto, só de leitura, para o servidor de pré-visualização: o controlador de campo a sério, com três Field Box simuladas, joga jogos sem parar, alternando um campo aberto e um edifício inventado de três pisos (uma planta por piso, quinze balizas, doze jogadores simulados: seis localizados por baliza, cinco por GPS com o piso escolhido, um indeciso), e quem visita vê a consola de GM, o marcador e a vista de quem joga, sem nada para alterar e sem dados pessoais. No ar desde 29 de outubro de 2026, em demo.atalaia-project.link; a vista de quem joga é testada num navegador sem ecrã."
        - "Modo alojado: um só retorno de início de sessão social para todo o centro (opcional): quem opera regista um endereço de retorno por fornecedor; o centro assina o estado, confere o campo no seu registo e passa para o retorno do próprio campo. Testado em Docker, não com os fornecedores a sério."
        - "Uma lista de verificação de entrada em produção para quem opera: seis condições antes de um campo poder usar o modo alojado (um acordo de subcontratação assinado por campo, os termos de partilha, todos os subcontratantes no anexo e na UE, um aviso de privacidade preenchido, os papéis próprios de quem opera se for uma pessoa singular, e uma prova num servidor real)."
        - "O servidor de pré-visualização (tests.atalaia-project.link) corre tudo isto desde 30 de outubro e tem um aviso de privacidade próprio (versão preview-2026-10-31, contas assentes no contrato, 16 anos, sem encarregado de proteção de dados)."
        - "O servidor de pré-visualização instala sozinho o seu aviso de privacidade em cada arranque e atualização (e pára se faltarem os ficheiros de uma versão), a demonstração em direto envia HSTS, e uma pilha de teste descartável (um hub alojado, um fornecedor de início de sessão falso e um controlador de campo, só em 127.0.0.1) permite correr um teste de segurança autorizado sobre o código de hoje."
    next:
      - Um servidor a sério com domínio.
      - "As condições de entrada em produção do modo alojado (um acordo de subcontratação assinado por campo, os termos de partilha, um aviso preenchido) e cada campo a preencher o seu aviso e a sua avaliação de impacto. A assessoria jurídica do responsável do projeto aprovou as posições jurídicas a 30 de outubro de 2026; o modo alojado continua a não ser oferecido. Nada do trabalho de segurança, de rádio e jurídico de 30 de outubro foi experimentado numa placa ou num telemóvel reais: corre em software e no servidor de pré-visualização."
      - "Os testes em hardware: placas reais, um telemóvel com ATAK real, uma ligação 4G real, um
        cronógrafo real."
      - O módulo de alvo, que as regras das Janelas de Alvo esperam.
      - "Experimentar o início de sessão da Apple com o fornecedor a sério, e o passo do nome de utilizador e a fusão de contas no servidor de testes."
      - "jogarairsoft.pt: o responsável do projeto escreveu-lhes a 28 de outubro de 2026 a propor uma integração (os eventos, equipas e APDs deles para nós; o nosso feed de jogos, perfis de campo, clubes públicos e resultados para eles). À espera da resposta; nada está prometido."
    gate: >-
      Prova: um <a href="{{ page.to.glossary }}#glossario-milsim">milsim</a> de fim de semana decorre
      do princípio ao fim com a Atalaia.
  p5:
    title: Comunidade
    short: >-
      Editor visual de modos, pacotes de modos assinados, o registo de modos como modelo, alemão e
      chinês tradicional, guias de montagem. Todos os passos de software estão feitos.
    done:
      - "<strong>O editor visual de modos</strong>: uma página do simulador onde se monta um modo
        com blocos (o que acontece quando uma equipa mantém o botão premido, temporizadores,
        pontos, ecrãs e sons, zonas no mapa, comandos da organização, vários papéis, as definições
        que a organização pode mudar e a lógica do controlador de campo entre caixas). Escreve os
        scripts Lua e o manifesto do modo à medida que se monta, em português e inglês, funciona sem
        rede, e um botão experimenta logo o modo no simulador. Os seus três exemplos passam os
        mesmos testes que os modos escritos à mão."
      - "<strong>Pacotes de modos assinados</strong>: um arquivo, assinado como uma versão do
        firmware. O editor cria o pacote do modo e mostra o que a chave de modos vai assinar e o
        comando que o assina; a assinatura continua a fazer-se no próprio computador, sem rede."
      - "O controlador de campo só instala modos assinados com as suas próprias chaves de confiança e
        mostra quem assinou cada um e se o projeto o reviu."
      - "Uma bateria de tentativas de fuga ao sandbox corre a cada alteração; fechou duas maneiras
        de um script passar do seu limite de tempo."
      - "<em>Enviar os modos em falta</em> na consola de GM: uma caixa a quem falta o modo de um jogo
        obtém o pacote assinado do controlador de campo pelo Wi-Fi do campo, só entre jogos, enquanto
        o jogo espera por ela; verifica-o com as chaves do seu firmware e guarda-o. Testado num
        computador, não numa caixa a sério."
      - "Cenários montados com blocos na consola de GM: as caixas, os objetivos e quem os vê, quando
        abrem, o que os cumpre e o que dão, com rato, toque ou teclado, mesmo num telemóvel. O
        controlador de campo verifica-os e instala-os tal como se tivessem sido escritos à mão."
      - "<strong>O registo de modos</strong>, pronto como modelo: um pedido de integração com um modo
        assinado é verificado automaticamente (a assinatura, que o código é o que foi assinado, a
        licença, os testes no simulador), e um modo revisto pelo projeto recebe o selo de
        verificado, a assinatura do próprio projeto, que é o que o deixa chegar às caixas. Como
        submeter um modo, a lista de revisão, as chaves e a moderação estão escritos."
      - "<strong>Alemão e chinês tradicional</strong> (como se escreve em Taiwan) nesta página, na
        consola de GM, no editor de modos, na app, nos ecrãs da Field Box, nos modos incluídos e nas
        páginas do servidor do site: rascunhos feitos com um modelo de IA, ainda não revistos por
        quem joga nessas línguas."
      - >-
        O repositório do registo existe (criado a 26 de outubro de 2026) e a sua <a href="https://vakaobr.github.io/atalaia-modes/">página</a>
        lista os modos, ainda sem nenhum.
      - >-
        <a href="{{ page.to.build }}">Guias de montagem</a> da caixa satélite, do módulo de E/S e do
        módulo de alvo, em texto. Ainda não se montou nenhuma caixa com eles.
      - "<strong>Manuais de utilizador</strong> para quem joga, a organização, os marshals e quem opera a Field Box, em inglês e português."
      - "Manuais de montagem com a tabela de pinos de cada placa, um guia do firmware (transferir uma versão publicada ou compilá-la) e um guia de montagem do controlador, em inglês e português."
      - "A vista web do simulador tem todas as entradas que um modo usa: tags, teclado, impactos e comandos da organização, com descarga do registo de eventos."
      - "Os blocos de cenários da consola do GM têm uma lista de línguas com as quatro."
      - "As chaves de modos do projeto: uma chave raiz guardada offline e uma chave com que o registo assina o selo de verificado. As caixas, a app e os controladores confiam nas duas por omissão."
      - "O guia do firmware e os manuais de montagem explicam a única gravação por USB de que uma caixa com a tabela de partições antiga precisa, e que as definições e as chaves sobrevivem a ela."
      - "O endurecimento do CI e do lançamento, vindo da revisão de segurança: cada ação fixada por commit, a imagem de compilação por digest, cada instalação pip a partir de um ficheiro com somas de controlo, o trabalho de assinatura num ambiente protegido que recusa uma etiqueta fora da main, e atualizações semanais das dependências. O responsável do projeto ainda tem de criar o ambiente protegido e mover para lá os segredos de assinatura (os passos estão escritos)."
      - "Os padrões de texto do Lua e string.rep passam a ser contados no sandbox (um padrão hostil podia bloquear uma caixa até ao watchdog), saltar dados CBOR aninhados tem limite de profundidade, e os descodificadores de CBOR têm testes com entradas hostis."
    next:
      - "A revisão do alemão e do chinês: se jogas em alemão ou em chinês, ajuda-nos a revê-los. As
        traduções para outras línguas começam em docs/translations (em inglês)."
      - "O hardware: a placa de suporte (PCB), uma placa feita que facilita a montagem, depois das
        primeiras caixas montadas, fotos das montagens, conteúdo da comunidade feito num campo."
    gate: Continua depois da primeira versão.

build:
  title: Guias de montagem
  intro: >-
    Os dispositivos da Atalaia montam-se com peças à venda em qualquer loja de eletrónica, à volta
    de uma placa ESP32, sem placa de circuito feita de propósito. Aqui estão os pinos e os esquemas de ligações da Field Box e os guias da caixa
    satélite, do módulo de E/S e do módulo de alvo, em resumo; os guias completos, com todas as
    verificações e as tabelas de problemas e soluções, estão no repositório (em inglês).
    Para pôr o firmware numa placa, <a href="https://github.com/vakaobr/atalaia-project/releases">transfere uma versão publicada</a> ou compila-a: o <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/pt/firmware.md">guia do firmware</a> explica as duas formas. O controlador de campo tem o seu <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/pt/controller-setup.md">guia de montagem</a>.
  status: >-
    <strong>Ainda não se montou nenhuma caixa a partir destes guias.</strong> Os pinos são
    verificados automaticamente contra o firmware, mas todos os passos físicos (caixa, alimentação,
    autonomia, alcance do rádio) estão por testar, e as fotografias chegam com as primeiras
    montagens. Se montares uma, conta-nos o que encontraste.
  toc: Nesta página
  parts: Peças
  pins: Pinos
  pins_intro: >-
    Os valores por omissão do firmware. Qualquer pino da placa que não esteja nesta tabela fica
    sem ligação.
  pin_what: O quê
  pin_gpio: GPIO
  steps: Passos
  open: Ainda por decidir
  photo: "Fotografia a acrescentar depois da primeira montagem:"
  pin:
    btn1: Botão de equipa 1 (a primeira equipa do jogo)
    btn2: Botão de equipa 2 (a segunda equipa)
    btn3: >-
      Botão de equipa 3, opcional (a linha de receção da UART0 da placa)
    btn4: Botão de equipa 4 (no expansor do teclado)
    led: Dados do anel de LED, através do conversor de nível 74AHCT125
    sda_gauge: I2C SDA, para o medidor de bateria (o barramento da própria placa)
    sda_bus: >-
      I2C SDA, para o expansor do teclado, o leitor NFC e o medidor de bateria (o barramento da
      própria placa)
    scl: I2C SCL
    bclk: BCLK do amplificador (opcional)
    lrclk: LRC do amplificador
    dout: DIN do amplificador
    tamper: Interruptor da caixa, para GND
    log: >-
      Saída do registo (UART0 TX): só para o RX de um adaptador USB-série de 3,3&nbsp;V, na bancada
    disp_mosi: >-
      MOSI do ecrã (SPI)
    disp_clk: >-
      Relógio do ecrã (SCK)
    disp_cs: >-
      Seleção do ecrã (CS; o pino de tensão da bateria da placa, usado como saída)
    disp_dc: >-
      Dados/comando do ecrã (DC)
    disp_rst: >-
      RESET e retroiluminação do ecrã: os dois ao pino 3V3, sem GPIO
    keypad: >-
      Teclado, através do expansor PCF8574 (endereço 0x20)
  safety:
    title: Primeiro, a segurança
    intro: Estas regras valem para todas as montagens desta página, tal como para a Field Box.
    antenna: >-
      <strong>Nunca ligues uma placa sem a antena LoRa</strong>, nem sequer por USB: emitir com a
      saída da antena aberta pode destruir o amplificador do rádio. Monta as duas antenas primeiro e
      deixa-as sempre ligadas.
    cell: >-
      <strong>Uma só célula de iões de lítio em série</strong> (1S, 3,0–4,2&nbsp;V): células
      protegidas, um fusível perto da célula e um díodo contra uma célula ligada ao contrário. A
      entrada de bateria e o carregador da placa só aceitam uma célula; uma bateria 2S destrói-os.
      Confirma a polaridade com um multímetro antes de cada ligação: as fichas pequenas de bateria
      não têm uma polaridade padrão.
    charge: >-
      <strong>Carrega sempre com alguém a vigiar</strong>, nunca dentro de uma mala fechada, só entre
      cerca de 0 e 45&nbsp;°C, e guarda as células num saco à prova de fogo enquanto trabalhas, fora
      da caixa. Nunca uses uma célula amolgada, inchada, quente ou abaixo de 2,5&nbsp;V.
    volts: >-
      <strong>Só sinais de 3,3&nbsp;V</strong> na placa: o anel de LED é comandado através de um
      conversor de nível, e cada módulo I2C tem de puxar as suas linhas para 3,3&nbsp;V, nunca para
      5&nbsp;V.
    pins: >-
      <strong>Nunca ligues nada ao GPIO 5 nem ao 46</strong> (a entrada do rádio) <strong>nem aos
      GPIO 34 e 38–42</strong> (o conector de GPS da placa).
    power_check: >-
      <strong>Nenhum jogo antes de medir a potência de emissão</strong>, como diz a lista de
      arranque: o firmware mantém o rádio dentro do limite legal com um ganho do amplificador que
      ainda não foi medido.
    enclosure: >-
      <strong>Caixa de plástico, nunca de metal</strong> (o sinal de rádio tem de sair), estanque,
      de cor viva, com o rótulo «GAME PROP», e nada que se pareça com um engenho explosivo.
    hits: >-
      <strong>Vai levar com BBs e bolas de paintball.</strong> Mantém as células e as placas longe
      das paredes e fora da linha de tiro, protege o ecrã de um telemóvel com policarbonato
      transparente (nunca vidro) e nunca ponhas uma caixa onde quem joga tenha de lhe disparar, a
      não ser que seja um alvo.
  field_box:
    title: Field Box
    text: >-
      O dispositivo principal, com botões de equipa, teclado, ecrã a cores, anel de LED, leitor NFC
      e altifalante. O
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.pt.md">manual
      de montagem</a> (em inglês) tem as peças, os esquemas de ligações, a alimentação e a segurança
      das baterias, a primeira gravação do firmware e a resolução de problemas; os guias abaixo
      remetem para ele em todos os passos que partilham.
    pins_shared: >-
      Os GPIO 1, 35 e 44 são pinos da placa que a Field Box partilha de propósito, cada um para este único uso: o 1 é a entrada de tensão da bateria da placa (o medidor lê a bateria por I2C), o 35 o seu LED branco (que pisca de leve com o anel) e o 44 a linha de receção da UART0 (a consola USB não é afetada).
    wiring:
      title: >-
        Esquemas de ligações
      intro: >-
        Dois esquemas, gerados a partir dos ficheiros WireViz do repositório: os sinais com a alimentação lógica de 3,3 V, e a bateria, o interruptor e a linha de 5 V. Os pinos da placa têm só o número do GPIO: procura cada um pelo número impresso junto ao pino do conector. Os nomes (pinos, fios, peças) ficam em inglês em todas as línguas, como no repositório; se o texto e um esquema discordarem, vale o esquema.
      open: >-
        Abrir o esquema em tamanho real (SVG)
      hint: >-
        O esquema é muito largo: toca ou clica nele para o abrir em tamanho real, onde podes ampliar e deslocar. Também no tema escuro está sobre uma folha branca, para as cores dos fios continuarem verdadeiras.
      signals:
        alt: >-
          Esquema de ligações 1 de 2, sinais e alimentação de 3,3 V: os pinos GPIO da placa principal passam pela placa de interligação até ao ecrã, aos botões de equipa, ao teclado e ao seu expansor PCF8574, ao leitor NFC, ao medidor de bateria, ao amplificador e ao altifalante, ao anel de LED e às antenas.
        caption: >-
          Esquema 1 de 2: sinais e alimentação lógica de 3,3 V.
      power:
        alt: >-
          Esquema de ligações 2 de 2, bateria e alimentação de 5 V: a célula, o fusível, o interruptor geral, o díodo contra polaridade invertida e os empalmes alimentam a entrada de bateria da placa principal e, através do conversor elevador, a linha de 5 V do anel de LED, do amplificador e da placa de interligação.
        caption: >-
          Esquema 2 de 2: bateria, interruptor geral e linha de 5 V.
  satellite:
    title: Caixa satélite
    what: >-
      Uma caixa pequena para um ponto secundário ou um farol: a placa da Field Box com dois botões
      de equipa grandes (pode ter um terceiro), um anel de LED que mostra a equipa que a tem, o
      pequeno ecrã da própria placa e uma célula 18650. Cerca de
      <span class="nowrap">30–40&nbsp;€</span> em peças (a estimativa do projeto). Corre o
      <strong>próprio firmware da Field Box</strong> com menos peças: o firmware avisa uma vez, ao
      arrancar, de cada peça que falta, e continua.
    plays: >-
      Sem teclado, não escolhe um jogo sozinha: joga os jogos para que um
      <a href="{{ page.to.glossary }}#glossario-controlador-de-campo">controlador de campo</a> a
      convida, como satélite ou como mestre do
      <a href="{{ page.to.modes }}#master-satellites">Mestre e Satélites</a>, ou como zona de
      qualquer modo que só precise de botões de equipa (Domínio, Domínio Total, Último Elemento).
      Entra num campo pelo cabo USB ou pelo código de emparelhamento que mostra no pequeno ecrã (não
      tem leitor NFC para o cartão de campo).
    parts:
      board: >-
        Placa Heltec WiFi LoRa 32 V4, revisão V4.2 ou V4.3, 863–928&nbsp;MHz, sem a caixa de plástico.
      antennas: >-
        Uma antena de 868&nbsp;MHz com 2&nbsp;dBi ou menos (a do kit da placa) e uma antena de
        2,4&nbsp;GHz, obrigatória: a primeira configuração, a descarga de modos e as atualizações de
        firmware usam o Wi-Fi.
      buttons: >-
        Dois (ou três) botões arcade de 60&nbsp;mm com LED de 5&nbsp;V.
      ring: >-
        Um anel de LED WS2812B (24 LED por omissão; 12 ou 16 com uma definição do firmware), com o
        conversor de nível 74AHCT125, uma resistência de 330&nbsp;Ω e um condensador de
        1000&nbsp;µF, numa pequena placa perfurada.
      gauge: >-
        Um medidor de bateria MAX17048, recomendado: sem ele, a caixa nunca sabe quanta bateria tem.
      power: >-
        Uma célula 18650 protegida num suporte (ou uma bateria 1S com placa de proteção), um fusível
        de 5&nbsp;A, um díodo Schottky, um interruptor principal tapado, um conversor elevador de
        5&nbsp;V para o anel e ligadores de alavanca: a alimentação da Field Box com uma só célula.
      sound: >-
        Som, se quiseres: o amplificador MAX98357A da Field Box e um altifalante pequeno.
      box: >-
        Uma caixa de plástico IP65 de cor viva, com respiro e bucins, e rótulos «GAME PROP».
    free_pins: >-
      O firmware continua a comandar os pinos do ecrã da Field Box (GPIO 1, 3, 33 e 47): deixa-os
      sem ligação.
    diagram_ref: >-
      A ligação da caixa satélite é um subconjunto da da Field Box: segue os <a href="#field-box-wiring">esquemas de ligações da Field Box</a> e deixa de fora as peças que esta montagem não tem (o ecrã a cores, o teclado e o leitor NFC). Um esquema próprio ainda não existe.
    steps:
      revision: >-
        Lê o chip ao lado do conector da antena LoRa da placa: KCT8103L é uma V4.3 (a do firmware
        por omissão), GC1109 uma V4.2. Monta e identifica as duas antenas antes de a placa receber
        corrente pela primeira vez.
      enclosure: >-
        Planeia a caixa em papel e fura todos os buracos antes de entrar qualquer eletrónica: botões
        e anel na tampa, o interruptor embutido ou tapado, um respiro em baixo.
      power: >-
        Monta a alimentação sem a placa: célula, fusível, díodo, interruptor, ligadores; regula o
        conversor elevador para 5,0–5,2&nbsp;V sozinho, antes de lhe ligares seja o que for.
      hub: >-
        Monta a pequena placa de ligações: as linhas 3V3, GND e 5V (e SDA e SCL para o medidor) e o
        conversor de nível, como no manual da Field Box.
      wiring: >-
        Liga os botões (a GND quando premidos), o anel através do conversor de nível, o medidor e o
        amplificador opcional, pelos pinos acima.
      check: >-
        Verifica com o multímetro, sem a célula: nenhum curto-circuito entre linhas, cada botão só
        quando premido, a polaridade do cabo de bateria da placa.
      flash: >-
        Compila e grava o firmware da Field Box como diz o manual, para a revisão da tua placa e o
        número de LED do teu anel.
      bring_up: >-
        Faz os passos da lista de arranque que se aplicam a uma caixa satélite: arranque, botões,
        LED, bateria, e o rádio e a sua potência de emissão antes de qualquer jogo.
      field: >-
        Dá-lhe um nome, a região e o PIN de administração na página de configuração Wi-Fi, a partir
        de um telemóvel, adota-a no teu campo pelo cabo USB ou pelo código de emparelhamento, e
        convida-a para um jogo na consola da organização.
    photo: a caixa satélite acabada, por dentro e por fora.
    open:
      buzzer: >-
        <strong>O besouro piezoelétrico</strong> do desenho original: o firmware só faz som através
        do amplificador, por isso um besouro precisaria de uma alteração ao firmware.
      enclosure: >-
        <strong>A caixa</strong>: ainda não se escolheu nenhuma.
      runtime: >-
        <strong>A autonomia</strong> com uma célula: por medir.
      diagram: >-
        <strong>Um esquema de ligações próprio</strong>: para já, os esquemas da Field Box mostram
        todos os fios que uma caixa satélite tem.
    full: >-
      O guia completo (em inglês):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/satellite/BUILD.pt.md">guia
      de montagem da caixa satélite</a>.
  pod:
    title: Módulo de E/S
    what: >-
      A caixa que empresta a um
      <a href="{{ page.to.glossary }}#glossario-dispositivo-android">dispositivo Android</a> o que
      falta a um telemóvel: botões de equipa grandes, teclado, anel de LED, som, leitor NFC, um
      interruptor que avisa quando a caixa é aberta, e um rádio LoRa. O telemóvel corre o modo de
      jogo; o módulo é as suas mãos e o seu rádio, por cabo USB ou Bluetooth. É o hardware da Field
      Box sem o ecrã a cores, com o firmware do módulo, que já foi testado num computador mas ainda
      não numa placa. Cerca de <span class="nowrap">35&nbsp;€</span> em peças (a estimativa do
      projeto).
    lends: >-
      Tirando a placa, todas as peças são opcionais: o módulo diz ao telemóvel o que tem, e o
      telemóvel só usa isso. O botão 1 é a primeira equipa do jogo, como numa Field Box. Uma caixa
      aberta chega à consola da organização como alerta de violação.
    parts:
      same: >-
        As peças da Field Box, menos o ecrã: a placa, os botões (até quatro), o teclado e o seu
        expansor PCF8574, o anel de LED com o conversor de nível, o leitor NFC PN532, o amplificador e
        o altifalante, o medidor de bateria e a mesma alimentação de uma célula.
      antennas: >-
        As duas antenas: LoRa, e 2,4&nbsp;GHz para o Bluetooth.
      switch: >-
        Um microinterruptor que a tampa fechada mantém premido: o interruptor da caixa.
      usb: >-
        Uma tomada USB-C de painel com linhas de dados (não só de carga) para o cabo do telemóvel, e
        um cabo USB-C OTG para o telemóvel.
      uart: >-
        Só na bancada: um adaptador USB-série de 3,3&nbsp;V para ler o registo do módulo.
    free_pins: >-
      O módulo não usa os outros pinos do ecrã da Field Box (GPIO 1, 3 e 33): deixa-os sem ligação.
    diagram_ref: >-
      A ligação do módulo é a da Field Box sem o ecrã: segue os <a href="#field-box-wiring">esquemas de ligações da Field Box</a> e deixa de fora o ecrã e os seus fios. Um esquema próprio ainda não existe.
    steps:
      like_box: >-
        Monta-o como uma Field Box sem o ecrã: revisão da placa, antenas, caixa, alimentação, placa
        de ligações, e depois o teclado, o anel, o leitor NFC, os botões e o amplificador que
        puseres, cada um com as verificações do manual.
      switch: >-
        Fixa o microinterruptor de forma a que a tampa fechada o prima, e liga-o entre o GPIO 47 e
        GND. O módulo só o vigia depois de o ler fechado uma vez, por isso um módulo sem interruptor
        nunca dá alarme.
      flash: >-
        Compila o firmware do módulo (<code>python tools/docker_fw.py pod</code>) e grava-o a partir
        da pasta <code>build-pod</code>, como o da Field Box.
      log: >-
        Lê o registo no GPIO 43 com o adaptador USB-série: a porta USB-C leva a ligação do módulo ao
        telemóvel, não o registo.
      link: >-
        Na app, liga-o por um cabo USB-C OTG e depois por Bluetooth (o Android pede o emparelhamento
        uma vez).
      bring_up: >-
        Faz as verificações de arranque do módulo, incluindo a potência de emissão do rádio antes de
        qualquer jogo.
    photo: o módulo acabado, com o interruptor da caixa, e o telemóvel ligado a ele.
    open:
      siren: >-
        <strong>Uma sirene ou um estroboscópio à parte</strong>: o som do módulo é o seu amplificador;
        comandar outras cargas não faz parte do firmware.
      phone_power: >-
        <strong>A alimentação pelo telemóvel</strong>: por cabo, o telemóvel alimenta o módulo e pode
        carregar-lhe a célula. Se deve fazê-lo, e quanta corrente um telemóvel dá, fica para
        verificar na primeira montagem.
      enclosure: >-
        <strong>A caixa</strong>, e a forma de levar o telemóvel e o módulo juntos.
      settings: >-
        <strong>As definições a partir do telemóvel</strong>: as cores dos botões, o número de LED e o
        resto definem-se, por agora, ao compilar o firmware.
    full: >-
      O guia completo (em inglês):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/io-pod/BUILD.pt.md">guia
      de montagem do módulo de E/S</a>, e as verificações do módulo com um telemóvel na
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md">lista
      de arranque</a>.
  target:
    title: Módulo de alvo
    status: >-
      Ainda não se pode montar: o lado da caixa já está decidido, o módulo em si ainda não. Não
      ligues uma placa de alvo a uma caixa a partir desta página.
    what: >-
      Uma placa onde se dispara, com um sensor que sente cada impacto. Liga-se a uma caixa e
      transforma-a num alvo que pontua, para as
      <a href="{{ page.to.modes }}#target-windows">Janelas de Alvo</a>, cujas regras já estão
      escritas e testadas no simulador; a janela aparece no anel de luz da própria caixa.
    decided_title: O que está decidido
    decided:
      parts: >-
        Uma placa de aço ou de policarbonato, um sensor piezoelétrico e um pequeno processador
        próprio (da classe RP2040 ou ATtiny) para detetar os impactos. Cerca de
        <span class="nowrap">20–30&nbsp;€</span> em peças (a estimativa do projeto).
      port: >-
        Liga-se a um conector M12 estanque de 5 pinos na caixa que só leva 3,3&nbsp;V: os 3,3&nbsp;V
        da placa, a massa e as duas linhas I2C; nada de 5&nbsp;V, e o quinto pino fica livre. Cabos
        até 2&nbsp;m. O seu processador diz à caixa o que é, por isso a caixa não precisa de um
        controlador novo para cada acessório.
      power: >-
        Pode tirar no máximo 25&nbsp;mA da caixa, através de um fusível rearmável: chega para o
        processador e o sensor, não para luzes. As Janelas de Alvo acendem o anel de LED da própria
        caixa; um módulo com luzes próprias precisa da sua própria bateria.
      polling: >-
        Sem linha de interrupção: a caixa lê o módulo por I2C a cada 20&nbsp;ms, cerca de 3&nbsp;%
        do barramento, e um impacto chega ao jogo em cerca de 21&nbsp;ms no máximo. Nenhum pino da
        caixa muda. O firmware da caixa já tem esta leitura, testada, à espera do módulo.
      capability: >-
        Os scripts dos modos recebem cada impacto com a sua força (de 0 a 255) e podem armar e
        desarmar o alvo. O mesmo está definido para o módulo de E/S de um telemóvel.
      mode: >-
        As Janelas de Alvo acendem o alvo na cor de uma equipa ao acaso durante alguns segundos; um
        impacto forte o suficiente nessa janela pontua para essa equipa.
      next: >-
        Seguem-se o firmware do próprio módulo, a caixa a usar a leitura da porta e o sensor afinado
        em placas reais de aço e de policarbonato; depois, as Janelas de Alvo passam a ser um modo
        que a caixa oferece.
    open:
      mcu: O processador (RP2040 ou ATtiny, dentro dos 25&nbsp;mA) e o seu firmware.
      protocol: >-
        O endereço I2C do módulo e como diz o que é; a forma de comunicar um impacto tem um
        rascunho, que fica definitivo com o primeiro módulo.
      checks: >-
        As verificações da primeira montagem: as resistências de pull-up do barramento com
        2&nbsp;m de cabo, o fusível, e a proteção do conector contra a eletricidade estática e a
        água.
      sensor: O circuito do sensor e a sua fixação, e a placa, o suporte e o ângulo.
    safety_title: A segurança, quando houver alguma coisa para montar
    safety:
      eyes: >-
        <strong>Proteção de olhos e cara</strong> para toda a gente ao alcance enquanto alguém
        dispara contra ele, também na bancada.
      ricochet: >-
        <strong>As BBs fazem ricochete numa placa dura</strong>, e algumas voltam para trás: inclina
        uma placa de aço para as mandar para o chão, nunca de frente para quem dispara.
      shield: >-
        <strong>Só a placa é alvo</strong>: nunca dispares contra a caixa, o cabo ou o conector, e
        mantém a eletrónica atrás da placa ou numa caixa própria.
      limits: >-
        <strong>Os limites de potência do campo</strong> valem para disparar contra alvos como contra
        quem joga.
    photo: o alvo acabado, a placa e o sensor, e a porta numa caixa.
    full: >-
      O que está decidido, com os documentos por trás de cada decisão (em inglês):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/target-addon/BUILD.pt.md">guia
      do módulo de alvo</a>.

hub:
  title: Espaço da comunidade
  intro: >-
    É aqui que se vão encontrar campos, equipas e quem constrói o seu próprio material. Tudo é
    opcional: o espaço guarda só o que cada um decide publicar, e os dados de jogo ficam nos
    servidores de cada campo.
  open: Aberto
  planned: Previsto
  later: Mais tarde
  discussion:
    title: Discussão
    text: Perguntas, ideias, comentários à especificação e relatos de eventos.
    link: Ir para as Discussions
  gallery:
    title: Galeria de montagens
    text: >-
      Fotografias, listas de material, ficheiros dos invólucros e esquemas de ligações de cada
      montagem, a começar pelos primeiros protótipos da Field Box.
  directory:
    title: Lista de campos e equipas
    text: >-
      Uma lista, só para quem se quiser inscrever, dos campos e equipas que usam a Atalaia, com a
      região, o tipo de espaço e um contacto.
  browser:
    title: Catálogo de modos e cenários
    text: >-
      O <a href="https://vakaobr.github.io/atalaia-modes/">registo de modos</a> já existe, ainda sem modos: sê a primeira pessoa a
      partilhar um. Um catálogo com descrições e avaliações da comunidade vem depois.
  stats:
    title: Estatísticas de utilização
    text: >-
      Totais anónimos de versões, plataformas e modos jogados, só para quem aderir. Desligadas por
      omissão.
  hosting:
    title: Servidores de clube alojados
    text: >-
      Para clubes sem apoio informático, a preço de custo, com os dados de cada clube separados e
      exportáveis.

# Each entry: id (the anchor, stable ASCII), term (as shown) and text (1-3 sentences).
glossary:
  id: glossario
  title: Glossário
  intro: >-
    Os termos técnicos destas páginas, explicados em linguagem simples. As ligações no texto de
    cada página trazem-te até aqui.
  groups:
    game: O jogo
    hardware: Hardware
    radio: Rádio e ligações
    software: Software
    licences: Licenças
  props:
    id: glossario-dispositivos
    term: Dispositivos de jogo (props)
    text: >-
      Os aparelhos eletrónicos de um jogo: caixas para capturar, bombas para armar e desarmar,
      terminais de hacking, alvos onde acertar. Na Atalaia, qualquer aparelho pode servir: uma
      caixa feita de propósito, um telemóvel ou uma pequena placa.
  field_box:
    id: glossario-field-box
    term: Field Box e Satélite
    text: >-
      Os dispositivos de referência da Atalaia, montados à volta de um ESP32 com peças fáceis de
      comprar. A Field Box é a principal, com botões arcade grandes, teclado, ecrã, luzes,
      altifalante e leitor NFC numa caixa estanque, por cerca de
      <span class="nowrap">70–110&nbsp;€</span> em peças; o Satélite é uma caixa mais pequena para
      um ponto secundário, por cerca de <span class="nowrap">30–40&nbsp;€</span>. O firmware e o
      manual de montagem da Field Box já estão prontos; os primeiros protótipos esperam pelas peças
      (fase&nbsp;1).
  milsim:
    id: glossario-milsim
    term: Milsim
    text: >-
      Abreviatura de <em>military simulation</em>, simulação militar: jogos longos, muitas vezes de
      um fim de semana inteiro, com missões, cadeia de comando e regras realistas. É o maior teste
      para a Atalaia: 10 a 20 caixas e satélites espalhados por uma área grande.
  cqb:
    id: glossario-cqb
    term: CQB
    text: >-
      <em>Close quarters battle</em>, combate a curta distância: jogos dentro de casas, palacetes,
      armazéns e outros espaços apertados, normalmente com menos de uns 150&nbsp;m de um lado ao
      outro. Como tudo é perto e rápido, o perfil CQB da Atalaia usa tempos de captura e de bomba
      mais curtos e põe as caixas numa planta do espaço em vez de usar GPS.
  chrono:
    id: glossario-cronografagem
    term: Cronografagem e joules
    text: >-
      O cronógrafo mede a velocidade a que uma réplica dispara uma BB. Da velocidade e do peso da
      BB sai a energia em joules, que os campos limitam por tipo de réplica: uma BB de 0,20&nbsp;g a
      100&nbsp;m/s (cerca de 328&nbsp;fps) leva 1 joule. A Atalaia guarda as medições de cada
      réplica, assinadas pelo marshal, para os marshals poderem fazer verificações aleatórias
      durante o dia (já feito em software, ainda não usado num campo); qualquer penalização é sempre
      decidida por uma pessoa.
  microcontroller:
    id: glossario-microcontrolador
    term: Microcontrolador
    text: >-
      Um computador completo e minúsculo num só chip, feito para correr um único programa. Arranca
      num instante, gasta muito pouca bateria e é barato, por isso é o cérebro habitual de um
      dispositivo de jogo eletrónico. As placas ESP32 e Arduino são placas de microcontrolador.
  esp32:
    id: glossario-esp32
    term: ESP32
    text: >-
      Um microcontrolador barato e muito popular, com Wi-Fi e Bluetooth incorporados; muitas placas
      trazem também um rádio LoRa. É o cérebro da Field Box, do Satélite e do módulo de E/S, e
      deverá aguentar um dispositivo em jogo de um a três dias com uma bateria (uma estimativa,
      ainda por medir). As placas que já tens também
      servem, mesmo sem memória extra (PSRAM), com algumas limitações.
  arduino:
    id: glossario-arduino
    term: Placa tipo Arduino, nó simples
    text: >-
      Placas de microcontrolador simples e muito baratas, ao estilo do Arduino, como as de chips
      AVR ou RP2040. São pequenas demais para correr modos de jogo, por isso na Atalaia funcionam
      como nós simples: emprestam os botões, as luzes ou os sensores a uma caixa próxima ou ao
      controlador de campo, que corre as regras por elas.
  raspberry_pi:
    id: glossario-raspberry-pi
    term: Raspberry Pi
    text: >-
      Um computador pequeno e barato, mais ou menos do tamanho de um cartão de crédito, que corre
      Linux. Com uma placa de rádio LoRa, vai ser o controlador de campo habitual (cerca de
      <span class="nowrap">80–150&nbsp;€</span> a montagem completa), e também pode servir de dispositivo com ecrã grande ou
      câmara.
  android:
    id: glossario-dispositivo-android
    term: Dispositivo Android e módulo de E/S
    text: >-
      A app da Atalaia transforma um telemóvel ou tablet Android, novo ou um que esteja na gaveta,
      de 2017 em diante, num dispositivo de jogo que corre qualquer modo no ecrã. Os telemóveis não
      têm rádio LoRa e os ecrãs táteis custam a usar com luvas, por isso uma pequena caixa ESP32, o
      módulo de E/S (entrada e saída), liga-se por cabo ou Bluetooth para juntar o rádio, botões
      grandes, luzes e uma sirene. Ambos estão feitos em software (fase&nbsp;3) e testados em
      emuladores e num computador, ainda não num telemóvel ou num módulo a sério.
  firmware:
    id: glossario-firmware
    term: Firmware e gravar firmware
    text: >-
      O firmware é o programa que vem dentro de um aparelho e arranca quando o ligas. Gravar
      firmware (<em>flashing</em>, em inglês) é escrever uma versão nova desse programa no
      aparelho, normalmente por um cabo USB. As caixas da Atalaia gravam-se por cabo, e por agora
      um modo de jogo novo chega com uma nova gravação; mais tarde, os modos vão chegar como scripts.
      As atualizações do firmware já vêm do controlador de campo por Wi-Fi (feitas em software, ainda
      não experimentadas numa placa real), e desfazem-se sozinhas se a versão nova não arrancar.
  lora:
    id: glossario-lora
    term: LoRa
    text: >-
      De <em>long range</em>, longo alcance: um rádio que envia mensagens pequenas para longe
      gastando muito pouca energia, sem cartão SIM, rede móvel ou assinatura. Num campo típico
      deverá chegar a cerca de <span class="nowrap">0,5–2&nbsp;km</span> (uma estimativa do projeto,
      ainda por medir) e atravessa paredes grossas melhor do que o Wi-Fi. O senão: as mensagens têm de ser curtas e cada aparelho só pode emitir
      durante uma pequena parte do tempo. A Atalaia usa por omissão 869,525&nbsp;MHz, na única
      sub-banda EU868 que permite 10% de ciclo de trabalho e 500&nbsp;mW, o que dá a cada caixa até
      6 minutos de emissão por hora — suficiente para eventos, pontuações e balizas de
      sincronização de tempo, com margem de sobra. Um campo pode escolher outro canal, que permite
      1% do tempo ou menos e 25&nbsp;mW. As caixas só enviam o que muda, como «o vermelho capturou a&nbsp;B».
  mesh:
    id: glossario-mesh
    term: Rede mesh
    text: >-
      Uma rede em que os aparelhos passam as mensagens uns aos outros, por isso uma caixa demasiado
      longe da base é ouvida através das que estão no meio. A Atalaia só repete cada mensagem um
      par de vezes, para o rádio não entupir, e a organização pode pôr caixas extra a servir de
      repetidores em terrenos difíceis.
  skirmesh:
    id: glossario-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      O protocolo de rádio da própria Atalaia: o formato combinado em que as caixas, o controlador
      e as apps trocam mensagens, seja por LoRa, Wi-Fi ou Bluetooth. Está documentado
      publicamente, por isso qualquer pessoa pode construir um aparelho que entre no jogo, e cada
      mensagem é cifrada e assinada com uma chave própria daquele jogo, para que ninguém consiga
      simplesmente forjar uma captura com um rádio. Já está feito e testado em software, ainda não
      num campo.
  links:
    id: glossario-wifi-ble-nfc-qr
    term: Wi-Fi, BLE, NFC e códigos QR
    text: >-
      As ligações de curto alcance do dia a dia, cada uma com a sua função. O Wi-Fi (cerca de
      <span class="nowrap">50–150&nbsp;m</span>) leva o que é pesado: a consola da organização, a
      app de jogador, modos novos e atualizações; o BLE, ou Bluetooth Low Energy
      (<span class="nowrap">10–30&nbsp;m</span>), liga um telemóvel ao seu módulo e
      emparelha aparelhos. O NFC é encostar e ler, como um cartão contactless, para etiquetas de
      equipa, pulseiras e cartões de entrada no jogo, e os códigos QR leem-se com a câmara do
      telemóvel para entrar num jogo ou introduzir um código.
  api:
    id: glossario-api
    term: "API: MQTT, REST e WebSocket"
    text: >-
      Uma API é uma forma documentada de outros programas lerem um jogo e, com autorização, o
      controlarem. Com ela, um clube vai poder ligar um marcador LED grande, mostrar a pontuação em
      direto numa transmissão, receber alertas no Discord ou no Telegram, ou ter um relé que
      dispara fumo e sirenes quando a bomba rebenta. MQTT, REST e WebSocket são três maneiras
      padrão de lá chegar, por isso funcionam com ferramentas comuns. O controlador de campo já a
      tem desde a fase&nbsp;2, com uma página de marcador pronta a usar; foi testada num computador
      e ainda não num campo.
  atak:
    id: glossario-atak
    term: ATAK
    text: >-
      O <em>Android Team Awareness Kit</em>: uma app de mapas feita para os militares, com uma
      versão civil gratuita que muitas equipas de milsim usam para ver os colegas num mapa
      partilhado. O controlador de campo da Atalaia vai poder mostrar as caixas nesses mapas, e que
      equipa tem cada uma (fase&nbsp;4).
  local_first:
    id: glossario-sem-internet
    term: Funciona sem internet (local-first)
    text: >-
      Tudo o que um jogo precisa corre no próprio campo, nas caixas e no controlador de campo, por
      isso funciona sem internet nem rede móvel. Quando há internet, só acrescenta extras, como
      contas e o histórico dos jogos. Uma caixa que perca a ligação continua a jogar e a contar
      pontos, e põe-se em dia quando a ligação volta.
  core:
    id: glossario-nucleo
    term: Núcleo partilhado (C11)
    text: >-
      O coração da Atalaia: um único programa, escrito na linguagem de programação C (na versão de
      2011, daí C11), que todos os aparelhos que correm modos de jogo usam. Trata dos eventos, das
      pontuações e das mensagens de rádio e corre os modos de jogo em segurança; cada tipo de
      hardware só lhe junta uma camada fina, com os drivers que fazem funcionar os botões, o ecrã e
      o rádio. Já existe hoje.
  lua:
    id: glossario-lua
    term: Lua e scripts de modos de jogo
    text: >-
      Um modo de jogo é um script: um pequeno ficheiro de texto com regras, como «manter premido
      5 segundos para capturar», escrito em Lua, uma linguagem de programação pequena, muito
      conhecida dos mods de videojogos. Os scripts correm numa sandbox, um espaço fechado sem
      acesso a ficheiros nem à rede, por isso um modo partilhado não pode estragar um aparelho. A
      organização nunca precisa de mexer em Lua: escolhe um modo e preenche as definições, e um
      editor visual, por blocos, chega na fase&nbsp;5.
  simulator:
    id: glossario-simulador
    term: Simulador
    text: >-
      Um programa que joga um modo de jogo com caixas virtuais no browser: carregas nos botões das
      equipas no ecrã e vês o ecrã de cada caixa e o registo de eventos. Corre num computador
      normal e já existe, por isso qualquer pessoa pode experimentar o Domínio e a Bomba antes de
      haver hardware.
  controller:
    id: glossario-controlador-de-campo
    term: Controlador de campo
    text: >-
      A base do jogo: um pequeno computador, normalmente um Raspberry Pi ou um aparelho Android,
      que ouve todas as caixas pelo rádio, corre as regras que envolvem várias caixas, guarda a
      pontuação oficial e serve a consola da organização aos telemóveis. Se falhar, as caixas
      continuam a jogar e outro aparelho capaz toma o lugar, e uma caixa sozinha também consegue
      correr um jogo sem ele. Já está feito (fase&nbsp;2) e testado num computador, ainda não num
      campo; pô-lo a correr num aparelho Android ainda está por fazer.
  server:
    id: glossario-servidor-do-site
    term: Servidor do site
    text: >-
      Um computador opcional, no campo ou alugado na internet, que guarda o que dura para lá de um
      jogo: contas de jogadores, histórico, o registo de cronografagem e os serviços por trás da app
      de jogador. Nenhum jogo fica à espera dele. Chega na fase 4, e o espaço da comunidade prevê
      servidores alojados, a preço de custo, para clubes sem apoio informático.
  open_source:
    id: glossario-codigo-aberto
    term: Código aberto e software livre
    text: >-
      O código-fonte, a receita legível de um programa, é público, e qualquer pessoa o pode usar,
      estudar, alterar e partilhar, mesmo para fins comerciais. «Livre» quer dizer liberdade, não
      preço: os campos podem cobrar entrada e os makers podem vender caixas.
  copyleft:
    id: glossario-copyleft
    term: "Copyleft: GPL e AGPL"
    text: >-
      A regra que mantém a Atalaia aberta: usá-la tal como está não te obriga a nada, mas quem
      passar a outros uma versão alterada tem de partilhar o código-fonte com a mesma licença. A
      GPL, para o núcleo, o firmware, a app e os modos, aplica-se quando dás ou vendes cópias; a
      AGPL, para o controlador de campo e o servidor do site, aplica-se também quando pões uma
      versão alterada a funcionar para outras pessoas através de uma rede. O hardware (CERN-OHL-S)
      e a documentação (CC BY-SA) seguem a mesma ideia.

involved:
  title: Participa
  intro: "A Atalaia é feita por jogadores, donos de campos e makers. Já hoje podes ajudar:"
  review: >-
    a rever a
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">especificação
    técnica</a> (em inglês) e a <a href="https://github.com/vakaobr/atalaia-project/issues">abrir
    issues</a>;
  propose: >-
    a propor modos de jogo com o
    <a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">modelo de ideia de modo
    de jogo</a>;
  share: a contar como se joga no teu campo, para que as predefinições sirvam jogos reais;
  code: >-
    a escrever código: começa pelo
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>.
  rules: >-
    Cada commit leva uma linha <code>Signed-off-by</code>, e o projeto é rigorosamente
    <em>clean room</em>, feito de raiz: nenhum código, firmware, manual, som ou imagem de qualquer
    produto comercial.

name:
  title: O nome
  badge_alt: >-
    O emblema da Atalaia: três torres de vigia sobre dunas, com fogos de sinal no topo ligados por
    um arco, por cima da palavra ATALAIA.
  word: >-
    Uma <em>atalaia</em> é uma torre de vigia: um posto de observação no alto de um monte ou à
    beira-mar, de onde se vigiava o horizonte e se passava o aviso. A palavra chegou ao português
    vinda do árabe <em>aṭ-ṭalāʾiʿ</em>, «os batedores», e ainda hoje se diz que alguém está
    <em>de atalaia</em> quando está atento ao que aí vem. Há atalaias espalhadas pela costa e pelo
    interior do país, e várias terras com o nome.
  fit: >-
    Um controlador de campo vê todos os dispositivos em jogo e avisa a organização mal alguma coisa
    muda. As atalaias também não dependiam de ninguém: trabalhavam com o que tinham à vista. E
    foram a primeira rede mesh de pouca largura de banda: fumo de dia, fogo à noite, passados de
    torre em torre. O Skirmesh-RF segue as mesmas regras, com LoRa.

safety:
  title: Segurança no campo
  text: >-
    Os dispositivos da Atalaia são equipamento de jogo, e devem parecê-lo: cores vivas, etiquetas
    bem visíveis a dizer «EQUIPAMENTO DE JOGO» ou «GAME PROP», e nada que se pareça com um engenho
    explosivo verdadeiro. Transporta-os em malas identificadas, nunca os deixes sem vigilância fora
    do campo e trata as baterias de lítio com cuidado.

footer:
  licences: >-
    A Atalaia é software livre: GPL-3.0-or-later para o núcleo, o firmware, a app e os modos;
    AGPL-3.0-or-later para o controlador de campo e o servidor do site; CERN-OHL-S-2.0 para o
    hardware; CC BY-SA 4.0 para a documentação e esta página.
  flags: >-
    Bandeiras dos idiomas: Twemoji Country Flags, arte do Twemoji (Twitter, Inc e colaboradores), CC BY 4.0, reduzida a quatro bandeiras.
  flags_licence: CC BY 4.0
  licensing: Licenças
  manuals: Manuais para quem joga, a organização, os marshals e quem opera as caixas
  independent: >-
    Projeto independente e feito pela comunidade, sem ligação a nenhum fabricante comercial de
    dispositivos de jogo. Esta página não usa cookies nem carrega nada de outros sites.
  privacy: Aviso de privacidade (rascunho)
  privacy_note: >-
    O aviso que um servidor do site mostra a quem joga; este texto é um modelo de rascunho para operadores, ainda não revisto por um jurista.
  privacy_href: https://github.com/vakaobr/atalaia-project/tree/main/docs/templates

# Os dois diagramas do rádio: site/src/diagrams/*.svg, gerados em site/img/diagrams/.
# Texto simples, não HTML. Cada texto tem um espaço fixo no desenho; se uma
# tradução não couber, tools/build_site.py diz qual é a chave e a linha.
diagrams:
  lora:
    title: Como funciona o rádio LoRa
    desc: >-
      Cinco painéis. Chirps: o LoRa envia cada símbolo como um tom que varre o canal, e um recetor
      que conhece o padrão consegue lê-lo mesmo abaixo do ruído de fundo, por isso chega longe com
      pouca energia mas só leva mensagens curtas. Fator de espalhamento: cada passo acima de SF7
      quase duplica o tempo que uma mensagem passa no ar, para um pouco mais de alcance; as caixas
      usam SF7. Alcance: maior em campo aberto e à vista, menor através de mato, pessoas e
      viaturas, muito menor dentro de edifícios, e cortado por betão, metal ou um monte, onde uma
      caixa pelo meio pode repetir; os 868 MHz passam os obstáculos melhor do que o Wi-Fi ou o
      Bluetooth a 2,4 GHz. A estimativa do projeto, cerca de 0,5 a 2 km num campo típico ao ar
      livre, ainda vai ser medida no teste de campo da fase 2. Repetição: uma caixa fora do
      alcance do controlador é ouvida através das outras, e cada mensagem é repetida no máximo
      duas vezes, por omissão. Regras na Europa: um canal de jogo partilhado, 869,525 MHz por omissão, a
      única parte da banda que permite 500 mW e 10% do tempo, 6 minutos por hora para cada
      aparelho; os outros canais permitem 25 mW e 1% ou menos.
    chirp:
      title: "Chirps: ouvidos abaixo do ruído"
      sweep: um chirp varre o canal
      noise: ruído
      below: lido mesmo abaixo do ruído
      text: >-
        O recetor conhece o padrão e ouve-o abaixo do ruído: chega longe com pouca energia, mas é
        lento, e as mensagens são curtas.
    sf:
      title: Fator de espalhamento (SF)
      axis: Tempo no ar para a mesma mensagem
      text: >-
        Cada passo acima quase duplica o tempo no ar e ganha algum alcance. As caixas usam SF7; o
        projeto prevê SF9–10 em campos grandes.
    range:
      title: Campo aberto ou interiores
      axis: Até onde chega (esboço, sem escala)
      open: Campo aberto, à vista
      woods: Mato, pessoas, viaturas
      walls: "Interiores: paredes de tijolo e pedra"
      blocked: Betão, metal, atrás de um monte
      relay: → uma caixa a repetir ajuda
      text: >-
        Os 868 MHz passam paredes, pessoas e folhagem melhor do que o Wi-Fi ou o Bluetooth a
        2,4 GHz; betão, metal e montes cortam muito.
      note: >-
        Estimativa do projeto: cerca de 0,5–2 km num campo típico ao ar livre. O teste de campo da
        fase 2 vai medi-lo.
    relay:
      title: As caixas repetem as mensagens
      controller: Controlador
      box_a: A caixa A repete
      box_b: Caixa B
      text: >-
        Uma caixa fora do alcance do controlador é ouvida através das outras. Por omissão, cada
        mensagem é repetida no máximo duas vezes (o limite de saltos), para o canal não entupir.
    rules:
      title: Regras do ar na Europa (EU868)
      hour: 1 hora
      share: Cada aparelho só pode emitir 10% do tempo, 6 minutos por hora.
      text: >-
        Um canal partilhado, 869,525 MHz por omissão: a única parte da banda com 500 mW e 10%.
        Outros canais: 25 mW, 1% ou menos. Sem licença nem cartão SIM.
  skirmesh:
    title: Skirmesh-RF em vários aparelhos
    desc: >-
      À esquerda, as cinco camadas do Skirmesh-RF, de baixo para cima: 1, o rádio LoRa num canal de
      jogo partilhado; 2, o pacote Skirmesh-RF, com cifra AES-128-CCM e uma chave para cada jogo,
      números de época e de sequência contra reenvios, um limite de saltos para a repetição (duas, por omissão), ACK,
      balizas TIME e CLAIM para trocar de controlador; 3, as mensagens HELLO, EVENT, ACK, STATE,
      CMD, TIME, CONFIG e CLAIM em CBOR; 4, o núcleo partilhado em C e os modos de jogo em Lua; 5,
      as APIs REST, WebSocket e MQTT do controlador de campo, a consola da organização, o marcador
      e a entrada no jogo por cartão NFC (caixas) ou código QR (controlador de reserva e, na fase 3,
      telemóveis). À direita, que camadas corre cada aparelho.
      Feitos e testados em software, ainda não no campo: a Field Box (camadas 1 a 4), o modem de
      rádio USB (1 e 2) e o controlador de campo num Raspberry Pi ou PC (2 a 5), e a consola da
      organização nos telemóveis por Wi-Fi, que usam a camada 5 sem rádio LoRa. Também feitos em
      software, para a fase 3: o módulo de E/S (1 e 2) que dá rádio a um telemóvel ou tablet
      Android (2 a 4), e a app de jogador. Prevista: a caixa satélite (1 a 4).
    stack: Um protocolo, por camadas
    l5:
      title: Serviços do controlador de campo
      text: >-
        APIs REST, WebSocket e MQTT, consola da organização e marcador; entrada no jogo por cartão
        NFC (caixas) ou QR (controlador de reserva; telemóveis na fase 3).
    l4:
      title: "Jogo: núcleo partilhado, modos Lua"
      text: >-
        O mesmo núcleo em C e os mesmos modos em Lua correm em todos os aparelhos que jogam: as
        regras da zona nas caixas, as do campo no controlador.
    l3:
      title: Mensagens
      text: >-
        HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG e CLAIM, em CBOR compacto. Por Wi-Fi, os mesmos
        eventos viajam em JSON.
    l2:
      title: Pacote Skirmesh-RF
      crypto: Cifra AES-128-CCM, uma chave por jogo
      replay: "Época e sequência: reenvios recusados"
      hops: "Limite de saltos: até 2, por omissão"
      acks: "ACK: eventos perdidos são reenviados"
      time: Balizas TIME acertam os relógios
      claim: "CLAIM: a reserva pode assumir o jogo"
    l1:
      title: Rádio LoRa
      text: Um canal de jogo partilhado, 869,525 MHz por omissão, que todos escutam.
    devices: Que camadas corre cada aparelho
    cells: "A cor: as camadas que corre"
    box_sub: ESP32-S3 e um rádio LoRa SX1262
    satellite: Caixa satélite
    satellite_sub: "Prevista: uma caixa ESP32 mais pequena"
    modem: Modem de rádio USB
    modem_sub: "Liga-se ao controlador: rádio e cifra"
    controller: Controlador de campo
    controller_sub: "Raspberry Pi ou PC: o jogo e a API"
    pod: Módulo de E/S
    pod_sub: "Fase 3: dá rádio e botões a um telemóvel"
    android: Aparelho Android
    android_sub: "Fase 3: telemóvel ou tablet corre os modos"
    wifi: Telemóveis por Wi-Fi
    wifi_sub: Consola da organização e app de jogador
    legend: >-
      Contínuo: feito e testado num computador e num emulador, ainda não no campo. Tracejado:
      previsto. Os telemóveis por Wi-Fi usam a camada 5 e não precisam de rádio LoRa.

# The "How it fits together" page (site/src/architecture.html): its texts, then the labels
# of the seven Mermaid diagrams (site/src/diagrams/arch-*.mmd), drawn into SVGs by
# tools/render_diagrams.py. After changing a label, run it again. A label may not hold
# a double quote, a backtick, a semicolon or a hash. arch.tNNN: the English text is in en.yaml;
# the same text has the same key. **x** is bold, \n a line break, <br/> a line break in a plain label.
architecture:
  title: "Como tudo se liga"
  intro: "Que parte do Atalaia fala com que parte, por que ligação, e o que passa por ela. Debaixo de cada diagrama: o que circula e o que não circula."
  status: "O Atalaia está em pré-alfa. Em placas reais, numa bancada, já correram: arranque, rádio, botões e teclado, adoção, uma atualização por rádio e jogos inteiros com o controlador de campo. A app iOS passou a sua lista de verificação num iPhone. O resto está feito e testado só em software."
  reading: "Para ler o primeiro diagrama: uma linha contínua funciona sem internet no campo, uma linha tracejada precisa de internet."
  flows: "O que circula"
  not: "O que não circula"
  full: "Abrir o diagrama em tamanho real"
  scroll: "Diagrama largo: desliza para o lado."
  doc: "Os mesmos diagramas em Mermaid, com o texto completo e os pontos em que o desenho e o código diferem: docs/architecture.md no GitHub →"
  link_roadmap: "Como as partes falam entre si: os diagramas da arquitetura →"
  link_build: "Não sabes o que liga a quê? Vê como as partes falam entre si →"
  d1:
    title: "O sistema completo"
    flows: "O tráfego do jogo fica no campo. As caixas e o controlador falam por LoRa através do modem USB. A consola do GM, a app de quem joga, os props Android e os ficheiros que uma caixa vai buscar usam o Wi-Fi do próprio campo."
    not:
      - "Nada num jogo espera pela internet. O servidor do site é opcional."
      - "As posições de quem joga nunca vão por LoRa nem por MQTT."
      - "O servidor do site nunca se liga ao controlador: é sempre o controlador que abre a ligação."
      - "As caixas nunca falam com a internet. O controlador vai buscar os modos e uma pessoa carrega o firmware."
  d2:
    title: "As camadas de rádio"
    flows: "Cada pacote é cifrado e verificado com AES-128-CCM, com a chave do jogo. O modem sela e abre os pacotes, por isso o controlador e o modem falam em tramas simples pelo cabo. As caixas repetem os pacotes umas das outras."
    not:
      - "Nenhuma posição, nome, token, palavra-passe de Wi-Fi, imagem de firmware ou pacote de modo vai por LoRa."
      - "Os ficheiros grandes vão buscar-se por HTTPS. Só uma oferta curta ou um relatório de falha usa o LoRa."
  d3:
    title: "Um jogo, do convite ao fim"
    flows: "Uma caixa livre anuncia-se e o GM convida-a. A carga de entrada (id e chave do jogo, papel, equipas, canal) chega selada. O jogo só começa quando cada papel tem uma caixa. Depois as caixas enviam eventos e um STATE de 15 em 15 s."
    not:
      - "A consola do GM nunca fala LoRa: só fala com o controlador."
      - "A chave do jogo só viaja dentro do convite selado (ou num cartão), nunca num anúncio."
  d4:
    title: "Quem joga, no dia do jogo"
    flows: "Quem joga lê o cartaz, fixa a CA do campo, regista a presença e recebe um token. A app passa a seguir a transmissão em direto. Um marshal assina as leituras do cronógrafo no seu próprio telemóvel."
    not:
      - "As posições nunca vão por LoRa nem por MQTT, e nunca chegam a quem tem outro papel."
      - "Não é preciso internet: tudo isto funciona com o servidor do site desligado."
  d5:
    title: "Controlador e servidor do site"
    flows: "O controlador envia jogos, eventos, pontos, nós e registos do cronógrafo de 30 em 30 s durante um jogo e de 5 em 5 min entre jogos. Vai buscar agendas, inscritos e definições. Um fluxo leva a vista em direto e os comandos do GM remoto, que o controlador volta a verificar."
    not:
      - "O servidor do site nunca se liga ao controlador e nunca tem a chave do jogo, a chave de entrada nem tokens."
      - "Estar sem ligação é normal: os eventos esperam e seguem depois, por ordem."
      - "As posições só saem do controlador em dois casos opcionais (GM remoto, retransmissão ATAK remota), em memória."
  d6:
    title: "Pôr coisas numa caixa"
    flows: "As chaves de lançamento e de modos assinam os ficheiros, e as suas metades públicas estão incorporadas na caixa. Uma pessoa descarrega o firmware assinado e carrega-o no controlador. O controlador oferece a atualização por LoRa e a caixa vai buscá-la pelo Wi-Fi do campo. Uma caixa é adotada por cabo USB, cartão NFC ou código de emparelhamento."
    not:
      - "É a assinatura, e não o canal, que torna um ficheiro seguro: a caixa decide, com as chaves do seu próprio firmware, antes de escrever um byte."
      - "O controlador nunca descarrega firmware do GitHub."
      - "As chaves de lançamento e as chaves de modos são chaves separadas."
  d7:
    title: "Início de sessão e contas no servidor do site"
    flows: "Um token de acesso de curta duração e um token de renovação que é substituído a cada uso. As funções da equipa só valem numa sessão com segundo fator (TOTP ou chave de acesso). Um início de sessão social, sozinho, não é segundo fator."
    not:
      - "O controlador não usa estas contas: usa a chave de API do campo."
      - "Um fornecedor social só é contactado pelo navegador da pessoa e pelo servidor do site, nunca por um controlador, uma caixa ou um modem."
