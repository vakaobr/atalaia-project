  # The screenshot viewer (the dialog at the end of the main page).
  viewer:
    label: Screenshot
    prev: Previous screenshot
    next: Next screenshot
    close: Close
try:
  title: Try it today
  intro: >-
    No hardware is needed: the shared core runs on a computer. The simulator plays a mode in your
    browser: hold team buttons, watch each prop's screen and follow the event log. The commands
    below are typed in a terminal.
  compiler: With a C compiler
  docker: With Docker only
  then: >-
    Then open <code>http://localhost:8000</code>. You need Python 3.10+ with PyYAML. The
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">simulator
    guide</a> has every option.
  board:
    title: On a board
    text: >-
      The <a href="{{ page.to.glossary }}#glossary-firmware">firmware</a> of the Field Box, the USB
      radio modem and the I/O pod is written, and all three run in tests on a computer. The Field
      Box's and the modem's run on real Heltec V4.3 boards on the bench: a box joins the field
      controller's games over the radio, through a second board as its modem, plays them to the end
      and takes firmware updates over the air, its small screen showing the game; the pod's has not
      run on a board yet. To try a bare board without a box, there is a bench build of the firmware
      (keys over the USB cable). To build a box and flash it, follow the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">build
      manual</a>; the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">firmware
      guide</a> builds the modem and the pod too.
  app:
    title: On an Android phone
    text: >-
      Build the app's debug APK with Docker and install it on a phone with Android 8.0 or later, or
      on the Android emulator, as the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">app
      guide</a> explains. It has run on emulators, not yet on a real phone.
  manuals:
    title: Playing and running it
    text: >-
      Manuals for the people who use Atalaia, not for developers: for
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/README.md">players, organisers, marshals, box operators and the people who build the boxes</a>, in English
      and Portuguese, with a one-page quick start. They say what the software shows today and mark
      what has not been tried on a field.

roadmap:
  title: Roadmap
  intro: >-
    Six phases, each closed by a real field test: its gate. The software is ahead of the hardware: phases 1 to 3 are done in software (real boards play whole games on the bench, and the iOS app has passed its checklist on an iPhone); phases 4 and 5 are built in software. The gates wait for built boxes, field tests, a real server and the project's registry key.
  more: The full roadmap, with what each phase holds and its gate →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code).
  done: Done
  software: Software done
  # The parts of each phase on the roadmap page. Each phase: short (one line, also on the main
  # page), done (bullets), next (bullets), gate; a phase with a long done list also has groups
  # (g_*: title and items) that fold into a <details> under the first few bullets.
  part_done: What is done
  part_next: Next, and what it waits for
  part_more: Everything else that is done, by topic
  status_link: The phase's detailed status in the repository →
  p0:
    title: Foundations
    short: >-
      Shared core, Lua sandbox, Skirmesh-RF codec and browser simulator. Gate met.
    done:
      - Shared core, the game logic every platform runs.
      - <a href="{{ page.to.glossary }}#glossary-lua">Lua sandbox</a>, where the game modes' scripts run.
      - <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF codec</a>, the radio messages' format.
      - Browser simulator, which runs Domination and Bomb.
    gate: >-
      Gate: the simulator runs Domination and Bomb from Lua scripts. <strong>Met.</strong>
  p1:
    title: Single box
    short: >-
      Field Box firmware and a build manual; a real board plays whole games on the bench. Waiting
      for the first built box.
    done:
      - ESP32 firmware for the Field Box, with presets on the device, running in an emulator.
      - The box's small screen shows the hold bar, points and held time, in four languages.
      - A build manual with wiring diagrams.
      - "The first board (Heltec V4.3, 20 October 2026) on the bench: it boots, powers the radio,
        reads its buttons and plays whole games, Bomb included (arming, defusing, the timer running
        out), on its own small screen."
      - "The game-timer bar: while a timed game runs, a strip along the bottom of the small screen shows how much of it is left, and the OLED shows a clock. In software, not yet seen on a real panel."
      - "The setup a scenario sends to the boxes is sent again until each box confirms it, and the box now sends that confirmation. In software and host tests only, not on a real board."
      - "Change field in the box's admin menu moves an adopted box to another field, by its code. Host tests only, not on a real board."
      - "The field's logo on the box's big screen. In software, not yet seen on a real panel."
      - "A bigger partition table: the box's two firmware slots are 4 MB each (the image filled 93 % of 2 MB), with the settings and keys kept where they were. In host tests and builds only, not flashed on a board. A box on the old table needs one USB flash; after that, over-the-air updates work as before."
    next:
      - A built box that runs a 2-hour club game with no restarts.
      - "Seeing the timer bar on a real panel."
      - "Trying the setup re-send, Change field and the logo on a real board."
      - "Flashing the new partition table on a real board (one USB flash, no erase, for a box on the old one)."
    gate: >-
      Gate: one box runs a 2-hour club game with no restarts. <strong>Open</strong> until a built
      box does.
  p2:
    title: Field network
    short: >-
      Skirmesh-RF over LoRa, field controller, API, GM console and a mode pack, tested in software;
      on the bench, real boards play whole games with the controller over the radio. Waiting for 5
      built boxes on a field.
    done:
      - The encrypted Skirmesh-RF radio protocol, and the USB radio modem.
      - The field controller with its API.
      - The organisers' console, with a scoreboard.
      - Joining a game with an NFC card or a QR code.
      - The boxes' firmware talking to the controller.
      - "A mode pack: Hold-All Domination (score only while holding every box), Last Stand (a
        countdown to defeat while holding one of three), per-team arming codes on Bomb, and the
        Codes modifier (keypad codes that grant points, hints or unlocks, with the GM told who used
        them)."
      - "All of it tested in the simulator, the emulator and on a computer, whole games included; on
        the bench, real boards play whole games with the controller over the radio: invites,
        captures, pairing by code, updates over the air, a missing mode fetched."
      - "Boxes listen before they talk: a box checks the channel is free before it sends, so fewer
        messages collide. In the simulator, a 20-box field hears 89 % of updates instead of 65 %."
      - "The GM can set or free a box's owner in Domination too, as in the other modes."
      - "The controller can send its own radio frames one at a time, spaced out. Built, and off until the field test decides."
      - "The Pi controller fails a firmware update at once when the radio refuses the offer."
      - "A box that was set up can go back into Wi-Fi setup, from a menu entry behind the admin PIN or a command on the USB console. The setup page is in English, Portuguese, German and Traditional Chinese, and phones open it by themselves."
      - "The console's Game tab shows a QR code of the scoreboard for players."
      - "Scenarios can be in German and Traditional Chinese, objective names included."
      - "<strong>Sabotage</strong>, a new mode: Bomb in rounds until the game time runs out. The attackers arm, the defenders defuse; an explosion is a point for the attackers, a defuse a point for the defenders, then the box rests and the next round starts. The team with more points wins, equal points are a draw. In the simulator and in tests, and among the Field Box's presets; not yet on a real board."
      - "The USB radio modem's small screen speaks Portuguese, English, German and Traditional Chinese, like the box's. Host tests only, not on a real board."
      - "The GM console's forms keep what the organiser has typed until it is saved: a player checking in, or the console's clock, no longer puts the saved values back."
      - "The field's logo can be uploaded as a JPEG or WebP too; the GM console converts it for the box. In software, not yet seen on a real panel."
    next:
      - The radio boards, and 5 built boxes for the field test.
      - A 20-box field test with listen-before-talk on and off.
      - "Whether to turn the controller's pacing on, decided from the 20-box field test."
    gate: >-
      Gate: 5 boxes on a <a href="{{ page.to.glossary }}#glossary-cqb">CQB</a> site and an outdoor
      field, zero lost captures. <strong>Open.</strong>
  p3:
    title: Android and players
    short: >-
      Android props, the I/O pod, the player app and the modes that need phones: done in software,
      iOS included (checked on an iPhone). The field test waits for real phones and pods.
    done:
      - "<strong>The app</strong> for players, marshals and the GM, in Portuguese and English, on
        Android and iOS (the iOS version has passed its checklist on an iPhone)."
      - An Android phone acts as a box, with any mode and the mode's own screens, and joins a game
        by QR code, NFC card or text.
      - "<strong>The phone as the field controller</strong>, done in software and waiting for a
        real phone: it runs the game and the field's services on its own."
      - >-
        <strong>The <a href="{{ page.to.glossary }}#glossary-android-prop">I/O pod</a></strong>:
        firmware that lends a phone a Heltec board's buttons, keypad, lights, siren, NFC reader and
        LoRa radio.
      - "<strong>Modes that use phones and tags</strong>: Kill Confirmed, Respawn and Lives, Player
        Check-in, the Medic Kit and Money Factory."
    g_modes:
      title: Modes and screens
      items:
        - Kill Confirmed, Respawn and Lives and Player Check-in read players' signed NFC tags.
        - "The Medic Kit: a hit player scans their tag and holds a button to be healed, with a
          limited number of heals."
        - "Money Factory: factories make money while a team holds them; players collect it with
          their tag and bank it at another box, and the controller keeps what each one carries."
        - Mode screens described in YAML, drawn alike by the Field Box and the app.
    g_players:
      title: Players and marshals
      items:
        - "Players check in at the field by scanning a printed poster (no account, no internet),
          say which replicas they will use and see whether they have passed the chrono."
        - >-
          <a href="{{ page.to.glossary }}#glossary-chrono">Chrono check-in</a>: energy, limits per
          class, spot checks, readings signed by the marshal. Marshals work from a "replicas to
          chrono" list, and their signed readings mark each replica passed or refused; they also
          have the replica registry and players' tags.
        - Players can share their position during a game, and the controller decides who sees it.
        - "A field or club that runs its own controller can show its logo, wallpaper and colour in
          the app, on the scoreboard and on the poster, and give its teams names and crests."
        - "The GM console tells when the check-in poster changed after it was printed."
        - "The marshal and chrono screens say what the app really does, and the limit lists are translated."
        - "The app keeps more of its secrets sealed with the Android Keystore: the site key, players' secrets and the site login."
        - "Players' NFC tags are signed by the field controller and written from the GM console, the phone controller or the marshal's app. Marshals no longer hold the field key for them."
        - "Replica labels: the app shows, shares or prints each replica's QR sticker, and the GM console prints them for everyone checked in. The marshal's queue scans them."
        - "Indoor positions: the GM places BLE beacons on the plan, and an Android phone that hears one reports its room instead of GPS. In software and fakes, not tried with real beacons. iOS stays on GPS."
        - "The app follows a game from the scoreboard's QR code, also when the phone controller serves HTTPS with its own field CA. In software, not tried on a real phone."
        - "A player says which floor they are on and sees the field plan with the positions they may see."
        - "Game history in the app: the games a player took part in, newest first."
        - "Login with Google, Microsoft, Apple or a passkey in the app, with an account screen. Android only; not tried on a real phone or against the real providers."
        - "The player's field plan can show the field's grid and the player's own cell."
        - "A marshal can bind an NFC sticker to a replica when registering it."
        - "A marshal's phone no longer keeps the field join key: only a prop (its join card) and the phone controller do, and an upgrade clears it from a marshal's phone."
        - "Scoreboard links that pin the field's own CA are remembered per field, and forgotten when the CA changes."
        - "While a live game is open in the player view, an Android foreground service with a notification keeps the app running, so the buzzes still play with the app closed or the screen off. Not on iOS. Not tried on a real phone."
    g_props:
      title: Props and the I/O pod
      items:
        - "An Android prop takes part in the controller's game over the field's Wi-Fi, or over its
          radio through an I/O pod."
        - "The pod's firmware lends the phone a Heltec board's team buttons, keypad, lights, siren,
          NFC reader, enclosure switch and LoRa radio, over USB or Bluetooth."
        - "The app reconnects to a lost I/O pod by itself. Not tried with a real pod."
        - "Android props fetch signed mode packages from their controller, as boxes do. In software."
        - "The GM console can push an I/O pod's settings over the radio: the four buttons' colours, the LED ring's brightness, the volume and whether the enclosure switch reports. The pod authenticates the command like any other, keeps the settings in its flash and answers; the controller sends it again until it hears back. Before, they were set when the firmware was built. In software and against the pod's code on a computer, not tried with a real pod."
    g_controller:
      title: The phone as the field controller
      items:
        - "The game engine, with a mode's field.lua on the shared core, an MQTT broker and a
          position filter; the REST API, the live stream and the MQTT topics; games kept across a
          restart; join payloads."
        - "Android props on its Wi-Fi, an I/O pod as its radio, field check-in with player tokens,
          the \"replicas to chrono\" list and players' positions. Checked by the same contract
          cases as the Pi controller, and run with the pod's and the Field Box's own code on a
          computer."
        - "Its screen: the role on the app's home screen, kept running with the screen off, the GM
          console served from the app, and HTTPS with a field CA made on the phone."
        - "The field plan (a plan per level, its map position, map features with the field
          boundary, the field loaded from a map, so the out-of-bounds warning works there too) and
          the radio channel, with a search for a quiet channel through the I/O pod."
        - "The boxes over the radio: sealed invites into the next game; the end of a game told to
          its boxes even after the phone restarted without the game's key; new boxes adopted by the
          code they show or by a field card the phone writes by NFC; firmware updates between
          games, through the I/O pod or the Pi's USB radio modem, and the phone says why when its
          radio cannot carry them."
        - "Presets, mode uploads and signed mode packages sent to the boxes that lack them,
          scenarios compiled on the phone, role packages in a game, team names and crests."
        - "What the Pi controller does, too: failover (a phone and a Pi can each be the other's
          standby), the site server sync (games, logs and scores sent when the internet is there;
          rosters, branding and the scenario library from it), the remote GM and the ATAK feed."
        - "The GM console fits a phone: its check-in and marshal tables stack, with no sideways scrolling."
        - "The phone controller's own screen imports a registration list (a CSV or JSON file chosen with Android's file chooser), with no GM console needed."
    g_ios:
      title: iOS
      items:
        - "The project is in the repository, CI builds it on a Mac, and it has run on an iPhone."
        - "On 2026-10-26 its on-device checklist passed on an iPhone: 12 automated checks and, by
          hand, QR scanning with the camera, check-in with the field's poster over HTTPS, position
          sharing while the app is on the screen, the out-of-bounds warning and its vibration,
          and atalaia:// links."
    next:
      - "The field test with real phones and pods (plan phase G) waits for the hardware. So far the
        app has run on Android emulators and on an iPhone against the bench's controller, and the
        pod firmware only as its own code on a computer."
      - The phone as the field controller waits for a real phone.
      - "On iOS, NFC needs a paid Apple account; the prop and the phone as the field controller stay
        Android only."
      - "Indoor beacons on iOS need a Swift plugin written on a Mac."
      - "Trying the scoreboard QR code, the floor picker, the game history and the pod reconnect on a real phone and pod."
      - "Trying the app's login on a real phone and against the real providers."
    gate: "Gate: one game mixes ESP32 and Android props without issues."
  p4:
    title: Site server and advanced play
    short: >-
      Site server, game scheduling and registration, custom scenarios, advanced modes, ATAK. Every
      software step is built; a real server, a legal review and the hardware tests are next.
    done:
      - "<strong>Advanced modes</strong>: Master and Satellites, the Hacking Terminal, VIP / Payload,
        and the logic of Target Windows."
      - "<strong>Custom scenarios</strong>: their runtime on the field controller, a compiler for
        YAML scenarios, an editor in the GM console and the objectives in the app."
      - "<strong>The ATAK feed</strong>: boxes and zones on ATAK maps, on the field and, through the
        site server, for staff away from it."
      - "<strong>The site server</strong>: accounts with two-factor codes, personal data rights,
        controller sync, the chrono registry, game history and the scenario library."
      - "<strong>Game scheduling and registration</strong>, with public field pages, calendar feeds
        and club profiles."
      - "<strong>Hosted mode</strong>: many fields on one server, each kept apart, with its
        deployment."
    g_modes:
      title: Modes
      items:
        - "Master and Satellites: satellites held with the master raise its points; the master
          changing hands frees them."
        - "The Hacking Terminal: a puzzle on the keypad that reveals a code or captures the
          terminal."
        - "VIP / Payload: a team escorts its VIP, or a phone with GPS, to an extraction zone;
          checkpoint boxes score while held; positions stay on the field controller and the phone."
        - "The rules of Target Windows: a hit while the target shows a team's colour scores for that
          team. The target addon is not built yet."
        - "Geo utilities in the core: distances and zones for every script, identical on every
          platform."
    g_scenarios:
      title: Custom scenarios
      items:
        - "The runtime: a scenario runs on the field controller and tells the boxes of the built-in
          objectives package what to be (a point to capture, a code, tags or cards to scan, a bomb
          site); they report, the scenario scores."
        - "The compiler: a YAML scenario of seven objective types, with dependencies, reveals and
          time windows, checked with every problem located and explained, and compiled from the
          command line."
        - "In the GM console: an editor that lists every problem as the organiser types and
          installs the scenario; the boxes get the scenario's names when they join."
        - "In the app: players see the objectives meant for them, with their names and how each
          stands, a hidden one only once it is revealed; each squad can have its own chain, one
          objective at a time, told to the whole squad or to the squad leader alone."
    g_atak:
      title: ATAK and the field map
      items:
        - "The ATAK feed: boxes and zones on ATAK maps over the field Wi-Fi, in their owners'
          colours, placed by giving two corners of the field image their map position."
        - "The GM marks safe zones, each team's respawn and HQ, the car park, first aid and
          objectives on the field's plan, as a pin, a circle or an area, each shown to everyone, to
          one team or only to the organisers, in the console and on ATAK."
        - "The field can be loaded from a map: the GM finds it from where they stand or by a
          place's name and traces its outline on OpenStreetMap, and the browser draws the field
          image from OpenStreetMap's data over the country's open aerial imagery (mainland
          Portugal, Spain, France with its overseas territories, the Netherlands, Belgium,
          Luxembourg, Switzerland, Liechtenstein, eleven German states, Poland and Czechia). The
          outline becomes the field boundary, the outside dimmed."
        - "Players' phones warn them with a banner and a vibration when they leave the boundary,
          from their own GPS, sending nothing."
        - "Player positions never go to everyone, only to staff devices when the field turns it on.
          Staff away from the field get the same through the site server, over an encrypted
          connection with a certificate per device that the field issues and can revoke at once,
          positions only to a GM or a marshal."
        - "Multi-storey fields in the console: a floor plan per level and each box on its level."
        - "Not yet tried with a real ATAK phone, nor at a real field."
        - "A box that Progressive Domination has made the active one says so on ATAK."
        - "The field map page works on the phone as the field controller too."
        - "ATAK shows an indoor player at their beacon's place, with the room in the remarks."
        - "The grid in ATAK, and a printable grid map."
        - "The remote GM sees players' positions when they share them."
        - "ATAK device certificates last 90 days (they were 7), and the staff ATAK page warns when one expires within 14 days."
    g_server:
      title: Site server, accounts and data
      items:
        - "Its skeleton: database, migrations and a health check, in its own container."
        - "Accounts: passwords, two-factor codes required for organisers and marshals, sessions and
          roles per field."
        - "Personal data rights: access, export, correction, erasure, consent records and a daily
          retention purge."
        - "Controller sync: field controllers push their games, logs and scores, offline first and
          safe to replay. Not yet over a real 4G link."
        - "The chrono registry: signed readings verified and kept as signed, public keys only,
          sharing between fields with consent. Not yet with a real chronograph."
        - "reset-totp: the operator resets the two-factor code of an account that lost its authenticator."
        - "Field controllers pull other fields' chrono records for the players on their roster, only with each player's consent. They keep them apart from their own readings and never judge them."
        - "Controllers take the field's settings and branding from the site server, and a change reaches the Pi and the phone controller at once. In software."
        - "Login with Google, Microsoft or Apple, and with passkeys. Passwords are optional; staff still need a second factor. Tested on a computer, not against the real login providers."
        - "A staff account page where each person manages their own logins: passkeys, linked accounts, password and two-factor code."
        - "Scenario, preset and schedule changes reach the controllers at once."
        - "How long a field keeps data is a field setting: game data (events, scores, logs) and chrono records each have a retention period, 365 days by default, set on the controller, in the GM console or on the site server's staff settings page. The daily purge deletes an ended game that old, never before the site server has all of it. The unused per-account retention field is gone."
        - "A player's erasure at a field controller reaches the site server by itself with the next sync (never a name), and erases the player's chrono records there too."
        - "The first full draft of the privacy notice, in Portuguese and English, rewritten from what every part of Atalaia does today. A draft, not legal advice, not yet reviewed by a lawyer."
        - "The site server publishes the privacy notice the operator provides, as a page and over the API in four languages, and asks accounts to consent again when its version changes. Nothing is blocked: export and erasure stay available. Tested on a computer."
    g_games:
      title: Games, clubs and staff pages
      items:
        - "Game scheduling, with a public page per field and open iCalendar and JSON feeds of its
          games (no personal data on them)."
        - "Registration for those games, with pre-declared replicas and a check-in ticket: the field
          controller pulls the list and reports who came. Registering from the app; importing a
          registration list (CSV or JSON) exported from another platform."
        - "Club profiles: name, colour, logo and crest, members, a public page off by default with a
          report button and moderation. A field's branding and saved teams sync to its controllers,
          so a club's crest reaches every field that saved its team."
        - "Game history: each game's score timeline and event log; players and spectators see a live
          game a minute behind, without secrets or player ids. A public scoreboard per field (off
          by default)."
        - "The field's scenario library with its game presets, checked as the field controller
          checks them and installed by every controller of the field, a standby included."
        - "Web pages for the field's staff, in Portuguese and English and on a phone: login with the
          two-factor code, game history, the scenario library (every problem shown before saving,
          revisions and presets), device health, and the remote GM's live view and commands. Tested
          in a headless browser, not on a real server."
        - "Controllers drop a scenario or preset the site archived or deleted, unless a game still uses it."
        - "Staff pages for the schedule: list, create, edit, publish and cancel games, with times in the field's time zone."
        - "Staff pages for registrations: who registered, changing a name, team or federation number, withdrawing a registration, and the CSV export and import."
        - "A printable game-day roster page, with when a controller last pulled it."
        - "Staff actions on a registration: paid or unpaid (the server takes no payment), no-show, move to another game, restore, edit the replicas. Tested in a headless browser, not on a real server."
        - "Staff pages for roles, sync keys, branding, clubs, platform links, firmware and administration."
        - "The remote GM page updates live, with no reload."
        - "Association membership is checked at registration and at check-in: APDs for fields in Portugal, any association or federation elsewhere."
        - "A staff page for the field's settings: the public page, the check-in rules, membership, chrono sharing and the country."
        - "Chrono records show by how much a replica was over the limit, and flag repeat offenders."
        - "A staff page for the field's data export and its use of the quotas."
        - "Score timelines in game time."
        - "A club's page lists the fields it plays at, the staff page too."
        - "The controller imports a registration CSV on its own, with no site server needed."
        - "The console warns when a name has letters the boxes cannot draw: team names, the game's name, a scenario's and its objectives' names."
        - "Registration lists carry an association ID and the membership's expiry date as optional columns, and the registration export imports back as it is."
    g_boxes:
      title: Boxes and the field
      items:
        - "Device health: each box's battery, link and firmware from what the controllers send; the
          field controller reports a box that goes silent or comes back and a low battery, which a
          box with a battery gauge also reports itself. Not yet on real boards."
        - "A firmware catalogue that lists only releases signed with a trusted key, and over-the-air
          updates for the Field Box: the GM uploads a signed release to the field controller and
          updates the boxes between games, never during one; each box downloads it over the field
          Wi-Fi, checks the signature with keys built into its firmware, installs it in its spare
          slot and goes back to the old firmware if the new one does not start. In software, not
          yet on a real board."
        - "Adopting boxes to the field with an NFC field card, the controller's USB cable or the
          6-digit code the box shows, paired over the radio. In software, not yet on a real board."
        - "Inviting boxes into the next game over the radio, with no card or QR code (the join
          travels encrypted under a key derived from the field join key), and a start that waits
          for every role to have a box, unless the GM chooses \"Start anyway\". Tested on two bench
          boards with the field controller."
        - "Boxes heard in every new game (the radio's nonce counter is now per game, a fix found on
          the bench) and box screens that follow the game (Ready, Waiting, Neutral) in the field's
          language, English or Portuguese. Tested on two bench boards."
        - "A controller restarted mid-game takes the game up again; one that lost the game's key
          still tells its boxes over the field radio that the game is over; wrong admin PINs wait
          longer and longer, counted across restarts, with no default PIN on a real box. In
          software, not yet on the bench boards."
        - "The remote GM: an organiser with the GM role, logged in with a two-factor code, sees the
          live game and starts, pauses, resumes or ends it, or sends a message or a mode command,
          over a connection the field controller opens itself, only when the field turns it on,
          with every command logged on both sides."
        - "The console's Controller tab lists the remote GM's state and every command it got."
    g_deploy:
      title: Deployment and hosted mode
      items:
        - "The deployment: HTTPS through Caddy with an automatic certificate, a setup script that
          makes every secret, encrypted daily backups and a restore into a fresh database. Tested
          in Docker on a computer, not on a real server with a real domain."
        - "Hosted mode: one server for many fields, each in a database schema of its own at its own
          address, with row-level security underneath so that no field ever sees another's data,
          and the operator's commands to export a field's data or delete it. Tested against
          PostgreSQL in Docker."
        - "Its deployment: a setup script that makes the hub's database roles, each field at its own
          address with a certificate that only an active field's name can get, and encrypted
          backups restored with every field kept apart. Tested in Docker, not on a real hosted
          server with a real domain."
        - "Hosted mode: a quota for each field, a data export a field's administrator can download, and a deleted field's open connections close at once."
        - "Hosted mode: a storage quota, and custom domains per field."
        - "Hosted mode: every field has a database role of its own, so a SQL injection can no longer switch to another field's data by changing the setting that row-level security used. One gap that needs a second SQL statement stays open and is written down. Tested against PostgreSQL in Docker."
        - "Hosted mode: fields that share chrono records now do so across a hub's fields, through a read-only view that needs consent; a person links their accounts at two fields with a one-time code, and nothing is matched by e-mail or name. Tested against PostgreSQL in Docker."
        - "A read-only live demo for the preview server: the real field controller with three simulated Field Boxes plays Domination games forever, and visitors see the GM console, the scoreboard and a player's view, with nothing to change and no personal data. Online since 29 October 2026 at demo.atalaia-project.link."
    next:
      - A real server with its domain.
      - A legal review of the templates before hosted mode goes live. It is not offered before.
      - "The tests on hardware: real boards, a real ATAK phone, a real 4G link, a real chronograph."
      - The target addon, which the Target Windows rules wait for.
      - "Testing the logins with the real Google, Microsoft and Apple."
      - "jogarairsoft.pt: the maintainer wrote to them on 28 October 2026 proposing an integration (their events, teams and APDs to us; our games feed, field profiles, public clubs and results to them). Waiting for their answer; nothing is promised."
    gate: >-
      Gate: a weekend <a href="{{ page.to.glossary }}#glossary-milsim">milsim</a> runs on Atalaia
      end to end.
  p5:
    title: Community
    short: >-
      Visual mode editor, signed mode packages, the mode registry as a template, German and
      Traditional Chinese, build guides. Every software step is built.
    done:
      - "<strong>The visual mode editor</strong>: a page of the simulator where a mode is put
        together from blocks (what happens when a team holds the button, timers, points, screens
        and sounds, zones on the map, GM commands, several roles, the settings a GM can change and
        the field controller's logic across boxes). It writes the mode's Lua scripts and manifest
        as you go, in Portuguese and English, works offline, and a button tries the mode in the
        simulator at once. Its three examples pass the same tests as the hand-written modes."
      - "<strong>Signed mode packages</strong>: one archive, signed like a firmware release. The
        editor makes the package itself and shows what the mode key will sign and the command that
        signs it; signing stays on the author's own computer, offline."
      - "The field controller installs signed modes only with its own trusted keys, and shows who
        signed each one and whether the project reviewed it."
      - "A battery of sandbox-escape attempts runs on every change; it closed two ways for a script
        to run past its time limit."
      - "<em>Send missing modes</em> in the GM console: a box that lacks a game's mode fetches the
        signed package from the field controller over the field Wi-Fi, only between games, while
        the game waits for it; it checks the package with keys built into its firmware and keeps
        it. Tested on a computer, not on a real box."
      - "Scenarios built from blocks in the GM console: the boxes, the objectives and who sees them,
        when they open, what completes them and what they give, by mouse, touch or keyboard, even
        on a phone. The field controller checks and installs them as if they were written by hand."
      - "<strong>The mode registry</strong>, ready as a template: a pull request with a signed mode
        is checked automatically (its signature, that its source is what was signed, its licence,
        its tests in the simulator), and a mode the project has reviewed gets the verified badge,
        the project's own signature, which is what lets it reach the boxes. How to submit a mode,
        the review checklist, keys and moderation are written down."
      - "<strong>German and Traditional Chinese</strong> (as written in Taiwan) on this page, the GM
        console, the mode editor, the app, the Field Box's screens, the built-in modes and the site
        server's pages: AI drafts, not yet reviewed by players who speak them."
      - >-
        The registry's repository exists (created 2026-10-26), and its <a href="https://vakaobr.github.io/atalaia-modes/">page</a> lists the
        modes, with no modes in it yet.
      - >-
        <a href="{{ page.to.build }}">Build guides</a> for the Satellite, the I/O pod and the
        target addon, as text. No box has been built from them yet.
      - "<strong>User manuals</strong> for players, game masters, marshals and Field Box operators, in English and Portuguese."
      - "Build manuals with a pin table for each board, a firmware guide (download a release or build it) and a controller setup guide, in English and Portuguese."
      - "The simulator's web view has every input a mode uses: tags, keypad, hits and GM commands, with an event-log download."
      - "The GM console's scenario blocks have a language list with all four languages."
      - "The project's mode keys: an offline root key and a key the registry uses to sign the verified badge. Boxes, the app and the controllers trust both by default."
      - "The firmware guide and the build manuals explain the one USB flash that a box on the old partition table needs, and that settings and keys survive it."
    next:
      - "The review of the German and the Chinese: if you play in German or in Chinese, help us
        review them. Translations into other languages start at docs/translations."
      - "The hardware: the carrier PCB (a ready-made circuit board that makes builds easier) after
        the first built boxes, build photos, community content from a field."
    gate: Ongoing after the first release.

build:
  title: Build guides
  intro: >-
    Atalaia's props are built from off-the-shelf parts around one ESP32 board, with no custom
    circuit board. This page has the Field Box's pins and wiring diagrams and the guides for the Satellite, the I/O pod and the target addon,
    shortened; the full guides, with every check and the troubleshooting tables, are in the
    repository.
    To put the firmware on a board, <a href="https://github.com/vakaobr/atalaia-project/releases">download a ready-made release</a> or build it yourself: the <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/firmware.md">firmware guide</a> explains both. The field controller has its own <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/controller-setup.md">setup guide</a>.
  status: >-
    <strong>No box of any kind has been built from these guides yet.</strong> Their pins are checked
    automatically against the firmware, but every physical step (enclosure, power, runtime, radio
    range) is untested, and the photos will come with the first builds. If you build one, please
    tell us what you find.
  toc: On this page
  parts: Parts
  pins: Pins
  pins_intro: >-
    The firmware's defaults. Every board pin that is not in this table stays unconnected.
  pin_what: What
  pin_gpio: GPIO
  steps: Steps
  open: Not decided yet
  photo: "Photo to come, after the first build:"
  pin:
    btn1: Team button 1 (the game's first team)
    btn2: Team button 2 (the second team)
    btn3: >-
      Team button 3, optional (the board's UART0 receive line)
    btn4: Team button 4 (on the keypad expander)
    led: LED ring data, through the 74AHCT125 level shifter
    sda_gauge: I2C SDA, for the battery gauge (the board's own bus)
    sda_bus: >-
      I2C SDA, for the keypad expander, the NFC reader and the battery gauge (the board's own bus)
    scl: I2C SCL
    bclk: Amplifier BCLK (optional)
    lrclk: Amplifier LRC
    dout: Amplifier DIN
    tamper: Enclosure switch, to GND
    log: >-
      Log output (UART0 TX): only a 3.3&nbsp;V USB-serial adapter's RX, on the bench
    disp_mosi: >-
      Screen MOSI (SPI)
    disp_clk: >-
      Screen clock (SCK)
    disp_cs: >-
      Screen chip select (CS; the board's battery-voltage pin, used as an output)
    disp_dc: >-
      Screen data/command (DC)
    disp_rst: >-
      Screen RESET and backlight: both to the 3V3 pin, no GPIO
    keypad: >-
      Keypad, through the PCF8574 expander (address 0x20)
  safety:
    title: Safety first
    intro: These rules hold for every build on this page, as for the Field Box.
    antenna: >-
      <strong>Never power a board without its LoRa antenna</strong>, not even from USB:
      transmitting into an open antenna port can destroy the radio's amplifier. Fit both antennas
      first and leave them on.
    cell: >-
      <strong>One Li-ion cell in series only</strong> (1S, 3.0–4.2&nbsp;V): protected cells, a fuse
      close to the cell and a diode against a cell put in the wrong way round. The board's battery
      socket and charger take one cell; a 2S pack destroys them. Check the polarity with a meter
      before every connection: small battery plugs have no standard polarity.
    charge: >-
      <strong>Charge under supervision</strong>, never in a closed case, only between about 0 and
      45&nbsp;°C, and keep the cells in a fire-safe bag while you work, with the cells out of the
      box. Never use a cell that is dented, swollen, hot or below 2.5&nbsp;V.
    volts: >-
      <strong>3.3&nbsp;V signals only</strong> into the board: the LED ring is driven through a level
      shifter, and every I2C module must pull its lines up to 3.3&nbsp;V, never 5&nbsp;V.
    pins: >-
      <strong>Never wire GPIO 5 or 46</strong> (the radio's front end) <strong>nor GPIO 34 or
      38–42</strong> (the board's GPS connector).
    power_check: >-
      <strong>No game before the transmit-power check</strong> of the bring-up list: the firmware
      keeps the radio within the legal limit with an amplifier gain that has not been measured yet.
    enclosure: >-
      <strong>Plastic, never metal</strong> (the radio must get out), weatherproof, in a bright
      colour with a "GAME PROP" label, and nothing that looks like an explosive device.
    hits: >-
      <strong>BBs and paintballs will hit it.</strong> Keep the cells and boards away from the walls
      and out of the line of fire, put a phone's screen behind clear polycarbonate (never glass), and
      never place a box where players have to shoot at it, unless it is a target.
  field_box:
    title: Field Box
    text: >-
      The main prop, with team buttons, a keypad, a colour screen, an LED ring, an NFC reader and a
      speaker. Its
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">build
      manual</a> has the parts, the wiring diagrams, power and battery safety, the first flash and
      troubleshooting; the guides below refer to it for every step they share.
    pins_shared: >-
      GPIO 1, 35 and 44 are board pins that the Field Box shares on purpose, each for this one use only: 1 is the board's battery-voltage input (the gauge reads the battery over I2C instead), 35 its white LED (it flickers faintly with the ring) and 44 UART0's receive line (the USB console is unaffected).
    wiring:
      title: >-
        Wiring diagrams
      intro: >-
        Two drawings, generated from the repository's WireViz files: the signals with the 3.3 V logic power, and the battery, switch and 5 V rail. The board's pins are named by GPIO number only: find each one by the number printed next to its header pin. The labels (pins, wires, parts) stay in English in every language, as in the repository; if the text and a drawing disagree, the drawing wins.
      open: >-
        Open the full-size drawing (SVG)
      hint: >-
        The drawing is very wide: tap or click it to open it at full size, where you can zoom and pan. It sits on a white sheet in the dark theme too, so the wire colours stay true.
      signals:
        alt: >-
          Wiring diagram 1 of 2, signals and 3.3 V power: the main board's GPIO pins go through the interconnect board to the screen, the team buttons, the keypad and its PCF8574 expander, the NFC reader, the battery gauge, the amplifier and speaker, the LED ring and the antennas.
        caption: >-
          Diagram 1 of 2: signals and 3.3 V logic power.
      power:
        alt: >-
          Wiring diagram 2 of 2, battery and 5 V power: the cell, fuse, main switch, reverse-polarity diode and splices feed the main board's battery socket and, through the boost converter, the 5 V rail of the LED ring, the amplifier and the interconnect board.
        caption: >-
          Diagram 2 of 2: battery, main switch and 5 V rail.
  satellite:
    title: Satellite
    what: >-
      A small box for a secondary point or a beacon: the Field Box's board with two big team buttons
      (a third is possible), an LED ring that shows the team holding it, the board's own small
      screen, and one 18650 cell. About <span class="nowrap">€30–40</span> in parts (the design's
      estimate). It runs the <strong>Field Box's own firmware</strong> with fewer parts fitted: the
      firmware reports each missing part once at start-up and carries on.
    plays: >-
      Without a keypad it cannot choose a game on its own: it plays the games a
      <a href="{{ page.to.glossary }}#glossary-field-controller">field controller</a> invites it
      into, as a satellite or the master of
      <a href="{{ page.to.modes }}#master-satellites">Master and Satellites</a>, or as a zone of any
      mode that needs only team buttons (Domination, Hold-All Domination, Last Stand). It joins a
      field by USB cable or by the pairing code on its small screen (it has no NFC reader for a
      field card).
    parts:
      board: >-
        Heltec WiFi LoRa 32 V4 board, revision V4.2 or V4.3, 863–928&nbsp;MHz, without its shell.
      antennas: >-
        An 868&nbsp;MHz antenna of 2&nbsp;dBi or less (the board kit's) and a 2.4&nbsp;GHz antenna,
        which is required: the first setup, mode downloads and firmware updates use Wi-Fi.
      buttons: >-
        Two (or three) 60&nbsp;mm arcade buttons with 5&nbsp;V LEDs.
      ring: >-
        A WS2812B LED ring (24 LEDs by default; 12 or 16 with one firmware setting), with the
        74AHCT125 level shifter, a 330&nbsp;Ω resistor and a 1000&nbsp;µF capacitor, on a small
        perfboard.
      gauge: >-
        A MAX17048 battery gauge, recommended: without it the box never knows its battery level.
      power: >-
        One protected 18650 cell in a holder (or a 1S pack with a protection board), a 5&nbsp;A fuse,
        a Schottky diode, a covered main switch, a 5&nbsp;V boost converter for the ring, and lever
        splices: the Field Box's power path with one cell.
      sound: >-
        Sound is optional: the Field Box's MAX98357A amplifier and a small speaker.
      box: >-
        A plastic IP65 box in a bright colour, with a vent and cable glands, and "GAME PROP" labels.
    free_pins: >-
      The firmware still drives the Field Box's screen pins (GPIO 1, 3, 33 and 47): leave them
      unconnected.
    diagram_ref: >-
      Its wiring is a subset of the Field Box's: follow the <a href="#field-box-wiring">Field Box's wiring diagrams</a> and leave out the parts this build does not have (the colour screen, the keypad and the NFC reader). A drawing of its own does not exist yet.
    steps:
      revision: >-
        Read the chip next to the board's LoRa antenna connector: KCT8103L is a V4.3 (the firmware's
        default), GC1109 a V4.2. Fit and label both antennas before the board is ever powered.
      enclosure: >-
        Plan the box on paper, then drill every hole before any electronics go in: buttons and ring
        on the lid, the switch recessed or covered, a vent low down.
      power: >-
        Build the power path without the board: cell, fuse, diode, switch, splices; set the boost
        converter to 5.0–5.2&nbsp;V on its own before anything is connected to it.
      hub: >-
        Build the small interconnect board: the 3V3, GND and 5V rails (and SDA and SCL for the gauge)
        and the level shifter, as in the Field Box's manual.
      wiring: >-
        Wire the buttons (to GND when pressed), the ring through the level shifter, the gauge and the
        optional amplifier, by the pins above.
      check: >-
        Check with the meter, the cell out: no short between the rails, each button only while
        pressed, the polarity of the board's battery lead.
      flash: >-
        Build and flash the Field Box firmware as its manual says, set for your board revision and
        your ring's number of LEDs.
      bring_up: >-
        Do the bring-up steps that apply to a Satellite: start-up, buttons, LEDs, battery, and the
        radio and its transmit power before any game.
      field: >-
        Set its name, region and admin PIN in its Wi-Fi setup page from a phone, adopt it into your
        field by USB cable or pairing code, and invite it into a game from the GM console.
    photo: the finished Satellite, inside and out.
    open:
      buzzer: >-
        <strong>The piezo buzzer</strong> of the original design: the firmware makes sound only
        through the amplifier, so a buzzer would need a firmware change.
      enclosure: >-
        <strong>The enclosure</strong>: no box has been chosen yet.
      runtime: >-
        <strong>The runtime</strong> on one cell: not measured.
      diagram: >-
        <strong>A wiring diagram of its own</strong>: for now the Field Box's diagrams show every wire
        a Satellite has.
    full: >-
      The full guide:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/satellite/BUILD.md">Satellite
      build guide</a>.
  pod:
    title: I/O pod
    what: >-
      The box that lends an <a href="{{ page.to.glossary }}#glossary-android-prop">Android prop</a>
      what a phone lacks: big team buttons, a keypad, an LED ring, sound, an NFC reader, a switch
      that tells when the box is opened, and a LoRa radio. The phone runs the game mode; the pod is
      its hands and its radio, over a USB cable or Bluetooth. It is the Field Box's hardware without
      the colour screen, running the pod firmware, which has been tested on a computer but not yet
      on a board. About <span class="nowrap">€35</span> in parts (the design's estimate).
    lends: >-
      Every part but the board is optional: the pod tells the phone what it has, and the phone uses
      only that. Button 1 is the game's first team, as on a Field Box. An opened enclosure reaches
      the GM console as a tamper alert.
    parts:
      same: >-
        The Field Box's parts, less the screen: the board, the buttons (up to four), the keypad and
        its PCF8574 expander, the LED ring with its level shifter, the PN532 NFC reader, the
        amplifier and speaker, the battery gauge, and the same one-cell power path.
      antennas: >-
        Both antennas: LoRa, and 2.4&nbsp;GHz for Bluetooth.
      switch: >-
        A microswitch that the closed lid holds pressed: the enclosure switch.
      usb: >-
        A panel USB-C socket with data lines (not charge-only) for the phone's cable, and a USB-C OTG
        cable for the phone.
      uart: >-
        On the bench only: a 3.3&nbsp;V USB-serial adapter to read the pod's log.
    free_pins: >-
      The pod does not use the Field Box's other screen pins (GPIO 1, 3 and 33): leave them
      unconnected.
    diagram_ref: >-
      The pod's wiring is the Field Box's without the screen: follow the <a href="#field-box-wiring">Field Box's wiring diagrams</a> and leave out the screen and its wires. A drawing of its own does not exist yet.
    steps:
      like_box: >-
        Build it as a Field Box without the screen: board revision, antennas, enclosure, power path,
        interconnect board, then the keypad, ring, NFC reader, buttons and amplifier you fit, each
        with the manual's checks.
      switch: >-
        Mount the microswitch so the closed lid presses it, and wire it from GPIO 47 to GND. The pod
        watches it only after it has read closed once, so a pod without one never raises an alarm.
      flash: >-
        Build the pod firmware (<code>python tools/docker_fw.py pod</code>) and flash it from the
        <code>build-pod</code> folder, as the Field Box's.
      log: >-
        Read its log on GPIO 43 with the USB-serial adapter: the USB-C port carries the pod's link
        to the phone, not the log.
      link: >-
        In the app, link it over a USB-C OTG cable, then over Bluetooth (Android asks to pair once).
      bring_up: >-
        Run the pod's bring-up checks, including the radio's transmit power before any game.
    photo: the finished pod, with its enclosure switch, and the phone linked to it.
    open:
      siren: >-
        <strong>A separate siren or strobe</strong>: the pod's sound is its amplifier; switching
        other loads is not in its firmware.
      phone_power: >-
        <strong>Power from the phone</strong>: on a cable, the phone powers the pod and may charge
        its cell. Whether it should, and how much a phone gives, are to be checked at the first build.
      enclosure: >-
        <strong>The enclosure</strong>, and how the phone and the pod are carried together.
      settings: >-
        <strong>Settings from the phone</strong>: button colours, the number of LEDs and the rest are
        set in the firmware build for now.
    full: >-
      The full guide:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/io-pod/BUILD.md">I/O
      pod build guide</a>, and the pod's checks with a phone in the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md">bring-up
      list</a>.
  target:
    title: Target addon
    status: >-
      Not buildable yet: the box's side of the port is decided, the addon itself is not. Do not wire
      a plate to a box from this page.
    what: >-
      A plate that players shoot at, with a sensor that feels each hit. It plugs into a box and turns
      it into a scoring target for
      <a href="{{ page.to.modes }}#target-windows">Target Windows</a>, whose rules are built and
      tested in the simulator; the box's own ring of lights shows the window.
    decided_title: What is decided
    decided:
      parts: >-
        A steel or polycarbonate plate, a piezo sensor and a small processor of its own (RP2040 or
        ATtiny class) to detect hits. About <span class="nowrap">€20–30</span> in parts (the
        design's estimate).
      port: >-
        It plugs into a waterproof 5-pin M12 connector on the box that carries 3.3&nbsp;V only: the
        board's 3.3&nbsp;V, ground and the two I2C lines; no 5&nbsp;V, and the fifth pin stays free.
        Cables of up to 2&nbsp;m. Its processor tells the box what it is, so the box needs no new
        driver per addon.
      power: >-
        It may take at most 25&nbsp;mA from the box, through a resettable fuse: enough for its
        processor and sensor, not for lights. Target Windows lights the box's own LED ring; an addon
        with lights of its own needs a battery of its own.
      polling: >-
        No interrupt line: the box reads the addon over I2C every 20&nbsp;ms, about 3&nbsp;% of the
        bus, so a hit reaches the game within about 21&nbsp;ms. No pin of the box changes. The box's
        firmware already has this reading, tested, waiting for the addon.
      capability: >-
        Game scripts see each hit with its strength (0 to 255), and can arm and disarm the target.
        The same is defined for a phone's I/O pod.
      mode: >-
        Target Windows lights the target in a random team's colour for a few seconds; a hit strong
        enough in that window scores for that team.
      next: >-
        Then come the addon's own firmware, the box putting its reading of the port to use, and the
        sensor tuned on real steel and polycarbonate plates; Target Windows then becomes a mode a box
        offers.
    open:
      mcu: The processor (RP2040 or ATtiny, within the 25&nbsp;mA) and its firmware.
      protocol: >-
        The addon's I2C address and how it says what it is; how a hit is reported has a draft, final
        with the first addon.
      checks: >-
        The checks of the first build: the bus's pull-up resistors with 2&nbsp;m of cable, the fuse,
        and protecting the connector from static and water.
      sensor: The sensor circuit and its mounting, and the plate, its stand and its angle.
    safety_title: Safety, once there is something to build
    safety:
      eyes: >-
        <strong>Eye and face protection</strong> for everyone within range while anyone shoots at
        it, at the bench too.
      ricochet: >-
        <strong>BBs bounce off a hard plate</strong>, and some come back: angle a steel plate so they
        go down to the ground, never flat towards the shooter.
      shield: >-
        <strong>Only the plate is a target</strong>: never shoot at the box, the cable or the
        connector, and keep the electronics behind the plate or in their own enclosure.
      limits: >-
        <strong>The field's power limits</strong> apply to shooting at targets as at players.
    photo: the finished target, plate and sensor, and the port on a box.
    full: >-
      What is decided, with the documents behind each decision:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/target-addon/BUILD.md">target
      addon guide</a>.

hub:
  title: Community hub
  intro: >-
    Fields, teams and builders will meet here. Everything is opt-in: the hub holds only what people
    choose to publish, and game data stays on each field's own servers.
  open: Open
  planned: Planned
  later: Later
  discussion:
    title: Discussion
    text: Questions, ideas, reviews of the design and event reports.
    link: Go to Discussions
  gallery:
    title: Build gallery
    text: >-
      Photos, bills of materials, enclosure files and wiring notes for each build, starting with
      the first Field Box prototypes.
  directory:
    title: Field and team directory
    text: >-
      An opt-in list of fields and teams that use Atalaia, with region, site type and a contact
      link.
  browser:
    title: Mode and scenario browser
    text: >-
      The <a href="https://vakaobr.github.io/atalaia-modes/">mode registry</a> is live, with no modes in it yet: be the first. A browser
      with descriptions and community ratings comes later.
  stats:
    title: Usage statistics
    text: Opt-in, anonymous totals of versions, platforms and modes played. Off by default.
  hosting:
    title: Hosted site servers
    text: For clubs without IT support, at cost, with every club's data separate and exportable.

# Each entry: id (the anchor, stable ASCII), term (as shown) and text (1-3 sentences).
glossary:
  id: glossary
  title: Glossary
  intro: >-
    The technical words of these pages, in plain terms. The links in the text of every page lead
    here.
  groups:
    game: The game
    hardware: Hardware
    radio: Radio and connections
    software: Software
    licences: Licences
  props:
    id: glossary-props
    term: Props
    text: >-
      The electronic devices of a game: boxes to capture, bombs to arm and defuse, terminals to
      hack, targets to hit. In Atalaia any device can be one: a purpose-built box, a phone or a
      small board.
  field_box:
    id: glossary-field-box
    term: Field Box and Satellite
    text: >-
      Atalaia's own prop designs, built from off-the-shelf parts around an ESP32. The Field Box is
      the main one, with big arcade buttons, a keypad, a screen, lights, a speaker and an NFC reader
      in a weatherproof case, for roughly <span class="nowrap">€70–110</span> in parts; the
      Satellite is a smaller box for a secondary point, for about
      <span class="nowrap">€30–40</span>. The Field Box's firmware and build manual are ready; its first
      prototypes wait for their parts (phase&nbsp;1).
  milsim:
    id: glossary-milsim
    term: Milsim
    text: >-
      Short for military simulation: long games, often over a whole weekend, with missions, a chain
      of command and realistic rules. It is the biggest test for Atalaia: 10 to 20 boxes and
      satellites spread over a large area.
  cqb:
    id: glossary-cqb
    term: CQB
    text: >-
      Close-quarters battle: games inside houses, palacetes, warehouses and other tight spaces,
      usually under about 150 m across. Everything is close and fast, so Atalaia's CQB profile uses
      shorter capture and bomb times, and places the boxes on a floor plan instead of using GPS.
  chrono:
    id: glossary-chrono
    term: Chrono and joules
    text: >-
      A chrono (chronograph) measures how fast a replica fires a BB. From the speed and the BB's
      weight comes its energy in joules, which fields cap per type of replica: a 0.20&nbsp;g BB at
      100&nbsp;m/s (about 328&nbsp;fps) carries 1 joule. Atalaia keeps each replica's readings, signed
      by the marshal, so marshals can run spot checks during the day (built in software, not yet
      used on a field); a person always decides any penalty.
  microcontroller:
    id: glossary-microcontroller
    term: Microcontroller
    text: >-
      A complete, tiny computer on a single chip, made to run one program. It starts in a moment,
      uses very little battery and is cheap, which makes it the usual brain of an electronic prop.
      ESP32 and Arduino boards are microcontroller boards.
  esp32:
    id: glossary-esp32
    term: ESP32
    text: >-
      A popular, cheap microcontroller with Wi-Fi and Bluetooth built in; many boards also carry a
      LoRa radio. It is the brain of the Field Box, the Satellite and the I/O pod, and should keep a
      prop going for one to three days on a battery (an estimate, not yet measured). Boards people
      already own can join too, even
      without extra memory (PSRAM), with a few limits.
  arduino:
    id: glossary-arduino
    term: Arduino-class board, thin node
    text: >-
      Simple, very cheap microcontroller boards in the Arduino style, such as those with AVR or
      RP2040 chips. They are too small to run game modes, so in Atalaia they act as thin nodes: they
      lend their buttons, lights or sensors to a nearby box or to the field controller, which runs
      the rules for them.
  raspberry_pi:
    id: glossary-raspberry-pi
    term: Raspberry Pi
    text: >-
      A small, cheap computer about the size of a credit card, running Linux. With a LoRa radio
      board added, it will be the usual field controller (about <span class="nowrap">€80–150</span>
      for the whole build), and it
      can also run props that need a big screen or a camera.
  android:
    id: glossary-android-prop
    term: Android prop and I/O pod
    text: >-
      The Atalaia app turns an Android phone or tablet, new or a spare one from 2017 or later, into a
      prop that runs any game mode on its screen. Phones have no LoRa radio and touch screens are
      hard to use with gloves, so a small ESP32 box, the I/O (input/output) pod, connects by cable or
      Bluetooth to add the radio, big buttons, lights and a siren. Both are built in software
      (phase&nbsp;3) and tested on emulators and a computer, not yet on a real phone or pod.
  firmware:
    id: glossary-firmware
    term: Firmware and flashing
    text: >-
      Firmware is the program built into a device, which starts when you switch it on. Flashing
      means writing a new version of it onto the device, usually over a USB cable. Atalaia boxes
      are flashed by cable, and for now a new game mode comes with a new flash; later, modes will
      arrive as scripts. Firmware updates now come from the field controller over Wi-Fi (built in
      software, not yet tried on a real board), undoing themselves if a new version fails to start.
  lora:
    id: glossary-lora
    term: LoRa
    text: >-
      Short for <em>long range</em>: a radio that sends small messages far on very little power,
      with no SIM card, mobile coverage or subscription. On a typical field it should reach roughly
      <span class="nowrap">0.5–2&nbsp;km</span> (a design estimate, still to be measured), and gets
      through thick walls better than Wi-Fi.
      The catch: messages must be short, and each device may transmit only a small share of the
      time. Atalaia uses 869.525&nbsp;MHz by default, in the only EU868 sub-band that allows
      a 10% duty cycle and 500&nbsp;mW, giving each box up to 6 minutes of airtime per hour —
      enough for events, scores and time-sync beacons with headroom to spare. A field can choose
      another channel, which allows 1% of the time or less and 25&nbsp;mW. Boxes send only what changes,
      such as “red captured B”.
  mesh:
    id: glossary-mesh
    term: Mesh
    text: >-
      A network in which devices pass messages on for each other, so a box too far from the base
      is heard through the boxes in between. Atalaia repeats each message only a couple of times,
      so the radio does not clog, and organisers can place extra boxes as repeaters on difficult
      ground.
  skirmesh:
    id: glossary-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      Atalaia's own radio protocol: the agreed format in which boxes, the controller and apps
      exchange messages, over LoRa, Wi-Fi or Bluetooth. It is documented in public, so anyone can
      build a device that joins in, and every message is encrypted and signed with a key for that
      game, so a player with a radio cannot simply fake a capture. It is built and tested in
      software, not yet on a field.
  links:
    id: glossary-wifi-ble-nfc-qr
    term: Wi-Fi, BLE, NFC and QR codes
    text: >-
      Everyday short-range links, each with its own job. Wi-Fi (about
      <span class="nowrap">50–150&nbsp;m</span>) carries the bulky things: the organisers' console,
      the player app, new modes and updates; BLE, or Bluetooth Low Energy
      (<span class="nowrap">10–30&nbsp;m</span>), links a phone to its pod and pairs devices. NFC is
      tap-to-read, like a contactless card, for team tags, wristbands and join cards, and QR codes
      are scanned with a phone camera to join a game or enter a code.
  api:
    id: glossary-api
    term: "API: MQTT, REST and WebSocket"
    text: >-
      An API is a documented way for other programs to read a game and, with permission, control
      it. With it a club will be able to drive a big LED scoreboard, a live score overlay on a
      stream, Discord or Telegram alerts, or a relay that sets off smoke and sirens when the bomb
      goes off. MQTT, REST and WebSocket are three standard ways in, so ordinary tools work with
      it. The field controller has it since phase&nbsp;2, with a ready-made scoreboard page; it has
      been tested on a computer and not yet on a field.
  atak:
    id: glossary-atak
    term: ATAK
    text: >-
      The Android Team Awareness Kit: a map app made for the military, with a free civilian version
      that many milsim teams use to see their team mates on a shared map. Atalaia's field
      controller will be able to show the boxes on those maps, and which team holds each one
      (phase&nbsp;4).
  local_first:
    id: glossary-local-first
    term: Local-first
    text: >-
      Everything a game needs runs on the field itself, on the boxes and the field controller, so
      it works with no internet or mobile coverage at all. When the internet is there, it only adds
      extras, such as accounts and game history. A box that loses contact keeps playing and keeping
      score, and catches up when the link returns.
  core:
    id: glossary-core
    term: Shared core (C11)
    text: >-
      The heart of Atalaia: one program, written in the C programming language (its 2011 version,
      hence C11), that every device running game modes uses. It handles events, scores and radio
      messages and runs the game modes safely; each kind of hardware only adds a thin layer with
      the drivers that work its buttons, screen and radio. It exists today.
  lua:
    id: glossary-lua
    term: Lua and game-mode scripts
    text: >-
      A game mode is a script: a short text file of rules, such as “hold for 5 seconds to
      capture”, written in Lua, a small programming language well known from video-game modding.
      Scripts run in a sandbox, a sealed space with no access to files or the network, so a shared
      mode cannot harm a device. Organisers never need to touch Lua: they pick a mode and fill in
      its settings, and a visual, block-based editor will follow in phase&nbsp;5.
  simulator:
    id: glossary-simulator
    term: Simulator
    text: >-
      A program that plays a game mode with virtual boxes in your web browser: you press the team
      buttons on screen and watch each box's display and the event log. It runs on an ordinary
      computer and exists today, so anyone can try Domination and Bomb before any hardware is
      built.
  controller:
    id: glossary-field-controller
    term: Field controller
    text: >-
      The base station of a game: a small computer, usually a Raspberry Pi or an Android device,
      that hears every box over the radio, runs the rules that span several boxes, keeps the
      official score and serves the organisers' console to their phones. If it fails, the boxes
      keep playing and another capable device takes over, and a single box can run a game without
      one. It is built (phase&nbsp;2) and tested on a computer, not yet on a field; running it on an
      Android device is still to come.
  server:
    id: glossary-site-server
    term: Site server
    text: >-
      An optional computer, at the field or rented online, that keeps what lasts beyond one game:
      player accounts, game history, the chrono registry and the services behind the player app.
      Games never wait for it. It comes in phase 4, and the community hub plans hosted ones, at
      cost, for clubs without IT support.
  open_source:
    id: glossary-open-source
    term: Open source and free software
    text: >-
      The source code, the human-readable recipe of a program, is public, and anyone may use,
      study, change and share it, even commercially. “Free” here means freedom, not price: fields
      may charge entry and makers may sell boxes.
  copyleft:
    id: glossary-copyleft
    term: "Copyleft: GPL and AGPL"
    text: >-
      The rule that keeps Atalaia open: using it as it is asks nothing of you, but passing on a
      changed version means sharing its source code under the same licence. The GPL, for the core,
      firmware, app and modes, applies when you give or sell copies; the AGPL, for the field
      controller and site server, also applies when you run a changed version for other people over
      a network. Hardware designs (CERN-OHL-S) and documentation (CC BY-SA) work the same way.

involved:
  title: Get involved
  intro: "Atalaia is built by players, field owners and makers. You can help today by:"
  review: >-
    reviewing the
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">design
    specification</a> and <a href="https://github.com/vakaobr/atalaia-project/issues">opening
    issues</a>;
  propose: >-
    proposing game modes with the
    <a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">game mode idea
    template</a>;
  share: sharing how your field plays, so the defaults fit real games;
  code: >-
    writing code: start with
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>.
  rules: >-
    Every commit carries a <code>Signed-off-by</code> line, and the project is strictly
    clean-room, written from scratch: no code, firmware, manuals, sounds or images from any
    commercial product.

name:
  title: The name
  badge_alt: >-
    The Atalaia badge: three watchtowers on sand dunes, with signal fires on their tops joined by
    an arc, above the word ATALAIA.
  word: >-
    An <em>atalaia</em> is a watchtower: a lookout post on a hill or a stretch of coast. The word
    came into Portuguese from the Arabic <em>aṭ-ṭalāʾiʿ</em>, "the scouts", and <em>estar de
    atalaia</em> still means "to be on the lookout".
  fit: >-
    A field controller sees every prop on the field and tells the GM the moment something changes.
    Watchtowers were local-first too, and ran the original low-bandwidth mesh: smoke by day, fire by
    night, relayed from tower to tower. Skirmesh-RF follows the same rules with LoRa.

safety:
  title: Field safety
  text: >-
    Atalaia props are game equipment. Make them look like game props: bright colours, clear "GAME
    PROP" labels, and nothing resembling a real explosive device. Transport them in labelled cases,
    never leave them unattended outside the field, and treat lithium batteries with care.

footer:
  licences: >-
    Atalaia is free software: GPL-3.0-or-later for the core, firmware, app and modes;
    AGPL-3.0-or-later for the field controller and site server; CERN-OHL-S-2.0 for hardware;
    CC BY-SA 4.0 for documentation and this page.
  licensing: Licensing
  manuals: Manuals for players, organisers, marshals and box operators
  independent: >-
    Independent and community-run; not affiliated with any commercial prop maker. This page sets no
    cookies and loads nothing from other sites.

# The two radio diagrams: site/src/diagrams/*.svg, built into site/img/diagrams/.
# Plain text, not HTML. Each text has a fixed room in the drawing; if a
# translation does not fit, tools/build_site.py names the key and the line.
diagrams:
  lora:
    title: How LoRa radio works
    desc: >-
      Five panels. Chirps: LoRa sends each symbol as a tone that sweeps across the channel, and a
      receiver that knows the pattern can decode it even below the background noise, so it
      reaches far on little power but carries only short messages. Spreading factor: each step up
      from SF7 about doubles the time a message spends on air, for a little more range; the boxes
      use SF7 today. Range: longest over open ground in line of sight, shorter through woods,
      people and vehicles, much shorter inside buildings, and cut off by concrete, metal or a
      hill, where a box in between can relay; 868 MHz gets through obstacles better than 2.4 GHz
      Wi-Fi or Bluetooth. The design estimate of about 0.5 to 2 km on a typical outdoor field is
      still to be measured in the phase 2 field test. Relays: a box out of the controller's reach
      is heard through the other boxes, and a message is passed on at most twice by default. Rules in Europe:
      one shared game channel, 869.525 MHz by default, the only part of the band that allows
      500 mW and 10% of the time, 6 minutes per hour for each device; other channels allow 25 mW
      and 1% or less.
    chirp:
      title: "Chirps: heard below the noise"
      sweep: a chirp sweeps across the channel
      noise: noise
      below: decoded even below the noise
      text: >-
        The receiver knows the sweep pattern, so it hears it below the noise: long range on little
        power, but slow, so messages are short.
    sf:
      title: Spreading factor (SF)
      axis: Time on air for the same message
      text: >-
        Each step up about doubles the time on air, for a little more range. The boxes use SF7
        today; the design plans SF9–10 for large outdoor fields.
    range:
      title: Open ground or indoors
      axis: How far a message gets (a sketch, not to scale)
      open: Open ground, in line of sight
      woods: Woods, people, vehicles
      walls: "Indoors: brick and stone walls"
      blocked: Concrete, metal, behind a hill
      relay: → a relay box helps
      text: >-
        868 MHz gets through walls, people and leaves better than 2.4 GHz Wi-Fi or Bluetooth, but
        concrete, metal and hills cut it hard.
      note: >-
        Design estimate: about 0.5–2 km on a typical outdoor field. The phase 2 field test will
        measure it.
    relay:
      title: Boxes relay for each other
      controller: Controller
      box_a: Box A repeats
      box_b: Box B
      text: >-
        A box out of the controller's reach is heard through the others. A message is passed on at
        most twice by default (the hop limit), so the channel stays clear.
    rules:
      title: Rules of the air in Europe (EU868)
      hour: 1 hour
      share: Each device may transmit at most 10% of the time, 6 minutes per hour.
      text: >-
        One shared channel, 869.525 MHz by default: the only part of the band allowing 500 mW and
        10%. Other channels: 25 mW, 1% or less. No licence or SIM card.
  skirmesh:
    title: Skirmesh-RF on different devices
    desc: >-
      Left, the five layers of Skirmesh-RF from the bottom up: 1, the LoRa radio on one shared game
      channel; 2, the Skirmesh-RF packet, with AES-128-CCM encryption under a key for each game,
      epoch and sequence numbers against replays, a hop limit for relaying (two relays by default), ACKs, TIME beacons and
      CLAIM for controller failover; 3, the messages HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG and
      CLAIM in CBOR; 4, the shared C core and Lua game modes; 5, the field controller's REST,
      WebSocket and MQTT APIs, GM console, scoreboard and join codes (NFC cards for boxes, QR codes
      for a standby controller and, in phase 3, phones). Right,
      which layers each device runs. Built and tested in software, not yet on a field: the Field
      Box (layers 1 to 4), the USB radio modem (1 and 2) and the field controller on a Raspberry Pi
      or PC (2 to 5), and the GM console on phones over Wi-Fi, which use layer 5 with no LoRa radio.
      Built in software for phase 3 too: the I/O pod (1 and 2) that gives an Android phone or
      tablet (2 to 4) a radio, and the player app. Planned: the satellite box (1 to 4).
    stack: One protocol, in layers
    l5:
      title: Field controller services
      text: >-
        REST, WebSocket and MQTT APIs, GM console, scoreboard. Join codes: NFC cards for boxes,
        QR codes for a standby controller and, in phase 3, phones.
    l4:
      title: "Game: shared core, Lua modes"
      text: >-
        The same C core and Lua modes run on every device that plays: zone rules on the boxes,
        field-wide rules on the controller.
    l3:
      title: Messages
      text: >-
        HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG and CLAIM, packed as compact CBOR. Over Wi-Fi
        the same events travel as JSON.
    l2:
      title: Skirmesh-RF packet
      crypto: AES-128-CCM encryption, key per game
      replay: "Epoch and sequence: replays refused"
      hops: "Hop limit: 2 relays at most, by default"
      acks: "ACKs: lost events are sent again"
      time: TIME beacons keep clocks in step
      claim: "CLAIM: a standby can take over"
    l1:
      title: LoRa radio
      text: One shared game channel, 869.525 MHz by default, that every device listens on.
    devices: Which device runs which layers
    cells: "Coloured: the layers it runs"
    box_sub: ESP32-S3 and an SX1262 LoRa radio
    satellite: Satellite box
    satellite_sub: "Planned: a smaller ESP32 box"
    modem: USB radio modem
    modem_sub: "Plugs into the controller: radio, encryption"
    controller: Field controller
    controller_sub: "Raspberry Pi or PC: the game, the API"
    pod: I/O pod
    pod_sub: "Phase 3: gives a phone a radio and buttons"
    android: Android device
    android_sub: "Phase 3: a phone or tablet runs the modes"
    wifi: Phones on Wi-Fi
    wifi_sub: GM console and player app
    legend: >-
      Solid: built and tested on a computer and in an emulator, not yet on a field. Dashed:
      planned. Phones on Wi-Fi use layer 5 and need no LoRa radio.

# The "How it fits together" page (site/src/architecture.html): its texts, then the labels
# of the seven Mermaid diagrams (site/src/diagrams/arch-*.mmd), drawn into SVGs by
# tools/render_diagrams.py. After changing a label, run it again. A label may not hold
# a double quote, a backtick, a semicolon or a hash. arch.tNNN: the English text is in en.yaml;
# the same text has the same key. **x** is bold, \n a line break, <br/> a line break in a plain label.
architecture:
  title: "How it fits together"
  intro: "Which part of Atalaia talks to which, over what link, and what travels on it. Under each diagram: what flows, and what does not."
  status: "Atalaia is pre-alpha. On real boards, on a bench, these have run: boot, the radio, buttons, adoption and an update over the air. The rest is built and tested in software only."
  reading: "Reading the first diagram: a solid line works with no internet at the field, a dashed line needs the internet."
  flows: "What flows"
  not: "What does not flow"
  full: "Open the diagram at full size"
  scroll: "Wide diagram: scroll sideways."
  doc: "The same diagrams as live Mermaid, with the full text and the places where the design and the code differ: docs/architecture.md on GitHub →"
  link_roadmap: "How the parts talk to each other: the architecture diagrams →"
  link_build: "Not sure what plugs into what? See how the parts talk to each other →"
  d1:
    title: "The whole system"
    flows: "Game traffic stays at the field. Boxes and the controller talk over LoRa through the USB modem. The GM console, the players' app, the Android props and the files a box fetches all use the field's own Wi-Fi."
    not:
      - "Nothing in a game waits for the internet. The site server is optional."
      - "Players' positions never go over LoRa or MQTT."
      - "The site server never connects to the controller: the controller always opens the connection."
      - "Boxes never talk to the internet. The controller fetches modes, and a person uploads firmware."
  d2:
    title: "The radio layers"
    flows: "Every packet is encrypted and checked with AES-128-CCM under the game's key. The modem seals and opens the packets, so the controller and the modem speak plain frames over the cable. Boxes repeat each other's packets."
    not:
      - "No positions, names, tokens, Wi-Fi passwords, firmware images or mode packages go over LoRa."
      - "Large files are fetched over HTTPS. Only a short offer or a failure report uses LoRa."
  d3:
    title: "A game, from the invite to the end"
    flows: "A free box announces itself and the GM invites it. The join payload (game id and key, role, teams, channel) arrives sealed. The game starts only when every role has a box. Boxes then send events, and a STATE every 15 s."
    not:
      - "The GM console never speaks LoRa: it talks only to the controller."
      - "The game key travels only inside the sealed invite (or on a card), never in an announcement."
  d4:
    title: "Players on game day"
    flows: "A player scans the poster, pins the field's CA, checks in and gets a token. The app then follows the live stream. A marshal signs chrono readings on their own phone."
    not:
      - "Positions never go over LoRa or MQTT, and never reach players of other roles."
      - "No internet is needed: all of this works with the site server off."
  d5:
    title: "Controller and site server"
    flows: "The controller pushes games, events, scores, nodes and chrono records every 30 s in a game and every 5 min between games. It pulls schedules, rosters and settings. A stream carries the live view and the remote GM's commands, which the controller checks again."
    not:
      - "The site server never connects to the controller and never holds the game key, the join key or tokens."
      - "Offline is normal: events wait and are sent in order later."
      - "Positions leave the controller only in two opt-in cases (remote GM, remote ATAK relay), in memory."
  d6:
    title: "Getting things onto a box"
    flows: "Release and mode keys sign the files, and their public halves are built into the box. A person downloads the signed firmware and uploads it to the controller. The controller offers the update over LoRa and the box fetches it over the field's Wi-Fi. A box is adopted by USB cable, NFC card or pairing code."
    not:
      - "The signature, not the channel, makes a file safe: the box decides, with the keys in its own firmware, before it writes a byte."
      - "The controller never downloads firmware from GitHub."
      - "Release keys and mode keys are separate keys."
  d7:
    title: "Login and accounts on the site server"
    flows: "A short-lived access token plus a refresh token that is replaced at every use. Staff roles count only in a session with a second factor (TOTP or a passkey). A social login alone is not a second factor."
    not:
      - "The controller does not use these accounts: it uses the field's API key."
      - "A social provider is contacted only by the person's browser and the site server, never by a controller, a box or a modem."
