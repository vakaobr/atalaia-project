try:
  title: Try it today
  intro: >-
    No hardware is needed: the shared core runs on a computer. The simulator plays a mode in your
    browser: hold team buttons, watch each prop's screen and follow the event log. The commands
    below are typed in a terminal.
  compiler: With a C compiler
  docker: With Docker only
  then: >-
    Then open <code>http://localhost:8000</code>. You need Python 3.10+ with PyYAML. The
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">simulator
    guide</a> has every option.
  board:
    title: On a board
    text: >-
      The <a href="{{ page.to.glossary }}#glossary-firmware">firmware</a> of the Field Box, the USB
      radio modem and the I/O pod is written, and all three run in tests on a computer. The Field
      Box's has run on a real Heltec V4.3 on the bench: it boots, powers the radio, reads two buttons
      and plays Bomb, with the board's own small screen showing the game; the modem's and the pod's
      have not run on a board yet. To try a bare board without a box, there is a bench build of the
      firmware (keys over the USB cable). To build a box and
      flash it, follow the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">build
      manual</a>; the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">firmware
      guide</a> builds the modem and the pod too.
  app:
    title: On an Android phone
    text: >-
      Build the app's debug APK with Docker and install it on a phone with Android 8.0 or later, or
      on the Android emulator, as the
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">app
      guide</a> explains. It has run on emulators, not yet on a real phone.

roadmap:
  title: Roadmap
  intro: >-
    Six phases, each closed by a real field test, its gate. The software has gone ahead of the
    hardware: phases 1 and 2 are done in software, the first board already plays Bomb on the bench
    and the gates wait for built boxes; phase 3 is nearly complete in software, and phase 4 has
    started.
  # The main page shows each phase's title and short line, then this link to the roadmap page.
  more: The full roadmap, with what each phase holds and its gate →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code).
  done: Done
  software: Software done
  current: In progress
  designed: Designed
  p0:
    title: Foundations
    short: >-
      Shared core, Lua sandbox, Skirmesh-RF codec and browser simulator. Gate met.
    text: >-
      Shared core, <a href="{{ page.to.glossary }}#glossary-lua">Lua sandbox</a>,
      <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF codec</a>, browser simulator.
    gate: >-
      Gate: the simulator runs Domination and Bomb from Lua scripts. <strong>Met.</strong>
  p1:
    title: Single box
    short: >-
      Field Box firmware and a build manual; the first board plays Bomb on the bench, waiting for
      the first built box.
    text: >-
      Field Box build, ESP32 firmware, on-device presets, and a build manual with a wiring diagram.
    gate: >-
      Gate: one box runs a 2-hour club game with no restarts. The firmware and its screens are
      done and run in an emulator, and the build manual with its wiring diagrams is written. The
      first board (Heltec V4.3, 20 October 2026) boots, powers the radio, reads its buttons and plays
      Bomb (arming, defusing, the timer running out) on its own small screen; the gate stays open
      until a built box runs the 2 hours.
  p2:
    title: Field network
    short: >-
      Skirmesh-RF over LoRa, field controller, API, GM console and a mode pack, tested in
      software; on the bench, two boards exchange radio packets and a box has played a game with the field controller through its USB modem.
    text: >-
      Skirmesh-RF over LoRa, field controller, API, GM console, and a mode pack, now written and
      tested in software: Hold-All Domination (score only while holding every box), Last Stand (a
      countdown to defeat while holding one of three), per-team arming codes on Bomb, and the Codes
      modifier (keypad codes that grant points, hints or unlocks, with the GM told who used
      them).
    gate: >-
      Gate: 5 boxes on a <a href="{{ page.to.glossary }}#glossary-cqb">CQB</a> site and an outdoor field, zero lost
      captures. The encrypted radio protocol, the field controller with its API, the USB radio
      modem, the organisers' console with a scoreboard, joining a game with an NFC card or a QR
      code, and the boxes' firmware talking to the controller are built and tested in the
      simulator, the emulator and on a computer, whole games included. The gate needs the radio
      boards.
  p3:
    title: Android and players
    short: >-
      Android props, the I/O pod, the player app and the modes that need phones: done in software,
      except the phone as field controller and iOS; the field test waits for real phones and pods.
    text: >-
      Android props, the <a href="{{ page.to.glossary }}#glossary-android-prop">I/O pod</a>, the app for players,
      marshals and the GM, and the modes that need players' phones and tags.
    done: >-
      <strong>Done in software</strong> (plan phases A to F): Kill Confirmed, Respawn and Lives and
      Player Check-in, which read players' signed NFC tags, and the Medic Kit (a hit player scans
      their tag and holds a button to be healed, with a limited number of heals); mode screens
      described in YAML, drawn alike by the Field Box and the app;
      <a href="{{ page.to.glossary }}#glossary-chrono">chrono check-in</a> (energy, limits per class, spot checks,
      readings signed by the marshal). The app runs the same game core as the boxes, in Portuguese
      and English: an Android phone acts as a box (any mode, with the mode's own screens, big team
      buttons, a keypad and NFC tags) and joins a game by QR code, NFC card or text; players follow
      the game; marshals have the chrono, the replica registry and players' tags; the GM opens the
      console. Players check in at the field by scanning a printed poster (no account, no
      internet), say which replicas they will use and see whether they have passed the chrono;
      marshals work from that "replicas to chrono" list, and their signed readings mark each
      replica passed or refused. Players can share their position during a game, and the
      controller decides who sees it. An Android prop takes part in the controller's game over the
      field's Wi-Fi, or over its radio through an I/O pod, whose firmware lends the phone a Heltec
      board's team buttons, keypad, lights, siren, NFC reader, enclosure switch and LoRa radio over
      USB or Bluetooth. A field or club that runs its own controller can show its logo, wallpaper
      and colour in the app, on the scoreboard and on the poster, and give its teams names and
      crests.
    todo: >-
      <strong>Still to come.</strong> In software: the phone as the field controller (its MQTT
      broker and position filter are built, the controller itself is not) and the iOS version (not
      built: it needs a Mac); the Money Factory mode is deferred. Plan phase G, the field test with
      real phones and pods, waits for the hardware: so far the app has run only on Android
      emulators, and the pod firmware only as its own code on a computer.
    gate: "Gate: one game mixes ESP32 and Android props without issues."
  p4:
    title: Site server and advanced play
    short: >-
      Site server, game scheduling and registration, custom scenarios, advanced modes, ATAK.
      Started: advanced modes (Master and Satellites, the Hacking Terminal, VIP / Payload and the logic of Target Windows), custom scenarios (their runtime, compiler, console editor and objectives in the app), geo utilities in the core, the ATAK feed (on the field and, through the site server, for staff away from it), and the site server's accounts, personal data rights, controller sync, chrono registry, game scheduling with public field pages, feeds and registration, club profiles with branding sync, game history and the scenario library, device health, a firmware catalogue, over-the-air firmware updates for the Field Box, adopting boxes to the field (NFC field card, USB cable or the code the box shows), inviting boxes into the next game over the radio, and a start that waits for every role to have a box, the remote GM, staff web pages for them and the deployment (HTTPS, encrypted backups, restore), hosted mode for many fields on one server, with its deployment, are built in software.
    text: >-
      Site server (accounts, game history, the chrono registry, scheduling games, registration and
      publishing), custom scenarios, advanced modes (master and satellite zones, VIP escort, hacking
      terminals and more) and <a href="{{ page.to.glossary }}#glossary-atak">ATAK</a>. The research, the architecture and
      the implementation plan are written, and the plan is being built in small steps.
    done: >-
      Done in software and tested on a computer, not yet on real boxes or a real server. Modes:
      Master and Satellites (satellites held with the master raise its points; the master
      changing hands frees them), the Hacking Terminal (a puzzle on the keypad that reveals a code
      or captures the terminal), VIP / Payload (a team escorts its VIP or a phone with GPS to an
      extraction zone; checkpoint boxes score while held; positions stay on the field controller
      and the phone), the runtime of custom scenarios (a scenario runs on the field controller and
      tells the boxes of the built-in objectives package what to be: a point to capture, a code,
      tags or cards to scan, a bomb site; they report, the scenario scores), the scenario compiler (a YAML scenario of seven objective types, with
      dependencies, reveals and time windows, checked with every problem located and explained, and
      compiled into such a scenario from the command line), scenarios in the GM console and the app
      (the console's scenario editor lists every problem as the organiser types and installs the
      scenario; the boxes get the scenario's names when they join; players see in the app the
      objectives meant for them, with their names and how each stands, a hidden one only once it is
      revealed), the rules of Target
      Windows (a hit while the target shows a
      team's colour scores for that team; the target addon is not built yet), geo utilities
      in the core (distances and zones for every script, identical on every platform), and the
      ATAK feed (the boxes and zones on ATAK maps over the field Wi-Fi, in their owners' colours,
      placed by giving two corners of the field image their map position; player positions never
      go to everyone, only to staff devices when the field turns it on; staff away from the
      field get the same through the site server, over an encrypted connection with a certificate per
      device that the field issues and can revoke at once, positions only to a GM's or a marshal's;
      not yet tried with a real ATAK phone). Site
      server: its skeleton (database, migrations, health check, in its own container), accounts
      (passwords, two-factor codes required for organisers and marshals, sessions and roles per
      field) and personal data rights (access, export, correction, erasure, consent records, a
      daily retention purge), and the controller sync (field controllers push their games, logs
      and scores to the site server, offline first and safe to replay; not yet over a real 4G
      link), and the chrono registry (signed readings verified and kept as signed, public keys only,
      sharing between fields with consent; not yet with a real chronograph), and game scheduling with a public page per field and open
      iCalendar and JSON feeds of its games (no personal data on them), and registration for those
      games with pre-declared replicas and a check-in ticket: the field controller pulls the list
      and reports who came; registering from the app, and importing a registration list (CSV or
      JSON) exported from another platform; and club profiles (name, colour, logo and crest,
      members, a public page off by default with a report button and moderation) with the field's
      branding and saved teams synced to its controllers, so a club's crest reaches every field that
      saved its team; and device health (each box's battery, link and firmware from what the
      controllers send; the field controller now reports a box that goes silent or comes back and a
      low battery, which a box with a battery gauge also reports itself; not yet on real boards), a firmware catalogue that only lists releases signed with a trusted key
      and over-the-air firmware updates for the Field Box: the GM uploads a signed release to the
      field controller and updates the boxes between games, never during one; each box downloads it
      over the field Wi-Fi, checks the signature with keys built into its own firmware, installs it in
      its spare slot and goes back to the old firmware if the new one does not start (in software,
      not yet on a real board), adopting boxes to the field with an NFC field card, the controller's USB cable or the 6-digit code the box shows, paired over the radio (in software, not yet on a real board), boxes whose game is over announcing themselves over the radio so the GM invites them into the next game from the console, with no card or QR code (the join travels encrypted under a key derived from the field join key), and a game that starts only once every role has a box, unless the GM chooses "Start anyway" (tested on two bench boards with the field controller), boxes heard in every new game (the radio's nonce counter is now per game, a fix found on the bench) and box screens that follow the game (Ready, Waiting, Neutral) in the field's language, English or Portuguese (tested on two bench boards), a controller restarted mid-game takes it up again, one that lost the game's key still tells its boxes over the field radio that the game is over, and wrong admin PINs wait longer and longer, counted across restarts, with no default PIN on a real box (in software, not yet on the bench boards), and the remote GM: an organiser
      with the GM role, logged in with a two-factor code, sees the live game and starts, pauses,
      resumes or ends it, or sends a message or a mode command, over a connection the field
      controller opens itself, only when the field turns it on, with every command logged on both
      sides; and game history (each game's score timeline and event log; players and spectators
      see a live game a minute behind, without secrets or player ids), a public scoreboard per field
      (off by default) and the field's scenario library with its game presets, checked as the field
      controller checks them and installed by every controller of the field, a standby included;
      and web pages for the field's staff (log in with the two-factor code; the game history with each
      game's score timeline and event log, the scenario library with every problem shown before
      saving, revisions and presets, device health, and the remote GM's live view and commands), in
      Portuguese and English and on a phone, tested in a headless browser, not yet on a real server; and
      the deployment: HTTPS through Caddy with an automatic certificate, a setup script that makes
      every secret, encrypted daily backups and a restore into a fresh database, tested in Docker on a
      computer, not yet on a real server with a real domain; and hosted mode: one server for many
      fields, each in a database schema of its own at its own address, with row-level security
      underneath so that no field ever sees another's data, and the operator's commands to export a
      field's data or delete it, tested against PostgreSQL in Docker, and its deployment: a setup script that makes the hub's
      database roles, each field at its own address with a certificate that only an active field's
      name can get, and encrypted backups restored with every field kept apart as before, tested in
      Docker on a computer, not yet on a real hosted server with a real domain, and not offered
      before a lawyer has reviewed the templates.
    gate: >-
      Gate: a weekend <a href="{{ page.to.glossary }}#glossary-milsim">milsim</a> runs on Atalaia end to end.
  p5:
    title: Community
    short: >-
      Visual mode editor, mode registry, carrier PCB, translations, build guides. Research,
      architecture and plan written; no code yet.
    text: >-
      Visual mode editor, mode registry, carrier PCB (a ready-made circuit board that makes builds
      easier), translations, build guides for other node types. The research, the architecture and
      the implementation plan are written; there is no code yet.
    gate: Ongoing after the first release.

hub:
  title: Community hub
  intro: >-
    Fields, teams and builders will meet here. Everything is opt-in: the hub holds only what people
    choose to publish, and game data stays on each field's own servers.
  open: Open
  planned: Planned
  later: Later
  discussion:
    title: Discussion
    text: Questions, ideas, reviews of the design and event reports.
    link: Go to Discussions
  gallery:
    title: Build gallery
    text: >-
      Photos, bills of materials, enclosure files and wiring notes for each build, starting with
      the first Field Box prototypes.
  directory:
    title: Field and team directory
    text: >-
      An opt-in list of fields and teams that use Atalaia, with region, site type and a contact
      link.
  browser:
    title: Mode and scenario browser
    text: The mode registry, with descriptions, downloads and community ratings.
  stats:
    title: Usage statistics
    text: Opt-in, anonymous totals of versions, platforms and modes played. Off by default.
  hosting:
    title: Hosted site servers
    text: For clubs without IT support, at cost, with every club's data separate and exportable.

# Each entry: id (the anchor, stable ASCII), term (as shown) and text (1-3 sentences).
glossary:
  id: glossary
  title: Glossary
  intro: >-
    The technical words of these pages, in plain terms. The links in the text of every page lead
    here.
  groups:
    game: The game
    hardware: Hardware
    radio: Radio and connections
    software: Software
    licences: Licences
  props:
    id: glossary-props
    term: Props
    text: >-
      The electronic devices of a game: boxes to capture, bombs to arm and defuse, terminals to
      hack, targets to hit. In Atalaia any device can be one: a purpose-built box, a phone or a
      small board.
  field_box:
    id: glossary-field-box
    term: Field Box and Satellite
    text: >-
      Atalaia's own prop designs, built from off-the-shelf parts around an ESP32. The Field Box is
      the main one, with big arcade buttons, a keypad, a screen, lights, a speaker and an NFC reader
      in a weatherproof case, for roughly <span class="nowrap">€70–110</span> in parts; the
      Satellite is a smaller box for a secondary point, for about
      <span class="nowrap">€30–40</span>. The Field Box's firmware and build manual are ready; its first
      prototypes wait for their parts (phase&nbsp;1).
  milsim:
    id: glossary-milsim
    term: Milsim
    text: >-
      Short for military simulation: long games, often over a whole weekend, with missions, a chain
      of command and realistic rules. It is the biggest test for Atalaia: 10 to 20 boxes and
      satellites spread over a large area.
  cqb:
    id: glossary-cqb
    term: CQB
    text: >-
      Close-quarters battle: games inside houses, palacetes, warehouses and other tight spaces,
      usually under about 150 m across. Everything is close and fast, so Atalaia's CQB profile uses
      shorter capture and bomb times, and places the boxes on a floor plan instead of using GPS.
  chrono:
    id: glossary-chrono
    term: Chrono and joules
    text: >-
      A chrono (chronograph) measures how fast a replica fires a BB. From the speed and the BB's
      weight comes its energy in joules, which fields cap per type of replica: a 0.20&nbsp;g BB at
      100&nbsp;m/s (about 328&nbsp;fps) carries 1 joule. Atalaia keeps each replica's readings, signed
      by the marshal, so marshals can run spot checks during the day (built in software, not yet
      used on a field); a person always decides any penalty.
  microcontroller:
    id: glossary-microcontroller
    term: Microcontroller
    text: >-
      A complete, tiny computer on a single chip, made to run one program. It starts in a moment,
      uses very little battery and is cheap, which makes it the usual brain of an electronic prop.
      ESP32 and Arduino boards are microcontroller boards.
  esp32:
    id: glossary-esp32
    term: ESP32
    text: >-
      A popular, cheap microcontroller with Wi-Fi and Bluetooth built in; many boards also carry a
      LoRa radio. It is the brain of the Field Box, the Satellite and the I/O pod, and should keep a
      prop going for one to three days on a battery (an estimate, not yet measured). Boards people
      already own can join too, even
      without extra memory (PSRAM), with a few limits.
  arduino:
    id: glossary-arduino
    term: Arduino-class board, thin node
    text: >-
      Simple, very cheap microcontroller boards in the Arduino style, such as those with AVR or
      RP2040 chips. They are too small to run game modes, so in Atalaia they act as thin nodes: they
      lend their buttons, lights or sensors to a nearby box or to the field controller, which runs
      the rules for them.
  raspberry_pi:
    id: glossary-raspberry-pi
    term: Raspberry Pi
    text: >-
      A small, cheap computer about the size of a credit card, running Linux. With a LoRa radio
      board added, it will be the usual field controller (about <span class="nowrap">€80–150</span>
      for the whole build), and it
      can also run props that need a big screen or a camera.
  android:
    id: glossary-android-prop
    term: Android prop and I/O pod
    text: >-
      The Atalaia app turns an Android phone or tablet, new or a spare one from 2017 or later, into a
      prop that runs any game mode on its screen. Phones have no LoRa radio and touch screens are
      hard to use with gloves, so a small ESP32 box, the I/O (input/output) pod, connects by cable or
      Bluetooth to add the radio, big buttons, lights and a siren. Both are built in software
      (phase&nbsp;3) and tested on emulators and a computer, not yet on a real phone or pod.
  firmware:
    id: glossary-firmware
    term: Firmware and flashing
    text: >-
      Firmware is the program built into a device, which starts when you switch it on. Flashing
      means writing a new version of it onto the device, usually over a USB cable. Atalaia boxes
      are flashed by cable, and for now a new game mode comes with a new flash; later, modes will
      arrive as scripts. Firmware updates now come from the field controller over Wi-Fi (built in
      software, not yet tried on a real board), undoing themselves if a new version fails to start.
  lora:
    id: glossary-lora
    term: LoRa
    text: >-
      Short for <em>long range</em>: a radio that sends small messages far on very little power,
      with no SIM card, mobile coverage or subscription. On a typical field it should reach roughly
      <span class="nowrap">0.5–2&nbsp;km</span> (a design estimate, still to be measured), and gets
      through thick walls better than Wi-Fi.
      The catch: messages must be short, and each device may transmit only a small share of the
      time. Atalaia uses 869.525&nbsp;MHz by default, in the only EU868 sub-band that allows
      a 10% duty cycle and 500&nbsp;mW, giving each box up to 6 minutes of airtime per hour —
      enough for events, scores and time-sync beacons with headroom to spare. A field can choose
      another channel, which allows 1% of the time or less and 25&nbsp;mW. Boxes send only what changes,
      such as “red captured B”.
  mesh:
    id: glossary-mesh
    term: Mesh
    text: >-
      A network in which devices pass messages on for each other, so a box too far from the base
      is heard through the boxes in between. Atalaia repeats each message only a couple of times,
      so the radio does not clog, and organisers can place extra boxes as repeaters on difficult
      ground.
  skirmesh:
    id: glossary-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      Atalaia's own radio protocol: the agreed format in which boxes, the controller and apps
      exchange messages, over LoRa, Wi-Fi or Bluetooth. It is documented in public, so anyone can
      build a device that joins in, and every message is encrypted and signed with a key for that
      game, so a player with a radio cannot simply fake a capture. It is built and tested in
      software, not yet on a field.
  links:
    id: glossary-wifi-ble-nfc-qr
    term: Wi-Fi, BLE, NFC and QR codes
    text: >-
      Everyday short-range links, each with its own job. Wi-Fi (about
      <span class="nowrap">50–150&nbsp;m</span>) carries the bulky things: the organisers' console,
      the player app, new modes and updates; BLE, or Bluetooth Low Energy
      (<span class="nowrap">10–30&nbsp;m</span>), links a phone to its pod and pairs devices. NFC is
      tap-to-read, like a contactless card, for team tags, wristbands and join cards, and QR codes
      are scanned with a phone camera to join a game or enter a code.
  api:
    id: glossary-api
    term: "API: MQTT, REST and WebSocket"
    text: >-
      An API is a documented way for other programs to read a game and, with permission, control
      it. With it a club will be able to drive a big LED scoreboard, a live score overlay on a
      stream, Discord or Telegram alerts, or a relay that sets off smoke and sirens when the bomb
      goes off. MQTT, REST and WebSocket are three standard ways in, so ordinary tools work with
      it. The field controller has it since phase&nbsp;2, with a ready-made scoreboard page; it has
      been tested on a computer and not yet on a field.
  atak:
    id: glossary-atak
    term: ATAK
    text: >-
      The Android Team Awareness Kit: a map app made for the military, with a free civilian version
      that many milsim teams use to see their team mates on a shared map. Atalaia's field
      controller will be able to show the boxes on those maps, and which team holds each one
      (phase&nbsp;4).
  local_first:
    id: glossary-local-first
    term: Local-first
    text: >-
      Everything a game needs runs on the field itself, on the boxes and the field controller, so
      it works with no internet or mobile coverage at all. When the internet is there, it only adds
      extras, such as accounts and game history. A box that loses contact keeps playing and keeping
      score, and catches up when the link returns.
  core:
    id: glossary-core
    term: Shared core (C11)
    text: >-
      The heart of Atalaia: one program, written in the C programming language (its 2011 version,
      hence C11), that every device running game modes uses. It handles events, scores and radio
      messages and runs the game modes safely; each kind of hardware only adds a thin layer with
      the drivers that work its buttons, screen and radio. It exists today.
  lua:
    id: glossary-lua
    term: Lua and game-mode scripts
    text: >-
      A game mode is a script: a short text file of rules, such as “hold for 5 seconds to
      capture”, written in Lua, a small programming language well known from video-game modding.
      Scripts run in a sandbox, a sealed space with no access to files or the network, so a shared
      mode cannot harm a device. Organisers never need to touch Lua: they pick a mode and fill in
      its settings, and a visual, block-based editor will follow in phase&nbsp;5.
  simulator:
    id: glossary-simulator
    term: Simulator
    text: >-
      A program that plays a game mode with virtual boxes in your web browser: you press the team
      buttons on screen and watch each box's display and the event log. It runs on an ordinary
      computer and exists today, so anyone can try Domination and Bomb before any hardware is
      built.
  controller:
    id: glossary-field-controller
    term: Field controller
    text: >-
      The base station of a game: a small computer, usually a Raspberry Pi or an Android device,
      that hears every box over the radio, runs the rules that span several boxes, keeps the
      official score and serves the organisers' console to their phones. If it fails, the boxes
      keep playing and another capable device takes over, and a single box can run a game without
      one. It is built (phase&nbsp;2) and tested on a computer, not yet on a field; running it on an
      Android device is still to come.
  server:
    id: glossary-site-server
    term: Site server
    text: >-
      An optional computer, at the field or rented online, that keeps what lasts beyond one game:
      player accounts, game history, the chrono registry and the services behind the player app.
      Games never wait for it. It comes in phase 4, and the community hub plans hosted ones, at
      cost, for clubs without IT support.
  open_source:
    id: glossary-open-source
    term: Open source and free software
    text: >-
      The source code, the human-readable recipe of a program, is public, and anyone may use,
      study, change and share it, even commercially. “Free” here means freedom, not price: fields
      may charge entry and makers may sell boxes.
  copyleft:
    id: glossary-copyleft
    term: "Copyleft: GPL and AGPL"
    text: >-
      The rule that keeps Atalaia open: using it as it is asks nothing of you, but passing on a
      changed version means sharing its source code under the same licence. The GPL, for the core,
      firmware, app and modes, applies when you give or sell copies; the AGPL, for the field
      controller and site server, also applies when you run a changed version for other people over
      a network. Hardware designs (CERN-OHL-S) and documentation (CC BY-SA) work the same way.

involved:
  title: Get involved
  intro: "Atalaia is built by players, field owners and makers. You can help today by:"
  review: >-
    reviewing the
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">design
    specification</a> and <a href="https://github.com/vakaobr/atalaia-project/issues">opening
    issues</a>;
  propose: >-
    proposing game modes with the
    <a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">game mode idea
    template</a>;
  share: sharing how your field plays, so the defaults fit real games;
  code: >-
    writing code: start with
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>.
  rules: >-
    Every commit carries a <code>Signed-off-by</code> line, and the project is strictly
    clean-room, written from scratch: no code, firmware, manuals, sounds or images from any
    commercial product.

name:
  title: The name
  badge_alt: >-
    The Atalaia badge: three watchtowers on sand dunes, with signal fires on their tops joined by
    an arc, above the word ATALAIA.
  word: >-
    An <em>atalaia</em> is a watchtower: a lookout post on a hill or a stretch of coast. The word
    came into Portuguese from the Arabic <em>aṭ-ṭalāʾiʿ</em>, "the scouts", and <em>estar de
    atalaia</em> still means "to be on the lookout".
  fit: >-
    A field controller sees every prop on the field and tells the GM the moment something changes.
    Watchtowers were local-first too, and ran the original low-bandwidth mesh: smoke by day, fire by
    night, relayed from tower to tower. Skirmesh-RF follows the same rules with LoRa.

safety:
  title: Field safety
  text: >-
    Atalaia props are game equipment. Make them look like game props: bright colours, clear "GAME
    PROP" labels, and nothing resembling a real explosive device. Transport them in labelled cases,
    never leave them unattended outside the field, and treat lithium batteries with care.

