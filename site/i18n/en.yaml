hero:
  status: >-
    Pre-alpha · phase 1 and 2 software done, real boards playing whole games with the field
    controller on the bench, phase 3 done in software, phases 4 and 5 built in software · not
    field-ready yet
  title: The open <span class="nowrap">force-on-force</span> platform
  lead: >-
    Atalaia is an open platform for the electronic props of airsoft, paintball and milsim: the
    boxes teams capture, the bombs they arm and defuse. Build a domination box from a €20
    <a href="{{ page.to.glossary }}#glossary-microcontroller">microcontroller</a> (a tiny, cheap computer board), turn an
    old Android phone into a hacking terminal, run a 20-box weekend milsim on a
    <a href="{{ page.to.glossary }}#glossary-lora">LoRa mesh</a> (long-range, low-power radio that the boxes relay to
    one another across the field), and write your own game modes as small scripts. Every game runs
    on the field itself: no cloud or internet needed, and no manufacturer can lock you in.
  discuss: Join the discussion
  design: Read the design
  source: Source on GitHub
  name: >-
    <em>Atalaia</em> (ah-tah-LYE-ah) is Portuguese for <em>watchtower</em>: a lookout on a hill
    that watched for trouble and passed the warning along.
  why_name: Why that name?
  # The night scene: each language now has its own copy with the title painted in its language.
  image_alt: >-
    Illustration: at dusk, a stone watchtower on a hilltop carries a radio box whose signals reach
    glowing orange GAME PROP boxes spread across a forested valley, while a group of players walks
    past them. Painted text reads "Open-source project ATALAIA".

game:
  title: How a game works
  intro: >-
    Playing needs no technical knowledge. This is how a game will run once the boxes are built (phases
    1 and 2); the <a href="{{ page.to.glossary }}#glossary-simulator">simulator</a> already plays the same modes on a
    computer today.
  setup:
    title: Set up
    text: >-
      The organisers place the boxes around the field and pick a game mode, such as Domination, on
      a box's keypad or from a phone, in under a minute.
  capture:
    title: Capture
    text: >-
      To take a box, a team holds its colour's button for a few seconds. The box lights up in that
      colour and scores for the team until the other side takes it back.
  relay:
    title: Relay
    text: >-
      Each box reports by radio to the <a href="{{ page.to.glossary }}#glossary-field-controller">field controller</a>, a
      small computer at the base; boxes far away are relayed by the ones in between. A box that
      loses contact keeps playing and catches up later.
  score:
    title: Score
    text: >-
      The controller adds it all up. The organisers follow the game live on their phones, and the
      field can show the score on a big screen or on a stream.

why:
  title: Why Atalaia
  intro: >-
    Electronic props add a lot to a game, but commercial systems keep the rules locked inside
    closed <a href="{{ page.to.glossary }}#glossary-firmware">firmware</a>. New modes wait on the vendor, there is no
    public <a href="{{ page.to.glossary }}#glossary-api">API</a>, and you cannot add your own hardware. Atalaia does it
    differently.
  local:
    title: Local-first
    text: >-
      Every game runs <a href="{{ page.to.glossary }}#glossary-local-first">on the field itself</a>, fully offline, from a
      single house to a multi-kilometre forest. The internet is optional.
  hardware:
    title: Any hardware
    text: >-
      Cheap <a href="{{ page.to.glossary }}#glossary-esp32">ESP32</a> boards, credit-card-sized
      <a href="{{ page.to.glossary }}#glossary-raspberry-pi">Raspberry Pi</a> computers, simple
      <a href="{{ page.to.glossary }}#glossary-arduino">Arduino-class</a> boards and new or repurposed
      <a href="{{ page.to.glossary }}#glossary-android-prop">Android phones</a> all have a place in the same
      game. The software for the ESP32 boxes, the field controller and Android phones is written; the
      Arduino-class boards come later.
  scripts:
    title: Modes are scripts
    text: >-
      Game modes are short <a href="{{ page.to.glossary }}#glossary-lua">Lua scripts</a>, small text files of rules, with
      a settings file: easy to read, change and share, and no mode needs code of its own in the boxes'
      built-in software. For now the boxes carry their modes built in; sending a new one without
      reflashing (reinstalling) that software is still to come.
  open:
    title: Open protocol and API
    text: >-
      Props talk over <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>, a documented radio protocol,
      so anyone can build a device that joins in. The field controller offers MQTT, REST and
      WebSocket APIs for scoreboards, stream overlays and other tools.
  fields:
    title: Built for fields
    text: >-
      Player roles, squads, check-in at the field with a printed poster, and a
      <a href="{{ page.to.glossary }}#glossary-chrono">chrono</a> registry that keeps each replica's signed readings for
      spot checks are built in software; custom scenarios come in phase&nbsp;4.
  copyleft:
    title: Copyleft
    text: >-
      Fields that charge entry and makers who sell boxes are welcome. Anyone who ships or hosts a
      changed version <a href="{{ page.to.glossary }}#glossary-copyleft">shares the changes</a> back.

how:
  title: How it fits together
  intro: >-
    In plain words: the props on the field talk by radio to the field controller, a small computer
    at the base that runs the game and keeps the score. Phones connect to it over Wi-Fi, and
    scoreboards, stream overlays and map apps such as <a href="{{ page.to.glossary }}#glossary-atak">ATAK</a> through its
    API. An optional <a href="{{ page.to.glossary }}#glossary-site-server">site server</a> on the internet keeps accounts
    and history. The controller, its API and the organisers' console are built and tested on a
    computer, not yet on the field; of the site server only the skeleton and the accounts exist so
    far (logins with two-factor codes and per-field roles; no game data yet).
  core: >-
    Under the hood, every device that runs game modes uses the same
    <a href="{{ page.to.glossary }}#glossary-core">shared core</a>, written in C11, and the same Lua modes; only a thin
    layer for each kind of hardware differs. A mode written once plays the same on a box, a phone
    or a Raspberry Pi.
  diagram:
    title: >-
      An optional site server connects over the internet to the field controller. GM and player
      apps reach the controller over Wi-Fi, scoreboards and other tools over MQTT and REST, and
      props over the Skirmesh-RF LoRa mesh.
    server: Site server (optional)
    server_sub: accounts · history · player app
    apps: GM and player apps
    apps_sub: Wi-Fi
    controller: Field controller
    controller_sub: Raspberry Pi or Android
    tools: Scoreboards, ATAK
    tools_sub: MQTT, REST, webhooks
    mesh: Skirmesh-RF · LoRa mesh
    satellite: Satellite
    android: Android prop
    android_sub: with an ESP32 pod
    thin: Thin node
    thin_sub: Arduino-class
  list:
    server: >-
      <strong>Site server</strong> (optional): accounts, history and the player app, over the
      internet.
    controller: >-
      <strong>Field controller</strong> on a Raspberry Pi or Android: GM and player apps join over
      Wi-Fi; scoreboards and ATAK use MQTT, REST and webhooks.
    props: >-
      <strong>Props</strong> on the Skirmesh-RF LoRa mesh: ESP32
      <a href="{{ page.to.glossary }}#glossary-field-box">Field Boxes and satellites</a>, Android props with an ESP32 pod,
      and Arduino-class thin nodes.
  # English page only: the Portuguese page shows this image in its hero.
  image_alt: >-
    Isometric illustration: a small stone tower with a radio box on top stands in the middle of a
    square base, ringed by eight orange and yellow GAME PROP cases with antennas, all linked by a
    glowing circle.
  image_caption: >-
    The field controller is the watchtower: from the middle of the field it keeps every prop in
    sight.

radio:
  title: How the radio works
  intro: >-
    The props talk over <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>, a long-range, low-power radio, in
    Atalaia's own protocol, <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>. These two diagrams
    show what LoRa can and cannot do on a field, and how one protocol runs on very different
    devices. None of it has been on a real field yet: range and timing will be measured in the
    phase&nbsp;2 field test.
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    The props talk over <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>, a long-range,
    low-power radio, in Atalaia's own protocol,
    <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>. Two diagrams show what
    LoRa can and cannot do on a field, and how one protocol runs on very different devices. None
    of it has been on a real field yet.
  more: How the radio works, in two diagrams →
  # Each diagram's alt text is its description, diagrams.*.desc, also used inside the SVG.
  lora:
    title: What LoRa can do
    lead: >-
      LoRa trades speed for reach: it gets short messages across a field on very little battery,
      and its signal gets through walls and trees better than Wi-Fi does, although concrete, metal
      and hills still block it. A box that cannot reach the controller is heard through the other
      boxes, and European rules limit how much of the time each device may transmit.
  skirmesh:
    title: One protocol on every device
    lead: >-
      Skirmesh-RF is built in layers, from the radio up to the controller's API. A Field Box runs
      everything up to the game modes; a Raspberry Pi controller leaves the radio work to a USB
      radio modem; in phase&nbsp;3 an Android phone does the same with an I/O pod. Phones on
      the field's Wi-Fi need no LoRa radio at all.
  channel:
    title: Which channel, and why 869.525&nbsp;MHz
    lead: >-
      All of a game's traffic shares one channel. The default, 869.525&nbsp;MHz, is the centre of
      869.4–869.65&nbsp;MHz, the only part of the European 868&nbsp;MHz band where a device may
      transmit up to 10% of the time at up to 500&nbsp;mW. Elsewhere in 868–870&nbsp;MHz the rules
      allow 1% of the time (0.1% on 868.7–869.2&nbsp;MHz) at 25&nbsp;mW: about a tenth of the
      airtime, and much less range. 868.1, 868.3 and 868.5&nbsp;MHz are LoRaWAN's default
      channels and often busy. The default is shared too: LoRaWAN gateways send some replies on
      869.525&nbsp;MHz and Meshtastic's European default uses it, so near such users the GM can let
      the controller listen to every legal channel for a minute and pick the quietest, draw one at
      random, or choose by hand. The boxes then follow the chosen channel's own limits.
  region:
    title: "Radio regions: Europe and Taiwan"
    lead: >-
      A field is in one radio region, chosen once in the GM console. In Europe (EU868) the boxes use
      the channels above. In Taiwan (AS923, 920–925&nbsp;MHz) the NCC's rules (LP0002) give a single
      channel that does not hop full power only if it is at least 500&nbsp;kHz wide, so there the
      boxes use LoRa at 500&nbsp;kHz (SF9, about the same range as in Europe), at most 0.5&nbsp;W at
      the antenna, and 921.5&nbsp;MHz by default, away from the channels LoRaWAN and Meshtastic use.
      Every box, USB radio modem and I/O pod is built for one region and refuses the other regions'
      channels, so a box never transmits outside its band; the boxes learn the field's region with
      each game. The Taiwanese region is not certified: a product sold in Taiwan needs the NCC's type
      approval, and an antenna made for 920&nbsp;MHz. None of it has been tested on air yet.

modes:
  title: Game modes
  intro: >-
    Modes react to intent ("a team is claiming this prop"), not to hardware, so the same script
    runs on a Field Box, a keypad box or an Android phone. Fourteen modes, one modifier and the Medic
    Kit are written and tested in software today; none has run on a real field yet.
  # The main page shows three modes, then this link to the modes page.
  more: See all 14 modes →
  # At the end of the modes page.
  try: Try a mode in your browser today →
  domination:
    title: Domination
    text: >-
      A team holds the prop's input for a few seconds to claim it, and scores every tick while it
      keeps it. The other team can take it over at any time.
    meta: Team buttons · one box or many
  bomb:
    title: Bomb / Rush
    text: >-
      Attackers arm the bomb, then defend it; defenders must defuse it before the fuse runs out.
      Arm and defuse by holding a button, or give each team its own keypad code.
    meta: Team buttons or keypad · fuse and hold times are settings
  sabotage:
    title: "Sabotage"
    text: "Bomb in rounds, until the game time runs out. Attackers arm the bomb, defenders defuse it. An explosion is a point for the attackers, a defuse a point for the defenders; then the box rests and the next round starts. The team with more points wins."
    meta: "Team buttons or keypad · fuse, hold, pause and game times are settings"
  holdall:
    title: Hold-All Domination
    text: >-
      Teams capture boxes as in Domination, but a team scores only while it holds every box at
      once. Lose one and the scoring stops.
    meta: Several boxes · needs the field controller
  laststand:
    title: Last Stand
    text: >-
      The defenders start with every zone. Once they are down to their last one, a countdown to
      defeat runs until they retake another; when it runs out, the attackers win.
    meta: Several boxes · needs the field controller
  kill_confirmed:
    title: Kill Confirmed
    text: >-
      Players carry signed NFC tags. A team scans the tags it collected at a station: an enemy's
      tag confirms the kill, a teammate's denies it. Forged tags are refused.
    meta: NFC reader · player tags
  respawn:
    title: Respawn and Lives
    text: >-
      A respawn point counts lives per team or per player, with a cooldown between respawns. When
      a team runs out of lives, it is eliminated.
    meta: NFC reader or team buttons
  player_checkin:
    title: Player Check-in
    text: >-
      Players check in at a checkpoint with their tag. The box counts each team's players and can
      give points for every check-in.
    meta: NFC reader · player tags
  medic:
    title: Medic Kit
    text: >-
      Next to any mode: a hit player scans their tag and holds a button for a set time to be healed.
      The kit shows how many heals it has left; each player gets a limited number per game at every
      kit, the GM refills a kit from the console, and every heal shows in the GM's log and the
      players' view.
    meta: NFC reader and a button · player tags · needs the field controller
  master_satellites:
    title: Master and Satellites
    text: >-
      Teams capture a master box and its satellites. Only the master scores, and every satellite its
      holder also holds raises its points; when the master changes hands, every satellite goes back
      to neutral. Written and tested in software, not yet played on real boxes.
    meta: Several boxes · needs the field controller
  target_windows:
    title: Target Windows
    text: >-
      A target lights up in a random team's colour for a few seconds, and a hit while it is lit
      scores for that team. The game is written and tested in software; the target addon it needs
      (a plate with a hit sensor and a light ring) is not built yet.
    meta: A box with the target addon · not available yet
  hacking_terminal:
    title: Hacking Terminal
    text: >-
      A terminal sets a puzzle on its keypad: crack a code from how many digits are in the right
      place, cut the wires in the right order, or repeat a sequence. A wrong answer locks it for a
      while. Solving it can reveal a code for another objective, score, and capture the terminal
      until another team hacks it back. Written and tested in software, not yet played on a phone
      in the field.
    meta: A box or a phone with a keypad · works without the field controller
  vip_payload:
    title: VIP / Payload
    text: >-
      One team escorts its VIP, a player who shares their position from the app, or a payload, a
      phone with GPS, to an extraction zone; the others try to stop them. Checkpoint boxes along the
      way score while a team holds them. Positions stay on the field controller and the phone; only
      "extracted" goes out. Written and tested in software, not yet played with real GPS.
    meta: Checkpoint boxes, a phone with GPS or the VIP's phone · needs the field controller
  money_factory:
    title: Money Factory
    text: >-
      Teams capture factory boxes, which make money while they hold them. Players collect it by
      scanning their tag at their team's factory, carry it across the field and bank it at a bank
      box for points; the field controller keeps what each player carries, so the money can be
      collected at one box and banked at another. A player healed at a medic kit loses what they
      carry, and the first team to bank the target can win. Written and tested in software, not yet
      played on real boxes.
    meta: Factory and bank boxes or phones with NFC · player tags · needs the field controller
  progressive_domination:
    title: Progressive Domination
    text: >-
      Several boxes, but only one can be captured at a time, and both teams are told which. The
      team that holds the active box scores for every full minute; once a team has held it long
      enough, the box is completed for that team and locked, and the next box in the order is
      announced to both teams. The order is the GM's list, the box numbers or random; the game ends
      when the last box is completed, or when a team reaches a target score. Written and tested in
      software, not yet played on real boxes.
    meta: Boxes with team buttons · needs the field controller
  codes:
    title: Codes (modifier)
    text: >-
      Runs alongside any mode on the same box: keypad codes grant points, hints or unlocks, and the
      GM sees who used each code and which team held the box.
    meta: Keypad · works with any mode
  yours:
    title: Your mode
    text: >-
      Capture the flag, your club's own… Modes are short
      scripts. Propose one with the game mode idea template, or share a finished one as a signed
      package in the <a href="https://vakaobr.github.io/atalaia-modes/">mode registry</a>.
    link: Share a game mode idea

# The animated pictures of the modes page (tools/gen_mode_gifs.py, tools/mode_gifs.yaml):
# each picture's alt text (what happens in it, in order) and the caption under it.
gifs:
  intro: >-
    Every animation below is drawn by the Field Box's own firmware code, not mocked up: the big
    screen above, the small OLED below, as a game of the mode goes on. The button under a
    picture pauses it.
  play: Play animation
  pause: Pause animation
  domination:
    alt: >-
      Animation of a Field Box playing Domination. The screen shows a neutral zone; red holds
      its button, the small screen's bar fills, and the zone turns red with its points counting
      up. Then blue holds its button and takes the zone over, and the game ends with the final
      score.
    caption: >-
      Domination on a Field Box: a team holds its button to claim the zone, the points climb
      while it keeps it, and the other team can take it over.
  bomb:
    alt: >-
      Animation of a Field Box playing Bomb. The screen shows the bomb ready; red holds its
      button to arm it, the countdown starts at 4:59, blue holds its button to defuse, the bar
      fills, and the screen turns blue to show the bomb is defused.
    caption: >-
      Bomb / Rush: arming by holding a button, the fuse counting down, the defenders defusing in
      time.
  sabotage:
    alt: "Animation of a Field Box playing Sabotage. The screen shows the bomb ready with the score 0 : 0; red holds its button, the bar fills and the bomb is armed; it explodes and the screen turns red, a point for red. A pause shows 1 : 0 and the time to the next round, then blue holds its button to defuse the second bomb and the screen turns blue, a point for blue; the game-over screen shows red the winner."
    caption: "Sabotage: bomb rounds with a score, an explosion for the attackers, a defuse for the defenders, until the time is up."
  master_satellites:
    alt: >-
      Animation of Master and Satellites: a satellite box turns from neutral to red when red
      holds its button; then the master box shows how many satellites red holds (1, 2, then 3 of
      3) and the points per tick, and finally the game-over screen.
    caption: >-
      Master and Satellites: satellites are claimed like Domination zones; the master box counts
      how many a team holds and pays more points for each.
  hacking_terminal:
    alt: >-
      Animation of the Hacking Terminal: the code puzzle with guesses and hints (right and wrong
      place), the wires puzzle with wires being cut, the sequence puzzle (a key shown, then
      "your turn") and the access-granted screen with the code.
    caption: >-
      Hacking Terminal: a terminal can hold a code, wires or sequence puzzle; the team that
      solves it takes the terminal and may read out a code.
  medic:
    alt: >-
      Animation of the Medic Kit: the kit shows 4 heals left; a wounded player holds the button
      and the countdown bar fills; the kit shows the heal done with 3 left; a player who has
      used every heal is refused.
    caption: >-
      Medic Kit: a wounded player holds the button for the heal time; the kit counts its charges
      and each player's limit.
  vip_payload:
    alt: >-
      Animation of VIP / Payload: a checkpoint box nobody holds, blue holding its button and
      taking it, then the payload's screen with the metres to the extraction zone shrinking, a
      weak-GPS warning and the extraction completed.
    caption: >-
      VIP / Payload: checkpoints are claimed along the way, and the payload's screen (a phone's)
      shows the distance to extraction.
  money_factory:
    alt: >-
      Animation of Money Factory: a free factory, red holding its button while the capture bar
      fills, the factory held by red with its stock rising from 5 to 35 of 50, a player
      collecting 15, and a bank box showing a deposit of 15 and the totals per team.
    caption: >-
      Money Factory: a held factory fills with money, players collect it with their tag and
      deposit it at a bank box.
  progressive_domination:
    alt: >-
      Animation of Progressive Domination: a box waiting for its turn (1 of 4 boxes completed);
      the box becomes the active one and blue holds its button until it takes it; blue's points
      and minutes held climb while the share bar fills; the box is completed for blue and
      locked; then the next box, which was waiting, becomes the active one.
    caption: >-
      Progressive Domination: only one box can be captured at a time; the team that holds it
      long enough completes it, and the next box in the order is announced.
  target_windows:
    alt: >-
      Animation of Target Windows: a target waiting for a team's colour, a window opening for
      red with a 5-second countdown, the target showing red's hit, then a window for blue and
      the hit count rising to 2.
    caption: >-
      Target Windows: a target opens a short window for one team's colour; hits inside the
      window score.
  codes:
    alt: >-
      Animation of the Codes modifier with Bomb: the screen asks for the team code, four digits
      are typed as dots, the countdown runs, and a defuse code is typed before the screen shows
      the bomb defused.
    caption: >-
      Codes: Bomb with typed team codes instead of held buttons: the keypad box asks for a code
      to arm and one to defuse. The messages the mode's script writes stay in English.
  kill_confirmed:
    alt: >-
      Animation of Kill Confirmed: the station waits for tags; a red player's tag is accepted, a
      14-second window counts down and the message "Kill confirmed: b1" shows; then a forged tag
      is refused.
    caption: >-
      Kill Confirmed: scanning an enemy's signed tag confirms the kill; a forged tag is refused.
      The messages the mode's script writes stay in English.
  respawn:
    alt: >-
      Animation of Respawn and Lives: a respawn point welcomes players back into the game as the
      team's lives go from 19 to 18 and 17, and finally shows in red that the team has no lives
      left.
    caption: >-
      Respawn and Lives: each return to the game costs the team a life; at zero the team is out.
      The messages the mode's script writes stay in English.
  player_checkin:
    alt: >-
      Animation of Player Check-in: each tag scanned at the check-in point adds a player; the
      total goes from 1 to 3 to 5, with the count per team.
    caption: >-
      Player Check-in: players check in at the start and the box counts each team's players. The
      messages the mode's script writes stay in English.

screens:
  title: What it looks like
  intro: >-
    Eight captures from the real Field Box firmware (ESP32, LVGL 9.2, 320&nbsp;×&nbsp;240&nbsp;TFT)
    running in the <a href="https://wokwi.com">Wokwi</a> emulator. The box UI is in English.
    The firmware now runs on a real Heltec V4.3; these screenshots are from the emulator. Tap or
    click a screenshot to see it larger.
  note: >-
    The <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">build
    manual</a> has the full wiring diagram and first-flash guide for the Heltec WiFi LoRa 32&nbsp;V4.
  pin_entry:
    alt: >-
      Field Box screen: "GAME MASTER" header, "Enter the admin PIN" prompt, four empty circles for
      digits, "# enter * delete" hint.
    caption: GM enters the admin PIN to unlock setup.
  choose_game:
    alt: >-
      Field Box screen: "CHOOSE A GAME" header listing 1 "Bomb" (highlighted in yellow),
      2 "Domination", 3 "Hold-All Domination", 4 "Last Stand" and 5 "Codes", with the hint
      "1-9 choose # next * back".
    caption: Pick a game mode from the on-box menu.
  confirm:
    alt: >-
      Field Box screen: "START THE GAME?" header on an orange bar, "Bomb" mode name, "Timer:
      10 min", "# start * back" hint.
    caption: Confirm the mode and timer before starting.
  standby:
    alt: >-
      Field Box screen: "STANDBY" header, "Hold the button to arm", "RED" in red, "The bomb is
      not armed" at the bottom.
    caption: Waiting for the red team to hold the arming button.
  armed:
    alt: >-
      Field Box screen: "ARMED" header on a red bar, large "5:00" countdown, "until detonation"
      label.
    caption: Bomb armed; the blue team has 5 minutes to defuse it.
  defused:
    alt: >-
      Field Box screen: blue background, white check mark, "DEFUSED" in large text, "BLUE team
      wins" below.
    caption: Blue team defused the bomb in time.
  joined:
    alt: >-
      Field Box screen: "JOINED GAME 4242" header, "Game" label on the left, "zone, node 7" on
      the right.
    caption: Box joined the field game via NFC card or serial console.
  code_entry:
    alt: >-
      Field Box screen: "CODE" header, two of four circles filled in yellow, "# enter * delete"
      hint.
    caption: Typing a code for the Codes modifier (points, hints or unlocks).

  app_title: The Android app
  app_intro: >-
    The app's own screens are in Portuguese, English, German and Traditional Chinese, and it draws each mode's screens from the
    same YAML files as the Field Box. These are the app's test images, not photos of a phone: the
    app has run on Android emulators, not yet on a real phone.
  app_roles:
    alt: >-
      The app's first screen, "What will this phone do?": four choices, each with a line on what it
      does: Game prop, Player, Marshal and Game master.
    caption: Pick what this phone does in the game.
  app_prop:
    alt: >-
      An Android phone as the bomb: the mode's countdown screen ("ARMED", "4:47", "until
      detonation") above two big buttons, red and blue, to hold.
    caption: A phone as the bomb, with the teams' buttons.
  app_player:
    alt: >-
      The player's view: the game's name, 20:00 to go, the blue team's 20 points above the red
      team's 12, who holds each objective, and what happened.
    caption: Players follow the game on their phones.
  app_branded:
    alt: >-
      The player's view of a field with its own branding: the field's logo and name, Campo Norte, in
      the header, its wallpaper faint behind the view, and the teams Águias and Lobos with their
      crests and scores, 20 to 12.
    caption: A field's own logo, wallpaper and team crests.
  app_chrono:
    alt: >-
      The marshal's chronograph: the velocity keypad, the BB weight and a green "PASS", with the
      highest energy and the limit.
    caption: Chrono check-in, the reading signed by the marshal.
  medic_intro: >-
    The Medic Kit draws its screens from the same YAML files on a Field Box and on an Android prop,
    in Portuguese unless the GM sets English, German or Chinese. Here they are as the app draws
    them:
  medic_idle:
    alt: >-
      Medic Kit screen: "LIGADURAS" (Medic Kit) header, a large 4, "Restam 4 ligaduras" (4 heals
      left) and, in yellow, "Lê a tua etiqueta e mantém premido o botão" (scan your tag, then hold
      the button).
    caption: Waiting for a player, with 4 heals left.
  medic_hold:
    alt: >-
      Medic Kit screen: the player's id, b1, in a blue header, "Mantém premido para tratar" (keep
      holding to heal), 4 seconds to go in yellow above a progress bar, and "Largar antes do tempo
      cancela" (letting go early cancels).
    caption: Player b1 holds the button to be healed.
  medic_healed:
    alt: >-
      Medic Kit screen on blue: a white cross, "DE VOLTA AO JOGO" (back in the game), b1,
