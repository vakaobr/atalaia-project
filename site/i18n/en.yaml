meta:
  title: Atalaia · the open force-on-force platform
  description: >-
    Atalaia is an open, local-first platform for airsoft, paintball and milsim game props: ESP32,
    Raspberry Pi, Arduino and Android props, game modes as Lua scripts, and an open LoRa protocol.
  og_description: >-
    Open, local-first game props for airsoft, paintball and milsim. Game modes are scripts; any
    hardware works.
  og_image_alt: >-
    A hilltop watchtower at dusk with a radio box on top, linked to glowing GAME PROP boxes across
    a forested valley, under the words "Open-source project ATALAIA".

