hero:
  status: Pre-alpha · phase 1 and 2 software done, two boards and the field controller working together on the bench, phase 3 nearly complete in software, phase 4 built in software · not field-ready yet
  title: The open <span class="nowrap">force-on-force</span> platform
  lead: >-
    Atalaia is an open platform for the electronic props of airsoft, paintball and milsim: the
    boxes teams capture, the bombs they arm and defuse. Build a domination box from a €20
    <a href="{{ page.to.glossary }}#glossary-microcontroller">microcontroller</a> (a tiny, cheap computer board), turn an
    old Android phone into a hacking terminal, run a 20-box weekend milsim on a
    <a href="{{ page.to.glossary }}#glossary-lora">LoRa mesh</a> (long-range, low-power radio that the boxes relay to
    one another across the field), and write your own game modes as small scripts. Every game runs
    on the field itself: no cloud or internet needed, and no manufacturer can lock you in.
  discuss: Join the discussion
  design: Read the design
  source: Source on GitHub
  name: >-
    <em>Atalaia</em> (ah-tah-LYE-ah) is Portuguese for <em>watchtower</em>: a lookout on a hill
    that watched for trouble and passed the warning along.
  why_name: Why that name?
  # The night scene: each language now has its own copy with the title painted in its language.
  image_alt: >-
    Illustration: at dusk, a stone watchtower on a hilltop carries a radio box whose signals reach
    glowing orange GAME PROP boxes spread across a forested valley, while a group of players walks
    past them. Painted text reads "Open-source project ATALAIA".

game:
  title: How a game works
  intro: >-
    Playing needs no technical knowledge. This is how a game will run once the boxes are built (phases
    1 and 2); the <a href="{{ page.to.glossary }}#glossary-simulator">simulator</a> already plays the same modes on a
    computer today.
  setup:
    title: Set up
    text: >-
      The organisers place the boxes around the field and pick a game mode, such as Domination, on
      a box's keypad or from a phone, in under a minute.
  capture:
    title: Capture
    text: >-
      To take a box, a team holds its colour's button for a few seconds. The box lights up in that
      colour and scores for the team until the other side takes it back.
  relay:
    title: Relay
    text: >-
      Each box reports by radio to the <a href="{{ page.to.glossary }}#glossary-field-controller">field controller</a>, a
      small computer at the base; boxes far away are relayed by the ones in between. A box that
      loses contact keeps playing and catches up later.
  score:
    title: Score
    text: >-
      The controller adds it all up. The organisers follow the game live on their phones, and the
      field can show the score on a big screen or on a stream.

why:
  title: Why Atalaia
  intro: >-
    Electronic props add a lot to a game, but commercial systems keep the rules locked inside
    closed <a href="{{ page.to.glossary }}#glossary-firmware">firmware</a>. New modes wait on the vendor, there is no
    public <a href="{{ page.to.glossary }}#glossary-api">API</a>, and you cannot add your own hardware. Atalaia does it
    differently.
  local:
    title: Local-first
    text: >-
      Every game runs <a href="{{ page.to.glossary }}#glossary-local-first">on the field itself</a>, fully offline, from a
      single house to a multi-kilometre forest. The internet is optional.
  hardware:
    title: Any hardware
    text: >-
      Cheap <a href="{{ page.to.glossary }}#glossary-esp32">ESP32</a> boards, credit-card-sized
      <a href="{{ page.to.glossary }}#glossary-raspberry-pi">Raspberry Pi</a> computers, simple
      <a href="{{ page.to.glossary }}#glossary-arduino">Arduino-class</a> boards and new or repurposed
      <a href="{{ page.to.glossary }}#glossary-android-prop">Android phones</a> all have a place in the same
      game. The software for the ESP32 boxes, the field controller and Android phones is written; the
      Arduino-class boards come later.
  scripts:
    title: Modes are scripts
    text: >-
      Game modes are short <a href="{{ page.to.glossary }}#glossary-lua">Lua scripts</a>, small text files of rules, with
      a settings file: easy to read, change and share, and no mode needs code of its own in the boxes'
      built-in software. For now the boxes carry their modes built in; sending a new one without
      reflashing (reinstalling) that software is still to come.
  open:
    title: Open protocol and API
    text: >-
      Props talk over <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>, a documented radio protocol,
      so anyone can build a device that joins in. The field controller offers MQTT, REST and
      WebSocket APIs for scoreboards, stream overlays and other tools.
  fields:
    title: Built for fields
    text: >-
      Player roles, squads, check-in at the field with a printed poster, and a
      <a href="{{ page.to.glossary }}#glossary-chrono">chrono</a> registry that keeps each replica's signed readings for
      spot checks are built in software; custom scenarios come in phase&nbsp;4.
  copyleft:
    title: Copyleft
    text: >-
      Fields that charge entry and makers who sell boxes are welcome. Anyone who ships or hosts a
      changed version <a href="{{ page.to.glossary }}#glossary-copyleft">shares the changes</a> back.

how:
  title: How it fits together
  intro: >-
    In plain words: the props on the field talk by radio to the field controller, a small computer
    at the base that runs the game and keeps the score. Phones connect to it over Wi-Fi, and
    scoreboards, stream overlays and map apps such as <a href="{{ page.to.glossary }}#glossary-atak">ATAK</a> through its
    API. An optional <a href="{{ page.to.glossary }}#glossary-site-server">site server</a> on the internet keeps accounts
    and history. The controller, its API and the organisers' console are built and tested on a
    computer, not yet on the field; of the site server only the skeleton and the accounts exist so
    far (logins with two-factor codes and per-field roles; no game data yet).
  core: >-
    Under the hood, every device that runs game modes uses the same
    <a href="{{ page.to.glossary }}#glossary-core">shared core</a>, written in C11, and the same Lua modes; only a thin
    layer for each kind of hardware differs. A mode written once plays the same on a box, a phone
    or a Raspberry Pi.
  diagram:
    title: >-
      An optional site server connects over the internet to the field controller. GM and player
      apps reach the controller over Wi-Fi, scoreboards and other tools over MQTT and REST, and
      props over the Skirmesh-RF LoRa mesh.
    server: Site server (optional)
    server_sub: accounts · history · player app
    apps: GM and player apps
    apps_sub: Wi-Fi
    controller: Field controller
    controller_sub: Raspberry Pi or Android
    tools: Scoreboards, ATAK
    tools_sub: MQTT, REST, webhooks
    mesh: Skirmesh-RF · LoRa mesh
    satellite: Satellite
    android: Android prop
    android_sub: with an ESP32 pod
    thin: Thin node
    thin_sub: Arduino-class
  list:
    server: >-
      <strong>Site server</strong> (optional): accounts, history and the player app, over the
      internet.
    controller: >-
      <strong>Field controller</strong> on a Raspberry Pi or Android: GM and player apps join over
      Wi-Fi; scoreboards and ATAK use MQTT, REST and webhooks.
    props: >-
      <strong>Props</strong> on the Skirmesh-RF LoRa mesh: ESP32
      <a href="{{ page.to.glossary }}#glossary-field-box">Field Boxes and satellites</a>, Android props with an ESP32 pod,
      and Arduino-class thin nodes.
  # English page only: the Portuguese page shows this image in its hero.
  image_alt: >-
    Isometric illustration: a small stone tower with a radio box on top stands in the middle of a
    square base, ringed by eight orange and yellow GAME PROP cases with antennas, all linked by a
    glowing circle.
  image_caption: >-
    The field controller is the watchtower: from the middle of the field it keeps every prop in
    sight.

radio:
  title: How the radio works
  intro: >-
    The props talk over <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>, a long-range, low-power radio, in
    Atalaia's own protocol, <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>. These two diagrams
    show what LoRa can and cannot do on a field, and how one protocol runs on very different
    devices. None of it has been on a real field yet: range and timing will be measured in the
    phase&nbsp;2 field test.
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    The props talk over <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>, a long-range,
    low-power radio, in Atalaia's own protocol,
    <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>. Two diagrams show what
    LoRa can and cannot do on a field, and how one protocol runs on very different devices. None
    of it has been on a real field yet.
  more: How the radio works, in two diagrams →
  # Each diagram's alt text is its description, diagrams.*.desc, also used inside the SVG.
  lora:
    title: What LoRa can do
    lead: >-
      LoRa trades speed for reach: it gets short messages across a field on very little battery,
      and its signal gets through walls and trees better than Wi-Fi does, although concrete, metal
      and hills still block it. A box that cannot reach the controller is heard through the other
      boxes, and European rules limit how much of the time each device may transmit.
  skirmesh:
    title: One protocol on every device
    lead: >-
      Skirmesh-RF is built in layers, from the radio up to the controller's API. A Field Box runs
      everything up to the game modes; a Raspberry Pi controller leaves the radio work to a USB
      radio modem; in phase&nbsp;3 an Android phone does the same with an I/O pod. Phones on
      the field's Wi-Fi need no LoRa radio at all.
  channel:
    title: Which channel, and why 869.525&nbsp;MHz
    lead: >-
      All of a game's traffic shares one channel. The default, 869.525&nbsp;MHz, is the centre of
      869.4–869.65&nbsp;MHz, the only part of the European 868&nbsp;MHz band where a device may
      transmit up to 10% of the time at up to 500&nbsp;mW. Elsewhere in 868–870&nbsp;MHz the rules
      allow 1% of the time (0.1% on 868.7–869.2&nbsp;MHz) at 25&nbsp;mW: about a tenth of the
      airtime, and much less range. 868.1, 868.3 and 868.5&nbsp;MHz are LoRaWAN's default
      channels and often busy. The default is shared too: LoRaWAN gateways send some replies on
      869.525&nbsp;MHz and Meshtastic's European default uses it, so near such users the GM can let
      the controller listen to every legal channel for a minute and pick the quietest, draw one at
      random, or choose by hand. The boxes then follow the chosen channel's own limits.

modes:
  title: Game modes
  intro: >-
    Modes react to intent ("a team is claiming this prop"), not to hardware, so the same script
    runs on a Field Box, a keypad box or an Android phone. Eleven modes, one modifier and the Medic
    Kit are written and tested in software today; none has run on a real field yet.
  # The main page shows three modes, then this link to the modes page.
  more: See all 11 modes →
  # At the end of the modes page.
  try: Try a mode in your browser today →
  domination:
    title: Domination
    text: >-
      A team holds the prop's input for a few seconds to claim it, and scores every tick while it
      keeps it. The other team can take it over at any time.
    meta: Team buttons · one box or many
  bomb:
    title: Bomb / Rush
    text: >-
      Attackers arm the bomb, then defend it; defenders must defuse it before the fuse runs out.
      Arm and defuse by holding a button, or give each team its own keypad code.
    meta: Team buttons or keypad · fuse and hold times are settings
  holdall:
    title: Hold-All Domination
    text: >-
      Teams capture boxes as in Domination, but a team scores only while it holds every box at
      once. Lose one and the scoring stops.
    meta: Several boxes · needs the field controller
  laststand:
    title: Last Stand
    text: >-
      The defenders start with every zone. Once they are down to their last one, a countdown to
      defeat runs until they retake another; when it runs out, the attackers win.
    meta: Several boxes · needs the field controller
  kill_confirmed:
    title: Kill Confirmed
    text: >-
      Players carry signed NFC tags. A team scans the tags it collected at a station: an enemy's
      tag confirms the kill, a teammate's denies it. Forged tags are refused.
    meta: NFC reader · player tags
  respawn:
    title: Respawn and Lives
    text: >-
      A respawn point counts lives per team or per player, with a cooldown between respawns. When
      a team runs out of lives, it is eliminated.
    meta: NFC reader or team buttons
  player_checkin:
    title: Player Check-in
    text: >-
      Players check in at a checkpoint with their tag. The box counts each team's players and can
      give points for every check-in.
    meta: NFC reader · player tags
  medic:
    title: Medic Kit
    text: >-
      Next to any mode: a hit player scans their tag and holds a button for a set time to be healed.
      The kit shows how many heals it has left; each player gets a limited number per game at every
      kit, the GM refills a kit from the console, and every heal shows in the GM's log and the
      players' view.
    meta: NFC reader and a button · player tags · needs the field controller
  master_satellites:
    title: Master and Satellites
    text: >-
      Teams capture a master box and its satellites. Only the master scores, and every satellite its
      holder also holds raises its points; when the master changes hands, every satellite goes back
      to neutral. Written and tested in software, not yet played on real boxes.
    meta: Several boxes · needs the field controller
  target_windows:
    title: Target Windows
    text: >-
      A target lights up in a random team's colour for a few seconds, and a hit while it is lit
      scores for that team. The game is written and tested in software; the target addon it needs
      (a plate with a hit sensor and a light ring) is not built yet.
    meta: A box with the target addon · not available yet
  hacking_terminal:
    title: Hacking Terminal
    text: >-
      A terminal sets a puzzle on its keypad: crack a code from how many digits are in the right
      place, cut the wires in the right order, or repeat a sequence. A wrong answer locks it for a
      while. Solving it can reveal a code for another objective, score, and capture the terminal
      until another team hacks it back. Written and tested in software, not yet played on a phone
      in the field.
    meta: A box or a phone with a keypad · works without the field controller
  vip_payload:
    title: VIP / Payload
    text: >-
      One team escorts its VIP, a player who shares their position from the app, or a payload, a
      phone with GPS, to an extraction zone; the others try to stop them. Checkpoint boxes along the
      way score while a team holds them. Positions stay on the field controller and the phone; only
      "extracted" goes out. Written and tested in software, not yet played with real GPS.
    meta: Checkpoint boxes, a phone with GPS or the VIP's phone · needs the field controller
  codes:
    title: Codes (modifier)
    text: >-
      Runs alongside any mode on the same box: keypad codes grant points, hints or unlocks, and the
      GM sees who used each code and which team held the box.
    meta: Keypad · works with any mode
  yours:
    title: Your mode
    text: >-
      Money Factory, capture the flag, your club's own… Modes are short
      scripts. Propose one with the game mode idea template.
    link: Share a game mode idea

