#
# English text of the project pages (site/en/: the main page, modes/, radio/,
# roadmap/ and glossary/). Every key the English pages use in the templates
# site/src/*.html and site/src/partials/*.html must be here, and they must use
# every key here; apart from the parts only one language shows, pt.yaml has the
# same keys. A key can be used on several pages. Values are HTML; keys the
# templates mark |text are plain text. After editing, run
# python3 tools/build_site.py. See site/README.md.
#
# Links like href="{{ page.to.glossary }}#glossary-lora" point at the glossary
# entries at the end of this file, on the glossary page; {{ page.to.<page> }}
# becomes the relative link to that page from whichever page shows the text.
# The ids (glossary.*.id) are stable: change them only together with every
# link to them.

# Each page's title, description and (optionally) social preview description,
# under its name in the page table of tools/build_site.py. og_image_alt is the
# same on every page, as they all share the language's preview image.
meta:
  index:
    title: Atalaia · the open force-on-force platform
    description: >-
      Atalaia is an open, local-first platform for airsoft, paintball and milsim game props: ESP32,
      Raspberry Pi, Arduino and Android props, game modes as Lua scripts, and an open LoRa protocol.
    og_description: >-
      Open, local-first game props for airsoft, paintball and milsim. Game modes are scripts; any
      hardware works.
  modes:
    title: Game modes · Atalaia
    description: >-
      Atalaia's game modes for airsoft, paintball and milsim: Domination, Bomb / Rush, Hold-All
      Domination, Last Stand, Kill Confirmed, Respawn and Lives, Player Check-in, the Codes modifier
      and the Medic Kit, each a short Lua script.
  radio:
    title: How the radio works · Atalaia
    description: >-
      What LoRa radio can and cannot do on an airsoft or paintball field, which channel Atalaia
      uses and why, and how its Skirmesh-RF protocol runs on every device.
  roadmap:
    title: Roadmap · Atalaia
    description: >-
      Atalaia's six phases, from the shared core to the community, each closed by a real field test,
      and where each one stands today.
  glossary:
    title: Glossary · Atalaia
    description: >-
      The technical words of the Atalaia project, from LoRa and ESP32 to copyleft, in plain terms
      for players, field owners and GMs.
  og_image_alt: >-
    A hilltop watchtower at dusk with a radio box on top, linked to glowing GAME PROP boxes across
    a forested valley, under the words "Open-source project ATALAIA".

