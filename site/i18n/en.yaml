hero:
  status: Pre-alpha · phase 0 nearly complete · not field-ready yet
  title: The open <span class="nowrap">force-on-force</span> platform
  lead: >-
    Atalaia is an open, local-first platform for airsoft, paintball and milsim game props.
    Build a domination box from a €20 microcontroller, turn an old Android phone into a hacking
    terminal, run a 20-box weekend milsim on a LoRa mesh, and write your own game modes as small
    scripts. No cloud required, no vendor lock-in.
  discuss: Join the discussion
  design: Read the design
  source: Source on GitHub
  name: >-
    <em>Atalaia</em> (ah-tah-LYE-ah) is Portuguese for <em>watchtower</em>: a lookout on a hill
    that watched for trouble and passed the warning along.
  why_name: Why that name?
  # The night scene: only the English page uses it, as it has English text painted in.
  image_alt: >-
    Illustration: at dusk, a stone watchtower on a hilltop carries a radio box whose signals reach
    glowing orange GAME PROP boxes spread across a forested valley, while a group of players walks
    past them. Painted text reads "Open-source project ATALAIA".

why:
  title: Why Atalaia
  intro: >-
    Electronic props add a lot to a game, but commercial systems keep the rules locked inside
    closed firmware. New modes wait on the vendor, there is no public API, and you cannot add your
    own hardware. Atalaia does it differently.
  local:
    title: Local-first
    text: >-
      Every game runs fully offline, from a single house to a multi-kilometre forest. The internet
      is optional.
  hardware:
    title: Any hardware
    text: >-
      ESP32 boards, Raspberry Pi, Arduino-class boards and new or repurposed Android phones all
      play in the same game.
  scripts:
    title: Modes are scripts
    text: >-
      Game modes are short Lua scripts with a settings file. Change or share one without
      reflashing anything.
  open:
    title: Open protocol and API
    text: >-
      Props talk over the documented Skirmesh-RF protocol; the field controller will expose MQTT,
      REST and WebSocket APIs.
  fields:
    title: Built for fields
    text: >-
      Player roles, squads, custom scenarios, and a chrono registry with spot checks are part of
      the design.
  copyleft:
    title: Copyleft
    text: >-
      Fields that charge entry and makers who sell boxes are welcome. Anyone who ships or hosts
      changes shares them back.

how:
  title: How it fits together
  intro: >-
    Every full node runs the same C11 core and the same Lua game modes; only the platform shell and
    hardware drivers differ.
  diagram:
    title: >-
      An optional site server connects over the internet to the field controller. GM and player
      apps reach the controller over Wi-Fi, scoreboards and other tools over MQTT and REST, and
      props over the Skirmesh-RF LoRa mesh.
    server: Site server (optional)
    server_sub: accounts · history · player app
    apps: GM and player apps
    apps_sub: Wi-Fi
    controller: Field controller
    controller_sub: Raspberry Pi or Android
    tools: Scoreboards, ATAK
    tools_sub: MQTT, REST, webhooks
    mesh: Skirmesh-RF · LoRa mesh
    satellite: Satellite
    android: Android prop
    android_sub: with an ESP32 pod
    thin: Thin node
    thin_sub: Arduino-class
  list:
    server: >-
      <strong>Site server</strong> (optional): accounts, history and the player app, over the
      internet.
    controller: >-
      <strong>Field controller</strong> on a Raspberry Pi or Android: GM and player apps join over
      Wi-Fi; scoreboards and ATAK use MQTT, REST and webhooks.
    props: >-
      <strong>Props</strong> on the Skirmesh-RF LoRa mesh: ESP32 Field Boxes and satellites,
      Android props with an ESP32 pod, and Arduino-class thin nodes.
  # English page only: the Portuguese page shows this image in its hero.
  image_alt: >-
    Isometric illustration: a small stone tower with a radio box on top stands in the middle of a
    square base, ringed by eight orange and yellow GAME PROP cases with antennas, all linked by a
    glowing circle.
  image_caption: >-
    The field controller is the watchtower: from the middle of the field it keeps every prop in
    sight.

modes:
  title: Game modes
  intro: >-
    Modes react to intent ("a team is claiming this prop"), not to hardware, so the same script
    runs on a box with two arcade buttons, a keypad box or a tablet. Two classics are written and
    tested today.
  domination:
    title: Domination
    text: >-
      A team holds the prop's input for a few seconds to claim it, and scores every tick while it
      keeps it. The other team can take it over at any time.
    meta: Hold to capture · scores per tick · any number of zones
  bomb:
    title: Bomb / Rush
    text: >-
      Attackers hold to arm the bomb, then defend it. Defenders must hold long enough to defuse it
      before the fuse runs out. Fuse and hold times are settings.
    meta: Arm · defend · defuse or explode
  yours:
    title: Your mode
    text: >-
      Respawn counters, hacking terminals, VIP escort, master-and-satellite zones… Modes are short
      scripts. Propose one with the game mode idea template.
    link: Share a game mode idea

try:
  title: Try it today
  intro: >-
    There is nothing to flash yet, but the shared core runs on a computer. The simulator plays a
    mode in your browser: hold team buttons, watch each prop's screen and follow the event log.
  compiler: With a C compiler
  docker: With Docker only
  then: >-
    Then open <code>http://localhost:8000</code>. You need Python 3.10+ with PyYAML. The
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">simulator
    guide</a> has every option.

roadmap:
  title: Roadmap
  intro: Six phases. Each one ends with a real field test before the next begins.
  now: Now
  next: Next
  p0:
    title: Foundations
    text: Shared core, Lua sandbox, Skirmesh-RF codec, browser simulator.
    gate: >-
      Gate: the simulator runs Domination and Bomb from Lua scripts. <strong>Met.</strong>
  p1:
    title: Single box
    text: Field Box build, ESP32 firmware, on-device presets.
    gate: "Gate: one box runs a 2-hour club game with no restarts."
  p2:
    title: Field network
    text: Skirmesh-RF over LoRa, field controller, API, GM console.
    gate: "Gate: 5 boxes on a CQB site and an outdoor field, zero lost captures."
  p3:
    title: Android and players
    text: Android props, I/O pod, player app with roles, chrono check-in.
    gate: "Gate: one game mixes ESP32 and Android props without issues."
  p4:
    title: Site server and advanced play
    text: Site server, custom scenarios, advanced modes, ATAK.
    gate: "Gate: a weekend milsim runs on Atalaia end to end."
  p5:
    title: Community
    text: Visual mode editor, mode registry, carrier PCB, translations.
    gate: Ongoing after the first release.

