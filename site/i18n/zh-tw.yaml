meta:
  index:
    title: Atalaia · 開放的對抗遊戲平台
    description: >-
      Atalaia 是一個開放、在地優先的平台，給生存遊戲、漆彈與 milsim 的遊戲道具使用：ESP32、Raspberry
      Pi、Arduino 與 Android 道具，以 Lua 腳本寫成的遊戲模式，以及開放的 LoRa 協定。
    og_description: >-
      給生存遊戲、漆彈與 milsim 的開放、在地優先遊戲道具。遊戲模式就是腳本；任何硬體都能用。
  modes:
    title: 遊戲模式 · Atalaia
    description: >-
      Atalaia 給生存遊戲、漆彈與 milsim 的遊戲模式：佔點、炸彈 / Rush、破壞、全佔點、最後一人、擊殺確認、復活與命數、玩家報到、密碼附加規則與醫護包，每一個都是一段簡短的 Lua 腳本。
  radio:
    title: 無線電如何運作 · Atalaia
    description: >-
      LoRa 無線電在生存遊戲或漆彈場地上能做什麼、不能做什麼，Atalaia 用哪個頻道、為什麼，以及 Skirmesh-RF
      協定如何在每一種裝置上運作。
  roadmap:
    title: 路線圖 · Atalaia
    description: >-
      Atalaia 的六個階段，從共用核心到社群，每個階段都以真實場地測試收尾，以及各階段目前的進度。
  build:
    title: 組裝指南 · Atalaia
    description: >-
      如何用現成零件組裝 Atalaia 的衛星盒與 I/O 模組、標靶擴充模組已決定了什麼，以及 Field Box 的組裝手冊在哪裡。
  glossary:
    title: 名詞解釋 · Atalaia
    description: >-
      Atalaia 專案的技術名詞，從 LoRa、ESP32 到 copyleft，用玩家、場主與 GM 都看得懂的話說明。
  og_image_alt: >-
    黃昏時山頂上的一座瞭望塔，塔頂有一個無線電盒，連到山谷森林中一個個發光的 GAME PROP 盒子，上方寫著英文「Open-source project ATALAIA」。
  architecture:
    title: "整體架構 · Atalaia"
    description: "七張圖說明 Atalaia 各部分如何互相溝通：哪條連線傳什麼，什麼資料絕不離開場地。"

