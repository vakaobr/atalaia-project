hero:
  status: >-
    早期開發（Pre-alpha）· 第 1、2 階段軟體完成，真實開發板已在工作台上和場地控制器玩完整場遊戲（含鍵盤）；第 3 階段軟體完成，iOS App 已在 iPhone 上檢查過；第 4 階段的網站伺服器已在測試伺服器上運行；第 5 階段軟體已完成 · 尚未能上場使用
  title: 開放的<span class="nowrap">對抗遊戲</span>平台
  lead: >-
    Atalaia 是一個開放平台，給生存遊戲、漆彈與 milsim 的電子道具使用：隊伍要佔領的盒子、要啟動和拆除的炸彈。用一塊 20 歐元的<a href="{{ page.to.glossary }}#glossary-microcontroller">微控制器</a>（一塊小巧便宜的電腦板）做一個佔點盒，把舊 Android 手機變成駭客終端，用 <a href="{{ page.to.glossary }}#glossary-lora">LoRa 網狀網路</a>（遠距離、低耗電的無線電，盒子之間在場地上互相轉傳）跑一場 20 個盒子的週末 milsim，還能把自己的遊戲模式寫成小腳本。每一場遊戲都在場地本身運作：不需要雲端或網路，也沒有廠商能把你綁住。
  discuss: 加入討論
  design: 閱讀設計文件
  source: GitHub 原始碼
  name: >-
    <em>Atalaia</em>（唸作 ah-tah-LYE-ah）是葡萄牙文的<em>瞭望塔</em>：山丘上的哨塔，負責注意狀況並把警訊傳下去。
  why_name: 為什麼取這個名字？
  # The night scene: the Chinese page shows the English copy, with its title painted in English.
  image_alt: >-
    插圖：黃昏時，山頂上一座石造瞭望塔載著一個無線電盒，訊號傳到散布在山谷森林中、發著橘光的 GAME PROP 盒子，一群玩家正從旁走過。畫面上的英文寫著「Open-source project ATALAIA」。

game:
  title: 一場遊戲怎麼玩
  intro: >-
    玩遊戲不需要任何技術知識。以下是盒子做好後（第 1、2 階段）遊戲的進行方式；
    <a href="{{ page.to.glossary }}#glossary-simulator">模擬器</a>現在已經能在電腦上玩同樣的模式。
  setup:
    title: 布置
    text: >-
      主辦把盒子放在場地各處，在盒子的按鍵上或用手機選一個遊戲模式，例如佔點，一分鐘內就能搞定。
  capture:
    title: 佔領
    text: >-
      要拿下一個盒子，隊伍按住自己顏色的按鈕幾秒鐘。盒子會亮起那個顏色，並替那一隊計分，直到對方再搶回去。
  relay:
    title: 轉傳
    text: >-
      每個盒子用無線電回報給<a href="{{ page.to.glossary }}#glossary-field-controller">場地控制器</a>，也就是基地裡的一台小電腦；離得遠的盒子由中間的盒子轉傳。失去聯繫的盒子會繼續運作，之後再補上進度。
  score:
    title: 計分
    text: >-
      控制器把一切加總。主辦在手機上即時看遊戲進行，場地也可以把分數顯示在大螢幕或直播上。

why:
  title: 為什麼選 Atalaia
  intro: >-
    電子道具讓遊戲更好玩，但商業系統把規則鎖在封閉的<a href="{{ page.to.glossary }}#glossary-firmware">韌體</a>裡。新模式要等廠商推出，沒有公開的 <a href="{{ page.to.glossary }}#glossary-api">API</a>，也不能加上自己的硬體。
    Atalaia 的做法不一樣。
  local:
    title: 在地優先
    text: >-
      每一場遊戲都<a href="{{ page.to.glossary }}#glossary-local-first">在場地本身運作</a>，完全離線，從一棟房子到好幾公里的森林都行。網路是可有可無的。
  hardware:
    title: 任何硬體
    text: >-
      便宜的 <a href="{{ page.to.glossary }}#glossary-esp32">ESP32</a> 開發板、信用卡大小的
      <a href="{{ page.to.glossary }}#glossary-raspberry-pi">Raspberry Pi</a> 電腦、簡單的
      <a href="{{ page.to.glossary }}#glossary-arduino">Arduino 等級</a>開發板，以及全新或回收再利用的
      <a href="{{ page.to.glossary }}#glossary-android-prop">Android 手機</a>，都能用在同一場遊戲裡。
      ESP32 盒子、場地控制器與 Android 手機的軟體已經寫好；Arduino 等級的開發板之後才會支援。
  scripts:
    title: 模式就是腳本
    text: >-
      遊戲模式是簡短的 <a href="{{ page.to.glossary }}#glossary-lua">Lua 腳本</a>，也就是寫著規則的小文字檔，再加上一個設定檔：容易閱讀、修改和分享，而且沒有任何模式需要在盒子的內建軟體裡寫專屬程式碼。目前盒子的模式是內建的；不必重新燒錄（重新安裝）軟體就能送入新模式，還在開發中。
  open:
    title: 開放的協定與 API
    text: >-
      道具之間透過 <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a> 溝通，這是一個有完整文件的無線電協定，所以任何人都能做出可以加入的裝置。場地控制器提供 MQTT、REST 和
      WebSocket API，給記分板、直播疊加畫面和其他工具使用。
  fields:
    title: 為場地而生
    text: >-
      玩家角色、小隊、用印出來的海報在場地報到，以及一個<a href="{{ page.to.glossary }}#glossary-chrono">測速</a>登記冊，保存每把槍經簽署的測速值供抽查使用，這些都已在軟體中完成；自訂劇本在第&nbsp;4 階段推出。
  copyleft:
    title: Copyleft
    text: >-
      收費的場地和販售盒子的創客都很歡迎。任何發布或架設修改版本的人，都要<a href="{{ page.to.glossary }}#glossary-copyleft">把修改分享</a>回來。

how:
  title: 整體架構
  intro: >-
    簡單來說：場地上的道具用無線電和場地控制器溝通，場地控制器是基地裡的一台小電腦，負責執行遊戲和記分。手機透過 Wi-Fi 連上它，記分板、直播疊加畫面和 <a href="{{ page.to.glossary }}#glossary-atak">ATAK</a>
    之類的地圖 App 則透過它的 API 連線。網路上還可以有一台選用的<a href="{{ page.to.glossary }}#glossary-site-server">場地伺服器</a>，保存帳號與歷史紀錄。控制器、它的 API 和主辦的控制台都已在電腦上完成並測試，還沒在場地上用過；場地伺服器目前只有骨架和帳號功能（使用兩步驟驗證碼登入與各場地的角色權限；還沒有遊戲資料）。
  core: >-
    在底層，每一個執行遊戲模式的裝置都使用同一個以 C11 寫成的<a href="{{ page.to.glossary }}#glossary-core">共用核心</a>，以及同樣的 Lua 模式；只有每種硬體的一層薄薄的程式不同。一個模式寫一次，在盒子、手機或 Raspberry Pi 上玩起來都一樣。
  diagram:
    title: >-
      選用的場地伺服器透過網路連到場地控制器。GM 與玩家 App 透過 Wi-Fi 連到控制器，記分板和其他工具透過
      MQTT 和 REST，道具則透過 Skirmesh-RF LoRa 網狀網路。
    server: 場地伺服器（選用）
    server_sub: 帳號 · 歷史紀錄 · 玩家 App
    apps: GM 與玩家 App
    apps_sub: Wi-Fi
    controller: 場地控制器
    controller_sub: Raspberry Pi 或 Android
    tools: 記分板、ATAK
    tools_sub: MQTT、REST、webhooks
    mesh: Skirmesh-RF · LoRa 網狀網路
    satellite: 衛星盒
    android: Android 道具
    android_sub: 搭配 ESP32 模組
    thin: 精簡節點
    thin_sub: Arduino 等級
  list:
    server: >-
      <strong>場地伺服器</strong>（選用）：帳號、歷史紀錄與玩家 App，透過網路連線。
    controller: >-
      <strong>場地控制器</strong>，跑在 Raspberry Pi 或 Android 上：GM 與玩家 App 透過 Wi-Fi 加入；記分板和 ATAK 使用 MQTT、REST 和 webhooks。
    props: >-
      <strong>道具</strong>，在 Skirmesh-RF LoRa 網狀網路上：ESP32
      <a href="{{ page.to.glossary }}#glossary-field-box">Field Box 與衛星盒</a>、搭配 ESP32 模組的 Android 道具，以及 Arduino 等級的精簡節點。
  # English, German and Chinese pages: the picture's labels are English.
  image_alt: >-
    等角視角插圖：一座頂端有無線電盒的小石塔，立在方形底座的正中央，周圍環繞著八個帶天線的橘色與黃色
    GAME PROP 箱子，全部由一圈發光的圓環連在一起。
  image_caption: >-
    場地控制器就是瞭望塔：從場地正中央，它把每一個道具都看在眼裡。

radio:
  title: 無線電如何運作
  intro: >-
    道具之間透過 <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>（一種遠距離、低耗電的無線電）溝通，使用 Atalaia 自己的協定 <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>。下面兩張圖說明 LoRa 在場地上能做什麼、不能做什麼，以及同一個協定如何在差異很大的裝置上運作。這些都還沒在真實場地上用過：通訊距離與時間會在第&nbsp;2 階段的場地測試中實測。
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    道具之間透過 <a href="{{ page.to.glossary }}#glossary-lora">LoRa</a>（一種遠距離、低耗電的無線電）溝通，使用 Atalaia 自己的協定 <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF</a>。兩張圖說明 LoRa 在場地上能做什麼、不能做什麼，以及同一個協定如何在差異很大的裝置上運作。這些都還沒在真實場地上用過。
  more: 用兩張圖看懂無線電如何運作 →
  # Each diagram's alt text is its description, diagrams.*.desc, also used inside the SVG.
  lora:
    title: LoRa 能做什麼
    lead: >-
      LoRa 用速度換取距離：它只耗很少的電，就能把短訊息傳過整個場地，訊號穿過牆壁和樹林的能力也比
      Wi-Fi 好，不過混凝土、金屬和山丘還是會擋住它。連不到控制器的盒子，可以透過其他盒子轉傳；歐洲的法規則限制每個裝置能發射的時間比例。
  skirmesh:
    title: 同一個協定，用在每一種裝置
    lead: >-
      Skirmesh-RF 是分層打造的，從無線電一路到控制器的 API。Field Box 執行到遊戲模式為止的所有層；
      Raspberry Pi 控制器把無線電的工作交給一個 USB 無線電數據機；在第&nbsp;3 階段，Android 手機搭配
      I/O 模組也是這樣做。連在場地 Wi-Fi 上的手機完全不需要 LoRa 無線電。
  channel:
    title: 用哪個頻道，為什麼是 869.525&nbsp;MHz
    lead: >-
      一場遊戲的所有通訊共用一個頻道。預設的 869.525&nbsp;MHz 是 869.4–869.65&nbsp;MHz 的中心，這是歐洲 868&nbsp;MHz 頻段中唯一允許裝置以最高 500&nbsp;mW 發射、最多佔 10% 時間的區段。在 868–870&nbsp;MHz 的其他地方，法規只允許 1% 的時間（868.7–869.2&nbsp;MHz 為 0.1%）、25&nbsp;mW：大約是十分之一的發射時間，距離也短得多。868.1、868.3 和 868.5&nbsp;MHz 是 LoRaWAN 的預設頻道，常常很忙。預設頻道也有人共用：LoRaWAN 閘道器會在 869.525&nbsp;MHz 送出部分回覆，Meshtastic
      的歐洲預設值也用它，所以在這類使用者附近，GM 可以讓控制器把每個合法頻道各聽一分鐘、挑最安靜的，隨機抽一個，或手動選擇。之後盒子會遵守所選頻道自己的限制。
  region:
    title: 無線電地區：歐洲與台灣
    lead: >-
      一個場地屬於一個無線電地區，在 GM 控制台中選一次即可。在歐洲（EU868），盒子使用上面的頻道。在台灣（AS923，920–925&nbsp;MHz），NCC
      的規範（LP0002）只有在頻寬至少 500&nbsp;kHz 時，才讓不跳頻的單一頻道使用完整功率，所以在台灣盒子使用 500&nbsp;kHz 的
      LoRa（SF9，距離和歐洲差不多），天線端最多 0.5&nbsp;W，預設頻道為 921.5&nbsp;MHz，避開 LoRaWAN 和 Meshtastic
      使用的頻道。每個盒子、USB 無線電數據機和 I/O 模組都只為一個地區而建，會拒絕其他地區的頻道，所以盒子絕不會在自己的頻段外發射；盒子會隨每場遊戲得知場地的地區。台灣地區尚未經過認證：在台灣販售的產品需要
      NCC 的型式認證，以及為 920&nbsp;MHz 設計的天線。這些都還沒有在空中實際測試過。

modes:
  title: 遊戲模式
  intro: >-
    模式回應的是意圖（「有一隊正在搶這個道具」），而不是硬體，所以同一個腳本可以在 Field Box、有按鍵的盒子或
    Android 手機上執行。目前已有十四種模式、一個附加規則和醫護包在軟體中寫好並測試過；都還沒在真實場地上跑過。
  # The main page shows three modes, then this link to the modes page.
  more: 看全部 14 種模式 →
  # At the end of the modes page.
  try: 今天就在瀏覽器裡試玩一個模式 →
  domination:
    title: 佔點
    text: >-
      隊伍按住道具的輸入幾秒鐘就能佔領它，只要守住就會持續得分。另一隊隨時可以搶過去。
    meta: 隊伍按鈕 · 一個或多個盒子
  bomb:
    title: 炸彈 / Rush
    text: >-
      攻方啟動炸彈後要守住它；守方必須在引信燒完前拆除。爆炸會結束遊戲，攻方獲勝。用按住按鈕來啟動和拆除，或給每隊一組自己的按鍵密碼。
    meta: 隊伍按鈕或按鍵 · 引信與按住時間可設定
  sabotage:
    title: "破壞"
    text: "炸彈一回合接一回合，直到遊戲時間結束。進攻方啟動炸彈，防守方拆除。爆炸為進攻方得一分，拆除為防守方得一分；之後盒子休息，下一回合開始。得分較多的隊伍獲勝。"
    meta: "隊伍按鈕或按鍵 · 引信、按住、暫停與遊戲時間可設定"
  holdall:
    title: 全佔點
    text: >-
      和佔點一樣佔領盒子，但一隊只有在同時守住所有盒子時才會得分。丟了一個，計分就停止。
    meta: 多個盒子 · 需要場地控制器
  laststand:
    title: 最後一人
    text: >-
      守方一開始擁有所有據點。當他們只剩最後一個據點時，落敗倒數就會開始，直到他們再搶回另一個；倒數結束，攻方獲勝。
    meta: 多個盒子 · 需要場地控制器
  kill_confirmed:
    title: 擊殺確認
    text: >-
      玩家身上帶著經簽署的 NFC 標籤。隊伍在站點掃描收集到的標籤：敵人的標籤確認擊殺，隊友的標籤則否決擊殺。偽造的標籤會被拒絕。
    meta: NFC 讀卡機 · 玩家標籤
  respawn:
    title: 復活與命數
    text: >-
      復活點依隊伍或依玩家計算命數，兩次復活之間有冷卻時間。一隊的命數用完就被淘汰。
    meta: NFC 讀卡機或隊伍按鈕
  player_checkin:
    title: 玩家報到
    text: >-
      玩家拿自己的標籤在檢查點報到。盒子會計算每隊的玩家人數，也可以每次報到都給分。
    meta: NFC 讀卡機 · 玩家標籤
  medic:
    title: 醫護包
    text: >-
      可以搭配任何模式：中彈的玩家掃描自己的標籤，按住按鈕一段設定好的時間就能被治療。醫護包會顯示還剩幾次治療；每位玩家在每個醫護包每場遊戲的治療次數有限，GM 可以從控制台補充醫護包，每次治療都會出現在 GM
      的紀錄和玩家的畫面上。
    meta: NFC 讀卡機和一個按鈕 · 玩家標籤 · 需要場地控制器
  master_satellites:
    title: 主站與衛星
    text: >-
      隊伍要佔領一個主站盒和它的衛星盒。只有主站會得分，佔領者同時守住的每個衛星都會提高它的分數；主站易手時，所有衛星都會回到中立。已在軟體中寫好並測試，還沒在真實盒子上玩過。
    meta: 多個盒子 · 需要場地控制器
  target_windows:
    title: 標靶時窗
    text: >-
      標靶會隨機亮起某一隊的顏色幾秒鐘，亮著的時候打中它就替那一隊得分。這個遊戲已在軟體中寫好並測試；它需要的標靶擴充模組（一塊有命中感測器和燈環的靶板）還沒做出來。
    meta: 裝有標靶擴充模組的盒子 · 尚未推出
  hacking_terminal:
    title: 駭客終端
    text: >-
      終端機在按鍵上出一道謎題：根據有幾個數字位置正確來破解密碼、依正確順序剪斷電線，或重複一串序列。答錯會鎖住一段時間。破解後可以揭露另一個任務目標的密碼、得分，並佔領這台終端，直到另一隊再駭回去。已在軟體中寫好並測試，還沒在場地上用手機玩過。
    meta: 有按鍵的盒子或手機 · 不需要場地控制器
  vip_payload:
    title: VIP / 護送
    text: >-
      一隊要護送自己的 VIP（一位從 App 分享位置的玩家）或貨物（一支有 GPS 的手機）到撤離區；另一隊要阻止他們。沿途的檢查點盒子在被某隊守住時會得分。位置資料只留在場地控制器和手機上；只有「已撤離」會傳出去。已在軟體中寫好並測試，還沒用真實的 GPS 玩過。
    meta: 檢查點盒子、一支有 GPS 的手機或 VIP 的手機 · 需要場地控制器
  money_factory:
    title: 印鈔廠
    text: >-
      各隊佔領工廠盒子，守住時工廠就會產生金錢。玩家在自己隊伍的工廠掃描標籤收取金錢，帶著它穿越場地，再到銀行盒子存入換成分數；場地控制器會記住每位玩家身上帶了多少，所以可以在一個盒子收取、在另一個盒子存入。在醫護包接受治療的玩家會失去身上的錢，第一個存到目標金額的隊伍可以獲勝。已在軟體中寫好並測試，還沒在真正的盒子上玩過。
    meta: 有 NFC 的工廠和銀行盒子或手機 · 玩家標籤 · 需要場地控制器
  progressive_domination:
    title: 漸進佔點
    text: >-
      場上有好幾個盒子，但同一時間只能佔領其中一個，兩隊都會知道是哪一個。佔有啟用中盒子的隊伍每滿一分鐘就得分；佔有夠久之後，這個盒子就算該隊完成並鎖定，下一個盒子會通知兩隊。順序可以是 GM 的清單、盒子編號或隨機；最後一個盒子完成，或有隊伍達到目標分數，遊戲就結束。已在軟體中寫好並測試，還沒在真正的盒子上玩過。
    meta: 有隊伍按鈕的盒子 · 需要場地控制器
  codes:
    title: 密碼（附加規則）
    text: >-
      在同一個盒子上搭配任何模式執行：按鍵密碼可以給分、給提示或解鎖，GM 看得到誰用了哪個密碼、當時哪一隊守著這個盒子。
    meta: 按鍵 · 可搭配任何模式
  yours:
    title: 你的模式
    text: >-
      Money Factory、搶旗、你們社團自己的玩法……模式都是簡短的腳本。用遊戲模式點子範本提出你的想法，或把做好的模式以經簽署的套件分享到<a href="https://vakaobr.github.io/atalaia-modes/">模式登錄庫</a>。
    link: 分享一個遊戲模式點子

# The animated pictures of the modes page (tools/gen_mode_gifs.py, tools/mode_gifs.yaml):
# each picture's alt text (what happens in it, in order) and the caption under it.
gifs:
  intro: >-
    下面每個動畫都是由 Field Box 自己的韌體程式碼畫出來的，不是示意圖：上方是大螢幕，下方是小的 OLED，隨著該模式的一場遊戲進行。圖片下方的按鈕可以暫停動畫。
  play: 播放動畫
  pause: 暫停動畫
  domination:
    alt: >-
      Field Box 進行佔點模式的動畫。螢幕顯示中立的據點；紅隊按住按鈕，小螢幕的進度條填滿，據點變成紅色，分數開始增加。接著藍隊按住按鈕奪取據點，遊戲最後顯示最終比分。
    caption: >-
      Field Box 上的佔點模式：隊伍按住按鈕佔領據點，守住期間分數持續增加，另一隊可以把它搶走。
  bomb:
    alt: >-
      Field Box 進行炸彈模式的動畫。螢幕顯示炸彈待命；紅隊按住按鈕啟動炸彈，倒數從 4:59 開始，藍隊按住按鈕拆除，進度條填滿，螢幕變成藍色並顯示已拆除。
    caption: >-
      炸彈 / Rush：按住按鈕啟動，引信倒數，守方及時拆除。
  sabotage:
    alt: "Field Box 進行破壞模式的動畫。螢幕顯示炸彈待命，比分 0 : 0；紅隊按住按鈕，進度條填滿，炸彈啟動；炸彈爆炸，螢幕變成紅色，紅隊得一分。暫停畫面顯示 1 : 0 和距離下一回合的時間，接著藍隊按住按鈕拆除第二顆炸彈，螢幕變成藍色，藍隊得一分；遊戲結束畫面顯示紅隊獲勝。"
    caption: "破壞：有比分的炸彈回合，爆炸為進攻方得分，拆除為防守方得分，直到時間用完。"
  master_satellites:
    alt: >-
      主站與衛星的動畫：紅隊按住按鈕後，衛星盒從中立變成紅色；接著主站盒顯示紅隊守住幾個衛星（1、2，再到 3 / 3）以及每個計分間隔的分數，最後是遊戲結束畫面。
    caption: >-
      主站與衛星：衛星像佔點模式的據點一樣被佔領；主站盒計算一隊守住多少個，守得越多每次得分越多。
  hacking_terminal:
    alt: >-
      駭客終端的動畫：猜代碼的謎題，有嘗試紀錄與提示（位置正確與位置錯誤）；剪電線的謎題，電線一條條被剪斷；照順序按回去的謎題（先顯示一個按鍵，再顯示「換你了」）；以及顯示代碼的存取成功畫面。
    caption: >-
      駭客終端：終端可以是代碼、電線或順序謎題；解開的隊伍會佔領終端，還能讀出一組代碼。
  medic:
    alt: >-
      醫護包的動畫：醫護包顯示還剩 4 次治療；受傷的玩家按住按鈕，倒數進度條填滿；醫護包顯示治療完成、還剩 3 次；已用完所有治療次數的玩家被拒絕。
    caption: >-
      醫護包：受傷的玩家按住按鈕直到治療時間結束；醫護包記錄剩餘次數和每位玩家的上限。
  vip_payload:
    alt: >-
      VIP / 護送的動畫：沒有人佔領的檢查點盒子，藍隊按住按鈕並佔領它；接著是護送目標畫面，到撤離區的距離（公尺）逐漸縮短，出現 GPS 訊號弱的警告，最後撤離完成。
    caption: >-
      VIP / 護送：沿途佔領檢查點，護送目標的畫面（手機上的）顯示距離撤離還有多遠。
  money_factory:
    alt: >-
      印鈔廠的動畫：空閒的工廠，紅隊按住按鈕、佔領進度條填滿，工廠歸紅隊、庫存從 5 增加到 35（上限 50），玩家領取 15，銀行盒顯示存入 15 以及各隊的總額。
    caption: >-
      印鈔廠：被佔領的工廠會不斷累積鈔票，玩家用標籤領取，再存進銀行盒。
  progressive_domination:
    alt: >-
      漸進佔點的動畫：一個盒子在等待輪到它（已完成 1 / 4
      個盒子）；這個盒子變成啟用中，藍隊按住按鈕直到佔領；藍隊的分數和守住的分鐘數增加，同時進度條填滿；這個盒子對藍隊完成並鎖定；接著原本在等待的下一個盒子變成啟用中。
    caption: >-
      漸進佔點：同一時間只能佔領一個盒子；守得夠久的隊伍完成它，順序中的下一個盒子隨即通知兩隊。
  target_windows:
    alt: >-
      標靶時窗的動畫：標靶等待某一隊的顏色，紅隊的時窗開啟並倒數 5 秒，標靶顯示紅隊命中，接著藍隊的時窗開啟，命中次數增加到 2。
    caption: >-
      標靶時窗：標靶為某一隊的顏色開啟短暫的時窗；時窗內的命中才算分。
  codes:
    alt: >-
      密碼附加規則搭配炸彈模式的動畫：螢幕要求輸入隊伍密碼，四個數字以圓點顯示，倒數進行，輸入拆除密碼後螢幕顯示已拆除。
    caption: >-
      密碼：炸彈模式改用輸入的隊伍密碼，而不是按住按鈕：有按鍵的盒子要求一組密碼來啟動，另一組來拆除。模式腳本寫出的訊息仍是英文。
  kill_confirmed:
    alt: >-
      擊殺確認的動畫：站點等待標籤；紅隊玩家的標籤被接受，14 秒的時窗倒數，並顯示「Kill confirmed: b1」；接著偽造的標籤被拒絕。
    caption: >-
      擊殺確認：掃描對手的簽章標籤即確認擊殺；偽造的標籤會被拒絕。模式腳本寫出的訊息仍是英文。
  respawn:
    alt: >-
      復活與命數的動畫：復活點讓玩家回到遊戲，隊伍的命數從 19 降到 18、17，最後以紅色顯示隊伍已沒有命數。
    caption: >-
      復活與命數：每次回到遊戲都會讓隊伍損失一條命；降到零，隊伍出局。模式腳本寫出的訊息仍是英文。
  player_checkin:
    alt: >-
      玩家報到的動畫：在報到點每掃描一個標籤就增加一位玩家；總數從 1 增加到 3，再到 5，並顯示各隊人數。
    caption: >-
      玩家報到：玩家在開局時報到，盒子統計每隊的人數。模式腳本寫出的訊息仍是英文。

screens:
  title: 實際畫面
  intro: >-
    三種模式在盒子上的樣子：動畫由 Field Box 韌體自己的程式碼繪製，不是後製的示意圖。每張圖下方的按鈕可以暫停動畫。再往下是 App 的截圖。
  real:
    title: 工作台上的真實盒子
    intro: >-
      上面的模式是韌體程式碼畫出來的動畫。這裡是 Field Box 的工作台組裝（一塊開發板加散線，沒有外殼）真的在玩佔點模式。
    alt: >-
      Field Box 工作台組裝玩佔點模式的無聲循環影片：螢幕顯示紅隊佔領的區域，幾秒後換成藍隊。
    caption: >-
      第一個 Field Box 的工作台組裝（2026 年 10 月 31 日）：螢幕上的一次佔領從紅色變成藍色。還沒有外殼，仍是散線。
    more: 查看組裝與照片 →
  gifs_more: 看全部模式 →
  box_title: 盒子的畫面，一步一步來
  box_intro: >-
    八張擷取自真正 Field Box 韌體（ESP32、LVGL 9.2、320&nbsp;×&nbsp;240&nbsp;TFT）的畫面，在 <a
    href="https://wokwi.com">Wokwi</a> 模擬器中執行，從遊戲管理員的 PIN 碼到拆除炸彈。這裡的盒子介面是英文的。韌體現在已經能在真實的 Heltec V4.3
    上執行；這些截圖來自模擬器。點一下截圖可以看大圖。
  note: >-
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">組裝手冊</a>
    （英文）有 Heltec WiFi LoRa 32&nbsp;V4 的完整接線圖和第一次燒錄的教學。
  pin_entry:
    alt: >-
      Field Box 畫面：標題「GAME MASTER」，提示「Enter the admin PIN」（輸入管理 PIN 碼），四個代表數字的空心圓，提示「# enter * delete」。
    caption: GM 輸入管理 PIN 碼來解鎖設定。
  choose_game:
    alt: >-
      Field Box 畫面：標題「CHOOSE A GAME」（選擇遊戲），列出 1「Bomb」（以黃色標示）、2「Domination」、
      3「Hold-All Domination」、4「Last Stand」和 5「Codes」，提示「1-9 choose # next * back」。
    caption: 從盒子上的選單挑一個遊戲模式。
  confirm:
    alt: >-
      Field Box 畫面：橘色橫條上的標題「START THE GAME?」（開始遊戲？），模式名稱「Bomb」，「Timer: 10 min」，提示「# start * back」。
    caption: 開始前確認模式和時間。
  standby:
    alt: >-
      Field Box 畫面：標題「STANDBY」，「Hold the button to arm」（按住按鈕啟動），紅色的「RED」，底部寫著「The bomb is not armed」（炸彈尚未啟動）。
    caption: 等待紅隊按住啟動按鈕。
  armed:
    alt: >-
      Field Box 畫面：紅色橫條上的標題「ARMED」（已啟動），大大的倒數「5:00」，標籤「until detonation」（距離引爆）。
    caption: 炸彈已啟動；藍隊有 5 分鐘可以拆除。
  defused:
    alt: >-
      Field Box 畫面：藍色背景，白色勾勾，大字「DEFUSED」（已拆除），下方「BLUE team wins」（藍隊獲勝）。
    caption: 藍隊及時拆除了炸彈。
  joined:
    alt: >-
      Field Box 畫面：標題「JOINED GAME 4242」（已加入遊戲 4242），左邊是標籤「Game」，右邊是「zone, node 7」。
    caption: 盒子透過 NFC 卡或序列埠控制台加入了場地的遊戲。
  code_entry:
    alt: >-
      Field Box 畫面：標題「CODE」（密碼），四個圓圈中有兩個填上黃色，提示「# enter * delete」。
    caption: 為密碼附加規則輸入密碼（給分、提示或解鎖）。

  app_title: Android App
  app_intro: >-
    App 自己的畫面有葡萄牙文、英文、德文和繁體中文，並且和 Field Box 使用同樣的 YAML 檔來繪製每個模式的畫面。這些是 App 的測試圖片，不是手機的照片：App 已在 Android 模擬器上執行過，還沒在真正的手機上跑過。
  app_roles:
    alt: >-
      App 的第一個畫面，問這支手機要做什麼：四個選項，每個都有一行說明它的用途：遊戲道具、玩家、裁判和主辦。
    caption: 選擇這支手機在遊戲中的角色。
  app_prop:
    alt: >-
      一支 Android 手機當作炸彈：模式的倒數畫面，和各模式的畫面一樣是英文（「ARMED」「4:47」「until detonation」），下面是兩個可以按住的大按鈕，紅隊和藍隊。
    caption: 手機當作炸彈，附上各隊的按鈕。
  app_player:
    alt: >-
      玩家畫面：遊戲名稱、還剩 20:00、藍隊 20 分在紅隊 12 分之上、每個任務目標由誰佔領，以及發生了什麼事。
    caption: 玩家在自己的手機上追蹤遊戲。
  app_branded:
    alt: >-
      一個有自家品牌的場地的玩家畫面：標題列有場地的標誌和名稱 Campo Norte，畫面後方淡淡的是它的桌布，
      Águias 和 Lobos 兩隊附上隊徽和分數，20 比 12。
    caption: 場地自己的標誌、桌布和隊徽。
  app_chrono:
    alt: >-
      裁判的測速畫面：初速按鍵、BB 彈重量和綠色的「通過」，附上最高能量和限制值。
    caption: 報到時測速，測速值由裁判簽署。
  medic_intro: >-
    醫護包在 Field Box 和 Android 道具上都用同樣的 YAML 檔繪製畫面，預設是葡萄牙文，除非 GM 設成英文、德文或中文。這是 App 畫出來的樣子：
  medic_idle:
    alt: >-
      醫護包畫面：標題「LIGADURAS」（醫護包），一個大大的 4，「Restam 4 ligaduras」（還剩 4 次治療），以及黃色的「Lê a tua etiqueta e mantém premido o botão」（掃描你的標籤，然後按住按鈕）。
    caption: 等待玩家，還剩 4 次治療。
  medic_hold:
    alt: >-
      醫護包畫面：藍色標題列中的玩家編號 b1，「Mantém premido para tratar」（繼續按住來治療），進度條上方黃色的還剩 4 秒，以及「Largar antes do tempo cancela」（提早放開就會取消）。
    caption: 玩家 b1 按住按鈕接受治療。
  medic_healed:
    alt: >-
      藍底的醫護包畫面：白色十字、「DE VOLTA AO JOGO」（重回戰場）、b1、「Tratamento 1 de 2」（第 1 次治療，共 2 次）和「Restam 3 ligaduras」（醫護包還剩 3 次治療）。
    caption: 重回戰場，用掉兩次治療中的第一次。
  # The screenshot viewer (the dialog at the end of the main page).
  viewer:
    label: 截圖
    prev: 上一張截圖
    next: 下一張截圖
    close: 關閉
try:
  title: 今天就試試看
  intro: >-
    不需要任何硬體：共用核心可以在電腦上執行。模擬器在你的瀏覽器裡跑一個模式：按住隊伍按鈕、看每個道具的畫面、追蹤事件紀錄。下面的指令要在終端機中輸入。
  compiler: 有 C 編譯器
  docker: 只有 Docker
  then: >-
    接著打開 <code>http://localhost:8000</code>。你需要 Python 3.10 以上和 PyYAML。
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">模擬器指南</a>（英文）列出了所有選項。
  board:
    title: 在開發板上
    text: >-
      Field Box、USB 無線電數據機和 I/O 模組的<a href="{{ page.to.glossary }}#glossary-firmware">韌體</a>都已寫好，三者都在電腦上的測試中執行。Field Box 和數據機的韌體已經在工作台上的真實 Heltec V4.3 上執行：盒子透過第二塊當作數據機的開發板，以無線電加入場地控制器的遊戲，一路玩到結束，也能以無線方式更新韌體，開發板自己的小螢幕會顯示遊戲；I/O 模組的韌體還沒在開發板上跑過。想在沒有盒子的情況下試試裸板，有一個工作台版本的韌體（透過 USB 線傳送按鍵）。要組裝盒子並燒錄，請照著 <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">組裝手冊</a>；<a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">韌體指南</a> 也說明了如何建置數據機和 I/O 模組（兩者皆為英文）。
  app:
    title: 在 Android 手機上
    text: >-
      用 Docker 建置 App 的除錯版 APK，安裝到 Android 8.0 以上的手機或 Android 模擬器上，詳見
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">App 指南</a>（英文）。它已在模擬器上執行過，還沒在真正的手機上跑過。
  manuals:
    title: 使用與主辦
    text: >-
      給使用 Atalaia 的人看的手冊，不是給開發者看的：給<a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/README.md">玩家、主辦、裁判、盒子操作員和組裝盒子的人</a>，有英文和葡萄牙文版本，另附一頁式快速入門。內容照軟體現在實際顯示的寫，還沒在場地上試過的部分會特別標明。目前還沒有中文版。

roadmap:
  title: 路線圖
  intro: >-
    六個階段，每個階段都以一次真實場地測試收尾，也就是它的「關卡」。軟體進度跑在硬體前面：第 1 到 3 階段的軟體已完成（真實開發板已在工作台上玩完整場遊戲，iOS App 已在 iPhone 上通過檢查清單）；第 4、5 階段的軟體已完成。關卡在等組裝好的盒子、場地測試、一台真正的伺服器和專案的登錄庫金鑰。
  more: 完整路線圖，看每個階段包含什麼和它的關卡 →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code).
  done: 已完成
  software: 軟體已完成
  # The parts of each phase on the roadmap page. Each phase: short (one line, also on the main
  # page), done (bullets), next (bullets), gate; a phase with a long done list also has groups
  # (g_*: title and items) that fold into a <details> under the first few bullets.
  part_done: 已完成的部分
  part_next: 下一步，以及在等什麼
  part_more: 其餘已完成的部分，依主題分類
  status_link: 這個階段在儲存庫中的詳細狀態 →
  p0:
    title: 基礎
    short: >-
      共用核心、Lua 沙箱、Skirmesh-RF 編解碼器和瀏覽器模擬器。關卡已通過。
    done:
      - 共用核心，每個平台都執行的遊戲邏輯。
      - <a href="{{ page.to.glossary }}#glossary-lua">Lua 沙箱</a>，遊戲模式的腳本在其中執行。
      - <a href="{{ page.to.glossary }}#glossary-skirmesh-rf">Skirmesh-RF 編解碼器</a>，無線電訊息的格式。
      - 瀏覽器模擬器，能執行佔點與炸彈模式。
    gate: >-
      關卡：模擬器能用 Lua 腳本執行佔點與炸彈模式。<strong>已通過。</strong>
  p1:
    title: 單一盒子
    short: >-
      Field Box 韌體與組裝手冊；真實開發板已能在工作台上玩完整場遊戲，螢幕、按鍵和按鈕也已用散線接好（照片和影片在組裝頁）。還在等一個組裝完成的盒子。
    done:
      - Field Box 的 ESP32 韌體，附盒子上的預設遊戲，已在模擬器中執行。
      - 盒子的小螢幕以四種語言顯示按住進度條、分數和佔領時間。
      - 附接線圖的組裝手冊。
      - 第一塊開發板（Heltec V4.3，2026 年 10 月 20 日）在工作台上：能開機、啟動無線電、讀取按鈕，並在自己的小螢幕上玩完整場遊戲，包括炸彈模式（啟動、拆除、時間用完）。
      - "遊戲計時條：限時遊戲進行時，小螢幕底部的一條色帶顯示還剩多少時間，OLED 則顯示時鐘。軟體已完成，還沒在真正的螢幕上看過。"
      - "情境傳給盒子的設定會一直重送，直到每個盒子確認收到，盒子現在也會回傳這個確認。僅軟體與主機測試，還沒在真正的開發板上試過。"
      - "盒子管理選單裡的「綁定新場地」，可用配對碼把已綁定的盒子換到另一個場地。僅主機測試，還沒在真正的開發板上試過。"
      - "盒子不再顯示場地的標誌：它的開機畫面是 Atalaia 的塔，這是建置時可以替換的一個檔案（正式發布的映像檔一律帶著這座塔，發布建置會檢查）。在工作台上，盒子記憶體耗盡的原因就是下載標誌。曾保留舊標誌的盒子會在第一次開機時把它刪掉（主機測試）。"
      - "更大的分割表：盒子的兩個韌體區各 4 MB（映像檔原本佔了 2 MB 的 93 %），設定和金鑰留在原處。僅主機測試和建置，還沒燒錄到開發板上。使用舊分割表的盒子需要用 USB 燒錄一次；之後無線更新照舊。"
      - "Field Box 當作 iBeacon：從加入遊戲到遊戲結束，盒子會發出藍牙信標（每 500 毫秒一次，Wi-Fi 使用中時絕不發出），讓附近的手機能判斷玩家在哪一層樓或哪個房間。場地自己的識別碼由場地的加入金鑰推導而來，GM 可以依場地或依盒子關閉盒子的信標功能。盒子的內部記憶體在工作台上於加入遊戲時耗盡之後（Wi-Fi 失敗，接著看門狗重置）重新設計：在工作台上量得開機時有 241 KB 可用，開著信標玩遊戲時最低 102 KB，預算縮得太小時 CI 會讓建置失敗。還沒確認手機能不能聽到真正盒子的信標。"
      - "更新或模式下載被拒絕或失敗之後，盒子的螢幕會在 8 秒後回到該狀態的畫面（在工作台上，被拒絕的訊息會一直停在螢幕上，直到有人看到）。僅主機測試。"
      - "在正式發行版本中，盒子的序列主控台上，給盒子加入金鑰或啟動更新的指令（@joinkey、@update）需要管理員 PIN，沒有設定 PIN 時會拒絕；測試台版本為了測試台腳本保持開放。只有主機端測試，還沒在真實開發板上試過。"
      - "Field Box 的第一個工作台組裝（2026 年 10 月 31 日）：一塊 Heltec V4 開發板，接上 2.8 吋 TFT、OLED、4×3 按鍵和隊伍按鈕，用散線連接、沒有外殼，和工作台上的控制器玩佔點模式。有<a href=\"{{ page.to.build }}#field-box-first-build\">照片和影片</a>。"
    next:
      - 一個組裝好的盒子，跑完一場 2 小時的社團遊戲，中途不必重新啟動。
      - "在真正的螢幕上看到計時條。"
      - "在真正的開發板上試設定重送和換場地。"
      - "用真正的手機聽 Field Box 的信標，並在加入遊戲時用新的記憶體預算啟動 Wi-Fi。"
      - "在真正的開發板上燒錄新的分割表（用 USB 燒錄一次，不必清除，針對使用舊分割表的盒子）。"
      - "強化過的正式發行映像（快閃記憶體加密、安全啟動）：目前只寫成計畫，沒有建置，也沒在任何開發板上試過。"
    gate: >-
      關卡：一個盒子跑完一場 2 小時的社團遊戲，中途不必重新啟動。<strong>尚未通過</strong>，要等到有組裝好的盒子做到。
  p2:
    title: 場地網路
    short: >-
      LoRa 上的 Skirmesh-RF、場地控制器、API、GM 控制台和一組模式，已在軟體中測試；在工作台上，真實開發板透過無線電和控制器玩完整場遊戲，工作台上發現的問題已在軟體中修正。正在等場地上 5 個組裝好的盒子。
    done:
      - 加密的 Skirmesh-RF 無線電協定，以及 USB 無線電數據機。
      - 附 API 的場地控制器。
      - 主辦控制台，附記分板。
      - 用 NFC 卡或 QR code 加入遊戲。
      - 盒子韌體和控制器之間的通訊。
      - 一組模式：全佔點（同時守住所有盒子才得分）、最後一人（只剩三個據點之一時開始落敗倒數）、炸彈模式中各隊自己的啟動密碼，以及密碼附加規則（按鍵密碼可以給分、給提示或解鎖，並告訴 GM 是誰用的）。
      - 以上都已在模擬器、仿真器和電腦上測試過，包括整場遊戲；在工作台上，真實開發板透過無線電和控制器玩完整場遊戲：邀請、佔領、以代碼配對、無線更新、取得缺少的模式。
      - 盒子先聽再說：每個盒子發送前先確認頻道空閒，減少訊息碰撞。在模擬器中，20 個盒子的場地收到 89 % 的更新，原本是 65 %。
      - "GM 在全佔點中也可以設定或釋放盒子的擁有者，和其他模式一樣。"
      - "控制器可以把自己的無線電訊框一個一個、隔開時間送出。已經做好，在場地測試決定之前先關閉。"
      - "無線電拒絕韌體更新的提議時，Pi 控制器會立刻讓更新失敗。"
      - "設定好的盒子可以回到 Wi-Fi 設定：從需要管理員 PIN 的選單項目，或 USB 主控台的指令。設定頁有英文、葡萄牙文、德文和繁體中文，手機會自己開啟它。"
      - "控制台的「遊戲」分頁會顯示給玩家的記分板 QR code。"
      - "情境可以用德文和繁體中文撰寫，目標名稱也包括在內。"
      - "<strong>破壞</strong>（Sabotage），新的模式：炸彈一回合接一回合，直到遊戲時間結束。進攻方啟動，防守方拆除；爆炸為進攻方得一分，拆除為防守方得一分，之後盒子休息，下一回合開始。得分較多的隊伍獲勝，同分為平手。已在模擬器和測試中，也在 Field Box 的預設遊戲裡；還沒在真正的開發板上試過。"
      - "USB 無線電數據機的小螢幕說葡萄牙文、英文、德文和繁體中文，和盒子一樣。僅主機測試，還沒在真正的開發板上試過。"
      - "GM 控制台的表單會保留主辦輸入的內容直到儲存：玩家報到或控制台的時鐘不再把已儲存的值放回去。"
      - "更換場地頻道不再讓空閒的盒子失聯：控制器會告訴它們它去了哪裡（一種新的加密無線電訊息 MOVE，在舊頻道上說三次），「尋找盒子」可以掃過最近四個頻道，找出錯過的盒子。這是在工作台上發現的：一次無線電掃描移動了頻道，閒置的盒子就什麼也聽不到了。已在兩種控制器、模擬器和盒子的程式碼中完成；兩塊開發板上的檢查還沒做。"
      - "開始、暫停或繼續大約一秒內就會送到盒子，而不是最多 30 秒：控制器會在 1、2.5、5 和 10 秒後把狀態當作 TIME 訊息再送一次（在工作台上，有個盒子晚了 21 秒才知道遊戲開始）。兩塊開發板上的檢查還沒做。在無線電佔用時間模型中，重送、MOVE 和一次掃描，讓控制器在典型的一小時內於預設子頻段多佔用約 2 秒。"
      - "GM 控制台會說明更換頻道對空閒盒子做了什麼（三次 MOVE 已說了幾次，然後是控制器已經移動），設定頁有「尋找盒子」按鈕，顯示一次掃描的結果。在占空比低於 10 % 的子頻段，每小時的掃描次數有上限（子頻段預算的 5 %），被拒絕時以及下一次何時可行，控制台都會說明。僅軟體，兩種控制器都有。"
      - "預測分數會跟著佔領走：盒子的兩則 STATE 訊息之間，控制器會繼續為佔領事件所指的隊伍計分，直到盒子的下一則 STATE。在工作台上，佔領後緊接著遺失一則 STATE 時預測會出錯；有了這項變更，同樣的工作台設定通過了，盒子的扣分也在工作台上檢查過。"
      - "盒子的遊戲結束會結束遊戲：在控制器上沒有場地邏輯的模式（破壞的時間限制、炸彈），遊戲中任一盒子送出的第一個 game.end 就會結束遊戲，以該盒子指定的勝方或平手收場。在炸彈 / Rush 中，爆炸現在會結束遊戲，由啟動炸彈的隊伍獲勝；拆除則不會。這是在工作台上用破壞模式發現的，炸彈的爆炸也在那裡檢查過。"
      - "被錄下來的無線電指令不能再於日後重放：每個接收端（盒子、USB 無線電模組和兩種控制器）都為每個發送端保留一個重放視窗，盒子會拒絕比它最後套用的更舊的開始、暫停、繼續、結束或 TIME。遺失了世代（epoch）紀錄的盒子會抽一個新的世代，而不是重複使用 nonce。空中傳輸的格式沒有改變：舊盒子繼續可用，但在更新之前仍然暴露。已在模擬器和電腦上測試，C、Python 和 Dart 共用同一組測試向量；還沒在真實開發板上試過無線電重放。"
      - "安全審查帶來的場地控制器強化：限制請求大小；開啟 HTTPS 時，GM 和玩家的權杖在一般 HTTP 上被拒絕（控制台在 https://&lt;控制器&gt;:8443/console/ 開啟）；場地的 MQTT 走 TLS（8883 埠；Pi 上未加密的 1883 只在本機回送位址）；工作人員 ATAK 串流使用 TLS；HSTS；Pi 上強化過的服務單元；經簽署模式的撤銷採失敗即封閉（清單遺失或無法讀取時不安裝任何東西；離線的控制器沿用最後一份清單 30 天）。已在電腦上測試，還沒在場地上的真實 Pi 或手機上試過。"
      - "遺失紀元（epoch）儲存、因此以隨機高紀元回來的盒子，現在找得回來：收不開 HELLO 或 TIME 的接收端會搜尋紀元範圍的其餘部分（每次搜尋一段，在既有額度內），聽到這種盒子的控制器則用新的 CMD 訊息把它的紀元告訴其他裝置，這個訊息只能調高紀元。沒有紀錄而繼續的遊戲，控制器的紀元也從隨機值開始，所以 nonce 不會重複。舊盒子會忽略新訊息。在模擬器與電腦上測試，尚未在真實電路板上試過。"
      - "第二次遺失紀元儲存時，不會再抽到更低的紀元：盒子、Pi 和手機控制器會在每把金鑰的紀錄之外，另外記住自己用過的最高紀元，抽取從它之上開始；已在某場遊戲中發射過的控制器，不會再以舊節點編號被重新邀請（它會拿到新的編號）；Wi-Fi 道具現在也會收到指出控制器紀元的 CMD 訊息，並轉給它的 I/O 模組（兩種控制器都是）。RFC 0001 修訂 25。在模擬器與電腦上測試，尚未在真實電路板上試過。"
      - "模式的 <code>rand()</code> 現在除了遊戲種子與節點編號，還由遊戲金鑰設定，所以玩家從 API 看到的內容無法再推算出來（駭客終端的密碼、標靶時窗的隊伍），遊戲種子也不再顯示給玩家和記分板。同一場遊戲重播結果相同，但在此變更前錄下的遊戲會重播出不同的隨機值：不要在遊戲進行中更新盒子。C、Python、Dart 共用測試向量；尚未在電路板上試過。"
      - "Lua 沙箱補上了記憶體檢查工具審查發現的漏洞：表格函式、協程與長串回呼都會計量，ESP32 的 C 堆疊深度有上限，超出範圍的節點編號或計時器不再繞回。堆疊數值是計算出來的，尚未在電路板上量測。"
      - "天線增益成為編譯選項（<code>--antenna-dbi</code>，0 到 20 dBi，預設 2）：裝了較強天線的盒子會把傳導功率降低相同的增益，並向下取整，讓輻射功率維持在子頻段的限制內。僅主機測試。"
      - "即時串流的存取代碼不再出現在網址：控制台把它放在標頭，App 放在 Authorization 標頭，控制器與場地伺服器的日誌會把網址中的代碼值遮蔽（舊網址在過渡期內仍可使用）。日誌曾被分享出去的場地，應更換 GM 與唯讀代碼。"
      - "沒有玩家編號的隊伍成績，現在兩種控制器也保存 365 天（遊戲紀錄 90 天），GM 可唯讀查看。已在電腦上測試。"
    next:
      - 無線電開發板，以及 5 個組裝好的盒子，用來做場地測試。
      - 用 20 個盒子做場地測試，比較開啟和關閉「先聽再說」。
      - "是否開啟控制器的間隔送出，由 20 個盒子的場地測試決定。"
      - "在兩塊開發板上檢查：更換頻道後閒置的盒子還在，開始大約一秒內就送到（操作手冊已寫好）。"
      - "在真實開發板和真正的 Pi 上試重放視窗和強化後的控制器（在測試台上把錄下的指令重放一次）。"
      - "在兩塊桌面開發板上清除盒子的紀元儲存，確認它會被重新找到，連做兩次，並讓原本的領導控制器重新加入（操作手冊已寫好）。"
    gate: >-
      關卡：在 <a href="{{ page.to.glossary }}#glossary-cqb">CQB</a> 場地和戶外場地各用 5 個盒子，佔領一次都沒漏掉。<strong>尚未通過。</strong>
  p3:
    title: Android 與玩家
    short: >-
      Android 道具、I/O 模組、玩家 App 和需要手機的模式：軟體已完成，包括 iOS（已在 iPhone 上檢查）。場地測試在等真正的手機和 I/O 模組。
    done:
      - <strong>App</strong>：給玩家、裁判和 GM 使用，有葡萄牙文和英文，支援 Android 和 iOS（iOS 版已在 iPhone 上通過檢查清單）。
      - Android 手機可以當作盒子，任何模式都能玩並顯示模式自己的畫面，並透過 QR code、NFC 卡或文字加入遊戲。
      - <strong>手機當場地控制器</strong>：軟體已完成，正在等真正的手機；它自己執行遊戲和場地的各項服務。
      - >-
        <strong><a href="{{ page.to.glossary }}#glossary-android-prop">I/O 模組</a></strong>：韌體把一塊 Heltec 開發板的按鈕、按鍵、燈、警報器、NFC 讀卡機和 LoRa 無線電借給手機使用。
      - <strong>使用手機和標籤的模式</strong>：擊殺確認、復活與命數、玩家報到、醫護包和印鈔廠。
    g_modes:
      title: 模式與畫面
      items:
        - 擊殺確認、復活與命數和玩家報到會讀取玩家經簽署的 NFC 標籤。
        - 醫護包：中彈的玩家掃描自己的標籤並按住按鈕來接受治療，治療次數有限。
        - 印鈔廠：某隊守住工廠時工廠會產生金錢；玩家用自己的標籤收取，再到另一個盒子存入，場地控制器記住每位玩家身上帶了多少。
        - 以 YAML 描述、由 Field Box 和 App 以相同方式繪製的模式畫面。
    g_players:
      title: 玩家與裁判
      items:
        - 玩家在場地掃描印出來的海報就能報到（不需要帳號、不需要網路），說明要用哪幾把槍，並看到自己是否已通過測速。
        - >-
          <a href="{{ page.to.glossary }}#glossary-chrono">報到測速</a>：能量、各級別的限制、抽查、由裁判簽署的測速值。裁判依照「待測速槍枝」清單作業，他們簽署的測速值會把每把槍標為通過或拒絕；他們也有槍枝登記冊和玩家標籤。
        - 玩家可以在遊戲中分享自己的位置，由控制器決定誰看得到。
        - 自己架設控制器的場地或社團，可以在 App、記分板和海報上顯示自己的標誌、桌布和顏色，並幫自己的隊伍取名字、加隊徽。
        - "檢查報到海報在印出後被更改時，GM 控制台會通知。"
        - "裁判和測速畫面說的就是 App 實際做的事，限制清單也已翻譯。"
        - "App 用 Android Keystore 封存更多機密資料：場地伺服器金鑰、玩家的機密和伺服器登入。"
        - "玩家的 NFC 標籤由場地控制器簽署，可從 GM 控制台、手機控制器或裁判的 App 寫入。裁判不必再為此持有場地金鑰。"
        - "槍枝標籤：App 顯示、分享或列印每把槍的 QR 貼紙，GM 控制台可為所有已報到的玩家列印。裁判的待測佇列會掃描它們。"
        - "室內位置：GM 在平面圖上放置 BLE 信標，聽到信標的手機會回報自己所在的房間，而不是 GPS。Android 上軟體已完成並以模擬測試，還沒用真正的信標試過。在 iPhone 上，一個建立在 Apple CoreLocation 上的外掛，在 App 開在畫面上時做同樣的事（否則用 GPS 和最後的樓層）；它已寫好並在 CI 上編譯過，還沒在 iPhone 上試過。"
        - "App 可以從記分板的 QR code 跟上一場遊戲，手機控制器以自己的場地 CA 提供 HTTPS 時也可以。軟體已完成，還沒在真正的手機上試過。"
        - "玩家選擇自己在哪一個樓層，並看到場地平面圖和他們可以看到的位置。"
        - "App 中的遊戲歷史：玩家參加過的遊戲，最新的在最前面。"
        - "App 可用 Google、Microsoft、Apple 或通行金鑰登入，並有帳號畫面。Android，以及以 Swift 寫的 iOS（社群登入的瀏覽器用 ASWebAuthenticationSession，通行金鑰走 Apple 的平台憑證；iOS 上的通行金鑰要在建置時選用，且需要付費的 Apple 開發者計畫）。iOS 這一部分由 CI 編譯，還沒在 iPhone 上執行過；App 的登入還沒在真正的手機上試過（場地伺服器那一側已用 Google 和 Microsoft 試過，見第 4 階段）。"
        - "玩家的場地平面圖可以顯示場地的網格和玩家自己所在的格子。"
        - "裁判登記複製品時，可以綁定一張 NFC 貼紙。"
        - "裁判的手機不再保存場地加入金鑰：只有道具（它的加入卡）和手機控制器會保存，升級時會從裁判的手機清除。"
        - "固定場地自己 CA 的記分板連結會依場地記住，CA 更換時就忘掉。"
        - "進行中的遊戲在玩家畫面開著時，Android 前景服務會帶著通知讓 App 持續執行，所以 App 關閉或螢幕熄滅時震動提示仍會響。iOS 沒有。還沒在真正的手機上試過。"
        - "Field Box 也算信標：已放置的盒子會和 GM 自己的信標一起登記為信標，已經在分享位置的手機會在遊戲中接收登記表的變更。僅軟體，還沒用手機和真正的盒子試過。"
        - "App 裡的隱私聲明：帳號上次看到的是另一個版本時顯示「閱讀並確認」，聲明以 App 的語言顯示，什麼都不會被擋住。App 在顯示聲明之後可以建立帳號（密碼或社群登入），並有「我已年滿 16 歲」的勾選框；未滿 16 歲的玩家不需要帳號，可在場地報到。社群登入註冊會附上當事人看到的聲明版本，對較舊的自架伺服器，登入也仍能運作。託管中樞各場地之間的測速連結（一次性代碼）只在託管模式下顯示。僅軟體。"
        - "報到時的卡片檢查：場地檢查會員資格時，報到會保持待處理，直到裁判或 GM 手上拿著實體卡片勾選「已見卡片，相符」；之後會員編號會從控制器刪除（只保留結果和到期日），沒有卡片時也可以放行，理由會記錄下來，但絕不記錄編號。已在控制台、App 的裁判佇列和兩種控制器中完成。僅軟體。"
        - "分享位置是報到時一個獨立、預設不勾選的選項（在 App 和控制台的手動報到中），並說明誰看得到；拒絕既不會擋住報到，也不會擋住遊戲，玩家隨時可以開啟或關閉。沒有它，控制器會拒絕位置。僅軟體。"
        - "App 的安全審查：固定的場地 CA 剛好是一張憑證；Android 上沒有全 App 的明文 HTTP（只有本機回送位址、模擬器的主機、192.168.4.1 和 atalaia.local）；正式版 APK 絕不會誤用除錯金鑰簽署；社群登入的票證綁定在 App 實例上。還沒在真實手機上試過；正式版簽署金鑰仍要由維護者建立。"
        - "玩家的事件清單與遊戲紀錄不再顯示對玩家沒有文字說明的例行事件（盒子確認設定、節點上線或離線、標籤掃描、標靶中彈），不再顯示原始的類型名稱。"
    g_props:
      title: Android 道具與 I/O 模組
      items:
        - Android 道具透過場地的 Wi-Fi 加入控制器的遊戲，或透過 I/O 模組用無線電加入。
        - I/O 模組的韌體會透過 USB 或藍牙，把一塊 Heltec 開發板的隊伍按鈕、按鍵、燈、警報器、NFC 讀卡機、外殼開關和 LoRa 無線電借給手機使用。
        - "App 會自己重新連上遺失連線的 I/O 模組。還沒用真正的 I/O 模組試過。"
        - "Android 道具像盒子一樣，向自己的控制器取得已簽署的模式包。軟體已完成。"
        - "GM 控制台可以用無線電把 I/O 模組的設定送過去：四個按鈕的顏色、LED 環的亮度、音量，以及外殼開關是否回報。模組像驗證其他指令一樣驗證它，把設定存在自己的快閃記憶體並回應；控制器會一直重送，直到收到回應。以前這些是在建置韌體時決定的。軟體已完成，並以電腦上的模組程式碼測試，還沒用真正的模組試過。"
        - "Android 道具的盒子扣分現在會送到控制器，經由 Wi-Fi 連線和無線電連線都可以。僅軟體。"
    g_controller:
      title: 手機當場地控制器
      items:
        - 遊戲引擎：在共用核心上執行模式的 field.lua，附 MQTT broker 和位置過濾器；REST API、即時串流和 MQTT 主題；重新啟動後保留遊戲；加入資料。
        - 在它的 Wi-Fi 上的 Android 道具、以 I/O 模組當作它的無線電、使用玩家權杖的場地報到、「待測速槍枝」清單和玩家位置。用和 Pi 控制器相同的合約測試案例檢查，並在電腦上搭配 I/O 模組和 Field Box 自己的程式碼執行。
        - 它的畫面：App 首頁上的角色、螢幕關閉時仍持續運作、由 App 提供的 GM 控制台，以及以手機上建立的場地 CA 提供 HTTPS。
        - 場地平面圖（每層一張平面圖、它在地圖上的位置、含場地邊界的地圖標記，以及從地圖載入的場地，因此越界警告在這裡也能運作）和無線電頻道，可透過 I/O 模組尋找安靜的頻道。
        - 透過無線電操作盒子：以密封邀請把盒子邀進下一場遊戲；遊戲結束時通知盒子，即使手機重新啟動後沒有遊戲金鑰也可以；用盒子顯示的代碼或手機以 NFC 寫入的場地卡綁定新盒子；在遊戲之間更新韌體（透過 I/O 模組或 Pi 的 USB 無線電數據機，手機的無線電送不出去時會說明原因）。
        - 預設組合、上傳的模式和經簽署的模式套件（會送給缺少它們的盒子）、在手機上編譯的劇本、遊戲中的角色模式套件，以及隊伍名稱和隊徽。
        - Pi 其餘的功能也有：故障轉移（手機和 Pi 可以互為備援控制器）、與場地伺服器同步（有網路時上傳遊戲、紀錄和分數；從那裡取得報名名單、場地品牌和劇本庫）、遠端 GM 和 ATAK 資訊。
        - "GM 控制台可在手機上使用：報到和裁判的表格會上下堆疊，頁面不必左右捲動。"
        - "手機控制器自己的畫面可以匯入報名名單（用 Android 的檔案選擇器選 CSV 或 JSON 檔），不需要 GM 控制台。"
        - "備援控制器會從它的加入資料取得盒子的信標設定（場地開關、被停用的盒子、房間）和盒子的位置，因此故障轉移後，手機拿到的信標登記表相同；已經在備援控制器上開啟的控制台會立刻移動盒子的標記，不必重新載入。僅軟體，兩種控制器都有；標記移動已在無頭瀏覽器中測試。"
        - "手機控制器跟上 Pi 控制器的安全審查：已簽署模式的撤銷在失敗時安全處理（每個模式有版本下限，離線手機有天數上限，都在「模式套件」畫面設定），工作人員的 ATAK 資料可用 TLS 並釘選憑證機構。已在軟體中測試；尚未在場地的手機上試過。"
    g_ios:
      title: iOS
      items:
        - 專案已在儲存庫中，CI 會在 Mac 上建置，也已在 iPhone 上執行過。
        - 2026-10-26 已在 iPhone 上通過裝置上的檢查清單：12 項自動檢查，加上手動檢查：用相機掃描 QR、以場地海報透過 HTTPS 報到、App 開在畫面上時分享位置、出界警告和震動，以及 atalaia:// 連結。
        - "室內信標：一個建立在 CoreLocation 上的 Swift 外掛，和 Android 使用相同的通道，只需要定位權限，App 開在畫面上時運作。它在 CI 上能編譯；還沒有人在 iPhone 上執行過。"
    next:
      - 用真正的手機和 I/O 模組進行的場地測試（計畫階段 G）正在等硬體。到目前為止，App 已在 Android 模擬器和連上工作台控制器的 iPhone 上執行過，I/O 模組的韌體也只以它自己的程式碼在電腦上跑過。
      - 手機當場地控制器，正在等真正的手機。
      - 在 iOS 上，NFC 需要付費的 Apple 帳號；道具和手機當場地控制器仍只支援 Android。
      - "在 iPhone 上試信標外掛（要在 Mac 上建置），並用真正的信標試，Android 也一樣。"
      - "在 iPhone 上試 iOS 的網站登入（社群登入的瀏覽器與通行金鑰）。"
      - "用真正的手機和 I/O 模組試記分板 QR code、樓層選擇、遊戲歷史和 I/O 模組重新連線。"
      - "在真正的手機上試 App 的登入。"
      - "在場地上和真實手機上試卡片檢查、報到時的位置選項、固定的 CA 以及 App 的註冊帳號。"
    gate: "關卡：一場遊戲混用 ESP32 和 Android 道具，沒有任何問題。"
  p4:
    title: 場地伺服器與進階玩法
    short: >-
      場地伺服器、遊戲排程與報名、自訂劇本、進階模式、ATAK。軟體的每個步驟都已完成；用 Google 和 Microsoft 登入已在測試伺服器上用真正的登入服務試過。還需要一台真正的伺服器、託管模式的上線條件和硬體上的測試。
    done:
      - <strong>進階模式</strong>：主站與衛星、駭客終端、VIP / 護送，以及標靶時窗的邏輯。
      - <strong>自訂劇本</strong>：在場地控制器上的執行環境、YAML 劇本的編譯器、GM 控制台中的編輯器，以及 App 中的任務目標。
      - <strong>ATAK 資料</strong>：盒子和據點顯示在 ATAK 地圖上，在場地上，以及透過場地伺服器提供給不在場地的工作人員。
      - <strong>場地伺服器</strong>：附兩步驟驗證碼的帳號、個人資料權利、控制器同步、測速登記冊、遊戲歷史和劇本庫。
      - <strong>遊戲排程與報名</strong>：附公開場地頁面、行事曆資料訂閱和社團檔案。
      - <strong>託管模式</strong>：在一台伺服器上服務多個場地，彼此隔離，並附它的部署。
    g_modes:
      title: 模式
      items:
        - 主站與衛星：和主站一起被守住的衛星會提高主站的分數；主站易手會讓衛星恢復中立。
        - 駭客終端：按鍵上的一道謎題，破解後會揭露一組密碼或佔領這台終端。
        - VIP / 護送：一隊護送自己的 VIP 或一支有 GPS 的手機到撤離區；檢查點盒子被守住時會得分；位置資料只留在場地控制器和手機上。
        - 標靶時窗的規則：標靶顯示某隊顏色時打中它，就替那一隊得分。標靶擴充模組還沒做出來。
        - 核心中的地理工具：給每個腳本用的距離和區域計算，在每個平台上都完全相同。
    g_scenarios:
      title: 自訂劇本
      items:
        - 執行環境：劇本在場地控制器上執行，告訴內建任務目標套件的盒子要扮演什麼（一個要佔領的點、一組密碼、要掃描的標籤或卡片、一個炸彈點）；盒子回報，劇本計分。
        - 編譯器：一個包含七種任務目標類型的 YAML 劇本，有相依關係、揭露和時間區間，檢查時會標出每個問題的位置並加以說明，再從命令列編譯。
        - 在 GM 控制台中：編輯器會在主辦輸入時列出每個問題，並安裝劇本；盒子加入時會拿到劇本的名稱。
        - 在 App 中：玩家看到給自己的任務目標，附名稱和各自的進度，隱藏的目標要等揭露後才看得到；每個小隊可以有自己的任務鏈，一次只有一個任務目標，完成後才揭露下一個，可以告訴整個小隊或只告訴小隊長。
    g_atak:
      title: ATAK 與場地地圖
      items:
        - ATAK 資料：盒子和據點透過場地 Wi-Fi 顯示在 ATAK 地圖上，用佔領者的顏色標示，只要給場地圖片的兩個角落標上地圖位置就能定位。
        - GM 可以在場地平面圖上標出安全區、各隊的復活點和 HQ、停車場、急救站和任務目標，以圖釘、圓圈或區域呈現，每一個都可以設定給所有人、給某一隊或只給主辦看，顯示在控制台和 ATAK 上。
        - 場地可以從地圖載入：GM 可以從自己所在的位置或用地點名稱找到場地，在 OpenStreetMap 上描出場地的外框，瀏覽器就用 OpenStreetMap 的資料畫出場地圖片，疊在該國的開放空照影像上（葡萄牙本土、西班牙、法國含海外領土、荷蘭、比利時、盧森堡、瑞士、列支敦斯登、德國十一個邦、波蘭與捷克）。外框就是場地邊界，外面的區域會變暗。
        - 玩家離開邊界時，手機會用自己的 GPS 以橫幅和震動提醒，不會傳送任何資料。
        - 玩家位置絕不會給所有人看，只有在場地開啟時才會傳給工作人員的裝置。不在場地的工作人員可以透過場地伺服器拿到同樣的資料，連線經過加密，每台裝置都有一張由場地發出、可以立即撤銷的憑證；位置只會給 GM 或裁判。
        - 控制台中的多樓層場地：每個樓層一張平面圖，每個盒子放在自己的樓層。
        - 還沒用真正的 ATAK 手機試過，也還沒在真正的場地試過。
        - "漸進式佔點讓某個盒子成為目前啟用的盒子時，ATAK 上會標示出來。"
        - "手機當場地控制器時，場地地圖頁面也能用。"
        - "ATAK 會把室內的玩家標在他們的信標位置，並在備註中寫上房間。"
        - "ATAK 裡的網格，以及可列印的網格地圖。"
        - "遠端 GM 在玩家分享位置時看得到他們的位置。"
        - "ATAK 裝置憑證有效 90 天（原本是 7 天），工作人員的 ATAK 頁面會在憑證 14 天內到期時提醒。"
        - "場地可以關閉控制台的地圖取得功能（設定，地圖取得）：關閉後，「從地圖載入場地」不會連到 OpenStreetMap、Overpass、Nominatim 或空拍影像。預設為開啟。"
    g_server:
      title: 場地伺服器、帳號與資料
      items:
        - 它的骨架：資料庫、資料庫遷移和健康檢查，在自己的容器中。
        - 帳號：密碼、主辦和裁判必須使用兩步驟驗證碼、各場地的登入工作階段和角色。
        - 個人資料權利：查閱、匯出、更正、刪除、同意紀錄和每日依保存期限清除。
        - 控制器同步：場地控制器把它們的遊戲、紀錄和分數推送上來，離線優先，重送也安全。還沒用真正的 4G 連線試過。
        - 測速登記冊：經簽署的測速值經過驗證後以簽署原樣保存，只用公鑰，經同意後可在場地之間分享。還沒用真正的測速器試過。
        - "reset-totp：營運者可以重設遺失驗證器的帳號的兩步驟驗證碼。"
        - "場地控制器會為名單上的玩家拉取其他場地的測速紀錄，只有在每位玩家同意時才會拉取。這些紀錄與自己的測速值分開保存，也絕不會被判定。"
        - "控制器從場地伺服器取得場地的設定和品牌，更改會立刻傳到 Pi 和手機控制器。軟體已完成。"
        - "可用 Google、Microsoft 或 Apple 登入，也可用 passkey。密碼是選用的；工作人員仍然需要第二個驗證因素。Google 和 Microsoft 已在測試伺服器（tests.atalaia-project.link）上用真正的登入服務試過；Apple 還沒試。"
        - "工作人員的帳號頁面，每個人在這裡管理自己的登入方式：passkey、連結的帳號、密碼和兩步驟驗證碼。"
        - "情境、預設遊戲和賽程的變更會立刻送到控制器。"
        - "場地保存資料多久是場地的設定：遊戲歷史和測速紀錄各有保存期限，可在控制器、GM 控制台或場地伺服器的工作人員設定頁設定：遊戲歷史預設 90 天（不含玩家 ID 的隊伍成績 365 天），測速紀錄 365 天。每日清除會刪除超過期限的已結束遊戲，而且絕不會在場地伺服器收到全部資料之前刪除。沒有用到的「每個帳號保存期限」欄位已移除。"
        - "在場地控制器上清除某位玩家時，下次同步會自動傳到場地伺服器（絕不含姓名），伺服器也會清除那位玩家的測速紀錄。"
        - "隱私聲明、資料處理協議和跨場地分享條款的範本，有葡萄牙文和英文（協議另有葡萄牙語 pt-PT 版），還有資料保護影響評估的範本：它們寫明維護者的律師在 2026 年 10 月 30 日認可的立場（帳號以契約為基礎、最低年齡 16 歲，報到時檢查會員卡並刪除編號，違規依正當利益處理，位置分享依同意，不設資料保護長）。仍然是各場地自己要填寫的範本，不是針對某個場地的法律意見。"
        - "場地伺服器會發布營運者提供的隱私聲明，以網頁和 API 提供四種語言，聲明版本改變時再次向帳號顯示（帳號以契約為基礎，而不是同意）。不會封鎖任何功能：匯出和清除仍可使用。已在電腦上測試。"
        - "社群帳號在建立後馬上到帳號頁選擇使用者名稱（可略過；只有當事人要求時才使用登入服務提供的名稱）。任何帳號都可以用自己的登入方式改名，同一個人的兩個帳號在當事人證明兩者都是自己的之後可以合併（絕不會併入有工作人員角色的帳號，也不會從那樣的帳號併出）。缺少同意的錯誤會顯示在核取方塊旁。已在電腦上測試；選擇使用者名稱的步驟和合併還沒在測試伺服器上試過。"
        - "社群登入註冊會記錄當事人實際看到的隱私聲明版本：伺服器會拒絕過期的版本，並在建立帳號前再檢查一次。已在電腦上測試。"
        - "每日的保存期限清理也會刪除匿名化的帳號（刪除或合併後留下的），只要不再有任何資料指向它們。已在電腦上測試。"
        - "更改帳號的登入方式需要第二因素：新增、重新命名或移除 passkey、設定或關閉兩步驟驗證碼、更改密碼、連結社群登入和確認合併，除非這個連線已通過 TOTP 或 passkey 的加強驗證，否則一律拒絕（單靠社群登入不算）；合併絕不會把 passkey 帶進工作人員帳號。工作人員帳號頁和 App 會先要求這個加強驗證。已在電腦上測試，還沒用真正的登入服務試過。"
        - "場地伺服器自己的安全審查：限制請求內容大小（超過 1 MiB 回 413，上傳為 4 MiB）；「沒有這個帳號」和被拒絕的授權給出相同回應；場地匯出只含該場地的稽核紀錄；App 查詢場地時遵守公開頁面的開關；必須設定公開網址；社群登入的簽發者與其主體一起儲存；代理伺服器後面的一般 HTTP 請求會被導向 HTTPS；健康檢查只回答 ok。部分是在預覽伺服器上發現的。"
        - "帳號以契約為基礎，而不是同意：註冊時會記錄顯示的是哪個版本的隱私聲明，並附「我已年滿 16 歲」的勾選框（在工作人員頁面和 App 中）；不保存出生日期；沒有發布聲明時，註冊是關閉的。舊的同意已轉成聲明紀錄。已在電腦上測試。"
        - "隱私審查的程式部分：稽核紀錄的網路位址 180 天後刪除（可設定）；24 個月沒使用的帳號會先收到警告，30 天後匿名化；某人的刪除或撤回的測速分享同意會傳到其他場地的控制器，它們會丟棄副本；刪除紀錄以雜湊值存在資料庫之外的紀錄簿，還原後會再套用一次；新的工作人員頁面只把累犯標示為提示（單純的警告絕不計入），禁賽預設 12 個月後結束；遊戲歷史連同玩家 ID 保存 90 天，不含玩家 ID 的隊伍成績保存 365 天。已在電腦上測試。"
        - "場地在分享測速紀錄之前，要先接受跨場地分享條款（由場地管理員在設定頁接受）；版本、日期和帳號都會記錄，條款改版時，分享會暫停，直到重新接受。場地是其玩家資料的控制者，託管中樞的營運者是它的處理者，而共同分享的場地只在這一步是共同控制者。已在電腦上測試。"
        - "維運人員可以用命令列為既有帳號設定密碼（<code>set-password</code>，輸入兩次且不回顯，不會出現在命令列中）：給沒有第二因素、因此無法從網站更改登入方式的工作人員帳號的解法。"
    g_games:
      title: 遊戲、社團與工作人員頁面
      items:
        - 遊戲排程，每個場地有一個公開頁面，並提供它的遊戲的開放 iCalendar 和 JSON 資料訂閱（上面沒有個人資料）。
        - 這些遊戲的報名，可預先登記槍枝並取得報到票券：場地控制器會拉取名單並回報誰到場了。可從 App 報名；可匯入從其他平台匯出的報名名單（CSV 或 JSON）。
        - 社團檔案：名稱、顏色、標誌和隊徽、成員、一個預設關閉、附檢舉按鈕和管理機制的公開頁面。場地的品牌和儲存的隊伍會同步到它的控制器，讓社團的隊徽出現在每個存了它的隊伍的場地。
        - 遊戲歷史：每場遊戲的分數時間軸和事件紀錄；玩家和觀眾看到的進行中遊戲會延遲一分鐘，不含機密或玩家編號。每個場地有公開記分板（預設關閉）。
        - 場地的劇本庫和它的遊戲預設，以場地控制器的方式檢查，並由場地的每一台控制器安裝，包括備援控制器。
        - 給場地工作人員的網頁，有葡萄牙文和英文，手機也能用：以兩步驟驗證碼登入、遊戲歷史、劇本庫（存檔前顯示每個問題、修訂版本和預設）、裝置狀態，以及遠端 GM 的即時畫面和指令。已在無頭瀏覽器中測試，還沒在真正的伺服器上跑過。
        - "控制器會移除場地伺服器已封存或刪除的劇本或預設，除非還有遊戲在用。"
        - "排程的工作人員頁面：列出、建立、編輯、發布和取消遊戲，時間以場地的時區顯示。"
        - "報名的工作人員頁面：誰報了名、更改名稱、隊伍或聯盟編號、撤回報名，以及 CSV 匯出和匯入。"
        - "可列印的比賽日名單頁面，並顯示控制器上次拉取的時間。"
        - "對報名的工作人員操作：已付款或未付款（伺服器不處理付款）、缺席、移到另一場遊戲、恢復、編輯槍枝。已在無頭瀏覽器中測試，還沒在真正的伺服器上跑過。"
        - "給工作人員的頁面：角色、同步金鑰、品牌、社團、平台連結、韌體和管理。"
        - "遠端 GM 頁面即時更新，不必重新載入。"
        - "報名和報到時會檢查協會會員資格：葡萄牙的場地使用 APD，其他國家可用任何協會或聯盟。"
        - "場地設定的工作人員頁面：公開頁面、報到規則、會員資格、計速器分享和國家。"
        - "初速檢測紀錄會顯示複製品超出上限多少，並標出累犯。"
        - "場地人員用的頁面，可匯出場地資料並查看額度用量。"
        - "以遊戲時間計的分數時間軸。"
        - "社團頁面列出社團打球的場地，工作人員頁面也一樣。"
        - "控制器自己就能匯入報名 CSV，不需要場地伺服器。"
        - "名稱含有盒子畫不出的字時，控制台會發出警告：隊伍名稱、遊戲名稱、情境名稱和它的目標名稱。"
        - "報名名單多了協會 ID 和會員資格到期日這兩個選用欄位，報名匯出檔也可以原樣再匯入。"
    g_boxes:
      title: 盒子與場地
      items:
        - 裝置狀態：依控制器傳來的資料，顯示每個盒子的電量、連線和韌體；場地控制器會回報變安靜或重新出現的盒子，以及低電量，有電量計的盒子也會自己回報。還沒在真實開發板上試過。
        - 只列出以受信任金鑰簽署之版本的韌體目錄，以及 Field Box 的無線韌體更新：GM 把經簽署的版本上傳到場地控制器，在兩場遊戲之間更新盒子，絕不在遊戲進行中更新；每個盒子透過場地 Wi-Fi 下載，用自己韌體內建的金鑰檢查簽章，安裝到備用槽位，如果新韌體無法啟動就回到舊韌體。軟體已完成，還沒在真實開發板上試過。
        - 用 NFC 場地卡、控制器的 USB 線或盒子顯示的 6 位數代碼把盒子綁定到場地，透過無線電配對。軟體已完成，還沒在真實開發板上試過。
        - 透過無線電邀請盒子加入下一場遊戲，不需要卡片或 QR code（加入資料以從場地加入金鑰衍生的金鑰加密傳送），而且一場遊戲要等每個角色都有盒子才會開始，除非 GM 選擇「仍然開始」。已在兩塊工作台開發板上搭配場地控制器測試。
        - 每場新遊戲都聽得到的盒子（無線電的 nonce 計數器現在依遊戲分開，這是在工作台上發現的修正），以及跟著遊戲變化（就緒、等待中、中立）並使用場地語言（英文或葡萄牙文）的盒子畫面。已在兩塊工作台開發板上測試。
        - 遊戲中途重新啟動的控制器會接續遊戲；遺失遊戲金鑰的控制器仍會透過場地無線電告訴它的盒子遊戲已結束；管理 PIN 碼輸錯時等待時間會越來越長，而且跨重新啟動累計，真實的盒子上沒有預設 PIN 碼。軟體已完成，還沒在工作台開發板上試過。
        - 遠端 GM：具有 GM 角色、以兩步驟驗證碼登入的主辦，可以看到進行中的遊戲，並開始、暫停、繼續或結束它，或送出訊息或模式指令，連線由場地控制器自己建立，只有在場地開啟時才會連線，每個指令兩端都有紀錄。
        - "控制台的「控制器」分頁列出遠端 GM 的狀態和它收到的每個指令。"
    g_deploy:
      title: 部署與託管模式
      items:
        - 部署：透過 Caddy 提供 HTTPS 和自動憑證、一個會產生所有機密的設定腳本、加密的每日備份，以及還原到全新資料庫。已在電腦上的 Docker 中測試，還沒在有真實網域的真正伺服器上跑過。
        - 託管模式：一台伺服器服務多個場地，每個場地在自己的資料庫結構中、使用自己的位址，底層有資料列層級安全機制，讓任何場地都看不到別的場地的資料，另有營運者用來匯出或刪除某個場地資料的指令。已在 Docker 中對 PostgreSQL 測試。
        - 它的部署：一個會建立中樞資料庫角色的設定腳本、每個場地使用自己的位址和只有啟用中場地名稱才能取得的憑證，以及加密備份還原後每個場地仍彼此隔離。已在 Docker 中測試，還沒在有真實網域的真正託管伺服器上跑過。
        - "託管模式：每個場地有配額、場地管理員可以下載的資料匯出，而且已刪除場地的連線會立刻關閉。"
        - "託管模式：儲存空間額度，以及每個場地各自的自訂網域。"
        - "代管模式：每個場地都有自己的資料庫角色，因此 SQL 注入不能再靠改變列層級安全原本使用的設定，切換到別的場地的資料。需要第二個 SQL 陳述式的一個缺口仍未關閉，並已寫在文件中。已在 Docker 中以 PostgreSQL 測試。"
        - "代管模式：共享測速紀錄的場地，現在也能在同一個樞紐的各場地之間共享，透過需要同意的唯讀檢視；一個人用一次性代碼把自己在兩個場地的帳號連起來，不會用電子郵件或名稱去比對。已在 Docker 中以 PostgreSQL 測試。"
        - "給預覽伺服器的唯讀即時展示：真正的場地控制器搭配三個模擬的 Field Box，不停地玩遊戲，輪流在開放場地和一棟虛構的三層樓建築裡進行（每層一張平面圖、十五個信標、十二位模擬玩家：六位用信標定位、五位用 GPS 並選了樓層、一位不確定），訪客可以看到 GM 控制台、記分板和玩家畫面，什麼都改不了，也沒有個人資料。自 2026 年 10 月 29 日起在 demo.atalaia-project.link 上線；它的玩家畫面以無頭瀏覽器測試。"
        - "託管模式：整個中樞只用一個社群登入回呼（選用）：營運者為每個登入服務註冊一個重新導向位址；中樞簽署狀態、在自己的登記冊中檢查場地，再交給場地自己的回呼。已在 Docker 中測試，還沒用真正的登入服務試過。"
        - "給營運者的上線檢查清單：在任何場地可使用託管模式之前的六個條件（每個場地簽署的資料處理協議、分享條款、附件中且位於歐盟的每個次處理者、填好的隱私聲明、營運者若為自然人要有自己的文件，以及在真正伺服器上的驗證）。"
        - "預覽伺服器（tests.atalaia-project.link）從 10 月 30 日起一直在執行這一切，並有自己的隱私聲明（版本 preview-2026-10-31：帳號以契約為基礎、16 歲以上、沒有資料保護長）。"
        - "預覽伺服器每次啟動與更新都會自行安裝隱私權聲明（某版本的檔案缺少時會停止），線上展示會送出 HSTS，另有一組用完即丟的測試堆疊（代管中樞、假的登入供應商與場地控制器，只在 127.0.0.1）可針對今天的程式碼進行經授權的安全測試。"
    next:
      - 一台有網域的真正伺服器。
      - "託管模式的上線條件（每個場地簽署的資料處理協議、分享條款、填好的聲明），以及各場地填寫自己的聲明和影響評估。維護者的律師已在 2026 年 10 月 30 日認可法律立場；託管模式仍不提供。10 月 30 日的安全、無線電和法律工作，沒有任何一項在真實開發板或手機上試過：它們在軟體和預覽伺服器上執行。"
      - 在硬體上的測試：真實開發板、真正的 ATAK 手機、真正的 4G 連線、真正的測速器。
      - 標靶擴充模組，標靶時窗的規則在等它。
      - "用真正的 Apple 試登入，並在測試伺服器上試選擇使用者名稱的步驟和帳號合併。"
      - "jogarairsoft.pt：維護者在 2026 年 10 月 28 日寫信給他們，提議整合（他們的活動、隊伍和 APD 交給我們；我們的遊戲資料訂閱、場地檔案、公開社團和成績交給他們）。正在等他們回覆；沒有承諾任何事。"
    gate: >-
      關卡：一場週末的<a href="{{ page.to.glossary }}#glossary-milsim">軍事模擬</a>遊戲從頭到尾都在 Atalaia 上進行。
  p5:
    title: 社群
    short: >-
      視覺化模式編輯器、經簽署的模式套件、作為範本的模式登錄庫、德文和繁體中文、組裝指南。軟體的每個步驟都已完成。
    done:
      - <strong>視覺化模式編輯器</strong>：模擬器裡的一個頁面，用積木組出一個模式（隊伍按住按鈕時會發生什麼、計時器、分數、畫面和音效、地圖上的據點、GM 指令、多個角色、GM 可以調整的設定，以及場地控制器跨盒子的邏輯）。它會隨著你的操作寫出模式的 Lua 腳本和清單，有葡萄牙文和英文，而且能離線使用，按一個按鈕就能立刻在模擬器中試玩這個模式。它的三個範例通過和手寫模式相同的測試。
      - <strong>經簽署的模式套件</strong>：一個封存檔，像韌體版本一樣簽署。編輯器能自己產生模式的套件，並顯示模式金鑰會簽署什麼，以及簽署用的指令；簽署仍在作者自己的電腦上離線進行。
      - 場地控制器只用自己信任的金鑰安裝經簽署的模式，並顯示每個模式是誰簽署的、專案是否審閱過。
      - 每次修改都會跑一組沙箱逃脫嘗試測試；已經堵住兩個讓腳本超過時間限制的方法。
      - GM 控制台中的<em>傳送缺少的模式</em>：缺少遊戲模式的盒子會透過場地 Wi-Fi 從場地控制器取得經簽署的套件，只在兩場遊戲之間進行，遊戲會等它；盒子用韌體內建的金鑰檢查並保存套件。已在電腦上測試，還沒在真實的盒子上試過。
      - 在 GM 控制台中用積木組成的劇本：盒子、任務目標和誰看得到它們、什麼時候開放、什麼條件完成以及完成後給什麼，用滑鼠、觸控或鍵盤操作，手機上也能用。場地控制器會像手寫的一樣檢查並安裝它們。
      - <strong>模式登錄庫</strong>，已準備好作為範本：附經簽署模式的 pull request 會自動檢查（它的簽章、原始碼是否就是被簽署的內容、授權條款、在模擬器中的測試），專案審閱過的模式會得到已驗證徽章，也就是專案自己的簽章，有了它模式才能送到盒子上。如何提交模式、審閱檢查清單、金鑰和管理規則都已寫成文件。
      - <strong>德文和繁體中文</strong>（台灣使用的寫法）：本頁、GM 控制台、模式編輯器、App、Field Box 的畫面、內建模式和場地伺服器的頁面。都是 AI 草稿，還沒有經過說這些語言的玩家審閱。
      - >-
        登錄庫的儲存庫已建立（2026 年 10 月 26 日），它的<a href="https://vakaobr.github.io/atalaia-modes/">頁面</a>會列出模式，目前還沒有任何模式。
      - >-
        衛星盒、I/O 模組和標靶擴充模組的文字版<a href="{{ page.to.build }}">組裝指南</a>。目前還沒有任何盒子是依它們組裝的。
      - "給玩家、GM、裁判和 Field Box 操作者的<strong>使用手冊</strong>，有英文和葡萄牙文。"
      - "組裝手冊附每塊板子的腳位表、韌體指南（下載已發佈的版本或自行編譯）和控制器安裝指南，提供英文和葡萄牙文版本。"
      - "模擬器的網頁介面有模式用到的每個輸入：標籤、鍵盤、命中和 GM 指令，還能下載事件紀錄。"
      - "GM 控制台的情境區塊有語言清單，四種語言都有。"
      - "專案的模式金鑰：一把離線保存的根金鑰，以及登錄庫用來簽署「已驗證」標章的金鑰。盒子、App 和控制器預設信任這兩把金鑰。"
      - "韌體指南和組裝手冊說明了使用舊分割表的盒子需要用 USB 燒錄一次，以及設定和金鑰會保留下來。"
      - "安全審查帶來的 CI 與發行強化：每個 action 以提交固定，建置映像以摘要值固定，每個 pip 安裝都來自有雜湊值的檔案，簽署工作在受保護的環境中執行並拒絕不在 main 上的標籤，另外每週更新相依套件。維護者仍須建立受保護的環境並把簽署用的機密移過去（步驟已寫下）。"
      - "Lua 的字串模式和 string.rep 現在在沙箱中計量（惡意的模式曾能讓盒子卡到看門狗重置），略過巢狀 CBOR 資料有深度限制，CBOR 解碼器也有惡意輸入的測試。"
    next:
      - 審閱德文和中文：如果你用德文或中文玩，請幫我們審閱。其他語言的翻譯從 docs/translations（英文）開始。
      - 硬體：載板 PCB（一塊做好的電路板，讓組裝更簡單）在第一批盒子組裝好之後做，還有實際組裝的照片和在場地上產生的社群內容。
    gate: 第一個正式版本發布後持續進行。

build:
  title: 組裝指南
  intro: >-
    Atalaia 的道具是用現成零件圍繞著一塊 ESP32 開發板組裝而成，不需要訂製電路板。這一頁有 Field Box 的腳位表和接線圖，以及衛星盒、I/O
    模組和標靶擴充模組的精簡版指南；完整指南附有每一項檢查和故障排除表，放在程式庫中（英文）。
    要把韌體燒進板子，可以<a href="https://github.com/vakaobr/atalaia-project/releases">下載已發佈的版本</a>或自行編譯：<a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/firmware.md">韌體指南</a>（英文）兩種方式都有說明。場地控制器另有<a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/controller-setup.md">安裝指南</a>（英文）。
  status: >-
    <strong>目前還沒有人照這些指南組裝出盒子，Field Box 也還沒有外殼。</strong>只有一個用散線連接、能玩遊戲的<a href="#field-box-first-build">Field Box 工作台組裝</a>。指南中的腳位會自動和韌體核對，但每一個實體步驟（外殼、電源、續航時間、無線電距離）都還沒測試過，其他盒子的照片要等它們的第一批成品才會有。如果你做了一個，請告訴我們你發現了什麼。
  toc: 本頁內容
  parts: 零件
  pins: 腳位
  pins_intro: >-
    韌體的預設值。不在這張表中的開發板腳位一律不接。
  pin_what: 用途
  pin_gpio: GPIO
  steps: 步驟
  open: 尚未決定
  photo: "照片待補，第一次組裝完成後提供："
  pin:
    btn1: 隊伍按鈕 1（遊戲的第一隊）
    btn2: 隊伍按鈕 2（第二隊）
    btn3: >-
      隊伍按鈕 3，選用（開發板的 UART0 接收線）
    btn4: 隊伍按鈕 4（在按鍵擴充晶片上）
    led: LED 燈環資料線，經過 74AHCT125 電位轉換器
    sda_gauge: I2C SDA，給電量計用（開發板自己的匯流排）
    sda_bus: >-
      I2C SDA，給按鍵擴充晶片、NFC 讀卡機和電量計用（開發板自己的匯流排）
    scl: I2C SCL
    bclk: 擴大器 BCLK（選用）
    lrclk: 擴大器 LRC
    dout: 擴大器 DIN
    tamper: 外殼開關，接 GND
    log: >-
      紀錄輸出（UART0 TX）：只接 3.3&nbsp;V USB 轉序列埠轉接器的 RX，限工作台上使用
    disp_mosi: >-
      螢幕 MOSI（SPI）
    disp_clk: >-
      螢幕時脈（SCK）
    disp_cs: >-
      螢幕晶片選擇（CS；開發板的電池電壓腳位，當作輸出使用）
    disp_dc: >-
      螢幕資料／指令（DC）
    disp_rst: >-
      螢幕 RESET 和背光：兩者都接 3V3 腳位，不用 GPIO
    keypad: >-
      按鍵，經由 PCF8574 擴充晶片（位址 0x20）
  safety:
    title: 安全第一
    intro: 這些規則適用於本頁的每一種組裝，和 Field Box 一樣。
    antenna: >-
      <strong>開發板沒接 LoRa 天線時絕對不要通電</strong>，即使是 USB 供電也不行：對著空的天線接頭發射，可能會燒毀無線電的放大器。先把兩根天線都裝上，而且不要拆下來。
    cell: >-
      <strong>只能串接一顆鋰電池芯</strong>（1S，3.0–4.2&nbsp;V）：使用有保護板的電芯、在電芯附近加保險絲，並加一顆二極體防止電芯裝反。開發板的電池插座和充電器只接受一顆電芯；2S 電池組會把它們燒壞。每次接線前都用電錶確認極性：小型電池插頭沒有統一的極性標準。
    charge: >-
      <strong>充電時要有人看著</strong>，絕不在密閉的盒子裡充電，只在約 0 到 45&nbsp;°C 之間充電；作業時把電芯放在防火袋裡，而且電芯要從盒子裡拿出來。有凹痕、膨脹、發燙或電壓低於 2.5&nbsp;V 的電芯絕對不要用。
    volts: >-
      <strong>只能把 3.3&nbsp;V 訊號</strong>接進開發板：LED 燈環要經過電位轉換器驅動，每個 I2C 模組都必須把訊號線上拉到
      3.3&nbsp;V，絕不能是 5&nbsp;V。
    pins: >-
      <strong>絕對不要接 GPIO 5 或 46</strong>（無線電的前端），<strong>也不要接 GPIO 34 或 38–42</strong>
      （開發板的 GPS 接頭）。
    power_check: >-
      <strong>完成發射功率檢查之前不要開始遊戲</strong>，這是啟用清單中的一項：韌體依據一個還沒實測過的放大器增益，把無線電維持在法定限制內。
    enclosure: >-
      <strong>用塑膠盒，絕不用金屬盒</strong>（無線電訊號要出得去），要防水，顏色鮮豔，貼上「GAME PROP」標籤，而且不能有任何看起來像爆裂物的東西。
    hits: >-
      <strong>BB 彈和漆彈會打到它。</strong>電芯和開發板要遠離外殼壁、避開射擊線，手機螢幕要放在透明聚碳酸酯板後面（絕不能用玻璃），除非它本身就是標靶，否則絕不要把盒子放在玩家必須朝它射擊的位置。
  field_box:
    title: Field Box
    text: >-
      主要的道具，有隊伍按鈕、按鍵、彩色螢幕、LED 燈環、NFC 讀卡機和喇叭。它的
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">組裝手冊</a>（英文）包含零件、接線圖、電源與電池安全、第一次燒錄和故障排除；下面的指南凡是共通的步驟都參照它。
    pins_shared: >-
      GPIO 1、35 和 44 是 Field Box 刻意共用的開發板腳位，各自只用於這一個用途：1 是開發板的電池電壓輸入（電量計改由 I2C 讀取電池），35 是它的白色 LED（會隨燈環微微閃爍），44 是 UART0 的接收線（USB 主控台不受影響）。
    bench:
      title: 第一個工作台組裝
      intro: >-
        Field Box 現在不只存在於紙上，但目前只是工作台上的組裝：第一塊能玩完整場遊戲的開發板，螢幕、按鈕和按鍵都用散線連接，還沒有外殼。它不是成品，也不是照指南組裝出來的盒子。
      photo_alt: >-
        工作台組裝的照片：一塊 Heltec V4 開發板和它的小 OLED 螢幕，用許多彩色線連到一個顯示「READY」和「Next game」的 2.8 吋 TFT 螢幕、一個 12 鍵（4×3）薄膜按鍵，以及四個綠色、藍色和黑色按鍵帽的按鈕。一切都散放在桌上，後面是一個電腦鍵盤。
      photo_caption: >-
        工作台上的第一個 Field Box，2026 年 10 月 31 日：一塊 Heltec V4 開發板、2.8 吋 TFT（ILI9341）、開發板自己的 OLED、4×3 按鍵和隊伍按鈕，用散線連接，沒有外殼。它是第一塊玩了遊戲的開發板，是工作台上的組裝，不是完成的盒子。
      video_alt: >-
        同一個工作台組裝玩佔點模式的無聲循環影片。螢幕顯示紅隊佔領的區域，有 3 分；幾秒後區域換成藍隊，螢幕和 OLED 從紅色變成藍色。
      video_caption: >-
        同一個組裝用工作台上的控制器玩佔點模式（2026 年 10 月 31 日）：區域從紅隊換成藍隊。九秒循環，沒有聲音；螢幕上是葡萄牙語。
    wiring:
      title: >-
        接線圖
      intro: >-
        兩張圖，由程式庫中的 WireViz 檔案產生：一張是訊號和 3.3 V 邏輯電源，一張是電池、開關和 5 V 電源線。開發板的腳位只用 GPIO 編號稱呼：請依接頭旁印的編號找到每一支腳位。標示（腳位、電線、零件名稱）在所有語言中都維持英文，和程式庫一致；如果文字和圖不一致，以圖為準。
      open: >-
        開啟完整尺寸的接線圖（SVG）
      hint: >-
        這張圖很寬：點一下就能以完整尺寸開啟，可以縮放和平移。深色主題下也放在白色底板上，讓電線顏色保持真實。
      signals:
        alt: >-
          接線圖 1／2，訊號和 3.3 V 電源：主開發板的 GPIO 腳位經由轉接板，接到螢幕、隊伍按鈕、按鍵和它的 PCF8574 擴充晶片、NFC 讀卡機、電量計、擴大器和喇叭、LED 燈環，以及天線。
        caption: >-
          接線圖 1／2：訊號和 3.3 V 邏輯電源。
      power:
        alt: >-
          接線圖 2／2，電池和 5 V 電源：電池芯、保險絲、總開關、防反接二極體和接線端子，供電給主開發板的電池插座，並經由升壓轉換器供應 LED 燈環、擴大器和轉接板的 5 V 電源線。
        caption: >-
          接線圖 2／2：電池、總開關和 5 V 電源線。
  satellite:
    title: 衛星盒
    what: >-
      用在次要據點或信標的小盒子：Field Box 的開發板加上兩個大的隊伍按鈕（可以再加第三個）、一個顯示佔領隊伍的
      LED 燈環、開發板自己的小螢幕，以及一顆 18650 電芯。零件約 <span class="nowrap">30–40 歐元</span>（設計時的估計）。它執行的是 <strong>Field Box 自己的韌體</strong>，只是裝的零件比較少：韌體在開機時會把每個缺少的零件回報一次，然後繼續運作。
    plays: >-
      沒有按鍵，它沒辦法自己選遊戲：它玩的是<a href="{{ page.to.glossary }}#glossary-field-controller">場地控制器</a>
      邀請它加入的遊戲，當作<a href="{{ page.to.modes }}#master-satellites">主站與衛星</a>的衛星或主站，或當作任何只需要隊伍按鈕的模式（佔點、全佔點、最後一人）的據點。它透過 USB 線或小螢幕上的配對代碼加入場地（它沒有可以讀場地卡的 NFC 讀卡機）。
    parts:
      board: >-
        Heltec WiFi LoRa 32 V4 開發板，V4.2 或 V4.3 版，863–928&nbsp;MHz，不含外殼。
      antennas: >-
        一根 2&nbsp;dBi 以下的 868&nbsp;MHz 天線（開發板套件附的那根），以及一根 2.4&nbsp;GHz 天線，這是必要的：第一次設定、下載模式和韌體更新都要用 Wi-Fi。
      buttons: >-
        兩個（或三個）附 5&nbsp;V LED 的 60&nbsp;mm 大型街機按鈕。
      ring: >-
        一個 WS2812B LED 燈環（預設 24 顆 LED；改一個韌體設定就能用 12 或 16 顆），搭配 74AHCT125 電位轉換器、一顆 330&nbsp;Ω 電阻和一顆 1000&nbsp;µF 電容，焊在一小塊洞洞板上。
      gauge: >-
        建議加一顆 MAX17048 電量計：沒有它，盒子永遠不知道自己的電量。
      power: >-
        一顆裝在電池座裡、有保護板的 18650 電芯（或一組附保護板的 1S 電池組）、一個 5&nbsp;A 保險絲、一顆蕭特基二極體、一個有護蓋的主開關、一個給燈環用的 5&nbsp;V 升壓模組，以及快速接線端子：也就是只用一顆電芯的 Field Box 電源線路。
      sound: >-
        聲音是選用的：Field Box 的 MAX98357A 擴大器和一個小喇叭。
      box: >-
        一個顏色鮮豔的 IP65 塑膠盒，有透氣孔和電纜固定頭，貼上「GAME PROP」標籤。
    free_pins: >-
      韌體仍然會驅動 Field Box 的螢幕腳位（GPIO 1、3、33 和 47）：這些腳位不要接。
    diagram_ref: >-
      它的接線是 Field Box 的子集：照著 <a href="#field-box-wiring">Field Box 的接線圖</a>接，省略這個版本沒有的零件（彩色螢幕、按鍵和 NFC 讀卡機）。它自己的接線圖還沒有畫。
    steps:
      revision: >-
        看開發板 LoRa 天線接頭旁邊的晶片：KCT8103L 是 V4.3（韌體的預設值），GC1109 是 V4.2。在開發板第一次通電之前，就把兩根天線裝好並貼上標籤。
      enclosure: >-
        先在紙上規劃盒子，在放進任何電子零件之前把所有孔都鑽好：按鈕和燈環在蓋子上，開關要內嵌或加蓋，透氣孔開在下方。
      power: >-
        先在不接開發板的情況下做好電源線路：電芯、保險絲、二極體、開關、接線端子；在接上任何東西之前，先單獨把升壓模組調到 5.0–5.2&nbsp;V。
      hub: >-
        做那塊小小的轉接板：3V3、GND 和 5V 電源軌（以及給電量計用的 SDA 和 SCL）和電位轉換器，照 Field Box 手冊的做法。
      wiring: >-
        依照上面的腳位，接好按鈕（按下時接 GND）、經電位轉換器的燈環、電量計，以及選用的擴大器。
      check: >-
        拔掉電芯，用電錶檢查：電源軌之間沒有短路，每個按鈕只在按下時導通，以及開發板電池線的極性。
      flash: >-
        依照 Field Box 手冊的說明建置並燒錄 Field Box 韌體，設定成你的開發板版本和燈環的 LED 數量。
      bring_up: >-
        執行適用於衛星盒的啟用步驟：開機、按鈕、LED、電池，以及在任何遊戲之前檢查無線電和它的發射功率。
      field: >-
        用手機在它的 Wi-Fi 設定頁面設定名稱、地區和管理 PIN 碼，透過 USB 線或配對代碼把它綁定到你的場地，再從 GM 控制台邀請它加入遊戲。
    photo: 完成的衛星盒，內部和外觀。
    open:
      buzzer: >-
        <strong>原始設計中的壓電蜂鳴器</strong>：韌體只透過擴大器發出聲音，所以蜂鳴器需要修改韌體。
      enclosure: >-
        <strong>外殼</strong>：還沒選定盒子。
      runtime: >-
        <strong>一顆電芯的續航時間</strong>：還沒量測。
      diagram: >-
        <strong>專屬的接線圖</strong>：目前 Field Box 的接線圖已經涵蓋衛星盒的每一條線。
    full: >-
      完整指南：
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/satellite/BUILD.md">衛星盒組裝指南</a>（英文）。
  pod:
    title: I/O 模組
    what: >-
      這個盒子把手機缺少的東西借給 <a href="{{ page.to.glossary }}#glossary-android-prop">Android 道具</a>：大的隊伍按鈕、按鍵、LED 燈環、聲音、NFC 讀卡機、一個偵測盒子被打開的開關，以及 LoRa 無線電。手機執行遊戲模式；
      I/O 模組透過 USB 線或藍牙，當它的手和它的無線電。它就是沒有彩色螢幕的 Field Box 硬體，執行 I/O 模組韌體，這個韌體已在電腦上測試過，但還沒在開發板上跑過。零件約 <span class="nowrap">35 歐元</span>（設計時的估計）。
    lends: >-
      除了開發板以外，每個零件都是選用的：I/O 模組會告訴手機自己有什麼，手機就只用那些。和 Field Box 一樣，按鈕 1 是遊戲的第一隊。外殼被打開時，GM 控制台會收到防拆警報。
    parts:
      same: >-
        Field Box 的零件，少了螢幕：開發板、按鈕（最多四個）、按鍵和它的 PCF8574 擴充晶片、附電位轉換器的 LED 燈環、
        PN532 NFC 讀卡機、擴大器和喇叭、電量計，以及同樣只用一顆電芯的電源線路。
      antennas: >-
        兩根天線：LoRa，以及給藍牙用的 2.4&nbsp;GHz。
      switch: >-
        一個由蓋子蓋上時壓住的微動開關：也就是外殼開關。
      usb: >-
        一個面板式 USB-C 插座，要有資料線（不能只能充電），接手機的線用；以及一條給手機用的 USB-C OTG 線。
      uart: >-
        只在工作台上用：一個 3.3&nbsp;V USB 轉序列埠轉接器，用來讀 I/O 模組的紀錄。
    free_pins: >-
      I/O 模組不使用 Field Box 其他的螢幕腳位（GPIO 1、3 和 33）：這些腳位不要接。
    diagram_ref: >-
      I/O 模組的接線就是沒有螢幕的 Field Box：照著 <a href="#field-box-wiring">Field Box 的接線圖</a>接，省略螢幕和它的線。它自己的接線圖還沒有畫。
    steps:
      like_box: >-
        把它當成沒有螢幕的 Field Box 來組裝：開發板版本、天線、外殼、電源線路、轉接板，再加上你要裝的按鍵、燈環、
        NFC 讀卡機、按鈕和擴大器，每一項都照手冊做檢查。
      switch: >-
        把微動開關裝在蓋子蓋上時會壓到的位置，從 GPIO 47 接到 GND。I/O 模組要先讀到一次「關閉」之後才會開始監看它，所以沒裝開關的 I/O 模組永遠不會發出警報。
      flash: >-
        建置 I/O 模組韌體（<code>python tools/docker_fw.py pod</code>），並從 <code>build-pod</code> 資料夾燒錄，做法和 Field Box 一樣。
      log: >-
        用 USB 轉序列埠轉接器從 GPIO 43 讀它的紀錄：USB-C 埠負責 I/O 模組和手機之間的連線，不輸出紀錄。
      link: >-
        在 App 中先用 USB-C OTG 線連結它，再用藍牙連結（Android 會要求配對一次）。
      bring_up: >-
        執行 I/O 模組的啟用檢查，包括在任何遊戲之前檢查無線電的發射功率。
    photo: 完成的 I/O 模組，附外殼開關，以及和它連結的手機。
    open:
      siren: >-
        <strong>獨立的警報器或閃光燈</strong>：I/O 模組的聲音來自它的擴大器；開關其他負載不在它的韌體功能中。
      phone_power: >-
        <strong>由手機供電</strong>：接上線時，手機會供電給 I/O 模組，也可能替它的電芯充電。是否應該這樣、手機能提供多少電，要在第一次組裝時確認。
      enclosure: >-
        <strong>外殼</strong>，以及手機和 I/O 模組要怎麼一起攜帶。
      settings: >-
        <strong>從手機調整設定</strong>：按鈕顏色、LED 數量和其他設定，目前都在建置韌體時設定。
    full: >-
      完整指南：
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/io-pod/BUILD.md">I/O 模組組裝指南</a>（英文），以及<a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md">啟用清單</a>
      中搭配手機的 I/O 模組檢查。
  target:
    title: 標靶擴充模組
    status: >-
      還不能組裝：盒子這一端的接頭已經決定，擴充模組本身還沒有。不要照這一頁把靶板接到盒子上。
    what: >-
      一塊讓玩家射擊的靶板，有一個感應每次命中的感測器。它插到盒子上，就能把盒子變成
      <a href="{{ page.to.modes }}#target-windows">標靶時窗</a>的計分標靶；標靶時窗的規則已完成並在模擬器中測試過。時窗由盒子自己的燈環顯示。
    decided_title: 已經決定的
    decided:
      parts: >-
        一塊鋼板或聚碳酸酯板、一個壓電感測器，以及一顆自己的小處理器（RP2040 或 ATtiny 等級）用來偵測命中。零件約 <span class="nowrap">20–30 歐元</span>（設計時的估計）。
      port: >-
        它插在盒子上一個防水的 5 針 M12 接頭，這個接頭只帶 3.3&nbsp;V：開發板的 3.3&nbsp;V、接地和兩條 I2C 線；沒有 5&nbsp;V，第五針不接。線長最多 2&nbsp;m。它的處理器會告訴盒子自己是什麼，所以盒子不需要為每種擴充模組加新的驅動程式。
      power: >-
        它最多只能從盒子取用 25&nbsp;mA，中間經過一個可自恢復保險絲：夠處理器和感測器用，但不夠點燈。標靶時窗點亮的是盒子自己的 LED 燈環；擴充模組如果要有自己的燈，就需要自己的電池。
      polling: >-
        沒有中斷線：盒子每 20&nbsp;ms 透過 I2C 讀取一次擴充模組，大約占匯流排的 3%，所以命中最多約 21&nbsp;ms
        就會傳到遊戲。盒子的腳位都不用改。盒子的韌體已經有這個讀取功能，也測試過，正等著擴充模組。
      capability: >-
        遊戲腳本會看到每次命中和它的力道（0 到 255），也可以啟動和解除標靶。手機的 I/O 模組也定義了同樣的功能。
      mode: >-
        標靶時窗會讓標靶亮起隨機一隊的顏色幾秒鐘；在這段時間內力道夠強的命中，就替那一隊得分。
      next: >-
        接下來是擴充模組自己的韌體、讓盒子實際讀取這個接頭，以及在真正的鋼板和聚碳酸酯板上調校感測器；之後標靶時窗就會成為盒子提供的模式。
    open:
      mcu: 處理器（RP2040 或 ATtiny，耗電在 25&nbsp;mA 以內）和它的韌體。
      protocol: >-
        擴充模組的 I2C 位址，以及它如何說明自己是什麼；回報命中的方式已有草案，會在第一個擴充模組完成時定案。
      checks: >-
        第一次組裝時要檢查的事：接上 2&nbsp;m 線材後匯流排的上拉電阻、保險絲，以及接頭防靜電和防水的保護。
      sensor: 感測器電路和它的安裝方式，以及靶板、靶架和角度。
    safety_title: 等到真的有東西可以做的時候，安全事項
    safety:
      eyes: >-
        <strong>護目鏡和面罩</strong>：有人朝它射擊時，射程內的每個人都要戴，在工作台上也一樣。
      ricochet: >-
        <strong>BB 彈打到硬靶板會反彈</strong>，有些會彈回來：鋼板要斜放，讓 BB 彈往地面彈，絕不能正面對著射手。
      shield: >-
        <strong>只有靶板是標靶</strong>：絕不要射盒子、線材或接頭，電子零件要放在靶板後面或它們自己的外殼裡。
      limits: >-
        射擊標靶和射擊玩家一樣，都要遵守<strong>場地的能量限制</strong>。
    photo: 完成的標靶：靶板和感測器，以及盒子上的接頭。
    full: >-
      已經決定的事項，以及每個決定背後的文件：
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/target-addon/BUILD.md">標靶擴充模組指南</a>（英文）。

hub:
  title: 社群中心
  intro: >-
    場地、隊伍和創客會在這裡聚集。一切都採自願加入：社群中心只保存大家自己選擇公開的內容，遊戲資料則留在每個場地自己的伺服器上。
  open: 已開放
  planned: 規劃中
  later: 之後
  discussion:
    title: 討論區
    text: 問題、點子、設計審閱和活動心得。
    link: 前往 Discussions
  gallery:
    title: 組裝作品集
    text: >-
      每個作品的照片、材料清單、外殼檔案和接線筆記，從第一批 Field Box 原型開始。
  directory:
    title: 場地與隊伍名錄
    text: >-
      自願加入的名單，列出使用 Atalaia 的場地和隊伍，附地區、場地類型和聯絡連結。
  browser:
    title: 模式與劇本瀏覽
    text: >-
      <a href="https://vakaobr.github.io/atalaia-modes/">模式登錄庫</a>已經上線，目前還沒有模式：來分享第一個吧。附說明和社群評分的瀏覽頁之後才會有。
  stats:
    title: 使用統計
    text: 自願加入的匿名統計，記錄版本、平台和玩過的模式總數。預設關閉。
  hosting:
    title: 託管的場地伺服器
    text: 給沒有 IT 支援的社團，只收成本價，每個社團的資料彼此分開，而且可以匯出。

# Each entry: id (the anchor, stable ASCII, the same as English's), term (as shown) and text
# (1-3 sentences).
glossary:
  id: glossary
  title: 名詞解釋
  intro: >-
    用簡單的話解釋這些頁面上的技術名詞。每一頁內文中的連結都會連到這裡。
  groups:
    game: 遊戲
    hardware: 硬體
    radio: 無線電與連線
    software: 軟體
    licences: 授權條款
  props:
    id: glossary-props
    term: 道具
    text: >-
      遊戲中的電子裝置：要佔領的盒子、要啟動和拆除的炸彈、要駭入的終端機、要射擊的標靶。在 Atalaia
      中，任何裝置都可以當道具：專門製作的盒子、一支手機或一塊小開發板。
  field_box:
    id: glossary-field-box
    term: Field Box 與衛星盒
    text: >-
      Atalaia 自己設計的道具，用現成零件圍繞著 ESP32 組裝而成。Field Box 是主要的那一個，在防水外殼裡有大的街機按鈕、按鍵、螢幕、燈、喇叭和 NFC 讀卡機，零件約 <span class="nowrap">70–110 歐元</span>；衛星盒是用在次要據點的小盒子，約 <span class="nowrap">30–40 歐元</span>。Field Box 的韌體和組裝手冊已經完成；第一個工作台組裝（散線、沒有外殼）已經能玩（第&nbsp;1 階段）。
  milsim:
    id: glossary-milsim
    term: Milsim
    text: >-
      military simulation（軍事模擬）的簡稱：時間很長的遊戲，常常持續整個週末，有任務、指揮體系和擬真的規則。這是對 Atalaia 最大的考驗：10 到 20 個盒子和衛星盒散布在一大片區域。
  cqb:
    id: glossary-cqb
    term: CQB
    text: >-
      近距離戰鬥（close-quarters battle）：在房屋、豪宅、倉庫和其他狹窄空間裡進行的遊戲，範圍通常不到約 150 m。一切都近而快，所以 Atalaia 的 CQB 設定檔使用較短的佔領和炸彈時間，並把盒子放在平面圖上，而不是使用 GPS。
  chrono:
    id: glossary-chrono
    term: 測速與焦耳
    text: >-
      測速器（chronograph）量測槍枝射出 BB 彈的速度。由速度和 BB 彈的重量可以算出以焦耳計的能量，場地會依槍枝類型設定上限：
      0.20&nbsp;g 的 BB 彈以 100&nbsp;m/s（約 328&nbsp;fps）飛行，帶有 1 焦耳的能量。Atalaia 保存每把槍經裁判簽署的測速值，讓裁判可以在當天進行抽查（軟體已完成，還沒在場地上使用過）；任何處罰都一定由人來決定。
  microcontroller:
    id: glossary-microcontroller
    term: 微控制器
    text: >-
      一顆晶片上的完整小電腦，專門用來執行一個程式。它一下子就能啟動、非常省電又便宜，所以通常是電子道具的大腦。
      ESP32 和 Arduino 開發板都是微控制器開發板。
  esp32:
    id: glossary-esp32
    term: ESP32
    text: >-
      一種很受歡迎、便宜、內建 Wi-Fi 和藍牙的微控制器；很多開發板還附有 LoRa 無線電。它是 Field Box、衛星盒和 I/O
      模組的大腦，用電池應該能讓道具運作一到三天（這是估計值，還沒實測）。大家手邊已經有的開發板也能加入，即使沒有額外記憶體（PSRAM）也可以，只是有一些限制。
  arduino:
    id: glossary-arduino
    term: Arduino 等級開發板、精簡節點
    text: >-
      簡單、非常便宜的 Arduino 風格微控制器開發板，例如使用 AVR 或 RP2040 晶片的板子。它們太小，跑不了遊戲模式，所以在 Atalaia 中當作精簡節點：把自己的按鈕、燈或感測器借給附近的盒子或場地控制器，由它們替精簡節點執行規則。
  raspberry_pi:
    id: glossary-raspberry-pi
    term: Raspberry Pi
    text: >-
      一台大約信用卡大小、執行 Linux 的便宜小電腦。加上一塊 LoRa 無線電板之後，它將會是常用的場地控制器（整套約 <span class="nowrap">80–150 歐元</span>），也能執行需要大螢幕或攝影機的道具。
  android:
    id: glossary-android-prop
    term: Android 道具與 I/O 模組
    text: >-
      Atalaia App 能把一支 Android 手機或平板（全新的，或 2017 年以後的備用機）變成在螢幕上執行任何遊戲模式的道具。手機沒有 LoRa 無線電，戴著手套也很難操作觸控螢幕，所以一個小小的 ESP32 盒子，也就是 I/O（輸入／輸出）模組，會透過線材或藍牙連接，補上無線電、大按鈕、燈和警報器。兩者都已在軟體中完成（第&nbsp;3 階段），並在模擬器和電腦上測試過，還沒在真正的手機或 I/O 模組上跑過。
  firmware:
    id: glossary-firmware
    term: 韌體與燒錄
    text: >-
      韌體是內建在裝置裡、一開機就會啟動的程式。燒錄就是把新版本寫進裝置，通常透過 USB 線。Atalaia 的盒子用線材燒錄，目前新的遊戲模式要隨著重新燒錄一起進來；之後模式會以腳本的形式送達。韌體更新現在由場地控制器透過 Wi-Fi 提供（軟體已完成，還沒在真實開發板上試過），如果新版本無法啟動，會自動退回舊版。
  lora:
    id: glossary-lora
    term: LoRa
    text: >-
      <em>long range</em>（長距離）的簡稱：一種只用很少電力就能把小訊息傳得很遠的無線電，不需要 SIM 卡、行動網路訊號或月租。在一般的場地上，它應該能傳到大約 <span class="nowrap">0.5–2&nbsp;km</span>（設計時的估計，還需要實測），穿透厚牆的能力也比 Wi-Fi 好。代價是：訊息必須很短，而且每個裝置只能在一小部分時間內發射。Atalaia 預設使用
      869.525&nbsp;MHz，位於 EU868 中唯一允許 10% 工作週期（duty cycle）和 500&nbsp;mW 的子頻段，讓每個盒子每小時最多有
      6 分鐘的發射時間，足夠傳送事件、分數和時間同步信標，還綽綽有餘。場地可以選擇其他頻道，那些頻道只允許 1%
      以下的時間和 25&nbsp;mW。盒子只傳送有變化的內容，例如「紅隊佔領了 B」。
  mesh:
    id: glossary-mesh
    term: 網狀網路
    text: >-
      一種裝置之間互相轉傳訊息的網路，所以離基地太遠的盒子，可以透過中間的盒子被聽到。Atalaia 每則訊息只重複轉傳一兩次，讓無線電不會塞車，主辦也可以在地形困難的地方多放幾個盒子當中繼。
  skirmesh:
    id: glossary-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      Atalaia 自己的無線電協定：盒子、控制器和 App 之間透過 LoRa、Wi-Fi 或藍牙交換訊息時約定好的格式。它的文件是公開的，所以任何人都能做出可以加入的裝置；每則訊息都用這場遊戲專屬的金鑰加密並簽署，所以帶著無線電的玩家沒辦法隨便偽造佔領。它已在軟體中完成並測試，還沒在場地上用過。
  links:
    id: glossary-wifi-ble-nfc-qr
    term: Wi-Fi、BLE、NFC 與 QR code
    text: >-
      日常的短距離連線，各有各的用途。Wi-Fi（約 <span class="nowrap">50–150&nbsp;m</span>）負責傳送大量資料：主辦的控制台、玩家 App、新模式和更新；BLE，也就是低功耗藍牙（<span class="nowrap">10–30&nbsp;m</span>），把手機連到它的 I/O
      模組並讓裝置配對。NFC 是一碰就讀，像感應式卡片一樣，用在隊伍標籤、手環和加入卡；QR code 則用手機相機掃描，來加入遊戲或輸入代碼。
  api:
    id: glossary-api
    term: "API：MQTT、REST 與 WebSocket"
    text: >-
      API 是一種有文件說明的方式，讓其他程式可以讀取遊戲狀態，並在獲得許可後控制遊戲。有了它，社團就能驅動大型 LED 記分板、直播上的即時分數疊加畫面、Discord 或 Telegram 通知，或是一個在炸彈爆炸時觸發煙霧和警報器的繼電器。MQTT、REST
      和 WebSocket 是三種標準的接入方式，所以一般的工具都能和它搭配。場地控制器從第&nbsp;2 階段起就有 API，附一個現成的記分板頁面；已在電腦上測試過，還沒在場地上用過。
  atak:
    id: glossary-atak
    term: ATAK
    text: >-
      Android Team Awareness Kit：為軍方製作的地圖 App，有免費的民用版本，很多 milsim 隊伍用它在共享地圖上看到隊友的位置。
      Atalaia 的場地控制器將能把盒子顯示在這些地圖上，以及每個盒子由哪一隊佔領（第&nbsp;4 階段）。
  local_first:
    id: glossary-local-first
    term: 在地優先
    text: >-
      遊戲需要的一切都在場地本身運作，在盒子和場地控制器上，所以完全沒有網路或行動訊號也能玩。有網路的時候，它只是加上額外功能，例如帳號和遊戲歷史。失去聯繫的盒子會繼續運作和計分，連線恢復後再補上進度。
  core:
    id: glossary-core
    term: 共用核心（C11）
    text: >-
      Atalaia 的心臟：一個用 C 程式語言（2011 年的版本，所以叫 C11）寫成的程式，每一個執行遊戲模式的裝置都使用它。它處理事件、分數和無線電訊息，並安全地執行遊戲模式；每種硬體只要加上一層薄薄的驅動程式，操作它的按鈕、螢幕和無線電。它現在已經存在。
  lua:
    id: glossary-lua
    term: Lua 與遊戲模式腳本
    text: >-
      遊戲模式就是一個腳本：一個寫著規則的簡短文字檔，例如「按住 5 秒佔領」，用 Lua 寫成，這是一種在電玩 mod
      圈很有名的小型程式語言。腳本在沙箱中執行，也就是一個封閉的空間，不能存取檔案或網路，所以分享出去的模式傷害不了裝置。主辦永遠不需要碰 Lua：他們只要選一個模式、填好設定，第&nbsp;5 階段還會有一個用積木操作的視覺化編輯器。
  simulator:
    id: glossary-simulator
    term: 模擬器
    text: >-
      一個在你的網頁瀏覽器中用虛擬盒子玩遊戲模式的程式：你在螢幕上按隊伍按鈕，看每個盒子的畫面和事件紀錄。它在一般電腦上就能執行，現在就有，所以任何人在硬體做出來之前就能試玩佔點和炸彈模式。
  controller:
    id: glossary-field-controller
    term: 場地控制器
    text: >-
      一場遊戲的基地台：一台小電腦，通常是 Raspberry Pi 或 Android 裝置，透過無線電聽取每個盒子，執行跨多個盒子的規則，保存正式分數，並把主辦的控制台提供給他們的手機。如果它故障了，盒子會繼續運作，由另一台有能力的裝置接手；單一盒子也能在沒有它的情況下進行遊戲。它已經完成（第&nbsp;2 階段），並在電腦上測試過，還沒在場地上用過；在 Android 裝置上執行還在開發中。
  server:
    id: glossary-site-server
    term: 場地伺服器
    text: >-
      一台選用的電腦，放在場地或在網路上租用，保存超過一場遊戲的資料：玩家帳號、遊戲歷史、測速登記冊，以及玩家 App
      背後的服務。遊戲永遠不必等它。它在第 4 階段推出，社群中心也規劃為沒有 IT 支援的社團提供成本價的託管伺服器。
  open_source:
    id: glossary-open-source
    term: 開放原始碼與自由軟體
    text: >-
      原始碼，也就是人看得懂的程式配方，是公開的，任何人都可以使用、研究、修改和分享，商業用途也可以。這裡的「自由」指的是自由，不是免費：場地可以收入場費，創客也可以販售盒子。
  copyleft:
    id: glossary-copyleft
    term: "Copyleft：GPL 與 AGPL"
    text: >-
      讓 Atalaia 保持開放的規則：照原樣使用它，你不需要做任何事；但要散布修改過的版本，就必須以同樣的授權條款分享它的原始碼。
      GPL 用於核心、韌體、App 和模式，在你提供或販售副本時適用；AGPL 用於場地控制器和場地伺服器，在你透過網路為他人執行修改過的版本時也適用。硬體設計（CERN-OHL-S）和文件（CC BY-SA）也是一樣的道理。

involved:
  title: 參與我們
  intro: "Atalaia 由玩家、場主和創客一起打造。你今天就能幫忙："
  review: >-
    審閱<a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">設計規格</a>（英文）並
    <a href="https://github.com/vakaobr/atalaia-project/issues">提出 issue</a>；
  propose: >-
    用<a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">遊戲模式點子範本</a>提出遊戲模式；
  share: 分享你們場地的玩法，讓預設值符合真實的遊戲；
  code: >-
    寫程式：從 <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>
    （英文）開始。
  rules: >-
    每一個 commit 都要有 <code>Signed-off-by</code> 這一行，而且專案嚴格採用無塵室方式從頭撰寫：不使用任何商業產品的程式碼、韌體、手冊、音效或圖片。

name:
  title: 名字的由來
  badge_alt: >-
    Atalaia 徽章：沙丘上的三座瞭望塔，塔頂的烽火以一道弧線相連，下方是 ATALAIA 字樣。
  word: >-
    <em>atalaia</em> 就是瞭望塔：在山丘或海岸邊的哨站。這個字從阿拉伯文的 <em>aṭ-ṭalāʾiʿ</em>（「斥候」）傳入葡萄牙文，
    <em>estar de atalaia</em> 至今仍是「保持警戒」的意思。
  fit: >-
    場地控制器看得到場地上的每一個道具，一有變化就立刻告訴 GM。瞭望塔也是在地優先的，而且運作著最早的低頻寬網狀網路：白天放煙、夜晚點火，從一座塔傳到另一座塔。Skirmesh-RF 用 LoRa 依循同樣的規則。

safety:
  title: 場地安全
  text: >-
    Atalaia 的道具是遊戲器材。要讓它們看起來就是遊戲道具：顏色鮮豔、清楚的「GAME PROP」標籤，而且沒有任何像真正爆裂物的東西。用貼上標籤的箱子運送，絕不要在場地外無人看管，並小心對待鋰電池。

footer:
  licences: >-
    Atalaia 是自由軟體：核心、韌體、App 和模式採用 GPL-3.0-or-later；場地控制器和場地伺服器採用 AGPL-3.0-or-later；硬體採用 CERN-OHL-S-2.0；文件和本頁採用 CC BY-SA 4.0。
  flags: >-
    語言旗幟：Twemoji Country Flags，圖案出自 Twemoji（Twitter, Inc 與貢獻者），CC BY 4.0，已精簡為四面旗幟。
  flags_licence: CC BY 4.0
  licensing: 授權說明
  manuals: 給玩家、主辦、裁判和盒子操作員的使用手冊（英文與葡萄牙文）
  independent: >-
    獨立、由社群經營；與任何商業道具製造商都沒有關係。本頁不設定 cookie，也不從其他網站載入任何東西。
  privacy: 隱私權聲明（草稿）
  privacy_note: >-
    場地伺服器向玩家顯示的聲明。這是給營運者的範本：它寫明維護者的律師在 2026 年 10 月 30 日認可的法律立場，但文字本身仍是草稿（英文與葡萄牙文），尚未經法律專業人士審閱，各場地必須自行核對並採用為自己的聲明。
  privacy_href: https://github.com/vakaobr/atalaia-project/tree/main/docs/templates

# The two radio diagrams: site/src/diagrams/*.svg, built into site/img/diagrams/.
# Plain text, not HTML. Each text has a fixed room in the drawing; if a
# translation does not fit, tools/build_site.py names the key and the line
# (Han letters count as 1 em each, and lines break between them).
diagrams:
  lora:
    title: LoRa 無線電如何運作
    desc: >-
      五個區塊。啁啾（chirp）：LoRa 把每個符號當作一個掃過整個頻道的音調來傳送，知道這個模式的接收端即使在背景雜訊之下也能解碼，所以它用很少的電力就能傳得很遠，但只能傳短訊息。擴頻因子：從 SF7 起每往上一級，訊息在空中的時間大約加倍，換來多一點距離；盒子目前使用 SF7。距離：在視線無遮蔽的開闊地最遠，穿過樹林、人和車輛會變短，在建築物裡短得多，遇到混凝土、金屬或山丘則會被切斷，這時中間的盒子可以轉傳；868 MHz 穿過障礙物的能力比 2.4 GHz 的 Wi-Fi
      或藍牙好。設計估計在一般戶外場地約 0.5 到 2 km，還要在第 2 階段的場地測試中實測。轉傳：超出控制器範圍的盒子可以透過其他盒子被聽到，預設每則訊息最多轉傳兩次。歐洲的規定：一個共用的遊戲頻道，預設 869.525 MHz，這是頻段中唯一允許 500 mW
      和 10% 時間的部分，每個裝置每小時 6 分鐘；其他頻道允許 25 mW 和 1% 以下。
    chirp:
      title: "啁啾：在雜訊之下也聽得到"
      sweep: 啁啾掃過整個頻道
      noise: 雜訊
      below: 即使在雜訊之下也能解碼
      text: >-
        接收端知道掃頻的模式，所以在雜訊之下也聽得到：用很少的電力傳得很遠，但速度慢，所以訊息都很短。
    sf:
      title: 擴頻因子（SF）
      axis: 同一則訊息在空中的時間
      text: >-
        每往上一級，在空中的時間大約加倍，換來多一點距離。盒子目前使用 SF7；設計規劃大型戶外場地用 SF9–10。
    range:
      title: 開闊地或室內
      axis: 訊息能傳多遠（示意圖，未按比例）
      open: 開闊地，視線無遮蔽
      woods: 樹林、人、車輛
      walls: "室內：磚牆和石牆"
      blocked: 混凝土、金屬、山丘後方
      relay: → 中繼盒子幫得上忙
      text: >-
        868 MHz 穿過牆壁、人和樹葉的能力比 2.4 GHz 的 Wi-Fi 或藍牙好，但混凝土、金屬和山丘會大幅削弱它。
      note: >-
        設計估計：一般戶外場地約 0.5–2 km。第 2 階段的場地測試會實際量測。
    relay:
      title: 盒子之間互相轉傳
      controller: 控制器
      box_a: 盒子 A 轉傳
      box_b: 盒子 B
      text: >-
        超出控制器範圍的盒子可以透過其他盒子被聽到。預設每則訊息最多轉傳兩次（跳數限制），讓頻道保持暢通。
    rules:
      title: 歐洲的無線電規定（EU868）
      hour: 1 小時
      share: 每個裝置最多只能在 10% 的時間發射，每小時 6 分鐘。
      text: >-
        一個共用頻道，預設 869.525 MHz：頻段中唯一允許 500 mW 和 10% 的部分。其他頻道：25 mW、1% 以下。不需要執照或 SIM 卡。
  skirmesh:
    title: Skirmesh-RF 在不同的裝置上
    desc: >-
      左邊是 Skirmesh-RF 由下而上的五層：1，在一個共用遊戲頻道上的 LoRa 無線電；2，Skirmesh-RF 封包，以每場遊戲的金鑰做
      AES-128-CCM 加密，用 epoch 和序號防止重送攻擊，轉傳的跳數限制（預設兩次轉傳）、ACK、TIME 信標，以及用於控制器備援切換的
      CLAIM；3，以 CBOR 編碼的 HELLO、EVENT、ACK、STATE、CMD、TIME、CONFIG 和 CLAIM 訊息；4，共用的 C 核心和 Lua
      遊戲模式；5，場地控制器的 REST、WebSocket 和 MQTT API、GM 控制台、記分板和加入代碼（盒子用 NFC 卡，備援控制器和第 3
      階段的手機用 QR code）。右邊是每個裝置執行哪幾層。已在軟體中完成並測試、還沒在場地上用過的：Field Box（第 1 到 4 層）、
      USB 無線電數據機（第 1 和 2 層）和跑在 Raspberry Pi 或 PC 上的場地控制器（第 2 到 5 層），以及透過 Wi-Fi
      連線、在手機上使用的 GM 控制台，它們使用第 5 層，不需要 LoRa 無線電。同樣為第 3 階段在軟體中完成的：讓 Android
      手機或平板（第 2 到 4 層）有無線電的 I/O 模組（第 1 和 2 層），以及玩家 App。規劃中：衛星盒（第 1 到 4 層）。
    stack: 一個協定，分成多層
    l5:
      title: 場地控制器的服務
      text: >-
        REST、WebSocket 和 MQTT API、GM 控制台、記分板。加入代碼：盒子用 NFC 卡，備援控制器和第 3 階段的手機用 QR code。
    l4:
      title: "遊戲：共用核心、Lua 模式"
      text: >-
        同樣的 C 核心和 Lua 模式在每一個參與遊戲的裝置上執行：據點規則在盒子上，全場規則在控制器上。
    l3:
      title: 訊息
      text: >-
        HELLO、EVENT、ACK、STATE、CMD、TIME、CONFIG 和 CLAIM，以精簡的 CBOR 打包。透過 Wi-Fi 時，同樣的事件以 JSON 傳送。
    l2:
      title: Skirmesh-RF 封包
      crypto: AES-128-CCM 加密，每場遊戲一把金鑰
      replay: "Epoch 和序號：拒絕重送"
      hops: "跳數限制：預設最多轉傳 2 次"
      acks: "ACK：遺失的事件會重新傳送"
      time: TIME 信標讓時鐘保持同步
      claim: "CLAIM：備援控制器可以接手"
    l1:
      title: LoRa 無線電
      text: 一個共用的遊戲頻道，預設 869.525 MHz，每個裝置都在上面收聽。
    devices: 哪個裝置執行哪幾層
    cells: "有顏色的：它執行的層"
    box_sub: ESP32-S3 和一顆 SX1262 LoRa 無線電
