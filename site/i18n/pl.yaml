meta:
  index:
    title: Atalaia · otwarta platforma force-on-force
    description: >-
      Atalaia to otwarta platforma local-first dla urządzeń do gry w airsoft (ASG), paintball i milsim: propy na ESP32,
      Raspberry Pi, Arduino i Androidzie, tryby gry jako skrypty Lua i otwarty protokół LoRa.
    og_description: >-
      Otwarte urządzenia do gry local-first dla ASG, paintballa i milsimu. Tryby gry to skrypty;
      działa na każdym sprzęcie.
  modes:
    title: Tryby gry · Atalaia
    description: >-
      Tryby gry Atalaia dla ASG, paintballa i milsimu: Domination, Bomba / Rush, Sabotaż, Hold-All
      Domination, Last Stand, Kill Confirmed, Respawn i życia, Check-in, modyfikator Kody
      i Medic Kit, każdy jako krótki skrypt Lua.
  radio:
    title: Jak działa radio · Atalaia
    description: >-
      Co radio LoRa potrafi, a czego nie, na terenie gry ASG lub paintballa, jakiego kanału używa
      Atalaia i dlaczego, oraz jak jej protokół Skirmesh-RF działa na każdym urządzeniu.
  roadmap:
    title: Roadmapa · Atalaia
    description: >-
      Sześć faz Atalaia, od wspólnego rdzenia po społeczność, każda zamknięta prawdziwym testem w terenie,
      i na jakim etapie jest dziś każda z nich.
  build:
    title: Instrukcje budowy · Atalaia
    description: >-
      Jak zbudować z ogólnodostępnych części Satellite, moduł I/O, port rozszerzeń, moduł tarczy i moduł wyjść I2C
      Atalaia, jak skrzynka włącza syrenę lub wytwornicę dymu i gdzie jest instrukcja budowy Field Boxa.
  glossary:
    title: Słownik · Atalaia
    description: >-
      Słowa techniczne projektu Atalaia, od LoRa i ESP32 po copyleft, wyjaśnione prosto
      dla graczy, właścicieli terenów i organizatorów.
  og_image_alt: >-
    Wieża strażnicza na wzgórzu o zmierzchu ze skrzynką radiową na szczycie, połączona ze świecącymi
    skrzynkami GAME PROP w zalesionej dolinie, pod napisem „Open-source project ATALAIA”.
  architecture:
    title: "Jak to się łączy · Atalaia"
    description: "Siedem diagramów pokazujących, jak części Atalaia rozmawiają ze sobą: które łącze przenosi co i co nigdy nie opuszcza terenu gry."

