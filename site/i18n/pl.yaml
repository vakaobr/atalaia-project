hero:
  status: >-
    Pre-alfa · fazy 1 i 2 gotowe w oprogramowaniu; prawdziwe płytki rozgrywają całe gry z
    kontrolerem terenu na stole warsztatowym, łącznie z klawiaturą; faza 3 gotowa w oprogramowaniu,
    aplikacja iOS sprawdzona na iPhonie; serwer strony z fazy 4 działa na serwerze testowym; faza 5
    zbudowana w oprogramowaniu · najnowsze wydanie v0.9.0 · jeszcze nie gotowe do gry w terenie
  title: Otwarta platforma <span class="nowrap">force-on-force</span>
  lead: >-
    Atalaia to otwarta platforma dla elektronicznych urządzeń do gry w airsoft, paintball i milsim:
    skrzynek, które drużyny przejmują, i bomb, które uzbrajają i rozbrajają. Zbuduj skrzynkę do
    dominacji z <a href="{{ page.to.glossary }}#slownik-mikrokontroler">mikrokontrolera</a> za 20 € (malutkiej, taniej płytki komputerowej), zamień
    stary telefon z Androidem w terminal do hakowania, poprowadź weekendowy milsim z 20 skrzynkami na
    <a href="{{ page.to.glossary }}#slownik-lora">sieci mesh LoRa</a> (radiu dalekiego zasięgu o niskim poborze mocy, które skrzynki przekazują
    sobie nawzajem przez cały teren), i pisz własne tryby gry jako małe skrypty. Każda gra działa
    na samym terenie: bez chmury i internetu, a żaden producent nie może cię uzależnić od siebie.
  discuss: Dołącz do dyskusji
  design: Przeczytaj projekt
  source: Kod na GitHubie
  name: >-
    <em>Atalaia</em> (czyt. a-ta-LAJ-a) to po portugalsku <em>wieża strażnicza</em>: punkt obserwacyjny na wzgórzu,
    z którego wypatrywano zagrożeń i przekazywano ostrzeżenie dalej.
  why_name: Skąd ta nazwa?
  # The night scene: each language now has its own copy with the title painted in its language.
  image_alt: >-
    Ilustracja: o zmierzchu kamienna wieża strażnicza na wzgórzu niesie skrzynkę radiową, której sygnały docierają
    do świecących pomarańczowych skrzynek GAME PROP rozsianych po zalesionej dolinie, a obok nich przechodzi grupa
    graczy. Namalowany napis: „Open-source project ATALAIA”.

game:
  title: Jak wygląda gra
  intro: >-
    Do gry nie trzeba żadnej wiedzy technicznej. Tak będzie wyglądać gra, gdy skrzynki zostaną zbudowane (fazy
    1 i 2); <a href="{{ page.to.glossary }}#slownik-symulator">symulator</a> już dziś rozgrywa te same tryby na
    komputerze.
  setup:
    title: Przygotowanie
    text: >-
      Organizatorzy rozstawiają skrzynki na terenie gry i wybierają tryb gry, np. Domination, na
      klawiaturze skrzynki lub z telefonu, w niecałą minutę.
  capture:
    title: Przejęcie
    text: >-
      Aby przejąć skrzynkę, drużyna przytrzymuje przycisk swojego koloru przez kilka sekund. Skrzynka świeci się
      w tym kolorze i nalicza punkty drużynie, dopóki druga strona jej nie odbije.
  relay:
    title: Przekazywanie
    text: >-
      Każda skrzynka melduje się przez radio do <a href="{{ page.to.glossary }}#slownik-kontroler-terenu">kontrolera terenu</a>,
      małego komputera w bazie; sygnał z odległych skrzynek przekazują te pośrodku. Skrzynka, która
      traci łączność, gra dalej i nadrabia później.
  score:
    title: Wynik
    text: >-
      Kontroler wszystko sumuje. Organizatorzy śledzą grę na żywo w telefonach, a
      teren może pokazywać wynik na dużym ekranie lub na streamie.

why:
  title: Dlaczego Atalaia
  intro: >-
    Elektroniczne urządzenia do gry dużo wnoszą do rozgrywki, ale komercyjne systemy zamykają zasady w
    zamkniętym <a href="{{ page.to.glossary }}#slownik-firmware">firmware</a>. Nowe tryby zależą od producenta, nie ma
    publicznego <a href="{{ page.to.glossary }}#slownik-api">API</a> i nie można dodać własnego sprzętu. Atalaia robi to
    inaczej.
  local:
    title: Local-first
    text: >-
      Każda gra działa <a href="{{ page.to.glossary }}#slownik-local-first">na samym terenie</a>, całkowicie offline, od
      jednego domu po wielokilometrowy las. Internet jest opcjonalny.
  hardware:
    title: Dowolny sprzęt
    text: >-
      Tanie płytki <a href="{{ page.to.glossary }}#slownik-esp32">ESP32</a>, komputery
      <a href="{{ page.to.glossary }}#slownik-raspberry-pi">Raspberry Pi</a> wielkości karty kredytowej, proste
      płytki <a href="{{ page.to.glossary }}#slownik-arduino">klasy Arduino</a> oraz nowe lub używane
      <a href="{{ page.to.glossary }}#slownik-android-prop">telefony z Androidem</a> mają swoje miejsce w tej samej
      grze. Oprogramowanie dla skrzynek ESP32, kontrolera terenu i telefonów z Androidem jest napisane;
      płytki klasy Arduino przyjdą później.
  scripts:
    title: Tryby to skrypty
    text: >-
      Tryby gry to krótkie <a href="{{ page.to.glossary }}#slownik-lua">skrypty Lua</a>, małe pliki tekstowe z zasadami, z
      plikiem ustawień: łatwe do czytania, zmieniania i udostępniania, a żaden tryb nie potrzebuje własnego kodu we
      wbudowanym oprogramowaniu skrzynek. Skrzynki mają swoje tryby wbudowane, a między grami skrzynka może dostać
      podpisany nowy tryb od kontrolera terenu bez ponownego flashowania (reinstalacji) tego oprogramowania:
      zbudowane, jeszcze niewypróbowane na prawdziwej skrzynce.
  open:
    title: Otwarty protokół i API
    text: >-
      Urządzenia komunikują się przez <a href="{{ page.to.glossary }}#slownik-skirmesh-rf">Skirmesh-RF</a>, udokumentowany protokół radiowy,
      więc każdy może zbudować urządzenie, które dołączy do gry. Kontroler terenu udostępnia API MQTT, REST i
      WebSocket dla tablic wyników, nakładek na stream i innych narzędzi.
  fields:
    title: Zrobione dla terenów
    text: >-
      Role graczy, squady, check-in na terenie z wydrukowanym plakatem oraz rejestr
      <a href="{{ page.to.glossary }}#slownik-chrono">chrono</a>, który przechowuje podpisane pomiary każdej repliki do
      wyrywkowych kontroli, są zbudowane w oprogramowaniu; własne scenariusze przyjdą w fazie&nbsp;4.
  copyleft:
    title: Copyleft
    text: >-
      Tereny pobierające opłaty za wstęp i twórcy sprzedający skrzynki są mile widziani. Każdy, kto rozpowszechnia lub hostuje
      zmienioną wersję, <a href="{{ page.to.glossary }}#slownik-copyleft">udostępnia zmiany</a> z powrotem.

how:
  title: Jak to się łączy
  intro: >-
    Prościej mówiąc: urządzenia na terenie rozmawiają przez radio z kontrolerem terenu, małym komputerem
    w bazie, który prowadzi grę i liczy wynik. Telefony łączą się z nim przez Wi-Fi, a
    tablice wyników, nakładki na stream i aplikacje mapowe takie jak <a href="{{ page.to.glossary }}#slownik-atak">ATAK</a> przez jego
    API. Opcjonalny <a href="{{ page.to.glossary }}#slownik-serwer-strony">serwer strony</a> w internecie przechowuje konta
    i historię. Kontroler, jego API i konsola organizatorów są zbudowane i grają z prawdziwymi
    skrzynkami na stole warsztatowym, jeszcze nie w terenie; serwer strony też jest zbudowany i działa na serwerze
    testowym, jeszcze nie na prawdziwym terenie.
  core: >-
    Pod maską każde urządzenie, które uruchamia tryby gry, korzysta z tego samego
    <a href="{{ page.to.glossary }}#slownik-rdzen">wspólnego rdzenia</a>, napisanego w C11, i tych samych trybów Lua; różni się tylko cienka
    warstwa dla każdego rodzaju sprzętu. Tryb napisany raz działa tak samo na skrzynce, telefonie
    czy Raspberry Pi.
  diagram:
    title: >-
      Opcjonalny serwer strony łączy się przez internet z kontrolerem terenu. Aplikacje GM i graczy
      łączą się z kontrolerem przez Wi-Fi, tablice wyników i inne narzędzia przez MQTT i REST, a
      urządzenia przez sieć mesh LoRa Skirmesh-RF.
    server: Serwer strony (opcja)
    server_sub: konta · historia · aplikacja
    apps: Aplikacje GM i graczy
    apps_sub: Wi-Fi
    controller: Kontroler terenu
    controller_sub: Raspberry Pi lub Android
    tools: Tablice wyników, ATAK
    tools_sub: MQTT, REST, webhooki
    mesh: Skirmesh-RF · mesh LoRa
    satellite: Satellite
    android: Prop z Androidem
    android_sub: z modułem ESP32
    thin: Cienki węzeł
    thin_sub: klasa Arduino
  list:
    server: >-
      <strong>Serwer strony</strong> (opcjonalny): konta, historia i aplikacja dla graczy, przez
      internet.
    controller: >-
      <strong>Kontroler terenu</strong> na Raspberry Pi lub Androidzie: aplikacje GM i graczy łączą się przez
      Wi-Fi; tablice wyników i ATAK korzystają z MQTT, REST i webhooków.
    props: >-
      <strong>Urządzenia do gry</strong> w sieci mesh LoRa Skirmesh-RF:
      <a href="{{ page.to.glossary }}#slownik-field-box">Field Boxy i satelity</a> na ESP32, propy z Androidem z modułem ESP32
      oraz cienkie węzły klasy Arduino.
  # English page only: the Portuguese page shows this image in its hero.
  image_alt: >-
    Ilustracja izometryczna: mała kamienna wieża ze skrzynką radiową na szczycie stoi pośrodku
    kwadratowej podstawy, otoczona ośmioma pomarańczowymi i żółtymi skrzynkami GAME PROP z antenami, połączonymi
    świecącym okręgiem.
  image_caption: >-
    Kontroler terenu jest wieżą strażniczą: ze środka terenu ma na oku każde
    urządzenie.

radio:
  title: Jak działa radio
  intro: >-
    Urządzenia komunikują się przez <a href="{{ page.to.glossary }}#slownik-lora">LoRa</a>, radio dalekiego zasięgu o niskim poborze mocy, we
    własnym protokole Atalaia, <a href="{{ page.to.glossary }}#slownik-skirmesh-rf">Skirmesh-RF</a>. Te dwa diagramy
    pokazują, co LoRa potrafi, a czego nie, na terenie gry, i jak jeden protokół działa na bardzo różnych
    urządzeniach. Nic z tego nie było jeszcze na prawdziwym terenie: zasięg i czasy zostaną zmierzone w
    teście terenowym fazy&nbsp;2.
  # The main page's short version of this section, with a link to the radio page.
  teaser: >-
    Urządzenia komunikują się przez <a href="{{ page.to.glossary }}#slownik-lora">LoRa</a>, radio dalekiego zasięgu
    o niskim poborze mocy, we własnym protokole Atalaia,
    <a href="{{ page.to.glossary }}#slownik-skirmesh-rf">Skirmesh-RF</a>. Dwa diagramy pokazują, co
    LoRa potrafi, a czego nie, na terenie gry, i jak jeden protokół działa na bardzo różnych urządzeniach. Nic
    z tego nie było jeszcze na prawdziwym terenie.
  more: Jak działa radio, w dwóch diagramach →
  # Each diagram's alt text is its description, diagrams.*.desc, also used inside the SVG.
  lora:
    title: Co potrafi LoRa
    lead: >-
      LoRa wymienia szybkość na zasięg: przesyła krótkie wiadomości przez cały teren przy bardzo małym zużyciu baterii,
      a jej sygnał przechodzi przez ściany i drzewa lepiej niż Wi-Fi, choć beton, metal
      i wzgórza nadal go blokują. Skrzynkę, która nie sięga kontrolera, słychać przez inne
      skrzynki, a europejskie przepisy ograniczają, przez jaką część czasu każde urządzenie może nadawać.
  skirmesh:
    title: Jeden protokół na każdym urządzeniu
    lead: >-
      Skirmesh-RF jest zbudowany warstwami, od radia po API kontrolera. Field Box obsługuje
      wszystko aż do trybów gry; kontroler na Raspberry Pi zostawia pracę radiową modemowi radiowemu
      USB; w fazie&nbsp;3 telefon z Androidem robi to samo z modułem I/O. Telefony w
      sieci Wi-Fi terenu w ogóle nie potrzebują radia LoRa.
  channel:
    title: Jaki kanał i dlaczego 869,525&nbsp;MHz
    lead: >-
      Cały ruch gry dzieli jeden kanał. Domyślny, 869,525&nbsp;MHz, to środek pasma
      869,4–869,65&nbsp;MHz, jedynej części europejskiego pasma 868&nbsp;MHz, w której urządzenie
      może nadawać do 10% czasu z mocą do 500&nbsp;mW. W pozostałej części 868–870&nbsp;MHz przepisy
      dopuszczają 1% czasu (0,1% na 868,7–869,2&nbsp;MHz) przy 25&nbsp;mW: około jednej dziesiątej
      czasu nadawania i znacznie mniejszy zasięg. 868,1, 868,3 i 868,5&nbsp;MHz to domyślne kanały
      LoRaWAN i często są zajęte. Kanał domyślny też jest współdzielony: bramki LoRaWAN wysyłają
      część odpowiedzi na 869,525&nbsp;MHz, a europejskie ustawienie domyślne Meshtastic z niego
      korzysta, więc w pobliżu takich użytkowników GM może kazać kontrolerowi nasłuchiwać legalnych
      kanałów (łącznie około 60 sekund) i wybrać najcichszy, wylosować jeden albo wybrać ręcznie.
      Skrzynki stosują wtedy limity wybranego kanału. Gdy GM zmienia kanał, kontroler trzy razy mówi
      wolnym skrzynkom na starym kanale, dokąd przeszedł; skrzynka wyłączona lub poza zasięgiem tego
      nie usłyszy i trzeba ją odnaleźć wyszukiwaniem skrzynek albo przyjąć na nowo.
  region:
    title: "Regiony radiowe: Europa i Tajwan"
    lead: >-
      Teren należy do jednego regionu radiowego, wybieranego raz w konsoli GM. W Europie (EU868) skrzynki używają
      powyższych kanałów. Na Tajwanie (AS923, 920–925&nbsp;MHz) przepisy NCC (LP0002) dają pojedynczemu
      kanałowi bez skakania częstotliwości pełną moc tylko wtedy, gdy ma co najmniej 500&nbsp;kHz szerokości, więc tam
      skrzynki używają LoRa z szerokością 500&nbsp;kHz (SF9, mniej więcej ten sam zasięg co w Europie), maksymalnie 0,5&nbsp;W na
      antenie, i domyślnie 921,5&nbsp;MHz, z dala od kanałów używanych przez LoRaWAN i Meshtastic.
      Każda skrzynka, modem radiowy USB i moduł I/O jest zbudowany dla jednego regionu i odrzuca kanały
      innych regionów, więc skrzynka nigdy nie nadaje poza swoim pasmem; skrzynki poznają region terenu przy
      każdej grze. Region tajwański nie jest certyfikowany: produkt sprzedawany na Tajwanie wymaga homologacji
      typu NCC i anteny przeznaczonej do 920&nbsp;MHz. Nic z tego nie było jeszcze testowane w eterze.
modes:
  title: Tryby gry
  intro: >-
    Tryby reagują na intencję („drużyna przejmuje to urządzenie”), a nie na sprzęt, więc ten sam skrypt
    działa na Field Boksie, skrzynce z klawiaturą albo telefonie z Androidem. Czternaście trybów, jeden modyfikator i Medic
    Kit są już napisane i przetestowane w oprogramowaniu; żaden nie działał jeszcze na prawdziwym terenie gry.
  # The main page shows three modes, then this link to the modes page.
  more: Zobacz wszystkie 14 trybów →
  # At the end of the modes page.
  try: Wypróbuj tryb w przeglądarce już dziś →
  domination:
    title: Domination
    text: >-
      Drużyna przytrzymuje wejście urządzenia przez kilka sekund, żeby je przejąć, i zdobywa punkty co takt, dopóki
      je utrzymuje. Druga drużyna może je w każdej chwili odbić.
    meta: Przyciski drużyn · jedna skrzynka lub wiele
  bomb:
    title: Bomba / Rush
    text: >-
      Atakujący uzbrajają bombę, a potem jej bronią; obrońcy muszą ją rozbroić, zanim skończy się zapalnik.
      Wybuch kończy grę zwycięstwem atakujących. Uzbrajanie i rozbrajanie odbywa się przytrzymaniem przycisku albo
      każda drużyna dostaje własny kod na klawiaturze.
    meta: Przyciski drużyn lub klawiatura · czasy zapalnika i przytrzymania to ustawienia
  sabotage:
    title: "Sabotaż"
    text: "Bomba w rundach, aż skończy się czas gry. Atakujący uzbrajają bombę, obrońcy ją rozbrajają. Wybuch to punkt dla atakujących, rozbrojenie to punkt dla obrońców; potem skrzynka odpoczywa i zaczyna się kolejna runda. Wygrywa drużyna z większą liczbą punktów."
    meta: "Przyciski drużyn lub klawiatura · czasy zapalnika, przytrzymania, przerwy i gry to ustawienia"
  holdall:
    title: Hold-All Domination
    text: >-
      Drużyny przejmują skrzynki jak w Domination, ale drużyna zdobywa punkty tylko wtedy, gdy trzyma wszystkie skrzynki
      naraz. Utrata jednej zatrzymuje naliczanie punktów.
    meta: Kilka skrzynek · wymaga kontrolera terenu
  laststand:
    title: Last Stand
    text: >-
      Obrońcy zaczynają ze wszystkimi strefami. Gdy zostaje im ostatnia, rusza odliczanie do
      porażki, które trwa, dopóki nie odbiją innej; gdy dobiegnie końca, wygrywają atakujący.
    meta: Kilka skrzynek · wymaga kontrolera terenu
  kill_confirmed:
    title: Kill Confirmed
    text: >-
      Gracze noszą podpisane tagi NFC. Drużyna skanuje zebrane tagi na stacji: tag przeciwnika
      potwierdza trafienie, tag kolegi z drużyny je anuluje. Podrobione tagi są odrzucane.
    meta: Czytnik NFC · tagi graczy
  respawn:
    title: Respawn i życia
    text: >-
      Punkt respawnu liczy życia na drużynę lub na gracza, z czasem odnowienia między respawnami. Gdy
      drużynie skończą się życia, odpada z gry.
    meta: Czytnik NFC lub przyciski drużyn
  player_checkin:
    title: Check-in
    text: >-
      Gracze robią check-in w punkcie kontrolnym swoim tagiem. Skrzynka liczy graczy każdej drużyny i może
      przyznawać punkty za każdy check-in.
    meta: Czytnik NFC · tagi graczy
  medic:
    title: Medic Kit
    text: >-
      Obok dowolnego trybu: trafiony gracz skanuje swój tag i przytrzymuje przycisk przez ustalony czas, żeby zostać uleczonym.
      Apteczka pokazuje, ile leczeń jej zostało; każdy gracz ma ograniczoną liczbę leczeń na grę przy każdej
      apteczce, GM uzupełnia apteczkę z konsoli, a każde leczenie widać w logu GM i w widoku
      graczy.
    meta: Czytnik NFC i przycisk · tagi graczy · wymaga kontrolera terenu
  master_satellites:
    title: Master i Satelity
    text: >-
      Drużyny przejmują skrzynkę master i jej satelity. Punkty zdobywa tylko master, a każda satelita, którą
      trzyma także jego posiadacz, podnosi jego punkty; gdy master zmienia właściciela, wszystkie satelity wracają
      do stanu neutralnego. Napisany i przetestowany w oprogramowaniu, a teraz także rozegrany testowo na prawdziwych skrzynkach (zobacz klip poniżej).
    meta: Kilka skrzynek · wymaga kontrolera terenu
    real_alt: >-
      Niemy film z testowej gry Master i Satelity na stole warsztatowym, trzy krótkie fragmenty połączone w jeden. Najpierw
      master, skrzynka z dużym ekranem, przechodzi z „LIVRE” (wolny) do zajętego przez czerwonych, a na ekranie widać
      „MASTER OCUPADO”, „RED”, „0 de 3 satélites”. Potem skrzynka-satelita pokazuje, że trzymają ją czerwoni. Na koniec master
      pokazuje „1 de 3 satélites, 3 pontos a cada 10 s” dla czerwonych, po czym przechodzi do niebieskich i wraca do „0 de 3 satélites”.
      Ekrany są po portugalsku.
    real_caption: >-
      Test na stole warsztatowym, 1 listopada 2026 (trzy fragmenty jednej gry, połączone): cztery skrzynki, a ta z
      dużym ekranem to master. Czerwoni przejmują mastera i satelitę, punkty mastera rosną, a potem niebiescy
      przejmują mastera. Test pokazał trzy rzeczy na dużym ekranie: portugalski ekran mówił „MASTER” zamiast
      „MESTRE”, master pokazywał „ZONA” przed pierwszym przejęciem i wyświetlał godzinę przejęcia
      („desde”) zamiast tego, jak długo jest utrzymywany. Wszystkie trzy poprawiono w firmware po tym teście
      (klip nadal pokazuje stare ekrany; nowe nagranie pojawi się później). Bez dźwięku; ekrany są po
      portugalsku.
  target_windows:
    title: Okna tarcz
    text: >-
      Tarcza zapala się na kilka sekund w kolorze losowej drużyny, a trafienie, gdy świeci,
      daje punkt tej drużynie. Gra jest napisana i przetestowana w oprogramowaniu, od początku do końca z symulowaną
      tarczą; potrzebny moduł tarczy (płyta z czujnikiem trafień podłączana do skrzynki, której własne
      światła pokazują okno) ma instrukcję budowy i firmware, ale żadnego jeszcze nie zbudowano ani nie wypróbowano na
      prawdziwej płycie.
    meta: Skrzynka z modułem tarczy · jeszcze nie wypróbowane na sprzęcie
  hacking_terminal:
    title: Hacking Terminal
    text: >-
      Terminal zadaje zagadkę na swojej klawiaturze: złam kod na podstawie tego, ile cyfr jest na właściwym
      miejscu, przetnij kable we właściwej kolejności albo powtórz sekwencję. Zła odpowiedź blokuje go na
      chwilę. Rozwiązanie może ujawnić kod do innego celu, dać punkty i przejąć terminal,
      dopóki inna drużyna go nie odhakuje. Napisany i przetestowany w oprogramowaniu, jeszcze nie rozegrany na telefonie
      w terenie.
    meta: Skrzynka lub telefon z klawiaturą · działa bez kontrolera terenu
  vip_payload:
    title: VIP / Payload
    text: >-
      Jedna drużyna eskortuje swojego VIP-a, gracza udostępniającego pozycję z aplikacji, albo payload,
      telefon z GPS, do strefy ewakuacji; pozostali próbują ich zatrzymać. Skrzynki punktów kontrolnych po
      drodze dają punkty, dopóki drużyna je trzyma. Pozycje zostają na kontrolerze terenu i telefonie; na zewnątrz
      wychodzi tylko „ewakuowano”. Napisany i przetestowany w oprogramowaniu, jeszcze nie rozegrany z prawdziwym GPS.
    meta: Skrzynki punktów kontrolnych, telefon z GPS lub telefon VIP-a · wymaga kontrolera terenu
  money_factory:
    title: Money Factory
    text: >-
      Drużyny przejmują skrzynki-fabryki, które produkują pieniądze, dopóki je trzymają. Gracze zbierają je,
      skanując swój tag w fabryce swojej drużyny, przenoszą przez teren gry i wpłacają w skrzynce-banku
      za punkty; kontroler terenu pamięta, ile niesie każdy gracz, więc pieniądze można
      zebrać w jednej skrzynce i wpłacić w innej. Gracz uleczony przy apteczce traci to, co
      niesie, a pierwsza drużyna, która wpłaci docelową kwotę, może wygrać. Napisany i przetestowany w oprogramowaniu, jeszcze nie
      rozegrany na prawdziwych skrzynkach.
    meta: Skrzynki-fabryki i banki lub telefony z NFC · tagi graczy · wymaga kontrolera terenu
  progressive_domination:
    title: Progressive Domination
    text: >-
      Kilka skrzynek, ale naraz można przejąć tylko jedną, a obie drużyny wiedzą którą.
      Drużyna trzymająca aktywną skrzynkę zdobywa punkty za każdą pełną minutę; gdy drużyna utrzyma ją
      wystarczająco długo, skrzynka zostaje zaliczona dla tej drużyny i zablokowana, a kolejna skrzynka w kolejności jest
      ogłaszana obu drużynom. Kolejność to lista GM, numery skrzynek albo losowa; gra kończy się,
      gdy zostanie zaliczona ostatnia skrzynka albo gdy drużyna osiągnie docelowy wynik. Napisany i przetestowany w
      oprogramowaniu, jeszcze nie rozegrany na prawdziwych skrzynkach.
    meta: Skrzynki z przyciskami drużyn · wymaga kontrolera terenu
  codes:
    title: Kody (modyfikator)
    text: >-
      Działa obok dowolnego trybu na tej samej skrzynce: kody z klawiatury dają punkty, podpowiedzi lub odblokowania, a
      GM widzi, kto użył każdego kodu i która drużyna trzymała wtedy skrzynkę.
    meta: Klawiatura · działa z każdym trybem
  yours:
    title: Twój tryb
    text: >-
      Capture the flag, własny tryb twojego klubu… Tryby to krótkie
      skrypty. Zaproponuj swój za pomocą szablonu pomysłu na tryb gry albo udostępnij gotowy jako podpisany
      pakiet w <a href="https://vakaobr.github.io/atalaia-modes/">rejestrze trybów</a>.
    link: Podziel się pomysłem na tryb gry

# The animated pictures of the modes page (tools/gen_mode_gifs.py, tools/mode_gifs.yaml):
# each picture's alt text (what happens in it, in order) and the caption under it.
gifs:
  intro: >-
    Każdą animację poniżej rysuje kod firmware'u samego Field Boksa, to nie makiety: duży
    ekran u góry, mały OLED pod nim, w trakcie gry w danym trybie. Przycisk pod
    obrazkiem ją wstrzymuje.
  play: Odtwórz animację
  pause: Wstrzymaj animację
  domination:
    alt: >-
      Animacja Field Boksa w trybie Domination. Ekran pokazuje neutralną strefę; czerwoni przytrzymują
      swój przycisk, pasek na małym ekranie się wypełnia, a strefa robi się czerwona i jej punkty zaczynają
      rosnąć. Potem niebiescy przytrzymują swój przycisk i przejmują strefę, a gra kończy się końcowym
      wynikiem.
    caption: >-
      Domination na Field Boksie: drużyna przytrzymuje swój przycisk, żeby przejąć strefę, punkty rosną,
      dopóki ją trzyma, a druga drużyna może ją odbić.
  bomb:
    alt: >-
      Animacja Field Boksa w trybie Bomba. Ekran pokazuje gotową bombę; czerwoni przytrzymują swój
      przycisk, żeby ją uzbroić, odliczanie startuje od 4:59, niebiescy przytrzymują swój przycisk, żeby ją rozbroić, pasek
      się wypełnia, a ekran robi się niebieski na znak, że bomba jest rozbrojona.
    caption: >-
      Bomba / Rush: uzbrajanie przytrzymaniem przycisku, odliczający zapalnik, obrońcy rozbrajający na
      czas.
  sabotage:
    alt: "Animacja Field Boksa w trybie Sabotaż. Ekran pokazuje gotową bombę i wynik 0 : 0; czerwoni przytrzymują swój przycisk, pasek się wypełnia i bomba zostaje uzbrojona; wybucha, a ekran robi się czerwony, punkt dla czerwonych. Przerwa pokazuje 1 : 0 i czas do następnej rundy, potem niebiescy przytrzymują swój przycisk, żeby rozbroić drugą bombę, a ekran robi się niebieski, punkt dla niebieskich; ekran końca gry pokazuje zwycięstwo czerwonych."
    caption: "Sabotaż: rundy z bombą i wynikiem, wybuch dla atakujących, rozbrojenie dla obrońców, aż skończy się czas."
  master_satellites:
    alt: >-
      Animacja trybu Master i Satelity: skrzynka master z nagłówkiem MASTER zmienia się z neutralnej na
      czerwoną, gdy czerwoni przytrzymują jej przycisk, i pokazuje „MASTER HELD” oraz jak długo jest utrzymywana; potem
      pokazuje, ile satelitów trzymają czerwoni (1, 2, a potem 3 z 3), punkty na takt i sumę czerwonych
      w rogu, a na koniec ekran końca gry.
    caption: >-
      Master i Satelity: satelity przejmuje się jak strefy w Domination; skrzynka master liczy,
      ile trzyma drużyna, i za każdą płaci więcej punktów.
  hacking_terminal:
    alt: >-
      Animacja trybu Hacking Terminal: zagadka z kodem z próbami i podpowiedziami (właściwe i niewłaściwe
      miejsce), zagadka z kablami, które są przecinane, zagadka z sekwencją (pokazany klawisz, potem
      „twoja kolej”) i ekran przyznanego dostępu z kodem.
    caption: >-
      Hacking Terminal: terminal może mieć zagadkę z kodem, kablami lub sekwencją; drużyna, która
      ją rozwiąże, przejmuje terminal i może odczytać kod.
  medic:
    alt: >-
      Animacja Medic Kit: apteczka pokazuje 4 pozostałe leczenia; ranny gracz przytrzymuje przycisk
      i pasek odliczania się wypełnia; apteczka pokazuje wykonane leczenie i 3 pozostałe; gracz, który
      wykorzystał wszystkie leczenia, zostaje odrzucony.
    caption: >-
      Medic Kit: ranny gracz przytrzymuje przycisk przez czas leczenia; apteczka liczy swoje ładunki
      i limit każdego gracza.
  vip_payload:
    alt: >-
      Animacja trybu VIP / Payload: skrzynka punktu kontrolnego, której nikt nie trzyma, niebiescy przytrzymują jej przycisk i
      ją przejmują, potem ekran payloadu z malejącą liczbą metrów do strefy ewakuacji,
      ostrzeżenie o słabym GPS i zakończona ewakuacja.
    caption: >-
      VIP / Payload: punkty kontrolne przejmuje się po drodze, a ekran payloadu (telefonu)
      pokazuje odległość do ewakuacji.
  money_factory:
    alt: >-
      Animacja trybu Money Factory: wolna fabryka, czerwoni przytrzymują jej przycisk, a pasek przejęcia
      się wypełnia, fabryka trzymana przez czerwonych z zapasem rosnącym od 5 do 35 z 50, gracz
      zbiera 15, a skrzynka-bank pokazuje wpłatę 15 i sumy na drużynę.
    caption: >-
      Money Factory: trzymana fabryka napełnia się pieniędzmi, gracze zbierają je swoim tagiem i
      wpłacają w skrzynce-banku.
  progressive_domination:
    alt: >-
      Animacja trybu Progressive Domination: skrzynka czekająca na swoją kolej (1 z 4 skrzynek zaliczona);
      skrzynka staje się aktywna, a niebiescy przytrzymują jej przycisk, aż ją przejmą; punkty niebieskich
      i minuty utrzymania rosną, a pasek udziału się wypełnia; skrzynka zostaje zaliczona dla niebieskich i
      zablokowana; potem następna skrzynka, która czekała, staje się aktywna.
    caption: >-
      Progressive Domination: naraz można przejąć tylko jedną skrzynkę; drużyna, która trzyma ją
      wystarczająco długo, zalicza ją, a następna skrzynka w kolejności jest ogłaszana.
  target_windows:
    alt: >-
      Animacja trybu Okna tarcz: tarcza czeka na kolor drużyny, otwiera się okno dla
      czerwonych z 5-sekundowym odliczaniem, tarcza pokazuje trafienie czerwonych, potem okno dla niebieskich i
      licznik trafień rośnie do 2.
    caption: >-
      Okna tarcz: tarcza otwiera krótkie okno w kolorze jednej drużyny; trafienia w trakcie
      okna dają punkty.
  codes:
    alt: >-
      Animacja modyfikatora Kody z Bombą: ekran prosi o kod drużyny, cztery wpisywane cyfry
      pojawiają się jako kropki, odliczanie trwa, a kod rozbrojenia zostaje wpisany, zanim ekran pokaże
      rozbrojoną bombę.
    caption: >-
      Kody: Bomba z wpisywanymi kodami drużyn zamiast przytrzymywanych przycisków: skrzynka z klawiaturą prosi o kod
      do uzbrojenia i kod do rozbrojenia. Komunikaty pisane przez skrypt trybu pozostają po angielsku.
  kill_confirmed:
    alt: >-
      Animacja trybu Kill Confirmed: stacja czeka na tagi; tag czerwonego gracza zostaje przyjęty,
      odlicza się 14-sekundowe okno i pojawia się komunikat „Kill confirmed: b1”; potem podrobiony tag
      zostaje odrzucony.
    caption: >-
      Kill Confirmed: zeskanowanie podpisanego tagu przeciwnika potwierdza trafienie; podrobiony tag jest odrzucany.
      Komunikaty pisane przez skrypt trybu pozostają po angielsku.
  respawn:
    alt: >-
      Animacja trybu Respawn i życia: punkt respawnu przyjmuje graczy z powrotem do gry, a
      życia drużyny spadają z 19 do 18 i 17, a na koniec na czerwono widać, że drużynie nie zostały
      żadne życia.
    caption: >-
      Respawn i życia: każdy powrót do gry kosztuje drużynę jedno życie; przy zerze drużyna odpada.
      Komunikaty pisane przez skrypt trybu pozostają po angielsku.
  player_checkin:
    alt: >-
      Animacja trybu Check-in: każdy tag zeskanowany w punkcie check-in dodaje gracza;
      suma rośnie z 1 do 3 i do 5, z liczbą na drużynę.
    caption: >-
      Check-in: gracze robią check-in na starcie, a skrzynka liczy graczy każdej drużyny.
      Komunikaty pisane przez skrypt trybu pozostają po angielsku.

screens:
  title: Jak to wygląda
  intro: >-
    Trzy tryby tak, jak pokazuje je skrzynka: animacje rysowane przez kod firmware'u samego Field Boksa, a nie
    makiety. Przycisk pod każdym obrazkiem go wstrzymuje. Niżej zrzuty ekranu aplikacji.
  real:
    title: Prawdziwa skrzynka na stole warsztatowym
    intro: >-
      Tryby powyżej to animacje rysowane przez kod firmware'u. To jest wersja warsztatowa Field Boksa
      (jedna płytka i luźne kable, bez obudowy) grająca naprawdę w Domination.
    alt: >-
      Niemy, zapętlony film z wersji warsztatowej Field Boksa w trybie Domination: ekran pokazuje strefę trzymaną
      przez drużynę czerwoną z 3 punktami; niebieski pasek wypełnia się wzdłuż dołu i strefa przechodzi do drużyny niebieskiej.
      Potem czas utrzymania rośnie (od 0:01), a w prawym górnym rogu pojawiają się punkty każdej drużyny.
    caption: >-
      Field Box na stole warsztatowym (1 listopada 2026), z nowym ekranem TFT: pasek przytrzymania się wypełnia, drużyna niebieska
      przejmuje strefę, czas utrzymania rośnie, a punkty każdej drużyny widać w rogu. Jeszcze bez obudowy, nadal luźne
      kable.
    more: Zobacz budowę i zdjęcie →
  gifs_more: Zobacz wszystkie tryby →
  box_title: Ekrany skrzynki krok po kroku
  box_intro: >-
    Osiem zrzutów z prawdziwego firmware'u Field Boksa (ESP32, LVGL 9.2, 320&nbsp;×&nbsp;240&nbsp;TFT)
    działającego w emulatorze <a href="https://wokwi.com">Wokwi</a>, od PIN-u organizatora gry do
    rozbrojenia bomby. Interfejs skrzynki jest po angielsku. Firmware działa już na prawdziwym Heltecu V4.3; te
    zrzuty pochodzą z emulatora. Stuknij lub kliknij zrzut, żeby go powiększyć.
  note: >-
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">Instrukcja
    budowy</a> zawiera pełny schemat okablowania i poradnik pierwszego wgrania firmware'u na Heltec WiFi LoRa 32&nbsp;V4.
  pin_entry:
    alt: >-
      Ekran Field Boksa: nagłówek „GAME MASTER”, polecenie „Enter the admin PIN”, cztery puste kółka na
      cyfry, podpowiedź „# enter * delete”.
    caption: GM wpisuje PIN administratora, żeby odblokować konfigurację.
  choose_game:
    alt: >-
      Ekran Field Boksa: nagłówek „CHOOSE A GAME” z listą 1 „Bomb” (podświetlone na żółto),
      2 „Domination”, 3 „Hold-All Domination”, 4 „Last Stand” i 5 „Codes”, z podpowiedzią
      „1-9 choose # next * back”.
    caption: Wybierz tryb gry z menu na skrzynce.
  confirm:
    alt: >-
      Ekran Field Boksa: nagłówek „START THE GAME?” na pomarańczowym pasku, nazwa trybu „Bomb”, „Timer:
      10 min”, podpowiedź „# start * back”.
    caption: Potwierdź tryb i czas przed startem.
  standby:
    alt: >-
      Ekran Field Boksa: nagłówek „STANDBY”, „Hold the button to arm”, „RED” na czerwono, „The bomb is
      not armed” na dole.
    caption: Czekanie, aż drużyna czerwona przytrzyma przycisk uzbrajania.
  armed:
    alt: >-
      Ekran Field Boksa: nagłówek „ARMED” na czerwonym pasku, duże odliczanie „5:00”, napis
      „until detonation”.
    caption: Bomba uzbrojona; drużyna niebieska ma 5 minut na rozbrojenie.
  defused:
    alt: >-
      Ekran Field Boksa: niebieskie tło, biały znak wyboru, duży napis „DEFUSED”, pod nim „BLUE team
      wins”.
    caption: Drużyna niebieska rozbroiła bombę na czas.
  joined:
    alt: >-
      Ekran Field Boksa: nagłówek „JOINED GAME 4242”, napis „Game” po lewej, „zone, node 7” po
      prawej.
    caption: Skrzynka dołączyła do gry na terenie przez kartę NFC lub konsolę szeregową.
  code_entry:
    alt: >-
      Ekran Field Boksa: nagłówek „CODE”, dwa z czterech kółek wypełnione na żółto, podpowiedź „# enter * delete”.
    caption: Wpisywanie kodu dla modyfikatora Kody (punkty, podpowiedzi lub odblokowania).

  app_title: Aplikacja na Androida
  app_intro: >-
    Własne ekrany aplikacji są po portugalsku, angielsku, niemiecku i w chińskim tradycyjnym, a ekrany każdego trybu rysuje ona z
    tych samych plików YAML co Field Box. To obrazy z testów aplikacji, a nie zdjęcia telefonu:
    aplikacja działała na emulatorach Androida, jeszcze nie na prawdziwym telefonie.
  app_roles:
    alt: >-
      Pierwszy ekran aplikacji, „Co będzie robić ten telefon?”: cztery opcje, każda z linijką o tym, co
      robi: Urządzenie do gry, Gracz, Sędzia i Organizator gry.
    caption: Wybierz, co ten telefon robi w grze.
  app_prop:
    alt: >-
      Telefon z Androidem jako bomba: ekran odliczania trybu („ARMED”, „4:47”, „until
      detonation”) nad dwoma dużymi przyciskami do przytrzymania, czerwonym i niebieskim.
    caption: Telefon jako bomba, z przyciskami drużyn.
  app_player:
    alt: >-
      Widok gracza: nazwa gry, 20:00 do końca, 20 punktów drużyny niebieskiej nad 12 punktami drużyny
      czerwonej, kto trzyma każdy cel i co się wydarzyło.
    caption: Gracze śledzą grę na swoich telefonach.
  app_branded:
    alt: >-
      Widok gracza na terenie z własnym brandingiem: logo i nazwa terenu, Campo Norte, w
      nagłówku, jego tapeta blado w tle widoku oraz drużyny Águias i Lobos z ich
      herbami i wynikami, 20 do 12.
    caption: Własne logo terenu, tapeta i herby drużyn.
  app_chrono:
    alt: >-
      Chronograf sędziego: klawiatura prędkości, masa kulki i zielone „PASS”, z
      najwyższą energią i limitem.
    caption: Check-in z chrono, odczyt podpisany przez sędziego.
  medic_intro: >-
    Medic Kit rysuje swoje ekrany z tych samych plików YAML na Field Boksie i na urządzeniu z Androidem,
    po portugalsku, chyba że GM ustawi angielski, niemiecki lub chiński. Tak rysuje je
    aplikacja:
  medic_idle:
    alt: >-
      Ekran Medic Kit: nagłówek „LIGADURAS” (Medic Kit), duża 4, „Restam 4 ligaduras” (zostały 4
      leczenia) i na żółto „Lê a tua etiqueta e mantém premido o botão” (zeskanuj tag, potem przytrzymaj
      przycisk).
    caption: Czekanie na gracza, zostały 4 leczenia.
  medic_hold:
    alt: >-
      Ekran Medic Kit: identyfikator gracza, b1, w niebieskim nagłówku, „Mantém premido para tratar” (trzymaj
      dalej, żeby się uleczyć), 4 sekundy do końca na żółto nad paskiem postępu i „Largar antes do tempo
      cancela” (puszczenie za wcześnie anuluje).
    caption: Gracz b1 przytrzymuje przycisk, żeby zostać uleczonym.
  medic_healed:
    alt: >-
      Ekran Medic Kit na niebiesko: biały krzyż, „DE VOLTA AO JOGO” (z powrotem w grze), b1,
      „Tratamento 1 de 2” (leczenie 1 z 2) i „Restam 3 ligaduras” (w apteczce zostały 3 leczenia).
    caption: Z powrotem w grze, po pierwszym z dwóch leczeń.
  # The screenshot viewer (the dialog at the end of the main page).
  viewer:
    label: Zrzut ekranu
    prev: Poprzedni zrzut ekranu
    next: Następny zrzut ekranu
    close: Zamknij
try:
  title: Wypróbuj już dziś
  intro: >-
    Sprzęt nie jest potrzebny: wspólny rdzeń działa na komputerze. Symulator odtwarza tryb w twojej
    przeglądarce: przytrzymuj przyciski drużyn, obserwuj ekran każdego urządzenia i śledź log zdarzeń. Polecenia
    poniżej wpisuje się w terminalu.
  compiler: Z kompilatorem C
  docker: Tylko z Dockerem
  then: >-
    Potem otwórz <code>http://localhost:8000</code>. Potrzebujesz Pythona 3.10+ z PyYAML.
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/simulator/README.md">Poradnik
    symulatora</a> opisuje wszystkie opcje.
  board:
    title: Na płytce
    text: >-
      <a href="{{ page.to.glossary }}#slownik-firmware">Firmware</a> Field Boksa, radiomodemu
      USB i modułu I/O jest napisany i wszystkie trzy działają w testach na komputerze. Firmware Field
      Boksa i modemu działa na prawdziwych płytkach Heltec V4.3 na stole warsztatowym: skrzynka dołącza do gier kontrolera
      terenu przez radio, za pośrednictwem drugiej płytki jako modemu, rozgrywa je do końca
      i przyjmuje aktualizacje firmware'u przez radio, a jej mały ekran pokazuje grę; firmware modułu nie
      działał jeszcze na płytce. Żeby wypróbować samą płytkę bez skrzynki, jest warsztatowa wersja firmware'u
      (klawisze przez kabel USB). Żeby zbudować skrzynkę i wgrać firmware, skorzystaj z
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">instrukcji
      budowy</a>;
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/README.md">poradnik
      firmware'u</a> buduje też modem i moduł.
  app:
    title: Na telefonie z Androidem
    text: >-
      <a href="https://github.com/vakaobr/atalaia-project/releases/tag/v0.9.0">v0.9.0</a> (6
      listopada 2026) to pierwsze wydanie na GitHubie z aplikacją: atalaia-app-0.9.0.apk, podpisany
      kluczem projektu, więc każde wydanie instaluje się na poprzednie. Odcisk SHA-256 certyfikatu
      to <code
      class="fingerprint">9C:35:0D:17:37:D6:C5:35:CD:3E:D1:04:28:8E:65:AD:7D:B4:FA:CE:8E:4E:6F:27:75:3B:7B:7C:38:40:A1:99</code>;
      Android odrzuca aktualizację podpisaną innym kluczem. Aplikację zainstalowaną ze starszej
      wersji debugowej trzeba najpierw raz odinstalować (instrukcje mówią, co się wtedy traci).
      Możesz też sam zbudować debugowy APK za pomocą Dockera i zainstalować go na telefonie z
      Androidem 8.0 lub nowszym albo w emulatorze Androida, jak wyjaśnia <a
      href="https://github.com/vakaobr/atalaia-project/blob/main/app/README.md#install-it-on-an-android-phone-from-windows">poradnik
      aplikacji</a>. Działała na emulatorach, jeszcze nie na prawdziwym telefonie.
  manuals:
    title: Gra i prowadzenie gry
    text: >-
      Instrukcje dla osób, które używają Atalaia, a nie dla programistów: dla <a
      href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/README.md">graczy,
      organizatorów, sędziów, operatorów skrzynek i telefonów-rekwizytów, administratorów terenu i
      osób, które budują skrzynki</a>, po angielsku i po portugalsku, z jednostronicowym szybkim
      startem. Opisują, co oprogramowanie pokazuje dziś, i zaznaczają, czego nie wypróbowano jeszcze
      na terenie gry.
roadmap:
  title: Roadmapa
  intro: >-
    Sześć faz, każda zamykana prawdziwym testem w terenie: to jej bramka. Oprogramowanie wyprzedza
    sprzęt: fazy od 1 do 3 są gotowe w oprogramowaniu (prawdziwe płytki rozgrywają całe gry na stole
    warsztatowym, a aplikacja na iOS przeszła swoją listę kontrolną na iPhonie); fazy 4 i 5 są
    zbudowane w oprogramowaniu. Bramki czekają na zbudowane skrzynki, testy w terenie, prawdziwy
    serwer i klucz rejestru projektu. Najnowsze wydanie to v0.9.0 (6 listopada 2026): kontroler
    uwalnia skrzynki, które utknęły w zakończonej grze (na razie jeden test na stole warsztatowym),
    do tego zasady Wi-Fi skrzynki i pierwsza aplikacja na Androida podpisana kluczem projektu.
  more: Pełna roadmapa, z zawartością każdej fazy i jej bramką →
  # Status tags, from docs/phase-*/STATUS.md: done (gate met), software done (gate waits for
  # hardware), in progress, designed (research, architecture and plan written; no code).
  done: Gotowe
  software: Oprogramowanie gotowe
  # The parts of each phase on the roadmap page. Each phase: short (one line, also on the main
  # page), done (bullets), next (bullets), gate; a phase with a long done list also has groups
  # (g_*: title and items) that fold into a <details> under the first few bullets.
  part_done: Co jest gotowe
  part_next: Co dalej i na co to czeka
  part_more: Wszystko inne, co jest gotowe, według tematu
  status_link: Szczegółowy status fazy w repozytorium →
  p0:
    title: Podstawy
    short: >-
      Wspólny rdzeń, piaskownica Lua, kodek Skirmesh-RF i symulator w przeglądarce. Bramka zaliczona.
    done:
      - Wspólny rdzeń, czyli logika gry, którą uruchamia każda platforma.
      - <a href="{{ page.to.glossary }}#slownik-lua">Piaskownica Lua</a>, w której działają skrypty trybów gry.
      - <a href="{{ page.to.glossary }}#slownik-skirmesh-rf">Kodek Skirmesh-RF</a>, format wiadomości radiowych.
      - Symulator w przeglądarce, który uruchamia Domination i Bombę.
    gate: >-
      Bramka: symulator uruchamia Domination i Bombę ze skryptów Lua. <strong>Zaliczona.</strong>
  p1:
    title: Jedna skrzynka
    short: >-
      Firmware Field Boxa i instrukcja budowy; prawdziwa płytka rozgrywa całe gry na stole
      warsztatowym, teraz z ekranem, klawiaturą i przyciskami podłączonymi luźnymi przewodami
      (zdjęcie i klip na stronie budowy). Opuszczenie zakończonej gry na samej skrzynce weszło do
      v0.9.0, jeszcze niewypróbowane na prawdziwej skrzynce. Wciąż czeka na zmontowaną skrzynkę.
    done:
      - Firmware ESP32 dla Field Boxa, z presetami na urządzeniu, działający w emulatorze.
      - Mały ekran skrzynki pokazuje pasek przejmowania, punkty i czas utrzymania, w czterech językach.
      - Instrukcja budowy ze schematami połączeń.
      - "Pierwsza płytka (Heltec V4.3, 20 października 2026) na stole warsztatowym: uruchamia się, zasila radio,
        odczytuje swoje przyciski i rozgrywa całe gry, łącznie z Bombą (uzbrajanie, rozbrajanie, upływ
        czasu), na własnym małym ekranie."
      - "Pasek czasu gry: podczas gry na czas pasek u dołu małego ekranu pokazuje, ile czasu zostało, a OLED pokazuje zegar. W oprogramowaniu, jeszcze niewidziany na prawdziwym panelu."
      - "Konfiguracja, którą scenariusz wysyła do skrzynek, jest wysyłana ponownie, aż każda skrzynka ją potwierdzi, a skrzynka teraz wysyła to potwierdzenie. Tylko w oprogramowaniu i testach na komputerze, nie na prawdziwej płytce."
      - "Zmiana terenu w menu administratora skrzynki przenosi przypisaną skrzynkę na inny teren, za pomocą jego kodu. Tylko testy na komputerze, nie na prawdziwej płytce."
      - "Koniec z logo terenu na skrzynce: jako ekran startowy pokazuje wieżę Atalaia, plik, który można podmienić przy budowie (obrazy wydań zawsze mają wieżę, a build wydania to sprawdza). To pobieranie logo wyczerpywało pamięć skrzynki na stole warsztatowym. Skrzynka, która zachowała stare logo, usuwa je przy pierwszym uruchomieniu (testy na komputerze)."
      - "Większa tablica partycji: dwa sloty firmware'u skrzynki mają po 4 MB (obraz wypełniał 93 % z 2 MB), a ustawienia i klucze zostają tam, gdzie były. Tylko w testach na komputerze i buildach, niewgrane na płytkę. Skrzynka ze starą tablicą potrzebuje jednego wgrania przez USB; potem aktualizacje przez radio działają jak dotąd."
      - "Field Box jako iBeacon: od dołączenia do końca gry skrzynka nadaje beacon Bluetooth (co 500 ms, nigdy gdy używa Wi-Fi), więc telefon w pobliżu może umieścić gracza na piętrze lub w pomieszczeniu. Własny identyfikator terenu jest wyprowadzany z jego klucza dołączenia, a GM może wyłączyć skrzynki jako beacony, dla całego terenu lub dla pojedynczej skrzynki. Pamięć wewnętrzną skrzynki przebudowano po tym, jak na stole warsztatowym zabrakło jej przy dołączaniu do gry (Wi-Fi zawiodło, potem reset watchdoga): zmierzone na stole, 241 KB wolne przy starcie i co najmniej 102 KB w grze z włączonym beaconem, a CI odrzuca build, jeśli budżet za bardzo się skurczy. Jeszcze nie sprawdzono, czy telefon słyszy beacon prawdziwej skrzynki."
      - "Po odmowie lub błędzie aktualizacji albo pobrania trybu ekran skrzynki wraca po 8 sekundach do ekranu stanu (na stole warsztatowym odmowa zostawała na ekranie, aż ktoś spojrzał). Tylko testy na komputerze."
      - "Polecenia konsoli szeregowej, które dają skrzynce klucz dołączenia lub uruchamiają aktualizację (@joinkey, @update), w buildzie wydania wymagają PIN-u administratora i odmawiają, dopóki żaden nie jest ustawiony; build warsztatowy zostawia je otwarte dla skryptów stołu. Tylko testy na komputerze, nie na prawdziwej płytce."
      - "Pierwszy warsztatowy build Field Boxa (31 października 2026): płytka Heltec V4 z ekranem TFT 2,8\", OLED-em, klawiaturą 4×3 i przyciskami drużyn, na luźnych przewodach bez obudowy, rozgrywająca Domination z kontrolerem stołu. Jest <a href=\"{{ page.to.build }}#field-box-first-build\">zdjęcie i klip</a>."
      - "Duży ekran pasuje teraz do małego: pasek przejmowania, czas utrzymania liczony od przejęcia i punkty każdej drużyny w rogu, w Domination, Master i Satelity (nagłówki MASTER / SATELLITE; master pokazuje sumę drużyny), Progressive Domination i VIP Payload. Widziane na stole warsztatowym w Domination (klip na stronie budowy); pozostałe trzy tryby tylko w obrazach referencyjnych firmware'u i testach."
      - "Duży ekran pokazuje ekran startowy, wieżę i wersję firmware'u, tak jak mały ekran, zamiast pozostawać pusty do pierwszego ekranu gry. Testy na komputerze i obraz referencyjny, jeszcze nie sprawdzone na innej płytce niż pierwsza warsztatowa."
      - "Zawodna magistrala I2C nie restartuje już skrzynki: klawiatura, mały ekran, czytnik NFC i wskaźnik baterii używają nowszego sterownika ESP-IDF z limitami czasu, resetem magistrali i wycofaniem, które odstawia na bok wadliwą część, więc zepsuta klawiatura odczytuje się jako brak klawisza, a gra toczy się dalej. Restart zgłasza teraz swój prawdziwy powód (zasilanie, spadek napięcia, oprogramowanie, awaria, watchdog) zamiast zawsze „zasilanie”, a konsola GM mówi „Skrzynka uległa awarii i zrestartowała się”. Znalezione na stole warsztatowym: klawiatura ze złymi lutami zrestartowała płytkę sześć razy w trzy minuty. Tylko testy na komputerze; test poprawki na stole jest jeszcze do zrobienia."
      - "Tekst ekranowy, który się nie mieści, jest odrzucany przy sprawdzaniu trybu, a tekst, którego nie da się narysować, pokazuje „?” zamiast pustego miejsca (długi tekst w czterech językach znikał po cichu na skrzynce). Testy na komputerze."
      - "Liczba jeden przyjmuje liczbę pojedynczą („1 ponto”, nie „1 pontos”) na ekranach skrzynki, w aplikacji, konsoli GM i stronach obsługi. Testy w oprogramowaniu."
      - "Skrzynka, która utknęła w grze zakończonej, gdy była wyłączona, może ją opuścić na samej skrzynce: przytrzymaj * przez 3 sekundy, wpisz PIN administratora i wybierz Leave the game (albo @leave na jej konsoli USB). Zachowuje teren, Wi-Fi i tryby. W v0.9.0 (6 listopada 2026); jeszcze niewypróbowane na prawdziwej skrzynce."
    next:
      - Zbudowana skrzynka, która przechodzi 2-godzinną grę klubową bez restartów.
      - "Zobaczenie paska czasu na prawdziwym panelu."
      - "Wypróbowanie ponownego wysyłania konfiguracji i zmiany terenu na prawdziwej płytce."
      - "Usłyszenie beaconu Field Boxa prawdziwym telefonem i uruchomienie Wi-Fi przy dołączaniu do gry z nowym budżetem pamięci."
      - "Wgranie nowej tablicy partycji na prawdziwą płytkę (jedno wgranie przez USB, bez kasowania, dla skrzynki ze starą)."
      - "Utwardzony obraz wydania (szyfrowanie flash, secure boot): spisany tylko jako plan, nic nie zbudowano ani nie wypróbowano na płytce."
      - "Wypróbowanie obsługi błędów I2C na płytce ze złym połączeniem klawiatury oraz ekranu startowego i nowych ekranów na innych płytkach niż pierwsza warsztatowa."
      - "Wypróbowanie opuszczania gry na prawdziwej skrzynce."
    gate: >-
      Bramka: jedna skrzynka przechodzi 2-godzinną grę klubową bez restartów. <strong>Otwarta</strong>, dopóki
      nie zrobi tego zbudowana skrzynka.
  p2:
    title: Sieć terenu
    short: >-
      Skirmesh-RF przez LoRa, kontroler terenu, API, konsola GM i pakiet trybów, przetestowane w
      oprogramowaniu; na stole warsztatowym prawdziwe płytki rozgrywają całe gry z kontrolerem przez
      radio, a to, co wykazał stół, jest poprawione w oprogramowaniu. Uwalnianie skrzynek, które
      utknęły w zakończonej grze, weszło do v0.9.0 i przeszło pierwszy test na stole warsztatowym.
      Czeka na 5 zbudowanych skrzynek na terenie.
    done:
      - Szyfrowany protokół radiowy Skirmesh-RF i modem radiowy USB.
      - Kontroler terenu z jego API.
      - Konsola organizatorów z tablicą wyników.
      - Dołączanie do gry kartą NFC lub kodem QR.
      - Firmware skrzynek rozmawiający z kontrolerem.
      - "Pakiet trybów: Hold-All Domination (punkty tylko przy utrzymaniu wszystkich skrzynek), Last Stand
        (odliczanie do porażki przy utrzymaniu jednej z trzech), osobne kody uzbrajania dla drużyn w Bombie oraz
        modyfikator Kody (kody z klawiatury dające punkty, podpowiedzi lub odblokowania, a GM dowiaduje się, kto
        ich użył)."
      - "Wszystko przetestowane w symulatorze, emulatorze i na komputerze, łącznie z całymi grami; na
        stole warsztatowym prawdziwe płytki rozgrywają całe gry z kontrolerem przez radio: zaproszenia,
        przejęcia, parowanie kodem, aktualizacje przez radio, pobranie brakującego trybu."
      - "Skrzynki słuchają, zanim zaczną nadawać: skrzynka sprawdza, czy kanał jest wolny, zanim wyśle, więc
        mniej wiadomości się zderza. W symulatorze teren z 20 skrzynkami odbiera 89 % aktualizacji zamiast 65 %."
      - "GM może ustawić lub zwolnić właściciela skrzynki także w Domination, tak jak w innych trybach."
      - "Kontroler może wysyłać własne ramki radiowe pojedynczo, w odstępach. Zbudowane i wyłączone, dopóki test w terenie nie zdecyduje."
      - "Kontroler na Pi od razu przerywa aktualizację firmware'u, gdy radio odrzuci ofertę."
      - "Skonfigurowana skrzynka może wrócić do konfiguracji Wi-Fi, z pozycji menu chronionej PIN-em administratora lub poleceniem w konsoli USB. Strona konfiguracji jest po angielsku, portugalsku, niemiecku i w chińskim tradycyjnym, a telefony otwierają ją same."
      - "Karta Gra w konsoli pokazuje graczom kod QR tablicy wyników."
      - "Scenariusze mogą być po niemiecku i w chińskim tradycyjnym, łącznie z nazwami celów."
      - "<strong>Sabotaż</strong>, nowy tryb: Bomba w rundach, aż skończy się czas gry. Atakujący uzbrajają, obrońcy rozbrajają; wybuch to punkt dla atakujących, rozbrojenie punkt dla obrońców, potem skrzynka odpoczywa i zaczyna się następna runda. Wygrywa drużyna z większą liczbą punktów, równa liczba punktów to remis. W symulatorze i testach oraz wśród presetów Field Boxa; jeszcze nie na prawdziwej płytce."
      - "Mały ekran modemu radiowego USB mówi po portugalsku, angielsku, niemiecku i w chińskim tradycyjnym, jak ekran skrzynki. Tylko testy na komputerze, nie na prawdziwej płytce."
      - "Formularze konsoli GM zachowują to, co organizator wpisał, aż do zapisania: check-in gracza ani zegar konsoli nie przywracają już zapisanych wartości."
      - "Zmiana kanału terenu nie zostawia już wolnych skrzynek na lodzie: kontroler mówi im, dokąd przeszedł (nowa zapieczętowana wiadomość radiowa MOVE, powtarzana trzy razy na starym kanale), a Znajdź skrzynki może przeszukać ostatnie cztery kanały w poszukiwaniu skrzynek, które ją przegapiły. Znalezione na stole warsztatowym, gdzie skan radia zmienił kanał, a bezczynna skrzynka nie słyszała już nic. Zbudowane w obu kontrolerach, symulatorze i kodzie skrzynki; sprawdzenie na dwóch płytkach jest jeszcze do zrobienia."
      - "Start, pauza lub wznowienie docierają do skrzynek w około sekundę, a nie do 30: kontroler powtarza stan jako wiadomość TIME po 1, 2,5, 5 i 10 sekundach (na stole warsztatowym skrzynka dowiedziała się o starcie 21 sekund za późno). Sprawdzenie na dwóch płytkach jest jeszcze do zrobienia. W modelu czasu nadawania powtórzenia, MOVE i przeszukanie kosztują kontroler około 2 sekund nadawania w typowej godzinie na domyślnym podpaśmie."
      - "Konsola GM mówi, co zmiana kanału robi z wolnymi skrzynkami (ile z trzech MOVE zostało wysłanych, potem że kontroler się przeniósł), a Ustawienia mają przycisk Szukaj skrzynek, który pokazuje wynik przeszukania. Przeszukania są ograniczone na godzinę w podpasmach z wypełnieniem poniżej 10 % (5 % budżetu podpasma), a konsola mówi to, gdy odmawia, i kiedy następne będzie możliwe. W oprogramowaniu, w obu kontrolerach."
      - "Przewidywany wynik podąża za przejęciem: między dwiema wiadomościami STATE skrzynki kontroler liczy dalej dla drużyny wskazanej w zdarzeniu przejęcia, aż do następnego STATE skrzynki. Na stole warsztatowym prognoza zawodziła, gdy STATE ginął tuż po przejęciu; z tą zmianą to samo ustawienie na stole przeszło, a kara skrzynki też została sprawdzona na stole."
      - "Koniec gry na skrzynce kończy grę: w trybie bez logiki terenu na kontrolerze (limit czasu Sabotażu, Bomba) pierwsze game.end od skrzynki z tej gry kończy ją, ze zwycięzcą wskazanym przez skrzynkę albo remisem. W Bombie / Rush wybuch kończy teraz grę zwycięstwem drużyny, która uzbroiła bombę; rozbrojenie nie. Znalezione na stole warsztatowym z Sabotażem, a wybuch Bomby też został tam sprawdzony."
      - "Nagranego polecenia radiowego nie da się już odtworzyć później: każdy odbiornik (skrzynka, modem USB i oba kontrolery) prowadzi okno powtórzeń dla każdego nadawcy, a skrzynka odrzuca start, pauzę, wznowienie, koniec lub TIME starsze niż ostatnie zastosowane. Skrzynka, która straciła zapis epok, losuje nową epokę zamiast używać nonce'ów ponownie. W eterze nic się nie zmienia: starsze skrzynki dalej działają, ale pozostają narażone, dopóki nie zostaną zaktualizowane. Przetestowane w symulatorze i na komputerze, ze wspólnymi wektorami w C, Pythonie i Darcie; nie próbowano odtwarzania przez radio na prawdziwych płytkach."
      - "Utwardzenie kontrolerów terenu po przeglądzie bezpieczeństwa: limity rozmiaru żądań, tokeny GM i graczy odrzucane przez zwykłe HTTP, gdy HTTPS jest włączone (konsola otwiera się pod https://&lt;controller&gt;:8443/console/), MQTT terenu na TLS (port 8883; zwykły 1883 tylko na loopbacku Pi), TLS dla kanału ATAK obsługi, HSTS, utwardzona jednostka usługi na Pi oraz odwoływanie podpisanych trybów, które w razie błędu blokuje (brakująca lub nieczytelna lista nic nie instaluje; kontroler offline zachowuje ostatnią listę przez 30 dni). Przetestowane na komputerze, nie na prawdziwym Pi ani telefonie na terenie."
      - "Skrzynka, która straciła zapis epok i dlatego wróciła z losową wysoką epoką, zostaje znaleziona ponownie: odbiornik, który nie może otworzyć HELLO lub TIME, przeszukuje resztę zakresu epok (po kawałku na przeszukanie, w ramach istniejącego budżetu), a kontroler, który słyszy taką skrzynkę, podaje jej epokę pozostałym w nowej wiadomości CMD, która może epokę tylko podnieść. Wznowiona gra bez zapisu też zaczyna od losowej epoki kontrolera, więc nonce nigdy się nie powtarza. Starsze skrzynki ignorują nową wiadomość. Przetestowane w symulatorze i na komputerze; nie próbowano na prawdziwych płytkach."
      - "Druga utrata zapisu epok nie może wylosować niższej epoki: skrzynka, Pi i kontroler na telefonie zachowują najwyższą kiedykolwiek użytą epokę osobno od zapisu dla każdego klucza, a losowanie zaczyna się powyżej niej; kontroler, który nadawał w grze, nigdy nie jest zapraszany ponownie pod starym identyfikatorem węzła (dostaje nowy); a urządzenie Wi-Fi dostaje teraz CMD podający epokę kontrolera i przekazuje je swojemu modułowi (oba kontrolery). RFC 0001, poprawka 25. Przetestowane w symulatorze i na komputerze; nie próbowano na prawdziwych płytkach."
      - "<code>rand()</code> trybu jest inicjowane z klucza gry oprócz ziarna gry i identyfikatora węzła, więc to, co API pokazuje graczom, już go nie zdradza (kody Hacking Terminal, drużyny w Oknach tarcz), a ziarno gry nie jest już pokazywane graczom ani na tablicy wyników. Ta sama gra odtwarza się identycznie, ale gra nagrana wcześniej odtworzy się z innymi wartościami losowymi: nie aktualizuj skrzynek w środku gry. Wspólne wektory testowe w C, Pythonie i Darcie; nie próbowano na płytkach."
      - "Piaskownica Lua zamknęła dziury znalezione w przeglądzie narzędziem do sprawdzania pamięci: funkcje tablic, korutyny i długie łańcuchy wywołań zwrotnych są limitowane, głębokość stosu C jest ograniczona dla ESP32, a identyfikator węzła lub timer poza zakresem już się nie przekręca. Wartości stosu są wyliczone, jeszcze niezmierzone na płytce."
      - "Zysk anteny jest opcją buildu (<code>--antenna-dbi</code>, od 0 do 20 dBi, domyślnie 2): skrzynka z mocniejszą anteną obniża moc przewodzoną o ten zysk, zaokrąglony w dół, więc moc wypromieniowana mieści się w limicie podpasma. Tylko testy na komputerze."
      - "Kod dostępu do transmisji na żywo nie jest już w adresie strony: konsola wysyła go w nagłówku, a aplikacja w nagłówku Authorization, a logi kontrolerów i serwera strony zaciemniają wartości wyglądające na kody w adresach (stary adres działa jeszcze przez jeden okres przejściowy). Teren, którego logi były udostępniane, powinien zmienić kody GM i kody tylko do odczytu."
      - "Wyniki drużyn bez identyfikatorów graczy są przechowywane 365 dni także w obu kontrolerach (historia gier 90 dni), a GM może je czytać, tylko do odczytu. Przetestowane na komputerze."
      - "Jeden przewodnik konfiguracji modemu radiowego, od części do skrzynki dołączającej do gry: gotowe wydanie lub własny build, wgrywanie na Windows, Linux i macOS, port, sprawdzenia i tabela rozwiązywania problemów (<a href=\"https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md\">Konfiguracja modemu radiowego</a>). Wypróbowane na stole warsztatowym z kontrolerem w Dockerze na WSL2; nie na Raspberry Pi ani macOS i nie w terenie."
      - "Kontroler, który stracił zapis epok, losuje nową epokę z dolnej połowy przestrzeni nad swoim minimum, z marginesem (szerszym, jeśli brakuje pliku epok), więc powtarzane utraty, czternaście lub więcej z rzędu, nie mogą wyczerpać zakresu. Zaczęło się od niestabilnego testu, a okazało się błędem produktu. Testy na komputerze; Field Box losuje teraz w ten sam sposób (testy na komputerze)."
      - "Kontroler terenu znosi zły zegar (Raspberry Pi 4 nie ma własnego zegara i może wystartować z rokiem 1970): czasy gry i limity czasu już od niego nie zależą, konsola ostrzega GM-a, który ustawia czas z konsoli (tylko do przodu), jego certyfikaty pozostają ważne dla telefonów z właściwym czasem, a czyszczenie danych czeka. Testy na komputerze, jeszcze nie na prawdziwym Pi."
      - "Krótkotrwałe tokeny dostępu: GM może dać telefonowi sędziego, przebiegowi testowemu lub ekranowi dla widzów token, który tylko czyta, prowadzi grę lub zarządza sędziami, dla jednej gry lub wszystkich, domyślnie na 8 godzin (najwyżej 7 dni), i natychmiast go odwołać. Testy na komputerze."
      - "Aktualizacje przez radio dla własnych buildów stołu warsztatowego: warsztatowy klucz wydań, zaufany na stole obok kluczy projektu, podpisuje codzienne buildy; 2 listopada 2026 skrzynka przeszła z jednego buildu na następny z konsoli w około 22 sekundy, potwierdzone po jej autoteście."
      - "Kontroler uwalnia skrzynkę, która utknęła w grze zakończonej, gdy była wyłączona: modem USB ją zgłasza, kontroler ponownie wysyła koniec tej gry, a konsola GM pokazuje takie skrzynki na liście skrzynek w zakończonej grze, z przyciskiem do ich uwolnienia. Kontroler, który stracił swoją grę (przeinstalowany albo z utraconymi danymi), może uwolnić każdą skrzynkę spoza trwającej gry. W v0.9.0 (6 listopada 2026). Jeden test na stole warsztatowym zaliczony 6 listopada 2026: skrzynkę Heltec V4.3 wyłączono w trakcie gry, gra się skończyła, a po ponownym włączeniu kontroler uwolnił ją w kilka sekund. Modem potrzebuje firmware'u z v0.9.0, wgranego przez USB."
      - "Konfiguracja Wi-Fi skrzynki: @wifi przyjmuje nazwę i hasło Wi-Fi ze spacjami, w cudzysłowie, a strona konfiguracji odrzuca to, czego skrzynka nie może użyć: nazwę dłuższą niż 32 bajty albo hasło, które nie jest puste, nie ma 8–63 znaków i nie jest 64 cyframi szesnastkowymi. W v0.9.0 (6 listopada 2026)."
    next:
      - Płytki radiowe i 5 zbudowanych skrzynek do testu w terenie.
      - Test w terenie z 20 skrzynkami, z włączonym i wyłączonym nasłuchem przed nadawaniem.
      - "Czy włączyć rozkładanie nadawania kontrolera, zdecyduje test w terenie z 20 skrzynkami."
      - "Sprawdzenie na dwóch płytkach, że zmiana kanału zachowuje bezczynną skrzynkę i że start dociera do niej w około sekundę (procedura jest spisana)."
      - "Wypróbowanie okna powtórzeń i utwardzonych kontrolerów na prawdziwych płytkach i prawdziwym Pi (nagrane polecenie odtworzone na stole warsztatowym)."
      - "Wyczyszczenie zapisu epok skrzynki na dwóch płytkach warsztatowych, by zobaczyć, że zostaje znaleziona ponownie, dwa razy z rzędu i z dawnym liderem, który ponownie dołączył (procedura jest spisana)."
      - "Ustawianie zegara i używanie tokenów dostępu na prawdziwym Raspberry Pi na terenie bez internetu."
      - "Wypróbowanie uwalniania skrzynek i zasad Wi-Fi na kolejnych płytkach (uwalnianie przeszło jeden test na stole warsztatowym 6 listopada 2026)."
    gate: >-
      Bramka: 5 skrzynek na obiekcie <a href="{{ page.to.glossary }}#slownik-cqb">CQB</a> i na terenie
      otwartym, zero utraconych przejęć. <strong>Otwarta.</strong>
  p3:
    title: Android i gracze
    short: >-
      Urządzenia na Androidzie, moduł I/O, aplikacja dla graczy i tryby wymagające telefonów: gotowe w oprogramowaniu,
      łącznie z iOS (sprawdzone na iPhonie). Test w terenie czeka na prawdziwe telefony i moduły.
    done:
      - "<strong>Aplikacja</strong> dla graczy, sędziów i GM-a, po portugalsku i angielsku, na
        Androida i iOS (wersja na iOS przeszła swoją listę kontrolną na iPhonie)."
      - Telefon z Androidem działa jako skrzynka, z dowolnym trybem i jego własnymi ekranami, i dołącza do gry
        kodem QR, kartą NFC lub tekstem.
      - "<strong>Telefon jako kontroler terenu</strong>, gotowy w oprogramowaniu i czekający na
        prawdziwy telefon: sam prowadzi grę i usługi terenu."
      - >-
        <strong><a href="{{ page.to.glossary }}#slownik-android-prop">Moduł I/O</a></strong>:
        firmware, który użycza telefonowi przycisków, klawiatury, świateł, syreny, czytnika NFC i
        radia LoRa płytki Heltec.
      - "<strong>Tryby korzystające z telefonów i tagów</strong>: Kill Confirmed, Respawn i życia,
        Check-in, Medic Kit i Money Factory."
    g_modes:
      title: Tryby i ekrany
      items:
        - Kill Confirmed, Respawn i życia oraz Check-in odczytują podpisane tagi NFC graczy.
        - "Medic Kit: trafiony gracz skanuje swój tag i przytrzymuje przycisk, by zostać uleczonym, z
          ograniczoną liczbą leczeń."
        - "Money Factory: fabryki produkują pieniądze, dopóki drużyna je utrzymuje; gracze zbierają je
          swoim tagiem i wpłacają w innej skrzynce, a kontroler pilnuje, ile każdy niesie."
        - Ekrany trybów opisane w YAML, rysowane tak samo przez Field Box i aplikację.
    g_players:
      title: Gracze i sędziowie
      items:
        - "Gracze robią check-in na terenie, skanując wydrukowany plakat (bez konta, bez internetu),
          podają, jakich replik użyją, i widzą, czy przeszli chrono."
        - >-
          <a href="{{ page.to.glossary }}#slownik-chrono">Check-in z chrono</a>: energia, limity dla
          klas, wyrywkowe kontrole, pomiary podpisane przez sędziego. Sędziowie pracują z listy „repliki do
          chrono”, a ich podpisane pomiary oznaczają każdą replikę jako dopuszczoną lub odrzuconą; mają też
          rejestr replik i tagi graczy.
        - Gracze mogą udostępniać swoją pozycję podczas gry, a kontroler decyduje, kto ją widzi.
        - "Teren lub klub z własnym kontrolerem może pokazywać swoje logo, tapetę i kolor w
          aplikacji, na tablicy wyników i na plakacie oraz nadawać swoim drużynom nazwy i herby."
        - "Konsola GM informuje, gdy plakat check-in zmienił się po wydrukowaniu."
        - "Ekrany sędziego i chrono mówią, co aplikacja naprawdę robi, a listy limitów są przetłumaczone."
        - "Aplikacja trzyma więcej sekretów zapieczętowanych w Android Keystore: klucz strony, sekrety graczy i login do strony."
        - "Tagi NFC graczy są podpisywane przez kontroler terenu i zapisywane z konsoli GM, kontrolera na telefonie lub aplikacji sędziego. Sędziowie nie trzymają już do tego klucza terenu."
        - "Etykiety replik: aplikacja pokazuje, udostępnia lub drukuje naklejkę QR każdej repliki, a konsola GM drukuje je dla wszystkich po check-inie. Kolejka sędziego je skanuje."
        - "Pozycje w budynkach: GM umieszcza beacony BLE na planie, a telefon, który słyszy jeden z nich, zgłasza swoje pomieszczenie zamiast GPS. Na Androidzie, w oprogramowaniu i z atrapami, nie próbowano z prawdziwymi beaconami. Na iPhonie wtyczka oparta na CoreLocation Apple robi to samo, gdy aplikacja jest na ekranie (w przeciwnym razie GPS i ostatnie piętro); jest zbudowana i kompilowana w CI, nie próbowano jej na iPhonie."
        - "Aplikacja śledzi grę z kodu QR tablicy wyników, także gdy kontroler na telefonie serwuje HTTPS z własnym CA terenu. W oprogramowaniu, nie próbowano na prawdziwym telefonie."
        - "Gracz podaje, na którym jest piętrze, i widzi plan terenu z pozycjami, które może widzieć."
        - "Historia gier w aplikacji: gry, w których gracz brał udział, od najnowszych."
        - "Logowanie przez Google, Microsoft, Apple lub passkey w aplikacji, z ekranem konta. Android, a na iOS w Swifcie (przeglądarka logowania społecznościowego jako ASWebAuthenticationSession, passkeye przez poświadczenia platformy Apple; passkeye na iOS są włączane przy budowie i wymagają płatnego programu Apple). Część iOS jest kompilowana w CI i nie była uruchamiana na iPhonie; logowania w aplikacji nie próbowano na prawdziwym telefonie (stronę serwera strony wypróbowano z Google i Microsoft, zob. faza 4)."
        - "Plan terenu gracza może pokazywać siatkę terenu i własną komórkę gracza."
        - "Sędzia może powiązać naklejkę NFC z repliką przy jej rejestracji."
        - "Telefon sędziego nie przechowuje już klucza dołączenia terenu: robią to tylko urządzenie do gry (jego karta dołączenia) i kontroler na telefonie, a aktualizacja usuwa go z telefonu sędziego."
        - "Linki do tablicy wyników przypinające własne CA terenu są zapamiętywane dla każdego terenu i zapominane, gdy CA się zmieni."
        - "Gdy gra na żywo jest otwarta w widoku gracza, usługa pierwszoplanowa Androida z powiadomieniem utrzymuje aplikację, więc wibracje działają przy zamkniętej aplikacji lub wyłączonym ekranie. Nie na iOS. Nie próbowano na prawdziwym telefonie."
        - "Field Boxy liczą się jako beacony: umieszczona skrzynka rejestruje się jako beacon obok beaconów GM-a, a telefon, który już udostępnia pozycję, odbiera zmiany rejestru w trakcie gry. W oprogramowaniu, nie próbowano z telefonem i prawdziwą skrzynką."
        - "Informacja o prywatności w aplikacji: monit Przeczytaj i potwierdź, gdy konto ostatnio widziało inną wersję, informacja w języku aplikacji, nic nie jest blokowane. Aplikacja może założyć konto (hasło lub społecznościowe) po pokazaniu informacji, z polem „Mam 16 lat lub więcej”; młodsi gracze robią check-in na terenie bez konta. Rejestracja społecznościowa niesie wersję informacji, którą osoba widziała, a logowanie dalej działa ze starszym serwerem hostowanym samodzielnie. Powiązanie chrono między terenami hostowanego huba (kod jednorazowy) pokazuje się tylko w trybie hostowanym. W oprogramowaniu."
        - "Sprawdzenie karty przy check-inie: gdy teren sprawdza członkostwo, check-in czeka, aż sędzia lub GM zaznaczy „karta okazana, zgadza się”, mając fizyczną kartę w ręku; numer członkowski jest wtedy usuwany z kontrolera (werdykt i data ważności zostają), a sędzia może przepuścić kogoś bez karty, z zapisanym powodem i nigdy numerem. W konsoli, kolejce sędziego w aplikacji i obu kontrolerach. Tylko oprogramowanie."
        - "Udostępnianie pozycji to osobny, niezaznaczony wybór przy check-inie (w aplikacji i przy ręcznym check-inie w konsoli), z informacją, kto ją widzi; odmowa nie blokuje ani check-inu, ani gry, a gracz może to włączyć lub wyłączyć w każdej chwili. Bez tego kontroler odrzuca pozycje. Tylko oprogramowanie."
        - "Przegląd bezpieczeństwa aplikacji: przypięte CA terenu to dokładnie jeden certyfikat, brak niezaszyfrowanego HTTP w całej aplikacji na Androidzie (tylko loopback, host emulatora, 192.168.4.1 i atalaia.local), wydanie APK, które nigdy przypadkiem nie jest podpisane kluczem debugowania, oraz bilet logowania społecznościowego powiązany z instancją aplikacji. Nie próbowano na prawdziwym telefonie; klucz podpisywania wydań maintainer musi jeszcze utworzyć."
        - "Lista zdarzeń i historia gier gracza pomijają zdarzenia porządkowe, które nie mają tekstu dla graczy (skrzynka potwierdzająca konfigurację, węzły online lub offline, skany tagów, trafienia w tarcze), zamiast pokazywać surowe nazwy typów."
    g_props:
      title: Urządzenia do gry i moduł I/O
      items:
        - "Urządzenie na Androidzie bierze udział w grze kontrolera przez Wi-Fi terenu lub przez jego
          radio za pośrednictwem modułu I/O."
        - "Firmware modułu użycza telefonowi przycisków drużyn, klawiatury, świateł, syreny,
          czytnika NFC, przełącznika obudowy i radia LoRa płytki Heltec, przez USB lub Bluetooth."
        - "Aplikacja sama łączy się ponownie z utraconym modułem I/O; gdy nie może lub odpowiada inny moduł, administrator urządzenia łączy ten sam moduł ponownie z menu gry, bez restartu gry. Nie próbowano z prawdziwym modułem."
        - "Urządzenia na Androidzie pobierają podpisane pakiety trybów ze swojego kontrolera, tak jak skrzynki. W oprogramowaniu."
        - "Konsola GM może wysłać ustawienia modułu I/O przez radio: kolory czterech przycisków, jasność pierścienia LED, głośność i to, czy przełącznik obudowy się zgłasza. Moduł uwierzytelnia polecenie jak każde inne, zachowuje ustawienia we flashu i odpowiada; kontroler wysyła je ponownie, aż usłyszy odpowiedź. Wcześniej ustawiano je przy budowie firmware'u. W oprogramowaniu i z kodem modułu na komputerze, nie próbowano z prawdziwym modułem."
        - "Parowanie telefonu z modułem I/O przez Bluetooth wymaga 6-cyfrowego kodu, który moduł pokazuje na małym ekranie, więc nikt nie może wcisnąć się pomiędzy; telefon sparowany starym sposobem jest raz proszony o ponowne sparowanie, a przycisk PRG modułu zapomina wszystkie telefony. W oprogramowaniu i w testach na komputerze, nie próbowano z prawdziwym modułem."
        - "Kara skrzynki urządzenia na Androidzie dociera teraz do kontrolera, przez łącze Wi-Fi i łącze radiowe. W oprogramowaniu."
        - "Moduł I/O użycza telefonowi swoich prostych wyjść (syrena lub pilot wytwornicy dymu przez
          przełącznik przekaźnikowy RC, na GPIO 33, potem 1) oraz portu rozszerzeń: trafień modułu tarczy i przekaźników
          modułu wyjść w module zbudowanym, by ich użyczać. Gra na telefonie przełącza je według zasad
          skrzynki, moduł wyłącza je, gdy telefon zniknie, a konsola GM pokazuje wyjścia i moduły
          urządzenia. W firmware i z kodem modułu na komputerze, nie próbowano z prawdziwym modułem."
    g_controller:
      title: Telefon jako kontroler terenu
      items:
        - "Silnik gry, z field.lua trybu na wspólnym rdzeniu, brokerem MQTT i
          filtrem pozycji; REST API, transmisja na żywo i tematy MQTT; gry zachowane po
          restarcie; dane dołączenia."
        - "Urządzenia na Androidzie w jego Wi-Fi, moduł I/O jako radio, check-in na terenie z tokenami graczy,
          lista „repliki do chrono” i pozycje graczy. Sprawdzone tymi samymi przypadkami kontraktowymi
          co kontroler na Pi i uruchomione z własnym kodem modułu i Field Boxa na
          komputerze."
        - "Jego ekran: rola na ekranie głównym aplikacji, działanie przy wyłączonym ekranie, konsola GM
          serwowana z aplikacji i HTTPS z CA terenu utworzonym na telefonie."
        - "Plan terenu (plan dla każdego poziomu, jego położenie na mapie, obiekty mapy z granicą
          terenu, teren wczytany z mapy, więc ostrzeżenie o wyjściu poza granice też tam działa) oraz
          kanał radiowy, z wyszukiwaniem cichego kanału przez moduł I/O."
        - "Skrzynki przez radio: zapieczętowane zaproszenia do następnej gry; koniec gry przekazany
          jej skrzynkom nawet po restarcie telefonu bez klucza gry; nowe skrzynki przypisywane
          kodem, który pokazują, lub kartą terenu zapisaną przez telefon przez NFC; aktualizacje firmware'u między
          grami, przez moduł I/O lub modem radiowy USB z Pi, a telefon mówi dlaczego, gdy jego
          radio nie może ich przenieść."
        - "Presety, wgrane tryby i podpisane pakiety trybów wysyłane do skrzynek, którym ich brakuje,
          scenariusze kompilowane na telefonie, pakiety ról w grze, nazwy i herby drużyn."
        - "To, co robi kontroler na Pi, także: failover (telefon i Pi mogą być nawzajem swoim
          zapasem), synchronizacja z serwerem strony (gry, logi i wyniki wysyłane, gdy jest internet;
          listy graczy, branding i biblioteka scenariuszy z niego), zdalny GM i kanał ATAK."
        - "Konsola GM mieści się na telefonie: jej tabele check-in i sędziów układają się pionowo, bez przewijania w bok."
        - "Własny ekran kontrolera na telefonie importuje listę rejestracji (plik CSV lub JSON wybrany selektorem plików Androida), bez potrzeby konsoli GM."
        - "Kontroler zapasowy przejmuje wybory dotyczące beaconów skrzynek (przełącznik terenu, wyłączone skrzynki, pomieszczenia) i miejsca skrzynek od momentu dołączenia, więc po failoverze telefony dostają ten sam rejestr beaconów; konsola już otwarta na zapasowym od razu przesuwa znaczniki skrzynek, bez przeładowania. W oprogramowaniu, w obu kontrolerach; przesuwanie znaczników przetestowane w przeglądarce headless."
        - "Kontroler na telefonie dogania przegląd bezpieczeństwa Pi: odwoływanie podpisanych trybów, które w razie błędu blokuje (z minimalną wersją dla każdego trybu i limitem wieku dla telefonu offline, oba na ekranie Pakiety trybów), oraz kanał ATAK obsługi przez TLS z przypiętym urzędem certyfikacji. Przetestowane w oprogramowaniu; nie na telefonie na terenie."
        - "Kontroler na Androidzie uwalnia skrzynki, które utknęły w zakończonej grze, tak jak Raspberry Pi, z modemem radiowym USB (moduł I/O nie potrafi zgłaszać takich skrzynek), i ma tę samą ochronę zegara co Pi. W v0.9.0 (6 listopada 2026); jeszcze niewypróbowane na prawdziwym telefonie."
    g_ios:
      title: iOS
      items:
        - "Projekt jest w repozytorium, CI buduje go na Macu i działał już na iPhonie."
        - "26.10.2026 jego lista kontrolna na urządzeniu przeszła na iPhonie: 12 automatycznych sprawdzeń oraz,
          ręcznie, skanowanie QR aparatem, check-in z plakatem terenu przez HTTPS, udostępnianie
          pozycji, gdy aplikacja jest na ekranie, ostrzeżenie o wyjściu poza granice i jego wibracja
          oraz linki atalaia://."
        - "Beacony w budynkach: wtyczka w Swifcie oparta na CoreLocation, na tych samych kanałach co na Androidzie, potrzebuje tylko uprawnienia lokalizacji i działa, gdy aplikacja jest na ekranie. Kompiluje się w CI; nikt jeszcze nie uruchomił jej na iPhonie."
    next:
      - "Test w terenie z prawdziwymi telefonami i modułami (etap planu G) czeka na sprzęt. Jak dotąd
        aplikacja działała na emulatorach Androida i na iPhonie z kontrolerem stołu warsztatowego, a
        firmware modułu tylko jako jego własny kod na komputerze."
      - Telefon jako kontroler terenu czeka na prawdziwy telefon.
      - "Na iOS NFC wymaga płatnego konta Apple; urządzenie do gry i telefon jako kontroler terenu pozostają
        tylko na Androidzie."
      - "Wypróbowanie wtyczki beaconów na iPhonie (zbudowanej na Macu) oraz beaconów z prawdziwymi, także na Androidzie."
      - "Wypróbowanie logowania do strony na iOS (przeglądarka logowania społecznościowego i passkeye) na iPhonie."
      - "Wypróbowanie kodu QR tablicy wyników, wyboru piętra, historii gier i ponownego łączenia z modułem na prawdziwym telefonie i module."
      - "Wypróbowanie logowania w aplikacji na prawdziwym telefonie."
      - "Wypróbowanie sprawdzenia karty, wyboru pozycji przy check-inie, przypiętego CA i rejestracji w aplikacji na terenie i na prawdziwych telefonach."
    gate: "Bramka: jedna gra łączy urządzenia ESP32 i Android bez problemów."
  p4:
    title: Serwer strony i zaawansowana gra
    short: >-
      Serwer strony, planowanie gier i rejestracja, własne scenariusze, zaawansowane tryby, ATAK. Każdy
      krok w oprogramowaniu jest zbudowany; logowanie przez Google i Microsoft wypróbowano naprawdę na serwerze
      testowym. Następne są prawdziwy serwer, warunki uruchomienia hostingu i testy sprzętu.
    done:
      - "<strong>Zaawansowane tryby</strong>: Master i Satelity, Hacking Terminal, VIP / Payload
        oraz logika Okien tarcz."
      - "<strong>Własne scenariusze</strong>: ich środowisko uruchomieniowe na kontrolerze terenu, kompilator
        scenariuszy YAML, edytor w konsoli GM i cele w aplikacji."
      - "<strong>Kanał ATAK</strong>: skrzynki i strefy na mapach ATAK, na terenie oraz, przez
        serwer strony, dla obsługi poza nim."
      - "<strong>Serwer strony</strong>: konta z kodami dwuskładnikowymi, prawa dotyczące danych osobowych,
        synchronizacja kontrolerów, rejestr chrono, historia gier i biblioteka scenariuszy."
      - "<strong>Planowanie gier i rejestracja</strong>, w aplikacji lub na stronach internetowych terenu
        bez aplikacji, z publicznymi stronami terenów, kanałami kalendarza i profilami klubów."
      - "<strong>Tryb hostowany</strong>: wiele terenów na jednym serwerze, każdy odseparowany, z
        wdrożeniem."
    g_modes:
      title: Tryby
      items:
        - "Master i Satelity: satelity utrzymywane razem z masterem podnoszą jego punkty; zmiana
          właściciela mastera je uwalnia."
        - "Hacking Terminal: łamigłówka na klawiaturze, która odkrywa kod lub przejmuje
          terminal."
        - "VIP / Payload: drużyna eskortuje swojego VIP-a lub telefon z GPS do strefy ewakuacji;
          skrzynki punktów kontrolnych punktują, gdy są utrzymywane; pozycje zostają na kontrolerze terenu i telefonie."
        - "Zasady Okien tarcz: trafienie, gdy tarcza pokazuje kolor drużyny, daje punkt tej
          drużynie. Firmware modułu tarczy jest napisany; żadna tarcza nie została jeszcze zbudowana."
        - "Narzędzia geo w rdzeniu: odległości i strefy dla każdego skryptu, identyczne na każdej
          platformie."
    g_scenarios:
      title: Własne scenariusze
      items:
        - "Środowisko uruchomieniowe: scenariusz działa na kontrolerze terenu i mówi skrzynkom z wbudowanego
          pakietu celów, czym mają być (punkt do przejęcia, kod, tagi lub karty do zeskanowania, miejsce
          podłożenia bomby); one raportują, scenariusz liczy punkty."
        - "Kompilator: scenariusz YAML z siedmioma typami celów, z zależnościami, odkryciami i
          oknami czasowymi, sprawdzany z każdym problemem zlokalizowanym i wyjaśnionym, i kompilowany z
          wiersza poleceń."
        - "W konsoli GM: edytor, który wymienia każdy problem w trakcie pisania przez organizatora i
          instaluje scenariusz; skrzynki dostają nazwy ze scenariusza, gdy dołączają."
        - "W aplikacji: gracze widzą cele przeznaczone dla nich, z nazwami i stanem każdego,
          ukryty dopiero po odkryciu; każdy squad może mieć własny łańcuch, jeden
          cel naraz, przekazywany całemu squadowi lub tylko dowódcy squadu."
    g_atak:
      title: ATAK i mapa terenu
      items:
        - "Kanał ATAK: skrzynki i strefy na mapach ATAK przez Wi-Fi terenu, w kolorach
          właścicieli, rozmieszczone przez podanie położenia na mapie dwóch narożników obrazu terenu."
        - "GM zaznacza strefy bezpieczne, respawn i HQ każdej drużyny, parking, pierwszą pomoc i
          cele na planie terenu, jako pinezkę, okrąg lub obszar, każde widoczne dla wszystkich, dla
          jednej drużyny lub tylko dla organizatorów, w konsoli i w ATAK."
        - "Teren można wczytać z mapy: GM znajduje go z miejsca, w którym stoi, lub po nazwie
          miejscowości i obrysowuje jego kontur na OpenStreetMap, a przeglądarka rysuje obraz terenu
          z danych OpenStreetMap na otwartych zdjęciach lotniczych danego kraju (Portugalia
          kontynentalna, Hiszpania, Francja z terytoriami zamorskimi, Holandia, Belgia,
          Luksemburg, Szwajcaria, Liechtenstein, dwanaście krajów związkowych Niemiec, Polska, Czechy i Austria).
          Kontur staje się granicą terenu, a to, co na zewnątrz, jest przyciemnione."
        - "Telefony graczy ostrzegają ich banerem i wibracją, gdy wychodzą poza granicę,
          na podstawie własnego GPS, niczego nie wysyłając."
        - "Pozycje graczy nigdy nie trafiają do wszystkich, tylko do urządzeń obsługi, gdy teren to włączy.
          Obsługa poza terenem dostaje to samo przez serwer strony, przez szyfrowane
          połączenie z certyfikatem dla każdego urządzenia, który teren wystawia i może natychmiast odwołać,
          pozycje tylko dla GM-a lub sędziego."
        - "Tereny wielopiętrowe w konsoli: plan piętra dla każdego poziomu i każda skrzynka na swoim poziomie."
        - "Jeszcze nie wypróbowane z prawdziwym telefonem z ATAK ani na prawdziwym terenie."
        - "Skrzynka, którą Progressive Domination uczyniła aktywną, mówi o tym w ATAK."
        - "Strona mapy terenu działa także na telefonie jako kontrolerze terenu."
        - "ATAK pokazuje gracza w budynku w miejscu jego beaconu, z pomieszczeniem w uwagach."
        - "Siatka w ATAK i mapa z siatką do wydruku."
        - "Zdalny GM widzi pozycje graczy, gdy je udostępniają."
        - "Certyfikaty urządzeń ATAK są ważne 90 dni (było 7), a strona ATAK obsługi ostrzega, gdy któryś wygasa w ciągu 14 dni."
        - "Teren może wyłączyć pobieranie map w konsoli (Ustawienia, Pobieranie map): wtedy „Wczytaj teren z mapy” nie łączy się z OpenStreetMap, Overpass, Nominatim ani zdjęciami lotniczymi. Domyślnie włączone."
    g_server:
      title: Serwer strony, konta i dane
      items:
        - "Jego szkielet: baza danych, migracje i kontrola stanu, we własnym kontenerze."
        - "Konta: hasła, kody dwuskładnikowe wymagane dla organizatorów i sędziów, sesje i
          role dla każdego terenu."
        - "Prawa dotyczące danych osobowych: dostęp, eksport, poprawianie, usuwanie, zapisy zgód i codzienne
          czyszczenie po okresie przechowywania."
        - "Synchronizacja kontrolerów: kontrolery terenu wysyłają swoje gry, logi i wyniki, najpierw offline i
          bezpiecznie przy powtórzeniu. Jeszcze nie przez prawdziwe łącze 4G."
        - "Rejestr chrono: podpisane pomiary weryfikowane i przechowywane jako podpisane, tylko klucze publiczne,
          udostępnianie między terenami za zgodą. Jeszcze nie z prawdziwym chronografem."
        - "reset-totp: operator resetuje kod dwuskładnikowy konta, które utraciło swój uwierzytelniacz."
        - "Kontrolery terenu pobierają rekordy chrono innych terenów dla graczy z ich listy, tylko za zgodą każdego gracza. Trzymają je osobno od własnych pomiarów i nigdy ich nie oceniają."
        - "Kontrolery pobierają ustawienia i branding terenu z serwera strony, a zmiana od razu dociera do Pi i kontrolera na telefonie. W oprogramowaniu."
        - "Logowanie przez Google, Microsoft lub Apple oraz passkeyami. Hasła są opcjonalne; obsługa nadal potrzebuje drugiego składnika. Google i Microsoft wypróbowano z prawdziwymi dostawcami na serwerze testowym (tests.atalaia-project.link); Apple nie zostało jeszcze wypróbowane."
        - "Strona konta obsługi, na której każda osoba zarządza własnymi metodami logowania: passkeye, połączone konta, hasło i kod dwuskładnikowy."
        - "Zmiany scenariuszy, presetów i harmonogramu od razu docierają do kontrolerów."
        - "To, jak długo teren przechowuje dane, jest ustawieniem terenu: historia gier i rekordy chrono mają każdy swój okres przechowywania, ustawiany na kontrolerze, w konsoli GM lub na stronie ustawień obsługi serwera strony: historia gier domyślnie 90 dni (wyniki drużyn bez identyfikatorów graczy 365), rekordy chrono 365. Codzienne czyszczenie usuwa zakończoną grę w tym wieku, nigdy zanim serwer strony nie ma jej całej. Nieużywane pole przechowywania dla każdego konta zniknęło."
        - "Usunięcie gracza na kontrolerze terenu samo dociera do serwera strony przy następnej synchronizacji (nigdy nazwa) i usuwa tam także rekordy chrono gracza."
        - "Szablony informacji o prywatności, umowy powierzenia przetwarzania danych i warunków udostępniania między terenami, po portugalsku i angielsku (umowa także w pt-PT), oraz szablon oceny skutków dla ochrony danych: podają stanowiska zatwierdzone przez prawnika maintainera 30 października 2026 (konta na podstawie umowy z minimalnym wiekiem 16 lat, karta członkowska sprawdzana przy check-inie z usunięciem numeru, naruszenia na podstawie prawnie uzasadnionego interesu, udostępnianie pozycji za zgodą, brak inspektora ochrony danych). To wciąż szablony, które każdy teren wypełnia, a nie porada prawna dla konkretnego terenu."
        - "Serwer strony publikuje informację o prywatności dostarczoną przez operatora, jako stronę i przez API w czterech językach, i pokazuje ją kontom ponownie, gdy zmieni się jej wersja (konto opiera się na umowie, nie na zgodzie). Nic nie jest blokowane: eksport i usuwanie pozostają dostępne. Przetestowane na komputerze."
        - "Konto społecznościowe wybiera nazwę użytkownika na stronie Konto zaraz po utworzeniu (można pominąć; własna nazwa od dostawcy tylko, jeśli osoba o to poprosi). Każde konto może zmienić nazwę własną metodą logowania, a dwa konta jednej osoby można połączyć, gdy osoba udowodni oba (nigdy do ani z konta z rolą obsługi). Błąd brakującej zgody pokazuje się przy polu wyboru. Przetestowane na komputerze; krok nazwy użytkownika i łączenie trzeba jeszcze wypróbować na serwerze testowym."
        - "Rejestracja społecznościowa zapisuje wersję informacji o prywatności, którą osoba faktycznie widziała: serwer odrzuca nieaktualną i sprawdza ponownie przed utworzeniem konta. Przetestowane na komputerze."
        - "Codzienne czyszczenie usuwa też zanonimizowane konta (to, co zostaje po usunięciu lub połączeniu), gdy nic już do nich nie odsyła. Przetestowane na komputerze."
        - "Zmiana sposobu logowania do konta wymaga drugiego składnika: dodanie, zmiana nazwy lub usunięcie passkeya, włączenie lub wyłączenie kodów dwuskładnikowych, zmiana hasła, połączenie logowania społecznościowego i potwierdzenie łączenia kont są odrzucane, chyba że sesja przeszła dodatkowy krok TOTP lub passkey (samo logowanie społecznościowe się nie liczy); łączenie nigdy nie przenosi passkeyów na konto obsługi. Strona konta obsługi i aplikacja najpierw proszą o ten krok. Przetestowane na komputerze, nie z prawdziwymi dostawcami."
        - "Własny przegląd bezpieczeństwa serwera strony: ograniczone treści żądań (413 powyżej 1 MiB, 4 MiB dla przesyłanych plików), ta sama odpowiedź dla „nie ma takiego konta” i odrzuconego grantu, eksport terenu zawierający tylko wiersze audytu tego terenu, przełącznik strony publicznej respektowany przez wyszukiwanie terenu w aplikacji, wymagany publiczny URL, wystawca logowania społecznościowego zapisywany razem z podmiotem, żądania zwykłym HTTP za proxy przekierowywane na HTTPS oraz kontrola stanu, która mówi tylko ok. Częściowo znalezione na serwerze podglądowym."
        - "Konta opierają się na umowie, nie na zgodzie: rejestracja zapisuje, która wersja informacji o prywatności została pokazana, z polem „Mam 16 lat lub więcej” (na stronie obsługi i w aplikacji); data urodzenia nie jest przechowywana; bez opublikowanej informacji rejestracja jest zamknięta. Stare zgody stały się zapisami informacji. Przetestowane na komputerze."
        - "Kod z przeglądu prywatności: adres sieciowy wpisu audytu jest usuwany po 180 dniach (ustawienie); konto nieużywane przez 24 miesiące dostaje ostrzeżenie i jest anonimizowane 30 dni później; usunięcie danych osoby lub wycofana zgoda na udostępnianie chrono dociera do kontrolerów innych terenów, które usuwają swoje kopie; usunięcia są przechowywane jako skróty w rejestrze poza bazą danych i stosowane ponownie po przywróceniu; nowa strona obsługi oznacza recydywistów tylko jako informację doradczą (zwykłe ostrzeżenie nigdy się nie liczy), a ban domyślnie kończy się po 12 miesiącach; historia gier jest przechowywana 90 dni z identyfikatorami graczy, a wyniki drużyn bez nich 365. Przetestowane na komputerze."
        - "Teren akceptuje warunki udostępniania między terenami (jego administrator, na stronie ustawień), zanim udostępni pomiary chrono; wersja, data i konto są zapisywane, a gdy warunki się zmienią, udostępnianie jest wstrzymane do ich akceptacji. Teren jest administratorem danych swoich graczy, operator huba podmiotem przetwarzającym, a tereny, które udostępniają, są współadministratorami tylko dla tego kroku. Przetestowane na komputerze."
        - "Operator może ustawić hasło istniejącego konta z wiersza poleceń (<code>set-password</code>, pytane dwa razy bez wyświetlania, nigdy w linii poleceń): wyjście dla konta obsługi, które nie ma drugiego składnika i dlatego nie może zmienić metod logowania na stronie."
    g_games:
      title: Gry, kluby i strony obsługi
      items:
        - "Planowanie gier, z publiczną stroną dla każdego terenu i otwartymi kanałami iCalendar i JSON jego
          gier (bez danych osobowych)."
        - "Rejestracja na te gry, z wcześniej zgłoszonymi replikami i biletem check-in: kontroler
          terenu pobiera listę i zgłasza, kto przyszedł. Rejestracja z aplikacji; import
          listy rejestracji (CSV lub JSON) wyeksportowanej z innej platformy."
        - "Profile klubów: nazwa, kolor, logo i herb, członkowie, publiczna strona domyślnie wyłączona, z
          przyciskiem zgłoszenia i moderacją. Branding terenu i zapisane drużyny synchronizują się z jego kontrolerami,
          więc herb klubu dociera do każdego terenu, który zapisał jego drużynę."
        - "Historia gier: oś czasu wyniku i dziennik zdarzeń każdej gry; gracze i widzowie widzą grę na żywo
          z minutowym opóźnieniem, bez sekretów i identyfikatorów graczy. Publiczna tablica wyników dla każdego terenu (domyślnie
          wyłączona)."
        - "Biblioteka scenariuszy terenu z presetami gier, sprawdzana tak, jak sprawdza je kontroler terenu,
          i instalowana przez każdy kontroler terenu, łącznie z zapasowym."
        - "Strony internetowe dla obsługi terenu, po portugalsku i angielsku i na telefonie: logowanie z
          kodem dwuskładnikowym, historia gier, biblioteka scenariuszy (każdy problem pokazany przed zapisem,
          wersje i presety), stan urządzeń oraz widok na żywo i polecenia zdalnego GM-a. Przetestowane
          w przeglądarce headless, nie na prawdziwym serwerze."
        - "Kontrolery usuwają scenariusz lub preset, który strona zarchiwizowała lub usunęła, chyba że gra wciąż go używa."
        - "Strony obsługi dla harmonogramu: lista, tworzenie, edycja, publikowanie i odwoływanie gier, z godzinami w strefie czasowej terenu."
        - "Strony obsługi dla rejestracji: kto się zarejestrował, zmiana nazwy, drużyny lub numeru federacji, wycofanie rejestracji oraz eksport i import CSV."
        - "Strona listy graczy na dzień gry do wydruku, z informacją, kiedy kontroler ostatnio ją pobrał."
        - "Działania obsługi na rejestracji: opłacona lub nieopłacona (serwer nie przyjmuje płatności), nieobecność, przeniesienie na inną grę, przywrócenie, edycja replik. Przetestowane w przeglądarce headless, nie na prawdziwym serwerze."
        - "Strony obsługi dla ról, kluczy synchronizacji, brandingu, klubów, linków do platform, firmware'u i administracji."
        - "Strona zdalnego GM-a aktualizuje się na żywo, bez przeładowania."
        - "Członkostwo w stowarzyszeniu jest sprawdzane przy rejestracji i przy check-inie: APD dla terenów w Portugalii, dowolne stowarzyszenie lub federacja gdzie indziej."
        - "Strona obsługi dla ustawień terenu: strona publiczna, zasady check-inu, członkostwo, udostępnianie chrono i kraj."
        - "Rekordy chrono pokazują, o ile replika przekroczyła limit, i oznaczają recydywistów."
        - "Strona obsługi dla eksportu danych terenu i wykorzystania limitów."
        - "Osie czasu wyniku w czasie gry."
        - "Strona klubu wymienia tereny, na których gra, strona obsługi również."
        - "Kontroler sam importuje plik CSV rejestracji, bez potrzeby serwera strony."
        - "Konsola ostrzega, gdy nazwa ma litery, których skrzynki nie potrafią narysować: nazwy drużyn, nazwa gry, nazwa scenariusza i jego celów."
        - "Listy rejestracji zawierają identyfikator stowarzyszenia i datę ważności członkostwa jako opcjonalne kolumny, a eksport rejestracji importuje się z powrotem bez zmian."
    g_boxes:
      title: Skrzynki i teren
      items:
        - "Stan urządzeń: bateria, łącze i firmware każdej skrzynki na podstawie tego, co wysyłają kontrolery;
          kontroler terenu zgłasza skrzynkę, która milknie lub wraca, oraz niski poziom baterii, który
          skrzynka ze wskaźnikiem baterii zgłasza też sama. Jeszcze nie na prawdziwych płytkach."
        - "Katalog firmware'u, który wymienia tylko wydania podpisane zaufanym kluczem, oraz aktualizacje
          przez radio dla Field Boxa: GM wgrywa podpisane wydanie na kontroler terenu i
          aktualizuje skrzynki między grami, nigdy w trakcie; każda skrzynka pobiera je przez Wi-Fi
          terenu, sprawdza podpis kluczami wbudowanymi w firmware, instaluje w zapasowym
          slocie i wraca do starego firmware'u, jeśli nowy się nie uruchomi. W oprogramowaniu, jeszcze nie
          na prawdziwej płytce."
        - "Przypisywanie skrzynek do terenu kartą terenu NFC, kablem USB kontrolera lub
          6-cyfrowym kodem, który pokazuje skrzynka, sparowanym przez radio. W oprogramowaniu, jeszcze nie na prawdziwej płytce."
        - "Zapraszanie skrzynek do następnej gry przez radio, bez karty i kodu QR (dane dołączenia
          są szyfrowane kluczem wyprowadzonym z klucza dołączenia terenu), oraz start, który czeka,
          aż każda rola będzie miała skrzynkę, chyba że GM wybierze „Rozpocznij mimo to”. Przetestowane na dwóch płytkach
          warsztatowych z kontrolerem terenu."
        - "Skrzynki słyszane w każdej nowej grze (licznik nonce radia jest teraz osobny dla każdej gry, poprawka znaleziona na
          stole warsztatowym) i ekrany skrzynek, które podążają za grą (Gotowa, Czeka, Neutralna) w języku
          terenu, angielskim lub portugalskim. Przetestowane na dwóch płytkach warsztatowych."
        - "Kontroler zrestartowany w trakcie gry podejmuje grę na nowo; taki, który stracił klucz gry,
          i tak mówi swoim skrzynkom przez radio terenu, że gra się skończyła; błędne PIN-y administratora czekają
          coraz dłużej, liczone także po restartach, bez domyślnego PIN-u na prawdziwej skrzynce. W
          oprogramowaniu, jeszcze nie na płytkach warsztatowych."
        - "Zdalny GM: organizator z rolą GM, zalogowany kodem dwuskładnikowym, widzi
          grę na żywo i rozpoczyna, pauzuje, wznawia lub kończy ją albo wysyła wiadomość lub polecenie trybu,
          przez połączenie, które otwiera sam kontroler terenu, tylko gdy teren to włączy,
          z każdym poleceniem zapisanym po obu stronach."
        - "Karta Kontroler w konsoli pokazuje stan zdalnego GM-a i każde polecenie, które otrzymał."
    g_deploy:
      title: Wdrożenie i tryb hostowany
      items:
        - "Wdrożenie: HTTPS przez Caddy z automatycznym certyfikatem, skrypt instalacyjny, który
          tworzy każdy sekret, szyfrowane codzienne kopie zapasowe i przywracanie do świeżej bazy danych. Przetestowane
          w Dockerze na komputerze, nie na prawdziwym serwerze z prawdziwą domeną."
        - "Tryb hostowany: jeden serwer dla wielu terenów, każdy we własnym schemacie bazy danych pod własnym
          adresem, z zabezpieczeniem na poziomie wierszy pod spodem, tak aby żaden teren nigdy nie widział danych innego,
          oraz polecenia operatora do eksportu danych terenu lub jego usunięcia. Przetestowane z
          PostgreSQL w Dockerze."
        - "Jego wdrożenie: skrypt instalacyjny, który tworzy role bazy danych huba, każdy teren pod własnym
          adresem z certyfikatem, który może dostać tylko nazwa aktywnego terenu, oraz szyfrowane
          kopie zapasowe przywracane z każdym terenem odseparowanym. Przetestowane w Dockerze, nie na prawdziwym serwerze
          hostingowym z prawdziwą domeną."
        - "Tryb hostowany: limit dla każdego terenu, eksport danych, który administrator terenu może pobrać, a otwarte połączenia usuniętego terenu zamykają się natychmiast."
        - "Tryb hostowany: limit miejsca na dane i własne domeny dla każdego terenu."
        - "Tryb hostowany: każdy teren ma własną rolę bazy danych, więc wstrzyknięcie SQL nie może już przełączyć się na dane innego terenu przez zmianę ustawienia, którego używało zabezpieczenie na poziomie wierszy. Jedna luka, która wymaga drugiego polecenia SQL, pozostaje otwarta i jest spisana. Przetestowane z PostgreSQL w Dockerze."
        - "Tryb hostowany: tereny, które udostępniają rekordy chrono, robią to teraz między terenami huba, przez widok tylko do odczytu wymagający zgody; osoba łączy swoje konta na dwóch terenach kodem jednorazowym, a nic nie jest dopasowywane po e-mailu ani nazwie. Przetestowane z PostgreSQL w Dockerze."
        - "Demo na żywo tylko do odczytu dla serwera podglądowego: prawdziwy kontroler terenu z trzema symulowanymi Field Boxami rozgrywa gry bez końca, na przemian na otwartym terenie i w wymyślonym trzypiętrowym budynku (plan dla każdego piętra, piętnaście beaconów, dwunastu symulowanych graczy: sześciu umieszczonych przez beacon, pięciu przez GPS z wybranym piętrem, jeden niepewny), a odwiedzający widzą konsolę GM, tablicę wyników i widok gracza, bez możliwości zmian i bez danych osobowych. Online od 29 października 2026 pod demo.atalaia-project.link; widok gracza jest testowany w przeglądarce headless."
        - "Tryb hostowany: jeden callback logowania społecznościowego dla całego huba (opcjonalnie): operator rejestruje jeden adres przekierowania dla każdego dostawcy; hub podpisuje stan, sprawdza teren w swoim rejestrze i przekazuje do własnego callbacku terenu. Przetestowane w Dockerze, nie z prawdziwymi dostawcami."
        - "Lista kontrolna uruchomienia dla operatora: sześć warunków, zanim jakiemukolwiek terenowi zostanie zaoferowany tryb hostowany (podpisana umowa powierzenia dla każdego terenu, warunki udostępniania, każdy podmiot podprzetwarzający w załączniku i w UE, wypełniona informacja o prywatności, własne dokumenty operatora, jeśli jest osobą fizyczną, oraz dowód na prawdziwym serwerze)."
        - "Serwer podglądowy (tests.atalaia-project.link) uruchamia to wszystko od 30 października i ma własną informację o prywatności (wersja preview-2026-10-31: konta na podstawie umowy, 16 lat lub więcej, brak inspektora ochrony danych)."
        - "Serwer podglądowy sam instaluje swoją informację o prywatności przy każdym starcie i aktualizacji (i zatrzymuje się, jeśli brakuje plików danej wersji), demo na żywo wysyła HSTS, a jednorazowy stos testowy (hostowany hub, fałszywy dostawca logowania i kontroler terenu, tylko na 127.0.0.1) pozwala przeprowadzić autoryzowany test bezpieczeństwa na dzisiejszym kodzie."
    next:
      - Prawdziwy serwer z domeną.
      - "Warunki uruchomienia hostingu (podpisana umowa powierzenia dla każdego terenu, warunki udostępniania, wypełniona informacja) oraz wypełnienie przez każdy teren własnej informacji i oceny skutków. Prawnik maintainera zatwierdził stanowiska prawne 30 października 2026; tryb hostowany nadal nie jest oferowany. Żadnej z prac nad bezpieczeństwem, radiem i kwestiami prawnymi z 30 października nie wypróbowano na prawdziwej płytce ani telefonie: działają w oprogramowaniu i na serwerze podglądowym."
      - "Testy na sprzęcie: prawdziwe płytki, prawdziwy telefon z ATAK, prawdziwe łącze 4G, prawdziwy chronograf."
      - "Moduł tarczy na prawdziwej płycie (jego firmware jest napisany), po czym Okna tarcz
        staną się presetem Field Boxa."
      - "Wypróbowanie logowania Apple z prawdziwym dostawcą oraz kroku nazwy użytkownika i łączenia kont na serwerze testowym."
      - "jogarairsoft.pt: maintainer napisał do nich 28 października 2026, proponując integrację (ich wydarzenia, drużyny i APD do nas; nasz kanał gier, profile terenów, publiczne kluby i wyniki do nich). Czekamy na odpowiedź; nic nie jest obiecane."
    gate: >-
      Bramka: weekendowy <a href="{{ page.to.glossary }}#slownik-milsim">milsim</a> działa na Atalaia
      od początku do końca.
  p5:
    title: Społeczność
    short: >-
      Wizualny edytor trybów, podpisane pakiety trybów, rejestr trybów jako szablon, niemiecki i
      chiński tradycyjny, instrukcje budowy, moduły tarczy i wyjść na porcie rozszerzeń. Każdy krok
      w oprogramowaniu jest zbudowany. Najnowsze wydanie, v0.9.0, jest podpisane kluczem wydań
      projektu i zawiera aplikację na Androida podpisaną kluczem Androida projektu.
    done:
      - "<strong>Wizualny edytor trybów</strong>: strona symulatora, na której tryb składa się
        z bloków (co się dzieje, gdy drużyna trzyma przycisk, timery, punkty, ekrany
        i dźwięki, strefy na mapie, polecenia GM, kilka ról, ustawienia, które GM może zmienić, oraz
        logika kontrolera terenu obejmująca wiele skrzynek). Na bieżąco pisze skrypty Lua i manifest trybu,
        po portugalsku i angielsku, działa offline, a przycisk od razu uruchamia tryb w
        symulatorze. Jego trzy przykłady przechodzą te same testy co tryby pisane ręcznie."
      - "<strong>Podpisane pakiety trybów</strong>: jedno archiwum, podpisane jak wydanie firmware'u. Edytor
        sam tworzy pakiet i pokazuje, co klucz trybu podpisze, oraz polecenie, które
        go podpisuje; podpisywanie odbywa się na własnym komputerze autora, offline."
      - "Kontroler terenu instaluje podpisane tryby tylko z własnymi zaufanymi kluczami i pokazuje, kto
        podpisał każdy z nich i czy projekt go przejrzał."
      - "Bateria prób ucieczki z piaskownicy uruchamia się przy każdej zmianie; zamknęła dwa sposoby, w jakie skrypt
        mógł działać dłużej niż jego limit czasu."
      - "<em>Wyślij brakujące tryby</em> w konsoli GM: skrzynka, której brakuje trybu gry, pobiera
        podpisany pakiet z kontrolera terenu przez Wi-Fi terenu, tylko między grami, podczas gdy
        gra na nią czeka; sprawdza pakiet kluczami wbudowanymi w firmware i zachowuje
        go. Przetestowane na komputerze, nie na prawdziwej skrzynce."
      - "Scenariusze budowane z bloków w konsoli GM: skrzynki, cele i kto je widzi,
        kiedy się otwierają, co je kończy i co dają, myszą, dotykiem lub klawiaturą, nawet
        na telefonie. Kontroler terenu sprawdza je i instaluje tak, jakby były napisane ręcznie."
      - "<strong>Rejestr trybów</strong>, gotowy jako szablon: pull request z podpisanym trybem
        jest sprawdzany automatycznie (jego podpis, to, że źródło jest tym, co podpisano, licencja,
        testy w symulatorze), a tryb przejrzany przez projekt dostaje odznakę zweryfikowania,
        własny podpis projektu, który pozwala mu dotrzeć do skrzynek. Jak zgłosić tryb,
        lista kontrolna przeglądu, klucze i moderacja są spisane."
      - "<strong>Niemiecki i chiński tradycyjny</strong> (w odmianie z Tajwanu) na tej stronie, w konsoli
        GM, edytorze trybów, aplikacji, na ekranach Field Boxa, we wbudowanych trybach i na stronach serwera
        strony: wersje robocze AI, jeszcze nie sprawdzone przez graczy, którzy mówią w tych językach."
      - >-
        Repozytorium rejestru istnieje (utworzone 26.10.2026), a jego <a href="https://vakaobr.github.io/atalaia-modes/">strona</a> wymienia
        tryby, na razie bez żadnego trybu.
      - >-
        <a href="{{ page.to.build }}">Instrukcje budowy</a> dla Satellite, modułu I/O, portu
        rozszerzeń, modułu tarczy i prostego wyjścia (syrena lub dym przez przełącznik przekaźnikowy RC), jako
        tekst. Żadna skrzynka nie została jeszcze według nich zbudowana.
      - "<strong>Port rozszerzeń w firmware</strong>: skrzynka wykrywa moduł podłączony do
        portu w ciągu 2&nbsp;s i przekazuje każde trafienie do skryptu trybu, a moduł tarczy ma
        własny firmware, z plikami UF2 w wydaniach. Przetestowane na komputerze z symulowanym
        modułem, jeszcze nie na prawdziwym porcie ani płycie."
      - "<strong>Moduł wyjść I2C</strong>: do czterech przekaźników lub MOSFET-ów na porcie skrzynki, za
        izolatorem i z własnym zasilaniem, z firmware (plik UF2 w wydaniach) i
        instrukcją budowy. Jego firmware jest testowany tylko na komputerze, nigdy na płytce."
      - "<strong>Instrukcje obsługi</strong> dla graczy, organizatorów gier, sędziów i operatorów Field Boxa, po angielsku i portugalsku."
      - "Instrukcje budowy z tabelą pinów dla każdej płytki, przewodnik po firmware (pobierz wydanie lub zbuduj je) i przewodnik konfiguracji kontrolera, po angielsku i portugalsku."
      - "Widok webowy symulatora ma każde wejście, którego używa tryb: tagi, klawiaturę, trafienia i polecenia GM, z pobieraniem dziennika zdarzeń."
      - "Bloki scenariuszy w konsoli GM mają listę języków ze wszystkimi czterema językami."
      - "Klucze trybów projektu: offline'owy klucz główny i klucz, którego rejestr używa do podpisywania odznaki zweryfikowania. Skrzynki, aplikacja i kontrolery domyślnie ufają obu."
      - "Przewodnik po firmware i instrukcje budowy wyjaśniają jedno wgranie przez USB, którego potrzebuje skrzynka ze starą tablicą partycji, oraz to, że ustawienia i klucze je przetrwają."
      - "Utwardzenie CI i wydań po przeglądzie bezpieczeństwa: każda akcja przypięta do commita, obraz buildu do digestu, każda instalacja pip z pliku z przypiętymi hashami, zadanie podpisywania w chronionym środowisku, które odrzuca tag spoza main, oraz cotygodniowe aktualizacje zależności. Od zmiany klucza w listopadzie 2026 klucz podpisujący wydania znajduje się tylko w tym chronionym środowisku."
      - "Wzorce łańcuchów Lua i string.rep są limitowane w piaskownicy (wrogi wzorzec mógł zawiesić skrzynkę aż do watchdoga), pomijanie zagnieżdżonych danych CBOR ma ograniczoną głębokość, a dekodery CBOR mają testy z wrogimi danymi wejściowymi."
      - "Klucze wydań: klucz CI, którym projekt podpisuje wydania, został zmieniony bezprzewodowo. v0.7.0 ufało staremu i nowemu kluczowi; v0.8.0 (4 listopada 2026) jest podpisane nowym, a stary wycofano. Skrzynka z v0.6.1 lub starszą instaluje najpierw v0.7.0, potem v0.8.0."
    next:
      - "Sprawdzenie niemieckiego i chińskiego: jeśli grasz po niemiecku lub po chińsku, pomóż nam
        je sprawdzić. Tłumaczenia na inne języki zaczynają się od docs/translations."
      - "Sprzęt: testy na stole warsztatowym portu rozszerzeń i modułu tarczy, płytka nośna PCB
        (gotowa płytka drukowana, która ułatwia budowę) po pierwszych zbudowanych skrzynkach, zdjęcia
        z budowy, treści społeczności z terenu."
    gate: W toku po pierwszym wydaniu.
build:
  title: Instrukcje budowy
  intro: >-
    Urządzenia do gry Atalaia buduje się z gotowych części wokół jednej płytki ESP32, bez własnej
    płytki drukowanej. Na tej stronie są piny i schematy połączeń Field Boxa, jego proste wyjście na syrenę lub wytwornicę dymu oraz instrukcje dla Satellite, modułu I/O, portu rozszerzeń, modułu tarczy i modułu wyjść I2C,
    w skróconej formie; pełne instrukcje, z każdą kontrolą i tabelami rozwiązywania problemów, są w
    repozytorium.
    Aby wgrać firmware na płytkę, <a href="https://github.com/vakaobr/atalaia-project/releases">pobierz gotowe wydanie</a> albo zbuduj je samodzielnie: <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/firmware.md">instrukcja firmware'u</a> wyjaśnia oba sposoby. Kontroler terenu ma własną <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/controller-setup.md">instrukcję konfiguracji</a>. Modem radiowy ma własną <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md">instrukcję modemu</a>.
  status: >-
    <strong>Żadna skrzynka nie została jeszcze zbudowana według tych instrukcji, a Field Box nie ma jeszcze obudowy.</strong>
    Istnieje tylko <a href="#field-box-first-build">wersja Field Boxa na stole warsztatowym</a> (luźne przewody),
    która rozgrywa gry. Jej piny są automatycznie sprawdzane względem firmware'u, ale każdy krok fizyczny
    (obudowa, zasilanie, czas pracy, zasięg radia) jest nieprzetestowany, a zdjęcia pozostałych skrzynek pojawią się
    wraz z ich pierwszymi egzemplarzami. Jeśli zbudujesz którąś, daj nam znać, co udało się ustalić.
  toc: Na tej stronie
  parts: Części
  pins: Piny
  pins_intro: >-
    Wartości domyślne firmware'u. Każdy pin płytki, którego nie ma w tej tabeli, pozostaje niepodłączony.
  pin_what: Co
  pin_gpio: GPIO
  steps: Kroki
  open: Jeszcze nie ustalone
  photo: "Zdjęcie pojawi się po pierwszej budowie:"
  after_bench: "Po testach na stole: co wymaga prawdziwego sprzętu"
  simple_out:
    title: "Proste wyjście: syrena, stroboskop lub pilot wytwornicy dymu"
    what: >-
      Opcja dla Field Boxa i Satellite oraz zalecany sposób, w jaki skrzynka coś przełącza:
      syrenę, stroboskop, lampę lub pilot wytwornicy dymu, przez gotowy
      <strong>przełącznik przekaźnikowy RC</strong> (taki, jaki sprzedaje się do modeli zdalnie sterowanych). Jedno GPIO wysyła
      sygnał serwa przez wolną bramkę konwertera poziomów: 2,0&nbsp;ms to włączone, 1,0&nbsp;ms to wyłączone, w
      półsekundowych seriach, które odnawia tylko trwająca gra. Jeśli skrzynka się zawiesi, zresetuje lub straci zasilanie,
      impulsy ustają w ciągu 0,5&nbsp;s, a przełącznik rozwiera swój przekaźnik. Firmware ma tę funkcję od
      wydania 0.7.0 jako opcję kompilacji; nie zbudowano jej jeszcze na sprzęcie. Firmware modułu I/O
      też ją ma, na GPIO&nbsp;33 (i 1): zobacz <a href="#io-pod">moduł I/O</a>.
    needs:
      switch: >-
        <strong>Przełącznik przekaźnikowy RC, który rozwiera przekaźnik, gdy sygnał zanika</strong>: udokumentowany
        model z zabezpieczeniem fail-safe przy utracie sygnału albo ogólny model dopiero po jego teście na stole. Takiego, który
        utrzymuje ostatni stan, nie używa się nigdy. Jego styki muszą być dobrane do obciążenia.
      socket: >-
        <strong>Gniazdo M8, 3-pinowe</strong>, opisane „OUTPUT 1” (pin 1 niepodłączony, pin 3 masa,
        pin 4 sygnał), rezystor 10&nbsp;kΩ, który utrzymuje pin w stanie niskim podczas startu płytki,
        rezystor 330&nbsp;Ω do gniazda i 3-żyłowy przewód o długości do 2&nbsp;m. To nie jest
        gniazdo M12 portu rozszerzeń.
      load: >-
        <strong>Własny akumulator obciążenia</strong>, z bezpiecznikiem do przekaźnika i stabilizatorem 5&nbsp;V
        („BEC” z RC) dla przełącznika: skrzynka daje tylko sygnał i masę, nigdy zasilania.
      firmware: >-
        <strong>Firmware zbudowany z prostym wyjściem</strong>
        (<code>python tools/docker_fw.py build --simple-out=on</code>). Jego pin zależy od rewizji
        płytki: GPIO&nbsp;46 w V4.3, GPIO&nbsp;5 w V4.2. Drugie wyjście na GPIO&nbsp;45
        (<code>--simple-out=on2</code>) tylko w skrzynce bez brzęczyka piezo.
      enable: >-
        Wyjścia pozostają wyłączone, dopóki administrator terenu nie włączy ich na skrzynce PIN-em administratora i
        nie przypisze każdemu funkcji (syrena, stroboskop, dym, lampa, klakson) i maksymalnego czasu włączenia. Skrzynka
        wyłącza je wszystkie przy starcie, przy pauzie i po zakończeniu gry (klakson końca gry może
        jeszcze brzmieć do 10&nbsp;s).
    safety: >-
      <strong>Tylko obciążenia niskonapięciowe</strong> (maksymalnie 24&nbsp;V DC, zalecane 2&nbsp;A), bez względu na
      to, co jest nadrukowane na przekaźniku. <strong>Nigdy napięcie sieciowe, nigdy pirotechnika</strong>; wytwornica dymu tylko
      przez udokumentowane niskonapięciowe wejście pilota. Ochrona słuchu przy syrenach i klaksonach, dym
      nigdy w zamkniętym pomieszczeniu bez zgody obiektu i nic, co wygląda jak materiał wybuchowy.
    full: >-
      Każdy krok i każda kontrola: sekcja 9.10
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">instrukcji budowy</a> Field Boxa oraz test każdego przełącznika RC na stole
      przed jego pierwszą grą na
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md#step-8b-simple-output-rc-relay-switch">liście
      uruchomienia, krok 8b</a>.
  pin:
    btn1: Przycisk drużyny 1 (pierwsza drużyna w grze)
    btn2: Przycisk drużyny 2 (druga drużyna)
    btn3: >-
      Przycisk drużyny 3, opcjonalny (linia odbioru UART0 płytki)
    btn4: Przycisk drużyny 4 (na ekspanderze klawiatury)
    led: Dane pierścienia LED, przez konwerter poziomów 74AHCT125
    sda_gauge: I2C SDA, dla wskaźnika baterii (własna magistrala płytki)
    sda_bus: >-
      I2C SDA, dla ekspandera klawiatury, czytnika NFC i wskaźnika baterii (własna magistrala płytki)
    scl: I2C SCL
    bclk: BCLK wzmacniacza (opcjonalnie)
    lrclk: LRC wzmacniacza
    dout: DIN wzmacniacza
    buzzer: >-
      Pasywny brzęczyk piezo, opcjonalny (pin konfiguracyjny bootowania: jego obwód utrzymuje go w stanie niskim; opcja firmware'u, jeszcze nie zbudowana na sprzęcie)
    tamper: Przełącznik obudowy, do GND
    pod_out1: Proste wyjście 1, opcjonalne (przez wolną bramkę 74AHCT125)
    pod_out2: Proste wyjście 2, opcjonalne (pin napięcia baterii płytki, nieużywany przez moduł)
    log: >-
      Wyjście logu (UART0 TX): tylko RX adaptera USB-serial 3,3&nbsp;V, na stole
    disp_mosi: >-
      MOSI ekranu (SPI)
    disp_clk: >-
      Zegar ekranu (SCK)
    disp_cs: >-
      Chip select ekranu (CS; pin napięcia baterii płytki, używany jako wyjście)
    disp_dc: >-
      Dane/komenda ekranu (DC)
    disp_rst: >-
      RESET i podświetlenie ekranu: oba do pinu 3V3, bez GPIO
    keypad: >-
      Klawiatura, przez ekspander PCF8574 (adres 0x20)
  safety:
    title: Najpierw bezpieczeństwo
    intro: Te zasady obowiązują przy każdej budowie z tej strony, tak jak przy Field Boxie.
    antenna: >-
      <strong>Nigdy nie zasilaj płytki bez anteny LoRa</strong>, nawet z USB:
      nadawanie do otwartego złącza antenowego może zniszczyć wzmacniacz radia. Najpierw załóż obie anteny
      i nie zdejmuj ich.
    cell: >-
      <strong>Tylko jedno ogniwo Li-ion szeregowo</strong> (1S, 3,0–4,2&nbsp;V): ogniwa z zabezpieczeniem, bezpiecznik
      blisko ogniwa i dioda chroniąca przed odwrotnie włożonym ogniwem. Gniazdo baterii
      i ładowarka płytki przyjmują jedno ogniwo; pakiet 2S je niszczy. Sprawdź polaryzację miernikiem
      przed każdym podłączeniem: małe wtyczki baterii nie mają standardowej polaryzacji.
    charge: >-
      <strong>Ładuj pod nadzorem</strong>, nigdy w zamkniętej obudowie, tylko w temperaturze od około 0 do
      45&nbsp;°C, a podczas pracy trzymaj ogniwa w ognioodpornej torbie, wyjęte ze
      skrzynki. Nigdy nie używaj ogniwa wgniecionego, spuchniętego, gorącego lub poniżej 2,5&nbsp;V.
    volts: >-
      <strong>Tylko sygnały 3,3&nbsp;V</strong> do płytki: pierścień LED jest sterowany przez konwerter
      poziomów, a każdy moduł I2C musi podciągać swoje linie (pull-up) do 3,3&nbsp;V, nigdy do 5&nbsp;V.
    pins: >-
      <strong>Nigdy nie podłączaj GPIO 5 ani 46</strong> (tor wejściowy radia; jedynym wyjątkiem jest
      <a href="#field-box-simple-output">proste wyjście</a>, na tym, który twoja rewizja płytki zostawia
      wolny: 46 w V4.3, 5 w V4.2) <strong>ani GPIO 34 lub 38–42</strong> (złącze GPS
      płytki).
    power_check: >-
      <strong>Żadnej gry przed kontrolą mocy nadawania</strong> z listy uruchomienia: firmware
      utrzymuje radio w granicach prawnego limitu przy wzmocnieniu wzmacniacza, które nie zostało jeszcze zmierzone.
    enclosure: >-
      <strong>Plastik, nigdy metal</strong> (sygnał radiowy musi wydostać się na zewnątrz), odporna na warunki pogodowe, w jaskrawym
      kolorze, z etykietą „GAME PROP” i nic, co wygląda jak urządzenie wybuchowe.
    hits: >-
      <strong>Kulki ASG i kulki paintballowe będą w nią trafiać.</strong> Trzymaj ogniwa i płytki z dala od ścianek
      i poza linią ognia, osłoń ekran telefonu przezroczystym poliwęglanem (nigdy szkłem) i
      nigdy nie stawiaj skrzynki tam, gdzie gracze muszą do niej strzelać, chyba że to tarcza.
  field_box:
    title: Field Box
    text: >-
      Główne urządzenie do gry, z przyciskami drużyn, klawiaturą, kolorowym ekranem, pierścieniem LED, czytnikiem NFC i
      głośnikiem. Jego
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/field-box/BUILD.md">instrukcja
      budowy</a> zawiera części, schematy połączeń, zasilanie i bezpieczeństwo baterii, pierwsze wgranie firmware'u i
      rozwiązywanie problemów; poniższe instrukcje odsyłają do niej przy każdym wspólnym kroku.
    pins_shared: >-
      GPIO 1, 35 i 44 to piny płytki, które Field Box celowo współdzieli, każdy tylko do tego jednego zastosowania: 1 to wejście napięcia baterii płytki (wskaźnik odczytuje baterię przez I2C), 35 jej biała dioda LED (słabo migocze razem z pierścieniem), a 44 linia odbioru UART0 (konsola USB działa bez zmian).
    bench:
      title: Pierwsza budowa, na stole warsztatowym
      intro: >-
        Field Box istnieje już nie tylko na papierze, ale tylko jako wersja na stole: pierwsza płytka, która rozegrała całą
        grę, z ekranem, przyciskami i klawiaturą na luźnych przewodach i jeszcze bez obudowy. To nie jest
        gotowy produkt ani skrzynka zbudowana według instrukcji.
      photo_alt: >-
        Zdjęcie wersji na stole: płytka Heltec V4 z małym ekranem OLED, połączona wieloma kolorowymi
        przewodami z 2,8-calowym ekranem TFT pokazującym „READY” i „Next game”, membranową klawiaturą z 12 klawiszami (4 na 3)
        i czterema przyciskami z zielonymi, niebieskimi i czarnymi nasadkami. Wszystko leży luzem na biurku,
        za nim klawiatura komputerowa.
      photo_caption: >-
        Pierwszy Field Box na stole, 31 października 2026: płytka Heltec V4, ekran TFT 2,8" (ILI9341),
        własny OLED płytki, klawiatura 4×3 i przyciski drużyn, na luźnych przewodach, bez obudowy. To
        pierwsza płytka, która rozegrała grę, i wersja na stole, nie gotowa skrzynka.
      video_alt: >-
        Bezgłośne, zapętlone wideo tej samej wersji na stole rozgrywającej Domination, z nowym ekranem TFT. Ekran
        pokazuje strefę zajętą przez drużynę czerwoną z 3 punktami; niebieski pasek wypełnia się u dołu, strefa przechodzi do
        drużyny niebieskiej, a ekran i OLED zmieniają kolor z czerwonego na niebieski. Potem ekran pokazuje „held for 0:01”,
        odliczane w górę, a w prawym górnym rogu punkty każdej drużyny.
      video_caption: >-
        Ta sama wersja rozgrywająca Domination z kontrolerem na stole (1 listopada 2026): pasek zajmowania się wypełnia, strefa
        przechodzi od drużyny czerwonej do niebieskiej, czas zajęcia rośnie, a punkty każdej drużyny widać w rogu.
        Jedenaście sekund w pętli, bez dźwięku; ekran jest po portugalsku.
      photo2_alt: >-
        Zdjęcie tej samej wersji na stole z nowym ekranem TFT: ekran pokazuje „PRONTA” (gotowa), żółtą wieżę
        logo Atalaia i „Próximo jogo” (następna gra), a pod spodem „Uma tecla: escolher jogo aqui” (jeden klawisz: wybierz grę
        tutaj). Po lewej płytka Heltec V4 z OLED-em, który powtarza „Próximo jogo”; po prawej
        zielony przycisk. Wszędzie luźne przewody, na biurku.
      photo2_caption: >-
        Ta sama wersja 1 listopada 2026, z nowym ekranem TFT: ekran „PRONTA / Próximo jogo” (gotowa / następna gra)
        z żółtą wieżą Atalaia, czekający na grę. Nadal wersja na stole, bez obudowy.
    wiring:
      title: >-
        Schematy połączeń
      intro: >-
        Dwa rysunki, wygenerowane z plików WireViz w repozytorium: sygnały z zasilaniem logiki 3,3 V oraz bateria, wyłącznik i szyna 5 V. Piny płytki są opisane tylko numerem GPIO: każdy znajdziesz po numerze nadrukowanym obok pinu złącza. Etykiety (piny, przewody, części) pozostają po angielsku we wszystkich językach, tak jak w repozytorium; jeśli tekst i rysunek się różnią, rozstrzyga rysunek.
      open: >-
        Otwórz rysunek w pełnym rozmiarze (SVG)
      hint: >-
        Rysunek jest bardzo szeroki: dotknij go lub kliknij, aby otworzyć go w pełnym rozmiarze, gdzie można go powiększać i przesuwać. Także w ciemnym motywie leży na białym tle, aby kolory przewodów były wierne.
      signals:
        alt: >-
          Schemat połączeń 1 z 2, sygnały i zasilanie 3,3 V: piny GPIO płytki głównej przechodzą przez płytkę połączeniową do ekranu, przycisków drużyn, klawiatury i jej ekspandera PCF8574, czytnika NFC, wskaźnika baterii, wzmacniacza i głośnika, pierścienia LED oraz anten.
        caption: >-
          Schemat 1 z 2: sygnały i zasilanie logiki 3,3 V.
      power:
        alt: >-
          Schemat połączeń 2 z 2, bateria i zasilanie 5 V: ogniwo, bezpiecznik, wyłącznik główny, dioda chroniąca przed odwrotną polaryzacją i złączki zasilają gniazdo baterii płytki głównej oraz, przez przetwornicę podwyższającą, szynę 5 V pierścienia LED, wzmacniacza i płytki połączeniowej.
        caption: >-
          Schemat 2 z 2: bateria, wyłącznik główny i szyna 5 V.
  satellite:
    title: Satellite
    what: >-
      Mała skrzynka na punkt drugorzędny lub radiolatarnię: płytka Field Boxa z dwoma dużymi przyciskami drużyn
      (trzeci jest możliwy), pierścieniem LED pokazującym drużynę, która ją zajmuje, własnym małym
      ekranem płytki i jednym ogniwem 18650. Około <span class="nowrap">30–40 €</span> za części (szacunek
      projektu). Działa na <strong>tym samym firmware co Field Box</strong>, z mniejszą liczbą zamontowanych części:
      firmware zgłasza każdą brakującą część raz przy starcie i działa dalej.
    plays: >-
      Bez klawiatury nie może sama wybrać gry: rozgrywa gry, do których zaprasza ją
      <a href="{{ page.to.glossary }}#slownik-kontroler-terenu">kontroler terenu</a>,
      jako satelita lub master w trybie
      <a href="{{ page.to.modes }}#master-satellites">Master i Satelity</a> albo jako strefa w każdym
      trybie, który wymaga tylko przycisków drużyn (Domination, Hold-All Domination, Last Stand). Dołącza do
      terenu przez kabel USB lub kodem parowania na swoim małym ekranie (nie ma czytnika NFC do
      karty terenu).
    parts:
      board: >-
        Płytka Heltec WiFi LoRa 32 V4, rewizja V4.2 lub V4.3, 863–928&nbsp;MHz, bez obudowy.
      antennas: >-
        Antena 868&nbsp;MHz o zysku 2&nbsp;dBi lub mniejszym (z zestawu płytki) i antena 2,4&nbsp;GHz,
        która jest wymagana: pierwsza konfiguracja, pobieranie trybów i aktualizacje firmware'u używają Wi-Fi.
      buttons: >-
        Dwa (lub trzy) przyciski arcade 60&nbsp;mm z diodami LED 5&nbsp;V.
      ring: >-
        Pierścień LED WS2812B (domyślnie 24 diody; 12 lub 16 po zmianie jednego ustawienia firmware'u), z
        konwerterem poziomów 74AHCT125, rezystorem 330&nbsp;Ω i kondensatorem 1000&nbsp;µF, na małej
        płytce uniwersalnej.
      gauge: >-
        Wskaźnik baterii MAX17048, zalecany: bez niego skrzynka nigdy nie zna poziomu baterii.
      power: >-
        Jedno zabezpieczone ogniwo 18650 w koszyku (lub pakiet 1S z płytką zabezpieczającą), bezpiecznik 5&nbsp;A,
        dioda Schottky'ego, osłonięty wyłącznik główny, przetwornica podwyższająca 5&nbsp;V dla pierścienia i
        złączki dźwigniowe: tor zasilania Field Boxa z jednym ogniwem.
      sound: >-
        Dźwięk jest opcjonalny: pasywny brzęczyk piezo (najtańszy: odtwarza dźwięki gier jako krótkie
        sekwencje tonów, z opcją firmware'u; jeszcze nie zbudowany na sprzęcie), wzmacniacz MAX98357A z Field Boxa
        i mały głośnik albo oba.
      simple_out: >-
        <a href="#field-box-simple-output">Proste wyjście</a> jest opcjonalne: syrena, stroboskop, lampa
        lub pilot wytwornicy dymu przełączany przez przełącznik przekaźnikowy RC, jak w Field Boxie. Master lub
        Satellite, który włącza syrenę, nie potrzebuje innej skrzynki. Jeszcze nie zbudowane na sprzęcie.
      box: >-
        Plastikowa skrzynka IP65 w jaskrawym kolorze, z odpowietrznikiem i dławnicami kablowymi oraz etykietami „GAME PROP”.
    free_pins: >-
      Firmware nadal steruje pinami ekranu Field Boxa (GPIO 1, 3, 33 i 47): zostaw je
      niepodłączone.
    diagram_ref: >-
      Jej połączenia to podzbiór połączeń Field Boxa: korzystaj ze <a href="#field-box-wiring">schematów połączeń Field Boxa</a> i pomiń części, których ta wersja nie ma (kolorowy ekran, klawiaturę i czytnik NFC). Osobny rysunek jeszcze nie istnieje.
    steps:
      revision: >-
        Odczytaj układ obok złącza anteny LoRa na płytce: KCT8103L to V4.3 (domyślna w
        firmware), GC1109 to V4.2. Załóż i opisz obie anteny, zanim płytka zostanie kiedykolwiek zasilona.
      enclosure: >-
        Zaplanuj skrzynkę na papierze, a potem wywierć wszystkie otwory, zanim trafi do niej elektronika: przyciski i pierścień
        na pokrywie, wyłącznik wpuszczony lub osłonięty, odpowietrznik nisko.
      power: >-
        Zbuduj tor zasilania bez płytki: ogniwo, bezpiecznik, dioda, wyłącznik, złączki; ustaw przetwornicę
        podwyższającą na 5,0–5,2&nbsp;V samodzielnie, zanim cokolwiek zostanie do niej podłączone.
      hub: >-
        Zbuduj małą płytkę połączeniową: szyny 3V3, GND i 5V (oraz SDA i SCL dla wskaźnika)
        i konwerter poziomów, jak w instrukcji Field Boxa.
      wiring: >-
        Podłącz przyciski (do GND po naciśnięciu), pierścień przez konwerter poziomów, wskaźnik i
        opcjonalny wzmacniacz, według powyższych pinów.
      simple_out: >-
        Jeśli montujesz proste wyjście: wolna bramka konwertera poziomów z GPIO&nbsp;46 (V4.3) lub
        5 (V4.2), z 10&nbsp;kΩ do GND, przez 330&nbsp;Ω do pinu 4 gniazda M8; przełącznik
        zasilany z akumulatora obciążenia, nigdy ze skrzynki. GPIO pokazuje 10&nbsp;kΩ do GND, a
        nic nie łączy pinu 4 gniazda z 3V3 ani z 5&nbsp;V.
      check: >-
        Sprawdź miernikiem, z wyjętym ogniwem: brak zwarcia między szynami, każdy przycisk tylko po
        naciśnięciu, polaryzację przewodu baterii płytki.
      flash: >-
        Zbuduj i wgraj firmware Field Boxa zgodnie z jego instrukcją, ustawiony dla twojej rewizji płytki i
        liczby diod w twoim pierścieniu.
      bring_up: >-
        Wykonaj kroki uruchomienia, które dotyczą Satellite: start, przyciski, diody LED, bateria oraz
        radio i jego moc nadawania przed jakąkolwiek grą.
      field: >-
        Ustaw jej nazwę, region i PIN administratora na stronie konfiguracji Wi-Fi z telefonu, przypisz ją do swojego
        terenu kablem USB lub kodem parowania i zaproś ją do gry z konsoli GM.
    photo: gotowy Satellite, w środku i z zewnątrz.
    open:
      buzzer: >-
        <strong>Brzęczyk piezo</strong> z pierwotnego projektu: firmware go obsługuje (opcja
        kompilacji, na GPIO&nbsp;45), ale żaden brzęczyk nie został jeszcze zbudowany i usłyszany na prawdziwej płytce.
      enclosure: >-
        <strong>Obudowa</strong>: żadna skrzynka nie została jeszcze wybrana.
      runtime: >-
        <strong>Czas pracy</strong> na jednym ogniwie: niezmierzony.
      diagram: >-
        <strong>Własny schemat połączeń</strong>: na razie schematy Field Boxa pokazują każdy przewód,
        jaki ma Satellite.
    full: >-
      Pełna instrukcja:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/satellite/BUILD.md">instrukcja
      budowy Satellite</a>.
  pod:
    title: Moduł I/O
    what: >-
      Skrzynka, która daje <a href="{{ page.to.glossary }}#slownik-android-prop">urządzeniu z Androidem</a>
      to, czego brakuje telefonowi: duże przyciski drużyn, klawiaturę, pierścień LED, dźwięk, czytnik NFC, przełącznik,
      który sygnalizuje otwarcie skrzynki, i radio LoRa. Telefon uruchamia tryb gry; moduł jest
      jego rękami i radiem, przez kabel USB lub Bluetooth. To sprzęt Field Boxa bez
      kolorowego ekranu, z firmware'em modułu, który przetestowano na komputerze, ale jeszcze nie
      na płytce. Około <span class="nowrap">35 €</span> za części (szacunek projektu).
    lends: >-
      Każda część poza płytką jest opcjonalna: moduł informuje telefon, co ma, a telefon używa
      tylko tego. Przycisk 1 to pierwsza drużyna w grze, jak w Field Boxie. Otwarta obudowa trafia
      do konsoli GM jako alarm sabotażu.
    outputs: >-
      <strong>Proste wyjścia</strong>, opcjonalne: syrena, stroboskop, lampa lub pilot wytwornicy dymu
      przez przełącznik przekaźnikowy RC, podłączone jak
      <a href="#field-box-simple-output">proste wyjście</a> Field Boxa, ale na GPIO&nbsp;33 (drugie na
      GPIO&nbsp;1, z brzęczykiem piezo lub bez). Moduł nie ma PIN-u administratora, więc to wbudowanie wyjścia
      je włącza, razem z jego zastosowaniem (syrena, stroboskop, dym, lampa, klakson) i maksymalnym czasem włączenia. Gra
      w telefonie przełącza je według zasad skrzynki, a moduł wyłącza je sam: od razu, gdy
      połączenie z telefonem zanika, i po 1,5&nbsp;s, gdy telefon przestaje się odzywać.
    port: >-
      <strong>Port rozszerzeń</strong>, opcjonalny: gniazdo M12 Field Boxa i
      <a href="#expansion-port">płytka portu</a> na magistrali I2C modułu (GPIO&nbsp;17 i 18).
      Trafienia <a href="#target-addon">modułu tarczy</a> docierają do gry w telefonie, gdy ta trwa. Przekaźniki
      modułu wyjść są udostępniane grze tylko przez moduł I/O zbudowany do ich udostępniania (domyślnie wyłączone), a moduł
      wyłącza je, gdy telefon się rozłącza. Moduł ze wszystkimi częściami ma mało miejsca, by opisać się
      telefonowi: udostępnia tyle wyjść, ile się zmieści, te pierwsze, a pozostałe trzyma wyłączone.
      Wyjścia i port są w firmware modułu i przetestowane tylko na komputerze: żaden moduł nie przełączył jeszcze
      prawdziwego przekaźnika ani nie wyczuł prawdziwej płytki tarczy.
    parts:
      same: >-
        Części Field Boxa bez ekranu: płytka, przyciski (do czterech), klawiatura i
        jej ekspander PCF8574, pierścień LED z konwerterem poziomów, czytnik NFC PN532,
        wzmacniacz i głośnik, wskaźnik baterii i ten sam tor zasilania z jednym ogniwem.
      antennas: >-
        Obie anteny: LoRa oraz 2,4&nbsp;GHz dla Bluetootha.
      switch: >-
        Mikroprzełącznik, który zamknięta pokrywa trzyma wciśnięty: przełącznik obudowy.
      usb: >-
        Panelowe gniazdo USB-C z liniami danych (nie tylko do ładowania) na kabel telefonu oraz kabel USB-C OTG
        dla telefonu.
      uart: >-
        Tylko na stole: adapter USB-serial 3,3&nbsp;V do odczytu logu modułu.
      simple_out: >-
        Opcjonalnie, dla każdego prostego wyjścia: przełącznik przekaźnikowy RC, który rozwiera się, gdy sygnał zanika,
        wolna bramka 74AHCT125, 10&nbsp;kΩ i 330&nbsp;Ω oraz gniazdo M8, jak w Field Boxie.
      port: >-
        Opcjonalnie: gniazdo M12 i płytka portu rozszerzeń, jak w Field Boxie.
    free_pins: >-
      GPIO&nbsp;33 i 1, wolne w module, obsługują opcjonalne proste wyjścia; GPIO&nbsp;3 oraz pin
      wyjścia, którego nie używasz, pozostają niepodłączone. Port rozszerzeń nie zajmuje własnego GPIO.
    diagram_ref: >-
      Połączenia modułu to połączenia Field Boxa bez ekranu: korzystaj ze <a href="#field-box-wiring">schematów połączeń Field Boxa</a> i pomiń ekran oraz jego przewody. Osobny rysunek jeszcze nie istnieje.
    steps:
      like_box: >-
        Zbuduj go jak Field Box bez ekranu: rewizja płytki, anteny, obudowa, tor zasilania,
        płytka połączeniowa, potem montowane klawiatura, pierścień, czytnik NFC, przyciski i wzmacniacz, każde
        z kontrolami z instrukcji.
      switch: >-
        Zamontuj mikroprzełącznik tak, aby zamknięta pokrywa go wciskała, i podłącz go z GPIO 47 do GND. Moduł
        obserwuje go dopiero po tym, jak raz odczyta stan zamknięty, więc moduł bez niego nigdy nie podnosi alarmu.
      flash: >-
        Zbuduj firmware modułu (<code>python tools/docker_fw.py pod</code>; dodaj
        <code>--simple-out=on</code> dla jednego wyjścia, <code>on2</code> dla dwóch, a
        <code>--module-outputs=on</code>, aby udostępniać przekaźniki modułu wyjść) i wgraj go z
        folderu <code>build-pod</code>, jak w Field Boxie. Log startowy wymienia każde udostępniane wyjście.
      log: >-
        Odczytuj jego log na GPIO 43 adapterem USB-serial: port USB-C przenosi połączenie modułu
        z telefonem, nie log.
      link: >-
        W aplikacji połącz go kablem USB-C OTG, a potem przez Bluetooth (Android raz poprosi o sparowanie).
      bring_up: >-
        Przeprowadź kontrole uruchomienia modułu, w tym moc nadawania radia przed jakąkolwiek grą.
    photo: gotowy moduł, z przełącznikiem obudowy, i połączony z nim telefon.
    open:
      bench: >-
        <strong>Wyjścia i moduły w prawdziwym module I/O</strong>: proste wyjścia i port rozszerzeń
        są w firmware modułu i przetestowane na komputerze, jeszcze nie z prawdziwym przekaźnikiem, płytką tarczy ani telefonem;
        następne są testy na stole.
      phone_power: >-
        <strong>Zasilanie z telefonu</strong>: na kablu telefon zasila moduł i może ładować
        jego ogniwo. Czy powinien i ile prądu daje telefon, trzeba sprawdzić przy pierwszej budowie.
      enclosure: >-
        <strong>Obudowa</strong> i sposób noszenia telefonu razem z modułem.
      settings: >-
        <strong>Ustawienia</strong>: konsola GM może wysłać kolory przycisków, jasność pierścienia,
        głośność i to, czy przełącznik obudowy raportuje przez radio; liczbę diod LED, piny
        i wyjścia ustawia się przy kompilacji firmware'u.
    full: >-
      Pełna instrukcja:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/io-pod/BUILD.md">instrukcja
      budowy modułu I/O</a> oraz kontrole modułu z telefonem na
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/firmware/esp32/docs/BRING_UP.md">liście
      uruchomienia</a>.
  modem:
    title: Modem radiowy
    what: >-
      Radio kontrolera: druga płytka Heltec WiFi LoRa 32&nbsp;V4, z wgranym obrazem modemu,
      podłączona do portu USB kontrolera terenu. Bez niej kontroler działa, a konsola
      się otwiera, ale nic nie dociera do skrzynek i nic od nich nie przychodzi. Nie ma Wi-Fi, więc
      potrzebuje tylko anteny LoRa.
    tested: >-
      Modem wgrany w ten sposób działał z kontrolerem i prawdziwymi skrzynkami na stole (komputer,
      kontroler w Dockerze). Nie działał jeszcze na Raspberry Pi, na macOS ani na terenie gry.
    steps:
      antenna: >-
        Załóż <strong>antenę LoRa, zanim płytka dostanie jakiekolwiek zasilanie</strong>, także do wgrywania, i
        użyj kabla USB-C <em>do danych</em>. Ustal region radiowy: modem i skrzynki muszą mieć ten sam.
      image: >-
        Pobierz <code>atalaia-modem-&lt;version&gt;-usb.zip</code> i <code>SHA256SUMS</code> z
        <a href="https://github.com/vakaobr/atalaia-project/releases">wydań</a> (V4.3, EU868) albo
        zbuduj go: <code>python tools/docker_fw.py modem</code> (V4.2, Tajwan, inne anteny).
      flash: >-
        Za pomocą esptool 4.8.1 wyczyść nową płytkę i zapisz pliki z <code>flash_args</code>:
        <code>esptool --chip esp32s3 -p PORT write_flash "@flash_args"</code>, z portem
        <code>COM5</code> w Windows, <code>/dev/ttyACM0</code> w Linuksie, <code>/dev/cu.usbmodem…</code>
        w macOS. W Linuksie najpierw dołącz do grupy <code>dialout</code>.
      screen: >-
        Ekran płytki pokazuje wieżę i <strong>MODEM MODE</strong>, a potem <code>LINK waiting</code>.
        To sprawny modem, który nie ma jeszcze kontrolera. <strong>RADIO FAULT</strong> oznacza, że układ radiowy
        nie wystartował.
      port: >-
        Podłącz go do kontrolera, znajdź jego port (<code>ls /dev/ttyACM*</code>), wpisz go w
        <code>[modem] port</code> w <code>/etc/atalaia/controller.toml</code> i zrestartuj usługę
        (<code>sudo systemctl restart atalaia-controller</code>).
      check: >-
        Ekran pokazuje <strong>LINK OK</strong>, nagłówek konsoli pokazuje <strong>Radio: up</strong>, a w
        logu kontrolera jest <code>modem link up</code>.
      join: >-
        Włącz przypisaną skrzynkę, utwórz grę i zaproś skrzynkę: przechodzi przez <em>wysyłanie</em>, <em>zaproszona</em>,
        <em>dołączyła</em>, a ekran modemu liczy pakiety.
    full: >-
      Każde polecenie dla każdego systemu, jak znaleźć port, i tabela rozwiązywania problemów (kabel tylko do ładowania,
      zły port, port zajęty przez inny program, <code>dialout</code>, niezgodny region, <code>LINK waiting</code>
      lub <code>DOWN</code>, <code>RADIO FAULT</code>, zła tablica partycji):
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/manuals/en/modem.md">Konfiguracja modemu radiowego</a>.
  port:
    title: Port rozszerzeń
    status: >-
      <strong>Zaprojektowany, jeszcze niezbudowany; firmware skrzynki już go obsługuje.</strong> Port można zbudować już teraz i
      sprawdzić miernikiem oraz częściami samej skrzynki. Od kroku 8 planu portu rozszerzeń
      skrzynka uruchamia sterownik portu w swojej grze: wykrywa moduł w ciągu 2&nbsp;s od podłączenia,
      odczytuje go i dodaje do listy. Przetestowano to tylko na komputerze, z symulowanym modułem, jeszcze nie na
      prawdziwym porcie.
    what: >-
      Wodoodporne 5-pinowe gniazdo M12 na skrzynce, do którego z zewnątrz podłącza się moduły: teraz
      <a href="#target-addon">moduł tarczy</a>, później styki i inne czujniki. To własna magistrala I2C skrzynki
      (ta od klawiatury, czytnika NFC, wskaźnika i małego ekranu) wyprowadzona poza
      obudowę, za małą <strong>płytką portu</strong>, dzięki której mokry, zwarty lub
      naelektryzowany kabel nie unieruchomi skrzynki. Nie zajmuje żadnego GPIO, więc tabela pinów się nie zmienia. Jest
      opcjonalny w Field Box, Satellite i module I/O: potrzebuje go tylko skrzynka z tarczą lub
      czujnikiem. Części za około <span class="nowrap">€6–14</span> (szacunek z projektu).
    not_outputs: >-
      Nie do syren, stroboskopów ani dymu: do nich służy
      <a href="#field-box-simple-output">proste wyjście</a>. Port jest do wejść oraz do
      <a href="#output-module">modułu wyjść I2C</a> w skrzynce, która potrzebuje więcej kanałów.
    parts:
      socket: >-
        <strong>Żeńskie</strong> panelowe gniazdo M12, kodowanie A, 5 pinów (IP67; styki są cofnięte, bo
        pin 1 jest pod napięciem) z zaślepką przeciwpyłową oraz gotowy przedłużacz czujnikowy M12, kodowanie A, 5 żył,
        męsko-żeński, o długości do 2&nbsp;m do modułu.
      buffer: >-
        <strong>Bufor hot-swap TCA4307</strong> na płytce breakout: łączy port z magistralą skrzynki
        tylko wtedy, gdy obie są bezczynne, i odcina go, gdy zwarty lub mokry kabel trzyma linię w stanie niskim, więc
        klawiatura, czytnik NFC, wskaźnik i ekran działają dalej.
      tvs: >-
        <strong>Niskopojemnościowa matryca TVS</strong> (klasa USBLC6-2SC6, na adapterze) i dwa
        rezystory 100&nbsp;Ω, przeciw ładunkom elektrostatycznym z dłoni lub kabla przy gnieździe.
      fuse: >-
        <strong>Bezpiecznik polimerowy 50&nbsp;mA</strong> przeciw zwarciu między pinami 1 i 3 oraz
        mała <strong>dioda Schottky'ego</strong> (klasa BAT85), żeby nic na kablu nie mogło zasilić wstecznie
        3,3&nbsp;V skrzynki: moduł dostaje około 3,0&nbsp;V.
      pullups: >-
        Dwa rezystory pull-up 2,2&nbsp;kΩ po stronie portu (moduły ich nie mają), mała płytka uniwersalna
        i przewody do szyn 3V3, GND, SDA i SCL płytki połączeniowej.
    pins_title: Piny portu
    pins_intro: >-
      Rozkład pinów M12 ze zwykłymi kolorami żył kabla (sprawdź je miernikiem). SDA i SCL to
      magistrala I2C skrzynki, za buforem.
    pin_m12: Pin M12
    pin:
      p1: >-
        Brązowy: 3,3&nbsp;V (około 3,0&nbsp;V za diodą), maksymalnie 25&nbsp;mA, tylko dla logiki
        modułu
      p2: "Biały: SDA, 100&nbsp;kHz"
      p3: "Niebieski: masa"
      p4: "Czarny: SCL"
      p5: >-
        Szary: <strong>niepodłączony</strong> po obu stronach, nigdy zasilanie ani sygnał
    addresses: >-
      Moduły odpowiadają pod adresami 0x58–0x5F, wolnymi od wszystkich części skrzynki: moduły wejść od 0x58
      (tarcza), moduły wyjść od 0x5C. Skrzynka obsłuży najwyżej cztery, ale port ma jedno gniazdo,
      a rozgałęźnika jeszcze nie zaprojektowano, więc instrukcja przewiduje jeden moduł na skrzynkę.
    steps:
      socket: >-
        Wywierć otwór na gniazdo z boku lub w spodzie obudowy, z dala od anten i
        gniazda prostego wyjścia, tam, gdzie kabel z ziemi wejdzie bez ostrego zgięcia, i nie
        od strony strzelających. Opisz je „EXPANSION 3.3&nbsp;V”.
      board: >-
        Rozmieść płytkę portu na płytce uniwersalnej około 3&nbsp;×&nbsp;4&nbsp;cm: strona skrzynki przy jednej
        krawędzi, strona gniazda przy drugiej, bufor między nimi, a TVS obok złącza
        gniazda.
      breakout: >-
        Najpierw zmierz własne rezystory pull-up płytki breakout: razem z nimi magistrala skrzynki musi nadal pokazywać
        od 1 do 3,9&nbsp;kΩ do 3V3, a strona portu łącznie około 2,2&nbsp;kΩ.
      wiring: >-
        Połącz zasilanie (3V3 z huba, dioda, bezpiecznik, 3,3&nbsp;V portu), sygnały
        przez bufor, rezystory 100&nbsp;Ω i TVS, krótkie przewody masy oraz wyprowadzenia
        gniazda w kolorach kabla, z wyprowadzeniem pinu 5 krótko obciętym i zaizolowanym.
      check: >-
        Sprawdź miernikiem, bez akumulatora i z odłączonym USB: brak zwarcia między pinami 1 i 3, pin 5
        rozwarty, dioda w dobrą stronę, około 100&nbsp;Ω i 2,2&nbsp;kΩ tam, gdzie mówi instrukcja.
      power: >-
        Pierwsze zasilenie, bez niczego podłączonego: około 3,0&nbsp;V na pinie 1, a klawiatura, czytnik
        NFC i wskaźnik nadal działają, także z podłączonym kablem 2&nbsp;m.
      bench: >-
        Testy na stole, które możesz zrobić już teraz: czas narastania na drugim końcu kabla (poniżej 1&nbsp;µs,
        oscyloskopem), zwarte SDA przy nadal działającej klawiaturze, zwarcie między pinami 1 i 3 bez
        resetu oraz ładunek elektrostatyczny przy gnieździe. Zgłoś swoje pomiary w issue.
    rules_title: Zasady dla portu
    rules:
      volts: >-
        <strong>Tylko 3,3&nbsp;V, na każdym pinie, zawsze</strong>: ani 5&nbsp;V, ani napięcie akumulatora nigdy
        nie trafia do portu, a pin 5 pozostaje niepodłączony.
      loads: >-
        <strong>Nigdy nie zasilaj obciążenia z portu</strong>: jego 25&nbsp;mA jest dla procesora i czujnika
        modułu. Już jedna dioda WS2812 pobiera do 60&nbsp;mA.
      relays: >-
        <strong>Nigdy nie podłączaj gołej płytki przekaźników PCF8574 lub MCP23017</strong> ani żadnej płytki I2C bez
        własnego procesora: jej przekaźniki zostałyby włączone, gdyby skrzynka się zawiesiła, a odpowiada tam, gdzie
        skrzynka szuka swojej klawiatury.
      cap: >-
        <strong>Zakładaj zaślepkę na gniazdo</strong>, gdy nic nie jest podłączone, i prowadź kabel po ziemi,
        nigdy na linii ognia. Nic po żadnej stronie portu nigdy nie dotyka sieci elektrycznej.
    photo: gotowa płytka portu z obu stron i gniazdo na skrzynce.
    box_title: Co skrzynka mówi o porcie
    box: >-
      W logu szeregowym (USB, 115200 bodów) skrzynka zapisuje linię, gdy wykryje moduł
      (<code>expansion: 0x58 added: 58:target/1.0.0:hit</code>), gdy moduł przestanie odpowiadać
      (<code>expansion: 0x58 lost (no_answer)</code>) i przy każdym trafieniu w trakcie gry.
      <code>@modules</code> w konsoli szeregowej wyświetla moduły, a w trakcie gry konsola GM pokazuje
      każdy z nich jako znacznik pod jego skrzynką. Lista uruchomieniowa firmware'u zawiera krok dla portu.
    after:
      tests: >-
        <strong>Testy portu na stole z modułem</strong>: 100 cykli podłączania i odłączania w trakcie
        trwającej gry, każde podłączenie wykryte w ciągu 2&nbsp;s (test 3), oraz 30 minut obok przełączanej
        syreny i stroboskopu 12&nbsp;V, z liczeniem błędów CRC i pominiętych odpytań (test 6). Można je zrobić, gdy tylko
        powstanie moduł tarczy; zgłoś swoje pomiary w issue.
    open:
      splitter: >-
        <strong>Rozgałęźnik</strong> dla więcej niż jednego modułu w skrzynce.
      pcb: >-
        <strong>Płytka drukowana nośna</strong> z płytką portu (do tego czasu płytka uniwersalna) oraz
        schemat połączeń portu, który może powstać po jego pierwszej budowie.
    full: >-
      Pełna instrukcja, ze wszystkimi częściami, montażem, adresami, sprawdzeniami i
      rozwiązywaniem problemów:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/expansion-port/BUILD.md">instrukcja budowy portu rozszerzeń</a>. Decyzje,
      które za nią stoją, opisuje szkic RFC
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/rfcs/0000-expansion-port.md">Port rozszerzeń</a>.
  target:
    title: Moduł tarczy
    status: >-
      <strong>Można go zbudować, a jego firmware jest gotowy; jeszcze niewypróbowany na prawdziwej płycie ani w prawdziwej
      skrzynce.</strong> W kroku 8 planu portu rozszerzeń napisano firmware modułu, ustalono jego piny
      i dodano jego pliki UF2 do wydań, a skrzynka odczytuje teraz moduł i przekazuje każde trafienie do
      skryptu trybu: wszystko to przetestowane tylko na komputerze, z symulowanym modułem. Możesz już teraz zbudować
      tarczę, wgrać firmware i podłączyć ją do portu skrzynki; jej pobór prądu, strojenie czujnika i
      dzielnik ustala się przy pierwszej budowie (poniżej). Według instrukcji nie zbudowano jeszcze żadnej tarczy.
    what: >-
      Płyta, do której strzelają gracze, z czujnikiem piezo, który wyczuwa każde trafienie, i małą własną płytką RP2040
      (<strong>moduł tarczy</strong>). Podłącza się go do
      <a href="#expansion-port">portu rozszerzeń</a> skrzynki i zmienia skrzynkę w punktowaną tarczę dla trybu
      <a href="{{ page.to.modes }}#target-windows">Okna tarcz</a>, którego zasady zbudowano i
      przetestowano w symulatorze oraz, od początku do końca, z symulowaną tarczą; okno pokazuje własny pierścień świateł
      skrzynki, więc moduł nie potrzebuje świateł. Przyjmie go każda skrzynka z portem: Field Box,
      Satellite lub moduł I/O.
    how: >-
      Piezo, przyklejone do tyłu płyty, zamienia trafienie w krótki impuls; moduł znajduje jego
      szczyt, siłę od 0 do 255 i przechowuje do 16 trafień wraz z ich wiekiem, aż skrzynka je
      odbierze. Skrzynka odczytuje go co 20&nbsp;ms przez port, co zajmuje około 5&nbsp;% magistrali, więc trafienie
      dociera do gry w ciągu około 21&nbsp;ms i żadne nie jest liczone dwa razy. Skrypty gry widzą każde trafienie
      jako <code>hit.hit</code> z jego siłą, tylko w trakcie gry, i mogą uzbrajać i rozbrajać
      tarczę. Około
      <span class="nowrap">€10–15</span> za moduł, plus płyta, kabel i port skrzynki
      (szacunki z projektu).
    parts:
      board: >-
        <strong>Płytka RP2040</strong>, klasy RP2040-Zero lub Raspberry Pi Pico, taktowana 48&nbsp;MHz,
        żeby zmieścić się w 25&nbsp;mA portu.
      piezo: >-
        <strong>Krążek piezo</strong> 27–35&nbsp;mm (i zapasowe: pękają), gumowa podkładka 2–3&nbsp;mm
        i klej kontaktowy.
      front_end: >-
        Obwód czujnika: rezystor upływowy 1&nbsp;MΩ, dwa rezystory dzielnika w podstawkach (ich
        wartości dobiera się na prawdziwych płytach) i dwie diody Schottky'ego klasy BAT85, które utrzymują
        wejście procesora między masą a 3,3&nbsp;V.
      mosfet: >-
        <strong>MOSFET z kanałem P</strong> (klasa AO3401 lub SI2301) i rezystor 10&nbsp;kΩ: ochrona
        modułu przed ręcznie zrobionym kablem połączonym odwrotnie.
      address: >-
        Dwie zworki lutowane (lub 2-pozycyjny przełącznik DIP) do adresu: 0x58, gdy obie są rozwarte,
        0x59–0x5B dla drugiej tarczy w tej samej skrzynce.
      led: >-
        Dioda LED 3&nbsp;mm i rezystor 1&nbsp;kΩ: miga, gdy skrzynka prosi moduł, żeby się pokazał,
        by można go było znaleźć na terenie.
      connector: >-
        <strong>Męskie</strong> panelowe złącze M12, kodowanie A, 5 pinów, przedłużacz M12 (najwyżej
        2&nbsp;m), mała obudowa IP65, płytka uniwersalna i przewody.
      plate: Stalowa płyta lub arkusz poliwęglanu oraz stojak.
    pins_title: Piny modułu
    pins_intro: >-
      Tak jak używa ich firmware modułu: te same numery GPIO na RP2040-Zero i na Pico. Wszystkie
      pozostałe piny zostają niepodłączone.
    pin_rp2040: Pin RP2040
    pin:
      v3: >-
        Zasilanie, około 3,0&nbsp;V: pin 1 M12 (brązowy), przez MOSFET. Na Pico połącz też 3V3_EN z
        GND
      gnd: "Masa: pin 3 M12 (niebieski)"
      sda: "I2C SDA, bez pull-upu: pin 2 M12 (biały)"
      scl: "I2C SCL, bez pull-upu: pin 4 M12 (czarny)"
      adc0: "Obwód wejściowy piezo (ADC0)"
      adc1: "Obwód wejściowy drugiej płyty (ADC1), tylko firmware dla dwóch płyt"
      a0: "Zworka adresu do GND: dodaje 1"
      a1: "Zworka adresu do GND: dodaje 2"
      led: "Anoda LED; katoda przez 1&nbsp;kΩ do GND"
    steps:
      port: >-
        Najpierw zbuduj i sprawdź <a href="#expansion-port">port rozszerzeń</a> skrzynki.
      supply: >-
        Zasilanie: pin 1 M12 przez MOSFET do pinu 3V3 płytki RP2040, nigdy do jej pinu 5&nbsp;V,
        VBUS, VSYS ani USB; pin 3 do masy; pin 5 krótko obcięty i zaizolowany. Na RP2040-Zero jej własny
        stabilizator pozostaje wtedy bez zasilania; na Pico połącz 3V3_EN z GND, żeby wyłączyć jej stabilizator.
      piezo: >-
        Przyklej piezo przez podkładkę na środku tyłu płyty; rezystor upływowy między jego wyprowadzeniami,
        potem dzielnik i diody ograniczające po drodze do GP26 (drugi obwód wejściowy modułu dla dwóch płyt idzie
        do GP27).
      bus: >-
        SDA (pin 2) do GP4 i SCL (pin 4) do GP5, bez rezystorów pull-up w module; zworki
        adresu z GP2 i GP3 do masy, obie rozwarte dla 0x58; LED na GP14.
      enclosure: >-
        Obudowa za płytą, przymocowana do stojaka, a nie do płyty, złączem
        odwróconym od strzelających, a kabel poprowadzony w dół i po ziemi do skrzynki.
      check: >-
        Sprawdź miernikiem, przy niezasilonym module: brak zwarcia między pinami 1 i 3, pin 5 rozwarty, brak
        pull-upu na pinach 2 i 4, diody ograniczające mierzą się jak diody, około 1&nbsp;MΩ na piezo.
    flash_title: Wgrywanie firmware'u do modułu
    flash_intro: >-
      Firmware modułu to plik UF2, wgrywany ręcznie przez USB, nigdy bezprzewodowo, przy
      module odłączonym od skrzynki: nigdy nie podłączaj jednocześnie jego kabla USB i kabla portu.
    flash:
      download: >-
        <strong>Pobierz plik UF2</strong>: <code>atalaia-target-module-&lt;version&gt;.uf2</code>
        (<code>atalaia-target-module-2-&lt;version&gt;.uf2</code> dla dwóch płyt) z
        <a href="https://github.com/vakaobr/atalaia-project/releases">wydania</a>, od pierwszego
        po 0.7.0, i sprawdź go z plikiem <code>SHA256SUMS</code> wydania: pliki modułów nie są
        podpisane. Możesz też zbudować go samodzielnie poleceniem <code>python3 tools/docker_module.py build</code>.
      boot: >-
        <strong>Wgraj go</strong>: przytrzymaj przycisk BOOT płytki, podłączając jej kabel USB do
        komputera, przeciągnij plik UF2 na dysk, który się pojawi (<code>RPI-RP2</code>), i odłącz
        kabel USB, gdy płytka się zrestartuje.
      found: >-
        <strong>Podłącz go do portu skrzynki</strong>: w ciągu 2&nbsp;s log szeregowy skrzynki pokazuje
        <code>expansion: 0x58 added: 58:target/1.0.0:hit</code>, a <code>@modules</code> w jej
        konsoli szeregowej wyświetla tarczę.
      armed: >-
        <strong>Wypróbuj go w grze</strong>: uruchom Okna tarcz na skrzynce; płyta jest uzbrojona, a
        stuknięcie w nią zapisuje <code>expansion: hit hit, strength &lt;n&gt;</code>.
    after:
      power: >-
        <strong>Pobór prądu modułu i 3V3</strong>: poniżej 25&nbsp;mA przy 48&nbsp;MHz, z miernikiem
        szeregowo z pinem 1 (test na stole 4), i około 3,0&nbsp;V na jego pinie 3V3 w trakcie pracy.
      tuning: >-
        <strong>Próg, czas blokady i skala siły</strong> na prawdziwych płytach stalowych i
        poliwęglanowych, przy limicie mocy terenu i w ochronie oczu (test na stole 8). Domyślne
        wartości firmware'u (próg 300 z 4095, blokada 50&nbsp;ms) to tylko punkt
        wyjścia.
      divider: >-
        <strong>Dwa rezystory dzielnika</strong>, dobierane w tym samym teście (dlatego siedzą w
        podstawkach): trafienie z dystansu wyraźnie powyżej progu, trafienie tuż nad piezo nieosiągające
        diod ograniczających.
      port: >-
        <strong>Testy portu z modułem</strong>: cykle podłączania w trakcie gry i zakłócenia obok
        syreny, z listy <a href="#expansion-port">portu rozszerzeń</a>.
      preset: >-
        <strong>Okna tarcz jako wbudowany preset Field Box</strong>, gdy tarcza zostanie
        przetestowana na stole; do tego czasu teren wgrywa ten tryb na skrzynkę jak każdy inny. Moduł I/O
        już przekazuje trafienia modułu tarczy do gry na telefonie (krok 9), przetestowane tylko na komputerze:
        zobacz <a href="#io-pod">moduł I/O</a>.
    open:
      plate: >-
        <strong>Płyta</strong>: gatunek materiału, rozmiar, grubość, stojak i kąt, na podstawie
        pierwszych budów.
      pcb: >-
        <strong>Płytka drukowana nośna</strong> dla modułu; do tego czasu płytka uniwersalna.
    safety_title: Bezpieczeństwo, zawsze gdy ktoś do niej strzela
    safety:
      bench: >-
        <strong>Na stole warsztatowym</strong>: nigdy nie podłączaj jednocześnie kabla USB modułu i kabla portu,
        i dotknij masy skrzynki przed podłączeniem modułu.
      eyes: >-
        <strong>Ochrona oczu i twarzy</strong> dla wszystkich w zasięgu, gdy ktoś do niej
        strzela, także na stole warsztatowym.
      ricochet: >-
        <strong>Kulki odbijają się od twardej płyty</strong>, a niektóre wracają: ustaw stalową płytę pod kątem, żeby
        leciały w dół, w ziemię, nigdy płasko w stronę strzelającego.
      shield: >-
        <strong>Tarczą jest tylko płyta</strong>: nigdy nie strzelaj w skrzynkę, kabel ani
        złącze i trzymaj elektronikę za płytą lub w jej własnej obudowie.
      limits: >-
        <strong>Limity mocy terenu</strong> obowiązują przy strzelaniu do tarcz tak samo jak do graczy.
    photo: gotowa tarcza, płyta i czujnik, oraz port na skrzynce.
    full: >-
      Każdy krok, sprawdzenie i decyzja oraz to, co wciąż czeka na testy na stole:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/target-addon/BUILD.md">instrukcja budowy modułu tarczy</a>.
  out_module:
    title: Moduł wyjść I2C
    status: >-
      <strong>Zaprojektowany, jeszcze niezbudowany; późniejszy i opcjonalny.</strong> Jego firmware jest napisany (krok
      11 planu portu rozszerzeń) i przetestowany tylko na komputerze: kompiluje się dla RP2040, a jego
      plik UF2 jest dołączany do wydań, ale nigdy nie działał na płytce i żadna skrzynka nie sterowała
      prawdziwym. Według instrukcji nie zbudowano jeszcze żadnego modułu.
    what: >-
      Moduł do <a href="#expansion-port">portu rozszerzeń</a> skrzynki, który przełącza do czterech
      obciążeń (syrenę, stroboskop, klakson, niskonapięciowy pilot wytwornicy dymu) przez przekaźniki lub
      MOSFET-y, z <strong>własnego zasilania</strong>. Firmware działa na małej płytce RP2040:
      skrzynka utrzymuje wyjście włączone tylko, dopóki do niego pisze (każde wyjście wyłącza się 1,5&nbsp;s po tym,
      jak skrzynka przestanie), a moduł pilnuje własnych twardych limitów, maksymalnego czasu włączenia i minimalnego czasu
      wyłączenia na kanał, z drugim, niezależnym zabezpieczeniem. Około <span class="nowrap">€25–35</span>
      bez zasilania i obciążeń (szacunek z projektu).
    how: >-
      <strong>Izolator I2C</strong> (klasa ISO1540 lub ADuM1250) przenosi magistralę przez barierę:
      masa skrzynki i masa modułu nigdy się nie łączą, więc impuls z przekaźnika, zwarcie obciążenia czy
      odwrotnie podłączony akumulator zostają po stronie modułu. Strona skrzynki izolatora to
      jedyna rzecz na 3,3&nbsp;V portu (kilka mA); wszystko inne zasila własne wejście modułu
      9–15&nbsp;V (akumulator 12&nbsp;V lub własny pakiet syreny).
    simple_first: >-
      <strong>Najpierw użyj <a href="#field-box-simple-output">prostego wyjścia</a></strong>: dla jednej
      syreny, jednego stroboskopu lub jednego pilota dymu jest tańsze i prostsze, bez własnego firmware'u.
      Ten moduł jest dla skrzynki, która potrzebuje więcej kanałów, niż ma wolnych pinów, albo chce wiedzieć, że
      zasilanie obciążeń jest dostępne.
    rules_title: Zasady dla modułu wyjść
    rules:
      mains: >-
        <strong>Nigdy napięcie sieciowe.</strong> Przełącza tylko obciążenia bardzo niskiego napięcia bezpiecznego: najwyżej
        24&nbsp;V DC i 2&nbsp;A na kanał. Nic w nim, na nim ani do niego podłączone nigdy nie dotyka instalacji 230 ani
        110&nbsp;V, nawet przez przekaźnik o takich parametrach; urządzenie sieciowe wymaga fabrycznego,
        certyfikowanego, zamkniętego modułu przełączającego z niskonapięciowym wejściem sterującym.
      smoke: >-
        <strong>Wytwornice dymu tylko przez ich udokumentowane niskonapięciowe wejście zdalne</strong> (wejście
        stykowe lub niskonapięciowy wyzwalacz opisany w instrukcji producenta) albo akumulatorowe urządzenie dymne
        przeznaczone do wyzwalania stykiem. Wiele tanich sieciowych wytwornic mgły ma napięcie sieciowe na kablu
        przewodowego pilota: nigdy nie podłączaj do takiego przekaźnika i nigdy go nie otwieraj. Jeśli instrukcja nie
        mówi tego na piśmie, maszyny się nie używa.
      pyro: >-
        <strong>Nigdy pirotechnika</strong>, zapalniki ani granaty dymne.
      bare: >-
        <strong>Nigdy goła płytka przekaźników PCF8574 lub MCP23017</strong> na porcie zamiast niego: nie ma
        własnego limitu czasu, więc przekaźnik zostaje włączony, jeśli skrzynka się zawiesi.
    parts:
      board: >-
        <strong>Płytka RP2040</strong>: Raspberry Pi Pico lub RP2040-Zero.
      isolator: >-
        Płytka breakout z <strong>izolatorem I2C</strong>, klasy ISO1540 lub ADuM1250, z dwoma osobnymi
        zasilaniami i masami; rezystory pull-up po stronie skrzynki trzeba usunąć (ma je płytka
        portu).
      mosfet: >-
        <strong>MOSFET z kanałem P</strong> (klasa AO3401 lub SI2301) i rezystor 10&nbsp;kΩ, żeby
        ręcznie zrobiony kabel połączony odwrotnie nie mógł zasilić izolatora wstecznie.
      relays: >-
        4-kanałowa <strong>płytka przekaźników z optoizolacją, wyzwalana stanem wysokim</strong> (stan wysoki na wejściu
        włącza przekaźnik, albo zworka wyzwalania ustawiona na high), cewki 5&nbsp;V, styki co najmniej 2&nbsp;A przy
        30&nbsp;V DC i pull-down 10&nbsp;kΩ na każdym wejściu, żeby każdy przekaźnik był wyłączony, gdy
        płytka jest w resecie lub trwa wgrywanie firmware'u. Albo płytka MOSFET-ów do logiki 3,3&nbsp;V, do często
        przełączanych obciążeń DC, takich jak stroboskopy.
      supply: >-
        <strong>Własne zasilanie</strong>: wejście 9–15&nbsp;V DC, bezpiecznik zwłoczny 1&nbsp;A,
        dioda Schottky'ego klasy 1N5819 przeciw odwrotnie podłączonemu akumulatorowi i przetwornica
        step-down (klasa MP1584 lub LM2596) ustawiona na 5,0&nbsp;V dla płytki RP2040 i cewek przekaźników.
      loads: >-
        <strong>Dla każdego obciążenia</strong>: własny akumulator i własny bezpiecznik najwyżej 2&nbsp;A, przez
        bezpotencjałowe styki przekaźnika (COM i NO), oraz dioda zwrotna na syrenie silnikowej, klaksonie lub dowolnej
        cewce.
      connector: >-
        <strong>Męskie</strong> panelowe złącze M12, kodowanie A, 5 pinów, i kabel M12 (najwyżej
        2&nbsp;m), plastikowa obudowa IP65 około 150&nbsp;×&nbsp;110&nbsp;×&nbsp;70&nbsp;mm z
        dławnicami, dioda LED stanu, płytka uniwersalna, przewody i etykiety („SELV ONLY, NEVER MAINS”).
    pins_title: Piny modułu
    pins_intro: >-
      Tak jak używa ich firmware modułu, na złączach Pico lub RP2040-Zero; piny M12 idą tylko do
      strony skrzynki izolatora, a jego pin 3 (masa skrzynki) do niczego innego.
    pin:
      sda: "I2C SDA: strona modułu izolatora (4,7&nbsp;kΩ do jego 3,3&nbsp;V)"
      scl: "I2C SCL: strona modułu izolatora (4,7&nbsp;kΩ do jego 3,3&nbsp;V)"
      ch1: "OUT 1: IN1 płytki przekaźników, stan wysoki to włączony; 10&nbsp;kΩ do GND"
      ch2: "OUT 2: IN2; 10&nbsp;kΩ do GND"
      ch3: "OUT 3: IN3; 10&nbsp;kΩ do GND"
      ch4: "OUT 4: IN4; 10&nbsp;kΩ do GND"
      a0: "Zworka adresu do GND: dodaje 1"
      a1: "Zworka adresu do GND: dodaje 2"
      led: "Anoda diody LED stanu; katoda przez 1&nbsp;kΩ do GND"
      sense: "Pomiar zasilania (opcjonalny): dzielnik 100&nbsp;kΩ / 22&nbsp;kΩ z akumulatora obciążeń"
    pins_more: >-
      Adres to 0x5C, gdy obie zworki są rozwarte (0x5D–0x5F ze zworkami). 5&nbsp;V z przetwornicy
      idzie do VSYS w Pico lub do pinu 5&nbsp;V w RP2040-Zero, a 3V3 płytki do strony modułu
      izolatora.
    flash_title: Wgrywanie firmware'u i pierwsze uruchomienie
    flash:
      download: >-
        <strong>Pobierz plik UF2</strong>: <code>atalaia-output-module-&lt;version&gt;.uf2</code>
        z <a href="https://github.com/vakaobr/atalaia-project/releases">wydania</a>, od
        pierwszego po 0.7.0, sprawdzony z jego <code>SHA256SUMS</code> (niepodpisany). Ma
        domyślną listę kanałów, cztery ogólne przekaźniki po najwyżej 30&nbsp;s każdy, do pierwszego testu na stole;
        dla innych obciążeń zbuduj własny z listą kanałów tego, co jest zamontowane
        (<code>python3 tools/docker_module.py build</code>).
      boot: >-
        <strong>Wgraj go</strong> przy wyłączonym zasilaniu, odłączonym kablu M12 i odłączonych
        obciążeniach: przytrzymaj przycisk BOOT płytki, podłączając ją do USB komputera, skopiuj
        plik UF2 na dysk, który się pojawi, i odłącz USB.
      first: >-
        <strong>Pierwsze zasilenie, obciążenia odłączone</strong>: żaden przekaźnik nie klika, ani przy włączeniu, ani po 20
        cyklach zasilania, a LED pozostaje zgaszony (szybkie miganie oznacza, że firmware odrzucił listę
        kanałów).
      box: >-
        <strong>W skrzynce</strong>: skrzynka wykrywa go jako <code>5c:out4/1.0.0</code>, a jego wyjścia
        pozostają <strong>wyłączone, dopóki administrator skrzynki ich nie włączy</strong> na skrzynce, z funkcją
        i maksymalnym czasem włączenia każdego kanału; test administratora 1&nbsp;s klika wtedy po kolei każdym przekaźnikiem.
    after:
      lease: >-
        <strong>Wyłączenie w ciągu 1,5&nbsp;s</strong> przy włączonym przekaźniku, za każdym razem, gdy skrzynka traci zasilanie,
        resetuje się albo kabel zostaje przecięty lub odłączony (test na stole 5, mierzony na nagraniu).
      isolator: >-
        <strong>Izolator przy 3,0&nbsp;V portu</strong>, na dole jego zakresu, i niski poziom
        magistrali przez niego i bufor portu (oscyloskopem); pobór prądu modułu z
        portu (oczekiwane kilka mA).
      relays: >-
        <strong>Zadziałanie przekaźników od 3,3&nbsp;V</strong>, prąd ich cewek, własny pobór prądu
        modułu i wartość bezpiecznika wejściowego, pomiar zasilania w porównaniu z miernikiem oraz
        watchdog i zabezpieczenie na prawdziwej płytce.
      noise: >-
        <strong>Zakłócenia</strong>: syrena i stroboskop 12&nbsp;V przełączane przez 30 minut obok
        skrzynki i jej kabla, z liczeniem błędów CRC i pominiętych odpytań (test na stole 6).
      smoke: >-
        <strong>Dym</strong>: akumulatorowe urządzenie dymne lub wytwornica mgły z udokumentowanym
        wejściem niskonapięciowym, uruchamiane wybuchem w trybie Bomba i zatrzymywane przez „All outputs off” GM i przez
        koniec gry (test na stole 10).
    photo: gotowy moduł, obie strony izolatora i jego etykiety.
    full: >-
      Każda część, obie strony, zasilanie, obciążenia, piny, sprawdzenia i to, co czeka na testy
      na stole:
      <a href="https://github.com/vakaobr/atalaia-project/blob/main/hardware/output-module/BUILD.md">instrukcja budowy modułu wyjść I2C</a>.

hub:
  title: Hub społeczności
  intro: >-
    Tu spotkają się tereny, drużyny i konstruktorzy. Wszystko jest dobrowolne: hub przechowuje tylko to,
    co ktoś sam zdecyduje się opublikować, a dane z gier zostają na serwerach każdego terenu.
  open: Otwarte
  planned: Planowane
  later: Później
  discussion:
    title: Dyskusja
    text: Pytania, pomysły, recenzje projektu i relacje z wydarzeń.
    link: Przejdź do Discussions
  gallery:
    title: Galeria konstrukcji
    text: >-
      Zdjęcia, listy części, pliki obudów i notatki o okablowaniu każdej konstrukcji, począwszy od
      pierwszych prototypów Field Box.
  directory:
    title: Katalog terenów i drużyn
    text: >-
      Dobrowolna lista terenów i drużyn, które korzystają z Atalai, z regionem, typem terenu i linkiem
      kontaktowym.
  browser:
    title: Przeglądarka trybów i scenariuszy
    text: >-
      <a href="https://vakaobr.github.io/atalaia-modes/">Rejestr trybów</a> już działa, ale nie ma w nim jeszcze żadnego trybu: dodaj pierwszy. Przeglądarka
      z opisami i ocenami społeczności pojawi się później.
  stats:
    title: Statystyki użycia
    text: Dobrowolne, anonimowe sumy wersji, platform i rozegranych trybów. Domyślnie wyłączone.
  hosting:
    title: Hostowane serwery strony
    text: Dla klubów bez wsparcia IT, po kosztach, z danymi każdego klubu oddzielnie i z możliwością eksportu.

# Each entry: id (the anchor, stable ASCII), term (as shown) and text (1-3 sentences).
glossary:
  id: slownik
  title: Słownik
  intro: >-
    Techniczne słowa z tych stron, wyjaśnione prosto. Linki w tekście każdej strony prowadzą
    tutaj.
  groups:
    game: Gra
    hardware: Sprzęt
    radio: Radio i łączność
    software: Oprogramowanie
    licences: Licencje
  props:
    id: slownik-propy
    term: Urządzenia do gry (propy)
    text: >-
      Elektroniczne urządzenia używane w grze: skrzynki do przejęcia, bomby do uzbrojenia i rozbrojenia,
      terminale do zhakowania, tarcze do trafienia. W Atalai każde urządzenie może nim być: specjalnie
      zbudowana skrzynka, telefon albo mała płytka.
  field_box:
    id: slownik-field-box
    term: Field Box i Satellite
    text: >-
      Własne projekty urządzeń Atalai, zbudowane z ogólnodostępnych części wokół ESP32. Field Box to
      główne z nich, z dużymi przyciskami arcade, klawiaturą, ekranem, światłami, głośnikiem i czytnikiem
      NFC w wodoodpornej obudowie, za mniej więcej <span class="nowrap">70–110&nbsp;€</span> w częściach;
      Satellite to mniejsza skrzynka do punktu pomocniczego, za około
      <span class="nowrap">30–40&nbsp;€</span>. Firmware i instrukcja budowy Field Boxa są gotowe; pierwsza
      konstrukcja na stole warsztatowym (luźne kable, bez obudowy) już działa w grze (faza&nbsp;1).
  milsim:
    id: slownik-milsim
    term: Milsim
    text: >-
      Skrót od symulacji wojskowej (military simulation): długie gry, często na cały weekend, z misjami,
      łańcuchem dowodzenia i realistycznymi zasadami. To największy test dla Atalai: od 10 do 20 skrzynek
      i satelitów rozmieszczonych na dużym terenie.
  cqb:
    id: slownik-cqb
    term: CQB
    text: >-
      Close-quarters battle, czyli walka na krótkim dystansie: gry w domach, pałacykach, magazynach i innych
      ciasnych miejscach, zwykle o średnicy poniżej około 150 m. Wszystko jest blisko i szybko, więc profil CQB
      w Atalai używa krótszych czasów przejęcia i bomby, a skrzynki umieszcza na planie budynku zamiast
      używać GPS.
  chrono:
    id: slownik-chrono
    term: Chrono i dżule
    text: >-
      Chrono (chronograf) mierzy, jak szybko replika wystrzeliwuje kulkę BB. Z prędkości i masy kulki
      wynika jej energia w dżulach, którą tereny ograniczają dla każdego typu repliki: kulka 0,20&nbsp;g przy
      100&nbsp;m/s (około 328&nbsp;fps) niesie 1 dżul. Atalaia przechowuje pomiary każdej repliki, podpisane
      przez sędziego, dzięki czemu sędziowie mogą robić wyrywkowe kontrole w ciągu dnia (zbudowane w
      oprogramowaniu, jeszcze nieużywane na terenie gry); o każdej karze zawsze decyduje człowiek.
  stuck_box:
    id: "slownik-skrzynka-w-zakonczonej-grze"
    term: "Skrzynka w zakończonej grze"
    text: >-
      Skrzynka, która była wyłączona lub poza zasięgiem, gdy jej gra się skończyła, więc wciąż
      uważa, że jest w tej grze: pokazuje starą grę i odrzuca nowe zaproszenia („w innej grze”). Od
      v0.9.0 (wydane 6 listopada 2026; na razie jeden test na stole warsztatowym) kontroler, gdy
      usłyszy taką skrzynkę, ponownie wysyła koniec tej gry, konsola GM pokazuje ją z przyciskiem do
      jej uwolnienia, a menu administratora skrzynki ma opcję opuszczenia gry.
  microcontroller:
    id: slownik-mikrokontroler
    term: Mikrokontroler
    text: >-
      Kompletny, maleńki komputer w jednym układzie scalonym, stworzony do uruchamiania jednego programu.
      Startuje w mgnieniu oka, zużywa bardzo mało baterii i jest tani, dlatego zwykle jest mózgiem
      elektronicznego urządzenia do gry. Płytki ESP32 i Arduino to płytki z mikrokontrolerem.
  esp32:
    id: slownik-esp32
    term: ESP32
    text: >-
      Popularny, tani mikrokontroler z wbudowanym Wi-Fi i Bluetoothem; wiele płytek ma też radio
      LoRa. To mózg Field Boxa, Satellite i modułu I/O, który powinien utrzymać urządzenie w działaniu
      przez jeden do trzech dni na baterii (to szacunek, jeszcze niezmierzony). Płytki, które ktoś już ma,
      też mogą dołączyć, nawet
      bez dodatkowej pamięci (PSRAM), z kilkoma ograniczeniami.
  arduino:
    id: slownik-arduino
    term: Płytka klasy Arduino, cienki węzeł
    text: >-
      Proste, bardzo tanie płytki z mikrokontrolerem w stylu Arduino, np. z układami AVR lub
      RP2040. Są za małe, by uruchamiać tryby gry, więc w Atalai działają jako cienkie węzły:
      udostępniają swoje przyciski, światła lub czujniki pobliskiej skrzynce albo kontrolerowi terenu,
      który prowadzi za nie zasady gry.
  raspberry_pi:
    id: slownik-raspberry-pi
    term: Raspberry Pi
    text: >-
      Mały, tani komputer wielkości mniej więcej karty kredytowej, działający pod Linuksem. Z dodaną płytką
      radia LoRa będzie typowym kontrolerem terenu (około <span class="nowrap">80–150&nbsp;€</span>
      za całość), a
      może też obsługiwać urządzenia do gry, które potrzebują dużego ekranu albo kamery.
  android:
    id: slownik-android-prop
    term: Urządzenie z Androidem i moduł I/O
    text: >-
      Aplikacja Atalaia zmienia telefon lub tablet z Androidem, nowy albo zapasowy z 2017 roku lub nowszy,
      w urządzenie do gry, które uruchamia dowolny tryb gry na swoim ekranie. Telefony nie mają radia LoRa,
      a ekrany dotykowe trudno obsługiwać w rękawicach, więc mała skrzynka z ESP32, moduł I/O
      (wejście/wyjście), łączy się kablem lub przez Bluetooth, dodając radio, duże przyciski, światła i syrenę.
      Oba są zbudowane w oprogramowaniu (faza&nbsp;3) i przetestowane na emulatorach i komputerze, jeszcze
      nie na prawdziwym telefonie ani module.
  firmware:
    id: slownik-firmware
    term: Firmware i flashowanie
    text: >-
      Firmware to program wbudowany w urządzenie, który startuje po jego włączeniu. Flashowanie
      oznacza wgranie na urządzenie jego nowej wersji, zwykle przez kabel USB. Skrzynki Atalai
      flashuje się kablem za pierwszym razem; potem aktualizacje firmware'u przychodzą z kontrolera
      terenu przez Wi-Fi (wypróbowane na płytkach na stole warsztatowym od października 2026) i
      cofają się same, jeśli nowa wersja nie wystartuje. Skrzynka instaluje tylko wydanie podpisane
      jednym z wbudowanych w nią kluczy wydań projektu. W listopadzie 2026 projekt zmienił jeden z
      tych kluczy: skrzynka z v0.6.1 lub starszą instaluje v0.7.0 przed v0.8.0.
  lora:
    id: slownik-lora
    term: LoRa
    text: >-
      Skrót od <em>long range</em> (daleki zasięg): radio, które wysyła krótkie wiadomości daleko
      przy bardzo małym poborze mocy, bez karty SIM, zasięgu sieci komórkowej i abonamentu. Na
      typowym terenie gry powinno sięgać mniej więcej <span class="nowrap">0,5–2&nbsp;km</span>
      (szacunek projektowy, jeszcze do zmierzenia) i lepiej niż Wi-Fi przechodzi przez grube ściany.
      Haczyk: wiadomości muszą być krótkie, a każde urządzenie może nadawać tylko przez niewielką
      część czasu. Atalaia domyślnie używa 869,525&nbsp;MHz, w jedynym podpaśmie EU868, które
      pozwala na 10% czasu nadawania (duty cycle) i 500&nbsp;mW, co daje każdej skrzynce do 6 minut
      nadawania na godzinę — wystarczająco na zdarzenia, wyniki i sygnały synchronizacji czasu, z
      dużym zapasem. Teren może wybrać inny kanał, który pozwala na 1% czasu lub mniej i 25&nbsp;mW;
      gdy GM zmienia kanał, wyłączona skrzynka nie usłyszy zmiany i trzeba ją odnaleźć ponownie.
      Skrzynki wysyłają tylko to, co się zmienia, np. „czerwoni przejęli B”.
  mesh:
    id: slownik-mesh
    term: Mesh
    text: >-
      Sieć, w której urządzenia przekazują sobie nawzajem wiadomości, więc skrzynkę zbyt odległą od bazy
      słychać przez skrzynki pośrodku. Atalaia powtarza każdą wiadomość tylko kilka razy, żeby
      radio się nie zapychało, a organizatorzy mogą rozstawić dodatkowe skrzynki jako przekaźniki w trudnym
      terenie.
  skirmesh:
    id: slownik-skirmesh-rf
    term: Skirmesh-RF
    text: >-
      Własny protokół radiowy Atalai: uzgodniony format, w którym skrzynki, kontroler i aplikacje
      wymieniają wiadomości, przez LoRa, Wi-Fi lub Bluetooth. Jest publicznie udokumentowany, więc każdy może
      zbudować urządzenie, które się do niego podłączy, a każda wiadomość jest szyfrowana i podpisana kluczem
      danej gry, więc gracz z radiem nie może tak po prostu sfałszować przejęcia. Jest zbudowany i
      przetestowany w oprogramowaniu, jeszcze nie na terenie gry.
  links:
    id: slownik-wifi-ble-nfc-qr
    term: Wi-Fi, BLE, NFC i kody QR
    text: >-
      Codzienne łącza krótkiego zasięgu, każde z własnym zadaniem. Wi-Fi (około
      <span class="nowrap">50–150&nbsp;m</span>) przenosi rzeczy obszerne: konsolę organizatorów,
      aplikację dla graczy, nowe tryby i aktualizacje; BLE, czyli Bluetooth Low Energy
      (<span class="nowrap">10–30&nbsp;m</span>), łączy telefon z jego modułem i paruje urządzenia. NFC to
      odczyt przez przyłożenie, jak karta zbliżeniowa, dla znaczników drużyn, opasek i kart dołączenia, a kody QR
      skanuje się aparatem telefonu, żeby dołączyć do gry lub wpisać kod.
  api:
    id: slownik-api
    term: "API: MQTT, REST i WebSocket"
    text: >-
      API to udokumentowany sposób, w jaki inne programy mogą odczytywać grę i, za zgodą, nią sterować.
      Dzięki niemu klub będzie mógł obsłużyć dużą tablicę wyników LED, nakładkę z wynikiem na żywo na
      streamie, powiadomienia na Discordzie lub Telegramie albo przekaźnik, który odpala dym i syreny, gdy
      bomba wybuchnie. MQTT, REST i WebSocket to trzy standardowe sposoby dostępu, więc działają z nim zwykłe
      narzędzia. Kontroler terenu ma je od fazy&nbsp;2, z gotową stroną tablicy wyników; zostało
      przetestowane na komputerze, jeszcze nie na terenie gry.
  atak:
    id: slownik-atak
    term: ATAK
    text: >-
      Android Team Awareness Kit: aplikacja mapowa stworzona dla wojska, z darmową wersją cywilną,
      której wiele drużyn milsim używa, żeby widzieć członków drużyny na wspólnej mapie. Kontroler terenu
      Atalai będzie mógł pokazywać skrzynki na tych mapach i to, która drużyna zajmuje każdą z nich
      (faza&nbsp;4).
  local_first:
    id: slownik-local-first
    term: Local-first
    text: >-
      Wszystko, czego potrzebuje gra, działa na samym terenie, na skrzynkach i kontrolerze terenu, więc
      działa zupełnie bez internetu i zasięgu komórkowego. Gdy internet jest dostępny, dodaje tylko
      dodatki, takie jak konta i historia gier. Skrzynka, która straci łączność, gra dalej i liczy
      wynik, a po powrocie łącza nadrabia zaległości.
  core:
    id: slownik-rdzen
    term: Wspólny rdzeń (C11)
    text: >-
      Serce Atalai: jeden program napisany w języku programowania C (w wersji z 2011 roku,
      stąd C11), którego używa każde urządzenie uruchamiające tryby gry. Obsługuje zdarzenia, wyniki i wiadomości
      radiowe oraz bezpiecznie uruchamia tryby gry; każdy rodzaj sprzętu dodaje tylko cienką warstwę ze
      sterownikami obsługującymi jego przyciski, ekran i radio. Już dziś istnieje.
  lua:
    id: slownik-lua
    term: Lua i skrypty trybów gry
    text: >-
      Tryb gry to skrypt: krótki plik tekstowy z zasadami, np. „przytrzymaj 5 sekund, aby
      przejąć”, napisany w Lua, małym języku programowania dobrze znanym z modowania gier wideo.
      Skrypty działają w piaskownicy (sandbox), zamkniętej przestrzeni bez dostępu do plików i sieci, więc
      udostępniony tryb nie może zaszkodzić urządzeniu. Organizatorzy nigdy nie muszą dotykać Lua: wybierają
      tryb i wypełniają jego ustawienia, a wizualny edytor oparty na blokach pojawi się w fazie&nbsp;5.
  simulator:
    id: slownik-symulator
    term: Symulator
    text: >-
      Program, który rozgrywa tryb gry z wirtualnymi skrzynkami w przeglądarce: naciskasz przyciski drużyn
      na ekranie i obserwujesz wyświetlacz każdej skrzynki oraz dziennik zdarzeń. Działa na zwykłym
      komputerze i już dziś istnieje, więc każdy może wypróbować Domination i Bombę, zanim powstanie
      jakikolwiek sprzęt.
  controller:
    id: slownik-kontroler-terenu
    term: Kontroler terenu
    text: >-
      Stacja bazowa gry: mały komputer, zwykle Raspberry Pi lub urządzenie z Androidem, który
      słyszy każdą skrzynkę przez radio, prowadzi zasady obejmujące kilka skrzynek, przechowuje
      oficjalny wynik i udostępnia konsolę organizatorów na ich telefony. Jeśli zawiedzie, skrzynki
      grają dalej, a inne zdolne do tego urządzenie przejmuje jego rolę; pojedyncza skrzynka może też poprowadzić grę bez
      niego. Jest zbudowany (faza&nbsp;2) i działa z prawdziwymi skrzynkami na stole warsztatowym, jeszcze nie na
      terenie gry; na urządzeniu z Androidem jest zbudowany w oprogramowaniu (faza&nbsp;3), jeszcze niewypróbowany
      na prawdziwym telefonie.
  server:
    id: slownik-serwer-strony
    term: Serwer strony
    text: >-
      Opcjonalny komputer, na terenie lub wynajęty w sieci, który przechowuje to, co trwa dłużej niż jedna gra:
      konta graczy, historię gier, rejestr chrono i usługi stojące za aplikacją dla graczy.
      Gry nigdy na niego nie czekają. Jest zbudowany (faza&nbsp;4) i działa na serwerze testowym, jeszcze nie na
      prawdziwym terenie, a hub społeczności planuje serwery hostowane, po kosztach, dla klubów bez wsparcia IT.
  open_source:
    id: slownik-open-source
    term: Open source i wolne oprogramowanie
    text: >-
      Kod źródłowy, czyli czytelny dla człowieka przepis na program, jest publiczny i każdy może go używać,
      badać, zmieniać i udostępniać, także komercyjnie. „Wolne” oznacza tu wolność, nie cenę: tereny
      mogą pobierać opłaty za wejście, a konstruktorzy sprzedawać skrzynki.
  copyleft:
    id: slownik-copyleft
    term: "Copyleft: GPL i AGPL"
    text: >-
      Zasada, która utrzymuje Atalaię otwartą: używanie jej w obecnej postaci niczego od ciebie nie wymaga,
      ale przekazanie zmienionej wersji oznacza udostępnienie jej kodu źródłowego na tej samej licencji. GPL,
      dla rdzenia, firmware'u, aplikacji i trybów, obowiązuje, gdy dajesz lub sprzedajesz kopie; AGPL, dla
      kontrolera terenu i serwera strony, obowiązuje też wtedy, gdy uruchamiasz zmienioną wersję dla innych
      osób przez sieć. Projekty sprzętu (CERN-OHL-S) i dokumentacja (CC BY-SA) działają tak samo.

involved:
  title: Dołącz
  intro: "Atalaię tworzą gracze, właściciele terenów i konstruktorzy. Już dziś możesz pomóc:"
  review: >-
    recenzując
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/docs/design-spec.md">specyfikację
    projektu</a> i <a href="https://github.com/vakaobr/atalaia-project/issues">zgłaszając
    issues</a>;
  propose: >-
    proponując tryby gry za pomocą
    <a href="https://github.com/vakaobr/atalaia-project/issues/new/choose">szablonu pomysłu na tryb
    gry</a>;
  share: opisując, jak grają u ciebie na terenie, żeby ustawienia domyślne pasowały do prawdziwych gier;
  code: >-
    pisząc kod: zacznij od
    <a href="https://github.com/vakaobr/atalaia-project/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a>.
  rules: >-
    Każdy commit zawiera linię <code>Signed-off-by</code>, a projekt jest ściśle
    clean-room, pisany od zera: żadnego kodu, firmware'u, instrukcji, dźwięków ani obrazów z jakiegokolwiek
    produktu komercyjnego.

name:
  title: Nazwa
  badge_alt: >-
    Odznaka Atalai: trzy wieże strażnicze na wydmach, z ogniami sygnałowymi na szczytach połączonymi
    łukiem, nad słowem ATALAIA.
  word: >-
    <em>Atalaia</em> to wieża strażnicza: punkt obserwacyjny na wzgórzu lub na odcinku wybrzeża. Słowo
    trafiło do portugalskiego z arabskiego <em>aṭ-ṭalāʾiʿ</em>, „zwiadowcy”, a <em>estar de
    atalaia</em> nadal znaczy „być na czatach”.
  fit: >-
    Kontroler terenu widzi każde urządzenie na terenie gry i w chwili, gdy coś się zmienia, informuje GM.
    Wieże strażnicze też były local-first i tworzyły pierwotny mesh o małej przepustowości: dym za dnia, ogień
    nocą, przekazywane z wieży do wieży. Skirmesh-RF działa według tych samych zasad, tylko z LoRa.

safety:
  title: Bezpieczeństwo na terenie
  text: >-
    Urządzenia Atalai to sprzęt do gry. Niech wyglądają jak urządzenia do gry: jaskrawe kolory, wyraźne
    etykiety „GAME PROP” i nic, co przypominałoby prawdziwy ładunek wybuchowy. Przewoź je w oznaczonych
    skrzyniach, nigdy nie zostawiaj bez nadzoru poza terenem gry i obchodź się ostrożnie z bateriami litowymi.

footer:
  licences: >-
    Atalaia to wolne oprogramowanie: GPL-3.0-or-later dla rdzenia, firmware'u, aplikacji i trybów;
    AGPL-3.0-or-later dla kontrolera terenu i serwera strony; CERN-OHL-S-2.0 dla sprzętu;
    CC BY-SA 4.0 dla dokumentacji i tej strony.
  flags: >-
    Flagi języków: Twemoji Country Flags, grafika z Twemoji (Twitter, Inc i współtwórcy), CC BY 4.0, ograniczone do czterech flag.
  flags_licence: CC BY 4.0
  licensing: Licencje
  manuals: Instrukcje dla graczy, organizatorów, sędziów i operatorów skrzynek
  independent: >-
    Niezależny projekt prowadzony przez społeczność; niezwiązany z żadnym komercyjnym producentem urządzeń do gry.
    Ta strona nie ustawia ciasteczek i niczego nie ładuje z innych witryn.
  privacy: Informacja o prywatności (wersja robocza)
  privacy_note: >-
    Informacja, którą serwer strony pokazuje swoim graczom. To szablon dla operatorów: przedstawia stanowiska prawne zatwierdzone przez prawnika opiekuna projektu 30 października 2026, ale samo sformułowanie jest wciąż wersją roboczą, jeszcze niesprawdzoną przez prawnika, i każdy teren musi je sprawdzić i przyjąć jako własne.
  privacy_href: https://github.com/vakaobr/atalaia-project/tree/main/docs/templates

# The two radio diagrams: site/src/diagrams/*.svg, built into site/img/diagrams/.
# Plain text, not HTML. Each text has a fixed room in the drawing; if a
# translation does not fit, tools/build_site.py names the key and the line.
diagrams:
  lora:
    title: Jak działa radio LoRa
    desc: >-
      Pięć paneli. Chirpy: LoRa wysyła każdy symbol jako ton przemiatający kanał, a odbiornik,
      który zna wzorzec, odkoduje go nawet poniżej szumu tła, więc sięga daleko przy małej mocy,
      ale przenosi tylko krótkie wiadomości. Spreading factor: każdy krok w górę od SF7 mniej
      więcej podwaja czas nadawania wiadomości, za nieco większy zasięg; skrzynki używają dziś SF7.
      Zasięg: najdłuższy w otwartym terenie przy widoczności, krótszy przez las, ludzi i pojazdy,
      dużo krótszy w budynkach, a odcięty przez beton, metal lub wzgórze, gdzie skrzynka pośrodku
      może przekazać sygnał; 868 MHz lepiej przechodzi przez przeszkody niż Wi-Fi 2,4 GHz czy
      Bluetooth. Szacunek projektowy około 0,5–2 km na typowym terenie otwartym zostanie
      zmierzony w teście terenowym fazy 2. Przekaźniki: skrzynkę poza zasięgiem kontrolera
      słychać przez inne skrzynki, a wiadomość domyślnie jest przekazywana najwyżej dwa razy. Zasady w Europie:
      jeden wspólny kanał gry, domyślnie 869,525 MHz, jedyna część pasma pozwalająca na
      500 mW i 10% czasu, 6 minut na godzinę dla każdego urządzenia; inne kanały: 25 mW
      i 1% lub mniej.
    chirp:
      title: "Chirpy: słyszalne pod szumem"
      sweep: chirp przemiata kanał
      noise: szum
      below: odkodowany nawet pod szumem
      text: >-
        Odbiornik zna wzorzec, więc słyszy go pod szumem: duży zasięg przy małej mocy, ale wolno,
        więc wiadomości są krótkie.
    sf:
      title: Spreading factor (SF)
      axis: Czas nadawania tej samej wiadomości
      text: >-
        Każdy krok w górę ok. podwaja czas nadawania za nieco większy zasięg. Skrzynki mają dziś SF7; projekt zakłada SF9–10 na duże tereny.
    range:
      title: Otwarty teren, budynek
      axis: Jak daleko dociera wiadomość (szkic, bez skali)
      open: Otwarty teren, w widoczności
      woods: Las, ludzie, pojazdy
      walls: "W budynku: mury, cegła, kamień"
      blocked: Beton, metal, za wzgórzem
      relay: → pomoże przekaźnik
      text: >-
        868 MHz lepiej niż Wi-Fi 2,4 GHz czy Bluetooth przechodzi przez ściany, ludzi i liście, ale
        beton, metal i wzgórza mocno je tłumią.
      note: >-
        Szacunek projektowy: około 0,5–2 km na typowym terenie otwartym. Zmierzy to test terenowy
        fazy 2.
    relay:
      title: Skrzynki przekazują dalej
      controller: Kontroler
      box_a: Skrz. A powtarza
      box_b: Skrz. B
      text: >-
        Skrzynkę poza zasięgiem kontrolera słychać przez inne. Wiadomość jest domyślnie przekazywana
        najwyżej dwa razy (limit skoków), więc kanał pozostaje wolny.
    rules:
      title: Zasady eteru w Europie (EU868)
      hour: 1 godz.
      share: Każde urządzenie może nadawać najwyżej 10% czasu, 6 minut na godzinę.
      text: >-
        Jeden wspólny kanał, domyślnie 869,525 MHz: jedyna część pasma z 500 mW i 10%.
        Inne kanały: 25 mW, 1% lub mniej. Bez licencji i karty SIM.
  skirmesh:
    title: Skirmesh-RF na urządzeniach
    desc: >-
      Po lewej pięć warstw Skirmesh-RF od dołu: 1, radio LoRa na jednym wspólnym kanale gry;
      2, pakiet Skirmesh-RF, z szyfrowaniem AES-128-CCM kluczem każdej gry, numerami epoki
      i sekwencji przeciw powtórkom, limitem skoków (domyślnie dwa przekazania), ACK, sygnałami TIME i
      CLAIM do przejęcia roli kontrolera; 3, wiadomości HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG i
      CLAIM w CBOR; 4, wspólny rdzeń C i tryby gry w Lua; 5, API REST, WebSocket i MQTT kontrolera
      terenu, konsola GM, tablica wyników i kody dołączenia (karty NFC dla skrzynek, kody QR dla
      kontrolera zapasowego i, w fazie 3, telefonów). Po prawej
      warstwy każdego urządzenia. Zbudowane i przetestowane w oprogramowaniu, jeszcze nie na terenie:
      Field Box (warstwy 1–4), modem radiowy USB (1 i 2), kontroler terenu na Raspberry Pi
      lub PC (2–5) oraz konsola GM na telefonach przez Wi-Fi, które używają warstwy 5 bez radia LoRa.
      Zbudowane w oprogramowaniu również dla fazy 3: moduł I/O (1 i 2), który daje telefonowi lub
      tabletowi z Androidem (2–4) radio, i aplikacja dla graczy. Planowane: skrzynka Satellite (1–4).
    stack: Jeden protokół, warstwy
    l5:
      title: Usługi kontrolera terenu
      text: >-
        API REST, WebSocket i MQTT, konsola GM, tablica wyników. Kody: karty NFC dla skrzynek,
        kody QR dla kontrolera zapasowego i, w fazie 3, telefonów.
    l4:
      title: "Gra: wspólny rdzeń, tryby Lua"
      text: >-
        Ten sam rdzeń C i tryby Lua działają na każdym grającym urządzeniu: zasady stref na skrzynkach,
        zasady całego terenu na kontrolerze.
    l3:
      title: Komunikaty
      text: >-
        HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG i CLAIM, spakowane w zwarty CBOR. Przez Wi-Fi
        te same zdarzenia idą jako JSON.
    l2:
      title: Pakiet Skirmesh-RF
      crypto: Szyfrowanie AES-128-CCM, klucz na grę
      replay: "Epoka i sekwencja: powtórki odrzucane"
      hops: "Limit skoków: domyślnie najwyżej 2"
      acks: "ACK: zgubione idą ponownie"
      time: Sygnały TIME zgrywają zegary
      claim: "CLAIM: zapasowy może przejąć rolę"
    l1:
      title: Radio LoRa
      text: Wspólny kanał gry, domyślnie 869,525 MHz, słuchany przez każde urządzenie.
    devices: Które urządzenie ma które warstwy
    cells: "Kolor: obsługiwane warstwy"
    box_sub: ESP32-S3 i radio LoRa SX1262
    satellite: Satellite
    satellite_sub: "Plan: mniejsza skrzynka ESP32"
    modem: Modem radia USB
    modem_sub: "Do kontrolera: radio, szyfrowanie"
    controller: Kontroler terenu
    controller_sub: "Raspberry Pi lub PC: gra, API"
    pod: Moduł I/O
    pod_sub: "Faza 3: daje telefonowi radio i przyciski"
    android: Android
    android_sub: "Faza 3: telefon/tablet uruchamia tryby"
    wifi: Telefony z Wi-Fi
    wifi_sub: Konsola GM, aplikacja
    legend: >-
      Ciągła: zbudowane, testowane na komputerze i w emulatorze, nie na terenie. Przerywana:
      planowane. Telefony z Wi-Fi używają warstwy 5, bez radia LoRa.

# The "How it fits together" page (site/src/architecture.html): its texts, then the labels
# of the seven Mermaid diagrams (site/src/diagrams/arch-*.mmd), drawn into SVGs by
# tools/render_diagrams.py. After changing a label, run it again. A label may not hold
# a double quote, a backtick, a semicolon or a hash. arch.tNNN: the English text is in en.yaml;
# the same text has the same key. **x** is bold, \n a line break, <br/> a line break in a plain label.
architecture:
  title: "Jak to wszystko się łączy"
  intro: "Która część Atalai rozmawia z którą, jakim łączem i co nim przesyła. Pod każdym diagramem: co płynie, a co nie."
  status: "Atalaia jest w fazie pre-alfa. Na prawdziwych płytkach, na stole warsztatowym, działały: uruchamianie, radio, przyciski i klawiatura, przypisywanie, aktualizacja przez radio oraz całe gry z kontrolerem terenu. Aplikacja na iOS przeszła swoją listę kontrolną na iPhonie. Reszta jest zbudowana i przetestowana tylko w oprogramowaniu."
  reading: "Jak czytać pierwszy diagram: linia ciągła działa bez internetu na terenie gry, linia przerywana wymaga internetu."
  flows: "Co płynie"
  not: "Co nie płynie"
  full: "Otwórz diagram w pełnym rozmiarze"
  scroll: "Szeroki diagram: przewiń w bok."
  doc: "Te same diagramy jako żywy Mermaid, z pełnym tekstem i miejscami, w których projekt i kod się różnią: docs/architecture.md na GitHubie →"
  link_roadmap: "Jak części rozmawiają ze sobą: diagramy architektury →"
  link_build: "Nie wiesz, co się do czego podłącza? Zobacz, jak części rozmawiają ze sobą →"
  d1:
    title: "Cały system"
    flows: "Ruch gry zostaje na terenie. Skrzynki i kontroler rozmawiają przez LoRa za pośrednictwem modemu USB. Konsola GM, aplikacja dla graczy, propy na Androidzie i pliki pobierane przez skrzynkę korzystają z własnego Wi-Fi terenu."
    not:
      - "Nic w grze nie czeka na internet. Serwer strony jest opcjonalny."
      - "Pozycje graczy nigdy nie idą przez LoRa ani MQTT."
      - "Serwer strony nigdy nie łączy się z kontrolerem: to kontroler zawsze otwiera połączenie."
      - "Skrzynki nigdy nie rozmawiają z internetem. Tryby pobiera kontroler, a firmware wgrywa człowiek."
  d2:
    title: "Warstwy radia"
    flows: "Każdy pakiet jest szyfrowany i sprawdzany za pomocą AES-128-CCM kluczem gry. Modem zamyka i otwiera pakiety, więc kontroler i modem wymieniają po kablu jawne ramki. Skrzynki powtarzają nawzajem swoje pakiety."
    not:
      - "Przez LoRa nie idą pozycje, nazwy, tokeny, hasła Wi-Fi, obrazy firmware'u ani pakiety trybów."
      - "Duże pliki są pobierane przez HTTPS. Tylko krótka oferta lub raport o błędzie używa LoRa."
  d3:
    title: "Gra od zaproszenia do końca"
    flows: "Wolna skrzynka ogłasza się, a GM ją zaprasza. Dane dołączenia (id i klucz gry, rola, drużyny, kanał) przychodzą zaszyfrowane. Gra startuje dopiero, gdy każda rola ma skrzynkę. Potem skrzynki wysyłają zdarzenia oraz STATE co 15 s."
    not:
      - "Konsola GM nigdy nie mówi przez LoRa: rozmawia tylko z kontrolerem."
      - "Klucz gry podróżuje tylko w zaszyfrowanym zaproszeniu (lub na karcie), nigdy w ogłoszeniu."
  d4:
    title: "Gracze w dniu gry"
    flows: "Gracz skanuje plakat, przypina CA terenu, robi check-in i dostaje token. Potem aplikacja śledzi strumień na żywo. Sędzia podpisuje pomiary chrono na własnym telefonie."
    not:
      - "Pozycje nigdy nie idą przez LoRa ani MQTT i nigdy nie trafiają do graczy o innych rolach."
      - "Internet nie jest potrzebny: wszystko to działa przy wyłączonym serwerze strony."
  d5:
    title: "Kontroler i serwer strony"
    flows: "Kontroler wysyła gry, zdarzenia, wyniki, węzły i zapisy chrono co 30 s w trakcie gry i co 5 min między grami. Pobiera harmonogramy, listy uczestników i ustawienia. Strumień przenosi widok na żywo i polecenia zdalnego GM, które kontroler sprawdza ponownie."
    not:
      - "Serwer strony nigdy nie łączy się z kontrolerem i nigdy nie przechowuje klucza gry, klucza dołączenia ani tokenów."
      - "Praca offline jest normalna: zdarzenia czekają i są wysyłane później, po kolei."
      - "Pozycje opuszczają kontroler tylko w dwóch przypadkach wymagających zgody (zdalny GM, zdalny przekaźnik ATAK), w pamięci."
  d6:
    title: "Jak coś trafia na skrzynkę"
    flows: "Klucze wydań i klucze trybów podpisują pliki, a ich publiczne połowy są wbudowane w skrzynkę. Człowiek pobiera podpisany firmware i wgrywa go do kontrolera. Kontroler oferuje aktualizację przez LoRa, a skrzynka pobiera ją przez Wi-Fi terenu. Skrzynkę przypisuje się kablem USB, kartą NFC lub kodem parowania."
    not:
      - "Plik czyni bezpiecznym podpis, nie kanał: skrzynka decyduje kluczami z własnego firmware'u, zanim zapisze choćby bajt."
      - "Kontroler nigdy nie pobiera firmware'u z GitHuba."
      - "Klucze wydań i klucze trybów to osobne klucze."
  d7:
    title: "Logowanie i konta na serwerze strony"
    flows: "Krótkotrwały token dostępu plus token odświeżania wymieniany przy każdym użyciu. Role obsługi liczą się tylko w sesji z drugim składnikiem (TOTP lub passkey). Samo logowanie przez serwis społecznościowy nie jest drugim składnikiem."
    not:
      - "Kontroler nie używa tych kont: używa klucza API terenu."
      - "Z dostawcą logowania społecznościowego łączy się tylko przeglądarka danej osoby i serwer strony, nigdy kontroler, skrzynka ani modem."
