<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1302" width="420" height="1302" role="img" aria-labelledby="title desc" xml:lang="pl" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Skirmesh-RF na urządzeniach</title>
  <desc id="desc">Po lewej pięć warstw Skirmesh-RF od dołu: 1, radio LoRa na jednym wspólnym kanale gry; 2, pakiet Skirmesh-RF, z szyfrowaniem AES-128-CCM kluczem każdej gry, numerami epoki i sekwencji przeciw powtórkom, limitem skoków (domyślnie dwa przekazania), ACK, sygnałami TIME i CLAIM do przejęcia roli kontrolera; 3, wiadomości HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG i CLAIM w CBOR; 4, wspólny rdzeń C i tryby gry w Lua; 5, API REST, WebSocket i MQTT kontrolera terenu, konsola GM, tablica wyników i kody dołączenia (karty NFC dla skrzynek, kody QR dla kontrolera zapasowego i, w fazie 3, telefonów). Po prawej warstwy każdego urządzenia. Zbudowane i przetestowane w oprogramowaniu, jeszcze nie na terenie: Field Box (warstwy 1–4), modem radiowy USB (1 i 2), kontroler terenu na Raspberry Pi lub PC (2–5) oraz konsola GM na telefonach przez Wi-Fi, które używają warstwy 5 bez radia LoRa. Zbudowane w oprogramowaniu również dla fazy 3: moduł I/O (1 i 2), który daje telefonowi lub tabletowi z Androidem (2–4) radio, i aplikacja dla graczy. Planowane: skrzynka Satellite (1–4).</desc>
  <rect x="0.5" y="0.5" width="419" height="1301" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
  <text x="16" y="34" font-size="20" font-weight="600">Skirmesh-RF na urządzeniach</text>

