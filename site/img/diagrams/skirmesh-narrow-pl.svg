    <g font-size="16" font-weight="600">
      <text x="52" y="67">Usługi kontrolera terenu</text>
      <text x="52" y="186">Gra: wspólny rdzeń, tryby Lua</text>
      <text x="52" y="305">Komunikaty</text>
      <text x="52" y="424">Pakiet Skirmesh-RF</text>
      <text x="52" y="582">Radio LoRa</text>
    </g>
    <g fill="#56606a">
      <text x="52" y="87"><tspan x="52">API REST, WebSocket i MQTT, konsola GM,</tspan><tspan x="52" dy="19.5">tablica wyników. Kody: karty NFC dla</tspan><tspan x="52" dy="19.5">skrzynek, kody QR dla kontrolera</tspan><tspan x="52" dy="19.5">zapasowego i, w fazie 3, telefonów.</tspan></text>
      <text x="52" y="206"><tspan x="52">Ten sam rdzeń C i tryby Lua działają na</tspan><tspan x="52" dy="19.5">każdym grającym urządzeniu: zasady stref</tspan><tspan x="52" dy="19.5">na skrzynkach, zasady całego terenu na</tspan><tspan x="52" dy="19.5">kontrolerze.</tspan></text>
      <text x="52" y="325"><tspan x="52">HELLO, EVENT, ACK, STATE, CMD, TIME,</tspan><tspan x="52" dy="19.5">CONFIG i CLAIM, spakowane w zwarty</tspan><tspan x="52" dy="19.5">CBOR. Przez Wi-Fi te same zdarzenia idą</tspan><tspan x="52" dy="19.5">jako JSON.</tspan></text>
      <text x="52" y="602"><tspan x="52">Wspólny kanał gry, domyślnie 869,525</tspan><tspan x="52" dy="19.5">MHz, słuchany przez każde urządzenie.</tspan></text>
    </g>
