    <text x="66" y="444">Szyfrowanie AES-128-CCM, klucz na grę</text>
    <text x="66" y="463.5">Epoka i sekwencja: powtórki odrzucane</text>
    <text x="66" y="483">Limit skoków: domyślnie najwyżej 2</text>
