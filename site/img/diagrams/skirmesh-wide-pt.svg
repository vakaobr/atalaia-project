    <g font-size="16" font-weight="600">
      <text x="52" y="67">Serviços do controlador de campo</text>
      <text x="52" y="186">Jogo: núcleo partilhado, modos Lua</text>
      <text x="52" y="305">Mensagens</text>
      <text x="52" y="424">Pacote Skirmesh-RF</text>
      <text x="52" y="582">Rádio LoRa</text>
    </g>
    <g fill="#56606a">
      <text x="52" y="87"><tspan x="52">APIs REST, WebSocket e MQTT, consola da</tspan><tspan x="52" dy="19.5">organização e marcador; entrada no jogo</tspan><tspan x="52" dy="19.5">por cartão NFC (caixas) ou QR (controlador</tspan><tspan x="52" dy="19.5">de reserva; telemóveis na fase 3).</tspan></text>
      <text x="52" y="206"><tspan x="52">O mesmo núcleo em C e os mesmos</tspan><tspan x="52" dy="19.5">modos em Lua correm em todos os</tspan><tspan x="52" dy="19.5">aparelhos que jogam: as regras da zona</tspan><tspan x="52" dy="19.5">nas caixas, as do campo no controlador.</tspan></text>
      <text x="52" y="325"><tspan x="52">HELLO, EVENT, ACK, STATE, CMD, TIME,</tspan><tspan x="52" dy="19.5">CONFIG e CLAIM, em CBOR compacto. Por</tspan><tspan x="52" dy="19.5">Wi-Fi, os mesmos eventos viajam em</tspan><tspan x="52" dy="19.5">JSON.</tspan></text>
      <text x="52" y="602"><tspan x="52">Um canal de jogo partilhado, 869,525 MHz</tspan><tspan x="52" dy="19.5">por omissão, que todos escutam.</tspan></text>
    </g>
