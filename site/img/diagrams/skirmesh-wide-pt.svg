    <text x="66" y="444">Cifra AES-128-CCM, uma chave por jogo</text>
    <text x="66" y="463.5">Época e sequência: reenvios recusados</text>
    <text x="66" y="483">Limite de saltos: até 2, por omissão</text>
    <text x="66" y="502.5">ACK: eventos perdidos são reenviados</text>
    <text x="66" y="522">Balizas TIME acertam os relógios</text>
    <text x="66" y="541.5">CLAIM: a reserva pode assumir o jogo</text>
