<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 711" width="848" height="711" role="img" aria-labelledby="title desc" xml:lang="pt-PT" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Skirmesh-RF em vários aparelhos</title>
  <desc id="desc">À esquerda, as cinco camadas do Skirmesh-RF, de baixo para cima: 1, o rádio LoRa num canal de jogo partilhado; 2, o pacote Skirmesh-RF, com cifra AES-128-CCM e uma chave para cada jogo, números de época e de sequência contra reenvios, um limite de saltos para a repetição (duas, por omissão), ACK, balizas TIME e CLAIM para trocar de controlador; 3, as mensagens HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG e CLAIM em CBOR; 4, o núcleo partilhado em C e os modos de jogo em Lua; 5, as APIs REST, WebSocket e MQTT do controlador de campo, a consola da organização, o marcador e a entrada no jogo por cartão NFC (caixas) ou código QR (controlador de reserva e, na fase 3, telemóveis). À direita, que camadas corre cada aparelho. Feitos e testados em software, ainda não no campo: a Field Box (camadas 1 a 4), o modem de rádio USB (1 e 2) e o controlador de campo num Raspberry Pi ou PC (2 a 5), e a consola da organização nos telemóveis por Wi-Fi, que usam a camada 5 sem rádio LoRa. Também feitos em software, para a fase 3: o módulo de E/S (1 e 2) que dá rádio a um telemóvel ou tablet Android (2 a 4), e a app de jogador. Prevista: a caixa satélite (1 a 4).</desc>
  <rect x="0.5" y="0.5" width="847" height="710" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
  <text x="16" y="34" font-size="20" font-weight="600">Skirmesh-RF em vários aparelhos</text>

