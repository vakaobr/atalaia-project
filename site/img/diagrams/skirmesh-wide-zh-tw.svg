    <g font-size="16" font-weight="600">
      <text x="52" y="67">場地控制器的服務</text>
      <text x="52" y="186">遊戲：共用核心、Lua 模式</text>
      <text x="52" y="305">訊息</text>
      <text x="52" y="424">Skirmesh-RF 封包</text>
      <text x="52" y="582">LoRa 無線電</text>
    </g>
    <g fill="#56606a">
      <text x="52" y="87"><tspan x="52">REST、WebSocket 和 MQTT API、GM 控制</tspan><tspan x="52" dy="19.5">台、記分板。加入代碼：盒子用 NFC 卡，備援控</tspan><tspan x="52" dy="19.5">制器和第 3 階段的手機用 QR code。</tspan></text>
      <text x="52" y="206"><tspan x="52">同樣的 C 核心和 Lua 模式在每一個參與遊戲的裝</tspan><tspan x="52" dy="19.5">置上執行：據點規則在盒子上，全場規則在控制</tspan><tspan x="52" dy="19.5">器上。</tspan></text>
      <text x="52" y="325"><tspan x="52">HELLO、EVENT、ACK、STATE、CMD、</tspan><tspan x="52" dy="19.5">TIME、CONFIG 和 CLAIM，以精簡的 CBOR 打</tspan><tspan x="52" dy="19.5">包。透過 Wi-Fi 時，同樣的事件以 JSON 傳送。</tspan></text>
      <text x="52" y="602"><tspan x="52">一個共用的遊戲頻道，預設 869.525 MHz，每</tspan><tspan x="52" dy="19.5">個裝置都在上面收聽。</tspan></text>
    </g>
