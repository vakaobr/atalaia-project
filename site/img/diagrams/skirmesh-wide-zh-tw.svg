<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 711" width="848" height="711" role="img" aria-labelledby="title desc" xml:lang="zh-Hant-TW" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Skirmesh-RF 在不同的裝置上</title>
  <desc id="desc">左邊是 Skirmesh-RF 由下而上的五層：1，在一個共用遊戲頻道上的 LoRa 無線電；2，Skirmesh-RF 封包，以每場遊戲的金鑰做 AES-128-CCM 加密，用 epoch 和序號防止重送攻擊，轉傳的跳數限制（預設兩次轉傳）、ACK、TIME 信標，以及用於控制器備援切換的 CLAIM；3，以 CBOR 編碼的 HELLO、EVENT、ACK、STATE、CMD、TIME、CONFIG 和 CLAIM 訊息；4，共用的 C 核心和 Lua 遊戲模式；5，場地控制器的 REST、WebSocket 和 MQTT API、GM 控制台、記分板和加入代碼（盒子用 NFC 卡，備援控制器和第 3 階段的手機用 QR code）。右邊是每個裝置執行哪幾層。已在軟體中完成並測試、還沒在場地上用過的：Field Box（第 1 到 4 層）、USB 無線電數據機（第 1 和 2 層）和跑在 Raspberry Pi 或 PC 上的場地控制器（第 2 到 5 層），以及透過 Wi-Fi 連線、在手機上使用的 GM 控制台，它們使用第 5 層，不需要 LoRa 無線電。同樣為第 3 階段在軟體中完成的：讓 Android 手機或平板（第 2 到 4 層）有無線電的 I/O 模組（第 1 和 2 層），以及玩家 App。規劃中：衛星盒（第 1 到 4 層）。</desc>
  <rect x="0.5" y="0.5" width="847" height="710" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
  <text x="16" y="34" font-size="20" font-weight="600">Skirmesh-RF 在不同的裝置上</text>

  <g transform="translate(16 50)">
