    </g>
    <text x="66" y="444">AES-128-CCM 加密，每場遊戲一把金鑰</text>
    <text x="66" y="463.5">Epoch 和序號：拒絕重送</text>
    <text x="66" y="483">跳數限制：預設最多轉傳 2 次</text>
    <text x="66" y="502.5">ACK：遺失的事件會重新傳送</text>
    <text x="66" y="522">TIME 信標讓時鐘保持同步</text>
    <text x="66" y="541.5">CLAIM：備援控制器可以接手</text>
  </g>

