    <line x1="208" y1="122" x2="384" y2="122" stroke="#8b949c" stroke-width="1.5" />
    <text x="296" y="68" text-anchor="middle" fill="#56606a">noise</text>
    <text x="296" y="142" text-anchor="middle" fill="#56606a"><tspan x="296">decoded even below</tspan><tspan x="296" dy="19.5">the noise</tspan></text>
    <text x="16" y="194"><tspan x="16">The receiver knows the sweep pattern, so it</tspan><tspan x="16" dy="19.5">hears it below the noise: long range on little</tspan><tspan x="16" dy="19.5">power, but slow, so messages are short.</tspan></text>
