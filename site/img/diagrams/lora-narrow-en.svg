    <text x="70" y="223" fill="#56606a">→ a relay box helps</text>
    <text x="16" y="256"><tspan x="16">868 MHz gets through walls, people and leaves</tspan><tspan x="16" dy="19.5">better than 2.4 GHz Wi-Fi or Bluetooth, but</tspan><tspan x="16" dy="19.5">concrete, metal and hills cut it hard.</tspan></text>
