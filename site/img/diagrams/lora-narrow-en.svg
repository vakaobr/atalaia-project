<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1506" width="420" height="1506" role="img" aria-labelledby="title desc" xml:lang="en" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">How LoRa radio works</title>
  <desc id="desc">Five panels. Chirps: LoRa sends each symbol as a tone that sweeps across the channel, and a receiver that knows the pattern can decode it even below the background noise, so it reaches far on little power but carries only short messages. Spreading factor: each step up from SF7 about doubles the time a message spends on air, for a little more range; the boxes use SF7 today. Range: longest over open ground in line of sight, shorter through woods, people and vehicles, much shorter inside buildings, and cut off by concrete, metal or a hill, where a box in between can relay; 868 MHz gets through obstacles better than 2.4 GHz Wi-Fi or Bluetooth. The design estimate of about 0.5 to 2 km on a typical outdoor field is still to be measured in the phase 2 field test. Relays: a box out of the controller's reach is heard through the other boxes, and a message is passed on at most twice by default. Rules in Europe: one shared game channel, 869.525 MHz by default, the only part of the band that allows 500 mW and 10% of the time, 6 minutes per hour for each device; other channels allow 25 mW and 1% or less.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
