    <text x="70" y="223" fill="#56606a">→ uma caixa a repetir ajuda</text>
    <text x="16" y="256"><tspan x="16">Os 868 MHz passam paredes, pessoas e</tspan><tspan x="16" dy="19.5">folhagem melhor do que o Wi-Fi ou o Bluetooth</tspan><tspan x="16" dy="19.5">a 2,4 GHz; betão, metal e montes cortam muito.</tspan></text>
    <text x="16" y="324" fill="#56606a"><tspan x="16">Estimativa do projeto: cerca de 0,5–2 km num</tspan><tspan x="16" dy="19.5">campo típico ao ar livre. O teste de campo da</tspan><tspan x="16" dy="19.5">fase 2 vai medi-lo.</tspan></text>
  </g>

