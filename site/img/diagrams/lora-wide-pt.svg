    <polyline points="212,84 218,78 224,87 230,80 236,90 242,82 248,89 254,77 260,86 266,81 272,91 278,79 284,85 290,78 296,88 302,83 308,90 314,80 320,87 326,77 332,89 338,82 344,86 350,79 356,90 362,81 368,88 374,78 380,84" fill="none" stroke="#8b949c" stroke-width="1.5" />
    <line x1="208" y1="122" x2="384" y2="122" stroke="#8b949c" stroke-width="1.5" />
    <text x="296" y="68" text-anchor="middle" fill="#56606a">ruído</text>
    <text x="296" y="142" text-anchor="middle" fill="#56606a"><tspan x="296">lido mesmo abaixo do</tspan><tspan x="296" dy="19.5">ruído</tspan></text>
    <text x="16" y="194"><tspan x="16">O recetor conhece o padrão e ouve-o abaixo do</tspan><tspan x="16" dy="19.5">ruído: chega longe com pouca energia, mas é</tspan><tspan x="16" dy="19.5">lento, e as mensagens são curtas.</tspan></text>
