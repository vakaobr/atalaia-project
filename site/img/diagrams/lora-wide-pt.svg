<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 892" width="848" height="892" role="img" aria-labelledby="title desc" xml:lang="pt-PT" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Como funciona o rádio LoRa</title>
  <desc id="desc">Cinco painéis. Chirps: o LoRa envia cada símbolo como um tom que varre o canal, e um recetor que conhece o padrão consegue lê-lo mesmo abaixo do ruído de fundo, por isso chega longe com pouca energia mas só leva mensagens curtas. Fator de espalhamento: cada passo acima de SF7 quase duplica o tempo que uma mensagem passa no ar, para um pouco mais de alcance; as caixas usam SF7. Alcance: maior em campo aberto e à vista, menor através de mato, pessoas e viaturas, muito menor dentro de edifícios, e cortado por betão, metal ou um monte, onde uma caixa pelo meio pode repetir; os 868 MHz passam os obstáculos melhor do que o Wi-Fi ou o Bluetooth a 2,4 GHz. A estimativa do projeto, cerca de 0,5 a 2 km num campo típico ao ar livre, ainda vai ser medida no teste de campo da fase 2. Repetição: uma caixa fora do alcance do controlador é ouvida através das outras, e cada mensagem é repetida no máximo duas vezes, por omissão. Regras na Europa: um canal de jogo partilhado, 869,525 MHz por omissão, a única parte da banda que permite 500 mW e 10% do tempo, 6 minutos por hora para cada aparelho; os outros canais permitem 25 mW e 1% ou menos.</desc>
