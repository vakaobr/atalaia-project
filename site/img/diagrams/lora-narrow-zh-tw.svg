<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1506" width="420" height="1506" role="img" aria-labelledby="title desc" xml:lang="zh-Hant-TW" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">LoRa 無線電如何運作</title>
  <desc id="desc">五個區塊。啁啾（chirp）：LoRa 把每個符號當作一個掃過整個頻道的音調來傳送，知道這個模式的接收端即使在背景雜訊之下也能解碼，所以它用很少的電力就能傳得很遠，但只能傳短訊息。擴頻因子：從 SF7 起每往上一級，訊息在空中的時間大約加倍，換來多一點距離；盒子目前使用 SF7。距離：在視線無遮蔽的開闊地最遠，穿過樹林、人和車輛會變短，在建築物裡短得多，遇到混凝土、金屬或山丘則會被切斷，這時中間的盒子可以轉傳；868 MHz 穿過障礙物的能力比 2.4 GHz 的 Wi-Fi 或藍牙好。設計估計在一般戶外場地約 0.5 到 2 km，還要在第 2 階段的場地測試中實測。轉傳：超出控制器範圍的盒子可以透過其他盒子被聽到，預設每則訊息最多轉傳兩次。歐洲的規定：一個共用的遊戲頻道，預設 869.525 MHz，這是頻段中唯一允許 500 mW 和 10% 時間的部分，每個裝置每小時 6 分鐘；其他頻道允許 25 mW 和 1% 以下。</desc>
