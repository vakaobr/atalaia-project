      <rect x="16" y="212" width="44" height="12" rx="6" />
    </g>
    <text x="70" y="223" fill="#56606a">→ 中繼盒子幫得上忙</text>
    <text x="16" y="256"><tspan x="16">868 MHz 穿過牆壁、人和樹葉的能力比 2.4 GHz 的</tspan><tspan x="16" dy="19.5">Wi-Fi 或藍牙好，但混凝土、金屬和山丘會大幅削弱</tspan><tspan x="16" dy="19.5">它。</tspan></text>
    <text x="16" y="324" fill="#56606a"><tspan x="16">設計估計：一般戶外場地約 0.5–2 km。第 2 階段的場</tspan><tspan x="16" dy="19.5">地測試會實際量測。</tspan></text>
  </g>

