    <text x="16" y="194"><tspan x="16">每往上一級，在空中的時間大約加倍，換來多一點距</tspan><tspan x="16" dy="19.5">離。盒子目前使用 SF7；設計規劃大型戶外場地用</tspan><tspan x="16" dy="19.5">SF9–10。</tspan></text>
  </g>

