    </g>
    <text x="66" y="444">AES-128-CCM encryption, key per game</text>
    <text x="66" y="463.5">Epoch and sequence: replays refused</text>
    <text x="66" y="483">Hop limit: 2 relays at most, by default</text>
    <text x="66" y="502.5">ACKs: lost events are sent again</text>
    <text x="66" y="522">TIME beacons keep clocks in step</text>
    <text x="66" y="541.5">CLAIM: a standby can take over</text>
  </g>

