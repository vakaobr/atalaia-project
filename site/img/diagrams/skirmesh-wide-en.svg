    </g>
    <g font-size="16" font-weight="600">
      <text x="52" y="67">Field controller services</text>
      <text x="52" y="186">Game: shared core, Lua modes</text>
      <text x="52" y="305">Messages</text>
      <text x="52" y="424">Skirmesh-RF packet</text>
      <text x="52" y="582">LoRa radio</text>
    </g>
    <g fill="#56606a">
      <text x="52" y="87"><tspan x="52">REST, WebSocket and MQTT APIs, GM</tspan><tspan x="52" dy="19.5">console, scoreboard. Join codes: NFC cards</tspan><tspan x="52" dy="19.5">for boxes, QR codes for a standby</tspan><tspan x="52" dy="19.5">controller and, in phase 3, phones.</tspan></text>
      <text x="52" y="206"><tspan x="52">The same C core and Lua modes run on</tspan><tspan x="52" dy="19.5">every device that plays: zone rules on the</tspan><tspan x="52" dy="19.5">boxes, field-wide rules on the controller.</tspan></text>
      <text x="52" y="325"><tspan x="52">HELLO, EVENT, ACK, STATE, CMD, TIME,</tspan><tspan x="52" dy="19.5">CONFIG and CLAIM, packed as compact</tspan><tspan x="52" dy="19.5">CBOR. Over Wi-Fi the same events travel</tspan><tspan x="52" dy="19.5">as JSON.</tspan></text>
      <text x="52" y="602"><tspan x="52">One shared game channel, 869.525 MHz</tspan><tspan x="52" dy="19.5">by default, that every device listens on.</tspan></text>
    </g>
    <g fill="#c9a25c">
      <circle cx="57" cy="439" r="3" />
