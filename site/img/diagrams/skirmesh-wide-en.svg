<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 711" width="848" height="711" role="img" aria-labelledby="title desc" xml:lang="en" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Skirmesh-RF on different devices</title>
  <desc id="desc">Left, the five layers of Skirmesh-RF from the bottom up: 1, the LoRa radio on one shared game channel; 2, the Skirmesh-RF packet, with AES-128-CCM encryption under a key for each game, epoch and sequence numbers against replays, a hop limit for relaying (two relays by default), ACKs, TIME beacons and CLAIM for controller failover; 3, the messages HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG and CLAIM in CBOR; 4, the shared C core and Lua game modes; 5, the field controller's REST, WebSocket and MQTT APIs, GM console, scoreboard and join codes (NFC cards for boxes, QR codes for a standby controller and, in phase 3, phones). Right, which layers each device runs. Built and tested in software, not yet on a field: the Field Box (layers 1 to 4), the USB radio modem (1 and 2) and the field controller on a Raspberry Pi or PC (2 to 5), and the GM console on phones over Wi-Fi, which use layer 5 with no LoRa radio. Built in software for phase 3 too: the I/O pod (1 and 2) that gives an Android phone or tablet (2 to 4) a radio, and the player app. Planned: the satellite box (1 to 4).</desc>
  <rect x="0.5" y="0.5" width="847" height="710" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
  <text x="16" y="34" font-size="20" font-weight="600">Skirmesh-RF on different devices</text>

