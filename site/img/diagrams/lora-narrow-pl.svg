<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1506" width="420" height="1506" role="img" aria-labelledby="title desc" xml:lang="pl" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Jak działa radio LoRa</title>
  <desc id="desc">Pięć paneli. Chirpy: LoRa wysyła każdy symbol jako ton przemiatający kanał, a odbiornik, który zna wzorzec, odkoduje go nawet poniżej szumu tła, więc sięga daleko przy małej mocy, ale przenosi tylko krótkie wiadomości. Spreading factor: każdy krok w górę od SF7 mniej więcej podwaja czas nadawania wiadomości, za nieco większy zasięg; skrzynki używają dziś SF7. Zasięg: najdłuższy w otwartym terenie przy widoczności, krótszy przez las, ludzi i pojazdy, dużo krótszy w budynkach, a odcięty przez beton, metal lub wzgórze, gdzie skrzynka pośrodku może przekazać sygnał; 868 MHz lepiej przechodzi przez przeszkody niż Wi-Fi 2,4 GHz czy Bluetooth. Szacunek projektowy około 0,5–2 km na typowym terenie otwartym zostanie zmierzony w teście terenowym fazy 2. Przekaźniki: skrzynkę poza zasięgiem kontrolera słychać przez inne skrzynki, a wiadomość domyślnie jest przekazywana najwyżej dwa razy. Zasady w Europie: jeden wspólny kanał gry, domyślnie 869,525 MHz, jedyna część pasma pozwalająca na 500 mW i 10% czasu, 6 minut na godzinę dla każdego urządzenia; inne kanały: 25 mW i 1% lub mniej.</desc>
