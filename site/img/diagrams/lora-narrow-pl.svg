    <text x="16" y="194"><tspan x="16">Odbiornik zna wzorzec, więc słyszy go pod</tspan><tspan x="16" dy="19.5">szumem: duży zasięg przy małej mocy, ale</tspan><tspan x="16" dy="19.5">wolno, więc wiadomości są krótkie.</tspan></text>
