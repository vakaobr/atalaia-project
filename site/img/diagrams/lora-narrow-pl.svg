    <text x="16" y="324" fill="#56606a"><tspan x="16">Szacunek projektowy: około 0,5–2 km na</tspan><tspan x="16" dy="19.5">typowym terenie otwartym. Zmierzy to test</tspan><tspan x="16" dy="19.5">terenowy fazy 2.</tspan></text>
