    <text x="16" y="324" fill="#56606a"><tspan x="16">Schätzung aus dem Design: etwa 0,5–2 km auf</tspan><tspan x="16" dy="19.5">einem typischen Outdoor-Feld. Der Feldtest von</tspan><tspan x="16" dy="19.5">Phase 2 wird es messen.</tspan></text>
