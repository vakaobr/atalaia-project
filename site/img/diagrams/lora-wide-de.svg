    <text x="16" y="194"><tspan x="16">Der Empfänger kennt das Muster und hört es</tspan><tspan x="16" dy="19.5">unter dem Rauschen: weit mit wenig Strom,</tspan><tspan x="16" dy="19.5">aber langsam, daher kurze Nachrichten.</tspan></text>
