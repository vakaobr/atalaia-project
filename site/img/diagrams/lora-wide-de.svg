<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 892" width="848" height="892" role="img" aria-labelledby="title desc" xml:lang="de" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">So funktioniert LoRa-Funk</title>
  <desc id="desc">Fünf Felder. Chirps: LoRa sendet jedes Symbol als Ton, der über den Kanal gleitet, und ein Empfänger, der das Muster kennt, kann es sogar unter dem Grundrauschen entschlüsseln, also reicht es mit wenig Strom weit, trägt aber nur kurze Nachrichten. Spreizfaktor: Jede Stufe über SF7 verdoppelt etwa die Sendezeit einer Nachricht, für etwas mehr Reichweite; die Boxen nutzen heute SF7. Reichweite: am größten auf offenem Gelände mit Sichtverbindung, kürzer durch Wald, Menschen und Fahrzeuge, viel kürzer in Gebäuden, und abgeschnitten durch Beton, Metall oder einen Hügel, wo eine Box dazwischen weiterleiten kann; 868 MHz kommt besser durch Hindernisse als WLAN oder Bluetooth auf 2,4 GHz. Die Schätzung aus dem Design von etwa 0,5 bis 2 km auf einem typischen Outdoor-Feld wird im Feldtest von Phase 2 noch gemessen. Weiterleitung: Eine Box außerhalb der Reichweite des Controllers wird über die anderen Boxen gehört, und eine Nachricht wird standardmäßig höchstens zweimal weitergegeben. Regeln in Europa: ein gemeinsamer Spielkanal, standardmäßig 869,525 MHz, der einzige Teil des Bands, der 500 mW und 10 % der Zeit erlaubt, 6 Minuten pro Stunde für jedes Gerät; andere Kanäle erlauben 25 mW und 1 % oder weniger.</desc>
