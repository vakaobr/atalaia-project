    <g font-size="16" font-weight="600">
      <text x="52" y="67">Dienste des Feld-Controllers</text>
      <text x="52" y="186">Spiel: gemeinsamer Kern, Lua-Modi</text>
      <text x="52" y="305">Nachrichten</text>
      <text x="52" y="424">Skirmesh-RF-Paket</text>
      <text x="52" y="582">LoRa-Funk</text>
    </g>
    <g fill="#56606a">
      <text x="52" y="87"><tspan x="52">APIs für REST, WebSocket und MQTT,</tspan><tspan x="52" dy="19.5">GM-Konsole, Anzeigetafel. Beitritt:</tspan><tspan x="52" dy="19.5">NFC-Karten für Boxen, QR-Codes für</tspan><tspan x="52" dy="19.5">Reserve-Controller und (Phase 3) Handys.</tspan></text>
      <text x="52" y="206"><tspan x="52">Derselbe C-Kern und dieselben Lua-Modi</tspan><tspan x="52" dy="19.5">auf jedem Gerät, das spielt: Zonenregeln</tspan><tspan x="52" dy="19.5">auf den Boxen, Feldregeln auf dem</tspan><tspan x="52" dy="19.5">Controller.</tspan></text>
      <text x="52" y="325"><tspan x="52">HELLO, EVENT, ACK, STATE, CMD, TIME,</tspan><tspan x="52" dy="19.5">CONFIG und CLAIM, kompakt als CBOR</tspan><tspan x="52" dy="19.5">verpackt. Per WLAN reisen dieselben</tspan><tspan x="52" dy="19.5">Events als JSON.</tspan></text>
      <text x="52" y="602"><tspan x="52">Ein gemeinsamer Spielkanal (Standard</tspan><tspan x="52" dy="19.5">869,525 MHz), auf dem jedes Gerät hört.</tspan></text>
    </g>
    <g fill="#c9a25c">
