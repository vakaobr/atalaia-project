<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 711" width="848" height="711" role="img" aria-labelledby="title desc" xml:lang="de" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
  <title id="title">Skirmesh-RF auf allen Geräten</title>
  <desc id="desc">Links die fünf Schichten von Skirmesh-RF von unten nach oben: 1, der LoRa-Funk auf einem gemeinsamen Spielkanal; 2, das Skirmesh-RF-Paket, mit AES-128-CCM-Verschlüsselung unter einem Schlüssel pro Spiel, Epoche und Sequenznummern gegen Wiederholungen, einem Hop-Limit für die Weiterleitung (standardmäßig zwei Weiterleitungen), ACKs, TIME-Signalen und CLAIM für die Übernahme durch einen anderen Controller; 3, die Nachrichten HELLO, EVENT, ACK, STATE, CMD, TIME, CONFIG und CLAIM in CBOR; 4, der gemeinsame C-Kern und die Lua-Spielmodi; 5, die REST-, WebSocket- und MQTT-APIs des Feld-Controllers, GM-Konsole, Anzeigetafel und Beitrittscodes (NFC-Karten für Boxen, QR-Codes für einen Controller in Bereitschaft und, in Phase 3, Handys). Rechts, welche Schichten jedes Gerät ausführt. In Software gebaut und getestet, noch nicht auf einem Feld: die Field Box (Schichten 1 bis 4), das USB-Funkmodem (1 und 2) und der Feld-Controller auf einem Raspberry Pi oder PC (2 bis 5), und die GM-Konsole auf Handys per WLAN, die Schicht 5 ohne LoRa-Funk nutzen. Ebenfalls in Software für Phase 3 gebaut: der I/O-Pod (1 und 2), der einem Android-Handy oder -Tablet (2 bis 4) einen Funk gibt, und die Spieler-App. Geplant: die Satelliten-Box (1 bis 4).</desc>
  <rect x="0.5" y="0.5" width="847" height="710" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
  <text x="16" y="34" font-size="20" font-weight="600">Skirmesh-RF auf allen Geräten</text>

