    </g>
    <text x="66" y="444">AES-128-CCM, Schlüssel pro Spiel</text>
    <text x="66" y="463.5">Epoche und Sequenz: keine Replays</text>
    <text x="66" y="483">Hop-Limit: standardmäßig max. 2</text>
    <text x="66" y="502.5">ACKs: Verlorenes wird neu gesendet</text>
    <text x="66" y="522">TIME-Signale gleichen Uhren ab</text>
    <text x="66" y="541.5">CLAIM: Reserve übernimmt</text>
  </g>

