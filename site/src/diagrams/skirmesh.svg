        <rect x="314" y="216" width="20" height="16" fill="#ffffff" />
        <rect x="338" y="216" width="20" height="16" fill="#ffffff" />
        <rect x="362" y="216" width="20" height="16" fill="#ffffff" />
      </g>
      <g>
        <rect x="266" y="268" width="20" height="16" fill="#ffffff" />
        <rect x="290" y="268" width="20" height="16" fill="#c9a25c" />
        <rect x="314" y="268" width="20" height="16" fill="#e3c48d" />
        <rect x="338" y="268" width="20" height="16" fill="#4a535c" />
        <rect x="362" y="268" width="20" height="16" fill="#262d34" />
      </g>
      <g>
        <rect x="266" y="328" width="20" height="16" fill="#f07a1a" />
        <rect x="290" y="328" width="20" height="16" fill="#c9a25c" />
        <rect x="314" y="328" width="20" height="16" fill="#ffffff" />
        <rect x="338" y="328" width="20" height="16" fill="#ffffff" />
        <rect x="362" y="328" width="20" height="16" fill="#ffffff" />
