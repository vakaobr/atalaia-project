      <text x="300" y="78">2</text>
      <text x="324" y="78">3</text>
      <text x="348" y="78">4</text>
      <text x="372" y="78">5</text>
    </g>
    <g fill="#f7f8f6" stroke="#4a535c">
      <rect x="12.5" y="88.5" width="375" height="51" rx="4" />
      <rect x="12.5" y="148.5" width="375" height="51" rx="4" stroke-dasharray="6 4" />
      <rect x="12.5" y="208.5" width="375" height="103" rx="4" />
      <rect x="12.5" y="320.5" width="375" height="103" rx="4" stroke-dasharray="6 4" />
      <rect x="12.5" y="432.5" width="375" height="51" rx="4" />
    </g>
    <g stroke="#d3d8db">
      <line x1="24" y1="260.5" x2="376" y2="260.5" />
      <line x1="24" y1="372.5" x2="376" y2="372.5" />
    </g>
    {# The cells: x 266, 290, 314, 338, 362; y row top + 8. #}
    <g stroke="#262d34" stroke-opacity="0.25">
      <g>
        <rect x="266" y="96" width="20" height="16" fill="#f07a1a" />
        <rect x="290" y="96" width="20" height="16" fill="#c9a25c" />
        <rect x="314" y="96" width="20" height="16" fill="#e3c48d" />
