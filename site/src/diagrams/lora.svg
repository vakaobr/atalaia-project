{#
SPDX-FileCopyrightText: 2026 The Atalaia contributors
SPDX-License-Identifier: CC-BY-SA-4.0

"How LoRa radio works": five panels, drawn for this project. tools/build_site.py
writes it to site/img/diagrams/lora-<layout>-<language>.svg: "wide" puts the
panels in two columns (desktops, the README), "narrow" in one (phones). Each
panel has its own coordinates (400 units wide); only the panel positions and
heights, and the last panel, differ between the layouts.

Facts: RFC 0001 (Amendment 1: one shared channel in the g2 sub-band, 10% duty
cycle, 500 mW ERP; Amendment 3: other channels 25 mW, 1%), design spec section 10 (field profiles, SF7 to SF10,
0.5-2 km estimate), the radio HAL (SF7, BW125). Colours: site/style.css.
Text that a translation changes has a data-width (and data-lines): the build
fails if it does not fit.
#}
{% if layout wide %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 892" width="848" height="892" role="img" aria-labelledby="title desc" xml:lang="{{ page.lang }}" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
{% endif %}
{% if layout narrow %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1506" width="420" height="1506" role="img" aria-labelledby="title desc" xml:lang="{{ page.lang }}" font-family="Barlow, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" font-size="15" fill="#1f262c">
{% endif %}
  <title id="title">{{ diagrams.lora.title|text }}</title>
  <desc id="desc">{{ diagrams.lora.desc|text }}</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f07a1a" />
    </marker>
  </defs>
{% if layout wide %}
  <rect x="0.5" y="0.5" width="847" height="891" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
{% endif %}
{% if layout narrow %}
  <rect x="0.5" y="0.5" width="419" height="1505" rx="10" fill="#f7f8f6" stroke="#d3d8db" />
{% endif %}
  <text x="16" y="34" font-size="20" font-weight="600" data-width="388">{{ diagrams.lora.title|text }}</text>

  {# 1. Chirps: a frequency sweep, and a signal below the noise floor. #}
{% if layout wide %}
  <g transform="translate(16 50)">
{% endif %}
{% if layout narrow %}
  <g transform="translate(10 50)">
{% endif %}
    <rect x="0.5" y="0.5" width="399" height="249" rx="6" fill="#ffffff" stroke="#d3d8db" />
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="368">{{ diagrams.lora.chirp.title|text }}</text>
    <polyline points="20,44 20,122 192,122" fill="none" stroke="#8b949c" stroke-width="1.5" />
    <path d="M86 52V116M136 52V116M156 52V116" stroke="#f07a1a" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M26 116L66 52M66 84L86 52M86 116L106 84M106 100L136 52M136 116L146 100M146 68L156 52M156 116L186 68" fill="none" stroke="#f07a1a" stroke-width="3" stroke-linecap="round" />
    <text x="104" y="142" text-anchor="middle" fill="#56606a" data-width="176" data-lines="2">{{ diagrams.lora.chirp.sweep|wrap }}</text>
    <polygon points="212,84 218,78 224,87 230,80 236,90 242,82 248,89 254,77 260,86 266,81 272,91 278,79 284,85 290,78 296,88 302,83 308,90 314,80 320,87 326,77 332,89 338,82 344,86 350,79 356,90 362,81 368,88 374,78 380,84 380,122 212,122" fill="#e6e9eb" />
    <rect x="252" y="98" width="92" height="24" fill="#f07a1a" />
    <text x="298" y="115" text-anchor="middle" font-weight="600" fill="#262d34">LoRa</text>
    <polyline points="212,84 218,78 224,87 230,80 236,90 242,82 248,89 254,77 260,86 266,81 272,91 278,79 284,85 290,78 296,88 302,83 308,90 314,80 320,87 326,77 332,89 338,82 344,86 350,79 356,90 362,81 368,88 374,78 380,84" fill="none" stroke="#8b949c" stroke-width="1.5" />
    <line x1="208" y1="122" x2="384" y2="122" stroke="#8b949c" stroke-width="1.5" />
    <text x="296" y="68" text-anchor="middle" fill="#56606a" data-width="168">{{ diagrams.lora.chirp.noise|text }}</text>
    <text x="296" y="142" text-anchor="middle" fill="#56606a" data-width="176" data-lines="2">{{ diagrams.lora.chirp.below|wrap }}</text>
    <text x="16" y="194" data-width="368" data-lines="3">{{ diagrams.lora.chirp.text|wrap }}</text>
  </g>

  {# 2. Spreading factor: each step about doubles the airtime. #}
{% if layout wide %}
  <g transform="translate(432 50)">
{% endif %}
{% if layout narrow %}
  <g transform="translate(10 312)">
{% endif %}
    <rect x="0.5" y="0.5" width="399" height="249" rx="6" fill="#ffffff" stroke="#d3d8db" />
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="368">{{ diagrams.lora.sf.title|text }}</text>
    <text x="16" y="56" fill="#56606a" data-width="368">{{ diagrams.lora.sf.axis|text }}</text>
    <g font-weight="600">
      <text x="16" y="84">SF7</text>
      <text x="16" y="110">SF8</text>
      <text x="16" y="136">SF9</text>
      <text x="16" y="162">SF10</text>
    </g>
    <g fill="#f07a1a">
      <rect x="64" y="71" width="36" height="16" rx="3" />
      <rect x="64" y="97" width="72" height="16" rx="3" />
      <rect x="64" y="123" width="144" height="16" rx="3" />
      <rect x="64" y="149" width="288" height="16" rx="3" />
    </g>
    <g fill="#56606a">
      <text x="108" y="84">×1</text>
      <text x="144" y="110">×2</text>
      <text x="216" y="136">×4</text>
      <text x="360" y="162">×8</text>
    </g>
    <text x="16" y="194" data-width="368" data-lines="3">{{ diagrams.lora.sf.text|wrap }}</text>
  </g>

  {# 3. Range: a sketch of how obstacles shorten it, not measurements. #}
{% if layout wide %}
  <g transform="translate(16 316)">
{% endif %}
{% if layout narrow %}
  <g transform="translate(10 574)">
{% endif %}
    <rect x="0.5" y="0.5" width="399" height="375" rx="6" fill="#ffffff" stroke="#d3d8db" />
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="368">{{ diagrams.lora.range.title|text }}</text>
    <text x="16" y="56" fill="#56606a" data-width="368">{{ diagrams.lora.range.axis|text }}</text>
    <text x="16" y="84" data-width="368">{{ diagrams.lora.range.open|text }}</text>
    <text x="16" y="124" data-width="368">{{ diagrams.lora.range.woods|text }}</text>
    <text x="16" y="164" data-width="368">{{ diagrams.lora.range.walls|text }}</text>
    <text x="16" y="204" data-width="368">{{ diagrams.lora.range.blocked|text }}</text>
    <g fill="#ebeeea">
      <rect x="16" y="92" width="368" height="12" rx="6" />
      <rect x="16" y="132" width="368" height="12" rx="6" />
      <rect x="16" y="172" width="368" height="12" rx="6" />
    </g>
    <g fill="#f07a1a">
      <rect x="16" y="92" width="368" height="12" rx="6" />
      <rect x="16" y="132" width="216" height="12" rx="6" />
      <rect x="16" y="172" width="112" height="12" rx="6" />
      <rect x="16" y="212" width="44" height="12" rx="6" />
    </g>
    <text x="70" y="223" fill="#56606a" data-width="314">{{ diagrams.lora.range.relay|text }}</text>
    <text x="16" y="256" data-width="368" data-lines="3">{{ diagrams.lora.range.text|wrap }}</text>
    <text x="16" y="324" fill="#56606a" data-width="368" data-lines="3">{{ diagrams.lora.range.note|wrap }}</text>
  </g>

  {# 4. Relaying: a hill blocks box B; box A, on top, repeats its message. #}
{% if layout wide %}
  <g transform="translate(432 316)">
{% endif %}
{% if layout narrow %}
  <g transform="translate(10 962)">
{% endif %}
{% if layout wide %}
    <rect x="0.5" y="0.5" width="399" height="375" rx="6" fill="#ffffff" stroke="#d3d8db" />
{% endif %}
{% if layout narrow %}
    <rect x="0.5" y="0.5" width="399" height="289" rx="6" fill="#ffffff" stroke="#d3d8db" />
{% endif %}
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="368">{{ diagrams.lora.relay.title|text }}</text>
    <line x1="16" y1="160" x2="384" y2="160" stroke="#c9a25c" stroke-width="2" />
    <line x1="80" y1="151" x2="330" y2="151" stroke="#8b949c" stroke-width="1.5" stroke-dasharray="5 4" />
    <path d="M110 160C150 160 165 100 200 100C235 100 250 160 290 160z" fill="#e3c48d" stroke="#c9a25c" stroke-width="1.5" />
    <path d="M194 145l12 12M206 145l-12 12" stroke="#4a535c" stroke-width="2.5" stroke-linecap="round" />
    <path d="M340 134Q290 74 220 82" fill="none" stroke="#f07a1a" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M182 82Q116 80 80 124" fill="none" stroke="#f07a1a" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="70" y1="142" x2="70" y2="128" stroke="#262d34" stroke-width="2" />
    <rect x="50" y="142" width="30" height="18" rx="2" fill="#262d34" />
    <line x1="206" y1="88" x2="206" y2="78" stroke="#262d34" stroke-width="2" />
    <rect x="189" y="88" width="22" height="13" rx="2" fill="#f07a1a" stroke="#262d34" stroke-width="1.5" />
    <line x1="347" y1="147" x2="347" y2="137" stroke="#262d34" stroke-width="2" />
    <rect x="330" y="147" width="22" height="13" rx="2" fill="#f07a1a" stroke="#262d34" stroke-width="1.5" />
    <text x="200" y="66" text-anchor="middle" font-weight="600" data-width="180">{{ diagrams.lora.relay.box_a|text }}</text>
    <text x="66" y="184" text-anchor="middle" font-weight="600" data-width="112">{{ diagrams.lora.relay.controller|text }}</text>
    <text x="341" y="184" text-anchor="middle" font-weight="600" data-width="100">{{ diagrams.lora.relay.box_b|text }}</text>
    <text x="16" y="214" data-width="368" data-lines="4">{{ diagrams.lora.relay.text|wrap }}</text>
  </g>

  {# 5. The EU868 rules of the game channel; this panel differs by layout. #}
{% if layout wide %}
  <g transform="translate(16 708)">
    <rect x="0.5" y="0.5" width="815" height="167" rx="6" fill="#ffffff" stroke="#d3d8db" />
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="784">{{ diagrams.lora.rules.title|text }}</text>
    <rect x="16" y="44" width="784" height="20" rx="3" fill="#ebeeea" stroke="#d3d8db" />
    <rect x="16" y="44" width="78.4" height="20" rx="3" fill="#f07a1a" />
    <text x="16" y="84" font-weight="600">6 min</text>
    <text x="800" y="84" text-anchor="end" fill="#56606a" data-width="200">{{ diagrams.lora.rules.hour|text }}</text>
    <text x="16" y="110" data-width="784">{{ diagrams.lora.rules.share|text }}</text>
    <text x="16" y="136" data-width="784" data-lines="2">{{ diagrams.lora.rules.text|wrap }}</text>
  </g>
{% endif %}
{% if layout narrow %}
  <g transform="translate(10 1264)">
    <rect x="0.5" y="0.5" width="399" height="231" rx="6" fill="#ffffff" stroke="#d3d8db" />
    <rect x="0" y="12" width="4" height="22" fill="#f07a1a" />
    <text x="16" y="28" font-size="17" font-weight="600" data-width="368">{{ diagrams.lora.rules.title|text }}</text>
    <rect x="16" y="44" width="368" height="20" rx="3" fill="#ebeeea" stroke="#d3d8db" />
    <rect x="16" y="44" width="36.8" height="20" rx="3" fill="#f07a1a" />
    <text x="16" y="84" font-weight="600">6 min</text>
    <text x="384" y="84" text-anchor="end" fill="#56606a" data-width="200">{{ diagrams.lora.rules.hour|text }}</text>
    <text x="16" y="110" data-width="368" data-lines="2">{{ diagrams.lora.rules.share|wrap }}</text>
    <text x="16" y="156" data-width="368" data-lines="4">{{ diagrams.lora.rules.text|wrap }}</text>
  </g>
{% endif %}
</svg>
