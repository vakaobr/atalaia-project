name: Without siren_all_s (the default), holding every satellite sounds nothing on a master that has a siren
nodes: { master: master, alpha: satellite, bravo: satellite }
steps:
  - hold: { node: alpha, team: red, s: 3 }
  - hold: { node: bravo, team: red, s: 3 }
  - wait: 5
  - expect_no: output.switched
  - expect_no: script.error
