name: With an odd number of points per tick, the bonus is rounded down
params: { tick_s: 5, points_per_tick: 3, satellite_bonus_pct: 50 }
nodes: { master: master, alpha: satellite, bravo: satellite }
steps:
  - hold: { node: alpha, team: red, s: 3 }
  - hold: { node: master, team: red, s: 3 }          # captured at 6 s; ticks at 11, 16 s
  - wait: 5
  - expect_score: { team: red, points: 4 }           # 3 + 1 (3 * 50 % = 1.5)
  - hold: { node: bravo, team: red, s: 3 }           # 11 -> 14 s
  - wait: 2
  - expect_score: { team: red, points: 10 }          # 4, then 3 + 3
