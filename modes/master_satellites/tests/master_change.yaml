name: When the master changes hands every satellite goes back to neutral, and the new holder starts without a bonus
params: { tick_s: 5 }
nodes: { master: master, alpha: satellite, bravo: satellite, charlie: satellite }
steps:
  - hold: { node: alpha, team: red, s: 3 }
  - hold: { node: bravo, team: red, s: 3 }
  - hold: { node: charlie, team: blue, s: 3 }        # blue holds a satellite before it takes the master
  - hold: { node: master, team: red, s: 3 }          # captured at 12 s; ticks at 17, 22 s
  - wait: 10.5
  - expect_score: { team: red, points: 8 }           # 2 x (2 + 2)
  - expect_no: zone.neutralized
  - hold: { node: master, team: blue, s: 3 }         # 22.5 -> 25.5 s
  - expect: { type: zone.captured, node: master, team: blue, at: 25.5, data: { previous_team: red } }
  - expect: { type: zone.neutralized, node: alpha, at: 25.5, data: { previous_team: red } }
  - expect: { type: zone.neutralized, node: bravo, at: 25.5, data: { previous_team: red } }
  - expect: { type: zone.neutralized, node: charlie, at: 25.5, data: { previous_team: blue } }
  - expect_screen: { node: alpha, template: neutral }
  - expect_screen: { node: master, template: master_status, data: { team: blue, held: 0, of: 3, points: 2 } }
  - wait: 5                                          # blue's first tick at 30.5 s
  - expect_score: { team: blue, points: 2 }
  - expect_score: { team: red, points: 8 }
  - hold: { node: alpha, team: blue, s: 3 }          # 30.5 -> 33.5 s; a tick at 35.5 s
  - wait: 2
  - expect_score: { team: blue, points: 5 }
  - expect_no: zone.neutralized
