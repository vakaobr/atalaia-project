#
# The checkpoint. Data: total (check-ins), counts (per team, as text),
# team (of the last check-in), message, error; lang (pt, de, zh-tw, else English) from
# the box.
template: checkin
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{lang == 'pt' && 'REGISTO DE PRESENÇA' || lang == 'de' && 'CHECK-IN' || lang == 'zh-tw' && '玩家報到' || 'CHECK-IN'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{total}"
    style: { font_size: 48 }
  - type: label
    text: "{lang == 'pt' && 'participantes registados' || lang == 'de' && 'Spielende eingecheckt' || lang == 'zh-tw' && '玩家已報到' || 'players checked in'}"
    style: { font_size: 20, color: muted }
  - type: label
    text: "{counts}"
    style: { font_size: 20, visible: "{counts}" }
  - type: label
    text: "{message}"
    style:
      font_size: 20
      width: 300
      color: "{error && 'danger' || 'accent'}"
      visible: "{message}"
      padding: { top: 6 }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Lê a tua etiqueta para o registo' || lang == 'de' && 'Scanne deinen Tag zum Einchecken' || lang == 'zh-tw' && '感應你的標籤來報到' || 'Scan your tag to check in'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
