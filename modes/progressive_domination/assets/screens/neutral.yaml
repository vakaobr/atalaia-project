#
# The active box, nobody holds it (the name `neutral` is decision BN-11's, so a
# box's OLED shows it as a free zone). Data: step (its place in the order) and
# of (all the boxes), final (the last box), taker and progress (0-1) while a
# team holds its input to take it; lang (pt, en, de or zh-tw) from the box.
template: neutral
layout:
  - type: row
    style: { width: fill, height: 44, background: accent }
    children:
      - type: label
        text: "{final && (lang == 'pt' && 'ÚLTIMA CAIXA' || lang == 'de' && 'LETZTE BOX' || lang == 'zh-tw' && '最後一個盒子' || 'FINAL BOX') || (lang == 'pt' && 'CAIXA ATIVA' || lang == 'de' && 'AKTIVE BOX' || lang == 'zh-tw' && '啟用中' || 'ACTIVE BOX')} {step}/{of}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'LIVRE' || lang == 'de' && 'FREI' || lang == 'zh-tw' && '中立' || 'NEUTRAL'}"
    style: { font_size: 48 }
  - type: label
    text: "{lang == 'pt' && 'A tomar:' || lang == 'de' && 'Übernahme:' || lang == 'zh-tw' && '奪取中' || 'Taking:'} {taker|upper}"
    style: { font_size: 20, color: "{taker}", visible: "{taker}" }
  - type: progress_bar
    value: "{progress}"
    style: { width: 220, height: 12, color: "{taker}", visible: "{taker}" }
  - type: label
    text: "{lang == 'pt' && 'Mantém premido durante' || lang == 'de' && 'Halte deinen Knopf für' || lang == 'zh-tw' && '按住按鈕' || 'Hold your button for'} {params.capture_hold_ms / 1000} {lang == 'zh-tw' && '秒' || 's'}"
    style: { font_size: 20, color: accent, visible: "{!taker}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Só esta caixa pode ser capturada' || lang == 'de' && 'Nur diese Box ist einnehmbar' || lang == 'zh-tw' && '只有這個盒子能佔領' || 'Only this box can be captured'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
