#
# A box that is not the active one (not its turn yet, or told it is not
# needed): its buttons do nothing and its LED is off. Data: done (boxes
# completed so far) and of (all the boxes), both missing before the controller's
# first word; lang (pt, en, de or zh-tw) from the box.
template: inactive
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'INATIVA' || lang == 'de' && 'INAKTIV' || lang == 'zh-tw' && '未啟用' || 'INACTIVE'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'AGUARDA' || lang == 'de' && 'WARTEN' || lang == 'zh-tw' && '等待中' || 'WAIT'}"
    style: { font_size: 48, color: muted }
  - type: label
    text: "{lang == 'pt' && 'Ainda não é a vez desta caixa' || lang == 'de' && 'Diese Box ist noch nicht dran' || lang == 'zh-tw' && '還沒輪到這個盒子' || 'This box waits for its turn'}"
    style: { font_size: 20 }
  - type: label
    text: "{lang == 'zh-tw' && '已完成 ' || ''}{done} {lang == 'pt' && 'de' || lang == 'de' && 'von' || lang == 'zh-tw' && '/' || 'of'} {of} {lang == 'pt' && 'caixas completas' || lang == 'de' && 'Boxen abgeschlossen' || lang == 'zh-tw' && '個盒子' || 'boxes completed'}"
    style: { font_size: 20, color: accent, visible: "{of}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Os botões não fazem nada agora' || lang == 'de' && 'Die Knöpfe tun gerade nichts' || lang == 'zh-tw' && '現在按按鈕沒有作用' || 'The buttons do nothing now'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
