id: org.atalaia.respawn
version: 0.1.0
license: GPL-3.0-or-later
min_tier: reduced
kind: mode
name: Respawn and Lives
description: >-
  A respawn point counts lives. Players scan their signed NFC tag (or press their team's button) to come
  back into the game; each respawn takes a life from their team, or from the player with per-player
  lives, and a player must wait a cooldown between respawns. When a team has no lives left, the next
  respawn is refused and the team is eliminated.
roles:
  respawn: { requires: [nfc], optional: [team_input, display] }
params:
  lives:              { type: int, min: 1, max: 1000, default: 20, label: "Lives: respawns per team, or per player with per-player lives" }
  per_player:         { type: bool, default: false, label: "Count lives per player (needs NFC tags) instead of per team" }
  respawn_cooldown_s: { type: int, min: 0, max: 600, default: 30, label: "Seconds a player waits between respawns" }
i18n:
  pt:
    name: Reentradas e Vidas
    description: >-
      Um ponto de reentrada conta as vidas. Cada participante lê a sua etiqueta NFC assinada (ou carrega no
      botão da sua equipa) para voltar ao jogo; cada reentrada gasta uma vida da equipa, ou da própria
      pessoa com vidas individuais, e há um tempo de espera entre reentradas. Quando uma equipa fica sem
      vidas, a reentrada seguinte é recusada e a equipa é eliminada.
    params:
      lives: "Vidas: reentradas por equipa, ou por pessoa com vidas individuais"
      per_player: Contar as vidas por pessoa (precisa de etiquetas NFC) em vez de por equipa
      respawn_cooldown_s: Segundos de espera entre reentradas de cada pessoa
  de:
    name: Respawn und Leben
    description: >-
      Ein Respawn-Punkt zählt Leben. Die Spielenden scannen ihren signierten NFC-Tag (oder drücken den Knopf
      ihres Teams), um ins Spiel zurückzukehren; jeder Respawn kostet ihr Team ein Leben, bei Leben pro Person
      die Person selbst, und zwischen zwei Respawns gilt eine Wartezeit. Hat ein Team keine Leben mehr, wird
      der nächste Respawn abgelehnt und das Team scheidet aus.
    params:
      lives: "Leben: Respawns pro Team, oder pro Person bei Leben pro Person"
      per_player: Leben pro Person zählen (braucht NFC-Tags) statt pro Team
      respawn_cooldown_s: Sekunden Wartezeit zwischen zwei Respawns einer Person
  zh-tw:
    name: 復活與命數
    description: 復活點會計算命數。玩家感應自己已簽署的 NFC 標籤（或按自己隊伍的按鈕）回到遊戲；每次復活扣該隊一條命，命數按玩家計算時則扣玩家自己的，兩次復活之間需要等待。隊伍沒有命數時，下一次復活會被拒絕，該隊淘汰。
    params:
      lives: 命數：每隊的復活次數，或命數按玩家計算時每位玩家的次數
      per_player: 按玩家計算命數（需要 NFC 標籤），而不是按隊伍
      respawn_cooldown_s: 每位玩家兩次復活之間的等待秒數
