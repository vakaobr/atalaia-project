id: org.atalaia.bomb
version: 0.1.0
license: GPL-3.0-or-later
min_tier: reduced
name: Bomb / Rush
description: Attackers arm the bomb and defend it; defenders must defuse it before it explodes.
roles:
  bomb: { requires: [team_input], optional: [keypad, audio, led, display] }
params:
  attackers:          { type: team, default: red }
  defenders:          { type: team, default: blue }
  fuse_s:             { type: int, min: 10, max: 3600, default: 300, label: "Fuse (s)" }
  arm_hold_ms:        { type: int, default: 5000, label: "Hold time to arm (ms)" }
  defuse_hold_ms:     { type: int, default: 10000, label: "Hold time to defuse (ms)" }
  reset_after_defuse: { type: bool, default: false, label: "Return to standby after defuse" }
  auto_arm_after_s:   { type: int, optional: true, label: "Arm automatically after (s)" }
