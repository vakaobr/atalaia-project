id: org.atalaia.bomb
version: 0.3.0
license: GPL-3.0-or-later
min_tier: reduced
kind: mode
name: Bomb / Rush
description: Attackers arm the bomb and defend it; defenders must defuse it before it explodes. An explosion ends the game, the attackers winning. With team codes, each team arms and defuses with its own keypad code.
roles:
  bomb: { requires: [team_input], optional: [keypad, audio, led, display] }
params:
  attackers:          { type: team, default: red }
  defenders:          { type: team, default: blue }
  fuse_s:             { type: int, min: 10, max: 3600, default: 300, label: "Fuse (s)" }
  arm_hold_ms:        { type: int, default: 5000, label: "Hold time to arm (ms)" }
  defuse_hold_ms:     { type: int, default: 10000, label: "Hold time to defuse (ms)" }
  reset_after_defuse: { type: bool, default: false, label: "Return to standby after defuse" }
  auto_arm_after_s:   { type: int, optional: true, label: "Arm automatically after (s)" }
  team_codes:         { type: string, optional: true, max: 60, gm_only: true, label: "Team codes, e.g. red=1234,blue=5678: the keypad arms (a team's code) and defuses (another team's code) instead of the buttons" }
i18n:
  pt:
    name: Bomba / Rush
    description: Os atacantes armam a bomba e defendem-na; os defensores têm de a desarmar antes de explodir. Uma explosão termina o jogo e os atacantes ganham. Com códigos de equipa, cada equipa arma e desarma com o seu próprio código no teclado.
    params:
      attackers: Atacantes
      defenders: Defensores
      fuse_s: Rastilho (s)
      arm_hold_ms: Tempo a premir para armar (ms)
      defuse_hold_ms: Tempo a premir para desarmar (ms)
      reset_after_defuse: Voltar à espera depois de desarmada
      auto_arm_after_s: Armar automaticamente ao fim de (s)
      team_codes: "Códigos de equipa, ex.: red=1234,blue=5678: o teclado arma (o código de uma equipa) e desarma (o código de outra equipa) em vez dos botões"
  de:
    name: Bombe / Rush
    description: >-
      Die Angreifenden machen die Bombe scharf und verteidigen sie; die Verteidigenden müssen sie entschärfen,
      bevor sie explodiert. Eine Explosion beendet das Spiel, die Angreifenden gewinnen. Mit Team-Codes macht jedes Team mit seinem eigenen Code am Tastenfeld scharf und
      entschärft.
    params:
      attackers: Angreifende
      defenders: Verteidigende
      fuse_s: Zünder (s)
      arm_hold_ms: Haltezeit zum Schärfen (ms)
      defuse_hold_ms: Haltezeit zum Entschärfen (ms)
      reset_after_defuse: Nach dem Entschärfen wieder bereit
      auto_arm_after_s: Automatisch scharf nach (s)
      team_codes: "Team-Codes, z. B. red=1234,blue=5678: das Tastenfeld macht scharf (der Code eines Teams) und entschärft (der Code eines anderen Teams) statt der Knöpfe"
  zh-tw:
    name: 炸彈 / Rush
    description: 進攻方啟動炸彈並守住它；防守方必須在爆炸前拆除。爆炸會結束遊戲，進攻方獲勝。使用隊伍密碼時，各隊用自己的密碼在按鍵上啟動與拆除。
    params:
      attackers: 進攻方
      defenders: 防守方
      fuse_s: 引信（秒）
      arm_hold_ms: 啟動需按住的時間（毫秒）
      defuse_hold_ms: 拆除需按住的時間（毫秒）
      reset_after_defuse: 拆除後回到待命
      auto_arm_after_s: 自動啟動的時間（秒）
      team_codes: 隊伍密碼，例如 red=1234,blue=5678：改用按鍵啟動（某一隊的密碼）與拆除（另一隊的密碼），不用按鈕
