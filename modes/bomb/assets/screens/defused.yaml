#
# The bomb was defused: the whole screen in the winning team's colour.
# Data: team (the defusing team); lang (pt or en) from the box.
template: defused
style: { background: "{team || 'panel'}" }
layout:
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{lang == 'pt' && 'DESARMADA' || 'DEFUSED'}"
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{team|upper} team wins"
    style: { font_size: 28, color: contrast, visible: "{team && lang != 'pt'}" }
  - type: label
    text: "Vence a equipa {team|upper}"
    style: { font_size: 28, color: contrast, visible: "{team && lang == 'pt'}" }
