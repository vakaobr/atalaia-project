#
# The bomb was defused: the whole screen in the winning team's colour.
# Data: team (the defusing team).
template: defused
style: { background: "{team || 'panel'}" }
layout:
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast }
  - type: label
    text: DEFUSED
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{team|upper} team wins"
    style: { font_size: 28, color: contrast, visible: "{team}" }
