name: Attackers arm the bomb, it explodes when the fuse runs out and the game ends, the attackers winning
params: { fuse_s: 60 }
steps:
  - hold: { team: red, s: 5 }
  - expect: { type: bomb.armed, team: red, at: 5, data: { fuse_s: 60 } }
  - wait: 59
  - expect_no: bomb.exploded
  - expect_screen: { template: countdown, data: { left: 1 } }
  - wait: 1
  - expect: { type: bomb.exploded, team: red, at: 65 }
  - expect_screen: { template: exploded, data: { team: red } }
  - expect: { type: game.end, at: 65, data: { reason: win, winner: red } }
  - expect_status: ended
  - wait: 5
  - expect_screen: { template: exploded }
