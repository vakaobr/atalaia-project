name: While a code is typed on the armed bomb, the prompt shows the fuse; idle for 10 s it goes back to the countdown
params: { fuse_s: 60, team_codes: "red=1234,blue=5678" }
steps:
  - keys: "1234#"
  - wait: 5
  - keys: "56"
  - expect_screen: { template: code_entry, data: { title: DEFUSE, digits: 2, left: 55 } }
  - wait: 1
  - expect_screen: { template: code_entry, data: { title: DEFUSE, digits: 2, left: 54 } }
  - keys: "*"
  - expect_screen: { template: code_entry, data: { digits: 0 } }
  - wait: 10
  - expect_screen: { template: countdown, data: { left: 44, team: red } }
  - expect_no: bomb.defused
