name: By default a defused bomb cannot be armed again
params: { fuse_s: 60 }
steps:
  - hold: { team: red, s: 5 }
  - hold: { team: blue, s: 10 }
  - hold: { team: red, s: 5 }
  - expect: bomb.armed
  - expect: bomb.defused
  - expect_no: bomb.armed
