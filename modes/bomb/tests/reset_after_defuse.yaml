name: With reset_after_defuse the bomb returns to standby
params: { fuse_s: 60, reset_after_defuse: true }
steps:
  - hold: { team: red, s: 5 }
  - hold: { team: blue, s: 10 }
  - hold: { team: red, s: 5 }
  - expect: bomb.armed
  - expect: bomb.defused
  - expect: { type: bomb.armed, team: red, at: 20 }
