  - expect_score: { team: red, points: 0 }
  # 24 m north of the centre, inside, with an accuracy of 25 m: as precise as the zone, so it counts.
  - position: { player: p-vip, team: red, role: vip, lat: 38.722560, lon: -9.139312, acc: 25 }
