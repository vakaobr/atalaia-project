# 38.723244 is 100 m north of the zone's centre (75 m to its edge), 38.722610
# 29.5 m (4.5 m to the edge, shown rounded up: 5), 38.722390 5 m: inside.
name: "The payload prop: no fix yet, a weak fix, the metres left, then inside the zone: vip.extracted from the prop, the game ends won by red"
params: { extraction: "38.722345,-9.139312", lang: en }
nodes: { cargo: payload, cp1: checkpoint }
steps:
  - gps: { node: cargo }
  - expect_screen: { node: cargo, template: payload, data: { state: searching, team: red } }
  - gps: { node: cargo, lat: 38.723244, lon: -9.139312, acc: 60 }
  - expect_screen: { node: cargo, template: payload, data: { state: weak, metres: 60 } }
  - gps: { node: cargo, lat: 38.723244, lon: -9.139312, acc: 8 }
  - expect_screen: { node: cargo, template: payload, data: { state: moving, metres: 75 } }
  - wait: 20
  - gps: { node: cargo, lat: 38.722610, lon: -9.139312, acc: 8 }
  - expect_screen: { node: cargo, template: payload, data: { state: moving, metres: 5 } }
  - expect_no: vip.extracted
  - wait: 20
  - gps: { node: cargo, lat: 38.722390, lon: -9.139312, acc: 8 }
  - expect: { type: vip.extracted, node: cargo, team: red, at: 40 }
  - expect: { type: game.end, data: { winner: red } }
  - expect_score: { team: red, points: 100 }
  # The checkpoint box never got a fix: it stays a checkpoint.
  - expect_screen: { node: cp1, template: final_score }
  - expect_no: script.error
