#
# Nobody holds the checkpoint. No data; the hold time comes from the game's
# parameters. Texts in params.lang (pt, the default, en, de or zh-tw).
template: checkpoint_free
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{params.lang == 'en' && 'CHECKPOINT' || params.lang == 'de' && 'CHECKPOINT' || params.lang == 'zh-tw' && '檢查點' || 'PONTO DE CONTROLO'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'HOLD TO CAPTURE' || params.lang == 'de' && 'GEDRÜCKT HALTEN' || params.lang == 'zh-tw' && '按住以佔領' || 'MANTÉM PREMIDO'}"
    style: { font_size: 28, color: accent }
  - type: label
    text: "{params.lang == 'en' && 'Hold your button for' || params.lang == 'de' && 'Halte deinen Knopf' || params.lang == 'zh-tw' && '按住按鈕' || 'o botão'} {params.capture_hold_ms / 1000} {params.lang == 'en' && 's' || params.lang == 'de' && 's lang' || params.lang == 'zh-tw' && '秒' || 's para capturar'}"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Nobody holds this checkpoint' || params.lang == 'de' && 'Kein Team hält diesen Checkpoint' || params.lang == 'zh-tw' && '目前沒有隊伍佔領此檢查點' || 'Ninguém tem este ponto'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
