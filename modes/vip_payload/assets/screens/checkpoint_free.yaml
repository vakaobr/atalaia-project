#
# Nobody holds the checkpoint. No data; the hold time comes from the game's
# parameters. Texts in the box's language, data lang (pt, en, de or zh-tw;
# English without one).
template: checkpoint_free
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'PONTO DE CONTROLO' || lang == 'de' && 'CHECKPOINT' || lang == 'zh-tw' && '檢查點' || 'CHECKPOINT'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'MANTÉM PREMIDO' || lang == 'de' && 'GEDRÜCKT HALTEN' || lang == 'zh-tw' && '按住以佔領' || 'HOLD TO CAPTURE'}"
    style: { font_size: 28, color: accent }
  - type: label
    text: "{lang == 'pt' && 'o botão' || lang == 'de' && 'Halte deinen Knopf' || lang == 'zh-tw' && '按住按鈕' || 'Hold your button for'} {params.capture_hold_ms / 1000} {lang == 'pt' && 's para capturar' || lang == 'de' && 's lang' || lang == 'zh-tw' && '秒' || 's'}"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Ninguém tem este ponto' || lang == 'de' && 'Kein Team hält diesen Checkpoint' || lang == 'zh-tw' && '目前沒有隊伍佔領此檢查點' || 'Nobody holds this checkpoint'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
