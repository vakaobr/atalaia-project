#
# The payload prop (a phone with GPS). Data: team (the escorting team),
# state (searching: no fix yet; weak: the fix is less precise than the zone,
# metres is its accuracy; no_zone: the game has no extraction zone; moving:
# metres is the distance to the zone's edge; extracted), metres. Texts in
# params.lang (pt, the default, en, de or zh-tw). Nothing here says where the
# zone or the phone is.
template: payload
style: { background: "{state == 'extracted' && team || 'background'}" }
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{params.lang == 'en' && 'PAYLOAD' || params.lang == 'de' && 'PAYLOAD' || params.lang == 'zh-tw' && '護送目標' || 'CARGA'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: icon
    icon: gps
    style: { font_size: 48, color: muted, visible: "{state == 'searching' || state == 'weak'}" }
  - type: label
    text: "{metres} m"
    style: { font_size: 48, color: accent, visible: "{state == 'moving'}" }
  - type: label
    text: "{params.lang == 'en' && 'to the extraction zone' || params.lang == 'de' && 'bis zur Extraktionszone' || params.lang == 'zh-tw' && '距離撤離區' || 'até à zona de extração'}"
    style: { font_size: 20, color: muted, visible: "{state == 'moving'}" }
  - type: label
    text: "{params.lang == 'en' && 'Looking for GPS' || params.lang == 'de' && 'Suche GPS' || params.lang == 'zh-tw' && '搜尋 GPS 中' || 'À procura de GPS'}"
    style: { font_size: 28, visible: "{state == 'searching'}" }
  - type: label
    text: "{params.lang == 'en' && 'Weak GPS' || params.lang == 'de' && 'GPS schwach' || params.lang == 'zh-tw' && 'GPS 訊號弱' || 'GPS fraco'} ({metres} m)"
    style: { font_size: 28, color: orange, visible: "{state == 'weak'}" }
  - type: label
    text: "{params.lang == 'en' && 'No extraction zone' || params.lang == 'de' && 'Keine Extraktion' || params.lang == 'zh-tw' && '沒有撤離區' || 'Sem zona de extração'}"
    style: { font_size: 28, color: muted, visible: "{state == 'no_zone'}" }
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast, visible: "{state == 'extracted'}" }
  - type: label
    text: "{params.lang == 'de' && 'EXTRAHIERT' || params.lang == 'zh-tw' && '撤離成功' || 'EXTRAÇÃO CONCLUÍDA'}"
    style: { font_size: 20, color: contrast, visible: "{state == 'extracted' && params.lang != 'en'}" }
  - type: label
    text: "EXTRACTED"
    style: { font_size: 28, color: contrast, visible: "{state == 'extracted' && params.lang == 'en'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Take me to the extraction zone' || params.lang == 'de' && 'Bring mich zur Extraktionszone' || params.lang == 'zh-tw' && '把我帶到撤離區' || 'Leva-me à zona de extração'}"
    style:
      font_size: 14
      color: muted
      visible: "{state != 'extracted'}"
      padding: { bottom: 10 }
