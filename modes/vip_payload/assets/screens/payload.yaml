#
# The payload prop (a phone with GPS). Data: team (the escorting team),
# state (searching: no fix yet; weak: the fix is less precise than the zone,
# metres is its accuracy; no_zone: the game has no extraction zone; moving:
# metres is the distance to the zone's edge; extracted), metres. Texts in the
# box's language, data lang (pt, en, de or zh-tw; English without one). Nothing here says where the
# zone or the phone is.
template: payload
style: { background: "{state == 'extracted' && team || 'background'}" }
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{lang == 'pt' && 'CARGA' || lang == 'de' && 'PAYLOAD' || lang == 'zh-tw' && '護送目標' || 'PAYLOAD'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: icon
    icon: gps
    style: { font_size: 48, color: muted, visible: "{state == 'searching' || state == 'weak'}" }
  - type: label
    text: "{metres} m"
    style: { font_size: 48, color: accent, visible: "{state == 'moving'}" }
  - type: label
    text: "{lang == 'pt' && 'até à zona de extração' || lang == 'de' && 'bis zur Extraktionszone' || lang == 'zh-tw' && '距離撤離區' || 'to the extraction zone'}"
    style: { font_size: 20, color: muted, visible: "{state == 'moving'}" }
  - type: label
    text: "{lang == 'pt' && 'À procura de GPS' || lang == 'de' && 'Suche GPS' || lang == 'zh-tw' && '搜尋 GPS 中' || 'Looking for GPS'}"
    style: { font_size: 28, visible: "{state == 'searching'}" }
  - type: label
    text: "{lang == 'pt' && 'GPS fraco' || lang == 'de' && 'GPS schwach' || lang == 'zh-tw' && 'GPS 訊號弱' || 'Weak GPS'} ({metres} m)"
    style: { font_size: 28, color: orange, visible: "{state == 'weak'}" }
  - type: label
    text: "{lang == 'pt' && 'Sem zona de extração' || lang == 'de' && 'Keine Extraktion' || lang == 'zh-tw' && '沒有撤離區' || 'No extraction zone'}"
    style: { font_size: 28, color: muted, visible: "{state == 'no_zone'}" }
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast, visible: "{state == 'extracted'}" }
  - type: label
    text: "{lang == 'de' && 'EXTRAHIERT' || lang == 'zh-tw' && '撤離成功' || 'EXTRAÇÃO CONCLUÍDA'}"
    style: { font_size: 20, color: contrast, visible: "{state == 'extracted' && (lang == 'pt' || lang == 'de' || lang == 'zh-tw')}" }
  - type: label
    text: "EXTRACTED"
    style: { font_size: 28, color: contrast, visible: "{state == 'extracted' && lang != 'pt' && lang != 'de' && lang != 'zh-tw'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Leva-me à zona de extração' || lang == 'de' && 'Bring mich zur Extraktionszone' || lang == 'zh-tw' && '把我帶到撤離區' || 'Take me to the extraction zone'}"
    style:
      font_size: 14
      color: muted
      visible: "{state != 'extracted'}"
      padding: { bottom: 10 }
