#
# A team holds the checkpoint. Data: team, since (game time of the capture,
# in seconds). The box does not score: the controller does, while it is held.
# Texts in params.lang (pt, the default, en, de or zh-tw).
template: checkpoint_held
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{params.lang == 'en' && 'CHECKPOINT HELD' || params.lang == 'de' && 'CHECKPOINT BESETZT' || params.lang == 'zh-tw' && '檢查點已佔領' || 'PONTO CAPTURADO'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{params.lang == 'en' && 'held since' || params.lang == 'de' && 'seit' || params.lang == 'zh-tw' && '佔領於' || 'desde'} {since|clock}"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Hold your button to take it over' || params.lang == 'de' && 'Halte den Knopf zum Übernehmen' || params.lang == 'zh-tw' && '按住你的按鈕即可奪取' || 'Mantém o teu botão para o tomar'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
