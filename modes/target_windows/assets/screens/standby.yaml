#
# The target is dark between windows. Data: team (the team of the last
# scoring hit, if any) and hits (scoring hits on this target so far);
# lang (pt or en) from the box.
template: standby
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'ALVO' || 'TARGET'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'À ESPERA' || 'STAND BY'}"
    style: { font_size: 28, color: accent }
  - type: label
    text: "{lang == 'pt' && 'Espera pela tua cor' || 'Wait for your colour'}"
    style: { font_size: 20, color: muted }
  - type: label
    text: "{lang == 'pt' && 'Último acerto' || 'Last hit'}: {team|upper}"
    style: { font_size: 20, color: team, visible: "{team}" }
  - type: label
    text: "{hits} {lang == 'pt' && 'acertos que contam' || 'scoring hits'}"
    style: { font_size: 14, color: muted, visible: "{hits > 0}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Acerta no alvo enquanto mostra a tua cor' || 'Hit the target while it shows your colour'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
