#
# A scoring window is open. Data: team (whose window it is) and left (seconds
# until it closes); lang (pt, en, de or zh-tw) from the box.
template: window
style: { background: team }
layout:
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'ACERTA' || lang == 'de' && 'TREFFEN' || lang == 'zh-tw' && '射擊！' || 'HIT IT'}"
    style: { font_size: 28, color: contrast }
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{left} s"
    style: { font_size: 28, color: contrast }
  - type: spacer
    height: fill
