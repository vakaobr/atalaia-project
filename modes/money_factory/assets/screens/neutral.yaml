#
# A factory nobody holds (decision BN-11's name, so a box's OLED shows it as a
# free zone). Data: stock (the money in it), taker and progress (0-1) while a
# team holds its input; lang (pt, en, de or zh-tw) from the box.
template: neutral
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'FÁBRICA' || lang == 'de' && 'FABRIK' || lang == 'zh-tw' && '印鈔廠' || 'FACTORY'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'LIVRE' || lang == 'de' && 'FREI' || lang == 'zh-tw' && '中立' || 'NEUTRAL'}"
    style: { font_size: 48 }
  - type: label
    text: "{lang == 'pt' && 'A tomar:' || lang == 'de' && 'Übernahme:' || lang == 'zh-tw' && '奪取中' || 'Taking:'} {taker|upper}"
    style: { font_size: 20, color: "{taker}", visible: "{taker}" }
  - type: progress_bar
    value: "{progress}"
    style: { width: 220, height: 12, color: "{taker}", visible: "{taker}" }
  - type: label
    text: "{lang == 'pt' && 'Mantém premido durante' || lang == 'de' && 'Halte deinen Knopf für' || lang == 'zh-tw' && '按住按鈕' || 'Hold your button for'} {params.capture_hold_ms / 1000} {lang == 'zh-tw' && '秒' || 's'}"
    style: { font_size: 20, color: accent, visible: "{!taker}" }
  - type: label
    text: "{lang == 'pt' && 'Dinheiro na fábrica:' || lang == 'de' && 'Geld in der Fabrik:' || lang == 'zh-tw' && '印鈔廠存量：' || 'Money in the factory:'} {stock}"
    style: { font_size: 14, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Captura-a para fazer dinheiro' || lang == 'de' && 'Nimm sie ein, um Geld zu machen' || lang == 'zh-tw' && '佔領它就能印鈔' || 'Capture it to make money'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
