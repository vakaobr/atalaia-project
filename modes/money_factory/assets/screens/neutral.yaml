#
# A factory nobody holds (decision BN-11's name, so a box's OLED shows it as a
# free zone). Data: stock (the money in it), taker and progress (0-1) while a
# team holds its input; lang (pt or en) from the box.
template: neutral
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'FÁBRICA' || 'FACTORY'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'LIVRE' || 'NEUTRAL'}"
    style: { font_size: 48 }
  - type: label
    text: "{lang == 'pt' && 'A tomar:' || 'Taking:'} {taker|upper}"
    style: { font_size: 20, color: "{taker}", visible: "{taker}" }
  - type: progress_bar
    value: "{progress}"
    style: { width: 220, height: 12, color: "{taker}", visible: "{taker}" }
  - type: label
    text: "{lang == 'pt' && 'Mantém premido durante' ||'Hold your button for'} {params.capture_hold_ms / 1000} s"
    style: { font_size: 20, color: accent, visible: "{!taker}" }
  - type: label
    text: "{lang == 'pt' && 'Dinheiro na fábrica:' || 'Money in the factory:'} {stock}"
    style: { font_size: 14, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Captura-a para fazer dinheiro' || 'Capture it to make money'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
