#
# A scan refused, and why. Data: reason, and for a player tag player, team and
# carrying; lang (pt, en, de or zh-tw) from the box.
template: refused
layout:
  - type: row
    style: { width: fill, height: 44, background: danger }
    children:
      - type: label
        text: "{lang == 'pt' && 'RECUSADO' || lang == 'de' && 'ABGELEHNT' || lang == 'zh-tw' && '已拒絕' || 'REFUSED'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Etiqueta falsificada' || lang == 'de' && 'Gefälschter Tag' || lang == 'zh-tw' && '偽造的標籤' || 'Forged tag'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'forged'}" }
  - type: label
    text: "{lang == 'pt' && 'Etiqueta de outro jogo' || lang == 'de' && 'Tag aus einem anderen Spiel' || lang == 'zh-tw' && '其他遊戲的標籤' || 'Tag from another game'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'game'}" }
  - type: label
    text: "{lang == 'pt' && 'Não é uma etiqueta do jogo' || lang == 'de' && 'Kein Tag dieses Spiels' || lang == 'zh-tw' && '不是這場遊戲的標籤' || 'Not a game tag'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'not_tag'}" }
  - type: label
    text: "{lang == 'pt' && 'Esta caixa não está num jogo' || lang == 'de' && 'Diese Box ist in keinem Spiel' || lang == 'zh-tw' && '這個盒子不在遊戲中' || 'This box is not in a game'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'no_game'}" }
  - type: label
    text: "{lang == 'pt' && 'Equipa desconhecida' || lang == 'de' && 'Unbekanntes Team' || lang == 'zh-tw' && '未知隊伍' || 'Unknown team'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'no_team'}" }
  - type: label
    text: "{lang == 'pt' && 'Captura primeiro a fábrica' || lang == 'de' && 'Nimm zuerst die Fabrik ein' || lang == 'zh-tw' && '先佔領印鈔廠' || 'Capture the factory first'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'neutral'}" }
  - type: label
    text: "{lang == 'pt' && 'A fábrica é de outra equipa' || lang == 'de' && 'Ein anderes Team hält die Fabrik' || lang == 'zh-tw' && '印鈔廠在別隊手上' || 'Another team holds the factory'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'not_yours'}" }
  - type: label
    text: "{lang == 'pt' && 'A fábrica ainda não tem dinheiro' || lang == 'de' && 'Noch kein Geld in der Fabrik' || lang == 'zh-tw' && '印鈔廠還沒有錢' || 'No money in the factory yet'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'empty'}" }
  - type: label
    text: "{lang == 'pt' && 'Já levas o máximo: vai a um banco' || lang == 'de' && 'Du trägst das Maximum: ab zur Bank' || lang == 'zh-tw' && '你已帶滿：去銀行' || 'You carry all you can: go to a bank'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'full'}" }
  - type: label
    text: "{lang == 'pt' && 'Não levas dinheiro' || lang == 'de' && 'Du trägst kein Geld' || lang == 'zh-tw' && '你身上沒有錢' || 'You carry no money'}"
    style: { font_size: 20, width: 300, visible: "{reason == 'nothing'}" }
  - type: label
    text: "{player}"
    style:
      font_size: 14
      color: muted
      visible: "{player}"
      padding: { top: 6 }
  - type: spacer
    height: fill
