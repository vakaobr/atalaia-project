#
# A team holds the factory (decision BN-11's name, so a box's OLED shows the
# team and how long it has held it). Data: team, since (game time of the
# capture, in seconds), stock (the money in it), taker and progress (0-1)
# while another team holds its input; lang (pt or en) from the box.
template: captured
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{lang == 'pt' && 'FÁBRICA OCUPADA' || 'FACTORY HELD'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{stock} / {params.capacity}"
    style: { font_size: 28 }
  - type: progress_bar
    value: "{stock / params.capacity}"
    style: { width: 220, height: 10, color: team, visible: "{!taker}" }
  - type: label
    text: "{lang == 'pt' && 'A tomar:' || 'Taking:'} {taker|upper}"
    style: { font_size: 20, color: "{taker}", visible: "{taker}" }
  - type: progress_bar
    value: "{progress}"
    style: { width: 220, height: 12, color: "{taker}", visible: "{taker}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Lê a tua etiqueta para recolher' || 'Scan your tag to collect'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
