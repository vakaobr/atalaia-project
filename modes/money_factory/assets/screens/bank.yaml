#
# A bank. Data: total (money banked here), counts (per team, as text); lang
# (pt or en) from the box.
template: bank
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'BANCO' || lang == 'de' && 'BANK' || lang == 'zh-tw' && '銀行' || 'BANK'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{total}"
    style: { font_size: 48 }
  - type: label
    text: "{lang == 'pt' && 'depositado neste banco' || lang == 'de' && 'hier eingezahlt' || lang == 'zh-tw' && '存在這間銀行' || 'banked here'}"
    style: { font_size: 20, color: muted }
  - type: label
    text: "{counts}"
    style: { font_size: 20, visible: "{counts}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Lê a tua etiqueta para depositar' || lang == 'de' && 'Scanne deinen Tag zum Einzahlen' || lang == 'zh-tw' && '感應你的標籤來存錢' || 'Scan your tag to bank your money'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
