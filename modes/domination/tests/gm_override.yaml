name: The GM can give the box to a team or free it; freeing it stops the scoring
steps:
  - input: { node: zone, type: cmd.set_owner, data: { team: red } }
  - expect: { type: zone.captured, team: red, at: 0 }
  - expect_screen: { node: zone, template: captured, data: { team: red } }
  - wait: 12                      # red scores at 10 s
  - expect_score: { team: red, points: 1 }
  - input: { node: zone, type: cmd.set_owner, data: { team: blue } }
  - expect: { type: zone.captured, team: blue, at: 12, data: { previous_team: red } }
  - input: { node: zone, type: cmd.set_owner, data: { team: none } }
  - expect: { type: zone.neutralized, data: { previous_team: blue } }
  - expect_screen: { node: zone, template: neutral }
  - wait: 20
  - expect_score: { team: red, points: 1 }
  - expect_score: { team: blue, points: 0 }
  - expect_no: script.error
