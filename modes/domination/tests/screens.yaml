name: The screen shows standby, then the holding team with its points on the box, then the final score
steps:
  - expect_screen: { template: standby }
  - hold: { team: red, s: 3 }
  - expect_screen: { template: captured, data: { team: red, points: 0, since: 3 } }
  - wait: 7                       # the tick at 10 s
  - expect_screen: { template: captured, data: { team: red, points: 1, since: 3 } }
  - hold: { team: blue, s: 3 }
  - expect_screen: { template: captured, data: { team: blue, points: 0, since: 13 } }
  - end: time
  - expect_screen: { template: final_score, data: { owner: blue, points: 0 } }
