id: org.atalaia.domination
version: 0.1.0
license: GPL-3.0-or-later
min_tier: reduced
name: Domination
description: The last team to claim the box scores while it holds it.
roles:
  zone: { requires: [team_input], optional: [team_display, audio, display] }
params:
  capture_hold_ms: { type: int, min: 0, max: 60000, default: 3000, label: "Hold time to capture (ms)" }
  tick_s:          { type: int, min: 1, max: 600,   default: 10,   label: "Seconds per scoring tick" }
  points_per_tick: { type: int, min: 1, max: 1000,  default: 1,    label: "Points per tick" }
i18n:
  pt:
    name: Domínio
    description: A última equipa a capturar a caixa pontua enquanto a tiver.
    params:
      capture_hold_ms: Tempo a premir para capturar (ms)
      tick_s: Segundos por intervalo de pontuação
      points_per_tick: Pontos por intervalo
  de:
    name: Domination
    description: Das letzte Team, das die Box einnimmt, punktet, solange es sie hält.
    params:
      capture_hold_ms: Haltezeit zum Einnehmen (ms)
      tick_s: Sekunden pro Wertungsintervall
      points_per_tick: Punkte pro Intervall
  zh-tw:
    name: 佔點
    description: 最後佔領盒子的隊伍，在佔有期間持續得分。
    params:
      capture_hold_ms: 佔領需按住的時間（毫秒）
      tick_s: 每次計分間隔（秒）
      points_per_tick: 每次計分的分數
