#
# Nobody holds the zone yet. No data; the hold time comes from the game's parameters.
template: standby
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: ZONE
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: HOLD TO CAPTURE
    style: { font_size: 28, color: accent }
  - type: label
    text: "Hold your button for {params.capture_hold_ms / 1000} s"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: Nobody holds this zone
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
