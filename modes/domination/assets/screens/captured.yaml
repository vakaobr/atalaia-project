#
# A team holds the zone. Data: team, points (the team's on this box),
# since (game time of the capture, in seconds); lang (pt, en, de or zh-tw) from the box.
# The Field Box also adds held (the seconds since "since" by the game's clock) and live (1),
# updated every second, so its screen counts up "held 1:23"; without them (a phone) the screen
# says "held since <game time of the capture>".
template: captured
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{lang == 'pt' && 'ZONA OCUPADA' || lang == 'de' && 'ZONE BESETZT' || lang == 'zh-tw' && '據點已佔領' || 'ZONE HELD'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{points} {lang == 'pt' && 'pontos nesta caixa' || lang == 'de' && 'Punkte auf dieser Box' || lang == 'zh-tw' && '分（這個盒子）' || 'points on this box'}"
    style: { font_size: 20 }
  - type: label
    text: "{lang == 'pt' && 'ocupada há' || lang == 'de' && 'gehalten seit' || lang == 'zh-tw' && '已佔領' || 'held'} {held|clock}"
    style: { font_size: 20, color: muted, visible: "{live}" }
  - type: label
    text: "{lang == 'pt' && 'desde' || lang == 'de' && 'seit' || lang == 'zh-tw' && '佔領於' || 'held since'} {since|clock}"
    style: { font_size: 20, color: muted, visible: "{!live}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Mantém o botão premido para a tomar' || lang == 'de' && 'Halte den Knopf zum Übernehmen' || lang == 'zh-tw' && '按住你的按鈕即可奪取' || 'Hold your button to take it over'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
