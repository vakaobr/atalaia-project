#
# A team holds the zone. Data: team, points (the team's on this box),
# since (game time of the capture, in seconds); lang (pt or en) from the box.
template: captured
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{lang == 'pt' && 'ZONA OCUPADA' || 'ZONE HELD'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{points} {lang == 'pt' && 'pontos nesta caixa' || 'points on this box'}"
    style: { font_size: 20 }
  - type: label
    text: "{lang == 'pt' && 'desde' || 'held since'} {since|clock}"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Mantém o botão premido para a tomar' || 'Hold your button to take it over'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
