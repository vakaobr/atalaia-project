#
# A team holds the zone. Data: team, points (the team's on this box),
# since (game time of the capture, in seconds).
template: captured
layout:
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: ZONE HELD
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{points} points on this box"
    style: { font_size: 20 }
  - type: label
    text: "held since {since|clock}"
    style: { font_size: 20, color: muted }
  - type: spacer
    height: fill
  - type: label
    text: Hold your button to take it over
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
