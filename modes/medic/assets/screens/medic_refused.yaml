#
# A tag or a hold was refused. Data: reason (mac, game, no_game, team,
# not_tag, wrong_team, limit, cooldown, cancelled, scan_first), message (the
# reason in params.lang, from the script), player and team (when the tag was
# a player's), remaining (heals left in the kit).
template: medic_refused
layout:
  - type: row
    style: { width: fill, height: 44, background: danger }
    children:
      - type: label
        text: RECUSADO
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{params.lang != 'en'}" }
      - type: label
        text: REFUSED
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{params.lang == 'en'}" }
  - type: spacer
    height: fill
  - type: icon
    icon: close
    style: { font_size: 48, color: danger }
  - type: label
    text: "{message}"
    style: { font_size: 20, width: 300, align: center }
  - type: label
    text: "{player}"
    style: { font_size: 20, color: "{team || 'muted'}", visible: "{player}" }
  - type: spacer
    height: fill
