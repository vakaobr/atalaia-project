#
# A player's tag was read: the heal fills up while the button is held.
# Data: player, team (the player's), progress (0-1), left (seconds still to
# hold), remaining (heals left in the kit). Texts in params.lang (pt, the
# default, en, de or zh-tw).
template: medic_hold
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{player}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Keep holding to heal' || params.lang == 'de' && 'Halten zum Behandeln' || params.lang == 'zh-tw' && '按住以治療' || 'Mantém premido para tratar'}"
    style: { font_size: 20, width: 300, align: center }
  - type: label
    text: "{left}"
    style: { font_size: 48, color: accent }
  - type: progress_bar
    value: "{progress}"
    style: { width: 260, height: 14, color: "{team || 'accent'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Letting go early cancels' || params.lang == 'de' && 'Zu früh loslassen bricht ab' || params.lang == 'zh-tw' && '太早放開就會取消' || 'Largar antes do tempo cancela'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
