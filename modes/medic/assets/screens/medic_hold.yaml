#
# A player's tag was read: the heal fills up while the button is held.
# Data: player, team (the player's), progress (0-1), left (seconds still to
# hold), remaining (heals left in the kit). Texts in params.lang (pt or en).
template: medic_hold
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{player}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: Mantém premido para tratar
    style: { font_size: 20, width: 300, align: center, visible: "{params.lang != 'en'}" }
  - type: label
    text: Keep holding to heal
    style: { font_size: 20, width: 300, align: center, visible: "{params.lang == 'en'}" }
  - type: label
    text: "{left}"
    style: { font_size: 48, color: accent }
  - type: progress_bar
    value: "{progress}"
    style: { width: 260, height: 14, color: "{team || 'accent'}" }
  - type: spacer
    height: fill
  - type: label
    text: Largar antes do tempo cancela
    style:
      font_size: 14
      color: muted
      visible: "{params.lang != 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: Letting go early cancels
    style:
      font_size: 14
      color: muted
      visible: "{params.lang == 'en'}"
      padding: { bottom: 10 }
