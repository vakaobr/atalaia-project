#
# The kit waits for a player's tag. Data: remaining (heals left), team (the
# team the kit serves, if one). The texts follow the game's params.lang
# (pt, the default, or en).
template: medic_idle
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: LIGADURAS
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{params.lang != 'en'}" }
      - type: label
        text: MEDIC KIT
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{params.lang == 'en'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{remaining}"
    style: { font_size: 48, color: "{remaining <= 1 && 'orange' || 'white'}" }
  - type: label
    text: "Restam {remaining} ligaduras"
    style: { font_size: 20, color: muted, visible: "{params.lang != 'en' && remaining != 1}" }
  - type: label
    text: Resta 1 ligadura
    style: { font_size: 20, color: muted, visible: "{params.lang != 'en' && remaining == 1}" }
  - type: label
    text: "{remaining} heals left"
    style: { font_size: 20, color: muted, visible: "{params.lang == 'en' && remaining != 1}" }
  - type: label
    text: 1 heal left
    style: { font_size: 20, color: muted, visible: "{params.lang == 'en' && remaining == 1}" }
  - type: spacer
    height: fill
  - type: label
    text: Lê a tua etiqueta
    style: { font_size: 28, color: accent, visible: "{params.lang != 'en'}" }
  - type: label
    text: Scan your tag
    style: { font_size: 28, color: accent, visible: "{params.lang == 'en'}" }
  - type: label
    text: e mantém premido o botão
    style:
      font_size: 14
      color: muted
      visible: "{params.lang != 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: then hold the button
    style:
      font_size: 14
      color: muted
      visible: "{params.lang == 'en'}"
      padding: { bottom: 10 }
