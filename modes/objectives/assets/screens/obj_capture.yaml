#
# A point to capture. Data: team (the team holding it, if one), only (the only
# team that may capture it, if one), hold_ms (how long to hold), label (the
# objective's name), lang (pt, the default, or en).
template: obj_capture
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{label || 'CAPTURAR'}"
        style: { font_size: 20, width: fill, align: center, color: "{team && 'contrast' || 'white'}", visible: "{lang != 'en'}" }
      - type: label
        text: "{label || 'CAPTURE'}"
        style: { font_size: 20, width: fill, align: center, color: "{team && 'contrast' || 'white'}", visible: "{lang == 'en'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team, visible: "{team}" }
  - type: label
    text: tem este ponto
    style: { font_size: 20, color: muted, visible: "{team && lang != 'en'}" }
  - type: label
    text: holds this point
    style: { font_size: 20, color: muted, visible: "{team && lang == 'en'}" }
  - type: label
    text: MANTÉM PREMIDO
    style: { font_size: 28, color: accent, visible: "{!team && lang != 'en'}" }
  - type: label
    text: HOLD TO CAPTURE
    style: { font_size: 28, color: accent, visible: "{!team && lang == 'en'}" }
  - type: spacer
    height: fill
  - type: label
    text: "Mantém premido {hold_ms / 1000} s para capturar"
    style:
      font_size: 14
      color: muted
      visible: "{!only && lang != 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: "Hold your button {hold_ms / 1000} s to capture"
    style:
      font_size: 14
      color: muted
      visible: "{!only && lang == 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: "Só a equipa {only} captura: {hold_ms / 1000} s"
    style:
      font_size: 14
      color: muted
      visible: "{only && lang != 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: "Only {only} captures: {hold_ms / 1000} s"
    style:
      font_size: 14
      color: muted
      visible: "{only && lang == 'en'}"
      padding: { bottom: 10 }
