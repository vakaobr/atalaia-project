#
# A bomb site. Data: phase (standby, armed, defused, exploded), team (armed,
# exploded: the team that armed it; defused: the team that defused it),
# attackers (the only team that may arm it, if one), left (armed: seconds
# left), fuse_s, label (the objective's name), lang (pt, the default, en, de or
# zh-tw).
template: obj_bomb
style: { background: "{phase == 'exploded' && 'danger' || 'background'}" }
layout:
  - type: row
    style: { width: fill, height: 44, background: "{phase == 'armed' && 'danger' || 'panel'}" }
    children:
      - type: label
        text: "{label || lang == 'en' && 'BOMB SITE' || lang == 'de' && 'BOMBENPLATZ' || lang == 'zh-tw' && '炸彈點' || 'LOCAL DA BOMBA'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{left|clock}"
    style: { font_size: 48, color: "{left <= 10 && 'danger' || 'white'}", visible: "{phase == 'armed'}" }
  - type: progress_bar
    value: "{left / fuse_s}"
    style: { width: 240, height: 10, color: "{team || 'danger'}", visible: "{phase == 'armed'}" }
  - type: label
    text: "{lang == 'en' && 'Hold to defuse' || lang == 'de' && 'Halten zum Entschärfen' || lang == 'zh-tw' && '按住以拆除' || 'Mantém premido para desarmar'}"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'armed'}"
      padding: { top: 6 }
  - type: label
    text: "{lang == 'de' && 'Halten zum Schärfen' || lang == 'zh-tw' && '按住以啟動' || 'Mantém premido para armar'}"
    style: { font_size: 20, color: accent, visible: "{phase == 'standby' && lang != 'en'}" }
  - type: label
    text: Hold to arm
    style: { font_size: 28, color: accent, visible: "{phase == 'standby' && lang == 'en'}" }
  - type: label
    text: "{lang == 'en' && 'DEFUSED' || lang == 'de' && 'ENTSCHÄRFT' || lang == 'zh-tw' && '已拆除' || 'DESARMADA'}"
    style: { font_size: 28, color: "{team || 'accent'}", visible: "{phase == 'defused'}" }
  - type: label
    text: "{lang == 'en' && 'EXPLODED' || lang == 'de' && 'EXPLODIERT' || lang == 'zh-tw' && '已爆炸' || 'EXPLODIU'}"
    style: { font_size: 28, color: white, visible: "{phase == 'exploded'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'en' && 'Armed by' || lang == 'de' && 'Scharf gemacht von' || lang == 'zh-tw' && '啟動隊伍' || 'Armada por'} {team|upper}"
    style:
      font_size: 14
      color: team
      visible: "{phase == 'armed'}"
      padding: { bottom: 10 }
  - type: label
    text: "Só a equipa {attackers} arma"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'standby' && attackers && lang != 'en' && lang != 'de' && lang != 'zh-tw'}"
      padding: { bottom: 10 }
  - type: label
    text: "Only {attackers} arms it"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'standby' && attackers && lang == 'en'}"
      padding: { bottom: 10 }
  - type: label
    text: "Nur Team {attackers} macht scharf"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'standby' && attackers && lang == 'de'}"
      padding: { bottom: 10 }
  - type: label
    text: "只有 {attackers} 隊能啟動"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'standby' && attackers && lang == 'zh-tw'}"
      padding: { bottom: 10 }
