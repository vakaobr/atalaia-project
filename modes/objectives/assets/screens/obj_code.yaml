#
# A code to type on the keypad. Data: team (the team credited, if known),
# digits (how many digits are typed: the code itself is never shown), note
# (wrong: the last code was wrong; ok: the right code was typed), label (the
# objective's name), lang (pt, the default, en, de or zh-tw).
template: obj_code
style: { background: "{note == 'ok' && team || 'background'}" }
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{label || lang == 'en' && 'CODE' || lang == 'de' && 'CODE' || lang == 'zh-tw' && '密碼' || 'CÓDIGO'}"
        style: { font_size: 20, width: fill, align: center, color: "{team && 'contrast' || 'white'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{digits}"
    style: { font_size: 48, color: accent, visible: "{note != 'ok'}" }
  - type: label
    text: "{lang == 'en' && 'digits typed' || lang == 'de' && 'Ziffern getippt' || lang == 'zh-tw' && '已輸入的位數' || 'algarismos marcados'}"
    style: { font_size: 20, color: muted, visible: "{note != 'ok'}" }
  - type: icon
    icon: ok
    style: { font_size: 48, color: "{team && 'contrast' || 'accent'}", visible: "{note == 'ok'}" }
  - type: label
    text: "{lang == 'en' && 'CODE ACCEPTED' || lang == 'de' && 'CODE RICHTIG' || lang == 'zh-tw' && '密碼正確' || 'CÓDIGO ACEITE'}"
    style: { font_size: 28, color: "{team && 'contrast' || 'white'}", visible: "{note == 'ok'}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'en' && 'Wrong code' || lang == 'de' && 'Falscher Code' || lang == 'zh-tw' && '密碼錯誤' || 'Código errado'}"
    style:
      font_size: 20
      color: danger
      visible: "{note == 'wrong'}"
      padding: { bottom: 8 }
  - type: label
    text: "{lang == 'en' && 'Type the code, then #  (* clears)' || lang == 'de' && 'Code tippen, dann #  (* löscht)' || lang == 'zh-tw' && '輸入密碼後按 #（* 清除）' || 'Marca o código e #  (* apaga)'}"
    style:
      font_size: 14
      color: muted
      visible: "{!note}"
      padding: { bottom: 10 }
