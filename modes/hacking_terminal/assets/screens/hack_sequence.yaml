#
# The sequence puzzle. Data: team (the team at the keypad, if known), owner
# (the team holding a captured terminal), phase (idle: waiting for a key;
# show: the sequence is shown; input: the player types it back), key (the key
# shown), step (the key shown, or the keys typed back so far), of (the
# sequence's length), locked (seconds left of a lock, 0 when open), note
# (yours when the holder's team types). Texts in params.lang (pt, the default,
# en, de or zh-tw).
template: hack_sequence
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || owner || 'panel'}" }
    children:
      - type: label
        text: "{params.lang == 'en' && 'REPEAT THE SEQUENCE' || params.lang == 'de' && 'WIEDERHOLE DIE FOLGE' || params.lang == 'zh-tw' && '照順序按回去' || 'REPETE A SEQUÊNCIA'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: label
    text: "{params.lang == 'zh-tw' && '終端：' || 'Terminal: '}{owner|upper}"
    style:
      font_size: 14
      color: "{owner}"
      visible: "{owner}"
      padding: { top: 4 }
  - type: spacer
    height: fill
  # Showing the sequence: the key, and its place in it.
  - type: label
    text: "{key}"
    style: { font_size: 48, color: accent, visible: "{phase == 'show'}" }
  - type: label
    text: "{step} / {of}"
    style: { font_size: 20, color: muted, visible: "{phase == 'show'}" }
  # Typing it back.
  - type: label
    text: "{params.lang == 'en' && 'YOUR TURN' || params.lang == 'de' && 'DU BIST DRAN' || params.lang == 'zh-tw' && '換你了' || 'A TUA VEZ'}"
    style: { font_size: 28, color: accent, visible: "{phase == 'input'}" }
  - type: progress_bar
    value: "{step / of}"
    style: { width: 260, height: 12, color: "{team || 'accent'}", visible: "{phase == 'input'}" }
  - type: label
    text: "{step} {params.lang == 'en' && 'of' || params.lang == 'de' && 'von' || params.lang == 'zh-tw' && '/' || 'de'} {of}"
    style:
      font_size: 20
      visible: "{phase == 'input'}"
      padding: { top: 6 }
  # Waiting, or locked.
  - type: label
    text: "{of} {params.lang == 'en' && 'KEYS' || params.lang == 'de' && 'TASTEN' || params.lang == 'zh-tw' && '個按鍵' || 'TECLAS'}"
    style: { font_size: 28, visible: "{phase == 'idle' && !locked}" }
  - type: label
    text: "{params.lang == 'en' && 'WRONG KEY: LOCKED' || params.lang == 'de' && 'FALSCH: GESPERRT' || params.lang == 'zh-tw' && '按錯了：鎖定' || 'TECLA ERRADA: BLOQUEADO'} {locked} {params.lang == 'zh-tw' && '秒' || 's'}"
    style: { font_size: 20, color: danger, visible: "{locked}" }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Your team holds this terminal' || params.lang == 'de' && 'Dein Team hält dieses Terminal' || params.lang == 'zh-tw' && '你的隊伍已佔領這個終端' || 'O terminal já é da tua equipa'}"
    style:
      font_size: 14
      color: muted
      visible: "{note == 'yours'}"
      padding: { bottom: 10 }
  - type: label
    text: "{params.lang == 'en' && 'Press a key to see the sequence' || params.lang == 'de' && 'Drück eine Taste für die Folge' || params.lang == 'zh-tw' && '按任一鍵看順序' || 'Carrega numa tecla para ver a sequência'}"
    style:
      font_size: 14
      color: muted
      visible: "{!note && phase == 'idle' && !locked}"
      padding: { bottom: 10 }
  - type: label
    text: "{params.lang == 'en' && 'Remember the keys' || params.lang == 'de' && 'Merk dir die Tasten' || params.lang == 'zh-tw' && '記住這些按鍵' || 'Memoriza as teclas'}"
    style:
      font_size: 14
      color: muted
      visible: "{phase == 'show'}"
      padding: { bottom: 10 }
