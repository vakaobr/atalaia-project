#
# The puzzle is solved. Data: team (the team that solved it, if known), code
# (the code it reveals, if the game set one), capture (true when the terminal
# is now that team's and another team can hack it back). Texts in
# params.lang (pt, the default, en, de or zh-tw).
template: hack_solved
style: { background: "{team || 'panel'}" }
layout:
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{params.lang == 'en' && 'ACCESS GRANTED' || params.lang == 'de' && 'ZUGRIFF ERTEILT' || params.lang == 'zh-tw' && '存取成功' || 'ACESSO CONCEDIDO'}"
    style: { font_size: 28, color: contrast }
  - type: label
    text: "{team|upper}"
    style: { font_size: 20, color: contrast, visible: "{team}" }
  - type: label
    text: "{params.lang == 'en' && 'Code' || params.lang == 'de' && 'Code' || params.lang == 'zh-tw' && '密碼' || 'Código'}"
    style:
      font_size: 14
      color: contrast
      visible: "{code}"
      padding: { top: 8 }
  - type: label
    text: "{code}"
    style: { font_size: 48, color: contrast, visible: "{code}" }
  - type: label
    text: "{params.lang == 'en' && 'Another team can hack it back' || params.lang == 'de' && 'Ein anderes Team kann es zurückhacken' || params.lang == 'zh-tw' && '別隊可以再駭回去' || 'Outra equipa pode voltar a hackeá-lo'}"
    style: { font_size: 14, color: contrast, visible: "{capture}", padding: 6 }
