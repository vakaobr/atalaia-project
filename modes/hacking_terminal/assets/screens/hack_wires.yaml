#
# The wires puzzle. Data: team (the team at the keypad, if known), owner (the
# team holding a captured terminal), wires (the wires' numbers, "-" for the
# ones cut), cut and of (wires cut, of all of them), locked (seconds left of a
# lock, 0 when open), note (yours when the holder's team types). Texts in
# params.lang (pt, the default, en, de or zh-tw).
template: hack_wires
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || owner || 'panel'}" }
    children:
      - type: label
        text: "{params.lang == 'en' && 'CUT THE WIRES' || params.lang == 'de' && 'KAPPE DIE DRÄHTE' || params.lang == 'zh-tw' && '剪斷電線' || 'CORTA OS FIOS'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: label
    text: "{params.lang == 'zh-tw' && '終端：' || 'Terminal: '}{owner|upper}"
    style:
      font_size: 14
      color: "{owner}"
      visible: "{owner}"
      padding: { top: 4 }
  - type: spacer
    height: fill
  - type: label
    text: "{wires}"
    style: { font_size: 48, color: "{locked && 'muted' || 'accent'}" }
  - type: progress_bar
    value: "{cut / of}"
    style: { width: 260, height: 12, color: "{team || 'accent'}" }
  - type: label
    text: "{cut} {params.lang == 'en' && 'of' || params.lang == 'de' && 'von' || params.lang == 'zh-tw' && '/' || 'de'} {of} {params.lang == 'en' && 'cut' || params.lang == 'de' && 'gekappt' || params.lang == 'zh-tw' && '條已剪' || 'cortados'}"
    style:
      font_size: 20
      visible: "{!locked}"
      padding: { top: 6 }
  - type: label
    text: "{params.lang == 'en' && 'WRONG WIRE: LOCKED' || params.lang == 'de' && 'FALSCH: GESPERRT' || params.lang == 'zh-tw' && '剪錯了：鎖定' || 'FIO ERRADO: BLOQUEADO'} {locked} {params.lang == 'zh-tw' && '秒' || 's'}"
    style:
      font_size: 20
      color: danger
      visible: "{locked}"
      padding: { top: 6 }
  - type: spacer
    height: fill
  - type: label
    text: "{params.lang == 'en' && 'Your team holds this terminal' || params.lang == 'de' && 'Dein Team hält dieses Terminal' || params.lang == 'zh-tw' && '你的隊伍已佔領這個終端' || 'O terminal já é da tua equipa'}"
    style:
      font_size: 14
      color: muted
      visible: "{note == 'yours'}"
      padding: { bottom: 10 }
  - type: label
    text: "{params.lang == 'en' && 'Press the number of the wire to cut' || params.lang == 'de' && 'Drück die Nummer des Drahts' || params.lang == 'zh-tw' && '按下要剪的電線號碼' || 'Carrega no número do fio a cortar'}"
    style:
      font_size: 14
      color: muted
      visible: "{!note}"
      padding: { bottom: 10 }
