name: With no pause the box goes back to standby after the result
params: { fuse_s: 20, pause_s: 0 }
steps:
  - hold: { team: red, s: 5 }
  - wait: 20
  - expect: { type: bomb.exploded }
  - wait: 1
  - expect_screen: { template: standby, data: { round: 2, a_points: 1 } }
