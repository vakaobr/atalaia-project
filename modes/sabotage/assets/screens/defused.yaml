#
# The bomb was defused: the whole screen in the scoring team's colour.
# Data: team (the defusing team, which scores the round's point); lang (pt, en, de or zh-tw) from the box.
template: defused
style: { background: "{team || 'panel'}" }
layout:
  - type: icon
    icon: ok
    style: { font_size: 48, color: contrast }
  - type: label
    text: "{lang == 'zh-tw' && '已拆除' || 'DEFUSED'}"
    style: { font_size: 48, color: contrast, visible: "{lang != 'de' && lang != 'pt'}" }
  # German's and Portuguese's words are wider than the screen at 48 px: 28.
  - type: label
    text: "{lang == 'pt' && 'DESARMADA' || 'ENTSCHÄRFT'}"
    style: { font_size: 28, color: contrast, visible: "{lang == 'de' || lang == 'pt'}" }
  - type: label
    text: "Point for team {team|upper}"
    style: { font_size: 28, color: contrast, visible: "{team && lang != 'pt' && lang != 'de' && lang != 'zh-tw'}" }
  - type: label
    text: "Ponto para {team|upper}"
    style: { font_size: 28, color: contrast, visible: "{team && lang == 'pt'}" }
  - type: label
    text: "Punkt für Team {team|upper}"
    style: { font_size: 28, color: contrast, visible: "{team && lang == 'de'}" }
  - type: label
    text: "{team|upper} 隊得分"
    style: { font_size: 28, color: contrast, visible: "{team && lang == 'zh-tw'}" }
