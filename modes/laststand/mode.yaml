id: org.atalaia.laststand
version: 0.1.0
license: GPL-3.0-or-later
min_tier: reduced
kind: mode
name: Last Stand
description: The defenders start with every zone. Once they are down to their last zone, a countdown to defeat runs until they retake another one.
roles:
  zone: { requires: [team_input], optional: [team_display, audio, display] }
params:
  capture_hold_ms: { type: int, min: 0, max: 60000, default: 3000, label: "Hold time to capture (ms)" }
  attackers:       { type: team, default: red, label: "Attackers (win when the defenders fall)" }
  defenders:       { type: team, default: blue, label: "Defenders (start with every zone)" }
  countdown_s:     { type: int, min: 10, max: 3600, default: 120, label: "Countdown to defeat (s)" }
  last_zones:      { type: int, min: 0, max: 63, default: 1, label: "The countdown runs while the defenders hold this many zones or fewer" }
  min_zones:       { type: int, min: 1, max: 64, default: 2, label: "Zones in play before the countdown can run" }
  reset:           { type: bool, default: true, label: "The countdown starts over after a retake (otherwise it carries on where it stopped)" }
  end_game:        { type: bool, default: true, label: "End the game when the defenders fall" }
i18n:
  pt:
    name: Último Elemento
    description: Os defensores começam com todas as zonas. Quando ficam reduzidos à última zona, corre uma contagem para a derrota até reconquistarem outra.
    params:
      capture_hold_ms: Tempo a premir para capturar (ms)
      attackers: Atacantes (ganham quando os defensores caem)
      defenders: Defensores (começam com todas as zonas)
      countdown_s: Contagem para a derrota (s)
      last_zones: A contagem corre enquanto os defensores tiverem este número de zonas ou menos
      min_zones: Zonas em jogo antes de a contagem poder correr
      reset: A contagem recomeça do início após uma reconquista (senão continua de onde parou)
      end_game: Terminar o jogo quando os defensores caem
  de:
    name: Last Stand
    description: >-
      Die Verteidigenden beginnen mit allen Zonen. Sobald sie nur noch ihre letzte Zone haben, läuft ein
      Countdown zur Niederlage, bis sie eine andere zurückerobern.
    params:
      capture_hold_ms: Haltezeit zum Einnehmen (ms)
      attackers: Angreifende (gewinnen, wenn die Verteidigenden fallen)
      defenders: Verteidigende (beginnen mit allen Zonen)
      countdown_s: Countdown zur Niederlage (s)
      last_zones: Der Countdown läuft, solange die Verteidigenden so viele Zonen oder weniger halten
      min_zones: Zonen im Spiel, bevor der Countdown laufen kann
      reset: Der Countdown beginnt nach einer Rückeroberung von vorn (sonst läuft er weiter, wo er stand)
      end_game: Das Spiel endet, wenn die Verteidigenden fallen
  zh-tw:
    name: 最後一人
    description: 防守方一開始佔有所有據點。防守方只剩最後一個據點時，失敗倒數開始，直到防守方奪回另一個據點為止。
    params:
      capture_hold_ms: 佔領需按住的時間（毫秒）
      attackers: 進攻方（防守方失守時獲勝）
      defenders: 防守方（一開始佔有所有據點）
      countdown_s: 失敗倒數（秒）
      last_zones: 防守方佔有的據點不超過這個數目時開始倒數
      min_zones: 倒數開始前需要在場的據點數
      reset: 奪回據點後倒數重新開始（否則從停下的地方繼續）
      end_game: 防守方失守時結束遊戲
