#
# The Kill Confirmed station. Data: team (the team turning in tags, while the
# station is open), left (seconds left to scan), message, error; lang (pt, de, zh-tw,
# else English) from the box.
template: tags
layout:
  - type: row
    style: { width: fill, height: 44, background: "{team || 'panel'}" }
    children:
      - type: label
        text: "{lang == 'pt' && 'BAIXA CONFIRMADA' || lang == 'de' && 'KILL CONFIRMED' || lang == 'zh-tw' && '擊殺確認' || 'KILL CONFIRMED'}"
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{!team}" }
      - type: label
        text: "{team|upper}{lang == 'pt' && ': LÊ AS ETIQUETAS' || lang == 'de' && ': TAGS SCANNEN' || lang == 'zh-tw' && '：感應標籤' || ': SCAN TAGS'}"
        style: { font_size: 20, width: fill, align: center, color: contrast, visible: "{team}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Carrega no botão' || lang == 'de' && 'Knopf drücken' || lang == 'zh-tw' && '按你的按鈕' || 'Press your button'}"
    style: { font_size: 28, visible: "{!team}" }
  - type: label
    text: "{lang == 'pt' && 'e lê as etiquetas' || lang == 'de' && 'dann die Tags scannen' || lang == 'zh-tw' && '然後感應標籤' || 'then scan the tags'}"
    style: { font_size: 20, color: muted, visible: "{!team}" }
  - type: label
    text: "{left}"
    style: { font_size: 48, color: team, visible: "{team}" }
  - type: progress_bar
    value: "{left / params.turn_in_s}"
    style: { width: 240, height: 8, color: team, visible: "{team}" }
  - type: label
    text: "{message}"
    style:
      font_size: 20
      width: 300
      color: "{error && 'danger' || 'accent'}"
      visible: "{message}"
      padding: { top: 6 }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Inimiga confirma, da equipa recusa.' || lang == 'de' && 'Gegner-Tag zählt, Team-Tag nicht.' || lang == 'zh-tw' && '敵隊標籤確認，自隊標籤拒絕。' || 'Enemy tag: confirmed. Team tag: denied.'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
