#
# Atalaia field controller settings. Copy to controller.toml and run:
#   python3 -m atalaia_controller run --config controller.toml
# Every setting can also come from ATALAIA_<SECTION>_<KEY>, for example
# ATALAIA_API_GM_TOKEN or ATALAIA_MODEM_PORT.

[controller]
node_id = 0                       # this controller's short id on the radio
db_path = "/var/lib/atalaia/controller.db"
failover_mode = "manual"          # "auto" only after field testing (ADR-P2-8)
power_source = 3                  # 3 mains or USB, 2 large battery, 1 small battery
battery_pct = 100
storage_ok = true
persist_game_key = false          # true: the game survives a controller restart, but
                                  # the key is then on the Pi's disk (see README)

[radio]
# The field's channel until the GM chooses one in the console (Settings), which
# then wins. 869.525 MHz is the centre of 869.4-869.65 MHz, the only EU868
# sub-band with 10% duty cycle and 500 mW ERP; elsewhere in 868-870 MHz the
# limits are 1% (0.1% on 868.7-869.2) and 25 mW, and 868.1/868.3/868.5 MHz are
# LoRaWAN's busy default channels. The whole 125 kHz channel (centre +-62.5 kHz)
# must fit in one sub-band: 869.4625-869.5875 MHz there (RFC 0001 Amendment 3).
channel_hz = 869525000
max_hops = 2
scan_dwell_s = 60.0               # "find a quiet channel": listening time, split across channels
quiet_threshold_dbm = -105        # quiet: 90% of the noise readings at or below this

[modem]
port = "/dev/ttyACM0"             # the USB radio modem; empty = run without a radio
baudrate = 921600
ping_interval_s = 5.0

[api]
host = "0.0.0.0"
port = 8080
gm_token = ""                     # empty: generated on first start;
read_token = ""                   # show them with `python3 -m atalaia_controller tokens`
tls_port = 8443                   # HTTPS with the field's own CA (made on first start); 0 = off
tls_dir = ""                      # empty: the tls/ folder next to db_path
tls_names = []                    # the names and addresses phones use, e.g. ["10.42.0.1", "campo.local"]

[mqtt]
enabled = true
host = "localhost"
port = 1883
username = "controller"
password = ""

[join]
key = ""                          # the field join key (64 hex digits) that authenticates join
                                  # cards; empty: generated on first start. Give a standby
                                  # controller the same key. Show it with
                                  # `python3 -m atalaia_controller join-key`

[checkin]
# Field check-in (protocol/checkin.md). Players scan the poster printed from the
# GM console's Check-in tab; nothing needs the internet.
field_id = "field"                # the field's id (as in chrono records): 1-64 of A-Za-z0-9._:-
field_name = "Atalaia"            # shown to players
operator = ""                     # who runs the field: the data controller in the privacy notice
confirm = "auto"                  # or "staff": a marshal or the GM confirms each check-in
federation = "off"                # or "optional", "required": the federation number, never verified
federation_label = "FPA"
max_replicas = 5                  # per player and game
max_players = 300                 # per game
chrono_valid_for = "day"          # or "game"
rate_per_minute = 10              # check-ins per client address
urls = []                         # the poster's https addresses; empty: from tls_names and this host
wifi_ssid = ""                    # the field network's name on the poster
limit_template = "portugal"       # the class limits (app/lib/chrono/limit_templates/, unverified)
notice_version = 1                # raise it when the privacy notice changes
notice_pt = ""                    # your own notice files (Markdown); empty: controller/templates/
notice_en = ""
retention_days = 30               # names and federation numbers are erased this long after a game

[sync]
# The site server (phase 4; protocol/sync.md). The controller opens every
# connection and the game never waits for it: everything is in SQLite first.
enabled = false
url = ""                          # https://site.example.org (http:// only to this machine)
api_key = ""                      # or ATALAIA_SYNC_API_KEY, or: python3 -m atalaia_controller sync-key
ca_file = ""                      # a CA (PEM) to trust instead of the system's
interval_game_s = 30.0            # while a game runs
interval_idle_s = 300.0           # between games; failures double the wait up to this
timeout_s = 15.0                  # per request
# true: the site server's users with the gm role on this field see the live game and
# may start, pause, resume and end it, send GM messages and the game's declared mode
# commands, over a WebSocket this controller opens; every command is logged on both
# sides (plan phase 19). Off by default.
remote_gm = false
library = true                    # the field's scenario library and game presets from the site server,
                                  # installed (and checked again) on every controller of the field

[atak]
# Cursor on Target for ATAK (ADR-P4-7 as amended, P4R18; atak.py). Props and the
# extraction zone on ATAK maps, placed through the field image's georeference
# (the GM console's Field tab: two corners of the image with their latitude and
# longitude). Overridable as ATALAIA_ATAK_*.
enabled = false
multicast = "239.2.3.1:6969"      # UDP, props and zones only (TTL 1: the field's network);
                                  # a unicast host:port works too; empty: no UDP
interval_s = 30.0                 # every marker again this often; a capture goes at once
staff_endpoints = []              # staff ATAK devices, ["10.42.0.5:4242"] (TCP; 4242 if no port);
                                  # from the environment, separated by commas
players = false                   # player GPS positions, to staff_endpoints ONLY (never multicast)
