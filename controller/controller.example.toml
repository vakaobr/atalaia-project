#
# Atalaia field controller settings. Copy to controller.toml and run:
#   python3 -m atalaia_controller run --config controller.toml
# Every setting can also come from ATALAIA_<SECTION>_<KEY>, for example
# ATALAIA_API_GM_TOKEN or ATALAIA_MODEM_PORT.

[controller]
node_id = 0                       # this controller's short id on the radio
db_path = "/var/lib/atalaia/controller.db"
failover_mode = "manual"          # "auto" only after field testing (ADR-P2-8)
power_source = 3                  # 3 mains or USB, 2 large battery, 1 small battery
battery_pct = 100
storage_ok = true
persist_game_key = false          # true: the game survives a controller restart, but
                                  # the key is then on the Pi's disk (see README)

[radio]
# The field's channel until the GM chooses one in the console (Settings), which
# then wins. 869.525 MHz is the centre of 869.4-869.65 MHz, the only EU868
# sub-band with 10% duty cycle and 500 mW ERP; elsewhere in 868-870 MHz the
# limits are 1% (0.1% on 868.7-869.2) and 25 mW, and 868.1/868.3/868.5 MHz are
# LoRaWAN's busy default channels. The whole 125 kHz channel (centre +-62.5 kHz)
# must fit in one sub-band: 869.4625-869.5875 MHz there (RFC 0001 Amendment 3).
channel_hz = 869525000
max_hops = 2
scan_dwell_s = 60.0               # "find a quiet channel": listening time, split across channels
quiet_threshold_dbm = -105        # quiet: 90% of the noise readings at or below this

[modem]
port = "/dev/ttyACM0"             # the USB radio modem; empty = run without a radio
baudrate = 921600
ping_interval_s = 5.0

[api]
host = "0.0.0.0"
port = 8080
gm_token = ""                     # empty: generated on first start;
read_token = ""                   # show them with `python3 -m atalaia_controller tokens`

[mqtt]
enabled = true
host = "localhost"
port = 1883
username = "controller"
password = ""

[join]
key = ""                          # the field join key (64 hex digits) that authenticates join
                                  # cards; empty: generated on first start. Give a standby
                                  # controller the same key. Show it with
                                  # `python3 -m atalaia_controller join-key`
