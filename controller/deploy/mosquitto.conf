#
# Mosquitto for an Atalaia field (spec section 11): copy to
# /etc/mosquitto/conf.d/atalaia.conf and restart mosquitto.
#
# Three users, created with mosquitto_passwd:
#   controller   the field controller (publishes everything, reads cmd/)
#   gm           GM tools: may publish commands (the "GM token")
#   reader       scoreboards and spectators (the "read token")
#   sudo mosquitto_passwd -c /etc/mosquitto/atalaia.passwd controller
#   sudo mosquitto_passwd    /etc/mosquitto/atalaia.passwd gm
#   sudo mosquitto_passwd    /etc/mosquitto/atalaia.passwd reader

listener 1883
allow_anonymous false
password_file /etc/mosquitto/atalaia.passwd
acl_file /etc/mosquitto/atalaia.acl
