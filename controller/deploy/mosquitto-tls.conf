# Mosquitto over TLS for the field's network (security review FLD-5): copy to
# /etc/mosquitto/conf.d/atalaia-tls.conf, next to atalaia.conf (mosquitto.conf here), and restart mosquitto.
#
# The certificate is the controller's own server certificate, signed by the field CA that phones and posters
# already pin. The controller copies it (and never the CA's key) into a folder the broker can read:
#   sudo install -d -o atalaia -g mosquitto -m 2750 /var/lib/atalaia/mqtt-tls
#   # in /etc/atalaia/controller.toml:   [mqtt]  tls_export_dir = "/var/lib/atalaia/mqtt-tls"
#   sudo systemctl restart atalaia-controller      # makes the CA and the copy, then restart mosquitto
# Order matters on a new install: Mosquitto does not start with a certificate file missing, so install this
# file only after the controller has written the copy. A renewed server certificate (yearly, or new field
# addresses) is copied at the controller's next start; `sudo systemctl reload mosquitto` loads it.
# Clients trust the field CA alone (the console's Check-in tab and /api/v1/controller/ca give ca.pem), e.g.
#   mosquitto_sub --cafile ca.pem -h 10.42.0.1 -p 8883 -u reader -P <read token> -t 'field/v1/#'

listener 8883
cafile /var/lib/atalaia/mqtt-tls/ca.pem
certfile /var/lib/atalaia/mqtt-tls/server.pem
keyfile /var/lib/atalaia/mqtt-tls/server.key
tls_version tlsv1.2
