# The text of the registry's public page (tools/registry_page.py renders it from index.json when the
# registry is published). One page per language: English at the root, pt/, de/ and zh-tw/. The links
# are the same in every language. Texts are plain text: the script escapes them, so no HTML here.
# Every language has the same keys (registry/tests/test_registry_page.py); German and Traditional
# Chinese are AI drafts like the project page's, and wait for a native speaker's review.
