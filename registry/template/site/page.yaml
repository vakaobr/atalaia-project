    th_status: Status
    th_licence: Lizenz
    th_download: Download
    verified: verifiziert
    not_reviewed: nicht geprüft
    download: Paket
    signature: Signatur
    kind_mode: Modus
    kind_modifier: Modifikator
    kind_role: Rolle
    kind_scenario: Szenario
    submit_title: So reichst du einen Modus ein
    submit_text: >-
      Baue den Modus im visuellen Editor des Projekts (oder von Hand), schreibe seine Tests, erzeuge
      deinen eigenen Modus-Schlüssel und öffne einen Pull Request mit dem Quelltext des Modus, seinem
      signierten Paket und seiner Zeile in der index.json. Die Schritte stehen in CONTRIBUTING.md;
      wie die Registry funktioniert, die Prüfliste, Schlüssel und Moderation stehen in der
      Dokumentation des Projekts.
    submit_contributing: CONTRIBUTING.md
    submit_docs: So funktioniert die Registry
    submit_keys: Modus-Schlüssel
    verified_title: Was „verifiziert“ bedeutet
    verified_text: >-
      Jede Version trägt die Signatur ihrer Urheberschaft. Eine Version, die das Projekt geprüft hat,
      trägt zusätzlich die Signatur des Projekts, erstellt mit dem Registry-Schlüssel des Projekts
      über dasselbe Archiv: das ist das Verifiziert-Siegel. Field Boxes haben den Schlüssel des
      Projekts fest in der Firmware und nehmen deshalb nur verifizierte Modi. Ein nicht geprüfter
      Modus kann auf einem Feld-Controller installiert werden, dessen Spielleitung dem Schlüssel
      der Urheberschaft vertraut; die GM-Konsole weist darauf hin.
    use_title: Diese Registry auf einem Spielfeld nutzen
    use_text: >-
      Richte den Feld-Controller in der controller.toml auf den Index aus und trage den
      Registry-Schlüssel des Projekts (aus keys.json) als vertrauenswürdig ein. Der Controller prüft
      jedes Paket mit seinen eigenen Schlüsseln: Er muss weder dieser Seite noch dem Index vertrauen.
    use_note: >-
      Nur mit dem Schlüssel des Projekts bietet der Controller ausschließlich verifizierte Modi an.
      Füge den Schlüssel einer Urheberschaft hinzu, um deren noch nicht geprüfte Modi zu
      installieren. Ein Spielfeld ohne Internet kopiert den veröffentlichten Ordner auf einen
      USB-Stick und setzt index auf den Pfad seiner index.json.
    index_label: Der Index
    footer: >-
      Erzeugt aus index.json. Die Daten der Registry stehen unter CC0-1.0; jeder Modus hat seine
      eigene Lizenz.
  zh-tw:
    html_lang: zh-Hant-TW
    name: 繁體中文
    title: Atalaia 社群模式
    description: Atalaia 的社群遊戲模式登錄庫，每個模式都經簽署。Atalaia 是開放的生存遊戲與 milsim 遊戲系統。
    skip: 跳到內容
    project: Atalaia 專案頁面
    language: 語言
    lead: >-
      Atalaia 是開放的生存遊戲與 milsim 遊戲系統，這裡的遊戲模式由撰寫它們的人分享。
    what_title: 這是什麼
    what_text: >-
      這個模式登錄庫是存放經簽署模式套件的 Git 儲存庫。每個模式都以 pull request 送來，經自動檢查（簽章、原始碼是否就是被簽署的內容、授權條款、在模擬器中的測試），再由人審閱。下方內容在發布時由登錄庫的 index.json 產生。
    modes_title: 模式
    modes_empty: 目前還沒有模式。來分享第一個吧。
    modes_empty_link: 如何提交模式
    by: 作者：
    unknown_author: 作者不詳
    th_version: 版本
    th_status: 狀態
    th_licence: 授權
    th_download: 下載
    verified: 已驗證
    not_reviewed: 未審閱
    download: 套件
    signature: 簽章
    kind_mode: 模式
    kind_modifier: 修飾項
    kind_role: 角色
    kind_scenario: 劇本
    submit_title: 如何提交模式
    submit_text: >-
      用專案的視覺化編輯器（或手寫）做出模式，寫好測試，產生你自己的模式金鑰，然後開一個 pull request，加入模式的原始碼、它的簽署套件，以及它在 index.json 中的一行。步驟寫在 CONTRIBUTING.md；登錄庫如何運作、審閱檢查清單、金鑰和管理規則都在專案文件中。
    submit_contributing: CONTRIBUTING.md
    submit_docs: 登錄庫如何運作
    submit_keys: 模式金鑰
    verified_title: 「已驗證」是什麼意思
    verified_text: >-
      每個版本都帶有作者的簽章，說明它是誰做的。專案審閱過的版本還帶有專案的簽章，由專案的登錄庫金鑰對同一個壓縮檔簽署，這就是已驗證徽章。Field Box 的韌體內建專案的金鑰，所以只接受已驗證的模式。未審閱的模式，只要主辦選擇信任作者的金鑰，仍可安裝在場地控制器上，GM 控制台會標示出來。
    use_title: 在場地使用這個登錄庫
    use_text: >-
      在 controller.toml 中把場地控制器指向這個索引，並把專案的登錄庫金鑰（取自 keys.json）列為信任。控制器用自己的金鑰檢查每個套件，完全不需要信任這個頁面或索引。
    use_note: >-
      只信任專案金鑰時，控制器只提供已驗證的模式。加入某位作者的金鑰，就能安裝那位作者尚未審閱的模式。沒有網路的場地可把發布的資料夾複製到 USB 隨身碟，並把 index 設為其 index.json 的路徑。
    index_label: 索引
    footer: >-
      由 index.json 產生。登錄庫的資料採用 CC0-1.0；每個模式有自己的授權。
