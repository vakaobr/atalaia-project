    signature: assinatura
    kind_mode: modo
    kind_modifier: modificador
    kind_role: função
    kind_scenario: cenário
    submit_title: Como submeter um modo
    submit_text: >-
      Faz o modo no editor visual do projeto (ou à mão), escreve os testes, cria a tua chave de modo
      e abre um pedido de integração com o código-fonte do modo, o pacote assinado e a linha no
      index.json. Os passos estão no CONTRIBUTING.md; como o registo funciona, a lista de revisão, as
      chaves e a moderação estão na documentação do projeto.
    submit_contributing: CONTRIBUTING.md
    submit_docs: Como o registo funciona
    submit_keys: Chaves de modo
    verified_title: O que quer dizer «verificado»
    verified_text: >-
      Cada versão leva a assinatura de quem a fez. Uma versão que o projeto reviu leva também a
      assinatura do projeto, feita com a chave do registo do projeto sobre o mesmo arquivo: é o
      selo de verificado. As Field Box têm a chave do projeto no firmware, por isso só aceitam
      modos verificados. Um modo que não foi revisto pode ser instalado num controlador de campo cuja
      organização escolheu confiar na chave da autoria, e a consola da organização di-lo.
    use_title: Usar este registo num campo
    use_text: >-
      Aponta o controlador de campo para o índice no controller.toml e indica a chave do registo do
      projeto (do keys.json) como de confiança. O controlador verifica cada pacote com as suas
      próprias chaves: nunca precisa de confiar nesta página nem no índice.
    use_note: >-
      Só com a chave do projeto, o controlador oferece apenas modos verificados. Junta a chave de uma
      autoria para instalar os modos dela que ainda não foram revistos. Um campo sem internet copia a
      pasta publicada para uma pen USB e põe o index no caminho do seu index.json.
    index_label: O índice
    footer: >-
      Gerado a partir do index.json. Os dados do registo são CC0-1.0; cada modo tem a sua licença.
  de:
    html_lang: de
    name: Deutsch
    title: Atalaia-Community-Modi
    description: Die Registry signierter Community-Spielmodi für Atalaia, das offene Spielsystem für Airsoft und Milsim.
    skip: Zum Inhalt springen
    project: Atalaia-Projektseite
    language: Sprache
    lead: >-
      Spielmodi für Atalaia, das offene Spielsystem für Airsoft und Milsim, geteilt von denen, die
      sie geschrieben haben.
    what_title: Was das ist
    what_text: >-
      Diese Registry ist ein Git-Repository signierter Modus-Pakete. Jeder Modus kommt als Pull
      Request, wird automatisch geprüft (Signatur, ob der Quelltext dem Signierten entspricht,
      Lizenz, Tests im Simulator) und von einem Menschen begutachtet. Was unten steht, wird beim
      Veröffentlichen aus der index.json der Registry erzeugt.
    modes_title: Modi
    modes_empty: Noch keine Modi. Teile als Erste oder Erster einen.
    modes_empty_link: So reichst du einen Modus ein
