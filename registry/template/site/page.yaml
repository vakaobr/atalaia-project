languages:
  en:
    html_lang: en
    name: English
    title: Atalaia community modes
    description: The registry of signed community game modes for Atalaia, the open airsoft and milsim game system.
    skip: Skip to content
    project: Atalaia project page
    language: Language
    lead: >-
      Game modes for Atalaia, the open airsoft and milsim game system, shared by the people who
      wrote them.
    what_title: What this is
    what_text: >-
      This registry is a Git repository of signed mode packages. Every mode arrives as a pull
      request, is checked automatically (its signature, that its source is what was signed, its
      licence, its tests in the simulator) and reviewed by a person. What you see below is built
      from the registry's index.json when it is published.
    modes_title: Modes
    modes_empty: No modes yet. Be the first to share one.
    modes_empty_link: How to submit a mode
    by: by
    unknown_author: unknown author
    th_version: Version
    th_status: Status
    th_licence: Licence
    th_download: Download
    verified: verified
    not_reviewed: not reviewed
    download: package
    signature: signature
    kind_mode: mode
    kind_modifier: modifier
    kind_role: role
    kind_scenario: scenario
    submit_title: How to submit a mode
    submit_text: >-
      Build the mode in the project's visual editor (or by hand), write its tests, make your own
      mode key, then open a pull request adding your mode's source, its signed package and its line
      in index.json. The steps are in CONTRIBUTING.md; how the registry works, the review checklist,
      keys and moderation are in the project's documentation.
    submit_contributing: CONTRIBUTING.md
    submit_docs: How the registry works
    submit_keys: Mode keys
    verified_title: What "verified" means
    verified_text: >-
      Every version carries its author's signature: it tells you who made it. A version the project
      has reviewed also carries the project's signature, made with the project's registry key over
      the same archive: that is the verified badge. Field Boxes have the project's key built into
      their firmware, so they take verified modes only. A mode that is not reviewed can still be
      installed on a field controller whose operator chose to trust its author's key, and the GM
      console says so.
    use_title: Using this registry on a field
    use_text: >-
      Point your field controller at the index in controller.toml, and list the project's registry
      key (from keys.json) as trusted. The controller checks every package with its own keys: it
      never has to trust this page or the index.
    use_note: >-
      With only the project's key, the controller offers verified modes only. Add an author's key to
      install that author's modes that are not reviewed yet. A field without internet copies the
      published folder to a USB stick and sets index to the path of its index.json.
    index_label: The index
    footer: >-
      Built from index.json. The registry's data is CC0-1.0; every mode has its own licence.
  pt:
