    what_title: O que é isto
    what_text: >-
      Este registo é um repositório Git de pacotes de modos assinados. Cada modo chega num pedido de
      integração, é verificado automaticamente (a assinatura, que o código-fonte é o que foi
      assinado, a licença, os testes no simulador) e revisto por uma pessoa. O que vês abaixo é
      gerado a partir do index.json do registo quando é publicado.
    modes_title: Modos
    modes_empty: Ainda não há modos. Sê a primeira pessoa a partilhar um.
    modes_empty_link: Como submeter um modo
    by: por
    unknown_author: autoria desconhecida
