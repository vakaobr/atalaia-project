#
# The game is over. Data from node.lua: owner (the team on the hill at the
# end, absent when none) and points (its points on this box); lang from the box.
template: final_score
layout:
  - type: row
    style: { width: fill, height: 44, background: panel }
    children:
      - type: label
        text: "{lang == 'pt' && 'FIM DO JOGO' || lang == 'de' && 'SPIEL VORBEI' || lang == 'zh-tw' && '遊戲結束' || 'GAME OVER'}"
        style: { font_size: 20, width: fill, align: center }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'A colina ficou com' || lang == 'de' && 'Der Hügel ging an' || lang == 'zh-tw' && '山頭最後由此隊佔領' || 'The hill was held by'}"
    style: { font_size: 20, color: muted, visible: "{owner}" }
  # A colour can be an expression: here the owner's team colour.
  - type: label
    text: "{owner|upper}"
    style: { font_size: 48, color: "{owner}", visible: "{owner}" }
  - type: label
    text: "{points} {lang == 'pt' && 'pontos nesta caixa' || lang == 'de' && 'Punkte auf dieser Box' || lang == 'zh-tw' && '分（這個盒子）' || 'points on this box'}"
    style: { font_size: 20, visible: "{owner}" }
  - type: label
    text: "{lang == 'pt' && 'Ninguém tomou a colina' || lang == 'de' && 'Kein Team hielt den Hügel' || lang == 'zh-tw' && '沒有隊伍佔領山頭' || 'No team took the hill'}"
    style: { font_size: 20, color: muted, visible: "{!owner}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Pontuações finais' || lang == 'de' && 'Endstand' || lang == 'zh-tw' && '最終分數' || 'Scores are final'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
