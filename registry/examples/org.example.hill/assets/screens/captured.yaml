#
# A team owns the hill. Data from node.lua: team (the owner), points (its
# points on this box), since (game time it took the hill, in seconds), and
# taker and progress while another team holds its button; lang from the box.
template: captured
layout:
  # `background: team` paints the bar in the owner's colour; `contrast` picks
  # black or white text, whichever reads on it.
  - type: row
    style: { width: fill, height: 44, background: team }
    children:
      - type: label
        text: "{lang == 'pt' && 'REI DA COLINA' || 'KING OF THE HILL'}"
        style: { font_size: 20, width: fill, align: center, color: contrast }
  - type: spacer
    height: fill
  - type: label
    text: "{team|upper}"
    style: { font_size: 48, color: team }
  - type: label
    text: "{points} {lang == 'pt' && 'pontos nesta caixa' || 'points on this box'}"
    style: { font_size: 20 }
  # |clock shows seconds as M:SS.
  - type: label
    text: "{lang == 'pt' && 'desde' || 'held since'} {since|clock}"
    style: { font_size: 14, color: muted, visible: "{!taker}" }
  - type: label
    text: "{lang == 'pt' && 'A tomar:' || 'Taking:'} {taker|upper}"
    style: { font_size: 14, color: "{taker}", visible: "{taker}" }
  - type: progress_bar
    value: "{progress}"
    style: { width: 220, height: 12, color: "{taker}", visible: "{taker}" }
  - type: spacer
    height: fill
  - type: label
    text: "{lang == 'pt' && 'Mantém o botão premido para a tomar' || 'Hold your button to take it'}"
    style:
      font_size: 14
      color: muted
      padding: { bottom: 10 }
